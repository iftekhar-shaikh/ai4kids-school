function award(key,n){if(awarded[key])return;awarded[key]=true;stars+=(n||1);$("starCount").textContent=String(stars)}
function recountStars(){stars=0;Object.keys(awarded).forEach(function(k){stars+=(k.indexOf("mode-")===0)?2:1});$("starCount").textContent=String(stars)}
function markWin(prefix,id,doneMap,modeKey,total){if(doneMap[id])return;doneMap[id]=true;award(prefix+"-"+id,1);if(Object.keys(doneMap).length>=total){doneModes[modeKey]=true;award("mode-"+modeKey,2)}tabBadges()}
function skyHTML(){return '<div class="sky-layer"><div class="sun-ball"></div><div class="cloud c1"></div><div class="cloud c2"></div></div>'}
function prepScene(){var pad=$("scenePad");pad.innerHTML=skyHTML();var stage=document.createElement("div");stage.className="num-stage";pad.appendChild(stage);return stage}
function addBlurb(stage,ch){var em=document.createElement("div");em.className="hero-em";em.textContent=ch.em||"🔢";stage.appendChild(em);var box=document.createElement("div");box.className="card-box";setText(box,t(ch.blurb));stage.appendChild(box)}
function addHero(stage,n){var h=document.createElement("div");h.className="num-hero";h.textContent=fmt(n);stage.appendChild(h)}
function addCap(stage,msg){var c=document.createElement("div");c.className="capline";setText(c,msg);stage.appendChild(c)}
function showStep(i,n){setText($("statechip"),(i+1)+" / "+n);$("statechip").className="statechip"+(lang==="ur"?" ur":"")}
function showWin(msg){setText($("headline"),msg);$("statechip").className="statechip win"+(lang==="ur"?" ur":"");setText($("statechip"),t(T.nice))}
function showMiss(){setText($("headline"),t(T.oops));$("statechip").className="statechip miss"+(lang==="ur"?" ur":"");setText($("statechip"),t(T.oops))}
function stableOrder(key,arr){if(optKey!==key){optKey=key;optOrder=shuffle(arr)}return optOrder}
function clearHint(){$("hintbox").classList.remove("show")}
function ruleTag(by){return '<span class="rule-tag">÷ '+by+'</span>'}

function renderDiv(){
  var ch=DIV[divIdx],stage=prepScene();addBlurb(stage,ch);addHero(stage,ch.n);
  var tag=document.createElement("div");tag.innerHTML=ruleTag(ch.by);stage.appendChild(tag);
  addCap(stage,lang==="en"?"Use the divisibility rule. Yes or No.":"قابلِ تقسیم کا قاعدہ استعمال کرو۔ ہاں یا نہیں۔");
  showStep(divIdx,DIV.length);setText($("headline"),t(ch.title));
  setText($("detail"),divDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(divDone[ch.id])showWin(t(ch.done));
  var box=$("actionBox");box.innerHTML="";
  var row=document.createElement("div");row.className="yn-row";
  [{v:true,lab:T.yes},{v:false,lab:T.no}].forEach(function(opt){
    var b=document.createElement("button");b.type="button";b.className="yn-chip";setText(b,t(opt.lab));
    if(divDone[ch.id]&&opt.v===ch.answer)b.classList.add("right");
    b.disabled=!!divDone[ch.id];
    b.addEventListener("click",function(){
      if(divDone[ch.id])return;
      if(opt.v===ch.answer){markWin("div",ch.id,divDone,"div",DIV.length);renderDiv()}
      else{b.classList.add("wrong");showMiss()}
    });
    row.appendChild(b);
  });
  box.appendChild(row);
  setText($("prog"),t(T.progDiv)+": "+Object.keys(divDone).length+"/"+DIV.length);
}

function sameSet(a,b){if(a.length!==b.length)return false;var sa=a.slice().sort(),sb=b.slice().sort(),i;for(i=0;i<sa.length;i++)if(String(sa[i])!==String(sb[i]))return false;return true}
function renderFac(){
  var ch=FAC[facIdx],stage=prepScene();addBlurb(stage,ch);
  if(ch.kind==="pairs"){addHero(stage,ch.n);addCap(stage,lang==="en"?"Factor pairs: small × big = "+ch.n:"عامل جوڑے: چھوٹا × بڑا = "+ch.n)}
  else if(ch.kind==="multiples"){addHero(stage,ch.n);addCap(stage,lang==="en"?"Multiples of "+ch.n:ch.n+" کے مضارب")}
  else if(ch.kind==="commonFac"){var eq=document.createElement("div");eq.className="eqline";eq.textContent=fmt(ch.n1)+"  &  "+fmt(ch.n2);stage.appendChild(eq);addCap(stage,lang==="en"?"Common factors of both":"دونوں کے مشترک عوامل")}
  else{var eq2=document.createElement("div");eq2.className="eqline";eq2.textContent=fmt(ch.n1)+"  &  "+fmt(ch.n2);stage.appendChild(eq2);addCap(stage,lang==="en"?"Common multiples":"مشترک مضارب")}
  showStep(facIdx,FAC.length);setText($("headline"),t(ch.title));
  setText($("detail"),facDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(facDone[ch.id])showWin(t(ch.done));
  var box=$("actionBox");box.innerHTML="";
  if(!facPicked[ch.id])facPicked[ch.id]=[];
  var picked=facPicked[ch.id];
  var bank=document.createElement("div");bank.className="bank ltrb";
  var items,want;
  if(ch.kind==="pairs"){
    if(optKey!=="fac-"+ch.id){optKey="fac-"+ch.id;optOrder=shuffle(ch.pairs.concat(ch.traps))}
    items=optOrder;want=ch.pairs;
  }else{
    if(optKey!=="fac-"+ch.id){optKey="fac-"+ch.id;optOrder=shuffle(ch.opts.slice())}
    items=optOrder;want=ch.want.map(String);
  }
  items.forEach(function(item){
    var key=String(item);
    var isWant=want.indexOf(key)>=0||(ch.kind==="pairs"&&want.indexOf(item)>=0);
    var isPicked=picked.indexOf(key)>=0;
    var b=document.createElement("button");b.type="button";b.className="mini-item dig";
    b.textContent=key;b.setAttribute("dir","ltr");
    if(facDone[ch.id]&&isWant)b.classList.add("right");
    if(isPicked&&!facDone[ch.id])b.classList.add("right");
    if(isPicked)b.classList.add("used");
    b.disabled=!!facDone[ch.id]||isPicked;
    b.addEventListener("click",function(){
      if(facDone[ch.id]||isPicked)return;
      if(isWant||(ch.kind==="pairs"&&ch.pairs.indexOf(item)>=0)){
        picked.push(key);
        var need=(ch.kind==="pairs")?ch.pairs:ch.want.map(String);
        if(sameSet(picked,need)){markWin("fac",ch.id,facDone,"fac",FAC.length)}
        renderFac();
      }else{b.classList.add("wrong");showMiss()}
    });
    bank.appendChild(b);
  });
  box.appendChild(bank);
  setText($("prog"),t(T.progFac)+": "+Object.keys(facDone).length+"/"+FAC.length);
}

function renderPrime(){
  var ch=PRIME[primeIdx],stage=prepScene();addBlurb(stage,ch);addHero(stage,ch.n);
  addCap(stage,lang==="en"?"Exactly two factors → prime. More → composite.":"بالکل دو عوامل → مفرد۔ زیادہ → مرکب۔");
  showStep(primeIdx,PRIME.length);setText($("headline"),t(ch.title));
  setText($("detail"),primeDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(primeDone[ch.id])showWin(t(ch.done));
  var box=$("actionBox");box.innerHTML="";
  var row=document.createElement("div");row.className="yn-row";
  [{v:"prime",lab:T.primeLab},{v:"composite",lab:T.compLab}].forEach(function(opt){
    var b=document.createElement("button");b.type="button";b.className="yn-chip";setText(b,t(opt.lab));
    if(primeDone[ch.id]&&opt.v===ch.answer)b.classList.add("right");
    b.disabled=!!primeDone[ch.id];
    b.addEventListener("click",function(){
      if(primeDone[ch.id])return;
      if(opt.v===ch.answer){markWin("prime",ch.id,primeDone,"prime",PRIME.length);renderPrime()}
      else{b.classList.add("wrong");showMiss()}
    });
    row.appendChild(b);
  });
  box.appendChild(row);
  setText($("prog"),t(T.progPrime)+": "+Object.keys(primeDone).length+"/"+PRIME.length);
}

function pickQuiz(){
  var pin=[],rest=[],i;quizState={};
  for(i=0;i<QUIZ.length;i++){if(QUIZ[i].pin)pin.push(QUIZ[i]);else rest.push(QUIZ[i])}
  rest=shuffle(rest);quizSet=shuffle(pin.concat(rest.slice(0,5-pin.length)));
}
function renderQuiz(){
  var box=$("quizBox");box.innerHTML="";
  quizSet.forEach(function(item,qi){
    var wrap=document.createElement("div");wrap.className="q";
    var p=document.createElement("p");setText(p,(qi+1)+". "+t(item.q));wrap.appendChild(p);
    if(lang==="en"&&item.ru){var g=document.createElement("p");g.className="gloss";g.textContent=item.ru;wrap.appendChild(g)}
    var st=quizState[item.id];
    item.opts.forEach(function(opt,oi){
      var b=document.createElement("button");b.type="button";b.className="opt"+(lang==="ur"?" ur":"");setText(b,t(opt));
      if(st&&oi===item.correct)b.classList.add("right");
      if(st==="no"&&quizState[item.id+"-pick"]===oi&&oi!==item.correct)b.classList.add("wrong");
      if(st)b.disabled=true;
      b.addEventListener("click",function(){
        if(quizState[item.id])return;
        quizState[item.id+"-pick"]=oi;
        if(oi===item.correct){quizState[item.id]="ok";b.classList.add("right");award("quiz-"+item.id,1)}
        else{quizState[item.id]="no";b.classList.add("wrong");var kids=wrap.querySelectorAll(".opt");if(kids[item.correct])kids[item.correct].classList.add("right")}
        fb.classList.add("show");
        var all=wrap.querySelectorAll(".opt"),k;for(k=0;k<all.length;k++)all[k].disabled=true;
      });
      wrap.appendChild(b);
    });
    var fb=document.createElement("p");fb.className="fb"+(st?" show":"");setText(fb,t(item.why));wrap.appendChild(fb);
    box.appendChild(wrap);
  });
}
function storyHtml(){if(mode==="div")return t(T.storyDiv);if(mode==="fac")return t(T.storyFac);return t(T.storyPrime)}
function currentTip(){if(mode==="div")return T.tipDiv;if(mode==="fac")return T.tipFac;return T.tipPrime}
function tabBadges(){
  function lab(btn,label,key){btn.innerHTML="";var span=document.createElement("span");setText(span,t(label));btn.appendChild(span);if(doneModes[key]){var b=document.createElement("span");b.className="badge";b.textContent=" ★";btn.appendChild(b)}}
  lab($("tabDiv"),T.tabDiv,"div");lab($("tabFac"),T.tabFac,"fac");lab($("tabPrime"),T.tabPrime,"prime");
  $("tabDiv").setAttribute("aria-pressed",mode==="div"?"true":"false");
  $("tabFac").setAttribute("aria-pressed",mode==="fac"?"true":"false");
  $("tabPrime").setAttribute("aria-pressed",mode==="prime"?"true":"false");
}
function renderCurrent(){if(mode==="div")renderDiv();else if(mode==="fac")renderFac();else renderPrime()}
function setMode(m){mode=m;optKey="";renderCurrent();applyChrome()}
function applyChrome(){
  setText($("title"),t(T.title));setText($("subtitle"),t(T.sub));
  $("story").innerHTML=storyHtml();$("story").classList.toggle("ur",lang==="ur");$("story").setAttribute("dir",lang==="ur"?"rtl":"ltr");
  setText($("ctlHead"),t(T.ctl));setText($("nextBtn"),t(T.next));setText($("hintBtn"),t(T.hint));setText($("resetBtn"),t(T.reset));
  setText($("quizHead"),t(T.quiz));setText($("newQuiz"),t(T.newQuiz));
  $("langBtn").textContent=(lang==="en")?"اردو":"EN";$("langBtn").setAttribute("aria-pressed",lang==="ur"?"true":"false");
  document.body.classList.toggle("urdu",lang==="ur");
  document.documentElement.lang=(lang==="ur")?"ur":"en";
  document.documentElement.dir=(lang==="ur")?"rtl":"ltr";
  document.title=t(T.title)+" | AI4Kids Class 4";
  tabBadges();
  var foot=document.querySelector("footer p");
  if(foot)setText(foot,foot.getAttribute(lang==="ur"?"data-ur":"data-en"));
}
function applyLang(){applyChrome();renderCurrent();renderQuiz()}
function next(){
  optKey="";
  if(mode==="div"){divIdx=(divIdx+1)%DIV.length;renderDiv()}
  else if(mode==="fac"){facIdx=(facIdx+1)%FAC.length;renderFac()}
  else{primeIdx=(primeIdx+1)%PRIME.length;renderPrime()}
}
function showHint(){
  var h=mode==="div"?DIV[divIdx].hint:(mode==="fac"?FAC[facIdx].hint:PRIME[primeIdx].hint);
  var hb=$("hintbox");setText(hb,t(h));hb.classList.add("show");
}
function resetMode(){
  if(mode==="div"){Object.keys(awarded).forEach(function(k){if(k.indexOf("div-")===0||k==="mode-div")delete awarded[k]});divDone={};divIdx=0;doneModes.div=false;recountStars();renderDiv()}
  else if(mode==="fac"){Object.keys(awarded).forEach(function(k){if(k.indexOf("fac-")===0||k==="mode-fac")delete awarded[k]});facDone={};facPicked={};facIdx=0;doneModes.fac=false;recountStars();renderFac()}
  else{Object.keys(awarded).forEach(function(k){if(k.indexOf("prime-")===0||k==="mode-prime")delete awarded[k]});primeDone={};primeIdx=0;doneModes.prime=false;recountStars();renderPrime()}
  optKey="";tabBadges();applyChrome();
}
function cleanSpeakText(s){return String(s||"").replace(/<[^>]+>/g," ").replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&amp;/g,"&").replace(/\s+/g," ").trim()}
function buildSpeakText(){
  var bits=[];bits.push(t(T.title));bits.push(cleanSpeakText(storyHtml()));
  bits.push(cleanSpeakText(($("headline")&&$("headline").textContent)||""));
  bits.push(cleanSpeakText(($("detail")&&$("detail").textContent)||""));
  bits.push(t(currentTip()));return bits.filter(Boolean).join(". ");
}
function pickVoice(voices,want){
  var i,v,L;for(i=0;i<voices.length;i++){v=voices[i];L=(v.lang||"").toLowerCase().replace("_","-");if(L.indexOf(want)===0)return v}
  for(i=0;i<voices.length;i++){v=voices[i];L=(v.lang||"").toLowerCase().replace("_","-");if(L.indexOf("en")===0)return v}
  return voices[0]||null;
}
function setSpeaking(on){var btn=$("speakBtn");if(!btn)return;btn.setAttribute("aria-pressed",on?"true":"false");btn.style.opacity=on?"0.65":""}
function doSpeak(text,asLang){
  var u=new SpeechSynthesisUtterance(text);u.rate=0.92;u.lang=(asLang==="ur")?"ur-PK":"en-US";
  var voices=window.speechSynthesis.getVoices()||[];var voice=pickVoice(voices,asLang==="ur"?"ur":"en");if(voice)u.voice=voice;
  u.onstart=function(){setSpeaking(true)};u.onend=function(){setSpeaking(false)};
  u.onerror=function(){setSpeaking(false);if(asLang==="ur"){var fallback=cleanSpeakText(T.title.en+". "+T.storyDiv.en+". "+T.tipDiv.en);var u2=new SpeechSynthesisUtterance(fallback);u2.lang="en-US";u2.rate=0.92;var v2=pickVoice(window.speechSynthesis.getVoices()||[],"en");if(v2)u2.voice=v2;u2.onstart=function(){setSpeaking(true)};u2.onend=u2.onerror=function(){setSpeaking(false)};window.speechSynthesis.speak(u2)}};
  window.speechSynthesis.speak(u);
}
if("speechSynthesis" in window){
  try{window.speechSynthesis.getVoices()}catch(e0){}
  if(typeof window.speechSynthesis.addEventListener==="function"){window.speechSynthesis.addEventListener("voiceschanged",function(){try{window.speechSynthesis.getVoices()}catch(e1){}})}
}else{var noBtn=$("speakBtn");if(noBtn){noBtn.disabled=true;noBtn.title="Voice not available on this device"}}
$("langBtn").addEventListener("click",function(){lang=(lang==="en")?"ur":"en";applyLang()});
$("tabDiv").addEventListener("click",function(){setMode("div")});
$("tabFac").addEventListener("click",function(){setMode("fac")});
$("tabPrime").addEventListener("click",function(){setMode("prime")});
$("nextBtn").addEventListener("click",next);
$("hintBtn").addEventListener("click",showHint);
$("resetBtn").addEventListener("click",resetMode);
$("newQuiz").addEventListener("click",function(){pickQuiz();renderQuiz()});
$("speakBtn").addEventListener("click",function(){
  try{
    if(!("speechSynthesis" in window))return;
    var text=buildSpeakText();if(!text)return;
    if(speakTimer){clearTimeout(speakTimer);speakTimer=null}
    window.speechSynthesis.cancel();setSpeaking(false);
    var speakLang=lang;
    speakTimer=setTimeout(function(){speakTimer=null;doSpeak(text,speakLang)},80);
  }catch(e){setSpeaking(false)}
});
pickQuiz();applyLang();
})();
</script>
</body>
