<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All Tenses — تینوں زمانے | AI4Kids Class 5 English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#f1eee9;
    --board-deep:#e3ded6;
    --past:#a8632e;
    --past-deep:#7d4720;
    --now:#2e7d55;
    --now-deep:#1d5a3c;
    --fut:#3a5ea8;
    --fut-deep:#26417a;
    --ink:#241f1a;
    --ink-soft:#544c42;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#6b4a8f;
    --ok:#2e7d4f;
    --no:#c4453a;

    --fs-cap:clamp(15px, 3.9vw, 16px);
    --fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.7vw, 19px);
    --fs-md:clamp(19px, 5.1vw, 21px);
    --fs-lg:clamp(22px, 5.9vw, 25px);
    --fs-xl:clamp(28px, 7.6vw, 34px);
    --lh:1.5;
  }
  /* Urdu is set larger than Latin — Nastaliq reads smaller at the same size. */
  body.urdu{
    --fs-cap:clamp(17px, 4.4vw, 18px);
    --fs-xs:clamp(18px, 4.7vw, 20px);
    --fs-sm:clamp(20px, 5.2vw, 22px);
    --fs-md:clamp(21px, 5.6vw, 23px);
    --fs-lg:clamp(24px, 6.4vw, 27px);
    --fs-xl:clamp(27px, 7.2vw, 32px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .tabs{display:flex;gap:7px;margin:0 0 14px}
  .tabs button{
    flex:1;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:54px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  }
  .scene svg{display:block;width:100%;height:auto}
  .mark{transition:opacity .3s ease}

  /* the 2 x 3 grid of tenses */
  .matrix{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px;margin-top:12px}
  .mh{display:flex;align-items:center;justify-content:center;font-size:var(--fs-cap);
      font-weight:800;color:var(--ink-soft);padding:4px 2px;text-align:center}
  .mh.p{color:var(--past-deep)} .mh.n{color:var(--now-deep)} .mh.f{color:var(--fut-deep)}
  .mrow{display:flex;align-items:center;font-size:var(--fs-cap);font-weight:800;
        color:var(--ink-soft);padding-right:4px}
  .cell{
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:9px 4px;font:inherit;font-size:var(--fs-cap);font-weight:700;color:var(--ink);
    cursor:pointer;min-height:56px;line-height:1.25;
  }
  .cell[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .cell.p[aria-pressed="true"]{background:var(--past);border-color:var(--past)}
  .cell.n[aria-pressed="true"]{background:var(--now);border-color:var(--now)}
  .cell.f[aria-pressed="true"]{background:var(--fut);border-color:var(--fut)}

  .readout{
    margin-top:14px;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.ok{background:var(--ok)} .statechip.no{background:var(--no)}
  .eng{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.4;direction:ltr}
  .eng u{text-decoration:none;background:#ffe9b8;border-radius:5px;padding:1px 4px;
         box-shadow:inset 0 -2px 0 #e8b23d}
  .urdu{margin:0 0 4px;font-size:var(--fs-sm);color:var(--ink)}
  .formula{
    margin:12px 0 0;border:2px dashed var(--accent);border-radius:14px;padding:11px 13px;
    font-size:var(--fs-sm);font-weight:800;color:var(--accent);text-align:center;direction:ltr;
  }
  .detail{margin:10px 0 0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}
  body.urdu .why-note{
    border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;
    line-height:var(--lh);
  }
  .trap{
    margin:12px 0 0;border:2px dashed var(--no);border-radius:14px;padding:11px 13px;
    font-size:var(--fs-xs);color:var(--no);font-weight:700;line-height:1.55;
  }
  body.urdu .trap{line-height:var(--lh)}
  .trap .x{direction:ltr;display:inline-block;font-weight:800}

  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 9px;color:var(--ink-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .schip{
    border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;
    font:inherit;font-size:var(--fs-cap);font-weight:700;color:var(--ink);cursor:pointer;min-height:44px;
  }
  .schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .schip.done{border-color:var(--ok)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--no);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "quiz quiz" "foot foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <span class="brand">AI4Kids · Class 5 English</span>
    <button class="chip" id="langBtn" aria-pressed="false">اردو</button>
    <button class="chip" id="speakBtn" aria-label="Sunlo">🔊</button>
  </div>

  <div class="head">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  </div>

  <div class="tabs" role="group">
    <button type="button" id="tabLine" aria-pressed="true"></button>
    <button type="button" id="tabMake" aria-pressed="false"></button>
    <button type="button" id="tabSpot" aria-pressed="false"></button>
  </div>

  <div class="left">
  <div class="scene">
    <svg viewBox="0 0 340 190" role="img" id="svg" aria-label="A timeline showing where the action happens"></svg>
  </div>

  <div class="readout">
    <span class="statechip" id="statechip"></span>
    <p class="eng" id="eng"></p>
    <p class="urdu" id="urdu"></p>
    <p class="formula" id="formula"></p>
    <p class="detail" id="detail"></p>
    <p class="trap" id="trap"></p>
    <p class="why-note"><b id="whyLbl"></b> <span id="whyText"></span></p>
  </div>
  </div>

  <div class="right">
  <div class="panel" id="gridPanel">
    <h2 id="gridHead"></h2>
    <div class="matrix" id="matrix"></div>
  </div>

  <div class="panel" id="makePanel">
    <h2 id="subjHead"></h2>
    <div class="chips" id="subjChips" role="group"></div>
    <h2 id="verbHead"></h2>
    <div class="chips" id="verbChips" role="group"></div>
  </div>

  <div class="panel" id="spotPanel">
    <h2 id="spotHead"></h2>
    <div class="chips" id="spotChips" role="group"></div>
  </div>
  </div>

  <div class="quiz">
    <h2 id="quizHead" style="font-size:var(--fs-lg);font-weight:800;margin:0 0 18px"></h2>
    <div id="quizBox"></div>
  </div>

  <footer>
    <p data-en="AI4Kids — Islamabad's bilingual AI and coding school. WhatsApp 0337 1468899" data-ur="اے آئی فور کڈز — اسلام آباد کا دو زبانوں والا اے آئی اور کوڈنگ سکول۔ واٹس ایپ 0337 1468899"></p>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var lang = "en";
  var tab  = "line";
  var when = "now", form = "simple";     // which cell of the grid
  var subjI = 1, verbI = 0;
  var spotI = 0, spotAns = null;
  var solved = {};

  var SUBJ = [
    { w:"I",    ur:"میں", s:false, be:"am",  bePast:"was"  },
    { w:"He",   ur:"وہ",  s:true,  be:"is",  bePast:"was"  },
    { w:"We",   ur:"ہم",  s:false, be:"are", bePast:"were" },
    { w:"They", ur:"وہ (جمع)", s:false, be:"are", bePast:"were" }
  ];
  var VERBS = [
    { base:"play",  past:"played", ing:"playing", obj:"cricket",   ur:"کھیلنا" },
    { base:"eat",   past:"ate",    ing:"eating",  obj:"biryani",   ur:"کھانا"  },
    { base:"go",    past:"went",   ing:"going",   obj:"to school", ur:"جانا"   },
    { base:"write", past:"wrote",  ing:"writing", obj:"a letter",  ur:"لکھنا"  }
  ];
  function thirdS(v){                       // he plays, he goes, he writes
    if (/(ch|sh|s|x|o)$/.test(v)) return v + "es";
    return v + "s";
  }

  function build(si, vi, when, form){
    var s = SUBJ[si], v = VERBS[vi], head, tail, hl;
    if (form === "simple"){
      if (when === "past"){ head = s.w; hl = v.past; tail = ""; }
      else if (when === "now"){ head = s.w; hl = s.s ? thirdS(v.base) : v.base; tail = ""; }
      else { head = s.w; hl = "will " + v.base; tail = ""; }
    } else {
      if (when === "past"){ head = s.w; hl = s.bePast + " " + v.ing; tail = ""; }
      else if (when === "now"){ head = s.w; hl = s.be + " " + v.ing; tail = ""; }
      else { head = s.w; hl = "will be " + v.ing; tail = ""; }
    }
    return { head:head, hl:hl, tail:tail };
  }

  var T = {
    tabLine:{en:"The time line", ur:"وقت کی لکیر"},
    tabMake:{en:"Make a sentence", ur:"جملہ بنائیں"},
    tabSpot:{en:"Spot the tense", ur:"زمانہ پہچانیں"},
    titleLine:{en:"Every sentence sits somewhere on a line of time.",
               ur:"ہر جملہ وقت کی لکیر پر کہیں نہ کہیں بیٹھتا ہے۔"},
    subLine:{en:"A simple tense is a dot. A continuous tense is a stretch.",
             ur:"سادہ زمانہ ایک نقطہ ہے۔ جاری زمانہ ایک پٹی ہے۔"},
    titleMake:{en:"Only the verb changes. Watch which part moves.",
               ur:"صرف فعل بدلتا ہے۔ دیکھیں کون سا حصہ حرکت کرتا ہے۔"},
    subMake:{en:"Pick who and what. The highlighted part is the only thing the tense touches.",
             ur:"کون اور کیا چنیں۔ نمایاں حصہ ہی وہ ہے جسے زمانہ بدلتا ہے۔"},
    titleSpot:{en:"Read the sentence. Where does it belong?",
               ur:"جملہ پڑھیں۔ یہ کہاں بیٹھتا ہے؟"},
    subSpot:{en:"Find the clue word, then pick the box.",
             ur:"اشارہ دینے والا لفظ ڈھونڈیں، پھر خانہ چنیں۔"},
    gridHead:{en:"Pick a box", ur:"کوئی خانہ چنیں"},
    subjHead:{en:"Who?", ur:"کون؟"},
    verbHead:{en:"Doing what?", ur:"کیا کر رہا ہے؟"},
    spotHead:{en:"Pick a sentence", ur:"کوئی جملہ چنیں"},
    past:{en:"Past", ur:"ماضی"},
    now:{en:"Present", ur:"حال"},
    fut:{en:"Future", ur:"مستقبل"},
    simple:{en:"Simple", ur:"سادہ"},
    cont:{en:"Continuous", ur:"جاری"},
    names:{
      "past-simple":{en:"Simple Past", ur:"ماضی مطلق"},
      "past-cont":{en:"Past Continuous", ur:"ماضی جاری"},
      "now-simple":{en:"Simple Present", ur:"حال مطلق"},
      "now-cont":{en:"Present Continuous", ur:"حال جاری"},
      "fut-simple":{en:"Simple Future", ur:"مستقبل مطلق"},
      "fut-cont":{en:"Future Continuous", ur:"مستقبل جاری"}
    },
    formulas:{
      "past-simple":"Subject + verb-ed / V2",
      "past-cont":"Subject + was/were + verb-ing",
      "now-simple":"Subject + verb (+s for he/she/it)",
      "now-cont":"Subject + am/is/are + verb-ing",
      "fut-simple":"Subject + will + verb",
      "fut-cont":"Subject + will be + verb-ing"
    },
    uses:{
      "past-simple":{en:"Something that finished. One moment, already over.",
                     ur:"جو کام ہو چکا۔ ایک لمحہ، جو گزر گیا۔"},
      "past-cont":{en:"Something that was going on for a while, back then.",
                   ur:"جو کام اُس وقت کچھ دیر تک چل رہا تھا۔"},
      "now-simple":{en:"A habit. Something that happens again and again.",
                    ur:"عادت۔ جو کام بار بار ہوتا رہتا ہے۔"},
      "now-cont":{en:"Happening right now, as you speak.",
                  ur:"ابھی اسی وقت ہو رہا ہے، بولتے بولتے۔"},
      "fut-simple":{en:"Something that will happen later. One moment, not yet come.",
                    ur:"جو کام بعد میں ہوگا۔ ایک لمحہ، جو ابھی آیا نہیں۔"},
      "fut-cont":{en:"Something that will be going on for a while, later.",
                  ur:"جو کام بعد میں کچھ دیر تک چل رہا ہوگا۔"}
    },
    samples:{
      "past-simple":{en:"He played cricket yesterday.", ur:"اس نے کل کرکٹ کھیلی۔"},
      "past-cont":{en:"He was playing cricket when it rained.", ur:"جب بارش ہوئی تو وہ کرکٹ کھیل رہا تھا۔"},
      "now-simple":{en:"He plays cricket every Sunday.", ur:"وہ ہر اتوار کرکٹ کھیلتا ہے۔"},
      "now-cont":{en:"He is playing cricket right now.", ur:"وہ ابھی کرکٹ کھیل رہا ہے۔"},
      "fut-simple":{en:"He will play cricket tomorrow.", ur:"وہ کل کرکٹ کھیلے گا۔"},
      "fut-cont":{en:"He will be playing cricket at 5 o'clock.", ur:"وہ پانچ بجے کرکٹ کھیل رہا ہوگا۔"}
    },
    traps:{
      "now-simple":{en:"The commonest mistake of all: \u201cHe go to school.\u201d With he, she or it, the verb needs an s \u2014 He goes. With I, we, they, it does not.",
                    ur:"سب سے عام غلطی: \u201cHe go to school.\u201d۔ he، she یا it کے ساتھ فعل پر s لگتا ہے \u2014 He goes۔ I، we، they کے ساتھ نہیں لگتا۔"},
      "past-simple":{en:"\u201cHe did went\u201d is wrong. Once did appears, the verb goes back to its plain form: He did go, He did not go.",
                     ur:"\u201cHe did went\u201d غلط ہے۔ جہاں did آ جائے، فعل واپس اپنی سادہ شکل میں چلا جاتا ہے: He did go, He did not go۔"},
      "fut-simple":{en:"After will the verb never changes: \u201cwill played\u201d and \u201cwill goes\u201d are both wrong. Always will + the plain verb.",
                    ur:"will کے بعد فعل کبھی نہیں بدلتا: \u201cwill played\u201d اور \u201cwill goes\u201d دونوں غلط ہیں۔ ہمیشہ will + سادہ فعل۔"},
      "now-cont":{en:"The be word is not optional. \u201cHe playing\u201d is not a sentence \u2014 it needs is: He is playing.",
                  ur:"be والا لفظ چھوڑا نہیں جا سکتا۔ \u201cHe playing\u201d جملہ ہی نہیں \u2014 اسے is چاہیے: He is playing۔"},
      "past-cont":{en:"Match the be word to the subject: I/he/she was, but we/they were. \u201cThey was playing\u201d is wrong.",
                   ur:"be والا لفظ فاعل کے مطابق چنیں: I/he/she کے ساتھ was، مگر we/they کے ساتھ were۔ \u201cThey was playing\u201d غلط ہے۔"},
      "fut-cont":{en:"It is will be, never will is or will are. The be stays in its plain form after will.",
                  ur:"یہ will be ہے، will is یا will are کبھی نہیں۔ will کے بعد be اپنی سادہ شکل میں رہتا ہے۔"}
    },
    whyDot:{en:"Look at the line: this one is a single dot. The action is thought of as one moment, whether it is finished, habitual or still to come.",
            ur:"لکیر کو دیکھیں: یہ ایک نقطہ ہے۔ کام کو ایک لمحے کے طور پر سوچا جا رہا ہے — چاہے ہو چکا ہو، عادت ہو، یا ابھی آنا ہو۔"},
    whyBand:{en:"Look at the line: this one is a stretch, not a dot. Continuous always means the action was, is, or will be going on for some time — not finished in an instant.",
             ur:"لکیر کو دیکھیں: یہ نقطہ نہیں، ایک پٹی ہے۔ جاری زمانہ ہمیشہ یہ بتاتا ہے کہ کام کچھ دیر تک چل رہا تھا، چل رہا ہے، یا چل رہا ہوگا — ایک لمحے میں ختم نہیں۔"},
    whyHabit:{en:"Notice the three dots. Simple Present is usually not about right now at all \u2014 it is about something that repeats. For right now you need Present Continuous.",
              ur:"تین نقطے دیکھیں۔ حال مطلق اکثر \u201cابھی\u201d کے بارے میں ہوتا ہی نہیں — یہ اُس کام کے بارے میں ہے جو بار بار ہوتا ہے۔ \u201cابھی\u201d کے لیے حال جاری چاہیے۔"},
    whyMake:{en:"The subject never changes and the rest of the sentence never changes. Only the highlighted part moves. That is all a tense is.",
             ur:"فاعل کبھی نہیں بدلتا اور باقی جملہ بھی نہیں بدلتا۔ صرف نمایاں حصہ حرکت کرتا ہے۔ زمانہ بس اتنا ہی ہے۔"},
    spotAsk:{en:"Which box does this sentence belong in?", ur:"یہ جملہ کس خانے میں جائے گا؟"},
    spotOk:{en:"Correct.", ur:"درست۔"},
    spotNo:{en:"Not that one.", ur:"یہ نہیں۔"},
    whyLbl:{en:"Notice:", ur:"غور کریں:"},
    quiz:{en:"Check yourself", ur:"اپنا امتحان لیں"}
  };

  var SPOTS = [
    { s:"She is reading a book right now.", when:"now",  form:"cont",
      clue:{en:"right now + is reading", ur:"right now + is reading"} },
    { s:"We played hockey last Friday.", when:"past", form:"simple",
      clue:{en:"last Friday + played", ur:"last Friday + played"} },
    { s:"I will call you tomorrow.", when:"fut", form:"simple",
      clue:{en:"tomorrow + will call", ur:"tomorrow + will call"} },
    { s:"My father goes to work every morning.", when:"now", form:"simple",
      clue:{en:"every morning + goes", ur:"every morning + goes"} },
    { s:"They were waiting for the bus at 8 o'clock.", when:"past", form:"cont",
      clue:{en:"at 8 o'clock + were waiting", ur:"at 8 o'clock + were waiting"} },
    { s:"This time tomorrow I will be flying to Karachi.", when:"fut", form:"cont",
      clue:{en:"this time tomorrow + will be flying", ur:"this time tomorrow + will be flying"} }
  ];

  var QUIZ = [
    { q:{en:"Which sentence is correct?", ur:"کون سا جملہ درست ہے؟"},
      o:[{en:"He go to school every day.", ur:"He go to school every day."},
         {en:"He goes to school every day.", ur:"He goes to school every day."},
         {en:"He going to school every day.", ur:"He going to school every day."},
         {en:"He is go to school every day.", ur:"He is go to school every day."}],
      a:1,
      f:{en:"With he, she or it in the Simple Present, the verb takes an s. With I, we or they it does not: I go, they go, but he goes.",
         ur:"حال مطلق میں he، she یا it کے ساتھ فعل پر s لگتا ہے۔ I، we، they کے ساتھ نہیں: I go, they go، مگر he goes۔"} },

    { q:{en:"\u201cShe ______ her homework when the light went off.\u201d",
         ur:"\u201cShe ______ her homework when the light went off.\u201d"},
      o:[{en:"does", ur:"does"},{en:"was doing", ur:"was doing"},
         {en:"will do", ur:"will do"},{en:"is doing", ur:"is doing"}],
      a:1,
      f:{en:"The homework was going on for a while, and then something interrupted it. A stretch of time in the past is Past Continuous: was/were + verb-ing.",
         ur:"کام کچھ دیر سے چل رہا تھا، پھر کسی چیز نے روک دیا۔ ماضی میں چلتا ہوا عرصہ ماضی جاری ہے: was/were + verb-ing۔"} },

    { q:{en:"Which one is wrong?", ur:"ان میں سے غلط کون سا ہے؟"},
      o:[{en:"I will go tomorrow.", ur:"I will go tomorrow."},
         {en:"I will went tomorrow.", ur:"I will went tomorrow."},
         {en:"I will be going tomorrow.", ur:"I will be going tomorrow."},
         {en:"I am going tomorrow.", ur:"I am going tomorrow."}],
      a:1,
      f:{en:"After will the verb always stays in its plain form. Will already carries the future, so the verb does not need to change as well.",
         ur:"will کے بعد فعل ہمیشہ سادہ شکل میں رہتا ہے۔ مستقبل کا کام will خود کر رہا ہے، تو فعل کو بھی بدلنے کی ضرورت نہیں۔"} },

    { q:{en:"\u201cThey ______ cricket in the park at the moment.\u201d",
         ur:"\u201cThey ______ cricket in the park at the moment.\u201d"},
      o:[{en:"play", ur:"play"},{en:"plays", ur:"plays"},
         {en:"are playing", ur:"are playing"},{en:"was playing", ur:"was playing"}],
      a:2,
      f:{en:"\u201cAt the moment\u201d means right now, so it is Present Continuous. And with they the be word is are, not was.",
         ur:"\u201cAt the moment\u201d کا مطلب ابھی، تو یہ حال جاری ہے۔ اور they کے ساتھ be والا لفظ are ہے، was نہیں۔"} },

    { q:{en:"\u201cHe plays cricket every Sunday.\u201d When does he play?",
         ur:"\u201cHe plays cricket every Sunday.\u201d وہ کب کھیلتا ہے؟"},
      o:[{en:"Right now, at this moment", ur:"ابھی، اسی لمحے"},
         {en:"Again and again, as a habit", ur:"بار بار، عادت کے طور پر"},
         {en:"Once, in the past", ur:"ایک بار، ماضی میں"},
         {en:"Once, in the future", ur:"ایک بار، مستقبل میں"}],
      a:1,
      f:{en:"This is the part children most often get wrong. Simple Present is usually not about right now — it is about what repeats. For right now you need \u201cHe is playing\u201d.",
         ur:"یہی وہ بات ہے جو بچے سب سے زیادہ غلط سمجھتے ہیں۔ حال مطلق عموماً \u201cابھی\u201d کے بارے میں نہیں — یہ اُس کام کے بارے میں ہے جو دہراتا ہے۔ \u201cابھی\u201d کے لیے \u201cHe is playing\u201d چاہیے۔"} },

    { q:{en:"What is the difference between a simple tense and a continuous one?",
         ur:"سادہ اور جاری زمانے میں فرق کیا ہے؟"},
      o:[{en:"A simple tense is for one moment; a continuous tense is for a stretch of time",
          ur:"سادہ زمانہ ایک لمحے کے لیے؛ جاری زمانہ کچھ دیر چلنے والے کام کے لیے"},
         {en:"A continuous tense is only for the future", ur:"جاری زمانہ صرف مستقبل کے لیے ہوتا ہے"},
         {en:"They mean exactly the same thing", ur:"دونوں کا مطلب بالکل ایک ہے"},
         {en:"A simple tense is only for the past", ur:"سادہ زمانہ صرف ماضی کے لیے ہوتا ہے"}],
      a:0,
      f:{en:"That is why the app draws one as a dot and the other as a band. Every one of the three times — past, present, future — can be either.",
         ur:"اسی لیے ایپ ایک کو نقطہ اور دوسرے کو پٹی بنا کر دکھاتی ہے۔ تینوں زمانے — ماضی، حال، مستقبل — دونوں طرح کے ہو سکتے ہیں۔"} }
  ];

  function $(id){ return document.getElementById(id); }
  function t(o){ return o[lang]; }
  function key(){ return when + "-" + (form === "simple" ? "simple" : "cont"); }

  var LRI = "\u2066", PDI = "\u2069";
  var LATIN_RUN = /[A-Za-z0-9][A-Za-z0-9 .,'\u2019+()\/@_-]*[A-Za-z0-9.]|[A-Za-z0-9]/g;
  function isolate(s){ return s.replace(LATIN_RUN, function(m){ return LRI + m + PDI; }); }
  function setText(el, str){
    el.textContent = (lang === "ur") ? isolate(str) : str;
    el.classList.toggle("ur", lang === "ur");
    el.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
  }

  var NS = "http://www.w3.org/2000/svg";
  function mk(tag, a){
    var e = document.createElementNS(NS, tag);
    for (var k in a) e.setAttribute(k, a[k]);
    return e;
  }

  /* ---------- the time line ---------- */
  function drawLine(w, f){
    var svg = $("svg"); svg.innerHTML = "";
    var g = mk("g", {}); svg.appendChild(g);
    var Y = 108, X0 = 24, X1 = 316, NOW = 170;

    g.appendChild(mk("line", {x1:X0, y1:Y, x2:X1, y2:Y, stroke:"var(--ink-soft)",
                              "stroke-width":3, "stroke-linecap":"round"}));
    g.appendChild(mk("path", {d:"M"+(X1-11)+" "+(Y-7)+" L"+X1+" "+Y+" L"+(X1-11)+" "+(Y+7),
                              fill:"none", stroke:"var(--ink-soft)", "stroke-width":3,
                              "stroke-linecap":"round", "stroke-linejoin":"round"}));

    // the NOW marker
    g.appendChild(mk("line", {x1:NOW, y1:Y-34, x2:NOW, y2:Y+34, stroke:"var(--now)",
                              "stroke-width":3, "stroke-dasharray":"5 4"}));
    var nowT = mk("text", {x:NOW, y:Y+52, "text-anchor":"middle", "font-size":"13",
                           "font-weight":"800", fill:"var(--now-deep)",
                           "font-family": lang === "ur" ? "Noto Nastaliq Urdu, serif"
                                                        : "Baloo Bhaijaan 2, sans-serif"});
    nowT.textContent = lang === "ur" ? "\u0627\u0628" : "NOW";
    g.appendChild(nowT);

    [[X0+26, t(T.past), "var(--past-deep)"], [X1-30, t(T.fut), "var(--fut-deep)"]].forEach(function(l){
      var tx = mk("text", {x:l[0], y:Y-46, "text-anchor":"middle", "font-size":"13",
                           "font-weight":"800", fill:l[2],
                           "font-family": lang === "ur" ? "Noto Nastaliq Urdu, serif"
                                                        : "Baloo Bhaijaan 2, sans-serif"});
      tx.textContent = l[1];
      g.appendChild(tx);
    });

    var col = w === "past" ? "var(--past)" : (w === "now" ? "var(--now)" : "var(--fut)");
    var cx  = w === "past" ? 84 : (w === "now" ? NOW : 256);

    if (f === "cont"){
      // a stretch of time: a band with soft ends
      g.appendChild(mk("rect", {x:cx-46, y:Y-16, width:92, height:32, rx:16,
                                fill:col, opacity:.30}));
      g.appendChild(mk("rect", {x:cx-46, y:Y-16, width:92, height:32, rx:16,
                                fill:"none", stroke:col, "stroke-width":3.5}));
      for (var i=-1;i<=1;i++){
        g.appendChild(mk("circle", {cx:cx + i*26, cy:Y, r:4.5, fill:col}));
      }
    } else if (w === "now"){
      // a habit: the same dot, over and over
      [-92,-50,0,50,92].forEach(function(o){
        g.appendChild(mk("circle", {cx:cx+o, cy:Y, r: o === 0 ? 9 : 7,
                                    fill:col, opacity: o === 0 ? 1 : .55}));
      });
    } else {
      g.appendChild(mk("circle", {cx:cx, cy:Y, r:11, fill:col}));
      g.appendChild(mk("circle", {cx:cx, cy:Y, r:19, fill:"none", stroke:col,
                                  "stroke-width":2.5, opacity:.45}));
    }

    var nm = mk("text", {x:cx, y:Y-34, "text-anchor":"middle", "font-size":"13",
                         "font-weight":"800", fill:col,
                         "font-family": lang === "ur" ? "Noto Nastaliq Urdu, serif"
                                                      : "Baloo Bhaijaan 2, sans-serif"});
    nm.textContent = t(T.names[key()]);
    if (w !== "now" || f === "cont") g.appendChild(nm);
  }

  /* ---------- the 2 x 3 grid ---------- */
  function buildMatrix(){
    var m = $("matrix"); m.innerHTML = "";
    var blank = document.createElement("div"); blank.className = "mh";
    m.appendChild(blank);
    [["past","p"],["now","n"],["fut","f"]].forEach(function(c){
      var h = document.createElement("div"); h.className = "mh " + c[1];
      h.textContent = t(T[c[0]]);
      h.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
      m.appendChild(h);
    });
    [["simple","simple"],["cont","cont"]].forEach(function(r){
      var lab = document.createElement("div"); lab.className = "mrow";
      lab.textContent = t(T[r[0]]);
      lab.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
      m.appendChild(lab);
      [["past","p"],["now","n"],["fut","f"]].forEach(function(c){
        var b = document.createElement("button");
        b.type = "button"; b.className = "cell " + c[1];
        var k = c[0] + "-" + (r[1] === "simple" ? "simple" : "cont");
        b.textContent = t(T.names[k]);
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.setAttribute("aria-pressed", (when === c[0] && form === r[1]) ? "true" : "false");
        b.addEventListener("click", function(){
          when = c[0]; form = r[1];
          if (tab === "spot") spotAns = { when:c[0], form:r[1] };
          render();
        });
        m.appendChild(b);
      });
    });
  }

  /* ---------- render ---------- */
  function render(){
    ["Line","Make","Spot"].forEach(function(x){
      $("tab"+x).setAttribute("aria-pressed", tab === x.toLowerCase() ? "true" : "false");
    });
    setText($("tabLine"), t(T.tabLine));
    setText($("tabMake"), t(T.tabMake));
    setText($("tabSpot"), t(T.tabSpot));
    $("whyLbl").textContent = t(T.whyLbl);
    setText($("quizHead"), t(T.quiz));
    $("makePanel").style.display = (tab === "make") ? "" : "none";
    $("spotPanel").style.display = (tab === "spot") ? "" : "none";
    $("gridPanel").style.display = (tab === "make") ? "none" : "";
    setText($("gridHead"), tab === "spot" ? t(T.spotAsk) : t(T.gridHead));
    setText($("subjHead"), t(T.subjHead));
    setText($("verbHead"), t(T.verbHead));
    setText($("spotHead"), t(T.spotHead));
    var chip = $("statechip"); chip.className = "statechip";
    $("trap").style.display = "";

    if (tab === "spot"){
      var sp = SPOTS[spotI];
      drawLine(spotAns ? spotAns.when : sp.when, spotAns ? spotAns.form : sp.form);
      buildMatrix();
      setText($("title"), t(T.titleSpot));
      setText($("subtitle"), t(T.subSpot));
      $("eng").textContent = sp.s;
      setText($("urdu"), "");
      $("formula").textContent = t(T.formulas[sp.when + "-" + sp.form]);
      if (!spotAns){
        setText(chip, t(T.spotAsk));
        setText($("detail"), "");
      } else {
        var good = (spotAns.when === sp.when && spotAns.form === sp.form);
        chip.className = "statechip " + (good ? "ok" : "no");
        setText(chip, good ? t(T.spotOk) : t(T.spotNo));
        if (good) solved[spotI] = true;
        setText($("detail"), t(T.uses[sp.when + "-" + sp.form]));
      }
      setText($("trap"), t(T.traps[sp.when + "-" + sp.form]));
      setText($("whyText"), t(T.uses[sp.when + "-" + sp.form]) + " " +
                            (lang === "ur" ? "اشارہ: " : "Clue: ") + t(sp.clue));
      var sc = $("spotChips"); sc.innerHTML = "";
      SPOTS.forEach(function(x, i){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "schip" + (solved[i] ? " done" : "");
        b.textContent = String(i+1) + (solved[i] ? " \u2605" : "");
        b.setAttribute("aria-pressed", i === spotI ? "true" : "false");
        b.addEventListener("click", function(){ spotI = i; spotAns = null; render(); });
        sc.appendChild(b);
      });
      lastSpoken = sp.s;
      return;
    }

    drawLine(when, form);
    buildMatrix();
    var k = key();

    if (tab === "line"){
      setText($("title"), t(T.titleLine));
      setText($("subtitle"), t(T.subLine));
      setText(chip, t(T.names[k]));
      $("eng").textContent = t(T.samples[k]).en || T.samples[k].en;
      setText($("urdu"), T.samples[k].ur);
      $("formula").textContent = T.formulas[k];
      setText($("detail"), t(T.uses[k]));
      setText($("trap"), t(T.traps[k]));
      setText($("whyText"), form === "cont" ? t(T.whyBand)
                          : (when === "now" ? t(T.whyHabit) : t(T.whyDot)));
      lastSpoken = T.samples[k].en;
      return;
    }

    // make a sentence
    setText($("title"), t(T.titleMake));
    setText($("subtitle"), t(T.subMake));
    var b = build(subjI, verbI, when, form);
    setText(chip, t(T.names[k]));
    $("eng").innerHTML = "";
    var h = document.createElement("span"); h.textContent = b.head + " ";
    var u = document.createElement("u"); u.textContent = b.hl;
    var tl = document.createElement("span");
    tl.textContent = " " + VERBS[verbI].obj + ".";
    $("eng").appendChild(h); $("eng").appendChild(u); $("eng").appendChild(tl);
    $("eng").setAttribute("dir","ltr");
    setText($("urdu"), SUBJ[subjI].ur + " \u00b7 " + VERBS[verbI].ur);
    $("formula").textContent = T.formulas[k];
    setText($("detail"), t(T.uses[k]));
    setText($("trap"), t(T.traps[k]));
    setText($("whyText"), t(T.whyMake));

    var scb = $("subjChips"); scb.innerHTML = "";
    SUBJ.forEach(function(s, i){
      var bt = document.createElement("button");
      bt.type = "button"; bt.className = "schip";
      bt.textContent = s.w; bt.setAttribute("dir","ltr");
      bt.setAttribute("aria-pressed", i === subjI ? "true" : "false");
      bt.addEventListener("click", function(){ subjI = i; render(); });
      scb.appendChild(bt);
    });
    var vcb = $("verbChips"); vcb.innerHTML = "";
    VERBS.forEach(function(v, i){
      var bt = document.createElement("button");
      bt.type = "button"; bt.className = "schip";
      bt.textContent = v.base; bt.setAttribute("dir","ltr");
      bt.setAttribute("aria-pressed", i === verbI ? "true" : "false");
      bt.addEventListener("click", function(){ verbI = i; render(); });
      vcb.appendChild(bt);
    });
    lastSpoken = b.head + " " + b.hl + " " + VERBS[verbI].obj + ".";
  }

  var lastSpoken = "";

  ["Line","Make","Spot"].forEach(function(x){
    $("tab"+x).addEventListener("click", function(){
      var m = x.toLowerCase();
      if (tab === m) return;
      tab = m; spotAns = null; render();
    });
  });

  /* ---------- quiz ---------- */
  function buildQuiz(){
    var box = $("quizBox"); box.innerHTML = "";
    QUIZ.forEach(function(item){
      var wrap = document.createElement("div"); wrap.className = "q";
      var q = document.createElement("p"); setText(q, t(item.q)); wrap.appendChild(q);
      var fb = document.createElement("p"); fb.className = "fb";
      item.o.forEach(function(opt, oi){
        var bt = document.createElement("button");
        bt.type = "button";
        bt.className = "opt";
        bt.setAttribute("dir","ltr");
        bt.textContent = t(opt);
        bt.addEventListener("click", function(){
          if (wrap.getAttribute("data-done") === "1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show","fb");
        });
        wrap.appendChild(bt);
      });
      wrap.appendChild(fb); box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");
    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });
    buildQuiz(); render();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en"; applyLang();
  });

  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u2 = new SpeechSynthesisUtterance(lastSpoken);
      u2.lang = "en-US"; u2.rate = 0.9;
      window.speechSynthesis.speak(u2);
    }catch(e){ /* no voice available — stay quiet */ }
  });

  applyLang();
})();
</script>
</body>
</html>
