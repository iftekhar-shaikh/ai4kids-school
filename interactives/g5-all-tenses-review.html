<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All tenses review — AI4Kids Class 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

  :root{
    --board:#f5efe3;--board-deep:#e8dcc8;--sky:#b8d4f0;--sky2:#7eb0e0;
    --past:#8b5a2b;--now:#2f6fb5;--fut:#2e7d4f;--gold:#e8b23d;
    --left:#c4453a;--ok:#2e7d4f;--ink:#2a2419;--ink-soft:#574e3e;
    --paper:#fdfaf3;--line:#ded5c4;--accent:#5b4a8f;--cont:#c9702e;--perf:#7a5aa8;
    --fs-cap:clamp(14px, 3.8vw, 16px);--fs-xs:clamp(16px, 4.2vw, 18px);--fs-sm:clamp(18px, 4.8vw, 20px);--fs-md:clamp(19px, 5.2vw, 22px);--fs-lg:clamp(22px, 6vw, 26px);--fs-xl:clamp(30px, 8vw, 38px);--lh:1.5;
  }
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);--fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);--fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);--lh:2.1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .stars{display:flex;align-items:center;gap:6px;font-weight:800;font-size:var(--fs-xs);
         background:#fff6e2;border:2px solid var(--gold);border-radius:999px;padding:7px 13px}
  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}
  .tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
  .tabs button{
    flex:1 1 22%;min-width:72px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:10px 4px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:54px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .tabs button .badge{color:var(--gold)}
  .story{
    background:#fff8ea;border:2px dashed var(--gold);border-radius:16px;padding:13px 15px;
    font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6;margin-bottom:14px;
  }
  body.urdu .story{line-height:var(--lh)}
  .story b{color:var(--ink)}
  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  }
  .scene-pad{padding:14px 14px 22px;min-height:280px}
  .readout{
    margin-top:-18px;position:relative;z-index:2;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.win{background:var(--ok)}
  .statechip.miss{background:var(--left)}
  .headline{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .headline.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
  .hintbox{
    margin-top:14px;border:2px solid var(--now);background:#eaf1f9;border-radius:14px;
    padding:11px 14px;font-size:var(--fs-xs);color:var(--now);font-weight:700;line-height:1.55;
    display:none;
  }
  .hintbox.show{display:block}
  body.urdu .hintbox{line-height:var(--lh)}
  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .prog{margin:0 0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft)}
  .btns{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}
  .btns button{
    border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);
    font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;min-height:50px;
    padding:8px 14px;flex:1;
  }
  .btns .go{background:var(--ink);color:var(--paper)}
  .btns button:active{transform:scale(.97)}
  .btns button:disabled{opacity:.4;cursor:default}
  .choice{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;font-weight:700;
  }
  .choice.ur{text-align:right;line-height:var(--lh)}
  .choice:hover{border-color:var(--ink)}
  .choice.right{border-color:var(--ok);background:#e8f2ed}
  .choice.wrong{border-color:var(--left);background:#fbeae8}
  .choice .cem{font-size:22px;margin-right:8px}
  body.urdu .choice .cem{margin-right:0;margin-left:8px}

  /* --- Timeline visual --- */
  .tl-rail{
    position:relative;height:110px;margin:6px 0 14px;border-radius:16px;overflow:hidden;
    border:2.5px solid var(--ink);background:linear-gradient(180deg,#c5dff5 0%,#e8f0d8 55%,#c8b896 100%);
  }
  .tl-hills{
    position:absolute;left:0;right:0;bottom:28%;height:40px;
    background:
      radial-gradient(ellipse at 18% 100%,#3d6b3d 0%,transparent 50%),
      radial-gradient(ellipse at 55% 100%,#4a7a4a 0%,transparent 55%),
      radial-gradient(ellipse at 85% 100%,#2f5a2f 0%,transparent 48%);
    opacity:.85;
  }
  .tl-sun{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:28px;height:28px;border-radius:50%;background:#f5c842;
    box-shadow:0 0 18px 6px rgba(245,200,66,.55);
  }
  .tl-line{
    position:absolute;left:8%;right:8%;top:58%;height:4px;background:var(--ink);
    border-radius:4px;z-index:1;
  }
  .tl-arrow-l,.tl-arrow-r{
    position:absolute;top:52%;font-size:18px;font-weight:800;z-index:2;color:var(--ink);
  }
  .tl-arrow-l{left:3%} .tl-arrow-r{right:3%}
  .tl-node{
    position:absolute;top:42%;transform:translate(-50%,-50%);z-index:3;text-align:center;
  }
  .tl-node .dot{
    width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);margin:0 auto 4px;
    background:var(--paper);
  }
  .tl-node.past .dot{background:var(--past);border-color:var(--past)}
  .tl-node.now .dot{background:var(--now);border-color:var(--now);width:22px;height:22px;
    box-shadow:0 0 0 4px rgba(47,111,181,.25)}
  .tl-node.fut .dot{background:var(--fut);border-color:var(--fut)}
  .tl-node .lab{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:.02em;
    background:rgba(253,250,243,.9);padding:2px 6px;border-radius:6px}
  .tl-node.past{left:18%} .tl-node.now{left:50%} .tl-node.fut{left:82%}
  .tl-now-flag{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    font-size:14px;font-weight:800;background:var(--now);color:#fff;
    border-radius:999px;padding:3px 10px;z-index:4;
  }

  .buckets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
  .bucket{
    border:2.5px dashed var(--ink);border-radius:14px;padding:12px 6px;text-align:center;
    cursor:pointer;background:var(--paper);min-height:78px;transition:transform .12s,background .12s;
    font-weight:800;font-size:var(--fs-xs);
  }
  .bucket:hover{transform:translateY(-2px)}
  .bucket.past{border-color:var(--past);color:var(--past)}
  .bucket.now{border-color:var(--now);color:var(--now)}
  .bucket.fut{border-color:var(--fut);color:var(--fut)}
  .bucket.picked-ok{background:#e8f2ed;border-style:solid}
  .bucket.picked-no{background:#fbeae8;border-style:solid;border-color:var(--left);color:var(--left)}
  .bucket .bem{font-size:28px;display:block;margin-bottom:2px;line-height:1}
  .bucket .blab{display:block}

  .sent-card{
    background:var(--paper);border:3px solid var(--ink);border-radius:16px;
    padding:12px 14px;margin:8px 0;text-align:center;position:relative;overflow:hidden;
  }
  .sent-card .sc-sky{
    position:absolute;inset:0 0 40% 0;
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);opacity:.45;pointer-events:none;
  }
  .sent-card .sc-em{font-size:48px;position:relative;z-index:1;margin:10px 0 4px;line-height:1.1}
  .sent-card .sc-sent{position:relative;z-index:1;font-weight:800;font-size:var(--fs-md);margin:0}
  body.urdu .sent-card .sc-sent{line-height:var(--lh);font-weight:400}
  .sent-card .sc-place{position:relative;z-index:1;font-size:var(--fs-cap);color:var(--ink-soft);font-weight:700;margin:4px 0 0}

  /* Comic panels for continuous vs simple */
  .comic{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .comic.trio{grid-template-columns:1fr 1fr 1fr}
  .panel-card{
    background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;
    padding:10px 8px 12px;text-align:center;position:relative;min-height:140px;overflow:hidden;
  }
  .panel-card.hi-cont{border-color:var(--cont);box-shadow:inset 0 0 0 3px rgba(201,112,46,.15)}
  .panel-card.hi-simp{border-color:var(--now);box-shadow:inset 0 0 0 3px rgba(47,111,181,.12)}
  .panel-card.hi-perf{border-color:var(--perf);box-shadow:inset 0 0 0 3px rgba(122,90,168,.15)}
  .panel-sky{
    position:absolute;inset:0 0 45% 0;
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);opacity:.55;pointer-events:none;
  }
  .panel-hills{
    position:absolute;left:0;right:0;bottom:38%;height:28px;
    background:radial-gradient(ellipse at 30% 100%,#4a7a4a 0%,transparent 55%),
               radial-gradient(ellipse at 70% 100%,#3d6b3d 0%,transparent 50%);
    opacity:.7;pointer-events:none;
  }
  .panel-ground{
    position:absolute;left:0;right:0;bottom:0;height:40%;
    background:linear-gradient(180deg,#c8b896 0%,#b09a70 100%);opacity:.35;pointer-events:none;
  }
  .panel-em{font-size:42px;line-height:1.15;position:relative;z-index:1;margin:18px 0 4px;user-select:none}
  .panel-em.lg{font-size:52px}
  .panel-cap{position:relative;z-index:1;font-size:var(--fs-cap);font-weight:800;margin:0;color:var(--ink)}
  .panel-tag{
    position:absolute;top:6px;left:6px;z-index:2;
    background:var(--ink);color:var(--paper);font-size:15px;font-weight:800;
    border-radius:999px;padding:3px 8px;
  }
  body.urdu .panel-tag{left:auto;right:6px}
  .panel-tag.cont-tag{background:var(--cont)}
  .panel-tag.simp-tag{background:var(--now)}
  .panel-tag.perf-tag{background:var(--perf)}
  .motion-rings{
    position:absolute;top:28%;left:50%;transform:translateX(-50%);z-index:0;
    width:70px;height:70px;border-radius:50%;border:2px dashed var(--cont);opacity:.5;
    animation:spin 4s linear infinite;
  }
  @keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
  .check-badge{
    position:absolute;top:8px;right:8px;z-index:2;font-size:22px;
    background:#e8f2ed;border-radius:50%;width:32px;height:32px;line-height:32px;
  }
  body.urdu .check-badge{right:auto;left:8px}

  .legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
  .leg{
    font-size:var(--fs-cap);font-weight:800;padding:4px 10px;border-radius:999px;border:2px solid var(--line);
  }
  .leg.past{border-color:var(--past);color:var(--past);background:#f5ebe0}
  .leg.now{border-color:var(--now);color:var(--now);background:#eaf1f9}
  .leg.fut{border-color:var(--fut);color:var(--fut);background:#e8f2ed}
  .leg.cont{border-color:var(--cont);color:var(--cont);background:#fdf0e4}
  .leg.simp{border-color:var(--now);color:var(--now);background:#eaf1f9}
  .leg.perf{border-color:var(--perf);color:var(--perf);background:#f1eef8}

  .formula{
    background:#f1eef8;border:2px solid var(--accent);border-radius:14px;
    padding:10px 12px;margin:8px 0;font-size:var(--fs-xs);font-weight:700;color:var(--accent);
    text-align:center;
  }
  body.urdu .formula{line-height:var(--lh)}

  .dots{display:flex;gap:6px;justify-content:center;margin:10px 0 0}
  .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--ink)}
  .dots i.ok{background:var(--ok)}
  .dots i.no{background:var(--left)}
  .hit{animation:pop .45s ease-out}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}

  .build-slots{
    display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;
    margin:10px 0;min-height:56px;
  }
  .slot{
    min-width:72px;min-height:48px;border:2.5px dashed var(--ink);border-radius:12px;
    background:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:var(--fs-xs);padding:6px 10px;color:var(--ink-soft);
  }
  .slot.filled{border-style:solid;background:#f1eef8;color:var(--perf);border-color:var(--perf)}
  .slot-plus{font-weight:800;color:var(--cont);font-size:20px}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
  .pick-chip{
    border:2px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);
    font:inherit;font-weight:800;font-size:var(--fs-xs);padding:10px 14px;cursor:pointer;min-height:44px;
  }
  .pick-chip.used{opacity:.35;pointer-events:none}
  .pick-chip.sel{background:var(--perf);color:#fff;border-color:var(--perf)}
  .build-check{
    margin-top:10px;width:100%;border:2px solid var(--ink);border-radius:14px;
    background:var(--ink);color:var(--paper);font:inherit;font-weight:800;
    font-size:var(--fs-sm);padding:12px;cursor:pointer;min-height:50px;
  }
  .build-check:disabled{opacity:.4;cursor:default}

  .mid-banner{
    background:linear-gradient(90deg,#fff6e2,#ffe8b8);border:2px dashed var(--cont);
    border-radius:12px;padding:8px 12px;text-align:center;font-weight:800;
    font-size:var(--fs-xs);margin:8px 0;color:var(--cont);
  }

  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .qhead h2{font-size:var(--fs-lg);font-weight:800;margin:0;flex:1}
  .q{margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid var(--line)}
  .q:last-child{border-bottom:0}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:8px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:12px 14px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);min-height:48px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--left);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}
  footer{margin-top:28px;padding-top:14px;border-top:2px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}
  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;
      grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar"
        "head  head"
        "tabs  tabs"
        "story story"
        "left  right"
        "quiz  quiz"
        "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .story{grid-area:story} .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation:none !important}
  }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */
\n\1
</head>
<body>
<div class="wrap">

  <div class="bar">
    <span class="brand">AI4Kids · Class 5</span>
    <span class="stars" id="starBox">⭐ <span id="starCount">0</span></span>
    <button class="chip" id="langBtn" aria-pressed="false">اردو</button>
    <button class="chip" id="speakBtn" aria-label="Sunlo">🔊</button>
  </div>

  <div class="head">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  </div>

  <div class="tabs" role="group">
    <button type="button" id="tabTime" aria-pressed="true"></button>
    <button type="button" id="tabCont" aria-pressed="false"></button>
    <button type="button" id="tabPerf" aria-pressed="false"></button>
  </div>

  <p class="story" id="story"></p>

  <div class="left">
  <div class="scene">
    <div class="scene-pad" id="scenePad"></div>
  </div>
  <div class="readout">
    <span class="statechip" id="statechip"></span>
    <p class="headline" id="headline"></p>
    <p class="detail" id="detail"></p>
    <p class="hintbox" id="hintbox"></p>
  </div>
  </div>

  <div class="right">
  <div class="panel">
    <h2 id="ctlHead"></h2>
    <p class="prog" id="prog"></p>
    <div id="actionBox"></div>
    <div class="btns">
      <button type="button" class="go" id="nextBtn"></button>
    </div>
    <div class="btns">
      <button type="button" id="hintBtn"></button>
      <button type="button" id="resetBtn"></button>
    </div>
  </div>
  </div>

  <div class="quiz">
    <div class="qhead">
      <h2 id="quizHead"></h2>
      <button type="button" class="chip" id="newQuiz"></button>
    </div>
    <div id="quizBox"></div>
  </div>

  <footer>
    <p data-en="AI4Kids — Islamabad bilingual AI school. Offline play · no APIs. WhatsApp 0337 1468899"
       data-ur="اے آئی فور کڈز — اسلام آباد۔ آف لائن کھیلو۔ واٹس ایپ 0337 1468899"></p>
  </footer>
</div>

<script>
(function(){

          '<div class="panel-sky"></div><div class="panel-hills"></div><div class="panel-ground"></div>' +
          (isCont ? '<div class="motion-rings"></div>' : '') +
          '<span class="panel-tag ' + (isCont?"cont-tag":"simp-tag") + '">' +
            (isCont ? t(T.contLab) : t(T.simpleLab)) + '</span>' +
          '<div class="panel-em lg">' + item.sceneEm + '</div>' +
          '<p class="panel-cap">' + t(item.sceneCap) + '</p>' +
        '</div>' +
        '<div class="panel-card">' +
          '<div class="panel-sky"></div><div class="panel-hills"></div><div class="panel-ground"></div>' +
          '<span class="panel-tag">' + (lang==="en"?"Clue":"اشارہ") + '</span>' +
          '<div class="panel-em">🕐📍</div>' +
          '<p class="panel-cap">' + t(item.place) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="mid-banner">' + t(item.askPic) + '</div>' +
      renderDots(CONT, cIdx, "cont");

    setText($("statechip"), ans === true ? t(T.nice) : (ans === false ? t(T.oops) : t(T.askCont)));
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (ans===true?" win":(ans===false?" miss":""));
    setText($("headline"), t(item.askPic));
    setText($("detail"), ans === true ? t(item.why) : t(item.place));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    item.opts.forEach(function(opt, oi){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "choice" + (lang==="ur"?" ur":"");
      b.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      b.innerHTML = '<span class="cem">' + (opt.em||"") + '</span>' +
        (lang==="ur"?isolate(t(opt)):t(opt));
      if (ans != null){
        if (oi === item.a) b.classList.add("right");
        else if (ans === false && oi !== item.a) { /* leave */ }
        b.disabled = true;
      }
      b.addEventListener("click", function(){
        if (answered.cont[cIdx] != null) return;
        var ok = (oi === item.a);
        answered.cont[cIdx] = ok;
        if (ok) award("cont-" + cIdx, 1);
        maybeDone("cont", answered.cont, CONT.length);
        renderCont();
      });
      box.appendChild(b);
    });
    if (ans === true){
      var fb = document.createElement("p");
      fb.className = "formula";
      setText(fb, t(item.why));
      box.appendChild(fb);
    }
    $("prog").textContent = t(T.progC) + ": " + countOk(answered.cont) + "/" + CONT.length;
  }

  /* ---------- PERF mode ---------- */
  function renderPerf(){
    var item = PERF[pIdx];
    var pad = $("scenePad");
    var ans = answered.perf[pIdx];
    pad.innerHTML =
      '<div class="legend"><span class="leg perf">has / have + V3</span></div>' +
      '<div class="panel-card hi-perf" style="min-height:160px">' +
        '<div class="panel-sky"></div><div class="panel-hills"></div><div class="panel-ground"></div>' +
        '<span class="check-badge">✅</span>' +
        '<span class="panel-tag perf-tag">Perfect</span>' +
        '<div class="panel-em lg">' + item.em + '</div>' +
        '<p class="panel-cap">' + t(item.place) + '</p>' +
      '</div>' +
      '<div class="formula">' + t(item.prompt) + '</div>' +
      renderDots(PERF, pIdx, "perf");

    setText($("statechip"), ans === true ? t(T.nice) : (ans === false ? t(T.oops) : t(T.askPerf)));
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (ans===true?" win":(ans===false?" miss":""));
    setText($("headline"), ans === true ? t(item.full) : t(item.prompt));
    setText($("detail"), ans === true ? t(item.why) : t(item.place));
    $("hintbox").classList.remove("show");

    if (ans != null){
      // freeze slots display
    } else if (!perfSlots.length || perfSlots._for !== pIdx){
      perfSlots = [];
      perfSlots._for = pIdx;
    }

    var box = $("actionBox");
    box.innerHTML = "";

    var slots = document.createElement("div");
    slots.className = "build-slots";
    var s0 = document.createElement("div");
    s0.className = "slot" + (perfSlots[0] ? " filled" : "");
    s0.textContent = perfSlots[0] || "has/have";
    var plus = document.createElement("span");
    plus.className = "slot-plus"; plus.textContent = "+";
    var s1 = document.createElement("div");
    s1.className = "slot" + (perfSlots[1] ? " filled" : "");
    s1.textContent = perfSlots[1] || "V3";
    slots.appendChild(s0); slots.appendChild(plus); slots.appendChild(s1);
    box.appendChild(slots);

    if (ans == null){
      var row = document.createElement("div");
      row.className = "chip-row";
      item.chips.forEach(function(ch){
        var used = perfSlots.indexOf(ch) >= 0;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "pick-chip" + (used ? " used" : "");
        b.textContent = ch;
        b.addEventListener("click", function(){
          if (answered.perf[pIdx] != null) return;
          if (perfSlots.length >= 2) return;
          if (perfSlots.indexOf(ch) >= 0) return;
          perfSlots.push(ch);
          renderPerf();
        });
        row.appendChild(b);
      });
      box.appendChild(row);

      var chk = document.createElement("button");
      chk.type = "button";
      chk.className = "build-check";
      chk.textContent = t(T.check);
      chk.disabled = perfSlots.length < 2;
      chk.addEventListener("click", function(){
        if (perfSlots.length < 2) return;
        var ok = (perfSlots[0] === item.target[0] && perfSlots[1] === item.target[1]);
        answered.perf[pIdx] = ok;
        if (ok) award("perf-" + pIdx, 1);
        maybeDone("perf", answered.perf, PERF.length);
        renderPerf();
      });
      box.appendChild(chk);

      var undo = document.createElement("button");
      undo.type = "button";
      undo.className = "chip";
      undo.style.marginTop = "8px";
      undo.textContent = lang==="en" ? "Clear chips" : "صاف کرو";
      undo.addEventListener("click", function(){
        if (answered.perf[pIdx] != null) return;
        perfSlots = []; perfSlots._for = pIdx;
        renderPerf();
      });
      box.appendChild(undo);
    } else {
      var fb = document.createElement("p");
      fb.className = "formula";
      setText(fb, t(item.full) + " — " + t(item.why));
      box.appendChild(fb);
      // show correct fill
      s0.textContent = item.target[0]; s0.classList.add("filled");
      s1.textContent = item.target[1]; s1.classList.add("filled");
    }
    $("prog").textContent = t(T.progP) + ": " + countOk(answered.perf) + "/" + PERF.length;
  }

  function setMode(m){
    mode = m;
    lab($("tabTime"), T.tabTime, "time");
    lab($("tabCont"), T.tabCont, "cont");
    lab($("tabPerf"), T.tabPerf, "perf");
    $("tabTime").setAttribute("aria-pressed", mode==="time" ? "true":"false");
    $("tabCont").setAttribute("aria-pressed", mode==="cont" ? "true":"false");
    $("tabPerf").setAttribute("aria-pressed", mode==="perf" ? "true":"false");
    $("story").innerHTML = storyHtml();
    if (lang==="ur"){ $("story").classList.add("ur"); $("story").setAttribute("dir","rtl"); }
    else { $("story").classList.remove("ur"); $("story").setAttribute("dir","ltr"); }
    if (mode === "time") renderTime();
    else if (mode === "cont") renderCont();
    else renderPerf();
  }
  function lab(btn, labelObj, key){
    var mark = doneModes[key] ? ' <span class="badge">★</span>' : "";
    btn.innerHTML = t(labelObj) + mark;
    if (lang==="ur"){ btn.classList.add("ur"); btn.setAttribute("dir","rtl"); }
    else { btn.classList.remove("ur"); btn.setAttribute("dir","ltr"); }
  }

  function next(){
    if (mode === "time"){
      tIdx = (tIdx + 1) % TIME.length;
      renderTime();
    } else if (mode === "cont"){
      cIdx = (cIdx + 1) % CONT.length;
      renderCont();
    } else {
      pIdx = (pIdx + 1) % PERF.length;
      perfSlots = []; perfSlots._for = pIdx;
      renderPerf();
    }
  }
  function showHint(){
    var item = mode==="time" ? TIME[tIdx] : (mode==="cont" ? CONT[cIdx] : PERF[pIdx]);
    var hb = $("hintbox");
    setText(hb, t(item.hint));
    hb.classList.add("show");
  }
  function resetMode(){
    if (mode === "time"){
      answered.time = {}; tIdx = 0;
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("time-")===0 || k==="mode-time") delete awarded[k]; });
      doneModes.time = false;
      recountStars();
      renderTime();
    } else if (mode === "cont"){
      answered.cont = {}; cIdx = 0;
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("cont-")===0 || k==="mode-cont") delete awarded[k]; });
      doneModes.cont = false;
      recountStars();
      renderCont();
    } else {
      answered.perf = {}; pIdx = 0; perfSlots = [];
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("perf-")===0 || k==="mode-perf") delete awarded[k]; });
      doneModes.perf = false;
      recountStars();
      renderPerf();
    }
  }

  function pickQuiz(){ quizSet = shuffle(QUIZ).slice(0, 5); }
  function renderQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizSet.forEach(function(item, qi){
      var q = document.createElement("div");
      q.className = "q";
      var p = document.createElement("p");
      setText(p, (qi+1) + ". " + t(item.q));
      q.appendChild(p);
      item.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang === "ur" ? " ur" : "");
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.textContent = (lang === "ur") ? isolate(t(opt)) : t(opt);
        b.addEventListener("click", function(){
          if (b.parentNode.querySelector(".opt.right, .opt.wrong")) return;
          var ok = (oi === item.a);
          b.classList.add(ok ? "right" : "wrong");
          if (!ok){
            var correct = b.parentNode.querySelectorAll(".opt")[item.a];
            if (correct) correct.classList.add("right");
          } else {
            award("quiz-" + qi, 1);
          }
          var fb = document.createElement("p");
          fb.className = "fb show";
          setText(fb, ok ? (lang==="en"?"Shabash!":"شاباش!") : (lang==="en"?"Look at the green answer.":"سبز جواب دیکھو۔"));
          q.appendChild(fb);
        });
        q.appendChild(b);
      });
      box.appendChild(q);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    document.documentElement.lang = (lang === "ur") ? "ur" : "en";
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");
    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    setText($("ctlHead"), t(T.ctl));
    setText($("quizHead"), t(T.quiz));
    $("nextBtn").textContent = t(T.next);
    $("hintBtn").textContent = t(T.hint);
    $("resetBtn").textContent = t(T.reset);
    $("newQuiz").textContent = t(T.newQuiz);
    ["nextBtn","hintBtn","resetBtn","newQuiz"].forEach(function(id){
      if (lang === "ur"){ $(id).classList.add("ur"); $(id).setAttribute("dir","rtl"); }
      else { $(id).classList.remove("ur"); $(id).setAttribute("dir","ltr"); }
    });
    document.querySelectorAll("footer [data-en]").forEach(function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });
    setMode(mode);
    renderQuiz();
  }

  function cleanSpeakText(s){
    return String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  function buildSpeakText(){
    var parts = [t(T.title), t(T.sub)];
    if (mode === "time"){
      parts.push(t(TIME[tIdx].sent));
      parts.push(t(T.askTime));
    } else if (mode === "cont"){
      parts.push(t(CONT[cIdx].askPic));
      parts.push(t(T.askCont));
    } else {
      parts.push(t(PERF[pIdx].full));
      parts.push(t(T.askPerf));
    }
    parts.push(t(T.tip));
    return cleanSpeakText(parts.filter(Boolean).join(". "));
  }
  function pickVoice(voices, want){
    var i, v, L;
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf(want) === 0) return v;
    }
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf(want.split("-")[0]) === 0) return v;
    }
    return voices[0] || null;
  }
  var speakTimer = null;
  function setSpeaking(on){
    var btn = $("speakBtn");
    if (!btn) return;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.textContent = on ? "⏹" : "🔊";
  }
  function doSpeak(text, asLang){
    try{
      var u = new SpeechSynthesisUtterance(text);
      u.lang = asLang === "ur" ? "ur-PK" : "en-US";
      var voices = window.speechSynthesis.getVoices() || [];
      var voice = pickVoice(voices, asLang === "ur" ? "ur" : "en");
      if (voice) u.voice = voice;
      u.onstart = function(){ setSpeaking(true); };
      u.onend = function(){ setSpeaking(false); };
      u.onerror = function(){ setSpeaking(false); };
      try {
        window.speechSynthesis.speak(u);
      } catch (e2) {
        var u2 = new SpeechSynthesisUtterance(text);
        u2.lang = u.lang;
        u2.onstart = function(){ setSpeaking(true); };
        u2.onend = u2.onerror = function(){ setSpeaking(false); };
        window.speechSynthesis.speak(u2);
      }
    }catch(e){ setSpeaking(false); }
  }

  if ("speechSynthesis" in window){
    try { window.speechSynthesis.getVoices(); } catch (e0) {}
    if (typeof window.speechSynthesis.addEventListener === "function"){
      window.speechSynthesis.addEventListener("voiceschanged", function(){
        try { window.speechSynthesis.getVoices(); } catch (e1) {}
      });
    }
  } else {
    var noBtn = $("speakBtn");
    if (noBtn){ noBtn.disabled = true; noBtn.title = "Voice not available on this device"; }
  }
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      var text = buildSpeakText();
      if (!text) return;
      if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
      window.speechSynthesis.cancel();
      setSpeaking(false);
      var speakLang = lang;
      speakTimer = setTimeout(function(){
        speakTimer = null;
        doSpeak(text, speakLang);
      }, 80);
    }catch(e){ setSpeaking(false); }
  });

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });
  $("tabTime").addEventListener("click", function(){ setMode("time"); });
  $("tabCont").addEventListener("click", function(){ setMode("cont"); });
  $("tabPerf").addEventListener("click", function(){ setMode("perf"); });
  $("nextBtn").addEventListener("click", next);
  $("hintBtn").addEventListener("click", showHint);
  $("resetBtn").addEventListener("click", resetMode);
  $("newQuiz").addEventListener("click", function(){ pickQuiz(); renderQuiz(); });

  pickQuiz();
  applyLang();
})();
</script>
</body>
</html>
