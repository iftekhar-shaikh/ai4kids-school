<head>
<meta charset="utf-8">

<title>Iman aur Ibadat — ایمان اور عبادت | AI4Kids Grade 4 Islamiyat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

  :root{
    --board:#eef2ee;
    --board-deep:#dfe6df;
    --sky:#bcd8ee;
    --night:#22304a;
    --sun:#e0a32c;
    --moon:#dfe6f2;
    --green:#2e7d55;
    --green-deep:#1d5a3c;
    --sign:#6b4a8f;
    --fast:#a0632c;
    --ink:#241f18;
    --ink-soft:#554c41;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#1d5a3c;
    --ok:#2e7d4f;
    --no:#c4453a;

    --fs-cap:clamp(15px, 3.9vw, 16px);
    --fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.7vw, 19px);
    --fs-md:clamp(19px, 5.1vw, 21px);
    --fs-lg:clamp(22px, 5.9vw, 25px);
    --fs-xl:clamp(28px, 7.6vw, 34px);
    --lh:1.5;
  }
  /* Urdu is set larger than Latin — Nastaliq reads smaller at the same size. */
  body.urdu{
    --fs-cap:clamp(17px, 4.4vw, 18px);
    --fs-xs:clamp(18px, 4.7vw, 20px);
    --fs-sm:clamp(20px, 5.2vw, 22px);
    --fs-md:clamp(21px, 5.6vw, 23px);
    --fs-lg:clamp(24px, 6.4vw, 27px);
    --fs-xl:clamp(27px, 7.2vw, 32px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:44px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .tabs{display:flex;gap:7px;margin:0 0 14px}
  .tabs button{
    flex:1;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:56px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  }
  .scene svg{display:block;width:100%;height:auto}
  #sunmark{transition:transform .5s ease}

  .readout{
    margin-top:14px;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.ok{background:var(--ok)} .statechip.no{background:var(--no)}
  .name{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.4}
  .name.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .two{display:flex;gap:10px;margin-top:14px}
  .card{flex:1;border:2px solid var(--line);border-radius:14px;padding:11px 9px;text-align:center}
  .card em{display:block;font-style:normal;font-size:var(--fs-cap);color:var(--ink-soft);
           font-weight:700;margin-bottom:5px}
  .card b{display:block;font-size:var(--fs-lg);font-weight:800;line-height:1.2;color:var(--green-deep)}
  .card.when b{font-size:var(--fs-sm);color:var(--ink)}

  .steps{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
  .stepchip{
    border:2px solid var(--line);background:var(--paper);border-radius:11px;padding:8px 12px;
    font-size:var(--fs-cap);font-weight:800;color:var(--ink-soft);
  }
  .stepchip.on{border-color:var(--green);background:#e8f2ec;color:var(--green-deep)}

  .teach{
    margin-top:14px;border:2px solid var(--accent);background:#eaf2ed;border-radius:14px;
    padding:13px 15px;
  }
  .teach em{display:block;font-style:normal;font-size:var(--fs-cap);color:var(--ink-soft);
            font-weight:700;margin-bottom:6px}
  .teach b{display:block;font-size:var(--fs-sm);font-weight:800;color:var(--accent);line-height:2}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}
  body.urdu .why-note{
    border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;
    line-height:var(--lh);
  }
  .review{
    margin-top:16px;border:2px dashed var(--fast);border-radius:14px;padding:11px 13px;
    font-size:var(--fs-cap);color:var(--fast);font-weight:700;line-height:1.6;
  }
  body.urdu .review{line-height:var(--lh)}

  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .schip{
    border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 15px;
    font:inherit;font-size:var(--fs-cap);font-weight:800;color:var(--ink);cursor:pointer;min-height:46px;
  }
  .schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .schip.done{border-color:var(--ok)}
  .judge{display:flex;gap:8px;margin-top:12px}
  .judge button{
    flex:1;border:3px solid var(--line);background:var(--paper);border-radius:16px;
    padding:12px 7px;font:inherit;font-weight:800;font-size:var(--fs-cap);color:var(--ink-soft);
    cursor:pointer;min-height:66px;line-height:1.3;
  }
  .judge button.y[aria-pressed="true"]{border-color:var(--no);background:#fbeae8;color:var(--no)}
  .judge button.n[aria-pressed="true"]{border-color:var(--ok);background:#e8f2ec;color:var(--ok)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:52px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--no);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "quiz quiz" "foot foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

  <div class="bar">
    <span class="brand">AI4Kids · Grade 4 · Islamiyat</span>
    <button class="chip" id="langBtn" aria-pressed="true">English</button>
    <button class="chip" id="speakBtn" aria-label="Sunlo">🔊</button>

  <div class="head">

  </div>

  <div class="tabs" role="group">
    <button type="button" id="tabIman" aria-pressed="true"></button>
    <button type="button" id="tabNamaz" aria-pressed="false"></button>
    <button type="button" id="tabRoza" aria-pressed="false"></button>
  </div>

  <div class="left">
  <div class="scene">
    <svg viewBox="0 0 320 210" role="img" id="svg" aria-label="The picture for this lesson"></svg>

    <div id="quizBox"></div>
  </div>

  <footer>
    <p data-ur="اے آئی فور کڈز — اسلام آباد کا دو زبانوں والا اے آئی اور کوڈنگ سکول۔ واٹس ایپ 0337 1468899" data-en="AI4Kids — Islamabad's bilingual AI and coding school. WhatsApp 0337 1468899"></p>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var lang="ur", tab="iman";
  var signI=0, prayI=0, rozaI=0, rozaPick=null, rozaDone={};

  /* ---------- signs in the world around you ---------- */
  var SIGNS=[
    { ur:"بارش", en:"Rain", icon:"rain",
      d:{ur:"پانی سمندر سے بھاپ بن کر اوپر جاتا ہے، بادل بنتا ہے، اور واپس اُسی زمین پر برستا ہے جہاں سے اٹھا تھا۔",
         en:"Water rises from the sea as vapour, becomes cloud, and falls back on the very land it came from."},
      t:{ur:"قرآن بار بار کہتا ہے: غور کرو کہ مُردہ زمین بارش کے بعد کیسے زندہ ہو جاتی ہے (مفہوم)۔",
         en:"The Quran repeatedly says: consider how dead earth comes alive after rain (in meaning)."},
      w:{ur:"یہی چکر آپ نے سائنس میں بھی پڑھا ہوگا۔ دین آپ سے یہ نہیں کہتا کہ سائنس چھوڑ دو — بلکہ یہ کہتا ہے کہ اِسے دیکھ کر سوچو کہ یہ سب چل کیسے رہا ہے۔",
         en:"You will have met this same cycle in science. The deen does not ask you to set science aside \u2014 it asks you to look at it and wonder how all of it keeps running."} },
    { ur:"ایک بیج", en:"A seed", icon:"seed",
      d:{ur:"ایک چھوٹے سے سخت بیج کے اندر پورا درخت چھپا ہوتا ہے — پتے، پھل، اور اگلے بیج بھی۔",
         en:"Inside one small hard seed there is a whole tree \u2014 leaves, fruit, and the next seeds as well."},
      t:{ur:"قرآن میں دانے اور گٹھلی کے پھٹنے کا ذکر ہے، اور یہ کہ اُگانے والا کون ہے (مفہوم)۔",
         en:"The Quran speaks of the grain and the date-stone splitting open, and of Who it is that brings it forth (in meaning)."},
      w:{ur:"بیج کو آپ ہاتھ میں پکڑ سکتے ہیں۔ درخت اُس وقت نظر نہیں آتا، مگر ہوتا وہیں ہے۔ کچھ چیزیں موجود ہوتی ہیں چاہے نظر نہ آئیں۔",
         en:"You can hold the seed in your hand. The tree is not visible, yet it is in there. Some things are real even when they cannot be seen."} },
    { ur:"آپ کا اپنا دل", en:"Your own heart", icon:"heart",
      d:{ur:"آپ کا دل رات کو بھی دھڑکتا ہے جب آپ سو رہے ہوتے ہیں۔ آپ نے اسے کبھی چلانے کا حکم نہیں دیا۔",
         en:"Your heart beats at night while you sleep. You have never once told it to."},
      t:{ur:"قرآن کہتا ہے کہ نشانیاں خود تمہارے اپنے اندر بھی ہیں؛ کیا تم دیکھتے نہیں؟ (مفہوم)",
         en:"The Quran says the signs are within your own selves; will you not then see? (in meaning)"},
      w:{ur:"دن میں تقریباً ایک لاکھ بار۔ اور آپ کو یاد رکھنے کی ضرورت بھی نہیں پڑتی۔ جو چیز آپ کے بغیر چل رہی ہے، وہ کس کے حکم سے چل رہی ہے؟",
         en:"About a hundred thousand times a day, and you never have to remember. Something is running without you \u2014 by whose command is it running?"} },
    { ur:"رات اور دن", en:"Night and day", icon:"daynight",
      d:{ur:"اندھیرا آہستہ آہستہ آتا ہے اور آہستہ آہستہ جاتا ہے۔ کبھی ایک دن بھی آگے پیچھے نہیں ہوتا۔",
         en:"Darkness comes slowly and leaves slowly. Not one day has ever come out of turn."},
      t:{ur:"قرآن رات اور دن کے بدلنے کو عقل والوں کے لیے نشانی کہتا ہے (مفہوم)۔",
         en:"The Quran calls the alternation of night and day a sign for people of understanding (in meaning)."},
      w:{ur:"اگر یہ ایک بار بھی بے ترتیب ہو جائے تو ساری زندگی رک جائے۔ جو چیز اتنی باقاعدہ ہو، وہ اتفاق سے نہیں ہوتی۔",
         en:"If it went out of order even once, life would stop. Something this regular does not happen by accident."} },
    { ur:"شہد کی مکھی", en:"The honey bee", icon:"bee",
      d:{ur:"ایک چھوٹی سی مکھی پھولوں سے رس لے کر ایسی چیز بناتی ہے جو انسان کے لیے شفا ہے۔",
         en:"A tiny bee takes nectar from flowers and makes something that is healing for people."},
      t:{ur:"قرآن کی ایک پوری سورت کا نام ہی \u201cالنحل\u201d یعنی شہد کی مکھی ہے (مفہوم)۔",
         en:"A whole chapter of the Quran is named An-Nahl \u2014 the Bee (in meaning)."},
      w:{ur:"مکھی کو یہ کسی نے سکھایا نہیں۔ وہ پیدا ہوتے ہی جانتی ہے۔ سیکھے بغیر جاننا خود ایک سوال ہے۔",
         en:"Nobody taught the bee. It knows from the moment it exists. Knowing without learning is itself a question."} },
    { ur:"پہاڑ", en:"The mountains", icon:"mtn",
      d:{ur:"پہاڑ زمین میں گڑے ہوتے ہیں — جتنا اوپر نظر آتا ہے، اس سے کہیں زیادہ نیچے ہوتا ہے۔",
         en:"Mountains are set into the earth \u2014 far more of them lies below than the part you can see."},
      t:{ur:"قرآن پہاڑوں کو زمین کے لیے میخوں کی طرح بیان کرتا ہے (مفہوم)۔",
         en:"The Quran describes the mountains as pegs for the earth (in meaning)."},
      w:{ur:"مارگلہ کو دیکھیں تو صرف چوٹی نظر آتی ہے۔ جو نظر آتا ہے وہ پوری کہانی نہیں ہوتا — نہ پہاڑ میں، نہ لوگوں میں۔",
         en:"Look at the Margallas and you see only the top. What is visible is never the whole story \u2014 not in mountains, and not in people."} }
  ];

  /* ---------- the five prayers, placed by where the sun is ---------- */
  var PRAYERS=[
    { ur:"فجر", en:"Fajr", ang:196, rak:2, night:true,
      when:{ur:"صبح صادق سے سورج نکلنے تک", en:"From first light until sunrise"},
      d:{ur:"سب سے پہلی نماز، جب اندھیرے میں روشنی کی پہلی لکیر آتی ہے اور سورج ابھی نکلا نہیں ہوتا۔",
         en:"The first prayer, when the first thread of light appears and the sun has not yet risen."},
      w:{ur:"یہی سب سے مشکل ہے، اور اسی لیے سب سے قیمتی۔ اٹھنا کسی کو نظر نہیں آتا — یہ آپ اور اللہ کے درمیان ہوتا ہے۔",
         en:"This is the hardest one, and that is exactly why it counts for so much. Nobody sees you get up \u2014 it is between you and Allah."} },
    { ur:"ظہر", en:"Zuhr", ang:82, rak:4, night:false,
      when:{ur:"سورج ڈھلنے کے بعد", en:"After the sun passes its highest point"},
      d:{ur:"دن کے بیچ میں، جب سورج سب سے اوپر پہنچ کر ڈھلنا شروع ہوتا ہے۔ اسکول اور کام کے بیچ میں ایک وقفہ۔",
         en:"In the middle of the day, once the sun has passed its highest point and started down. A pause in the middle of school and work."},
      w:{ur:"غور کریں کہ یہ دن کے سب سے مصروف حصے میں رکھی گئی ہے۔ عبادت زندگی سے الگ نہیں، اسی کے بیچ میں ہے۔",
         en:"Notice it sits in the busiest part of the day. Worship is not separate from life; it is placed in the middle of it."} },
    { ur:"عصر", en:"Asr", ang:38, rak:4, night:false,
      when:{ur:"دوپہر ڈھلنے کے بعد، غروب سے پہلے", en:"Late afternoon, before sunset"},

      g.appendChild(mk("path",{d:"M92 150 L150 205 M172 150 L172 205 M252 150 L206 205",
                               stroke:"#4a4030","stroke-width":3,"stroke-dasharray":"6 6"}));
    }
  }

  function drawSky(i){
    var svg=$("svg"); svg.innerHTML=""; svg.setAttribute("viewBox","0 0 320 210");
    var g=mk("g",{}); svg.appendChild(g);
    var p=PRAYERS[i];
    g.appendChild(mk("rect",{x:0,y:0,width:320,height:210,
                             fill: p.night ? "var(--night)" : "var(--sky)"}));
    if (p.night) [[42,36],[104,26],[250,30],[286,66],[150,20]].forEach(function(s2){
      g.appendChild(mk("circle",{cx:s2[0],cy:s2[1],r:2.6,fill:"#fff",opacity:.85}));
    });

    // A wide, shallow ellipse for the sun's path. The ground is drawn FIRST, so the
    // prayers whose sun is below the horizon still show on top of it instead of
    // being buried under it.
    var CX=160, CY=126, RX=124, RY=88;
    function pos(a){
      var r=a*Math.PI/180;
      return [CX+Math.cos(r)*RX, CY-Math.sin(r)*RY];
    }
    g.appendChild(mk("rect",{x:0,y:CY,width:320,height:210-CY,
                             fill: p.night ? "#1a2436":"#6b7f5e"}));
    var arc="";
    for (var a2=200; a2>=-40; a2-=4){
      var q2=pos(a2);
      arc += (arc ? " L":"M") + q2[0].toFixed(1) + " " + q2[1].toFixed(1);
    }
    g.appendChild(mk("path",{d:arc, fill:"none", stroke: p.night ? "#5d6d86":"#8fb4d4",
                             "stroke-width":3, "stroke-dasharray":"6 6", opacity:.85}));
    g.appendChild(mk("line",{x1:0,y1:CY,x2:320,y2:CY,
                             stroke: p.night ? "#44506a":"#7f9bb5","stroke-width":3}));

    PRAYERS.forEach(function(q,j){
      var xy=pos(q.ang), x=xy[0], y=xy[1];
      var on = j===i;
      g.appendChild(mk("circle",{cx:x,cy:y,r: on ? 14 : 7,
                                 fill: on ? "var(--sun)" : (p.night ? "#6d7c96":"#a9c4dc"),
                                 stroke: on ? "var(--ink)" : "none","stroke-width":2.5}));
      if (on){
        for (var k=0;k<8;k++){
          var b=k*Math.PI/4;
          g.appendChild(mk("line",{x1:x+Math.cos(b)*19,y1:y+Math.sin(b)*19,
                                   x2:x+Math.cos(b)*26,y2:y+Math.sin(b)*26,
                                   stroke:"var(--sun)","stroke-width":3,"stroke-linecap":"round"}));
        }
      }
      // label above the marker when it is low down, below it when it is high up,
      // so nothing ever falls off the top or the bottom of the canvas
      var ly = (y > CY) ? y + 28 : y - 22;
      if (ly > 202) ly = y - 22;
      if (ly < 14)  ly = y + 28;
      var lab=mk("text",{x: Math.max(26, Math.min(294, x)), y: ly, "text-anchor":"middle",
                         "font-size": on ? "15":"12", "font-weight":"800",
                         fill: on ? "var(--sun)" : (p.night ? "#9fb0c8":"#5b7590"),
                         "font-family": lang==="ur" ? "Noto Nastaliq Urdu, serif"
                                                    : "Baloo Bhaijaan 2, sans-serif"});
      lab.textContent=t(q); g.appendChild(lab);
    });
  }

  function drawFast(){
    var svg=$("svg"); svg.innerHTML=""; svg.setAttribute("viewBox","0 0 320 210");
    var g=mk("g",{}); svg.appendChild(g);
    g.appendChild(mk("rect",{x:0,y:0,width:320,height:106,fill:"var(--night)"}));
    g.appendChild(mk("rect",{x:0,y:106,width:320,height:104,fill:"var(--sky)"}));
    g.appendChild(mk("line",{x1:22,y1:106,x2:298,y2:106,stroke:"#55708c","stroke-width":4}));
    [[52,"\u0633\u062d\u0631\u06CC","Sehri",true],[268,"\u0627\u0641\u0637\u0627\u0631","Iftar",false]]
      .forEach(function(m){
        g.appendChild(mk("circle",{cx:m[0],cy:106,r:13,fill:"var(--sun)",
                                   stroke:"var(--ink)","stroke-width":2.5}));
        var tx=mk("text",{x:m[0],y:m[3]?86:86,"text-anchor":"middle","font-size":"14",
                          "font-weight":"800",fill:"#fff",
                          "font-family": lang==="ur" ? "Noto Nastaliq Urdu, serif"
                                                     : "Baloo Bhaijaan 2, sans-serif"});
        tx.textContent = lang==="ur" ? m[1] : m[2];
        g.appendChild(tx);
      });
    var band=mk("rect",{x:52,y:126,width:216,height:34,rx:16,fill:"var(--fast)",opacity:.85});
    g.appendChild(band);
    var bt=mk("text",{x:160,y:149,"text-anchor":"middle","font-size":"15","font-weight":"800",
                      fill:"#fff","font-family": lang==="ur" ? "Noto Nastaliq Urdu, serif"
                                                             : "Baloo Bhaijaan 2, sans-serif"});
    bt.textContent = lang==="ur" ? "\u0631\u0648\u0632\u06C1" : "the fast";
    g.appendChild(bt);
    var sub=mk("text",{x:160,y:186,"text-anchor":"middle","font-size":"12","font-weight":"700",
                       fill:"#4a5661","font-family": lang==="ur" ? "Noto Nastaliq Urdu, serif"
                                                                 : "Baloo Bhaijaan 2, sans-serif"});
    sub.textContent = lang==="ur" ? "\u0635\u0628\u062D \u0635\u0627\u062F\u0642 \u0633\u06D2 \u063A\u0631\u0648\u0628 \u062A\u06A9"
                                  : "from first light until sunset";
    g.appendChild(sub);
  }

  /* ---------- render ---------- */
  function render(){
    ["Iman","Namaz","Roza"].forEach(function(x){
      $("tab"+x).setAttribute("aria-pressed", tab===x.toLowerCase() ? "true":"false");
    });
    setText($("tabIman"), t(T.tabIman));
    setText($("tabNamaz"), t(T.tabNamaz));
    setText($("tabRoza"), t(T.tabRoza));
    $("whyLbl").textContent=t(T.whyLbl);
    setText($("quizHead"), t(T.quiz));
    setText($("review"), t(T.review));
    var two=$("two"), steps=$("steps"), judge=$("judge"), chips=$("chips"), teach=$("teach");
    two.innerHTML=""; steps.innerHTML=""; judge.innerHTML=""; chips.innerHTML="";
    var chip=$("statechip"); chip.className="statechip";
    teach.style.display="none";

    if (tab==="iman"){
      var s=SIGNS[signI];
      drawSign(s.icon);
      setText($("title"), t(T.titleIman));
      setText($("subtitle"), t(T.subIman));
      setText($("panelHead"), t(T.headIman));
      setText(chip, t(T.signChip));
      setText($("name"), t(s));
      setText($("detail"), t(s.d));
      teach.style.display=""; teach.innerHTML="";
      var em=document.createElement("em"); em.textContent=t(T.teachLbl);
      em.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      var b=document.createElement("b");
      b.textContent=(lang==="ur") ? isolate(t(s.t)) : t(s.t);
      b.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      if (lang==="ur") b.className="ur";
      teach.appendChild(em); teach.appendChild(b);
      setText($("whyText"), t(s.w));
      SIGNS.forEach(function(x,i){
        var bt=document.createElement("button"); bt.type="button"; bt.className="schip";
        setText(bt, t(x));
        bt.setAttribute("aria-pressed", i===signI ? "true":"false");
        bt.addEventListener("click", function(){ signI=i; render(); });
        chips.appendChild(bt);
      });
      lastSpoken=t(s);
      return;
    }

    if (tab==="namaz"){
      var p=PRAYERS[prayI];
      drawSky(prayI);
      setText($("title"), t(T.titleNamaz));
      setText($("subtitle"), t(T.subNamaz));
      setText($("panelHead"), t(T.headNamaz));
      setText(chip, t(T.total));
      setText($("name"), t(p));
      setText($("detail"), t(p.d));
      [[t(T.rakLbl), String(p.rak) + " " + t(RAKA), ""],
       [t(T.whenLbl), t(p.when), "when"]].forEach(function(c){
        var d=document.createElement("div"); d.className="card "+c[2];
        var em2=document.createElement("em"); em2.textContent=c[0];
        em2.setAttribute("dir", lang==="ur"?"rtl":"ltr");
        var b2=document.createElement("b");
        b2.textContent=(lang==="ur") ? isolate(c[1]) : c[1];
        b2.setAttribute("dir", lang==="ur"?"rtl":"ltr");
        d.appendChild(em2); d.appendChild(b2); two.appendChild(d);
      });
      var lbl=document.createElement("div");
      lbl.style.cssText="width:100%;font-size:var(--fs-cap);font-weight:700;color:var(--ink-soft);margin-bottom:2px";
      lbl.textContent=t(T.stepsLbl);
      lbl.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      steps.appendChild(lbl);
      STEPS.forEach(function(st){
        var d=document.createElement("span"); d.className="stepchip on";
        d.textContent=t(st);
        d.setAttribute("dir", lang==="ur"?"rtl":"ltr");
        steps.appendChild(d);
      });
      setText($("whyText"), t(p.w) + " " + t(T.whyNamaz));
      teach.style.display=""; teach.innerHTML="";
      var em3=document.createElement("em"); em3.textContent=t(T.stepsLbl);
      em3.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      var b3=document.createElement("b");
      b3.textContent=(lang==="ur") ? isolate(t(T.whySteps)) : t(T.whySteps);
      b3.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      if (lang==="ur") b3.className="ur";
      teach.appendChild(em3); teach.appendChild(b3);
      PRAYERS.forEach(function(x,i){
        var bt=document.createElement("button"); bt.type="button"; bt.className="schip";
        setText(bt, t(x));
        bt.setAttribute("aria-pressed", i===prayI ? "true":"false");
        bt.addEventListener("click", function(){ prayI=i; render(); });
        chips.appendChild(bt);
      });
      lastSpoken=t(p);
      return;
    }

    var r=ROZA[rozaI];
    drawFast();
    setText($("title"), t(T.titleRoza));
    setText($("subtitle"), t(T.subRoza));
    setText($("panelHead"), t(T.headRoza));
    setText($("name"), t(r));
    if (rozaPick===null){
      setText(chip, t(T.ask)); setText($("detail"), "");
    } else {
      var good = (rozaPick===1)===r.breaks;
      chip.className="statechip " + (good ? "ok":"no");
      setText(chip, good ? t(T.right) : t(T.wrong));
      setText($("detail"), t(r.r));
    }
    setText($("whyText"), t(T.whyRoza));
    [[0,t(T.no),"n"],[1,t(T.yes),"y"]].forEach(function(b4){
      var bt=document.createElement("button"); bt.type="button"; bt.className=b4[2];
      setText(bt, b4[1]);
      bt.setAttribute("aria-pressed", rozaPick===b4[0] ? "true":"false");
      bt.addEventListener("click", function(){
        if (rozaPick!==null) return;
        rozaPick=b4[0]; rozaDone[rozaI]=true; render();
      });
      judge.appendChild(bt);
    });
    ROZA.forEach(function(x,i){
      var bt=document.createElement("button"); bt.type="button";
      bt.className="schip" + (rozaDone[i] ? " done":"");
      bt.textContent=String(i+1)+(rozaDone[i]?" \u2605":"");
      bt.setAttribute("aria-pressed", i===rozaI ? "true":"false");
      bt.addEventListener("click", function(){ rozaI=i; rozaPick=null; render(); });
      chips.appendChild(bt);
    });
    lastSpoken=t(r);
  }

  var lastSpoken="";

  ["Iman","Namaz","Roza"].forEach(function(x){
    $("tab"+x).addEventListener("click", function(){
      var m=x.toLowerCase();
      if (tab===m) return;
      tab=m; rozaPick=null; render();
    });
  });

  function buildQuiz(){
    var box=$("quizBox"); box.innerHTML="";
    QUIZ.forEach(function(item){
      var wrap=document.createElement("div"); wrap.className="q";
      var q=document.createElement("p"); setText(q,t(item.q)); wrap.appendChild(q);
      var fb=document.createElement("p"); fb.className="fb";
      item.o.forEach(function(opt,oi){
        var b=document.createElement("button"); b.type="button";
        b.className="opt" + (lang==="ur" ? " ur":"");
        b.setAttribute("dir", lang==="ur" ? "rtl":"ltr");
        b.textContent=t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done")==="1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x,xi){
            if (xi===item.a) x.classList.add("right");
            else if (xi===oi) x.classList.add("wrong");
          });
          setText(fb,t(item.f)); fb.classList.add("show","fb");
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb); box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang==="ur");
    var lb=$("langBtn");
    lb.textContent=(lang==="ur") ? "English" : "اردو";
    lb.setAttribute("aria-pressed", lang==="ur" ? "true":"false");
    Array.prototype.forEach.call(document.querySelectorAll("[data-ur]"), function(el){
      setText(el, el.getAttribute(lang==="ur" ? "data-ur":"data-en"));
    });
    buildQuiz(); render();
  }
  $("langBtn").addEventListener("click", function(){
    lang=(lang==="ur") ? "en":"ur"; applyLang();
  });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(lastSpoken);
      var __v=window.ai4kidsPickVoice&&ai4kidsPickVoice();if(__v){u.voice=__v;u.lang=((__v.lang||'').toLowerCase().indexOf('ur')===0)?'ur-PK':'hi-IN';}else{u.lang='hi-IN';}u.rate=.82;
      window.speechSynthesis.speak(u);
    }catch(e){ /* no voice available — stay quiet */ }
  });

  applyLang();
})();
</script>
<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
