<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kahani aur afsana | AI4Kids Grade 4 Urdu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

  :root{
    --board:#e8f0ea;--board-deep:#c5d8c8;--sky:#7eb8d4;--sky2:#4a8fb8;
    --accent:#0d5c3d;--ok:#2e7d4f;--ink:#1a2e22;--ink-soft:#4a5a4e;
    --paper:#fdfaf3;--line:#d0dcc8;--gold:#d4a017;--no:#c4453a;
    --char:#2f6fb5;--set:#0d5c3d;--plot:#c45c3a;--moral:#8b5a2b;
    --fs-cap:clamp(14px, 3.8vw, 16px);--fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.8vw, 20px);--fs-md:clamp(19px, 5.2vw, 22px);
    --fs-lg:clamp(22px, 6vw, 26px);--fs-xl:clamp(30px, 8vw, 38px);--lh:1.5;
  }
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);
    --fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);
    --fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);--lh:2.1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.55;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:44px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}
  .sec{margin-top:22px}
  .sec h2{
    font-size:var(--fs-lg);font-weight:800;margin:0 0 10px;color:var(--accent);
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .tag{
    display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
    padding:3px 12px;font-size:var(--fs-cap);font-weight:700;letter-spacing:.02em;
  }
  .story{
    background:#fff8ea;border:2px dashed var(--gold);border-radius:16px;padding:14px 16px;
    font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.65;margin-bottom:4px;
  }
  body.urdu .story{line-height:var(--lh)}
  .story b{color:var(--ink)}

  /* Story-part cards */
  .pcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .pcard{
    border:3px solid var(--ink);border-radius:18px;padding:14px 12px;text-align:center;
    background:var(--paper);cursor:pointer;min-height:120px;
    transition:box-shadow .12s ease, transform .12s ease;
  }
  .pcard:active{transform:scale(.98)}
  .pcard.open{box-shadow:0 0 0 3px rgba(13,92,61,.28)}
  .pcard.char{border-color:var(--char);background:linear-gradient(180deg,#e8f0f8,#fdfaf3)}
  .pcard.set{border-color:var(--set);background:linear-gradient(180deg,#e8f5ec,#fdfaf3)}
  .pcard.beg{border-color:var(--plot);background:linear-gradient(180deg,#fff0e8,#fdfaf3)}
  .pcard.mid{border-color:var(--gold);background:linear-gradient(180deg,#fff8ea,#fdfaf3)}
  .pcard.end{border-color:var(--moral);background:linear-gradient(180deg,#f5efe6,#fdfaf3);grid-column:1 / -1}
  .pcard .em{font-size:36px;line-height:1;display:block;margin-bottom:4px}
  .pcard h3{margin:0 0 6px;font-size:var(--fs-md);font-weight:800;color:var(--ink)}
  .pcard .body{margin:0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.5;display:none}
  .pcard.open .body{display:block}
  body.urdu .pcard .body{line-height:var(--lh)}
  .pcard .tap-hint{margin:8px 0 0;font-size:var(--fs-cap);font-weight:700;color:var(--accent)}
  .pcard.open .tap-hint{display:none}

  /* Story reader + comprehension */
  .story-read{
    margin-top:10px;border:3px solid var(--ink);border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,#fff8ea,#fdfaf3);
  }
  .story-banner{
    background:var(--accent);color:#fff;padding:10px 14px;font-weight:800;
    font-size:var(--fs-md);display:flex;align-items:center;gap:8px;
  }
  .story-body{
    padding:14px 16px;font-size:var(--fs-sm);font-weight:700;color:var(--ink);
    line-height:1.7;margin:0;
  }
  body.urdu .story-body{line-height:var(--lh)}
  .story-acts{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
  .story-acts button{
    flex:1;min-width:120px;border:2px solid var(--ink);border-radius:14px;
    background:var(--paper);color:var(--ink);font:inherit;font-weight:800;
    font-size:var(--fs-xs);cursor:pointer;min-height:48px;padding:8px 12px;
  }
  .story-acts .go{background:var(--ink);color:var(--paper)}
  .comp-grid{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px}
  .comp-btn{
    border:2.5px solid var(--line);background:var(--paper);border-radius:14px;
    padding:12px 14px;font:inherit;font-weight:800;font-size:var(--fs-sm);
    color:var(--ink);cursor:pointer;min-height:56px;text-align:left;
    display:flex;align-items:center;gap:10px;
  }
  body.urdu .comp-btn{text-align:right;flex-direction:row-reverse}
  .comp-btn .cem{font-size:26px;flex-shrink:0}
  .comp-btn[aria-pressed="true"]{border-color:var(--accent);background:#e8f5ec}
  .comp-btn.done{border-color:var(--ok);background:#e8f2ed}
  .comp-ans{
    margin:0 14px 14px;padding:12px 14px;border-radius:12px;background:#e8f5ec;
    font-size:var(--fs-sm);font-weight:700;color:var(--accent);line-height:1.55;display:none;
  }
  .comp-ans.show{display:block}
  body.urdu .comp-ans{line-height:var(--lh)}
  .comp-prog{
    display:inline-block;background:#fff6e2;border:2px solid var(--gold);
    border-radius:999px;padding:4px 12px;font-weight:800;font-size:var(--fs-cap);
    margin:0 14px 10px;
  }

  /* Moral match */
  .moral-game{margin-top:10px}
  .scenario{
    border:3px solid var(--ink);border-radius:18px;padding:14px;margin-bottom:12px;
    background:linear-gradient(180deg,#fff8ea,#fdfaf3);
  }
  .scenario .sem{font-size:32px;display:block;margin-bottom:4px}
  .scenario .stitle{font-weight:800;font-size:var(--fs-md);margin:0 0 6px}
  .scenario .sbody{margin:0 0 10px;font-size:var(--fs-sm);color:var(--ink-soft);font-weight:700;line-height:1.55}
  body.urdu .scenario .sbody{line-height:var(--lh)}
  .moral-opts{display:flex;flex-direction:column;gap:8px}
  .mopt{
    border:2.5px solid var(--line);background:var(--paper);border-radius:14px;
    padding:12px 14px;font:inherit;font-weight:800;font-size:var(--fs-sm);
    color:var(--ink);cursor:pointer;min-height:52px;text-align:left;
  }
  body.urdu .mopt{text-align:right;line-height:var(--lh)}
  .mopt.right{border-color:var(--ok);background:#e8f2ed}
  .mopt.wrong{border-color:var(--no);background:#fbeae8}
  .mopt:disabled{cursor:default}
  .mfb{margin:8px 0 0;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft);display:none;line-height:1.55}
  .mfb.show{display:block}
  .moral-score{
    background:#fff6e2;border:2px solid var(--gold);border-radius:999px;
    padding:6px 14px;font-weight:800;font-size:var(--fs-xs);display:inline-block;margin-bottom:10px;
  }

  .karo{
    margin-top:10px;border:3px solid var(--accent);background:#e8f5ec;border-radius:16px;
    padding:14px 16px;font-size:var(--fs-sm);font-weight:700;color:var(--accent);line-height:1.6;
  }
  body.urdu .karo{line-height:var(--lh)}
  .karo ol{margin:8px 0 0;padding-inline-start:1.4em}
  .karo li{margin-bottom:6px}
  .misaal{
    margin-top:10px;background:#eef2f8;border:2px solid var(--char);border-radius:14px;
    padding:12px 14px;font-size:var(--fs-xs);font-weight:700;color:var(--char);line-height:1.6;
  }
  body.urdu .misaal{line-height:var(--lh)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .qhead h2{font-size:var(--fs-lg);font-weight:800;margin:0;flex:1}
  .scorepill{
    background:#fff6e2;border:2px solid var(--gold);border-radius:999px;
    padding:7px 14px;font-weight:800;font-size:var(--fs-xs);
  }
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2.5px solid var(--line);background:var(--paper);border-radius:14px;
    padding:14px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:56px;font-weight:700;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed}
  .opt.wrong{border-color:var(--no);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.6}
  .fb.show{display:block}
  .donebox{
    margin-top:14px;border:3px solid var(--ok);background:#e8f2ed;border-radius:16px;
    padding:16px;text-align:center;display:none;
  }
  .donebox.show{display:block}
  .donebox b{font-size:var(--fs-lg);display:block;margin-bottom:4px}
  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}
  @media (min-width:820px){
    .wrap{max-width:920px;display:grid;gap:0 28px;grid-template-columns:1fr 1fr;
      grid-template-areas:"bar bar" "head head" "hook hook" "left right" "story story" "moral moral" "karo karo" "quiz quiz" "foot foot";
      align-items:start}
    .bar{grid-area:bar}.head{grid-area:head}.hook{grid-area:hook}
    .left{grid-area:left}.right{grid-area:right}
    .story-sec{grid-area:story}.moral-sec{grid-area:moral}
    .karo-sec{grid-area:karo}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

  <div class="karo-sec sec">

    <div class="karo" id="karoBox"></div>
  </div>

  <div class="quiz">

      <h2 id="quizHead"></h2>
      <span class="scorepill" id="scorePill">0 / 5</span>

     body:{en:"Who is in the story? People (or animals) — the hero and friends.",

    {id:"set", cls:"set", em:"📍",

  /* Quiz exact from brief */
  var QUIZ = [

  ];

  function paintStatic(){
    document.title = "Kahani aur afsana | AI4Kids Grade 4 Urdu";
    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    setText($("hookTag"), "HOOK");
    setText($("hookHead"), t(T.hookHead));
    setText($("hookText"), t(T.hook));
    setText($("samTag"), "SAMJHAO");
    setText($("samHead"), t(T.samHead));
    setText($("samText"), t(T.sam));
    setText($("partsHead"), t(T.partsHead));
    setText($("partsIntro"), t(T.partsIntro));
    setText($("misTag"), "MISAAL");
    setText($("misHead"), t(T.misHead));
    setText($("misaalText"), t(T.misaal));
    setText($("readHead"), t(T.readHead));
    setText($("readIntro"), t(T.readIntro));
    setText($("storyTitle"), t(STORY.title));
    setText($("storyBody"), t(STORY.body));
    setText($("speakStory"), t(T.speakStory));
    setText($("resetComp"), t(T.resetComp));
    setText($("moralHead"), t(T.moralHead));
    setText($("moralIntro"), t(T.moralIntro));
    setText($("karoTag"), "KARO");
    setText($("karoHead"), t(T.karoHead));
    setHTML($("karoBox"), t(T.karo));
    setText($("quizHead"), t(T.quiz));
    setText($("newQuiz"), t(T.newQuiz));
    setText($("foot"), t(T.foot));
    $("langBtn").textContent = lang === "en" ? "اردو" : "EN";
    $("langBtn").setAttribute("aria-pressed", lang === "ur" ? "true" : "false");
    document.body.classList.toggle("urdu", lang === "ur");
    document.body.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
    document.documentElement.lang = lang === "ur" ? "ur" : "en";
    paintParts();
    paintComp();
    paintMorals();
    updateCompProg();
    updateMoralScore();
    updateScore();
  }

  function paintParts(){
    var box = $("partsCards");
    box.innerHTML = "";
    PARTS.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "pcard " + c.cls + (openParts[c.id] ? " open" : "");
      b.innerHTML = '<span class="em">' + c.em + '</span><h3></h3><p class="body"></p><p class="tap-hint"></p>';
      setText(b.querySelector("h3"), t(c.title));
      setText(b.querySelector(".body"), t(c.body));
      setText(b.querySelector(".tap-hint"), t(T.tapHint));
      b.addEventListener("click", function(){
        openParts[c.id] = !openParts[c.id];
        paintParts();
        if (openParts[c.id]) doSpeak(t(c.title) + ". " + t(c.body), lang);
      });
      box.appendChild(b);
    });
  }

  function updateCompProg(){
    var n = Object.keys(compDone).length;
    setText($("compProg"), n + " / 5 " + t(T.compProg));
  }

  function paintComp(){
    var box = $("compGrid");
    box.innerHTML = "";
    COMP.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "comp-btn" + (compDone[c.id] ? " done" : "");
      b.setAttribute("aria-pressed", compSel === c.id ? "true" : "false");
      b.innerHTML = '<span class="cem">' + c.em + '</span><span class="clab"></span>';
      setText(b.querySelector(".clab"), t(c.q));
      b.addEventListener("click", function(){
        compSel = c.id;
        compDone[c.id] = true;
        paintComp();
        setText($("compAns"), t(c.q) + " → " + t(c.a));
        $("compAns").classList.add("show");
        updateCompProg();
        doSpeak(t(c.q) + ". " + t(c.a), lang);
      });
      box.appendChild(b);
    });
    if (compSel){
      var cur = COMP.filter(function(x){ return x.id === compSel; })[0];
      if (cur){
        setText($("compAns"), t(cur.q) + " → " + t(cur.a));
        $("compAns").classList.add("show");
      }
    } else {
      $("compAns").classList.remove("show");
    }
  }

  function updateMoralScore(){
    setText($("moralScore"), t(T.moralScoreLbl) + " " + moralScore + " / 3");
  }

  function paintMorals(){
    var box = $("moralGame");
    box.innerHTML = "";
    MORALS.forEach(function(m, mi){
      var div = document.createElement("div");
      div.className = "scenario";
      div.innerHTML = '<span class="sem">' + m.em + '</span><h3 class="stitle"></h3><p class="sbody"></p><div class="moral-opts"></div>';
      setText(div.querySelector(".stitle"), t(m.title));
      setText(div.querySelector(".sbody"), t(m.body));
      var opts = div.querySelector(".moral-opts");
      var locked = !!moralAnswered[m.id];
      m.opts.forEach(function(o){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "mopt";
        setText(b, o.k.toUpperCase() + ") " + t(o));
        if (locked){
          b.disabled = true;
          if (o.k === m.correct) b.classList.add("right");
          else if (moralAnswered[m.id] === o.k && o.k !== m.correct) b.classList.add("wrong");
        } else {
          b.addEventListener("click", function(){
            if (moralAnswered[m.id]) return;
            moralAnswered[m.id] = o.k;
            var ok = o.k === m.correct;
            if (ok) moralScore++;
            paintMorals();
            updateMoralScore();
            doSpeak((ok ? "Shabash! " : "") + t(m.exp), lang);
          });
        }
        opts.appendChild(b);
      });
      if (locked){
        var fb = document.createElement("p");
        fb.className = "mfb show";
        var ok = moralAnswered[m.id] === m.correct;
        setText(fb, (ok ? "✓ " : "→ ") + t(m.exp));
        div.appendChild(fb);
      }
      box.appendChild(div);
    });
  }

  function updateScore(){
    var n = Object.keys(quizAnswered).length;
    var s = quizScore;
    setText($("scorePill"), (lang === "en" ? "Score " : "اسکور ") + s + " / 5");
    if (n >= 5){
      $("doneBox").classList.add("show");
      setText($("doneTitle"), t(T.doneTitle));
      setText($("doneDetail"), s >= 4 ? t(T.doneAll) : t(T.doneSome) + " (" + s + "/5)");
    } else {
      $("doneBox").classList.remove("show");
    }
  }

  function paintQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizAnswered = {};
    quizScore = 0;
    QUIZ.forEach(function(item, qi){
      var div = document.createElement("div");
      div.className = "q";
      var p = document.createElement("p");
      setText(p, (qi + 1) + ". " + t(item.q));
      div.appendChild(p);
      item.opts.forEach(function(o){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt";
        setText(b, o.k.toUpperCase() + ") " + t(o));
        b.addEventListener("click", function(){
          if (quizAnswered[qi]) return;
          quizAnswered[qi] = true;
          var ok = o.k === item.correct;
          if (ok) quizScore++;
          var opts = div.querySelectorAll(".opt");
          opts.forEach(function(ob, oi){
            ob.disabled = true;
            if (item.opts[oi].k === item.correct) ob.classList.add("right");
            else if (ob === b && !ok) ob.classList.add("wrong");
          });
          var fb = document.createElement("p");
          fb.className = "fb show";
          setText(fb, (ok ? "✓ " : "→ ") + t(item.exp));
          div.appendChild(fb);
          updateScore();
        });
        div.appendChild(b);
      });
      box.appendChild(div);
    });
    updateScore();
  }

  function rebuildQuizLabels(){
    var answered = quizAnswered;
    var score = quizScore;
    var keys = Object.keys(answered);
    if (keys.length === 0){ paintQuiz(); return; }
    var box = $("quizBox");
    box.innerHTML = "";
    QUIZ.forEach(function(item, qi){
      var div = document.createElement("div");
      div.className = "q";
      var p = document.createElement("p");
      setText(p, (qi + 1) + ". " + t(item.q));
      div.appendChild(p);
      var locked = !!answered[qi];
      item.opts.forEach(function(o){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt";
        setText(b, o.k.toUpperCase() + ") " + t(o));
        if (locked){
          b.disabled = true;
          if (o.k === item.correct) b.classList.add("right");
        } else {
          b.addEventListener("click", function(){
            if (quizAnswered[qi]) return;
            quizAnswered[qi] = true;
            var ok = o.k === item.correct;
            if (ok) quizScore++;
            var opts = div.querySelectorAll(".opt");
            opts.forEach(function(ob, oi){
              ob.disabled = true;
              if (item.opts[oi].k === item.correct) ob.classList.add("right");
              else if (ob === b && !ok) ob.classList.add("wrong");
            });
            var fb = document.createElement("p");
            fb.className = "fb show";
            setText(fb, (ok ? "✓ " : "→ ") + t(item.exp));
            div.appendChild(fb);
            updateScore();
          });
        }
        div.appendChild(b);
      });
      if (locked){
        var fb = document.createElement("p");
        fb.className = "fb show";
        setText(fb, "→ " + t(item.exp));
        div.appendChild(fb);
      }
      box.appendChild(div);
    });
    quizScore = score;
    quizAnswered = answered;
    updateScore();
  }

  var speakTimer = null;
  function doSpeak(text, speakLang){
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = speakLang === "ur" ? "ur-PK" : "en-US";
    u.rate = 0.92;
    try {
      var voices = window.speechSynthesis.getVoices() || [];
      var prefer = speakLang === "ur"
        ? voices.filter(function(v){ return /ur|hi-IN|hi_IN/i.test(v.lang); })
        : voices.filter(function(v){ return /^en/i.test(v.lang); });
      if (prefer[0]) u.voice = prefer[0];
    } catch (e) {}
    window.speechSynthesis.speak(u);
  }

  function speakPage(){
    var bits = [t(T.title), t(T.hook), t(T.sam), t(STORY.title), t(STORY.body), t(T.misaal)];
    doSpeak(bits.join(". "), lang);
  }

  $("langBtn").addEventListener("click", function(){
    lang = lang === "en" ? "ur" : "en";
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    paintStatic();
    rebuildQuizLabels();
  });

  $("speakBtn").addEventListener("click", function(){
    if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
    if (window.speechSynthesis && window.speechSynthesis.speaking){
      window.speechSynthesis.cancel();
      return;
    }
    speakTimer = setTimeout(function(){ speakTimer = null; speakPage(); }, 80);
  });

  $("speakStory").addEventListener("click", function(){
    doSpeak(t(STORY.title) + ". " + t(STORY.body), lang);
  });

  $("resetComp").addEventListener("click", function(){
    compDone = {};
    compSel = null;
    paintComp();
    updateCompProg();
    $("compAns").classList.remove("show");
  });

  $("newQuiz").addEventListener("click", function(){ paintQuiz(); });

  paintStatic();
  paintQuiz();
})();
</script>
