.fact-pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 4px 0}
.pill{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:5px 10px;font-weight:800;font-size:15px;direction:ltr}
.pill.rad{border-color:var(--rad);color:var(--rad)}
.pill.dia{border-color:var(--dia);color:var(--dia)}
.pill.circ{border-color:var(--circ);color:var(--circ)}
.fig-wrap{margin:10px auto 4px;max-width:220px}

.detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
.hintbox{margin-top:14px;border:2px solid var(--accent);background:#e7f6ef;border-radius:14px;padding:11px 14px;font-size:var(--fs-xs);color:var(--accent);font-weight:700;line-height:1.55;display:none}
.hintbox.show{display:block}
.panel{margin-top:22px}
.panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
.prog{margin:0 0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft)}
.btns{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}

.btns button:disabled{opacity:.4;cursor:default}
.quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.qhead h2{font-size:var(--fs-lg);font-weight:800;margin:0;flex:1}
.q{margin-bottom:26px}
.q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
.q p.ur{font-weight:400}
.gloss{margin:-6px 0 12px;font-size:var(--fs-xs);color:var(--ink-soft);font-weight:600;line-height:1.45}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);min-height:50px;touch-action:manipulation}
.opt.ur{text-align:right;line-height:var(--lh)}
.opt:disabled{cursor:default}
.fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
.fb.show{display:block}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--ink-soft)}
@media (min-width:820px){
.wrap{max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;grid-template-areas:"bar bar" "head head" "tabs tabs" "story story" "left right" "quiz quiz" "foot foot";align-items:start}

function addBlurb(stage,ch){var em=document.createElement("div");em.className="hero-em";em.textContent=ch.em||"⭕";stage.appendChild(em);var box=document.createElement("div");box.className="card-box";setText(box,t(ch.blurb));stage.appendChild(box)}
function addShow(stage,ch){var h=document.createElement("div");h.className="num-hero";h.textContent=ch.show;stage.appendChild(h)}
function addPills(stage,ch){if(!ch.pills||!ch.pills.length)return;var row=document.createElement("div");row.className="fact-pills";ch.pills.forEach(function(p){var s=document.createElement("span");s.className="pill";var pl=p.toLowerCase();if(pl.indexOf("radius")>=0||pl.indexOf("نصف")>=0)s.className+=" rad";else if(pl.indexOf("diameter")>=0||pl.indexOf("قطر")>=0&&pl.indexOf("نصف")<0)s.className+=" dia";else if(pl.indexOf("circ")>=0||pl.indexOf("محیط")>=0||pl.indexOf("perimeter")>=0)s.className+=" circ";s.textContent=p;row.appendChild(s)});stage.appendChild(row)}
function circleSVG(kind){
  var cx=90,cy=78,r=48;
  var base='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fff8e8" stroke="#1e2a1a" stroke-width="3"/>';
  var centre='<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#1e2a1a"/>';
  if(kind==="radius"){
    return '<svg viewBox="0 0 180 140" aria-hidden="true">'+base+centre+'<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r)+'" y2="'+cy+'" stroke="#2f6fb5" stroke-width="3.5" stroke-linecap="round"/><text x="'+(cx+r/2)+'" y="'+(cy-8)+'" text-anchor="middle" font-size="12" font-weight="800" fill="#2f6fb5">r</text><text x="90" y="132" text-anchor="middle" font-size="11" font-weight="800" fill="#1d6b52">radius</text></svg>';
  }
  if(kind==="diameter"){
    return '<svg viewBox="0 0 180 140" aria-hidden="true">'+base+centre+'<line x1="'+(cx-r)+'" y1="'+cy+'" x2="'+(cx+r)+'" y2="'+cy+'" stroke="#d4701f" stroke-width="3.5" stroke-linecap="round"/><text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" font-size="12" font-weight="800" fill="#d4701f">d</text><text x="90" y="132" text-anchor="middle" font-size="11" font-weight="800" fill="#1d6b52">diameter</text></svg>';
  }
  if(kind==="circ"){
    return '<svg viewBox="0 0 180 140" aria-hidden="true"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fff8e8" stroke="#7a4fb5" stroke-width="5"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r-6)+'" fill="none" stroke="#1e2a1a" stroke-width="2" stroke-dasharray="4 3"/>'+centre+'<text x="90" y="132" text-anchor="middle" font-size="11" font-weight="800" fill="#7a4fb5">circumference</text></svg>';
  }
  if(kind==="centre"){
    return '<svg viewBox="0 0 180 140" aria-hidden="true">'+base+'<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="#c4453a"/><text x="90" y="132" text-anchor="middle" font-size="11" font-weight="800" fill="#1d6b52">centre</text></svg>';
  }
  return '<svg viewBox="0 0 180 140" aria-hidden="true">'+base+centre+'<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r)+'" y2="'+cy+'" stroke="#2f6fb5" stroke-width="3"/><line x1="'+(cx-r)+'" y1="'+(cy+18)+'" x2="'+(cx+r)+'" y2="'+(cy+18)+'" stroke="#d4701f" stroke-width="3"/><text x="'+(cx+r/2)+'" y="'+(cy-6)+'" font-size="11" font-weight="800" fill="#2f6fb5" text-anchor="middle">r</text><text x="'+cx+'" y="'+(cy+34)+'" font-size="11" font-weight="800" fill="#d4701f" text-anchor="middle">d = 2r</text></svg>';
}
function symSVG(kind){
  if(kind==="coin"){
    return '<svg viewBox="0 0 180 140" aria-hidden="true"><circle cx="90" cy="70" r="48" fill="#f5d76e" stroke="#1e2a1a" stroke-width="3"/><circle cx="90" cy="70" r="34" fill="none" stroke="#c9a227" stroke-width="2"/><line x1="90" y1="22" x2="90" y2="118" stroke="#1d6b52" stroke-width="2" stroke-dasharray="4 3"/><line x1="42" y1="70" x2="138" y2="70" stroke="#1d6b52" stroke-width="2" stroke-dasharray="4 3"/><line x1="56" y1="36" x2="124" y2="104" stroke="#2f6fb5" stroke-width="1.5" stroke-dasharray="3 3"/><text x="90" y="132" text-anchor="middle" font-size="11" font-weight="800" fill="#1d6b52">many lines</text></svg>';
  }
  if(kind==="butterfly"){
    return '<svg viewBox="0 0 180 140" aria-hidden="true"><ellipse cx="58" cy="55" rx="28" ry="22" fill="#7ab8e8" stroke="#1e2a1a" stroke-width="2"/><ellipse cx="122" cy="55" rx="28" ry="22" fill="#7ab8e8" stroke="#1e2a1a" stroke-width="2"/><ellipse cx="62" cy="88" rx="22" ry="16" fill="#9ad0f5" stroke="#1e2a1a" stroke-width="2"/><ellipse cx="118" cy="88" rx="22" ry="16" fill="#9ad0f5" stroke="#1e2a1a" stroke-width="2"/><rect x="86" y="40" width="8" height="60" rx="4" fill="#1e2a1a"/><line x1="90" y1="28" x2="90" y2="118" stroke="#1d6b52" stroke-width="2.5" stroke-dasharray="4 3"/><circle cx="90" cy="36" r="5" fill="#1e2a1a"/><text x="90" y="132" text-anchor="middle" font-size="11" font-weight="800" fill="#1d6b52">1 line</text></svg>';
  }
  if(kind==="leaf"){
    return '<svg viewBox="0 0 180 140" aria-hidden="true"><path d="M90 28 C120 40 140 70 118 105 C100 120 80 115 70 95 C55 70 60 40 90 28 Z" fill="#8fbf6b" stroke="#1e2a1a" stroke-width="2"/><path d="M118 70 Q145 55 150 40 Q130 50 118 70 Z" fill="#c4453a" opacity=".55"/><line x1="90" y1="30" x2="90" y2="110" stroke="#999" stroke-width="2" stroke-dasharray="3 3"/><text x="90" y="132" text-anchor="middle" font-size="11" font-weight="800" fill="#c4453a">no match</text></svg>';
  }
  return '<svg viewBox="0 0 180 140" aria-hidden="true"><path d="M90 105 C70 85 48 70 48 52 C48 38 60 30 72 30 C80 30 86 35 90 42" fill="#f5a0b8" stroke="#1e2a1a" stroke-width="2"/><line x1="90" y1="28" x2="90" y2="115" stroke="#1d6b52" stroke-width="2.5" stroke-dasharray="4 3"/><path d="M90 105 C110 85 132 70 132 52 C132 38 120 30 108 30 C100 30 94 35 90 42" fill="none" stroke="#1e2a1a" stroke-width="2" stroke-dasharray="5 4"/><text x="90" y="132" text-anchor="middle" font-size="11" font-weight="800" fill="#1d6b52">mirror half</text></svg>';
}
function addFig(stage,html){var d=document.createElement("div");d.className="fig-wrap";d.innerHTML=html;stage.appendChild(d)}
function showStep(i,n){setText($("statechip"),(i+1)+" / "+n);$("statechip").className="statechip"+(lang==="ur"?" ur":"")}
function showWin(msg){setText($("headline"),msg);$("statechip").className="statechip win"+(lang==="ur"?" ur":"");setText($("statechip"),t(T.nice))}
function showMiss(){setText($("headline"),t(T.oops));$("statechip").className="statechip miss"+(lang==="ur"?" ur":"");setText($("statechip"),t(T.oops))}
function stableOrder(key,arr){if(optKey!==key){optKey=key;optOrder=shuffle(arr)}return optOrder}
function clearHint(){$("hintbox").classList.remove("show")}

function renderChoices(ch,doneMap,prefix,modeKey,total,rerender){
  var box=$("actionBox");box.innerHTML="";
  var choices=document.createElement("div");choices.className="save-choices";
  stableOrder(prefix+"-"+ch.id,ch.opts.slice()).forEach(function(opt){
    var b=document.createElement("button");b.type="button";
    var en=opt.en||"";
    if(/^\d/.test(en)&&en.indexOf("cm")>=0&&en.length<=8){b.className="numc";b.textContent=en;b.setAttribute("dir","ltr")}
    else setText(b,t(opt));
    if(doneMap[ch.id]&&opt.id===ch.correct)b.classList.add("right");
    b.disabled=!!doneMap[ch.id];
    b.addEventListener("click",function(){if(doneMap[ch.id])return;if(opt.id===ch.correct){markWin(prefix,ch.id,doneMap,modeKey,total);rerender()}else{b.classList.add("wrong");showMiss()}});
    choices.appendChild(b);
  });
  box.appendChild(choices);
}

function renderParts(){
  var ch=PARTS[partsIdx],stage=prepScene();
  addBlurb(stage,ch);addShow(stage,ch);addPills(stage,ch);
  addFig(stage,circleSVG(ch.fig||"radius"));
  showStep(partsIdx,PARTS.length);setText($("headline"),t(ch.title));
  setText($("detail"),partsDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(partsDone[ch.id])showWin(t(ch.done));
  renderChoices(ch,partsDone,"parts","parts",PARTS.length,renderParts);
  setText($("prog"),t(T.progParts)+": "+Object.keys(partsDone).length+"/"+PARTS.length);
}
function renderCompute(){
  var ch=COMPUTE[compIdx],stage=prepScene();
  addBlurb(stage,ch);addShow(stage,ch);
  var eq=document.createElement("div");eq.className="eqline";
  if(ch.kind==="dFromR")eq.textContent="d = 2 × "+ch.r+"  →  ?";
  else eq.textContent="r = "+ch.d+" ÷ 2  →  ?";
  stage.appendChild(eq);
  addFig(stage,circleSVG(ch.kind==="dFromR"?"radius":"diameter"));
  showStep(compIdx,COMPUTE.length);setText($("headline"),t(ch.title));
  setText($("detail"),compDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(compDone[ch.id])showWin(t(ch.done));
  renderChoices(ch,compDone,"comp","compute",COMPUTE.length,renderCompute);
  setText($("prog"),t(T.progCompute)+": "+Object.keys(compDone).length+"/"+COMPUTE.length);
}
function renderSym(){
  var ch=SYM[symIdx],stage=prepScene();
  addBlurb(stage,ch);addShow(stage,ch);
  addFig(stage,symSVG(ch.fig||"coin"));
  showStep(symIdx,SYM.length);setText($("headline"),t(ch.title));
  setText($("detail"),symDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(symDone[ch.id])showWin(t(ch.done));
  renderChoices(ch,symDone,"sym","sym",SYM.length,renderSym);
  setText($("prog"),t(T.progSym)+": "+Object.keys(symDone).length+"/"+SYM.length);
}

function pickQuiz(){
  var pin=[],rest=[],i;quizState={};
  for(i=0;i<QUIZ.length;i++){if(QUIZ[i].pin)pin.push(QUIZ[i]);else rest.push(QUIZ[i])}
  rest=shuffle(rest);quizSet=shuffle(pin.concat(rest.slice(0,5-pin.length)));
}
function renderQuiz(){
  var box=$("quizBox");box.innerHTML="";
  quizSet.forEach(function(item,qi){
    var wrap=document.createElement("div");wrap.className="q";
    var p=document.createElement("p");setText(p,(qi+1)+". "+t(item.q));wrap.appendChild(p);
    if(lang==="en"&&item.ru){var g=document.createElement("p");g.className="gloss";g.textContent=item.ru;wrap.appendChild(g)}
    var st=quizState[item.id];
    item.opts.forEach(function(opt,oi){
      var b=document.createElement("button");b.type="button";b.className="opt"+(lang==="ur"?" ur":"");setText(b,t(opt));
      if(st&&oi===item.correct)b.classList.add("right");
      if(st==="no"&&quizState[item.id+"-pick"]===oi&&oi!==item.correct)b.classList.add("wrong");
      if(st)b.disabled=true;
      b.addEventListener("click",function(){
        if(quizState[item.id])return;
        quizState[item.id+"-pick"]=oi;
        if(oi===item.correct){quizState[item.id]="ok";b.classList.add("right");award("quiz-"+item.id,1)}
        else{quizState[item.id]="no";b.classList.add("wrong");var kids=wrap.querySelectorAll(".opt");if(kids[item.correct])kids[item.correct].classList.add("right")}
        fb.classList.add("show");
        var all=wrap.querySelectorAll(".opt"),k;for(k=0;k<all.length;k++)all[k].disabled=true;
      });
      wrap.appendChild(b);
    });
    var fb=document.createElement("p");fb.className="fb"+(st?" show":"");setText(fb,t(item.why));wrap.appendChild(fb);
    box.appendChild(wrap);
  });
}
function storyHtml(){if(mode==="parts")return t(T.storyParts);if(mode==="compute")return t(T.storyCompute);return t(T.storySym)}
function currentTip(){if(mode==="parts")return T.tipParts;if(mode==="compute")return T.tipCompute;return T.tipSym}
function tabBadges(){
  function lab(btn,label,key){btn.innerHTML="";var span=document.createElement("span");setText(span,t(label));btn.appendChild(span);if(doneModes[key]){var b=document.createElement("span");b.className="badge";b.textContent=" ★";btn.appendChild(b)}}
  lab($("tabParts"),T.tabParts,"parts");lab($("tabCompute"),T.tabCompute,"compute");lab($("tabSym"),T.tabSym,"sym");
  $("tabParts").setAttribute("aria-pressed",mode==="parts"?"true":"false");
  $("tabCompute").setAttribute("aria-pressed",mode==="compute"?"true":"false");
  $("tabSym").setAttribute("aria-pressed",mode==="sym"?"true":"false");
}
function renderCurrent(){if(mode==="parts")renderParts();else if(mode==="compute")renderCompute();else renderSym()}
function setMode(m){mode=m;optKey="";renderCurrent();applyChrome()}
function applyChrome(){
  setText($("title"),t(T.title));setText($("subtitle"),t(T.sub));
  $("story").innerHTML=storyHtml();$("story").classList.toggle("ur",lang==="ur");$("story").setAttribute("dir",lang==="ur"?"rtl":"ltr");
  setText($("ctlHead"),t(T.ctl));setText($("nextBtn"),t(T.next));setText($("hintBtn"),t(T.hint));setText($("resetBtn"),t(T.reset));
  setText($("quizHead"),t(T.quiz));setText($("newQuiz"),t(T.newQuiz));
  $("langBtn").textContent=(lang==="en")?"اردو":"EN";$("langBtn").setAttribute("aria-pressed",lang==="ur"?"true":"false");
  document.body.classList.toggle("urdu",lang==="ur");
  document.documentElement.lang=(lang==="ur")?"ur":"en";
  document.documentElement.dir=(lang==="ur")?"rtl":"ltr";
  document.title=t(T.title)+" | AI4Kids Class 4";
  tabBadges();
  var foot=document.querySelector("footer p");
  if(foot)setText(foot,foot.getAttribute(lang==="ur"?"data-ur":"data-en"));
}
function applyLang(){applyChrome();renderCurrent();renderQuiz()}
function next(){
  optKey="";
  if(mode==="parts"){partsIdx=(partsIdx+1)%PARTS.length;renderParts()}
  else if(mode==="compute"){compIdx=(compIdx+1)%COMPUTE.length;renderCompute()}
  else{symIdx=(symIdx+1)%SYM.length;renderSym()}
}
function showHint(){
  var h=mode==="parts"?PARTS[partsIdx].hint:(mode==="compute"?COMPUTE[compIdx].hint:SYM[symIdx].hint);
  var hb=$("hintbox");setText(hb,t(h));hb.classList.add("show");
}
function resetMode(){
  if(mode==="parts"){Object.keys(awarded).forEach(function(k){if(k.indexOf("parts-")===0||k==="mode-parts")delete awarded[k]});partsDone={};partsIdx=0;doneModes.parts=false;recountStars();renderParts()}
  else if(mode==="compute"){Object.keys(awarded).forEach(function(k){if(k.indexOf("comp-")===0||k==="mode-compute")delete awarded[k]});compDone={};compIdx=0;doneModes.compute=false;recountStars();renderCompute()}
  else{Object.keys(awarded).forEach(function(k){if(k.indexOf("sym-")===0||k==="mode-sym")delete awarded[k]});symDone={};symIdx=0;doneModes.sym=false;recountStars();renderSym()}
  optKey="";tabBadges();applyChrome();
}
function cleanSpeakText(s){return String(s||"").replace(/<[^>]+>/g," ").replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&amp;/g,"&").replace(/\s+/g," ").trim()}
function buildSpeakText(){
  var bits=[];bits.push(t(T.title));bits.push(cleanSpeakText(storyHtml()));
  bits.push(cleanSpeakText(($("headline")&&$("headline").textContent)||""));
  bits.push(cleanSpeakText(($("detail")&&$("detail").textContent)||""));
  bits.push(t(currentTip()));return bits.filter(Boolean).join(". ");
}
function pickVoice(voices,want){
  var i,v,L;for(i=0;i<voices.length;i++){v=voices[i];L=(v.lang||"").toLowerCase().replace("_","-");if(L.indexOf(want)===0)return v}
  for(i=0;i<voices.length;i++){v=voices[i];L=(v.lang||"").toLowerCase().replace("_","-");if(L.indexOf("en")===0)return v}
  return voices[0]||null;
}
function setSpeaking(on){var btn=$("speakBtn");if(!btn)return;btn.setAttribute("aria-pressed",on?"true":"false");btn.style.opacity=on?"0.65":""}
function doSpeak(text,asLang){
  var u=new SpeechSynthesisUtterance(text);u.rate=0.92;u.lang=(asLang==="ur")?"ur-PK":"en-US";
  var voices=window.speechSynthesis.getVoices()||[];var voice=pickVoice(voices,asLang==="ur"?"ur":"en");if(voice)u.voice=voice;
  u.onstart=function(){setSpeaking(true)};u.onend=function(){setSpeaking(false)};
  u.onerror=function(){setSpeaking(false);if(asLang==="ur"){var fallback=cleanSpeakText(T.title.en+". "+T.storyParts.en+". "+T.tipParts.en);var u2=new SpeechSynthesisUtterance(fallback);u2.lang="en-US";u2.rate=0.92;var v2=pickVoice(window.speechSynthesis.getVoices()||[],"en");if(v2)u2.voice=v2;u2.onstart=function(){setSpeaking(true)};u2.onend=u2.onerror=function(){setSpeaking(false)};window.speechSynthesis.speak(u2)}};
  window.speechSynthesis.speak(u);
}
if("speechSynthesis" in window){
  try{window.speechSynthesis.getVoices()}catch(e0){}
  if(typeof window.speechSynthesis.addEventListener==="function"){window.speechSynthesis.addEventListener("voiceschanged",function(){try{window.speechSynthesis.getVoices()}catch(e1){}})}
}else{var noBtn=$("speakBtn");if(noBtn){noBtn.disabled=true;noBtn.title="Voice not available on this device"}}
$("langBtn").addEventListener("click",function(){lang=(lang==="en")?"ur":"en";applyLang()});
$("tabParts").addEventListener("click",function(){setMode("parts")});
$("tabCompute").addEventListener("click",function(){setMode("compute")});
$("tabSym").addEventListener("click",function(){setMode("sym")});
$("nextBtn").addEventListener("click",next);
$("hintBtn").addEventListener("click",showHint);
$("resetBtn").addEventListener("click",resetMode);
$("newQuiz").addEventListener("click",function(){pickQuiz();renderQuiz()});
$("speakBtn").addEventListener("click",function(){
  try{
    if(!("speechSynthesis" in window))return;
    var text=buildSpeakText();if(!text)return;
    if(speakTimer){clearTimeout(speakTimer);speakTimer=null}
    window.speechSynthesis.cancel();setSpeaking(false);
    var speakLang=lang;
    speakTimer=setTimeout(function(){speakTimer=null;doSpeak(text,speakLang)},80);
  }catch(e){setSpeaking(false)}
});
pickQuiz();applyLang();
})();
</script>
