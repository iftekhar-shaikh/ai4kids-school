attery use kar sakti hai. Wires ko wall socket se kabhi na joro; baray se madad lo."},"mis":{"en":"A fan uses a motor to spin its blades. A toy car uses a motor to turn its wheels. A rickshaw also uses a motor to move.","ru":"Fan blades ghoomane ke liye motor use karta hai. Toy car wheels ghumane ke liye motor use karti hai. Rickshaw bhi move hone ke liye motor use karta hai."},"do":{"en":"Watch an adult switch on a fan or toy. Notice the still body and the moving part. Say: energy in, movement out!","ru":"Baray ko fan ya toy on karte dekho. Still body aur moving part notice karo. Bolo: energy in, movement out!"},"demo":{"type":"motor","title":{"en":"Power the motor","ru":"Motor ko power do"},"ins":{"en":"Press the battery button to start and stop the pretend motor.","ru":"Nakli motor start aur stop karne ke liye battery button dabao."},"off":{"en":"Motor is resting. Add battery power.","ru":"Motor rest kar rahi hai. Battery power do."},"on":{"en":"Motor is spinning! Energy became movement.","ru":"Motor ghoom rahi hai! Energy movement ban gayi."}},"quiz":[{"q":{"en":"What is a motor?","ru":"Motor kya cheez hai?"},"o":[{"en":"A thing that does work","ru":"Ek aisi cheez jo kaam karti hai"},{"en":"A toy","ru":"Ek khilona"},{"en":"A water jug","ru":"Ek paani ka jug"},{"en":"Food","ru":"Ek khana"}],"c":0,"e":{"en":"A motor helps a machine do work by making movement.","ru":"Motor movement bana kar machine ko kaam karne mein madad deti hai."}},{"q":{"en":"What can a motor be used for?","ru":"Motor kis liye istemal hoti hai?"},"o":[{"en":"House jobs","ru":"Ghar ke kaamon ke liye"},{"en":"Toys","ru":"Khilono ke liye"},{"en":"Moving water","ru":"Pani bharne ke liye"},{"en":"All of these","ru":"Sab options sahi hain"}],"c":3,"e":{"en":"Motors are used in many tools, toys, and machines.","ru":"Motors bohot se tools, toys aur machines mein use hoti hain."}},{"q":{"en":"What does a motor need to spin?","ru":"Motor ko ghoomne ke liye kya chahiye?"},"o":[{"en":"Electric power","ru"
