<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Computer pehchano | AI4Kids Grade 1 AI</title><style>:root{--ink:#202b36;--muted:#526170;--paper:#fffdf7;--line:#d8d1c3;--blue:#216a9b;--blue2:#dcecf6;--orange:#d4752c;--green:#2e8657;--red:#bb4b45;--yellow:#fff0bd;--purple:#765297;--fs-cap:clamp(.9rem,2.4vw,1.08rem);--fs-xs:clamp(1.05rem,2.8vw,1.25rem);--fs-sm:clamp(1.18rem,3.15vw,1.45rem);--fs-md:clamp(1.32rem,3.55vw,1.7rem);--fs-lg:clamp(1.62rem,4.3vw,2.15rem);--fs-xl:clamp(2rem,5.5vw,2.75rem)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--fs-sm);line-height:1.52;padding:0 0 48px}.wrap{max-width:1080px;margin:auto;padding:0 16px}.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:15px 0 7px}.brand{font-weight:850;color:var(--blue);margin-right:auto;font-size:var(--fs-xs)}button{font:inherit;color:inherit}.chip,.tab{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:8px 15px;cursor:pointer;font-weight:800;min-height:44px}.chip[aria-pressed=true],.tab[aria-pressed=true]{background:var(--ink);color:#fff}.chip:focus-visible,.tab:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}h1{font-size:var(--fs-xl);line-height:1.2;margin:10px 0 3px}.sub{color:var(--muted);margin:0 0 14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{border-radius:14px;flex:1 1 16%;font-size:var(--fs-cap);min-height:52px}.demo-wrap{border:3px solid var(--ink);border-radius:22px;background:linear-gradient(140deg,#e9f4fa,#f9efdb);padding:16px;margin-bottom:19px}.demo-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.demo-head h2{font-size:var(--fs-lg);margin:0;flex:1}.demo-instruction{margin:5px 0 12px;color:var(--muted)}.demo-stage{background:#fffefb;border:2px solid var(--line);border-radius:17px;padding:13px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:3px solid var(--line);background:#fff;border-radius:15px;min-height:100px;padding:11px 8px;cursor:pointer;text-align:center;font-weight:800}.card.selected{border-color:var(--blue);background:var(--blue2)}.emoji{display:block;font-size:2.25rem;line-height:1.1;margin-bottom:5px}.play{background:var(--green);border:3px solid #236b45;color:#fff;border-radius:16px;padding:11px 18px;min-height:54px;cursor:pointer;font-weight:850;font-size:var(--fs-md);width:100%;margin-top:13px}.demo-msg{border-radius:13px;background:var(--yellow);padding:10px 13px;margin:11px 0 0;font-weight:750}.lesson-grid{display:grid;gap:13px}.lesson{border:3px solid var(--line);border-radius:18px;background:#fff;padding:15px 17px;scroll-margin-top:12px}.tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:3px 13px;font-size:var(--fs-cap);font-weight:900;margin-bottom:9px}.hook .tag{background:var(--orange)}.misaal .tag{background:var(--green)}.karo .tag{background:var(--purple)}.lesson p{margin:0;font-size:var(--fs-sm)}.quiz{border-top:3px solid var(--ink);margin-top:29px;padding-top:20px}.quiz h2{font-size:var(--fs-lg);margin:0 0 17px}.q{margin-bottom:25px}.q-title{font-size:var(--fs-md);font-weight:800;margin:0 0 10px}.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;margin:8px 0;cursor:pointer;min-height:52px;font-size:var(--fs-sm)}.opt.right{border-color:var(--green);background:#e5f3eb;font-weight:800}.opt.wrong{border-color:var(--red);background:#fae5e1}.opt:disabled{cursor:default}.feedback{display:none;color:var(--muted);font-size:var(--fs-xs);margin:7px 0}.feedback.show{display:block}.score{display:none;text-align:center;border:3px solid var(--green);background:#e5f3eb;border-radius:15px;padding:12px;font-size:var(--fs-md);font-weight:900}.score.show{display:block}footer{margin-top:31px;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:var(--fs-cap)}@media(min-width:760px){.lesson-grid{grid-template-columns:1fr 1fr}.demo-wrap{padding:20px}.cards{grid-template-columns:repeat(3,1fr)}.play{width:auto;min-width:190px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><div class="wrap"><div class="bar"><span class="brand" id="brand"></span><button class="chip" id="langBtn" type="button" aria-pressed="false">Roman Urdu</button><button class="chip" id="speakBtn" type="button">🔊</button></div><header><h1 id="title"></h1><p class="sub" id="subtitle"></p></header><nav class="tabs" id="tabs"></nav><section class="demo-wrap" id="demo"><div class="demo-head"><h2 id="demoTitle"></h2><button class="chip" id="launch" type="button">Play</button></div><p class="demo-instruction" id="demoInstruction"></p><div class="demo-stage" id="demoStage"></div></section><main class="lesson-grid"><article class="lesson hook" id="hook"><span class="tag" id="hookTag"></span><p id="hookText"></p></article><article class="lesson" id="samjhao"><span class="tag" id="samjhaoTag"></span><p id="samjhaoText"></p></article><article class="lesson misaal" id="misaal"><span class="tag" id="misaalTag"></span><p id="misaalText"></p></article><article class="lesson karo" id="karo"><span class="tag" id="karoTag"></span><p id="karoText"></p></article></main><section class="quiz"><h2 id="quizHead"></h2><div id="quizBox"></div><div class="score" id="score"></div></section><footer id="foot"></footer></div><script>const DATA={"title":{"en":"Computer pehchano","ru":"Computer pehchano"},"desc":{"en":"Meet the screen, keyboard, and mouse","ru":"Screen, keyboard aur mouse se milo"},"lesson":{"hook":{"en":"Look at a computer. What helps us see, type, and choose?","ru":"Computer ko dekho. Humein dekhne, type karne aur choose karne mein kya madad deta hai?"},"samjhao":{"en":"The screen shows pictures and words. The keyboard has keys for typing. The mouse moves a pointer so we can choose.","ru":"Screen tasveer aur alfaaz dikhati hai. Keyboard par typing keys hoti hain. Mouse pointer ko chalata hai."},"misaal":{"en":"Use the keyboard to write. Look at the screen to see. Click with the mouse.","ru":"Keyboard se likho, screen par dekho aur mouse se click karo."},"karo":{"en":"With an adult, point to a screen, keyboard, or mouse. Never pull a wire.","ru":"Baray ke saath screen, keyboard ya mouse ki taraf ishara karo. Wire na khencho."}},"demo":{"type":"cards","title":{"en":"Find the computer part","ru":"Computer ka hissa dhoondo"},"instruction":{"en":"Choose a part to learn what it does.","ru":"Kisi hissay ko chuno aur dekho woh kya karta hai."},"items":[["🖥️","Screen","Screen","The screen shows pictures and words.","Screen tasveer aur alfaaz dikhati hai."],["⌨️","Keyboard","Keyboard","The keyboard helps us type.","Keyboard typing mein madad karta hai."],["🖱️","Mouse","Mouse","The mouse helps us point and click.","Mouse point aur click mein madad karta hai."]]},"quiz":[{"q":{"en":"Which part is the screen?","ru":"Computer ke kis hissa ko screen kehte hain?"},"options":[{"en":"The part where we see pictures","ru":"Jis par hum tasveer dekhte hain"},{"en":"The part where we type","ru":"Jis par hum type karte hain"},{"en":"The part that moves the computer","ru":"Jis se hum computer chalatay hain"},{"en":"The printer","ru":"Jis se hum printer ko jor'tay hain"}],"correct":0,"explanation":{"en":"The screen shows pictures and words.","ru":"Screen wahi hoti hai jise hum tasveer dekhne ke liye istemal karte hain."}},{"q":{"en":"What is a keyboard used for?","ru":"Keyboard kis cheez ke liye istemal hota hai?"},"options":[{"en":"Typing numbers","ru":"Number type karne ke liye"},{"en":"Controlling the mouse","ru":"Mouse ko control karne ke liye"},{"en":"Saving a favourite","ru":"Pasandi data save karne ke liye"},{"en":"Turning the computer off","ru":"Computer ko on/off karne ke liye"}],"correct":0,"explanation":{"en":"Keyboard keys help us type.","ru":"Keyboard par hum type karte hain, jismein numbers aur letters dono hotay hain."}},{"q":{"en":"What does a mouse do?","ru":"Mouse kis kaam ke liye istemal hota hai?"},"options":[{"en":"Moves the pointer on screen","ru":"Screen par pointer ko move karne ke liye"},{"en":"Typing","ru":"Typing karne ke liye"},{"en":"Making the internet","ru":"Games khelne ke liye"},{"en":"Printing pages","ru":"Internet chalane ke liye"}],"correct":0,"explanation":{"en":"A mouse helps us point and click.","ru":"Mouse se hum screen par pointer ko move kar sakte hain."}},{"q":{"en":"Which part is not used to print?","ru":"In mein se kaunsa hissa print karne mein madad nahi karta?"},"options":[{"en":"Screen","ru":"Screen"},{"en":"Keyboard","ru":"Keyboard"},{"en":"Mouse","ru":"Mouse"},{"en":"Printer","ru":"Printer"}],"correct":0,"explanation":{"en":"A screen shows; a printer prints.","ru":"Screen printing ke liye istemal nahi hoti, balki woh sirf dikhane ke liye hoti hai."}},{"q":{"en":"What kind of buttons are most common on a keyboard?","ru":"Keyboard par sab se zyada kaunse button hote hain?"},"options":[{"en":"Fruit buttons","ru":"Fruits ke liye"},{"en":"Letter buttons","ru":"Letters ke liye"},{"en":"Shape buttons","ru":"Shapes ke liye"},{"en":"Colour buttons","ru":"Colors ke liye"}],"correct":1,"explanation":{"en":"Many keys are letters.","ru":"Keyboard par sabse zyada letters ke button hote hain, jise hum typing ke liye istemal karte hain."}}]};</script><script>const D=DATA;(function(){let lang='en',selected=0,played=false,checked=false;const $=id=>document.getElementById(id),t=x=>x&&typeof x==='object'?(x[lang]||x.en||''):String(x||'');function put(e,x){e.textContent=t(x)}function label(k){return {play:{en:'Play',ru:'Khelo'},hook:{en:'HOOK',ru:'HOOK'},samjhao:{en:'SAMJHAO',ru:'SAMJHAO'},misaal:{en:'MISAAL',ru:'MISAAL'},karo:{en:'KARO',ru:'KARO'}}[k]}function render(){document.title=t(D.title)+' | AI4Kids Grade 1 AI';put($('brand'),{en:'AI4Kids · Grade 1 · AI & Technology',ru:'AI4Kids · Jamaat 1 · AI aur Technology'});put($('title'),D.title);put($('subtitle'),D.desc);$('langBtn').textContent=lang==='en'?'Roman Urdu':'English';$('langBtn').setAttribute('aria-pressed',lang==='ru');['hook','samjhao','misaal','karo'].forEach(k=>{put($(k+'Tag'),label(k));put($(k+'Text'),D.lesson[k])});put($('demoTitle'),D.demo.title);put($('demoInstruction'),D.demo.instruction);put($('quizHead'),{en:'Quiz — 5 questions',ru:'Quiz — 5 sawaal'});put($('foot'),{en:'AI4Kids · Grade 1 AI & Technology · Offline lesson',ru:'AI4Kids · Jamaat 1 AI aur Technology · Offline lesson'});let tabs=$('tabs');tabs.innerHTML='';['play','hook','samjhao','misaal','karo'].forEach(k=>{let b=document.createElement('button');b.className='tab';b.textContent=t(label(k));b.setAttribute('aria-pressed',k==='play');b.onclick=()=>{($(k==='play'?'demo':k)).scrollIntoView({behavior:'smooth'})};tabs.appendChild(b)});demo();quiz()}function demo(){let s=$('demoStage');s.innerHTML='';let row=document.createElement('div');row.className='cards';D.demo.items.forEach((it,i)=>{let b=document.createElement('button');b.className='card'+(selected===i?' selected':'');let e=document.createElement('span');e.className='emoji';e.textContent=it[0];b.appendChild(e);b.appendChild(document.createTextNode(t({en:it[1],ru:it[2]})));b.onclick=()=>{selected=i;played=false;checked=false;demo()};row.appendChild(b)});s.appendChild(row);let b=document.createElement('button');b.className='play';b.textContent=D.demo.type==='sort'?(lang==='en'?'✅ Check machine':'✅ Machine check karo'):(lang==='en'?'▶ Play':'▶ Chalao');b.onclick=()=>{if(D.demo.type==='sort')checked=true;else played=true;demo()};s.appendChild(b);let m=document.createElement('div');m.className='demo-msg';let it=D.demo.items[selected];m.textContent=D.demo.type==='sort'?(checked?t(it[4]):t({en:'Choose a machine, then check it.',ru:'Machine chuno, phir check karo.'})):(played?t({en:it[3],ru:it[4]}):t({en:'Choose a card, then press Play.',ru:'Card chuno, phir Play dabao.'}));s.appendChild(m)}function quiz(){let box=$('quizBox');box.innerHTML='';let done=0,score=0;D.quiz.forEach((q,qi)=>{let w=document.createElement('div');w.className='q';let p=document.createElement('p');p.className='q-title';p.textContent=(qi+1)+'. '+t(q.q);w.appendChild(p);let f=document.createElement('p');f.className='feedback';q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+t(o);b.onclick=()=>{if(w.dataset.done)return;w.dataset.done=1;done++;let ok=i===q.correct;if(ok)score++;w.querySelectorAll('button').forEach((x,j)=>{x.disabled=true;if(j===q.correct)x.classList.add('right');else if(j===i)x.classList.add('wrong')});f.textContent=(ok?'✓ ':'✗ ')+t(q.explanation);f.className='feedback show';if(done===5){$('score').textContent=(lang==='en'?'Your score: ':'Tumhara score: ')+score+' / 5';$('score').className='score show'}};w.appendChild(b)});w.appendChild(f);box.appendChild(w)})}$('langBtn').onclick=()=>{lang=lang==='en'?'ru':'en';selected=0;played=false;checked=false;render()};$('speakBtn').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t(D.title)+' '+t(D.desc));u.lang=lang==='ru'?'en-PK':'en-US';u.rate=.9;speechSynthesis.speak(u)}};$('launch').onclick=()=>{$('demo').scrollIntoView({behavior:'smooth'});demo()};render()})();</script></body></html>
