id="lang" class="chip" aria-pressed="false">Roman Urdu</button><button id="speak" class="chip" aria-label="Play">🔊</button></div><header><h1 id="title"></h1><p id="sub" class="sub"></p></header><nav id="tabs" class="tabs"></nav><div class="columns"><div id="left"></div><div id="right"></div></div><div id="lessons"></div><section class="quiz"><h2 id="qh"></h2><div id="quiz"></div><div id="score" class="score"></div></section><footer id="foot"></footer></main><script>const DATA={"title":{"en":"Paragraphs parhna","ur":"Paragraphs parhna"},"desc":{"en":"Short paragraphs aur stories reading","ur":"Short paragraphs aur stories reading"},"sections":[{"key":"hook","tag":{"en":"HOOK","ur":"HOOK"},"body":{"en":"Have you ever read a short story and wondered what happened next? A paragraph is a small group of ideas. Today we will read, notice details, and find the main idea.","ur":"Aaj hum baat karne wale hain kahaniyon aur paragraphs ke bare mein. Kya aap ko pata hai ki ek choti si kahani kaise bahut si baatein bata sakti hai? Jaise jab aap bazaar jaate hain, wahan bohot saare log hotay hain aur sab ki kahaniyan alag hoti hain!"}},{"key":"samjhao","tag":{"en":"SAMJHAO","ur":"SAMJHAO"},"body":{"en":"A paragraph is a group of sentences about one main idea. Other sentences give details. A story has characters and events: who is there and what happens.","ur":"Paragraphs uss likhai ka hissa hain jahan hum ek ya do ideas ko saaf taur pe bayaan karte hain. Har paragraph mein ek mukhya idea hota hai aur uske aas-paas chhoti baatein hoti hain jo is idea ko samjhati hain.\n\nJab hum paragraphs padhte hain, to humein yeh samajh ata hai ke likhne wala kya kehna chahta hai. Jaise agar koi paragraph cricket ke bare mein hai, to us mein cricket ki khel, players ya match ka zikr ho sakta hai.\n\nKahani bhi ek tarah ki paragraph hoti hai. Kahani mein characters hote hain, ek plot hai aur kuch events hote hain. Samajh jao, agar hum ek kahani padhein, to humein uske characters aur events ko sochna padta hai.\n\nKahin bhi padhte waqt, hamesha dhyan rakho ke paragraph ka suru karne ka tareeqa, uska contents aur khatam hone ka tareeqa kaisa hai. Isse humein poori kahani ya baat samajhne mein madad milti hai."}},{"key":"misaal","tag":{"en":"MISAAL","ur":"MISAAL"},"body":{"en":"Read: “Ali went to the market. He saw bright fruit and bought two mangoes. He took them home.” The main idea is that Ali went to the market and bought fruit.","ur":"Chalo, ab hum bazaar ka example lete hain. Jab aap apne ghar ke paas ke bazaar jaate hain, to aap dekhte hain ke wahan bohot saare dukaan hain. Ek dukaan par chalta hai ek aadmi inside dekhta hai ke kya achha hai kharidne ke liye. Wahan kabab, biryani, aur mithaiyan bhee hain. Un sab ki kahaniyaan hain — kyun wahan log aaye hain, kya kharid rahe hain aur kya kha rahe hain. Yeh ek chhota sa paragraph ban sakta hai."}},{"key":"karo","tag":{"en":"KARO","ur":"KARO"},"body":{"en":"Read a tiny story at home. Tell a friend its main idea and two details. Then write one or two paragraphs about a friend, home, or an adventure.","ur":"Aap apne ghar par ya school mein ek chhoti si kahani likho. Kahani mein aapke dost, ghar ya kisi adventure ka zikr ho. Koshish karo ke aapka likha hua ek ya do paragraphs mein ho. Us kahani ko apne friends ko sunao!\n\n## SAWAAL\n1. Paragraph kya hota hai?\n2. Kahani aur paragraph mein kya farq hai?\n3. Aapne kis topic par kahani likhi aur usmein kya tha?\n\nEnglish Ma'am"}}],"quiz":[{"q":{"en":"What does Ayesha’s bright smile seem like?","ur":"Ayesha aik chamakdaar sitara hai. Usay har waqt muskurate dekhna pasand hai. Aap ko Ayesha ki muskurahat kaisi lagti hai?"},"opts":[{"en":"Very good","ur":"Bohat achi"},{"en":"Bad","ur":"Kharab"},{"en":"Ordinary","ur":"Aam"},{"en":"Not at all","ur":"Bilkul nahi"}],"ans":0,"exp":{"en":"Yeh sahi hai kyun ke Ayesha ki muskurahat sab ko khushi deti hai.","ur":"Yeh sahi hai kyun ke Ayesha ki muskurahat sab ko khushi deti hai."}},{"q":{"en":"Why is Lahore Fort famous in the question?","ur":"Lahore ka shahi qila aik mashhoor tha. Yeh kis liye jaana jata hai?"},"opts":[{"en":"For its beauty","ur":"Khubsurati ke liye"},{"en":"For eating food","ur":"Khana khane ke liye"},{"en":"For meeting friends","ur":"Doston se milne ke liye"},{"en":"For shopping","ur":"Shopping ke liye"}],"ans":0,"exp":{"en":"Yeh sahi hai kyun ke shahi qila ki khubsurati har kisi ko pasand aati hai.","ur":"Yeh sahi hai kyun ke shahi qila ki khubsurati har kisi ko pasand aati hai."}},{"q":{"en":"Which toy is the favourite in the question?","ur":"Khilone bachon ka pyaar hote hain. Aapka favorit khilona kya hai?"},"opts":[{"en":"Car","ur":"Gaddi"},{"en":"Ball","ur":"Ball"},{"en":"Doll","ur":"Doll"},{"en":"Everything","ur":"Sab kuch"}],"ans":2,"exp":{"en":"Yeh sahi hai kyun ke ghar mein ladkiyan aksar dolls se khelna pasand karti hain.","ur":"Yeh sahi hai kyun ke ghar mein ladkiyan aksar dolls se khelna pasand karti hain."}},{"q":{"en":"How do colourful fish make you feel?","ur":"Rang birangi machhliyan paani mein khel rahi hain. Aap ko ye nazar dekh kar kaisa mehsoos hota hai?"},"opts":[{"en":"Happy","ur":"Khushi"},{"en":"Sad","ur":"Gham"},{"en":"Bored","ur":"Boring"},{"en":"Hateful","ur":"Nafrat"}],"ans":0,"exp":{"en":"Yeh sahi hai kyun ke rang birangi machhliyan dekh kar sab ko khushi mehsoos hoti hai.","ur":"Yeh sahi hai kyun ke rang birangi machhliyan dekh kar sab ko khushi mehsoos hoti hai."}},{"q":{"en":"Which season is the favourite in the question?","ur":"Saal ke har mawasim ka apna maza hota hai. Aapka favorit mawasim kaunsa hai?"},"opts":[{"en":"Winter","ur":"Sitar"},{"en":"Summer","ur":"Garama"},{"en":"Snow","ur":"Baraf"},{"en":"Rainy season","ur":"Baarish"}],"ans":3,"exp":{"en":"Yeh sahi hai kyun ke baarish mein khelne ka maza alag hota hai.","ur":"Yeh sahi hai kyun ke baarish mein khelne ka maza alag hota hai."}}],"demo":{"type":"paragraph","title":{"en":"Read the tiny story","ur":"Chhoti kahani parho"},"story":[{"en":"Mina went to the park.","ur":"Mina pa
