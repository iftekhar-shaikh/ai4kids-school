\n\1</head><body><main class="wrap"><div class="bar"><span id="brand" class="brand"></span><button id="lang" class="chip" aria-pressed="false">Roman Urdu</button><button id="speak" class="chip" aria-label="Play">🔊</button></div><header><h1 id="title"></h1><p id="sub" class="sub"></p></header><nav id="tabs" class="tabs"></nav><div class="columns"><div id="left"></div><div id="right"></div></div><div id="lessons"></div><section class="quiz"><h2 id="qh"></h2><div id="quiz"></div><div id="score" class="score"></div></section><footer id="foot"></footer></main><script>const DATA={"title":{"en":"Nouns aur verbs","ur":"Nouns aur verbs"},"desc":{"en":"Grammar — nouns aur verbs","ur":"Grammar — nouns aur verbs"},"sections":[{"key":"hook","tag":{"en":"HOOK","ur":"HOOK"},"body":{"en":"Look around you. Can you name a thing, person, or place? Can you show an action too? Today we will find nouns and verbs in easy sentences.","ur":"Kya aapne kabhi socha hai ke aapke paas kitne nouns aur verbs hain? Jaise, jab aap bazaar jaate hain, to aap kya dekhte hain? Kya wo sirf cheezein hain, ya unke kuch khaas actions bhi hain?"}},{"key":"samjhao","tag":{"en":"SAMJHAO","ur":"SAMJHAO"},"body":{"en":"A noun names a person, place, animal, or thing: cat, school, friend, book. A verb tells an action: run, eat, play, read. In “The cat drinks milk,” cat is the noun and drinks is the verb.","ur":"Nouns woh lafz hain jo kisi cheez, shakhs, ya jagah ko darshate hain. Jaise \"billi\", \"school\", aur \"dost\" nouns hain. Jab aap kisi cheez ki taraf ishara karte hain ya uska naam lete hain, to aap ek noun ka istemal kar rahe hain.\n\nAb baat karte hain verbs ki. Verbs woh lafz hain jo kisi action ya kaam ko darshate hain. Jaise \"khelna\", \"khana\", aur \"dhoondna\" verbs hain. Jab aap kuch kar rahe hote hain, to aap ek verb ka istemal karte hain.\n\nAb hum dekhte hain ke nouns aur verbs mil ke kaise ek khaas sentence banate hain. Jaise, \"Billi khel rahi hai.\" Is sentence mein \"billi\" ek noun hai aur \"khel rahi hai\" ek verb hai.\n\nZindagi ke har pehlu mein nouns aur verbs hote hain. Aap jab dost se baatchit karte hain, to aap nouns aur verbs ka istemal karte hain. Isliye inhe samajhna bohot zaroori hai!"}},{"key":"misaal","tag":{"en":"MISAAL","ur":"MISAAL"},"body":{"en":"In “Children play cricket,” children is a noun and play is a verb. In “Sara reads a book,” Sara and book are nouns, while reads is a verb.","ur":"Sochiye, aap nahi hain, lekin aapke dost cricket khel rahe hain. Aap kaise unhe describe karte hain? Jaise, \"Bachay cricket khel rahe hain.\" Yahan \"bachay\" ek noun hai aur \"khel rahe hain\" verb hai. Aap jab bazaar jaate hain, to aap \"log khareed rahe hain\" bhi keh sakte hain. Yahan \"log\" noun hai aur \"khareed rahe hain\" verb."}},{"key":"karo","tag":{"en":"KARO","ur":"KARO"},"body":{"en":"Write five nouns and five verbs with a partner. Mix them to make sentences such as “The cat drinks milk” or “The boy runs.”","ur":"Activity ke liye aap ghar ya school mein is tarah ka kaam kar sakte hain: Aap apne dost ke saath mil kar 5 nouns aur 5 verbs likhein. Phir aap inhe mila kar sentences banayein. Jaise, agar aapne \"billi\" socha to aap keh sakte hain, \"Billi doodh pi rahi hai.\" Is tarah aap mazeed sentences banakar English seekh sakte hain!\n\n## SAWAAL\n1. Noun kya hota hai? Ek misaal do.\n2. Verb kya hota hai? Ek misaal do.\n3. \"Larka daud raha hai\" mein larka kya hai aur daud raha hai kya hai?\n\nBest of luck, Student! \nEnglish Ma'am."}}],"quiz":[{"q":{"en":"Is “dost” (friend) a noun or a verb?","ur":"Dost, kya yeh noun hai ya verb?"},"opts":[{"en":"Noun","ur":"Noun"},{"en":"Verb","ur":"Verb"},{"en":"Both","ur":"Dono"},{"en":"Nothing","ur":"Kuch nahi"}],"ans":0,"exp":{"en":"Dost ek noun hai, jo insaan ko darshata hai.","ur":"Dost ek noun hai, jo insaan ko darshata hai."}},{"q":{"en":"Is “daudna” (to run) a verb?","ur":"Kya 'daudna' ek verb hai?"},"opts":[{"en":"Yes","ur":"Haan"},{"en":"No","ur":"Nahi"},{"en":"Nothing","ur":"Kuch nahi"},{"en":"Maybe","ur":"Shayad"}],"ans":0,"exp":{"en":"Daudna ek action hai, isliye yeh verb hai.","ur":"Daudna ek action hai, isliye yeh verb hai."}},{"q":{"en":"What kind of word is “kitaab” (book)?","ur":"'Kitaab' kis cheez ka naam hai?"},"opts":[{"en":"Noun","ur":"Noun"},{"en":"Verb","ur":"Verb"},{"en":"Adjective","ur":"Adjective"},{"en":"Pronoun","ur":"Pronoun"}],"ans":0,"exp":{"en":"Kitaab ek cheez ka naam hai, isliye yeh noun hai.","ur":"Kitaab ek cheez ka naam hai, isliye yeh noun hai."}},{"q":{"en":"What kind of action is “khana khana” (eating)?","ur":"'Khana khana' kis tarah ka kaam hai?"},"opts":[{"en":"Noun","ur":"Noun"},{"en":"Verb","ur":"Verb"},{"en":"Both","ur":"Dono"},{"en":"Nothing","ur":"Kuch nahi"}],"ans":1,"exp":{"en":"Khana khana ek action hai, isliye yeh verb hai.","ur":"Khana khana ek action hai, isliye yeh verb hai."}},{"q":{"en":"What does “shahri” show in the brief?","ur":"'Shahri' kis cheez ko darshata hai?"},"opts":[{"en":"Noun","ur":"Noun"},{"en":"Verb","ur":"Verb"},{"en":"Adjective","ur":"Adjective"},{"en":"Adverb","ur":"Adverb"}],"ans":0,"exp":{"en":"Shahri ek noun hai, jo ek insani community ko darshata hai.","ur":"Shahri ek noun hai, jo ek insani community ko darshata hai."}}],"demo":{"type":"classify","title":{"en":"Sort the words","ur":"Lafz sort karo"},"prompt":{"en":"Tap a word, then tap Noun or Verb.","ur":"Lafz chuo, phir Noun ya Verb chuo."},"cards":[["cat","billi","noun"],["run","daurna","verb"],["school","school","noun"],["read","parhna","verb"]]}};(function(){"use strict";var d=DATA,lang="en",tab="play",sel=null,qd=0,sc=0,last="";function $(x){return document.getElementById(x)}function t(x){return x&&typeof x==="object"?(x[lang]||x.en||""):String(x||"")}function set(e,x){if(!e)return;e.textContent=t(x);e.dir=lang==="ur"?"rtl":"ltr"}function say(x){last=t(x);try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(last);u.lang=lang==="ur"?"ur-PK":"en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}function btn(x,c,f
