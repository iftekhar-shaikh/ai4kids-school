<script>var DATA={"title":{"en":"Fractions intro","ur":"Fractions intro"},"sub":{"en":"Understand a whole, half, one-third, and quarter by sharing equally.","ur":"Whole, half, one-third aur quarter ko barabar sharing se samjho."},"lesson":{"hook":{"en":"A plate of biryani or a pizza can be shared. Today we learn names for equal parts: half, one-third, and quarter.","ur":"Biryani ki plate ya pizza share kiya ja sakta hai. Aaj hum barabar hisson ke naam seekhenge: half, one-third aur quarter."},"samjhao":{"en":"A fraction names equal parts of a whole. Split a whole into 2 equal parts: each is 1/2, a half. Split it into 3: each is 1/3, one-third. Split it into 4: each is 1/4, a quarter.","ur":"Fraction whole ke barabar hisson ka naam batata hai. Whole ko 2 barabar hisson mein baanto: har hissa 1/2, yani half. 3 mein baanto: 1/3, yani one-third. 4 mein baanto: 1/4, yani quarter."},"misaal":{"en":"A 100-rupee fare shared by 2 people is 50 rupees each: one half. Shared by 4, it is 25 rupees each: one quarter.","ur":"100 rupay ka fare 2 logon mein baantein to har ek ko 50 rupay: one half. 4 mein baantein to har ek ko 25 rupay: one quarter."},"karo":{"en":"Use paper or fruit. Make 2, 3, and 4 equal pieces. Name one piece and then name all the pieces together as one whole.","ur":"Kaghaz ya fruit use karo. 2, 3 aur 4 barabar pieces banao. Ek piece ka naam rakho aur sab pieces milkar whole kehlayenge."}},"quizTitle":{"en":"Fractions intro Quiz","ur":"Fractions intro Quiz"},"quiz":[{"q":{"en":"If a pizza is split into 2 equal parts, each part is what?","ur":"Pizza ko 2 barabar hisson mein baantein to har hissa kya hoga?"},"a":{"en":"Half","ur":"Adha (Half)"},"b":{"en":"One third","ur":"Ek tehayi (One Third)"},"c":{"en":"Quarter","ur":"Chaarma (Quarter)"},"d":{"en":"Whole","ur":"Pura (Whole)"},"correct":"a","explanation":{"en":"One of two equal parts is one half.","ur":"Do barabar hisson mein se ek hissa adha hota hai."}},{"q":{"en":"If a chocolate bar is split into 3 equal parts, each part is what?","ur":"Chocolate bar ko 3 barabar hisson mein baantein to har hissa kya hoga?"},"a":{"en":"Half","ur":"Adha (Half)"},"b":{"en":"One third","ur":"Ek tehayi (One Third)"},"c":{"en":"Quarter","ur":"Chaarma (Quarter)"},"d":{"en":"Whole","ur":"Pura (Whole)"},"correct":"b","explanation":{"en":"One of three equal parts is one third.","ur":"Teen barabar hisson mein se ek hissa ek tehayi hota hai."}},{"q":{"en":"If a cake is split into 4 equal parts, each part is what?","ur":"Cake ko 4 barabar hisson mein baantein to har hissa kya hoga?"},"a":{"en":"One third","ur":"Ek tehayi (One Third)"},"b":{"en":"Half","ur":"Adha (Half)"},"c":{"en":"Quarter","ur":"Chaarma (Quarter)"},"d":{"en":"Whole","ur":"Pura (Whole)"},"correct":"c","explanation":{"en":"One of four equal parts is a quarter.","ur":"Chaar barabar hisson mein se ek hissa quarter hota hai."}},{"q":{"en":"A lemon cut into 2 equal parts gives one what?","ur":"Limbu ko 2 barabar hisson mein kaatne par ek hissa kya hoga?"},"a":{"en":"Half","ur":"Adha (Half)"},"b":{"en":"One third","ur":"Ek tehayi (One Third)"},"c":{"en":"Quarter","ur":"Chaarma (Quarter)"},"d":{"en":"Whole","ur":"Pura (Whole)"},"correct":"a","explanation":{"en":"One of two equal pieces is a half.","ur":"Do barabar pieces mein se ek adha hota hai."}},{"q":{"en":"A samosa cut into 4 equal pieces gives each what?","ur":"Samosay ko 4 barabar hisson mein kaatne par har hissa kya hoga?"},"a":{"en":"One third","ur":"Ek tehayi (One Third)"},"b":{"en":"Half","ur":"Adha (Half)"},"c":{"en":"Quarter","ur":"Chaarma (Quarter)"},"d":{"en":"Whole","ur":"Pura (Whole)"},"correct":"c","explanation":{"en":"One of four equal pieces is a quarter.","ur":"Chaar barabar pieces mein se ek quarter hota hai."}}],"demo":"fractions"};</script>
<script>
(function(){"use strict";
var lang="en", tab="play", currentNumber=245, addStep=0, subStep=0, tableNum=2, fractionParts=2, score=0, answered=0;
function $(id){return document.getElementById(id)}

 document.title=t(DATA.title)+' | AI4Kids Grade 2 Math'; setText($('brand'),{en:'AI4Kids · Grade 2 · Math',ur:'AI4Kids · Grade 2 · Hisaab'}); setText($('title'),DATA.title); setText($('subtitle'),DATA.sub);
 var ls=labels(), tabBox=$('tabs'); tabBox.innerHTML=''; ['play','hook','samjhao','misaal','karo'].forEach(function(k){var b=document.createElement('button');b.type='button';b.textContent=t(ls[k]);b.setAttribute('aria-pressed',tab===k);b.onclick=function(){tab=k;render()};tabBox.appendChild(b)});
 var stage=$('stage'); if(tab==='play') stage.innerHTML=demo(DATA.demo); else stage.innerHTML='<article class="lesson '+tab+'"><span class="tag">'+esc(t(ls[tab]))+'</span><p>'+esc(t(DATA.lesson[tab]))+'</p></article>';
 if(tab==='play') bindDemo(DATA.demo); renderQuiz(); setText($('foot'),{en:'AI4Kids Grade 2 Math · Learn, try, and explain your thinking.',ur:'AI4Kids Grade 2 Math · Seekho, practice karo aur apni soch samjhao.'});
}
function demo(type){
 var L={numbers:{en:'Place-value explorer',ur:'Place value explorer'},addition:{en:'Carry-and-add lab',ur:'Carry ke saath jama lab'},subtraction:{en:'Borrow-and-minus lab',ur:'Borrowing ke saath minus lab'},tables:{en:'Table builder',ur:'Table builder'},division:{en:'Equal-share lab',ur:'Barabar taqseem lab'},fractions:{en:'Fraction cutter',ur:'Fractions kaatne wala'}}[type];
 var H='<div class="card"><h2 class="demo-title">'+esc(t(L))+'</h2>';
 if(type==='numbers') H+='<p class="hint">'+esc(t({en:'Tap a place to see its value.',ur:'Kisi place par tap karke us ki value dekho.'}))+'</p><div class="math-board"><div class="big-number" id="numValue">245</div><div class="place-buttons"><button class="small-btn" data-place="hundreds">'+esc(t({en:'Hundreds',ur:'Hundreds'}))+'</button><button class="small-btn" data-place="tens">'+esc(t({en:'Tens',ur:'Tens'}))+'</button><button class="small-btn" data-place="ones">'+esc(t({en:'Ones',ur:'Ones'}))+'</button></div><div class="readout" id="placeOut">'+esc(t({en:'Choose hundreds, tens, or ones.',ur:'Hundreds, tens ya ones choose karo.'}))+'</div></div><div class="actions"><button class="action" id="newNumber">'+esc(t({en:'New number',ur:'Naya number'}))+'</button></div>';
 if(type==='addition') H+='<p class="hint">'+esc(t({en:'Watch each column. A total of 10 or more makes a carry.',ur:'Har column dekho. 10 ya zyada ho to carry karo.'}))+'</p><div class="math-board"><div class="equation">245 + 178 = <span id="addAnswer">?</span></div><div class="steps" id="addSteps"></div><div class="actions"><button class="action" id="nextAdd">'+esc(t({en:'Show next step',ur:'Agla step dikhao'}))+'</button><button class="action alt" id="resetAdd">'+esc(t({en:'Start again',ur:'Dobara shuru'}))+'</button></div></div>';
 if(type==='subtraction') H+='<p class="hint">'+esc(t({en:'If the top digit is too small, borrow one from the next place.',ur:'Agar upar wala digit chhota ho to aglay place se borrow karo.'}))+'</p><div class="math-board"><div class="equation">84 − 36 = <span id="subAnswer">?</span></div><div class="steps" id="subSteps"></div><div class="actions"><button class="action" id="nextSub">'+esc(t({en:'Show next step',ur:'Agla step dikhao'}))+'</button><button class="action alt" id="resetSub">'+esc(t({en:'Start again',ur:'Dobara shuru'}))+'</button></div></div>';
 if(type==='tables') H+='<p class="hint">'+esc(t({en:'Choose a table. Tap a fact to highlight it.',ur:'Table choose karo. Kisi fact ko tap karke highlight karo.'}))+'</p><div class="table-buttons">'+[2,3,4,5,10].map(function(n){return '<button class="small-btn tablePick" data-n="'+n+'">'+n+' '+esc(t({en:'table',ur:'ki table'}))+'</button>'}).join('')+'</div><div class="grid-table" id="tableGrid"></div>';
 if(type==='division') H+='<p class="hint">'+esc(t({en:'Choose a sharing problem. Count equal groups.',ur:'Sharing ka sawal choose karo. Barabar groups gino.'}))+'</p><div class="table-buttons"><button class="small-btn divPick" data-total="12" data-groups="3">12 ÷ 3</button><button class="small-btn divPick" data-total="20" data-groups="5">20 ÷ 5</button><button class="small-btn divPick" data-total="30" data-groups="6">30 ÷ 6</button><button class="small-btn divPick" data-total="24" data-groups="4">24 ÷ 4</button></div><div class="math-board"><div class="equation" id="divEq">12 ÷ 3 = 4</div><div class="groups" id="groupDots"></div><div class="readout" id="divOut">'+esc(t({en:'Each group has 4.',ur:'Har group mein 4 hain.'}))+'</div></div>';
 if(type==='fractions') H+='<p class="hint">'+esc(t({en:'Choose how many equal parts make the whole.',ur:'Choose karo whole kitne barabar hisson mein hai.'}))+'</p><div class="fraction-buttons"><button class="small-btn fracPick" data-n="2">½ '+esc(t({en:'Half',ur:'Adha'}))+'</button><button class="small-btn fracPick" data-n="3">⅓ '+esc(t({en:'One third',ur:'Ek tehayi'}))+'</button><button class="small-btn fracPick" data-n="4">¼ '+esc(t({en:'Quarter',ur:'Chaarma'}))+'</button></div><div class="math-board"><div class="fraction-shape two" id="fractionShape"></div><div class="readout" id="fractionOut">'+esc(t({en:'One of 2 equal parts is one half.',ur:'2 barabar hisson mein se ek hissa adha hai.'}))+'</div></div>';
 return H+'</div>';
}
function bindDemo(type){
 if(type==='numbers'){document.querySelectorAll('[data-place]').forEach(function(b){b.onclick=function(){var p=b.dataset.place,v=String(currentNumber),i=p==='hundreds'?0:p==='tens'?1:2;document.querySelectorAll('[data-place]').forEach(function(x){x.classList.remove('active')});b.classList.add('active');$('placeOut').textContent=t({en:p[0].toUpperCase()+p.slice(1)+' digit is '+v[i]+'; its value is '+(Number(v[i])*({'hundreds':100,'tens':10,'ones':1}[p]))+'.',ur:p+' digit '+v[i]+' hai; is ki value '+(Number(v[i])*({'hundreds':100,'tens':10,'ones':1}[p]))+' hai.'})}});$('newNumber').onclick=function(){var nums=[326,481,560,709,893];currentNumber=nums[Math.floor(Math.random()*nums.length)];$('numValue').textContent=currentNumber;$('placeOut').textContent=t({en:'Choose hundreds, tens, or ones.',ur:'Hundreds, tens ya ones choose karo.'})}}
 if(type==='addition'){var steps=[{en:'Ones: 5 + 8 = 13. Write 3; carry 1.',ur:'Ones: 5 + 8 = 13. 3 likho; 1 carry karo.'},{en:'Tens: 4 + 7 + 1 = 12. Write 2; carry 1.',ur:'Tens: 4 + 7 + 1 = 12. 2 likho; 1 carry karo.'},{en:'Hundreds: 2 + 1 + 1 = 4.',ur:'Hundreds: 2 + 1 + 1 = 4.'}];function paint(){var box=$('addSteps');box.innerHTML=steps.map(function(s,i){return '<div class="step '+(i<addStep?'show':'')+'"><b>'+(i+1)+'.</b> '+esc(t(s))+'</div>'}).join('');$('addAnswer').textContent=addStep>=3?'423':'?'}$('nextAdd').onclick=function(){if(addStep<3)addStep++;paint()};$('resetAdd').onclick=function(){addStep=0;paint()};paint()}
 if(type==='subtraction'){var steps=[{en:'Ones: 4 is too small for 6. Borrow 1 ten: 8 becomes 7 and 4 becomes 14.',ur:'Ones: 4, 6 se chhota hai. 1 ten borrow karo: 8, 7 aur 4, 14 ban jata hai.'},{en:'Ones: 14 − 6 = 8.',ur:'Ones: 14 − 6 = 8.'},{en:'Tens: 7 − 3 = 4. Answer: 48.',ur:'Tens: 7 − 3 = 4. Jawab: 48.'}];function paint(){var box=$('subSteps');box.innerHTML=steps.map(function(s,i){return '<div class="step '+(i<subStep?'show':'')+'"><b>'+(i+1)+'.</b> '+esc(t(s))+'</div>'}).join('');$('subAnswer').textContent=subStep>=3?'48':'?'}$('nextSub').onclick=function(){if(subStep<3)subStep++;paint()};$('resetSub').onclick=function(){subStep=0;paint()};paint()}
 if(type==='tables'){function paint(){document.querySelectorAll('.tablePick').forEach(function(b){b.classList.toggle('active',Number(b.dataset.n)===tableNum)});$('tableGrid').innerHTML=Array.from({length:10},function(_,i){return '<button class="fact" data-fact="'+(i+1)+'">'+tableNum+' × '+(i+1)+' = '+(tableNum*(i+1))+'</button>'}).join('');document.querySelectorAll('[data-fact]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-fact]').forEach(function(x){x.classList.remove('on')});b.classList.add('on')}})}document.querySelectorAll('.tablePick').forEach(function(b){b.onclick=function(){tableNum=Number(b.dataset.n);paint()}});paint()}
 if(type==='division'){function paint(total,groups){var each=total/groups;$('divEq').textContent=total+' ÷ '+groups+' = '+each;$('groupDots').innerHTML=Array.from({length:groups},function(_,g){return '<span class="dot" title="group '+(g+1)+'">'+each+'</span>'}).join('');$('divOut').textContent=t({en:'There are '+groups+' equal groups. Each group has '+each+'.',ur:groups+' barabar groups hain. Har group mein '+each+' hain.'});document.querySelectorAll('.divPick').forEach(function(b){b.classList.toggle('active',Number(b.dataset.total)===total&&Number(b.dataset.groups)===groups)})}document.querySelectorAll('.divPick').forEach(function(b){b.onclick=function(){paint(Number(b.dataset.total),Number(b.dataset.groups))}});paint(12,3)}
 if(type==='fractions'){function paint(){var names={2:{en:'One of 2 equal parts is one half.',ur:'2 barabar hisson mein se ek hissa adha hai.'},3:{en:'One of 3 equal parts is one-third.',ur:'3 barabar hisson mein se ek hissa ek tehayi hai.'},4:{en:'One of 4 equal parts is one quarter.',ur:'4 barabar hisson mein se ek hissa chaarma hai.'}};$('fractionShape').className='fraction-shape '+(fractionParts===2?'two':fractionParts===3?'three':'four');$('fractionShape').innerHTML=Array.from({length:fractionParts},function(_,i){return '<div class="slice">'+(i===0?'1/'+fractionParts:'')+'</div>'}).join('');$('fractionOut').textContent=t(names[fractionParts]);document.querySelectorAll('.fracPick').forEach(function(b){b.classList.toggle('active',Number(b.dataset.n)===fractionParts)})}document.querySelectorAll('.fracPick').forEach(function(b){b.onclick=function(){fractionParts=Number(b.dataset.n);paint()}});paint()}
}
function renderQuiz(){var box=$('quizBox');box.innerHTML='';answered=0;score=0;DATA.quiz.forEach(function(q,qi){var wrap=document.createElement('section');wrap.className='q';var p=document.createElement('p');p.textContent=(qi+1)+'. '+t(q.q);p.dir=lang==='ur'?'rtl':'ltr';wrap.appendChild(p);['a','b','c','d'].forEach(function(k){var b=document.createElement('button');b.className='opt';b.type='button';b.textContent=k.toUpperCase()+'. '+t(q[k]);b.dir=lang==='ur'?'rtl':'ltr';b.onclick=function(){if(wrap.dataset.done)return;wrap.dataset.done='1';answered++;var ok=k===q.correct;b.classList.add(ok?'right':'wrong');if(!ok)wrap.querySelectorAll('.opt').forEach(function(x){if(x.textContent.indexOf(q.correct.toUpperCase()+'.')===0)x.classList.add('right')});if(ok)score++;var fb=wrap.querySelector('.feedback');fb.textContent=(ok?'✓ ':'✗ ')+t(q.explanation);fb.classList.add('show');fb.dir=lang==='ur'?'rtl':'ltr';wrap.querySelectorAll('button').forEach(function(x){x.disabled=true});if(answered===DATA.quiz.length){$('scoreBox').textContent=t({en:'Score: '+score+' / 5 — '+(score===5?'Excellent!':'Good practice!'),ur:'Score: '+score+' / 5 — '+(score===5?'Shabash!':'Achi practice!')});$('scoreBox').classList.add('show')}};wrap.appendChild(b)});var fb=document.createElement('div');fb.className='feedback';wrap.appendChild(fb);box.appendChild(wrap)});$('scoreBox').classList.remove('show');setText($('quizHead'),DATA.quizTitle)}
$('langBtn').onclick=function(){lang=lang==='en'?'ur':'en';render()};$('speakBtn').onclick=function(){var text=(document.querySelector('.stage')||document.body).innerText;if('speechSynthesis' in window){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang==='en'?'en-US':'ur-PK';speechSynthesis.speak(u)}};render();
})();
