<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magnets — مقناطیس | AI4Kids Class 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

  :root{
    --board:#eef0f4;
    --board-deep:#dde2e9;
    --north:#c9402e;
    --north-deep:#98301f;
    --south:#2f6fb5;
    --south-deep:#22518a;
    --ink:#1f2933;
    --ink-soft:#4a5661;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#3a4a5c;
    --pull:#2e7d4f;
    --push:#b85c38;

    --fs-cap:clamp(14px, 3.8vw, 16px);--fs-xs:clamp(16px, 4.2vw, 18px);--fs-sm:clamp(18px, 4.8vw, 20px);--fs-md:clamp(19px, 5.2vw, 22px);--fs-lg:clamp(22px, 6vw, 26px);--fs-xl:clamp(30px, 8vw, 38px);
    --lh:1.5;
  }
  /* Urdu is set larger than Latin — Nastaliq reads smaller at the same size. */
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);--fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);--fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--north);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 16px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  }
  .scene svg{display:block;width:100%;height:auto}
  /* --pw is the strength, 1 to 5. Tempo and travel are both tied to it, so a
     stronger force visibly moves more and beats faster instead of just reading
     a bigger word. */
  #magB{transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
  .pole{font-weight:800;font-family:"Baloo Bhaijaan 2",sans-serif;fill:#fff}
  .arrow{stroke-linecap:round;stroke-linejoin:round;fill:none;transition:opacity .3s ease}
  .nudge-pull{animation:pull calc(2.6s / var(--pw, 3)) ease-in-out infinite}
  .nudge-push{animation:push calc(2.6s / var(--pw, 3)) ease-in-out infinite}
  @keyframes pull{0%,100%{transform:translateX(0)}
                  50%{transform:translateX(calc(-1.6px * var(--pw, 3)))}}
  @keyframes push{0%,100%{transform:translateX(0)}
                  50%{transform:translateX(calc(1.8px * var(--pw, 3)))}}
  #force{animation:beatArrow calc(2.6s / var(--pw, 3)) ease-in-out infinite}
  @keyframes beatArrow{0%,100%{opacity:.75;transform:scaleX(1)}
                       50%{opacity:1;transform:scaleX(1.12)}}
  .cap{fill:var(--ink-soft);font-size:var(--fs-cap);font-weight:700;
       font-family:"Baloo Bhaijaan 2",sans-serif}
  body.urdu .cap{font-family:"Noto Nastaliq Urdu",serif}

  .readout{
    margin-top:-18px;position:relative;z-index:2;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px;
             background:var(--pull);transition:background .3s ease}
  .statechip.ur{padding:2px 14px 7px}
  .verdict{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .verdict.ur{line-height:1.95}
  .why{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .facts{display:flex;gap:10px;margin-top:16px}
  .fact{flex:1;border:2px solid var(--line);border-radius:14px;padding:11px 10px;text-align:center}
  .fact em{display:block;font-style:normal;font-size:var(--fs-cap);color:var(--ink-soft);
           font-weight:600;margin-bottom:4px}
  .fact b{display:block;font-size:var(--fs-sm);font-weight:800;line-height:1.3}
  .fact.strong{border-color:var(--accent);background:#eef1f5}

  .bars{display:flex;gap:4px;justify-content:center;margin-top:6px}
  .bars i{width:11px;height:11px;border-radius:3px;background:#dfe3e9}
  .bars i.on{background:var(--accent);animation:beat calc(2.6s / var(--pw, 3)) ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1);opacity:.75}
                  50%{transform:scale(1.4);opacity:1}}
  .rule{
    margin:8px 0 0;font-size:var(--fs-cap);font-weight:700;color:var(--ink-soft);
    text-align:center;transition:color .2s ease;
  }
  .rule.up{color:var(--pull)}
  .rule.down{color:var(--push)}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}
  body.urdu .why-note{
    border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;
    line-height:var(--lh);
  }

  .ctl{margin-top:22px}
  .ctl h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 12px;color:var(--ink-soft)}
  .bigbtn{
    width:100%;border:2px solid var(--ink);border-radius:16px;background:var(--paper);color:var(--ink);
    font:inherit;font-weight:800;font-size:var(--fs-sm);cursor:pointer;min-height:56px;margin-bottom:10px;
  }
  .bigbtn.on{background:var(--ink);color:var(--paper)}
  .bigbtn:active{transform:scale(.98)}

  .dist{margin-top:22px}
  .dist h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 12px;color:var(--ink-soft)}
  .row{display:flex;align-items:center;gap:10px}
  .row .name{flex:none;width:32%;max-width:140px;font-size:var(--fs-xs);font-weight:600}
  .seg{display:flex;gap:6px;flex:1}
  .seg button{
    flex:1;height:44px;border-radius:10px;border:2px solid var(--ink);
    background:var(--paper);cursor:pointer;padding:0;transition:background .15s ease;
  }
  .seg button:active{transform:scale(.94)}
  .seg button[aria-pressed="true"]{background:var(--accent)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--pull);background:#e6f4ec;font-weight:600}
  .opt.wrong{border-color:var(--push);background:#fbeae4}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;
      grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar"
        "head  head"
        "left  right"
        "quiz  quiz"
        "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar}
    .head{grid-area:head}
    .left{grid-area:left}
    .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px}
    footer{grid-area:foot}
    .ctl{margin-top:0}
  }

  @media (prefers-reduced-motion:reduce){
    .nudge-pull,.nudge-push{animation:none}
    *{transition-duration:.01ms !important}
  }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

      a:0,
      f:{en:"Closer means stronger, further means weaker — but a pull never turns into a push. Only turning the magnet around does that.",
         ur:"قریب ہو تو زیادہ، دور ہو تو کم — مگر کھنچاؤ کبھی دھکیلنے میں نہیں بدلتا۔ ایسا صرف مقناطیس کا رخ پلٹنے سے ہوتا ہے۔"} }
  ];

  function $(id){ return document.getElementById(id); }
  function t(o){ return o[lang]; }

  var LRI = "\u2066", PDI = "\u2069";
  var LATIN_RUN = /[A-Za-z0-9][A-Za-z0-9 .,+()\/@_-]*[A-Za-z0-9]|[A-Za-z0-9]/g;
  function isolate(s){ return s.replace(LATIN_RUN, function(m){ return LRI + m + PDI; }); }

  function setText(el, str){
    el.textContent = (lang === "ur") ? isolate(str) : str;
    el.classList.toggle("ur", lang === "ur");
    el.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
  }

  var NS = "http://www.w3.org/2000/svg";
  function mk(tag, a){
    var e = document.createElementNS(NS, tag);
    for (var k in a) e.setAttribute(k, a[k]);
    return e;
  }

  var TOP = 74, H = 52;

  // One magnet, drawn as two coloured halves with their pole letters.
  function drawMagnet(g, x, w, leftPole){
    var half = w / 2;
    var rightPole = (leftPole === "N") ? "S" : "N";
    var colL = (leftPole  === "N") ? "var(--north)" : "var(--south)";
    var colR = (rightPole === "N") ? "var(--north)" : "var(--south)";
    g.appendChild(mk("rect", {x:x, y:TOP, width:half, height:H, rx:6, fill:colL}));
    g.appendChild(mk("rect", {x:x+half, y:TOP, width:half, height:H, rx:6, fill:colR}));
    g.appendChild(mk("rect", {x:x, y:TOP, width:w, height:H, rx:6,
                              fill:"none", stroke:"var(--ink)", "stroke-width":2.5}));
    var t1 = mk("text", {x:x+half/2, y:TOP+H/2+7, "text-anchor":"middle", "class":"pole",
                         "font-size":"22"});
    t1.textContent = leftPole;
    var t2 = mk("text", {x:x+half+half/2, y:TOP+H/2+7, "text-anchor":"middle", "class":"pole",
                         "font-size":"22"});
    t2.textContent = rightPole;
    g.appendChild(t1); g.appendChild(t2);
  }

  function arrow(g, x1, x2, y, col, wide){
    g.appendChild(mk("line", {x1:x1, y1:y, x2:x2, y2:y, stroke:col,
                              "stroke-width":wide, "class":"arrow"}));
    var dir = (x2 > x1) ? 1 : -1;
    g.appendChild(mk("path", {d:"M"+(x2 - dir*8)+" "+(y-6)+" L"+x2+" "+y+" L"+(x2 - dir*8)+" "+(y+6),
                              stroke:col, "stroke-width":wide, "class":"arrow"}));
  }

  /* ---------- controls ---------- */
  $("flipBtn").addEventListener("click", function(){ flipped = !flipped; render(); });
  $("cutBtn").addEventListener("click", function(){ cut = !cut; render(); });

  for (var i=0;i<5;i++){
    (function(lvl){
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-pressed","false");
      b.setAttribute("aria-label","distance " + (lvl+1));
      b.setAttribute("data-i", lvl);
      b.addEventListener("click", function(){
        lastNear = near; near = lvl + 1; render();
      });
      $("seg").appendChild(b);
    })(i);
  }

  for (var j=0;j<5;j++) $("bars").appendChild(document.createElement("i"));

  /* ---------- render ---------- */
  var A_X = 26, A_W = 104, B_W = 104;

  function render(){
    var gap    = GAPS[near - 1];
    var bx     = A_X + A_W + gap;
    // Magnet A always shows S on the left, so N faces the gap.
    var facingA = "N";
    var facingB = flipped ? "S" : "N";
    var same    = (facingA === facingB);
    var power   = 5 - (near - 1);         // 5 at the closest step, 1 at the farthest

    var gA = $("magA"), gB = $("magB"), gF = $("force");
    gA.innerHTML = ""; gB.innerHTML = ""; gF.innerHTML = "";

    drawMagnet(gA, A_X, A_W, "S");

    if (cut){
      // Two halves, each a complete magnet with the same orientation as before.
      var piece = (B_W - 10) / 2;
      drawMagnet(gB, bx, piece, facingB);
      drawMagnet(gB, bx + piece + 10, piece, facingB);
    } else {
      drawMagnet(gB, bx, B_W, facingB);
    }

    gB.setAttribute("class", same ? "nudge-push" : "nudge-pull");

    // arrows sit below the magnets: outward for a push, inward for a pull.
    // Length and thickness carry the strength, so they read at every distance.
    var mid  = A_X + A_W + gap / 2;
    var len  = 12 + power * 5;
    var col  = same ? "var(--push)" : "var(--pull)";
    var wide = 2 + power * 0.7;
    var AY   = 150;
    if (same){
      arrow(gF, mid - 6, mid - 6 - len, AY, col, wide);
      arrow(gF, mid + 6, mid + 6 + len, AY, col, wide);
    } else {
      arrow(gF, mid - 6 - len, mid - 6, AY, col, wide);
      arrow(gF, mid + 6 + len, mid + 6, AY, col, wide);
    }

    // segment buttons
    Array.prototype.forEach.call($("seg").children, function(b, i){
      b.setAttribute("aria-pressed", i === (near - 1) ? "true" : "false");
    });
    // one number drives the tempo of the magnet, the arrows and the bars
    document.documentElement.style.setProperty("--pw", String(power));
    Array.prototype.forEach.call($("bars").children, function(b, i){
      b.classList.toggle("on", i < power);
      b.style.animationDelay = (i * 0.09) + "s";
    });

    // say out loud what just changed, then settle back to the rule
    var rl = $("forceRule");
    rl.classList.remove("up","down");
    if (near !== lastNear){
      var closer = near < lastNear;
      setText(rl, closer ? t(T.up) : t(T.down));
      rl.classList.add(closer ? "up" : "down");
      if (ruleTimer) clearTimeout(ruleTimer);
      ruleTimer = setTimeout(function(){
        setText(rl, t(T.rule));
        rl.classList.remove("up","down");
      }, 2200);
      lastNear = near;
    } else if (!rl.textContent){
      setText(rl, t(T.rule));
    }

    var m = same ? T.push : T.pull;
    $("statechip").style.background = same ? "var(--push)" : "var(--pull)";
    setText($("statechip"), t(m.chip));
    setText($("verdict"), t(m.v));
    setText($("why"), t(m.w));

    setText($("lblFacing"), t(T.facingLbl));
    $("valFacing").textContent = facingA + " — " + facingB;
    $("valFacing").setAttribute("dir","ltr");
    setText($("lblForce"), t(T.forceLbl));
    setText($("valForce"), t(T.strength[near - 1]));

    $("whyLbl").textContent = t(T.whyLbl);
    setText($("whyText"), cut ? t(T.cutNote) : t(m.note));

    setText($("flipBtn"), t(T.flip));
    setText($("cutBtn"), cut ? t(T.cutOn) : t(T.cutOff));
    $("cutBtn").classList.toggle("on", cut);

    $("capA").textContent = t(T.capA);
    $("capB").textContent = cut ? t(T.capBcut) : t(T.capB);
    $("gapLbl").textContent = t(T.gap);
    [$("capA"),$("capB"),$("gapLbl")].forEach(function(el){
      el.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
    });

    lastSpoken = t(m.v) + " " + t(m.w);
  }

  var lastSpoken = "";

  /* ---------- quiz ---------- */
  function buildQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    QUIZ.forEach(function(item){
      var wrap = document.createElement("div");
      wrap.className = "q";
      var q = document.createElement("p");
      setText(q, t(item.q));
      wrap.appendChild(q);
      var fb = document.createElement("p");
      fb.className = "fb";
      item.o.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang === "ur" ? " ur" : "");
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.textContent = t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done") === "1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show","fb");
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb);
      box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");

    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });

    setText($("ctlHead"), t(T.ctlHead));
    setText($("distHead"), t(T.distHead));
    setText($("distName"), t(T.distName));
    setText($("quizHead"), t(T.quiz));

    buildQuiz();
    render();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });

  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(lastSpoken);
      u.lang = (lang === "ur") ? "ur-PK" : "en-US";
      u.rate = 0.92;
      var voices = window.speechSynthesis.getVoices() || [];
      for (var i=0;i<voices.length;i++){
        if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(lang === "ur" ? "ur" : "en") === 0){
          u.voice = voices[i]; break;
        }
      }
      window.speechSynthesis.speak(u);
    }catch(e){ /* no voice available — stay quiet */ }
  });

  applyLang();
})();
</script>
</body>
</html>
