<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mausam | AI4Kids Grade 1 Science</title><style>:root{--ink:#202b36;--muted:#526170;--paper:#fffdf7;--line:#d8d1c3;--blue:#216a9b;--blue2:#dcecf6;--orange:#d4752c;--green:#2e8657;--red:#bb4b45;--yellow:#fff0bd;--purple:#79539a;--fs-cap:clamp(.95rem,2.5vw,1.1rem);--fs-sm:clamp(1.18rem,3.2vw,1.5rem);--fs-md:clamp(1.35rem,3.8vw,1.8rem);--fs-lg:clamp(1.6rem,4.5vw,2.25rem);--fs-xl:clamp(2rem,6vw,3rem)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--fs-sm);line-height:1.55;padding:0 0 50px}.wrap{max-width:1080px;margin:auto;padding:0 16px}.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:15px 0 8px}.brand{font-weight:800;color:var(--blue);margin-right:auto;font-size:var(--fs-cap)}button{font:inherit;color:inherit}.chip,.tab{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:8px 15px;cursor:pointer;font-weight:800;min-height:46px}.chip[aria-pressed=true],.tab[aria-pressed=true]{background:var(--ink);color:#fff}.chip:focus-visible,.tab:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}h1{font-size:var(--fs-xl);line-height:1.2;margin:10px 0 3px}.sub{color:var(--muted);margin:0 0 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{border-radius:14px;flex:1 1 16%;font-size:var(--fs-cap);min-height:53px}.demo-wrap{border:3px solid var(--ink);border-radius:22px;background:linear-gradient(140deg,#e9f4fa,#f9efdb);padding:16px;margin-bottom:20px;scroll-margin-top:10px}.demo-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.demo-head h2{font-size:var(--fs-lg);margin:0;flex:1}.demo-instruction{margin:5px 0 12px;color:var(--muted)}.play{background:var(--green);border:3px solid #236b45;color:#fff;border-radius:16px;padding:11px 18px;min-height:55px;cursor:pointer;font-weight:800;font-size:var(--fs-md);width:100%;margin-top:13px}.play:active{transform:scale(.98)}.demo-stage{background:#fffefb;border:2px solid var(--line);border-radius:17px;padding:13px}.demo-msg{border-radius:13px;background:var(--yellow);padding:11px 13px;margin:11px 0 0;font-weight:700}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:3px solid var(--line);background:#fff;border-radius:15px;min-height:100px;padding:11px 8px;cursor:pointer;text-align:center;font-weight:800}.card:hover,.card.selected{border-color:var(--blue);background:var(--blue2)}.emoji{display:block;font-size:2.35rem;line-height:1.1;margin-bottom:5px}.card small{display:block;font-size:var(--fs-cap);font-weight:600;color:var(--muted)}.lesson-grid{display:grid;gap:13px}.lesson{border:3px solid var(--line);border-radius:18px;background:#fff;padding:16px 18px;scroll-margin-top:12px}.lesson .tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:4px 14px;font-size:var(--fs-cap);font-weight:900;margin-bottom:9px}.lesson.hook .tag{background:var(--orange)}.lesson.misaal .tag{background:var(--green)}.lesson.karo .tag{background:var(--purple)}.lesson p{margin:0;font-size:var(--fs-sm)}.quiz{border-top:3px solid var(--ink);margin-top:30px;padding-top:21px;scroll-margin-top:12px}.quiz h2{font-size:var(--fs-lg);margin:0 0 18px}.q{margin-bottom:27px}.q-title{font-size:var(--fs-md);font-weight:800;margin:0 0 10px}.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;min-height:54px;font-size:var(--fs-sm)}.opt.right{border-color:var(--green);background:#e5f3eb;font-weight:800}.opt.wrong{border-color:var(--red);background:#fae5e1}.feedback{display:none;color:var(--muted);font-size:var(--fs-cap);margin:8px 0}.feedback.show{display:block}.score{display:none;text-align:center;border:3px solid var(--green);background:#e5f3eb;border-radius:15px;padding:13px;font-size:var(--fs-md);font-weight:900}.score.show{display:block}footer{margin-top:31px;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:var(--fs-cap)}@media(min-width:760px){.lesson-grid{grid-template-columns:1fr 1fr}.demo-wrap{padding:20px}.cards{grid-template-columns:repeat(4,1fr)}.play{width:auto;min-width:190px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><div class="wrap"><div class="bar"><span class="brand" id="brand"></span><button class="chip" id="langBtn" type="button" aria-pressed="false">Roman Urdu</button><button class="chip" id="speakBtn" type="button" aria-label="Read title aloud">🔊</button></div><header><h1 id="title"></h1><p class="sub" id="subtitle"></p></header><nav class="tabs" id="tabs" aria-label="Lesson sections"></nav><section class="demo-wrap" id="demo" aria-labelledby="demoTitle"><div class="demo-head"><h2 id="demoTitle"></h2><button class="chip" id="launch" type="button">Play demo</button></div><p class="demo-instruction" id="demoInstruction"></p><div class="demo-stage" id="demoStage"></div></section><main class="lesson-grid"><article class="lesson hook" id="hook"><span class="tag" id="hookTag"></span><p id="hookText"></p></article><article class="lesson samjhao" id="samjhao"><span class="tag" id="samjhaoTag"></span><p id="samjhaoText"></p></article><article class="lesson misaal" id="misaal"><span class="tag" id="misaalTag"></span><p id="misaalText"></p></article><article class="lesson karo" id="karo"><span class="tag" id="karoTag"></span><p id="karoText"></p></article></main><section class="quiz" id="quiz"><h2 id="quizHead"></h2><div id="quizBox"></div><div class="score" id="score"></div></section><footer id="foot"></footer></div><script>const DATA={"file":"g1-mausam.html","title":"Mausam","desc":{"en":"Observe sunshine, clouds, rain, wind, and seasons.","ru":"Dhoop, badal, baarish aur hawa observe karo."},"hook":{"en":"Look outside! Is the sky sunny, cloudy, rainy, or windy today? Weather can change.","ru":"Aap ko yaad hai jab aap ne last baar baarish mein khelna tha? Dhoond ke paani kaise beh raha tha? Aur phir suraj nikal aaya, to sab kuch kis tarah chamak raha tha? Mausam waqai mein bahut hi dilchasp hota hai!"},"samjhao":{"en":"Weather tells us what the air and sky are like today. Sunshine is bright and warm. Clouds may cover the sky and rain can fall from them. Wind is moving air.","ru":"Mausam ka matlab hai woh halat jo humare aas paas hoti hain, jaise dhoop, baarish, badal, aur hawa. Jab din shuru hota hai, to kabhi kabhi suraj chamakta hai, jise hum dhoop kehte hain. Dhoop se sab kuch roshan hota hai aur humein garmi mehsoos hoti hai. Kabhi kabhi hum dekhte hain ke aasman mein badal gharhate hain. Badal hawa mein udte hain aur jab unhein paani bhar jata hai to woh baarish ban jaate hain. Baarish bohot zaroori hai, kyunki yeh zameen ko tarbiyat deti hai aur paani ki zaroorat ko pura karti hai. Hawa bhi ek aham hissa hai mausam ka. Jab hawa chalti hai to kadmon ki khushboo le aati hai ya kabhi kisi cheez ko uda deti hai. Aankhein band karke, aap hawa ko mehsoos kar sakte hain! Mausam kis tarah badalta hai, yeh cheez bhi zaroor dekhni chahiye. Kabhi kabhi garmi hoti hai, kabhi thand, aur kabhi baarish ki wajah se sab kuch badal jaata hai."},"misaal":{"en":"On a rainy day, carry an umbrella. On a hot sunny day, drink water and stay in shade.","ru":"Chaliye, ab hum baat karte hain bazaar ki. Jab baarish hoti hai, to bazaar ki galiyaan paani se bhari hoti hain, logon ki chhatriyan khuli hoti hain aur chai walay chai bechne nikalte hain. Lekin jab dhoop nikalti hai, to sab log thande thande drinks lene nikalte hain! Yeh mausam ki badlaav ko dekhne ka behtareen example hai."},"karo":{"en":"Make a five-day weather chart. Draw sun, cloud, raindrops, or wind each day.","ru":"Ab aapko ek chhoti si activity karni hai. Aap ghar ya school mein ek \"Mausam ka Chart\" banayein. Aapko roz mausam ko dekh kar yeh note karna hai ke aaj dhoop hai, baarish hai, ya badal hain. Har din ke liye ek chhoti si tasveer ya khichai banayein. Yeh mujhe agle lesson mein dikhaiye!"},"demo":{"type":"cards","title":{"en":"Weather watcher","ru":"Weather watcher"},"instruction":{"en":"Tap today's weather to get a safe idea.","ru":"Aaj ke mausam par tap karke mashwara lo."},"items":[{"emoji":"☀️","name":{"en":"Sunny","ru":"Dhoop"},"label":{"en":"Sunny: wear a hat, drink water, and use shade.","ru":"Dhoop: topi pehno, pani piyo aur saaye mein raho."}},{"emoji":"☁️","name":{"en":"Cloudy","ru":"Badal"},"label":{"en":"Cloudy: the sun may hide behind clouds.","ru":"Badal: dhoop badalon ke peeche chhup sakti hai."}},{"emoji":"🌧️","name":{"en":"Rainy","ru":"Baarish"},"label":{"en":"Rainy: use an umbrella and stay safe.","ru":"Baarish: chhatri lo aur mehfooz raho."}},{"emoji":"💨","name":{"en":"Windy","ru":"Hawa"},"label":{"en":"Windy: moving air may blow leaves.","ru":"Hawa: harkat karti hawa pattay ura sakti hai."}}]},"quiz":[{"q":{"en":"What is moving air called?","ru":"Harkat karti hui air ko kya kehte hain?"},"o":[{"en":"Wind","ru":"Hawa"},{"en":"Stone","ru":"Pathar"},{"en":"Soil","ru":"Mitti"},{"en":"Shadow","ru":"Saya"}],"a":0,"e":{"en":"Wind is moving air.","ru":"Wind is moving air."}},{"q":{"en":"What can fall from clouds?","ru":"Badalon se kya gir sakta hai?"},"o":[{"en":"Rain","ru":"Baarish"},{"en":"Sandwiches","ru":"Sandwich"},{"en":"Shoes","ru":"Jootay"},{"en":"Books","ru":"Kitaabein"}],"a":0,"e":{"en":"Rain can fall from clouds.","ru":"Rain can fall from clouds."}},{"q":{"en":"What can you use on a rainy day?","ru":"Barsati din mein kya istemal karte ho?"},"o":[{"en":"Umbrella","ru":"Chhatri"},{"en":"Sunglasses only","ru":"Sirf sunglasses"},{"en":"Blank paper","ru":"Khaali kaghaz"},{"en":"Spoon","ru":"Chamcha"}],"a":0,"e":{"en":"An umbrella helps keep rain off.","ru":"An umbrella helps keep rain off."}},{"q":{"en":"What does sunshine make a day?","ru":"Dhoop din ko kaisa bana sakti hai?"},"o":[{"en":"Bright and warm","ru":"Roshan aur garam"},{"en":"Always dark","ru":"Hamesha andhera"},{"en":"Made of stones","ru":"Pathar wala"},{"en":"Silent only","ru":"Sirf khamosh"}],"a":0,"e":{"en":"Sunshine gives light and warmth.","ru":"Sunshine gives light and warmth."}},{"q":{"en":"What should you do on a very hot day?","ru":"Bohat garam din mein kya karna chahiye?"},"o":[{"en":"Drink water and find shade","ru":"Pani piyo aur saya dhoondo"},{"en":"Wear wool only","ru":"Sirf oon pehno"},{"en":"Never drink","ru":"Kabhi pani na piyo"},{"en":"Stand in sun for hours","ru":"Ghanton dhoop mein raho"}],"a":0,"e":{"en":"Water and shade help us stay comfortable.","ru":"Water and shade help us stay comfortable."}}]};
(function(){'use strict';var lang='en',selected=0,answered=0,score=0;
function $(id){return document.getElementById(id)}
function t(x){return x&&typeof x==='object'?(x[lang]||x.en||''):String(x||'')}
function put(el,x){if(!el)return;el.textContent=t(x);el.dir='ltr'}
function labels(){return {play:{en:'Play',ru:'Play'},hook:{en:'HOOK',ru:'HOOK'},samjhao:{en:'SAMJHAO',ru:'SAMJHAO'},misaal:{en:'MISAAL',ru:'MISAAL'},karo:{en:'KARO',ru:'KARO'}}}
function setCommon(){document.documentElement.lang=lang;document.title=t(DATA.title)+' | AI4Kids Grade 1 Science';put($('brand'),{en:'AI4Kids · Grade 1 · Science',ru:'AI4Kids · Jamaat 1 · Science'});put($('title'),DATA.title);put($('subtitle'),DATA.desc);put($('quizHead'),{en:'Quiz — 5 questions',ru:'Quiz — 5 sawaal'});put($('foot'),{en:'AI4Kids · Grade 1 Science · Offline lesson',ru:'AI4Kids · Jamaat 1 Science · Offline lesson'});$('langBtn').textContent=lang==='en'?'Roman Urdu':'English';$('langBtn').setAttribute('aria-pressed',lang==='ru');var L=labels();['hook','samjhao','misaal','karo'].forEach(function(k){put($(k+'Tag'),L[k]);put($(k+'Text'),DATA[k])});put($('demoTitle'),DATA.demo.title);put($('demoInstruction'),DATA.demo.instruction);put($('launch'),{en:'Play demo',ru:'Demo khelo'});renderTabs();renderDemo();renderQuiz()}
function renderTabs(){var box=$('tabs');box.innerHTML='';var L=labels();[['play',L.play],['hook',L.hook],['samjhao',L.samjhao],['misaal',L.misaal],['karo',L.karo]].forEach(function(x){var b=document.createElement('button');b.className='tab';b.type='button';b.textContent=t(x[1]);b.setAttribute('aria-pressed',x[0]==='play');b.onclick=function(){var target=x[0]==='play'?'demo':x[0];$(target).scrollIntoView({behavior:'smooth'})};box.appendChild(b)})}
function msg(en,ru){return {en:en,ru:ru}}
function baseMsg(stage,text){var p=document.createElement('div');p.className='demo-msg';put(p,text);stage.appendChild(p)}
function renderDemo(){var stage=$('demoStage');stage.innerHTML='';var row=document.createElement('div');row.className='cards';DATA.demo.items.forEach(function(it,i){var b=document.createElement('button');b.type='button';b.className='card'+(selected===i?' selected':'');var sp=document.createElement('span');sp.className='emoji';sp.textContent=it.emoji;b.appendChild(sp);b.appendChild(document.createTextNode(t(it.name)));b.onclick=function(){selected=i;renderDemo()};row.appendChild(b)});stage.appendChild(row);var play=document.createElement('button');play.type='button';play.className='play';play.textContent=lang==='en'?'▶ Play':'▶ Play karo';play.onclick=function(){baseMsg(stage,DATA.demo.items[selected].label)};stage.appendChild(play);baseMsg(stage,msg('Choose a card, then press Play.','Card chuno, phir Play dabao.'))}
function renderQuiz(){var box=$('quizBox');box.innerHTML='';answered=0;score=0;$('score').classList.remove('show');DATA.quiz.forEach(function(q,qi){var wrap=document.createElement('section');wrap.className='q';var title=document.createElement('p');title.className='q-title';title.textContent=(qi+1)+'. '+t(q.q);wrap.appendChild(title);q.o.forEach(function(op,oi){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+oi)+'. '+t(op);b.onclick=function(){if(wrap.dataset.done)return;wrap.dataset.done='1';answered++;var ok=oi===q.a;if(ok)score++;b.classList.add(ok?'right':'wrong');if(!ok)wrap.querySelectorAll('.opt').forEach(function(x,xi){if(xi===q.a)x.classList.add('right')});var fb=wrap.querySelector('.feedback');fb.textContent=(ok?'✓ ':'✗ ')+t(q.e);fb.classList.add('show');wrap.querySelectorAll('button').forEach(function(x){x.disabled=true});if(answered===DATA.quiz.length){$('score').textContent=t({en:'Your score: '+score+' / 5 — '+(score===5?'Excellent!':'Good practice!'),ru:'Tumhara score: '+score+' / 5 — '+(score===5?'Shabash!':'Achi practice!')});$('score').classList.add('show')}};wrap.appendChild(b)});var fb=document.createElement('p');fb.className='feedback';wrap.appendChild(fb);box.appendChild(wrap)})}
$('langBtn').onclick=function(){lang=lang==='en'?'ru':'en';selected=0;setCommon()};$('speakBtn').onclick=function(){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t(DATA.title)+' '+t(DATA.desc));u.lang=lang==='en'?'en-US':'en-PK';u.rate=.9;window.speechSynthesis.speak(u)};$('launch').onclick=function(){$('demo').scrollIntoView({behavior:'smooth'});renderDemo()};setCommon()})();</script></body></html>
