<style>
/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

  :root{
    --board:#f2eee4;
    --board-deep:#e5dccb;
    --a:#2f6fb5;
    --b:#c9702e;
    --both:#7a5aa8;
    --gold:#e8b23d;
    --left:#c4453a;
    --ok:#2e7d4f;
    --ink:#2a2419;
    --ink-soft:#574e3e;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#5b4a8f;

    --fs-cap:clamp(14px, 3.8vw, 16px);--fs-xs:clamp(16px, 4.2vw, 18px);--fs-sm:clamp(18px, 4.8vw, 20px);--fs-md:clamp(19px, 5.2vw, 22px);--fs-lg:clamp(22px, 6vw, 26px);--fs-xl:clamp(30px, 8vw, 38px);
    --lh:1.5;
  }
  /* Urdu is set larger than Latin — Nastaliq reads smaller at the same size. */
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);--fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);--fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .stars{display:flex;align-items:center;gap:6px;font-weight:800;font-size:var(--fs-xs);
         background:#fff6e2;border:2px solid var(--gold);border-radius:999px;padding:7px 13px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .tabs{display:flex;gap:8px;margin:0 0 14px}
  .tabs button{
    flex:1;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:10px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-xs);cursor:pointer;min-height:54px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .tabs button .badge{color:var(--gold)}

  .story{
    background:#fff8ea;border:2px dashed var(--gold);border-radius:16px;padding:13px 15px;
    font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6;margin-bottom:14px;
  }
  body.urdu .story{line-height:var(--lh)}
  .story b{color:var(--ink)}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  }
  .scene-pad{padding:16px 16px 28px;min-height:220px}
  .botrow{display:flex;align-items:flex-start;gap:12px}
  .bot{flex:none}
  .vis-card{
    flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:18px;
    padding:14px 14px 16px;text-align:center;
  }
  .vis-emoji{font-size:52px;line-height:1.1;margin:4px 0 8px}
  .vis-name{font-weight:800;font-size:var(--fs-md);margin:0 0 4px}
  .vis-note{margin:0;color:var(--ink-soft);font-size:var(--fs-xs)}
  .chat-bubble{
    flex:1;background:var(--paper);border:3px solid var(--ink);
    border-radius:4px 18px 18px 18px;padding:14px 16px;
  }
  body.urdu .chat-bubble{border-radius:18px 4px 18px 18px}
  .chat-who{font-size:var(--fs-cap);font-weight:800;color:var(--accent);margin:0 0 6px}
  .chat-line{margin:0;font-weight:700;font-size:var(--fs-sm)}
  .piles{display:flex;gap:8px;margin-top:12px}
  .pile{
    flex:1;border-radius:12px;padding:8px 10px;font-size:var(--fs-cap);font-weight:700;
    border:2px solid var(--ink);background:rgba(253,250,243,.72);min-height:54px;
  }
  .pile.A{border-color:var(--a);color:var(--a)}
  .pile.B{border-color:var(--b);color:var(--b)}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
  .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--ink)}
  .dots i.ok{background:var(--ok)}
  .dots i.no{background:var(--left)}
  .hit{animation:pop .5s ease-out}
  @keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1)}}

  .readout{
    margin-top:-18px;position:relative;z-index:2;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.win{background:var(--ok)}
  .statechip.miss{background:var(--left)}
  .headline{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .headline.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .bound{
    margin:10px 0 0;border:2px solid var(--ok);background:#eaf3ee;border-radius:12px;
    padding:9px 12px;font-size:var(--fs-cap);color:var(--ok);font-weight:700;line-height:1.55;
  }
  body.urdu .bound{line-height:var(--lh)}
  .hintbox{
    margin-top:14px;border:2px solid var(--a);background:#eaf1f9;border-radius:14px;
    padding:11px 14px;font-size:var(--fs-xs);color:var(--a);font-weight:700;line-height:1.55;
    display:none;
  }
  .hintbox.show{display:block}
  body.urdu .hintbox{line-height:var(--lh)}

  .work{
    margin-top:14px;border:2px solid var(--accent);background:#f1eef8;border-radius:14px;
    padding:11px 14px;font-size:var(--fs-xs);color:var(--accent);line-height:1.6;display:none;
  }
  .work.show{display:block}
  .work b{font-weight:800}
  .work code{font-family:"Baloo Bhaijaan 2",monospace;font-weight:800;font-size:var(--fs-sm)}

  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .prog{margin:0 0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft)}
  .btns{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}
  .btns button{
    border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);
    font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;min-height:50px;
    padding:8px 14px;flex:1;
  }
  .btns .go{background:var(--ink);color:var(--paper)}
  .btns .labA{border-color:var(--a);color:var(--a)}
  .btns .labB{border-color:var(--b);color:var(--b)}
  .btns .labA[aria-pressed="true"]{background:var(--a);color:#fff}
  .btns .labB[aria-pressed="true"]{background:var(--b);color:#fff}
  .btns button:active{transform:scale(.97)}
  .btns button:disabled{opacity:.4;cursor:default}
  .choice{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;font-weight:700;
  }
  .choice.ur{text-align:right;line-height:var(--lh)}
  .choice:hover{border-color:var(--ink)}
  .choice.right{border-color:var(--ok);background:#e8f2ed}
  .choice.wrong{border-color:var(--left);background:#fbeae8}
  .rules{margin-top:8px}
  .rule{
    border:2px solid var(--ok);background:#eaf3ee;border-radius:12px;
    padding:8px 12px;margin-bottom:8px;font-size:var(--fs-cap);font-weight:700;
    color:var(--ok);line-height:1.5;
  }
  body.urdu .rule{line-height:var(--lh)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .pchip{
    border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;
    font:inherit;font-size:var(--fs-cap);font-weight:800;color:var(--ink);cursor:pointer;min-height:44px;
  }
  .pchip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .pchip .done{color:var(--gold)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .qhead h2{font-size:var(--fs-lg);font-weight:800;margin:0;flex:1}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--left);background:#fbeae8}
  .opt.reveal{border-color:var(--ok);border-style:dashed}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;
      grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar"
        "head  head"
        "tabs  tabs"
        "story story"
        "left  right"
        "quiz  quiz"
        "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .story{grid-area:story} .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }

  @media (prefers-reduced-motion:reduce){
    .hit{animation:none}
    *{transition-duration:.01ms !important}
  }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

    el.textContent = (lang === "ur") ? isolate(str) : str;

  function overlap(a, b){
    var n = 0;
    a.forEach(function(f){ if (b.indexOf(f) >= 0) n++; });
    return n;
  }

  function aiGuess(item){
    var scoreA = 0, scoreB = 0;
    DECKS[deckI].items.forEach(function(ex, i){
      var o = overlap(ex.feats, item.feats);
      if (labels[i] === "A") scoreA += o;
      else if (labels[i] === "B") scoreB += o;
    });
    var g = scoreA > scoreB ? "A" : (scoreB > scoreA ? "B" : (scoreA === 0 ? "X" : "A"));
    return {g:g, sa:scoreA, sb:scoreB};
  }

  function award(key, n){
    if (earned[key]) return false;
    earned[key] = true;
    stars += (n || 1);
    return true;
  }

  /* ---------- actions ---------- */
  function onLabel(which){
    if (trainPhase !== "label") return;
    labels[labelI] = which;
    labelI++;
    if (labelI >= 6){
      trainPhase = "reveal";
      mysteryI = 0;
      hintLevel = 0;
      wrongTries = 0;
    }
    render();
  }

  function onJudge(saidRight){
    if (trainPhase !== "reveal") return;
    var key = "train-" + deckI + "-m" + mysteryI;
    if (trainJudged[key]) return;
    var m = DECKS[deckI].mystery[mysteryI];
    var ag = aiGuess(m);
    var actuallyRight = (m.trueG === "X") ? (ag.g !== "A" && ag.g !== "B") : (ag.g === m.trueG);
    var kidCorrect = (saidRight === actuallyRight);
    trainJudged[key] = kidCorrect ? "ok" : "no";
    if (kidCorrect){
      award(key, 1);
      hintLevel = 0;
      wrongTries = 0;
    } else {
      wrongTries++;
      if (wrongTries >= 2 && hintLevel < 3) hintLevel = Math.min(3, hintLevel + 1);
    }
    var all = true;
    DECKS[deckI].mystery.forEach(function(_, i){
      if (!trainJudged["train-" + deckI + "-m" + i]) all = false;
    });
    if (all) doneModes.train[deckI] = true;
    render();
  }

  function onFib(saidOk){
    var key = "fib-" + fibI;
    if (fibJudged[key]) return;
    var item = FIBS[fibI];
    var kidCorrect = (saidOk === item.ok);
    fibJudged[key] = kidCorrect ? "ok" : "no";
    if (kidCorrect){
      award(key, 1);
      hintLevel = 0;
      wrongTries = 0;
    } else {
      wrongTries++;
      if (wrongTries >= 2 && hintLevel < 3) hintLevel = Math.min(3, hintLevel + 1);
    }
    if (Object.keys(fibJudged).length >= FIBS.length) doneModes.fib = true;
    render();
  }

  function onSafe(oi){
    var key = "safe-" + safeI;
    if (safeJudged[key]) return;
    var item = SAFES[safeI];
    var kidCorrect = !!item.choices[oi].ok;
    safeJudged[key] = kidCorrect ? "ok" : "no";
    if (kidCorrect){
      award(key, 1);
      hintLevel = 0;
      wrongTries = 0;
    } else {
      wrongTries++;
      if (wrongTries >= 2 && hintLevel < 3) hintLevel = Math.min(3, hintLevel + 1);
    }
    if (Object.keys(safeJudged).length >= SAFES.length) doneModes.safe = true;
    render();
  }

  function goNext(){
    if (mode === "train" && trainPhase === "reveal"){
      var key = "train-" + deckI + "-m" + mysteryI;
      if (!trainJudged[key]) return;
      if (mysteryI < DECKS[deckI].mystery.length - 1){
        mysteryI++;
        hintLevel = 0;
        wrongTries = 0;
      }
    } else if (mode === "fib"){
      if (!fibJudged["fib-" + fibI]) return;
      if (fibI < FIBS.length - 1){
        fibI++;
        hintLevel = 0;
        wrongTries = 0;
      }
    } else if (mode === "safe"){
      if (!safeJudged["safe-" + safeI]) return;
      if (safeI < SAFES.length - 1){
        safeI++;
        hintLevel = 0;
        wrongTries = 0;
      }
    }
    render();
  }

  function setMode(m){
    if (mode === m) return;
    mode = m;
    hintLevel = 0;
    wrongTries = 0;
    buildPairs();
    render();
  }

  function resetMode(){
    hintLevel = 0;
    wrongTries = 0;
    if (mode === "train"){
      labelI = 0;
      labels = [];
      trainPhase = "label";

      DECKS[deckI].mystery.forEach(function(_, i){

        delete trainJudged[key];

      delete doneModes.train[deckI];

    } else {

    render();
  }

  function buildPairs(){

        var b = document.createElement("button");
        b.type = "button"; b.className = "pchip";
        b.setAttribute("data-i", i);
        b.addEventListener("click", function(){
          deckI = i;
          labelI = 0; labels = []; trainPhase = "label"; mysteryI = 0;
          hintLevel = 0; wrongTries = 0;

        box.appendChild(b);

    } else if (mode === "fib"){

        if (safeJudged[k] === "ok") dot.className = "ok";
        else if (safeJudged[k] === "no") dot.className = "no";
        else if (i === safeI) dot.className = "on";
        dots.appendChild(dot);
      });
      pad.appendChild(dots);
    }
  }

  function currentJudged(){
    if (mode === "train" && trainPhase === "reveal") return trainJudged["train-" + deckI + "-m" + mysteryI];
    if (mode === "fib") return fibJudged["fib-" + fibI];
    if (mode === "safe") return safeJudged["safe-" + safeI];
    return null;
  }

  function canNext(){
    if (mode === "train" && trainPhase === "reveal"){
      return !!trainJudged["train-" + deckI + "-m" + mysteryI] && mysteryI < DECKS[deckI].mystery.length - 1;
    }
    if (mode === "fib") return !!fibJudged["fib-" + fibI] && fibI < FIBS.length - 1;
    if (mode === "safe") return !!safeJudged["safe-" + safeI] && safeI < SAFES.length - 1;
    return false;
  }

  function modeComplete(){
    if (mode === "train"){
      return DECKS[deckI].mystery.every(function(_, i){ return !!trainJudged["train-" + deckI + "-m" + i]; });
    }
    if (mode === "fib") return Object.keys(fibJudged).length >= FIBS.length;
    return Object.keys(safeJudged).length >= SAFES.length;
  }

  function render(){
    $("starCount").textContent = String(stars);
    $("tabTrain").setAttribute("aria-pressed", mode === "train" ? "true" : "false");
    $("tabFib").setAttribute("aria-pressed", mode === "fib" ? "true" : "false");
    $("tabSafe").setAttribute("aria-pressed", mode === "safe" ? "true" : "false");

    function tabLabel(btn, text, n){
      btn.innerHTML = "";
      var sp = document.createElement("span");
      sp.textContent = text;
      if (lang === "ur"){ sp.className = "ur"; sp.setAttribute("dir","rtl"); }
      btn.appendChild(sp);
      if (n){
        var bd = document.createElement("span");
        bd.className = "badge";
        bd.textContent = " " + Array(n + 1).join("\u2605");
        btn.appendChild(bd);
      }
    }
    var tn = Object.keys(doneModes.train).length;
    tabLabel($("tabTrain"), t(T.tabTrain), tn);
    tabLabel($("tabFib"), t(T.tabFib), doneModes.fib ? 1 : 0);
    tabLabel($("tabSafe"), t(T.tabSafe), doneModes.safe ? 1 : 0);

    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    setText($("story"), mode === "train" ? t(T.storyTrain) : mode === "fib" ? t(T.storyFib) : t(T.storySafe));

    if (mode === "train") setText($("ctlHead"), trainPhase === "label" ? t(T.ctlTrain) : t(T.ctlGuess));
    else if (mode === "fib") setText($("ctlHead"), t(T.ctlFib));
    else setText($("ctlHead"), t(T.ctlSafe));

    setText($("pairHead"), mode === "train" ? t(T.pairTrain) : mode === "fib" ? t(T.pairFib) : t(T.pairSafe));
    setText($("hintBtn"), t(T.hint));
    setText($("teachBtn"), teach ? t(T.teachOn) : t(T.teachOff));
    setText($("resetBtn"), t(T.reset));
    setText($("nextBtn"), t(T.next));
    setText($("quizHead"), t(T.quiz));
    setText($("newQuiz"), t(T.newQuiz));

    $("nextBtn").style.display = canNext() ? "" : "none";

    if (mode === "train"){
      setText($("prog"), trainPhase === "label"
        ? fill(t(T.progLabel), {n: Math.min(labelI + 1, 6)})
        : fill(t(T.progGuess), {n: mysteryI + 1}));
    } else if (mode === "fib"){
      setText($("prog"), fill(t(T.progFib), {n: fibI + 1, t: FIBS.length}));
    } else {
      setText($("prog"), fill(t(T.progSafe), {n: safeI + 1, t: SAFES.length}));
    }

    var rb = $("rulesBox");
    if (mode === "safe"){
      rb.hidden = false;
      rb.innerHTML = "";
      [T.rule1, T.rule2, T.rule3].forEach(function(r){
        var p = el("p", "rule");
        setText(p, t(r));
        rb.appendChild(p);
      });
    } else {
      rb.hidden = true;
      rb.innerHTML = "";
    }

    Array.prototype.forEach.call($("pairs").children, function(btn, i){
      btn.innerHTML = "";
      var sp = document.createElement("span");
      var label, pressed, done;
      if (mode === "train"){
        label = t(DECKS[i].chip);
        pressed = i === deckI;
        done = !!doneModes.train[i];
      } else if (mode === "fib"){
        label = String(i + 1);
        pressed = i === fibI;
        done = !!fibJudged["fib-" + i];
      } else {
        label = String(i + 1);
        pressed = i === safeI;
        done = !!safeJudged["safe-" + i];
      }
      sp.textContent = label;
      if (lang === "ur" && mode === "train"){ sp.className = "ur"; sp.setAttribute("dir","rtl"); }
      btn.appendChild(sp);
      if (done){
        var st = document.createElement("span"); st.className = "done"; st.textContent = " \u2605";
        btn.appendChild(st);
      }
      btn.setAttribute("aria-pressed", pressed ? "true" : "false");
    });

    drawScene();
    buildActions();

    var chip = $("statechip");
    var judged = currentJudged();
    chip.classList.toggle("win", judged === "ok" || (mode === "train" && trainPhase === "reveal" && modeComplete()));
    chip.classList.toggle("miss", judged === "no");

    var headline = "";
    var detail = "";
    if (mode === "train" && trainPhase === "label"){
      setText(chip, t(T.ready));
      headline = t(DECKS[deckI].items[Math.min(labelI, 5)]);
      detail = deckI === 0 ? t(T.tryLabel) : t(T.tryLabel2);
    } else if (mode === "train"){
      var m = DECKS[deckI].mystery[mysteryI];
      var ag = aiGuess(m);
      headline = fill(t(T.guessSays), {g: labName(ag.g)});
      if (!judged){
        setText(chip, t(T.trained));
        detail = t(T.guessHow);
      } else if (judged === "ok"){
        setText(chip, t(T.won));
        var actuallyRight = (m.trueG === "X") ? (ag.g !== "A" && ag.g !== "B") : (ag.g === m.trueG);
        detail = (actuallyRight ? t(T.judgeRight) : t(T.judgeWrongTrue)) + " " + t(T.starEarn);
        if (modeComplete()) detail = t(T.trainDone);
      } else {
        setText(chip, t(T.oops));
        detail = t(T.judgeMiss);
      }
    } else if (mode === "fib"){
      headline = t(T.botName);
      if (!judged){
        setText(chip, t(T.ready));
        detail = t(T.tryFib);
      } else if (judged === "ok"){
        setText(chip, t(T.won));
        detail = t(FIBS[fibI].f) + (modeComplete() ? " " + t(T.fibDone) : "");
      } else {
        setText(chip, t(T.oops));
        detail = t(T.fibMiss) + " " + t(FIBS[fibI].f);
      }
    } else {
      headline = t(T.ctlSafe);
      if (!judged){
        setText(chip, t(T.ready));
        detail = t(T.trySafe);
      } else if (judged === "ok"){
        setText(chip, t(T.won));
        detail = t(SAFES[safeI].f) + (modeComplete() ? " " + t(T.safeDone) : "");
      } else {
        setText(chip, t(T.oops));
        detail = t(T.safeMiss) + " " + t(SAFES[safeI].f);
      }
    }

    setText($("headline"), headline);
    setText($("detail"), detail);

    setText($("bound"), mode === "train" ? t(T.boundTrain) : mode === "fib" ? t(T.boundFib) : t(T.boundSafe));

    var hb = $("hintbox");
    hb.classList.toggle("show", hintLevel > 0);
    if (hintLevel > 0){
      var hints = mode === "train" ? T.hintsTrain : mode === "fib" ? T.hintsFib : T.hintsSafe;
      setText(hb, t(hints[Math.min(hintLevel, 3) - 1]));
    }

    var w = $("work");
    w.classList.toggle("show", teach);
    if (teach){
      if (mode === "train" && trainPhase === "reveal"){
        var m = DECKS[deckI].mystery[mysteryI];
        var ag = aiGuess(m);
        var listA = [], listB = [];
        labels.forEach(function(L, i){
          var s = t(DECKS[deckI].items[i]);
          if (L === "A") listA.push(s); else listB.push(s);
        });
        w.innerHTML = fill(t(T.workTrain), {
          pa: listA.join(", ") || "—",
          pb: listB.join(", ") || "—",
          mf: m.feats.map(featName).join(", "),
          sa: String(ag.sa),
          sb: String(ag.sb),
          g: labName(ag.g)
        });
      } else if (mode === "train"){
        w.innerHTML = t(T.workTrainWait);
      } else if (mode === "fib"){
        w.innerHTML = t(T.workFib);
      } else {
        w.innerHTML = t(T.workSafe);
      }
      w.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
      w.classList.toggle("ur", lang === "ur");
    }

    lastSpoken = t(mode === "train" ? T.storyTrain : mode === "fib" ? T.storyFib : T.storySafe) + " " + headline + ". " + detail;
  }

  /* ---------- quiz ---------- */
  function pickQuiz(){
    var idx = BANK.map(function(_, i){ return i; });
    for (var i = idx.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    }
    quizSet = idx.slice(0, 7).map(function(i){
      var item = BANK[i];
      var order = item.o.map(function(opt, oi){ return {opt:opt, oi:oi}; });
      for (var k = order.length - 1; k > 0; k--){
        var j = Math.floor(Math.random() * (k + 1));
        var tmp = order[k]; order[k] = order[j]; order[j] = tmp;
      }
      return {q:item.q, o:order.map(function(x){ return x.opt; }), a:order.map(function(x){ return x.oi; }).indexOf(item.a), f:item.f};
    });
  }

  function buildQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizSet.forEach(function(item, qi){
      var wrap = document.createElement("div");
      wrap.className = "q";
      var q = document.createElement("p");
      setText(q, t(item.q));
      wrap.appendChild(q);
      var fb = document.createElement("p");
      fb.className = "fb";
      item.o.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang === "ur" ? " ur" : "") + (teach && oi === item.a ? " reveal" : "");
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.textContent = (lang === "ur") ? isolate(t(opt)) : t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done") === "1") return;
          wrap.setAttribute("data-done","1");
          if (oi === item.a){
            award("quiz-" + qi + "-" + t(item.q).slice(0,20), 1);
            $("starCount").textContent = String(stars);
          }
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show","fb");
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb);
      box.appendChild(wrap);
    });
  }

  $("newQuiz").addEventListener("click", function(){ pickQuiz(); buildQuiz(); });

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    document.documentElement.lang = (lang === "ur") ? "ur" : "en";
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");
    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });
    buildQuiz();
    render();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });

  function cleanSpeakText(s){
    return String(s || "")
      .replace(/[\u2066-\u2069\u200e\u200f]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }
  function buildSpeakText(){
    var raw = cleanSpeakText(lastSpoken);
    if (raw) return raw;
    var parts = [];
    ["title","subtitle","headline","detail"].forEach(function(id){
      var el = $(id);
      if (el) parts.push(cleanSpeakText(el.textContent));
    });
    return parts.filter(Boolean).join(". ");
  }
  function pickVoice(voices, wantLang){
    var want = (wantLang || "en").toLowerCase();
    var i, v, lang;
    for (i=0;i<voices.length;i++){
      v = voices[i]; lang = (v.lang || "").toLowerCase().replace("_","-");
      if (lang.indexOf(want) === 0) return v;
    }
    for (i=0;i<voices.length;i++){
      v = voices[i]; lang = (v.lang || "").toLowerCase().replace("_","-");
      if (lang.indexOf("en") === 0) return v;
    }
    return voices[0] || null;
  }
  var speakTimer = null;
  function setSpeaking(on){
    var btn = $("speakBtn");
    if (!btn) return;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.style.opacity = on ? "0.65" : "";
  }
  function doSpeak(text, asLang){
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92;
    u.lang = (asLang === "ur") ? "ur-PK" : "en-US";
    var voices = window.speechSynthesis.getVoices() || [];
    var voice = pickVoice(voices, asLang === "ur" ? "ur" : "en");
    if (voice) u.voice = voice;
    u.onstart = function(){ setSpeaking(true); };
    u.onend = function(){ setSpeaking(false); };
    u.onerror = function(){
      setSpeaking(false);
      // Retry once in English if Urdu voice path failed
      if (asLang === "ur"){
        var enBits = [];
        try {
          enBits.push(T.storyTrain.en, T.storyFib.en, T.storySafe.en);
        } catch (e2) {}
        var fallback = cleanSpeakText(($("headline") && $("headline").textContent) || "") || "AI is a pattern machine.";
        // Prefer English story for current mode
        var storyEn = mode === "train" ? T.storyTrain.en : mode === "fib" ? T.storyFib.en : T.storySafe.en;
        fallback = cleanSpeakText(storyEn + ". " + (($("headline")&&$("headline").textContent)||"") + ". " + (($("detail")&&$("detail").textContent)||""));
        if (fallback){
          var u2 = new SpeechSynthesisUtterance(fallback);
          u2.lang = "en-US"; u2.rate = 0.92;
          var v2 = pickVoice(window.speechSynthesis.getVoices() || [], "en");
          if (v2) u2.voice = v2;
          u2.onstart = function(){ setSpeaking(true); };
          u2.onend = u2.onerror = function(){ setSpeaking(false); };
          window.speechSynthesis.speak(u2);
        }
      }
    };
    window.speechSynthesis.speak(u);
  }
  // Warm voice list (Chrome loads async)
  if ("speechSynthesis" in window){
    try { window.speechSynthesis.getVoices(); } catch (e0) {}
    if (typeof window.speechSynthesis.addEventListener === "function"){
      window.speechSynthesis.addEventListener("voiceschanged", function(){
        try { window.speechSynthesis.getVoices(); } catch (e1) {}
      });
    }
  } else {
    var noBtn = $("speakBtn");
    if (noBtn){
      noBtn.disabled = true;
      noBtn.title = "Voice not available on this device";
      noBtn.setAttribute("aria-label", "Voice not available");
    }
  }
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      var text = buildSpeakText();
      if (!text) return;
      if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
      window.speechSynthesis.cancel();
      setSpeaking(false);
      // Chrome often drops speak() if called in the same turn as cancel()
      var speakLang = lang;
      speakTimer = setTimeout(function(){
        speakTimer = null;
        doSpeak(text, speakLang);
      }, 80);
    }catch(e){ setSpeaking(false); }
  });

  buildPairs();
  pickQuiz();
  applyLang();
})();
</script>
</body>
</html>
