  .opt{

  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}

  .opt.wrong{border-color:var(--no);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}

  @media (min-width:820px){
    .wrap{

  }
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }

<script>
(function(){
  "use strict";

  var lang="ru";
  var tab  = "tri";
  var triI = 0, quadI = 0, symI = 0;
  var tried = {};          // fold lines the child has tested on this shape

  /* ---------- geometry helpers, so nothing is hardcoded ---------- */
  function d(p,q){ return Math.sqrt((p[0]-q[0])*(p[0]-q[0]) + (p[1]-q[1])*(p[1]-q[1])); }
  function angleAt(a,b,c){                       // angle at vertex b
    var ab = d(a,b), bc = d(b,c), ac = d(a,c);
    var cos = (ab*ab + bc*bc - ac*ac) / (2*ab*bc);
    return Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
  }
  function near(x,y,tol){ return Math.abs(x-y) <= (tol || 1.5); }

  function triAngles(P){
    var A = angleAt(P[2],P[0],P[1]), B = angleAt(P[0],P[1],P[2]), C = angleAt(P[1],P[2],P[0]);
    var r = [Math.round(A), Math.round(B), Math.round(C)];
    var diff = 180 - (r[0]+r[1]+r[2]);           // keep the display adding to exactly 180
    var big = r.indexOf(Math.max(r[0],r[1],r[2]));
    r[big] += diff;
    return r;
  }
  function triSides(P){ return [d(P[0],P[1]), d(P[1],P[2]), d(P[2],P[0])]; }

  function bySides(P){
    var s = triSides(P).map(function(x){ return Math.round(x); });
    var eq = (near(s[0],s[1],2) ? 1 : 0) + (near(s[1],s[2],2) ? 1 : 0) + (near(s[0],s[2],2) ? 1 : 0);
    if (eq >= 3) return "equi";
    if (eq >= 1) return "iso";
    return "scal";
  }
  function byAngles(P){
    var a = triAngles(P), mx = Math.max(a[0],a[1],a[2]);
    if (near(mx,90,1.5)) return "right";
    return mx > 90 ? "obtuse" : "acute";
  }

  /* ---------- the shapes ---------- */
  var TRIS = [
    { pts:[[150,22],[80,143],[220,143]] },                  // equilateral
    { pts:[[62,38],[62,160],[184,160]] },                   // right isosceles
    { pts:[[150,38],[85,158],[215,158]] },                  // acute isosceles
    { pts:[[150,98],[70,154],[230,154]] },                  // obtuse isosceles
    { pts:[[64,44],[64,158],[194,158]] },                   // right scalene
    { pts:[[52,150],[232,150],[196,66]] }                   // scalene
  ];

  var QUADS = [
    { key:"square",  pts:[[92,40],[212,40],[212,160],[92,160]] },
    { key:"rect",    pts:[[56,54],[244,54],[244,148],[56,148]] },
    { key:"para",    pts:[[70,156],[176,156],[228,60],[122,60]] },
    { key:"rhomb",   pts:[[150,30],[228,100],[150,170],[72,100]] },
    { key:"trap",    pts:[[68,156],[236,156],[198,64],[110,64]] }
  ];

  var SYMS = [
    { key:"square",   pts:[[92,42],[208,42],[208,158],[92,158]] },
    { key:"rect",     pts:[[62,58],[238,58],[238,142],[62,142]] },
    { key:"equi",     pts:[[150,30],[82,148],[218,148]] },
    { key:"iso",      pts:[[150,36],[90,156],[210,156]] },
    { key:"scal",     pts:[[58,152],[236,152],[198,62]] }
  ];
  var ANGLES = [0, 30, 45, 60, 90, 120, 135, 150];

  function centroid(P){
    var x=0,y=0; P.forEach(function(p){ x+=p[0]; y+=p[1]; });
    return [x/P.length, y/P.length];
  }
  function reflect(p, c, deg){
    var t = deg * Math.PI / 180, dx = p[0]-c[0], dy = p[1]-c[1];
    var cos = Math.cos(2*t), sin = Math.sin(2*t);
    return [c[0] + dx*cos + dy*sin, c[1] + dx*sin - dy*cos];
  }
  // a fold line works only if the reflected shape lands exactly on the original
  function isSymmetry(P, deg){
    var c = centroid(P);
    var R = P.map(function(p){ return reflect(p, c, deg); });
    return R.every(function(r){
      return P.some(function(p){ return d(p,r) < 2.2; });
    });
  }
  function symLines(P){ return ANGLES.filter(function(a){ return isSymmetry(P, a); }); }

  /* ---------- quadrilateral properties, all computed ---------- */
  function sidesOf(P){
    return P.map(function(p,i){ return d(p, P[(i+1)%P.length]); });
  }
  function anglesOf(P){
    return P.map(function(p,i){
      return angleAt(P[(i+3)%4], p, P[(i+1)%4]);
    });
  }
  function slope(a,b){ return Math.atan2(b[1]-a[1], b[0]-a[0]) * 180 / Math.PI; }
  function parallelPairs(P){
    var s01 = slope(P[0],P[1]), s23 = slope(P[2],P[3]);
    var s12 = slope(P[1],P[2]), s30 = slope(P[3],P[0]);
    var p1 = near(Math.abs(((s01 - s23) % 180 + 180) % 180), 0, 2) ||
             near(Math.abs(((s01 - s23) % 180 + 180) % 180), 180, 2);
    var p2 = near(Math.abs(((s12 - s30) % 180 + 180) % 180), 0, 2) ||
             near(Math.abs(((s12 - s30) % 180 + 180) % 180), 180, 2);
    return (p1 ? 1 : 0) + (p2 ? 1 : 0);
  }
  function quadProps(P){
    var s = sidesOf(P), a = anglesOf(P);
    return {
      allSides:  near(s[0],s[1],2) && near(s[1],s[2],2) && near(s[2],s[3],2),
      oppSides:  near(s[0],s[2],2) && near(s[1],s[3],2),
      allRight:  a.every(function(x){ return near(x,90,2); }),
      parPairs:  parallelPairs(P)
    };
  }

  var T = {
    tabTri:{en:"Triangles", ur:"مثلث"},
    tabQuad:{en:"Four sides", ur:"چار اضلاع"},
    tabSym:{en:"Symmetry", ur:"توازن"},
    titleTri:{en:"Every triangle has two names, not one.",
              ur:"ہر مثلث کے دو نام ہوتے ہیں، ایک نہیں۔"},
    subTri:{en:"One name comes from its sides, the other from its angles.",
            ur:"ایک نام اس کے اضلاع سے آتا ہے، دوسرا اس کے زاویوں سے۔"},
    titleQuad:{en:"A square is also a rectangle. And also a rhombus.",
               ur:"مربع، مستطیل بھی ہے۔ اور معین بھی۔"},
    subQuad:{en:"Shapes are named by what they have, so one shape can fit several names.",
             ur:"شکلوں کے نام ان کی خوبیوں سے بنتے ہیں، اس لیے ایک شکل کئی ناموں پر پوری اتر سکتی ہے۔"},
    titleSym:{en:"Fold it. Do the two halves land on each other?",
              ur:"موڑ کر دیکھیں۔ کیا دونوں حصے ایک دوسرے پر آ جاتے ہیں؟"},
    subSym:{en:"Try each fold line. Only the ones that match exactly count.",
            ur:"ہر لکیر پر موڑ کر دیکھیں۔ صرف وہی گنتی ہے جس پر دونوں حصے بالکل مل جائیں۔"},
    headTri:{en:"Pick a triangle", ur:"کوئی مثلث چنیں"},
    headQuad:{en:"Pick a shape", ur:"کوئی شکل چنیں"},
    headSym:{en:"Pick a shape, then try the fold lines", ur:"شکل چنیں، پھر لکیریں آزمائیں"},
    bySidesLbl:{en:"By its sides", ur:"اضلاع کے لحاظ سے"},
    byAnglesLbl:{en:"By its angles", ur:"زاویوں کے لحاظ سے"},
    equi:{en:"Equilateral — all 3 sides equal", ur:"مساوی الاضلاع — تینوں اضلاع برابر"},
    iso:{en:"Isosceles — 2 sides equal", ur:"مساوی الساقین — دو اضلاع برابر"},
    scal:{en:"Scalene — no sides equal", ur:"مختلف الاضلاع — کوئی ضلع برابر نہیں"},
    right:{en:"Right — one angle is exactly 90°", ur:"قائمۃ الزاویہ — ایک زاویہ ٹھیک 90°"},
    acute:{en:"Acute — every angle under 90°", ur:"حادّۃ الزاویہ — ہر زاویہ 90° سے کم"},
    obtuse:{en:"Obtuse — one angle over 90°", ur:"منفرجۃ الزاویہ — ایک زاویہ 90° سے زیادہ"},
    triChip:{en:"{a}° + {b}° + {c}° = 180°", ur:"{a}° + {b}° + {c}° = 180°"},
    triDet:{en:"Add the three angles of any triangle at all and you always get 180. Try every triangle here and check.",
            ur:"کسی بھی مثلث کے تینوں زاویے جوڑیں، جواب ہمیشہ 180 آئے گا۔ یہاں کی ہر مثلث پر جانچ لیں۔"},
    triWhy:{en:"The two names answer two different questions. A triangle can be isosceles by its sides and right by its angles at the same time — they are not competing.",

  function $(id){ return document.getElementById(id); }
  function t(o){ return o[lang]; }

  var LRI = "\u2066", PDI = "\u2069";
  var LATIN_RUN = /[A-Za-z0-9][A-Za-z0-9 .,%+()\u00b0\/@_\u2212-]*[A-Za-z0-9\u00b0]|[A-Za-z0-9]/g;
  function isolate(s){ return s.replace(LATIN_RUN, function(m){ return LRI + m + PDI; }); }
  function setText(el, str){
    el.textContent = (lang === "ur") ? isolate(str) : str;
    el.classList.toggle("ur", lang === "ur");
    el.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
  }
  function fill(s, m){ Object.keys(m).forEach(function(k){ s = s.split("{"+k+"}").join(m[k]); }); return s; }

  var NS = "http://www.w3.org/2000/svg";
  function mk(tag, a){
    var e = document.createElementNS(NS, tag);
    for (var k in a) e.setAttribute(k, a[k]);
    return e;
  }
  function poly(P){ return P.map(function(p){ return p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" "); }

  /* ---------- drawing ---------- */
  function drawScene(){
    var svg = $("svg"); svg.innerHTML = "";
    var g = mk("g", {}); svg.appendChild(g);

    if (tab === "tri"){
      var P = TRIS[triI].pts;
      g.appendChild(mk("polygon", {points:poly(P), fill:"var(--shape-fill)",
                                   stroke:"var(--shape)", "stroke-width":4,
                                   "stroke-linejoin":"round"}));
      // equal sides get matching tick marks
      var s = triSides(P);
      var groups = {};
      s.forEach(function(len, i){
        var key = Math.round(len/3);
        groups[key] = groups[key] || [];
        groups[key].push(i);
      });
      var gi = 0;
      Object.keys(groups).forEach(function(k){
        var arr = groups[k]; gi++;
        if (arr.length < 2) return;               // only mark sides that share a length
        arr.forEach(function(i){
          var a = P[i], b = P[(i+1)%3];
          var mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
          var ang = Math.atan2(b[1]-a[1], b[0]-a[0]);
          for (var m=0;m<gi;m++){
            var off = (m - (gi-1)/2) * 6;
            var ox = Math.cos(ang)*off, oy = Math.sin(ang)*off;
            var px = -Math.sin(ang)*7, py = Math.cos(ang)*7;
            g.appendChild(mk("line", {x1:mx+ox-px, y1:my+oy-py, x2:mx+ox+px, y2:my+oy+py,
                                      stroke:"var(--mark)", "stroke-width":3,
                                      "stroke-linecap":"round"}));
          }
        });
      });
      // angle labels, and a small square on a right angle
      var ang = triAngles(P);
      P.forEach(function(p, i){
        var c = centroid(P);
        var tx = p[0] + (c[0]-p[0])*0.26, ty = p[1] + (c[1]-p[1])*0.26;
        var lab = mk("text", {x:tx, y:ty+5, "text-anchor":"middle", "font-size":"14",
                              "font-weight":"800", fill:"var(--shape-deep)",
                              "font-family":"Baloo Bhaijaan 2, sans-serif"});
        lab.textContent = ang[i] + "\u00b0";
        g.appendChild(lab);
        if (near(ang[i], 90, 1.5)){
          var a2 = P[(i+2)%3], b2 = P[(i+1)%3];
          var u1 = [(a2[0]-p[0])/d(p,a2), (a2[1]-p[1])/d(p,a2)];
          var u2 = [(b2[0]-p[0])/d(p,b2), (b2[1]-p[1])/d(p,b2)];
          var k = 15;
          g.appendChild(mk("path", {d:"M"+(p[0]+u1[0]*k)+" "+(p[1]+u1[1]*k)+
                                      " L"+(p[0]+(u1[0]+u2[0])*k)+" "+(p[1]+(u1[1]+u2[1])*k)+
                                      " L"+(p[0]+u2[0]*k)+" "+(p[1]+u2[1]*k),
                                    fill:"none", stroke:"var(--shape-deep)", "stroke-width":2.5}));
        }
      });
      return;
    }

    if (tab === "quad"){
      var Q = QUADS[quadI].pts;
      g.appendChild(mk("polygon", {points:poly(Q), fill:"var(--shape-fill)",
                                   stroke:"var(--shape)", "stroke-width":4,
                                   "stroke-linejoin":"round"}));
      var sd = sidesOf(Q), an = anglesOf(Q);
      Q.forEach(function(p,i){
        var b = Q[(i+1)%4];
        var mx=(p[0]+b[0])/2, my=(p[1]+b[1])/2;
        var lab = mk("text", {x:mx, y:my-6, "text-anchor":"middle", "font-size":"12",
                              "font-weight":"800", fill:"var(--mark)",
                              "font-family":"Baloo Bhaijaan 2, sans-serif"});
        lab.textContent = Math.round(sd[i]);
        g.appendChild(lab);
        if (near(an[i],90,2)){
          var c = centroid(Q);
          g.appendChild(mk("rect", {x:p[0] + (c[0]-p[0])*0.07 - 6, y:p[1] + (c[1]-p[1])*0.07 - 6,
                                    width:12, height:12, fill:"none",
                                    stroke:"var(--shape-deep)", "stroke-width":2}));
        }
      });
      return;
    }

    // symmetry
    var S = SYMS[symI].pts, c2 = centroid(S);
    g.appendChild(mk("polygon", {points:poly(S), fill:"var(--shape-fill)",
                                 stroke:"var(--shape)", "stroke-width":4,
                                 "stroke-linejoin":"round"}));
    var picked = tried.pick;
    if (picked !== undefined){
      var R = S.map(function(p){ return reflect(p, c2, picked); });
      g.appendChild(mk("polygon", {points:poly(R), fill:"none", id:"mirrorShape",
                                   stroke:"var(--mirror)", "stroke-width":4,
                                   "stroke-dasharray":"7 5", "stroke-linejoin":"round"}));
      var rad = picked * Math.PI / 180, L = 150;
      g.appendChild(mk("line", {x1:c2[0]-Math.cos(rad)*L, y1:c2[1]-Math.sin(rad)*L,
                                x2:c2[0]+Math.cos(rad)*L, y2:c2[1]+Math.sin(rad)*L,
                                stroke:"var(--ink-soft)", "stroke-width":2,
                                "stroke-dasharray":"4 4"}));
    }
  }

  /* ---------- render ---------- */
  function twoCards(list){
    var box = $("two"); box.innerHTML = "";
    list.forEach(function(c){
      var dv = document.createElement("div"); dv.className = "nm";
      var em = document.createElement("em"); em.textContent = c[0];
      em.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
      var b = document.createElement("b"); b.textContent = c[1];
      b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
      dv.appendChild(em); dv.appendChild(b); box.appendChild(dv);
    });
  }
  function propRows(list){
    var box = $("props"); box.innerHTML = "";
    list.forEach(function(r){
      var row = document.createElement("div");
      row.className = "prow " + (r[1] ? "yes" : "no");
      var tk = document.createElement("span"); tk.className = "tick";
      tk.textContent = r[1] ? "\u2713" : "\u2013";
      var lb = document.createElement("span"); lb.textContent = r[0];
      lb.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
      row.appendChild(tk); row.appendChild(lb); box.appendChild(row);
    });
  }

  function render(){
    drawScene();
    ["Tri","Quad","Sym"].forEach(function(x){
      $("tab"+x).setAttribute("aria-pressed", tab === x.toLowerCase() ? "true" : "false");
    });
    setText($("tabTri"), t(T.tabTri));
    setText($("tabQuad"), t(T.tabQuad));
    setText($("tabSym"), t(T.tabSym));
    $("whyLbl").textContent = t(T.whyLbl);
    setText($("quizHead"), t(T.quiz));

    var chips = $("chips"), lines = $("lines"), btns = $("btns");
    chips.innerHTML = ""; lines.innerHTML = ""; btns.innerHTML = "";
    $("two").innerHTML = ""; $("props").innerHTML = "";
    var chip = $("statechip"); chip.className = "statechip";

    if (tab === "tri"){
      var P = TRIS[triI].pts, a = triAngles(P);
      setText($("title"), t(T.titleTri));
      setText($("subtitle"), t(T.subTri));
      setText($("panelHead"), t(T.headTri));
      setText(chip, fill(t(T.triChip), {a:a[0], b:a[1], c:a[2]}));
      setText($("headline"), t(T[bySides(P)]).split("\u2014")[0].trim() + " \u00b7 " +
                             t(T[byAngles(P)]).split("\u2014")[0].trim());
      setText($("detail"), t(T.triDet));
      twoCards([[t(T.bySidesLbl), t(T[bySides(P)])],
                [t(T.byAnglesLbl), t(T[byAngles(P)])]]);
      setText($("whyText"), (bySides(P) !== "scal" && byAngles(P) === "right")
                            ? t(T.triWhy) : t(T.triWhy180));
      TRIS.forEach(function(x, i){
        var b = document.createElement("button");
        b.type = "button"; b.className = "schip";
        b.textContent = String(i+1);
        b.setAttribute("aria-pressed", i === triI ? "true" : "false");
        b.addEventListener("click", function(){ triI = i; render(); });
        chips.appendChild(b);
      });
      lastSpoken = t(T[bySides(P)]) + ". " + t(T[byAngles(P)]);
      return;
    }

    if (tab === "quad"){
      var Q = QUADS[quadI], pr = quadProps(Q.pts);
      setText($("title"), t(T.titleQuad));
      setText($("subtitle"), t(T.subQuad));
      setText($("panelHead"), t(T.headQuad));
      setText(chip, t(T.qNames[Q.key]));
      // which other names this shape also satisfies
      var also = [];
      if (pr.allRight && pr.oppSides && Q.key !== "rect")  also.push(t(T.qNames.rect));
      if (pr.allSides && Q.key !== "rhomb")                also.push(t(T.qNames.rhomb));
      if (pr.parPairs === 2 && Q.key !== "para")           also.push(t(T.qNames.para));
      setText($("headline"), t(T.qNames[Q.key]));
      setText($("detail"), also.length ? fill(t(T.qAlso), {list: also.join("\u060c ")})
                                       : t(T.qOnly));
      propRows([
        [t(T.p4equal), pr.allSides],
        [t(T.popp),    pr.oppSides],
        [t(T.pright),  pr.allRight],
        [t(T.ppar),    pr.parPairs === 2],
        [t(T.ppar1),   pr.parPairs >= 1]
      ]);
      setText($("whyText"), also.length ? t(T.qWhySq) : t(T.qWhy));
      QUADS.forEach(function(x, i){
        var b = document.createElement("button");
        b.type = "button"; b.className = "schip";
        b.textContent = t(T.qNames[x.key]);
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.setAttribute("aria-pressed", i === quadI ? "true" : "false");
        b.addEventListener("click", function(){ quadI = i; render(); });
        chips.appendChild(b);
      });
      lastSpoken = t(T.qNames[Q.key]);
      return;
    }

    // symmetry
    var S = SYMS[symI], all = symLines(S.pts);
    setText($("title"), t(T.titleSym));
    setText($("subtitle"), t(T.subSym));
    setText($("panelHead"), t(T.headSym));
    var found = ANGLES.filter(function(ang){
      return tried[ang] && all.indexOf(ang) >= 0;
    }).length;
    setText(chip, fill(t(T.symFound), {f:found, n:all.length}));
    chip.className = "statechip" + (found === all.length ? " ok" : "");

    if (tried.pick === undefined){
      setText($("headline"), t(T.symPick));
      setText($("detail"), t(T.symDet));
    } else {
      var good = all.indexOf(tried.pick) >= 0;
      setText($("headline"), good ? t(T.symYes) : t(T.symNo));
      setText($("detail"), t(T.symDet));
      chip.className = "statechip " + (good ? "ok" : "no");
      setText(chip, fill(t(T.symFound), {f:found, n:all.length}));
    }
    setText($("whyText"), all.length === 0 ? t(T.symWhyNone)
                        : (found === all.length ? fill(t(T.symDone), {n:all.length})
                                                : t(T.symWhy)));

    SYMS.forEach(function(x, i){
      var b = document.createElement("button");
      b.type = "button"; b.className = "schip";
      var nm = (x.key === "square") ? t(T.qNames.square)
             : (x.key === "rect")   ? t(T.qNames.rect)
             : (x.key === "equi")   ? t(T.equi).split("\u2014")[0].trim()
             : (x.key === "iso")    ? t(T.iso).split("\u2014")[0].trim()
                                    : t(T.scal).split("\u2014")[0].trim();
      b.textContent = nm;
      b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
      b.setAttribute("aria-pressed", i === symI ? "true" : "false");
      b.addEventListener("click", function(){ symI = i; tried = {}; render(); });
      chips.appendChild(b);
    });
    ANGLES.forEach(function(ang){
      var b = document.createElement("button");
      b.type = "button";
      var cls = "lchip";
      if (tried[ang]) cls += (all.indexOf(ang) >= 0) ? " hit" : " missed";
      b.className = cls;
      b.textContent = ang + "\u00b0";
      b.setAttribute("dir","ltr");
      b.setAttribute("aria-pressed", tried.pick === ang ? "true" : "false");
      b.addEventListener("click", function(){
        tried[ang] = true; tried.pick = ang; render();
      });
      lines.appendChild(b);
    });
    var r = document.createElement("button"); r.type = "button"; r.className = "go";
    r.addEventListener("click", function(){ tried = {}; render(); });
    setText(r, t(T.reset));
    btns.appendChild(r);
    lastSpoken = t(T.symDet);
  }

  var lastSpoken = "";

  ["Tri","Quad","Sym"].forEach(function(x){
    $("tab"+x).addEventListener("click", function(){
      var m = x.toLowerCase();
      if (tab === m) return;
      tab = m; tried = {}; render();
    });
  });

  /* ---------- quiz ---------- */
  function buildQuiz(){
    var box = $("quizBox"); box.innerHTML = "";
    QUIZ.forEach(function(item){
      var wrap = document.createElement("div"); wrap.className = "q";
      var q = document.createElement("p"); setText(q, t(item.q)); wrap.appendChild(q);
      var fb = document.createElement("p"); fb.className = "fb";
      item.o.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang === "ur" ? " ur" : "");
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.textContent = t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done") === "1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show","fb");
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb); box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");
    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });
    buildQuiz(); render();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en"; applyLang();
  });

  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(lastSpoken);
      u.lang = (lang === "ur") ? "ur-PK" : "en-US";
      u.rate = 0.92;
      var voices = window.speechSynthesis.getVoices() || [];
      for (var i=0;i<voices.length;i++){
        if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(lang === "ur" ? "ur" : "en") === 0){
          u.voice = voices[i]; break;
        }
      }
      window.speechSynthesis.speak(u);
    }catch(e){ /* no voice available — stay quiet */ }
  });

  applyLang();
})();
</script>
</body>
</html>
