:100px;padding:11px 8px;cursor:pointer;text-align:center;font-weight:800}.card:hover,.card.selected{border-color:var(--blue);background:var(--blue2)}.emoji{display:block;font-size:2.35rem;line-height:1.1;margin-bottom:5px}.card small{display:block;font-size:var(--fs-cap);font-weight:600;color:var(--muted)}.lesson-grid{display:grid;gap:13px}.lesson{border:3px solid var(--line);border-radius:18px;background:#fff;padding:16px 18px;scroll-margin-top:12px}.lesson .tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:4px 14px;font-size:var(--fs-cap);font-weight:900;margin-bottom:9px}.lesson.hook .tag{background:var(--orange)}.lesson.misaal .tag{background:var(--green)}.lesson.karo .tag{background:var(--purple)}.lesson p{margin:0;font-size:var(--fs-sm)}.quiz{border-top:3px solid var(--ink);margin-top:30px;padding-top:21px;scroll-margin-top:12px}.quiz h2{font-size:var(--fs-lg);margin:0 0 18px}.q{margin-bottom:27px}.q-title{font-size:var(--fs-md);font-weight:800;margin:0 0 10px}.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;min-height:54px;font-size:var(--fs-sm)}.opt.right{border-color:var(--green);background:#e5f3eb;font-weight:800}.opt.wrong{border-color:var(--red);background:#fae5e1}.feedback{display:none;color:var(--muted);font-size:var(--fs-cap);margin:8px 0}.feedback.show{display:block}.score{display:none;text-align:center;border:3px solid var(--green);background:#e5f3eb;border-radius:15px;padding:13px;font-size:var(--fs-md);font-weight:900}.score.show{display:block}footer{margin-top:31px;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:var(--fs-cap)}@media(min-width:760px){.lesson-grid{grid-template-columns:1fr 1fr}.demo-wrap{padding:20px}.cards{grid-template-columns:repeat(4,1fr)}.play{width:auto;min-width:190px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><div class="wrap"><div class="bar"><span class="brand" id="brand"></span><button class="chip" id="langBtn" type="button" aria-pressed="false">Roman Urdu</button><button class="chip" id="speakBtn" type="button" aria-label="Read title aloud">🔊</button></div><header><h1 id="title"></h1><p class="sub" id="subtitle"></p></header><nav class="tabs" id="tabs" aria-label="Lesson sections"></nav><section class="demo-wrap" id="demo" aria-labelledby="demoTitle"><div class="demo-head"><h2 id="demoTitle"></h2><button class="chip" id="launch" type="button">Play demo</button></div><p class="demo-instruction" id="demoInstruction"></p><div class="demo-stage" id="demoStage"></div></section><main class="lesson-grid"><article class="lesson hook" id="hook"><span class="tag" id="hookTag"></span><p id="hookText"></p></article><article class="lesson samjhao" id="samjhao"><span class="tag" id="samjhaoTag"></span><p id="samjhaoText"></p></article><article class="lesson misaal" id="misaal"><span class="tag" id="misaalTag"></span><p id="misaalText"></p></article><article class="lesson karo" id="karo"><span class="tag" id="karoTag"></span><p id="karoText"></p></article></main><section class="quiz" id="quiz"><h2 id="quizHead"></h2><div id="quizBox"></div><div class="score" id="score"></div></section><footer id="foot"></footer></div><script>const DATA={"file":"g1-mera-jism.html","title":"Mera jism","desc":{"en":"Learn body parts and what they do.","ru":"Apne jism ke hisson aur un ke kaam seekho."},"hook":{"en":"Your body helps you play, learn, eat, and smile. Can you name some body parts?","ru":"Bachay, kabhi kabhi hum sochte hain ke jab hum cricket khelte hain ya chaat khate hain, to humein kis tarah se apne jism ki hifazat karni chahiye? Aaj hum apne jism ke hisse aur unke kaamon ke bare mein jaanenge!"},"samjhao":{"en":"The head helps us think and talk. Eyes help us see. Ears help us hear. Hands help us hold and write. Legs and feet help us walk, run, and jump.","ru":"Sab se pehle, chalo samajhte hain ke jism ke kya kya hisse hote hain. Hamara jism do main hisse mein taqseem hota hai: upper body aur lower body. Upper body mein humare sir, haath aur seena shamil hain. Lower body mein hamari legs aur pairo ka hisaab hota hai. Ab hum dekhte hain ke har hisa ka kya kaam hai. Sir humare liye sochne aur bolne ka kaam karta hai. Haath hume cheezon ko pakadne, likhne aur khelne mein madad dete hain. Seena jo hai woh hamare dil aur lungs ko sambhalta hai, jo zinda rehne ke liye bahut zaroori hain. Phir aate hain lower body ki taraf. Hamari legs hume chalne, daudne aur khelne mein madad deti hain. Jab hum bazaar jaate hain ya cricket khelte hain, to legs ki madad se hi yah sab mumkin hota hai. Aur hamare pairo mein kuch special muscles hote hain jo hume upar uthne ya jump karne ke liye madad karte hain. Har hisa apne kaam mein bohat ahmiyat rakhta hai. Isliye humein apne jism ka khayal rakhna chahiye. Mazboot jism se hi hum healthy aur khush reh sakte hain."},"misaal":{"en":"When you play cricket, your eyes watch the ball, your hands hold the bat, and your legs run.","ru":"Chalo, sochte hain! Jab hum bazaar jaate hain to bechne wale achi biryani bech rahe hote hain. Us waqt humare sir me yeh soch rahe hote hain ke hum kya khareedna chahte hain. Haath use karte hain taake biryani ka dabba pakad saken. Aur jab hum ghar jaate hain, to legs se chalte hain. Is tarah se hum apne jism ke har hisse ka istemal karte hain."},"karo":{"en":"Stand near a mirror with an adult. Point to body parts and say each name and its job.","ru":"Ab aapko apne jism ke hisse ko pehchaanne ka ek mazaidar activity karna hai. Ghar mein ya school mein aik mirror (aaina) ke samne khade ho jao. Apne har hisse ko dekho aur unhe buland awaaz se bulao. Jaise “Yeh mera haath hai!” aur phir haath ko hilao. Phir “Yeh mera sir hai!” kaho aur sir ko ghooma do. Is tarah se aap apne jism ko jaan paoge aur seekh paoge."},"demo":{"type":"cards","title":{"en":"Body-part match","ru":"Body-part match"},"instruction":{"en":"Tap a body part to see its job.","ru":"Body part par tap karke us ka kaam dekho."},"items":[{"emoji":"🧠","name":{"en":"Head","ru":"Sar"},"label":{"en":"Head: think and talk.","ru":"Sar: sochna aur baat karna."}},{"emoji":"👀","name":{"en":"Eyes","ru":"Aankhen"},"label":{"en":"Eyes: see things.","ru":"Aankhen: cheezen dekhna."}},{"emoji":"✋","name":{"en":"Hands","ru":"Haath"},"label":{"en":"Hands: hold and write.","ru":"Haath: pakarna aur likhna."}},{"emoji":"🦶","name":{"en":"Feet","ru":"Pair"},"label":{"en":"Feet: walk and jump.","ru":"Pair: chalna aur uchhalna."}}]},"quiz":[{"q":{"en":"Which body part helps you see?","ru":"Kaunsa body part tumhein dekhne mein madad deta hai?"},"o":[{"en":"Eyes","ru":"Aankhen"},{"en":"Feet","ru":"Pair"},{"en":"Hands","ru":"Haath"},{"en":"Knees","ru":"Ghutne"}],"a":0,"e":{"en":"Eyes help us see.","ru":"Eyes help us see."}},{"q":{"en":"What do we use to write?","ru":"Hum likhne ke liye kya istemal karte hain?"},"o":[{"en":"Hands","ru":"Haath"},{"en":"Ears","ru":"Kaan"},{"en":"Feet","ru":"Pair"},{"en":"Hair","ru":"Baal"}],"a":0,"e":{"en":"Hands hold a pencil and help us write.","ru":"Hands hold a pencil and help us write."}},{"q":{"en":"Which part helps you hear?","ru":"Kaunsa part tumhein sunne mein madad deta hai?"},"o":[{"en":"Ears","ru":"Kaan"},{"en":"Eyes","ru":"Aankhen"},{"en":"Nose","ru":"Naak"},{"en":"Toes","ru":"Pair ki ungliyan"}],"a":0,"e":{"en":"Ears help us hear sounds.","ru":"Ears help us hear sounds."}},{"q":{"en":"What can legs help you do?","ru":"Taangen tumhein kya karne mein madad deti hain?"},"o":[{"en":"Run","ru":"Daurna"},{"en":"See","ru":"Dekhna"},{"en":"Smell","ru":"Khushboo lena"},{"en":"Hear","ru":"Sunna"}],"a":0,"e":{"en":"Legs help us walk and run.","ru":"Legs help us walk and run."}},{"q":{"en":"How should we care for our body?","ru":"Humein apne jism ka khayal kaise rakhna chahiye?"},"o":[{"en":"Keep it clean and safe","ru":"Isay saaf aur mehfooz rakhein"},{"en":"Never wash","ru":"Kabhi na dhoyein"},{"en":"Push it","ru":"Isay dhakka dein"},{"en":"Ignore it","ru":"Isay nazar-andaz karein"}],"a":0,"e":{"en":"Clean and safe habits help our body.","ru":"Clean and safe habits help our body."}}]};
(function(){'use strict';var lang='en',selected=0,answered=0,score=0;
function $(id){return document.getElementById(id)}

function put(el,x){if(!el)return;el.textContent=t(x);el.dir='ltr'}
function labels(){return {play:{en:'Play',ru:'Play'},hook:{en:'HOOK',ru:'HOOK'},samjhao:{en:'SAMJHAO',ru:'SAMJHAO'},misaal:{en:'MISAAL',ru:'MISAAL'},karo:{en:'KARO',ru:'KARO'}}}
function setCommon(){document.documentElement.lang=lang;document.title=t(DATA.title)+' | AI4Kids Grade 1 Science';put($('brand'),{en:'AI4Kids · Grade 1 · Science',ru:'AI4Kids · Jamaat 1 · Science'});put($('title'),DATA.title);put($('subtitle'),DATA.desc);put($('quizHead'),{en:'Quiz — 5 questions',ru:'Quiz — 5 sawaal'});put($('foot'),{en:'AI4Kids · Grade 1 Science · Offline lesson',ru:'AI4Kids · Jamaat 1 Science · Offline lesson'});$('langBtn').textContent=lang==='en'?'Roman Urdu':'English';$('langBtn').setAttribute('aria-pressed',lang==='ru');var L=labels();['hook','samjhao','misaal','karo'].forEach(function(k){put($(k+'Tag'),L[k]);put($(k+'Text'),DATA[k])});put($('demoTitle'),DATA.demo.title);put($('demoInstruction'),DATA.demo.instruction);put($('launch'),{en:'Play demo',ru:'Demo khelo'});renderTabs();renderDemo();renderQuiz()}
function renderTabs(){var box=$('tabs');box.innerHTML='';var L=labels();[['play',L.play],['hook',L.hook],['samjhao',L.samjhao],['misaal',L.misaal],['karo',L.karo]].forEach(function(x){var b=document.createElement('button');b.className='tab';b.type='button';b.textContent=t(x[1]);b.setAttribute('aria-pressed',x[0]==='play');b.onclick=function(){var target=x[0]==='play'?'demo':x[0];$(target).scrollIntoView({behavior:'smooth'})};box.appendChild(b)})}
function msg(en,ru){return {en:en,ru:ru}}
function baseMsg(stage,text){var p=document.createElement('div');p.className='demo-msg';put(p,text);stage.appendChild(p)}
function renderDemo(){var stage=$('demoStage');stage.innerHTML='';var row=document.createElement('div');row.className='cards';DATA.demo.items.forEach(function(it,i){var b=document.createElement('button');b.type='button';b.className='card'+(selected===i?' selected':'');var sp=document.createElement('span');sp.className='emoji';sp.textContent=it.emoji;b.appendChild(sp);b.appendChild(document.createTextNode(t(it.name)));b.onclick=function(){selected=i;renderDemo()};row.appendChild(b)});stage.appendChild(row);var play=document.createElement('button');play.type='button';play.className='play';play.textContent=lang==='en'?'▶ Play':'▶ Play karo';play.onclick=function(){baseMsg(stage,DATA.demo.items[selected].label)};stage.appendChild(play);baseMsg(stage,msg('Choose a card, then press Play.','Card chuno, phir Play dabao.'))}
function renderQuiz(){var box=$('quizBox');box.innerHTML='';answered=0;score=0;$('score').classList.remove('show');DATA.quiz.forEach(function(q,qi){var wrap=document.createElement('section');wrap.className='q';var title=document.createElement('p');title.className='q-title';title.textContent=(qi+1)+'. '+t(q.q);wrap.appendChild(title);q.o.forEach(function(op,oi){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+oi)+'. '+t(op);b.onclick=function(){if(wrap.dataset.done)return;wrap.dataset.done='1';answered++;var ok=oi===q.a;if(ok)score++;b.classList.add(ok?'right':'wrong');if(!ok)wrap.querySelectorAll('.opt').forEach(function(x,xi){if(xi===q.a)x.classList.add('right')});var fb=wrap.querySelector('.feedback');fb.textContent=(ok?'✓ ':'✗ ')+t(q.e);fb.classList.add('show');wrap.querySelectorAll('button').forEach(function(x){x.disabled=true});if(answered===DATA.quiz.length){$('score').textContent=t({en:'Your score: '+score+' / 5 — '+(score===5?'Excellent!':'Good practice!'),ru:'Tumhara score: '+score+' / 5 — '+(score===5?'Shabash!':'Achi practice!')});$('score').classList.add('show')}};wrap.appendChild(b)});var fb=document.createElement('p');fb.className='feedback';wrap.appendChild(fb);box.appendChild(wrap)})}
$('langBtn').onclick=function(){lang=lang==='en'?'ru':'en';selected=0;setCommon()};$('speakBtn').onclick=function(){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t(DATA.title)+' '+t(DATA.desc));u.lang=lang==='en'?'en-US':'en-PK';u.rate=.9;window.speechSynthesis.speak(u)};$('launch').onclick=function(){$('demo').scrollIntoView({behavior:'smooth'});renderDemo()};setCommon()})();</script></body></html>
