<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idioms aur Proverbs — محاورے اور کہاوتیں | AI4Kids Class 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(0.95rem, 2.4vw, 1.15rem);
  --fs-xs: clamp(1.15rem, 3vw, 1.35rem);
  --fs-sm: clamp(1.3rem, 3.4vw, 1.55rem);
  --fs-md: clamp(1.45rem, 3.8vw, 1.8rem);
  --fs-lg: clamp(1.7rem, 4.6vw, 2.2rem);
  --fs-xl: clamp(2.1rem, 5.5vw, 2.75rem);
}
/* /AI4KIDS_FS_SCALE */

  :root{
    --board:#f3eee6;
    --board-deep:#e6dccd;
    --lit:#c9702e;
    --lit-deep:#96500f;
    --real:#2e7d55;
    --real-deep:#1d5a3c;
    --prov:#6b4a8f;
    --ink:#241f18;
    --ink-soft:#554c41;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#6b4a8f;
    --ok:#2e7d4f;
    --no:#c4453a;

    --fs-cap:clamp(15px, 3.9vw, 16px);
    --fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.7vw, 19px);
    --fs-md:clamp(19px, 5.1vw, 21px);
    --fs-lg:clamp(22px, 5.9vw, 25px);
    --fs-xl:clamp(28px, 7.6vw, 34px);
    --lh:1.5;
  }
  /* Urdu is set larger than Latin — Nastaliq reads smaller at the same size. */
  body.urdu{
    --fs-cap:clamp(17px, 4.4vw, 18px);
    --fs-xs:clamp(18px, 4.7vw, 20px);
    --fs-sm:clamp(20px, 5.2vw, 22px);
    --fs-md:clamp(21px, 5.6vw, 23px);
    --fs-lg:clamp(24px, 6.4vw, 27px);
    --fs-xl:clamp(27px, 7.2vw, 32px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:44px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--lit);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .tabs{display:flex;gap:7px;margin:0 0 14px}
  .tabs button{
    flex:1;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:56px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
    transition:background .4s ease;
  }
  .scene.real{background:linear-gradient(180deg,#e8f2ec 0%,#d6e8de 100%)}
  .scene svg{display:block;width:100%;height:auto}

  .flip{
    display:flex;gap:8px;margin-top:12px;
  }
  .flip button{
    flex:1;border:3px solid var(--line);background:var(--paper);color:var(--ink-soft);
    border-radius:16px;padding:11px 8px;font:inherit;font-weight:800;
    font-size:var(--fs-xs);cursor:pointer;min-height:60px;line-height:1.3;
  }
  .flip button.l[aria-pressed="true"]{border-color:var(--lit);background:#fbf0e6;color:var(--lit-deep)}
  .flip button.r[aria-pressed="true"]{border-color:var(--real);background:#e8f2ec;color:var(--real-deep)}

  .readout{
    margin-top:14px;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--lit);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.real{background:var(--real)}
  .statechip.prov{background:var(--prov)}
  .statechip.ok{background:var(--ok)} .statechip.no{background:var(--no)}
  .phrase{font-weight:800;font-size:var(--fs-lg);margin:0 0 8px;line-height:1.35;direction:ltr}
  .meaning{margin:0 0 6px;font-size:var(--fs-sm);color:var(--ink)}
  .detail{margin:8px 0 0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .urcard{
    margin-top:14px;border:2px solid var(--prov);background:#f2eef8;border-radius:14px;
    padding:12px 14px;
  }
  .urcard em{display:block;font-style:normal;font-size:var(--fs-cap);color:var(--ink-soft);
             font-weight:700;margin-bottom:5px}
  .urcard b{display:block;font-size:var(--fs-md);font-weight:800;color:var(--prov);line-height:2}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}
  body.urdu .why-note{
    border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;
    line-height:var(--lh);
  }

  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .schip{
    border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;
    font:inherit;font-size:var(--fs-cap);font-weight:700;color:var(--ink);cursor:pointer;
    min-height:46px;direction:ltr;
  }
  .schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .schip.done{border-color:var(--ok)}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  .opts button{
    border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 15px;
    font:inherit;font-size:var(--fs-sm);font-weight:700;color:var(--ink);cursor:pointer;
    min-height:54px;text-align:left;direction:ltr;
  }
  .opts button.right{border-color:var(--ok);background:#e8f2ed}
  .opts button.wrong{border-color:var(--no);background:#fbeae8}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:52px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--no);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "quiz quiz" "foot foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

<script>
(function(){

  var lang = "en";

  var NS = "http://www.w3.org/2000/svg";
  function mk(tag, a){
    var e = document.createElementNS(NS, tag);
    for (var k in a) e.setAttribute(k, a[k]);
    return e;
  }
  function add(g, tag, a){ var e = mk(tag,a); g.appendChild(e); return e; }
  function cloud(g, x, y, s){
    add(g,"ellipse",{cx:x-22*s, cy:y, rx:26*s, ry:17*s, fill:"#cfd8e0"});

    add(g,"path",{d:"M"+(x-16)+" "+(y+26)+" L"+(x-12)+" "+(y-10)+

      g.appendChild(mk("line",{x1:150,y1:62,x2:150,y2:146,stroke:"#b7ae99","stroke-width":2.5}));
      for (var r=0;r<4;r++){
        g.appendChild(mk("line",{x1:60,y1:92+r*16,x2:138,y2:88+r*16,stroke:"#ddd4c0","stroke-width":3}));
        g.appendChild(mk("line",{x1:162,y1:88+r*16,x2:240,y2:92+r*16,stroke:"#ddd4c0","stroke-width":3}));
      }
      chip.className = "statechip prov";
      setText(chip, t(T.provChip));
      $("phrase").textContent = pv.en;
      setText($("meaning"), t(pv.mean));
      setText($("detail"), "");
      $("urcard").style.display = "";
      $("urcard").innerHTML = "";
      var em2 = document.createElement("em"); em2.textContent = t(T.urLbl);
      em2.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
      var b2 = document.createElement("b"); b2.textContent = pv.ur;
      b2.setAttribute("dir","rtl"); b2.className = "ur";
      $("urcard").appendChild(em2); $("urcard").appendChild(b2);
      setText($("whyText"), t(pv.note));
      PROVS.forEach(function(x, i){
        var bt = document.createElement("button");
        bt.type = "button"; bt.className = "schip";
        bt.textContent = String(i+1);
        bt.setAttribute("aria-pressed", i === provI ? "true" : "false");
        bt.addEventListener("click", function(){ provI = i; render(); });
        chips.appendChild(bt);
      });
      lastSpoken = pv.en;
      return;
    }

    // which idiom fits
    var us = USES[useI], correct = IDIOMS[us.a];
    setText($("title"), t(T.titleUse));
    setText($("subtitle"), t(T.subUse));
    setText($("panelHead"), t(T.headUse));
    if (picked !== null && picked === us.a) correct.drawR(g);
    else IDIOMS[picked === null ? us.a : picked].drawL(g);
    $("scene").classList.toggle("real", picked === us.a);
    if (picked === null){
      setText(chip, t(T.ask));
    } else if (picked === us.a){
      chip.className = "statechip ok"; setText(chip, t(T.right)); solved[useI] = true;
    } else {
      chip.className = "statechip no"; setText(chip, t(T.wrong));
    }
    $("phrase").textContent = picked === us.a ? correct.en : "";
    setText($("meaning"), t(us.sit));
    setText($("detail"), picked === us.a ? t(correct.real) : "");
    setText($("whyText"), t(T.whyUse));

    // Four choices. The wrong ones used to be whichever idioms came first in the list,
    // so a child could spot the answer by position instead of by meaning. They are now
    // spread around the answer, and the answer lands in a different slot each time.
    var pool = [us.a];
    for (var k=1; k<=3; k++) pool.push((us.a + k * 2 + useI) % IDIOMS.length);
    pool = pool.filter(function(v, i){ return pool.indexOf(v) === i; });
    for (var k2=1; pool.length < 4; k2++){
      var cand = (us.a + k2) % IDIOMS.length;
      if (pool.indexOf(cand) < 0) pool.push(cand);
    }
    pool.sort(function(a,b){ return ((a*5 + useI*7) % 13) - ((b*5 + useI*7) % 13); });
    pool.forEach(function(i){
      var bt = document.createElement("button");
      bt.type = "button";
      bt.textContent = IDIOMS[i].en;
      if (picked !== null){
        if (i === us.a) bt.className = "right";
        else if (i === picked) bt.className = "wrong";
      }
      bt.addEventListener("click", function(){
        if (picked !== null) return;
        picked = i; render();
      });
      opts.appendChild(bt);
    });

    USES.forEach(function(x, i){
      var bt = document.createElement("button");
      bt.type = "button";
      bt.className = "schip" + (solved[i] ? " done" : "");
      bt.textContent = String(i+1) + (solved[i] ? " \u2605" : "");
      bt.setAttribute("aria-pressed", i === useI ? "true" : "false");
      bt.addEventListener("click", function(){ useI = i; picked = null; render(); });
      chips.appendChild(bt);
    });
    lastSpoken = us.sit.en;
  }

  var lastSpoken = "";

  ["Idiom","Prov","Use"].forEach(function(x){
    $("tab"+x).addEventListener("click", function(){
      var m = x.toLowerCase();
      if (tab === m) return;
      tab = m; side = "lit"; picked = null; render();
    });
  });

  /* ---------- quiz ---------- */
  function buildQuiz(){
    var box = $("quizBox"); box.innerHTML = "";
    QUIZ.forEach(function(item){
      var wrap = document.createElement("div"); wrap.className = "q";
      var q = document.createElement("p"); setText(q, t(item.q)); wrap.appendChild(q);
      var fb = document.createElement("p"); fb.className = "fb";
      item.o.forEach(function(opt, oi){
        var bt = document.createElement("button");
        bt.type = "button";
        bt.className = "opt" + (lang === "ur" ? " ur" : "");
        bt.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        bt.textContent = t(opt);
        bt.addEventListener("click", function(){
          if (wrap.getAttribute("data-done") === "1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show","fb");
        });
        wrap.appendChild(bt);
      });
      wrap.appendChild(fb); box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");
    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });
    buildQuiz(); render();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en"; applyLang();
  });

  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(lastSpoken);
      u.lang = "en-US"; u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }catch(e){ /* no voice available — stay quiet */ }
  });

  applyLang();
})();
</script>
</body>
</html>
