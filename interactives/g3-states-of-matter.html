<style>
/* AI4KIDS_FS_SCALE */

:root{
  --fs-cap: clamp(0.85rem, 2.2vw, 1.05rem);
  --fs-xs: clamp(1rem, 2.6vw, 1.2rem);
  --fs-sm: clamp(1.15rem, 3vw, 1.4rem);
  --fs-md: clamp(1.3rem, 3.4vw, 1.65rem);
  --fs-lg: clamp(1.55rem, 4vw, 2rem);
  --fs-xl: clamp(1.9rem, 5vw, 2.5rem);
}

/* /AI4KIDS_FS_SCALE */

  :root{
    --room:#eef3f7;
    --room-deep:#d9e5ee;
    --glass:#b8cede;
    --ice:#9ec9e8;
    --liquid:#2b7fbf;
    --gas:#b6c6d2;
    --cold:#4a8fd0;
    --hot:#c9502e;
    --ink:#1f2933;
    --ink-soft:#4a5661;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#1a5b8f;
    --good:#2e7d4f;

    --fs-cap:clamp(14px, 3.8vw, 16px);--fs-xs:clamp(16px, 4.2vw, 18px);--fs-sm:clamp(18px, 4.8vw, 20px);--fs-md:clamp(19px, 5.2vw, 22px);--fs-lg:clamp(22px, 6vw, 26px);--fs-xl:clamp(30px, 8vw, 38px);
    --lh:1.5;
  }
  /* Urdu is set larger than Latin — Nastaliq reads smaller at the same size. */
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);--fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);--fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 16px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--room) 0%,var(--room-deep) 100%);
  }
  .scene svg{display:block;width:100%;height:auto}
  .dot{transition:fill .6s ease,r .6s ease}
  .tick{fill:var(--ink-soft);font-size:var(--fs-cap);font-weight:700;
        font-family:"Baloo Bhaijaan 2",sans-serif}
  #surface{transition:opacity .5s ease}
  #tFill{transition:y .3s ease,height .3s ease,fill .5s ease}

  .readout{
    margin-top:-18px;position:relative;z-index:2;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px;
             background:var(--accent);transition:background .4s ease}
  .statechip.ur{padding:2px 14px 7px}
  .sname{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .sname.ur{line-height:1.95}
  .sdesc{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .facts{display:flex;gap:10px;margin-top:16px}
  .fact{flex:1;border:2px solid var(--line);border-radius:14px;padding:11px 10px;text-align:center}
  .fact em{display:block;font-style:normal;font-size:var(--fs-cap);color:var(--ink-soft);
           font-weight:600;margin-bottom:4px}
  .fact b{display:block;font-size:var(--fs-sm);font-weight:800;line-height:1.3}
  .fact.count{border-color:var(--good);background:#eaf4ee}
  .fact.count b{color:var(--good);font-size:var(--fs-lg)}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}
  body.urdu .why-note{
    border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;
    line-height:var(--lh);
  }

  .heat{margin-top:22px}
  .heat h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 12px;color:var(--ink-soft)}
  .step{display:flex;align-items:center;justify-content:center;gap:14px}
  .step button{
    width:56px;height:56px;border-radius:16px;border:2px solid var(--ink);background:var(--paper);
    font:inherit;font-size:var(--fs-lg);font-weight:800;cursor:pointer;color:var(--ink);
    font-family:"Baloo Bhaijaan 2",sans-serif;
  }
  .step button:active:not(:disabled){transform:scale(.94)}
  .step button:disabled{opacity:.35;cursor:default}
  .step .val{min-width:130px;text-align:center;font-size:var(--fs-xl);font-weight:800}

  .jump{margin-top:22px}
  .jump h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 12px;color:var(--ink-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .jchip{
    border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;
    font:inherit;font-size:var(--fs-xs);font-weight:600;color:var(--ink);cursor:pointer;min-height:44px;
  }
  .jchip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--good);background:#e6f4ec;font-weight:600}
  .opt.wrong{border-color:var(--hot);background:#fbeae4}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;
      grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar"
        "head  head"
        "left  right"
        "quiz  quiz"
        "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar}
    .head{grid-area:head}
    .left{grid-area:left}
    .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px}
    footer{grid-area:foot}
    .heat{margin-top:0}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important}
  }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

    }
  })();

  var els = P.map(function(p){
    var e = mk("circle", {cx:p.x, cy:p.y, r:6, fill:"var(--liquid)", "class":"dot"});
    $("dots").appendChild(e);
    return e;
  });

  function stateOf(T_){ return T_ < 0 ? "solid" : (T_ < 100 ? "liquid" : "gas"); }

  var clock = 0;
  function tick(){
    clock += 0.08;
    var st = stateOf(temp);

    if (st === "solid"){
      // locked in a lattice; colder simply means a smaller wobble
      var amp = 0.8 + (temp + 20) / 20 * 1.8;
      P.forEach(function(p, i){
        p.x = p.hx + amp * Math.sin(clock * 3 + p.ph);
        p.y = p.hy + amp * Math.cos(clock * 2.6 + p.ph * 1.7);
      });
    } else {
      var gas   = (st === "gas");
      var speed = gas ? (2.6 + (temp - 100) * 0.05) : (0.5 + temp / 100 * 1.6);
      var top   = gas ? BOX.yTop : BOX.yLiq;
      P.forEach(function(p){
        var sp = Math.sqrt(p.vx*p.vx + p.vy*p.vy) || 1;
        p.vx = p.vx / sp * speed;
        p.vy = p.vy / sp * speed;
        p.x += p.vx; p.y += p.vy;
      });

      // In a liquid the particles touch but do not sit on top of each other. Without
      // this they bunch into a clump and leave gaps, which teaches the wrong picture.
      // A gas needs no such rule — its particles really are far apart and free.
      if (!gas){
        for (var a=0;a<P.length;a++){
          for (var b=a+1;b<P.length;b++){
            var dx = P[b].x - P[a].x, dy = P[b].y - P[a].y;
            var d  = Math.sqrt(dx*dx + dy*dy) || 0.01;
            if (d < 13){
              var push = (13 - d) / d * 0.4;
              P[a].x -= dx * push; P[a].y -= dy * push;
              P[b].x += dx * push; P[b].y += dy * push;
            }
          }
        }
      }

      P.forEach(function(p){
        if (p.x < BOX.x0){ p.x = BOX.x0; p.vx = Math.abs(p.vx); }
        if (p.x > BOX.x1){ p.x = BOX.x1; p.vx = -Math.abs(p.vx); }
        if (p.y < top){    p.y = top;    p.vy = Math.abs(p.vy); }
        if (p.y > BOX.yBot){ p.y = BOX.yBot; p.vy = -Math.abs(p.vy); }
      });
    }

    for (var i=0;i<P.length;i++){
      els[i].setAttribute("cx", P[i].x.toFixed(1));
      els[i].setAttribute("cy", P[i].y.toFixed(1));
    }
  }

  /* ---------- controls ---------- */
  function setTemp(v){
    temp = Math.max(-20, Math.min(120, v));
    render();
  }
  $("cool").addEventListener("click", function(){ setTemp(temp - 5); });
  $("warm").addEventListener("click", function(){ setTemp(temp + 5); });

  T.jumps.forEach(function(j, i){
    var b = document.createElement("button");
    b.type = "button"; b.className = "jchip";
    b.setAttribute("data-i", i); b.setAttribute("aria-pressed","false");
    b.addEventListener("click", function(){ setTemp(j.t); });
    $("chips").appendChild(b);
  });

  /* ---------- render ---------- */
  function render(){
    var st = stateOf(temp);
    var m  = T[st];

    $("tempVal").textContent = String(temp);
    $("cool").disabled = (temp <= -20);
    $("warm").disabled = (temp >= 120);

    // thermometer: -20°C sits at y 255, 120°C at y 55
    var y = 255 - (temp + 20) / 140 * 200;
    $("tFill").setAttribute("y", String(y));
    $("tFill").setAttribute("height", String(255 - y));
    var col = (st === "solid") ? "var(--cold)" : (st === "gas" ? "var(--hot)" : "var(--liquid)");
    $("tFill").setAttribute("fill", col);
    $("tBulb").setAttribute("fill", col);
    $("statechip").style.background = (st === "solid") ? "var(--cold)"
                                    : (st === "gas") ? "var(--hot)" : "var(--accent)";

    // particle look
    var dotFill = (st === "solid") ? "var(--ice)" : (st === "gas" ? "var(--gas)" : "var(--liquid)");
    var dotR    = (st === "gas") ? 5 : 6;
    els.forEach(function(e){ e.setAttribute("fill", dotFill); e.setAttribute("r", dotR); });
    $("surface").setAttribute("opacity", st === "liquid" ? "1" : "0");

    // chips
    Array.prototype.forEach.call($("chips").children, function(b, i){
      b.textContent = T.jumps[i][lang];
      b.setAttribute("aria-pressed", stateOf(T.jumps[i].t) === st ? "true" : "false");
    });

    setText($("statechip"), t(m.chip));
    setText($("sname"), t(m.name));
    setText($("sdesc"), t(m.desc));
    setText($("lblShape"), t(T.shapeLbl));
    setText($("valShape"), t(m.shape));
    setText($("lblCount"), t(T.countLbl));
    $("valCount").textContent = String(N);
    $("whyLbl").textContent = t(T.whyLbl);
    setText($("whyText"), t(m.why));

    lastSpoken = t(m.name) + ". " + t(m.desc);
  }

  var lastSpoken = "";

  /* ---------- quiz ---------- */
  function buildQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    QUIZ.forEach(function(item){
      var wrap = document.createElement("div");
      wrap.className = "q";
      var q = document.createElement("p");
      setText(q, t(item.q));
      wrap.appendChild(q);
      var fb = document.createElement("p");
      fb.className = "fb";
      item.o.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang === "ur" ? " ur" : "");
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.textContent = t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done") === "1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show","fb");
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb);
      box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");

    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });

    setText($("heatHead"), t(T.heatHead));
    setText($("jumpHead"), t(T.jumpHead));
    setText($("quizHead"), t(T.quiz));

    buildQuiz();
    render();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });

  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(lastSpoken);
      u.lang = (lang === "ur") ? "ur-PK" : "en-US";
      u.rate = 0.92;
      var voices = window.speechSynthesis.getVoices() || [];
      for (var i=0;i<voices.length;i++){
        if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(lang === "ur" ? "ur" : "en") === 0){
          u.voice = voices[i]; break;
        }
      }
      window.speechSynthesis.speak(u);
    }catch(e){ /* no voice available — stay quiet */ }
  });

  applyLang();
  setInterval(tick, 40);
})();
</script>
</body>
</html>
