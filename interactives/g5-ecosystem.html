<style>
/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

  :root{

    --paper:#fdfaf3;--line:#d5dec8;--accent:#2d6a4f;--gold:#e8b23d;--left:#c4453a;
    --prod:#4a7c2f;--cons:#b86b2a;--decomp:#6b4a8a;--fire:#d35400;
    --fs-cap:clamp(14px, 3.8vw, 16px);--fs-xs:clamp(16px, 4.2vw, 18px);--fs-sm:clamp(18px, 4.8vw, 20px);--fs-md:clamp(19px, 5.2vw, 22px);--fs-lg:clamp(22px, 6vw, 26px);--fs-xl:clamp(30px, 8vw, 38px);--lh:1.5;
  }
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);--fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);--fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);--lh:2.1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .stars{display:flex;align-items:center;gap:6px;font-weight:800;font-size:var(--fs-xs);
         background:#fff6e2;border:2px solid var(--gold);border-radius:999px;padding:7px 13px}
  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}
  .tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
  .tabs button{
    flex:1 1 28%;min-width:90px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:10px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:54px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .tabs button .badge{color:var(--gold)}

    background:#fff8ea;border:2px dashed var(--gold);border-radius:16px;padding:13px 15px;
    font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6;margin-bottom:14px;
  }
  body.urdu .story{line-height:var(--lh)}
  .story b{color:var(--ink)}
  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 42%,var(--board) 42%,var(--board-deep) 100%);
    min-height:280px;
  }
  .scene-pad{padding:10px 12px 18px;min-height:260px;position:relative}
  .sky-layer{position:absolute;inset:0 0 55% 0;pointer-events:none;overflow:hidden}
  .sun-ball{
    position:absolute;top:12px;right:18px;width:48px;height:48px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffe9a0,#f5c542 60%,#e0a020);
    box-shadow:0 0 24px rgba(245,197,66,.55);z-index:1;
  }
  body.urdu .sun-ball{right:auto;left:18px}
  .cloud{
    position:absolute;background:rgba(255,255,255,.85);border-radius:40px;opacity:.9;
  }
  .cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
  .c1{width:54px;height:18px;top:22px;left:16%}
  .c1:before{width:28px;height:28px;top:-16px;left:8px}
  .c1:after{width:22px;height:22px;top:-10px;left:28px}
  .c2{width:40px;height:14px;top:40px;left:55%;opacity:.7}
  .c2:before{width:20px;height:20px;top:-12px;left:6px}
  .c2:after{width:16px;height:16px;top:-8px;left:22px}
  .hills{
    position:absolute;left:0;right:0;bottom:38%;height:90px;z-index:1;pointer-events:none;
  }
  .hill{
    position:absolute;bottom:0;border-radius:50% 50% 0 0;
    background:linear-gradient(180deg,var(--hill1),var(--hill2));
  }
  .h-a{width:70%;height:78px;left:-8%;opacity:.95}
  .h-b{width:55%;height:64px;right:-5%;background:linear-gradient(180deg,#4a7a4a,#2d5530);opacity:.9}
  .h-c{width:40%;height:48px;left:30%;background:linear-gradient(180deg,#5a8a5a,#355a35);opacity:.85}
  .pine-row{position:absolute;left:0;right:0;bottom:42%;height:70px;z-index:2;pointer-events:none}
  .pine{
    position:absolute;bottom:0;width:0;height:0;
    border-left:14px solid transparent;border-right:14px solid transparent;
    border-bottom:36px solid var(--pine);
  }
  .pine:before{
    content:"";position:absolute;left:-11px;top:14px;width:0;height:0;
    border-left:11px solid transparent;border-right:11px solid transparent;
    border-bottom:28px solid #163d1f;
  }
  .pine:after{
    content:"";position:absolute;left:-3px;bottom:-8px;width:6px;height:10px;background:#5c3a1e;
  }
  .p1{left:8%}.p2{left:22%;transform:scale(.85)}.p3{left:68%;transform:scale(.9)}.p4{left:82%;transform:scale(.75)}
  .ground-strip{
    position:absolute;left:0;right:0;bottom:0;height:40%;
    background:linear-gradient(180deg,#8fbc6a 0%,#6a9a4a 40%,#5a7a3a 100%);
    z-index:1;pointer-events:none;
  }
  .grass-tuft{
    position:absolute;bottom:36%;width:3px;height:14px;background:#3d6b2a;border-radius:2px;z-index:2;
  }
  .org-stage{
    position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:8px;
    justify-content:center;align-items:flex-end;min-height:140px;padding-top:100px;
  }
  .org-card{
    background:rgba(253,250,243,.95);border:2.5px solid var(--ink);border-radius:16px;
    padding:8px 10px 10px;text-align:center;min-width:72px;max-width:100px;
    box-shadow:0 3px 0 rgba(30,42,26,.15);cursor:default;user-select:none;
  }
  .org-card.pickable{cursor:pointer}
  .org-card.pickable:hover{transform:translateY(-2px)}
  .org-card.picked{opacity:.35;pointer-events:none}
  .org-card.ok{border-color:var(--ok);background:#e8f2ed}
  .org-card.no{border-color:var(--left);background:#fbeae8}
  .org-card.role-prod{border-color:var(--prod)}
  .org-card.role-cons{border-color:var(--cons)}
  .org-card.role-decomp{border-color:var(--decomp)}
  .org-em{font-size:36px;line-height:1.1;display:block;margin-bottom:2px}
  .org-lab{font-size:var(--fs-cap);font-weight:800;line-height:1.25;margin:0}
  .chain-row{
    position:relative;z-index:5;display:flex;align-items:center;justify-content:center;
    flex-wrap:wrap;gap:6px;padding-top:95px;min-height:130px;
  }
  .chain-slot{
    min-width:78px;min-height:88px;border:2.5px dashed rgba(30,42,26,.45);
    border-radius:14px;background:rgba(253,250,243,.7);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:6px;font-weight:800;font-size:var(--fs-cap);
    color:var(--ink-soft);
  }
  .chain-slot.filled{border-style:solid;border-color:var(--ink);background:var(--paper);color:var(--ink)}
  .chain-slot .em{font-size:32px;line-height:1}
  .chain-arrow{font-size:22px;font-weight:800;color:var(--b);padding:0 2px}
  .web-grid{
    position:relative;z-index:5;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
    padding-top:90px;
  }
  .web-bin{
    border:2.5px solid var(--ink);border-radius:14px;padding:8px 6px;min-height:110px;
    background:rgba(253,250,243,.88);text-align:center;
  }
  .web-bin.prod{border-color:var(--prod);background:rgba(232,242,220,.9)}
  .web-bin.cons{border-color:var(--cons);background:rgba(250,235,220,.9)}
  .web-bin.decomp{border-color:var(--decomp);background:rgba(235,228,245,.9)}
  .web-bin h3{margin:0 0 6px;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
  .web-bin .drop{min-height:60px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
  .mini-org{
    border:2px solid var(--ink);border-radius:12px;padding:4px 6px;background:#fff;
    font-size:22px;line-height:1;cursor:pointer;min-width:40px;
  }
  .mini-org.used{opacity:.3;pointer-events:none}
  .bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;position:relative;z-index:5}
  .link-list{margin-top:6px}
  .link-row{
    display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;justify-content:center;
  }
  .link-row .pair{
    background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;
    font-weight:800;font-size:var(--fs-cap);display:flex;align-items:center;gap:6px;
  }
  .link-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .link-btns button{
    border:2px solid var(--ink);background:var(--paper);border-radius:12px;
    padding:8px 12px;font:inherit;font-weight:800;font-size:var(--fs-cap);cursor:pointer;min-height:44px;
  }
  .link-btns button.right{border-color:var(--ok);background:#e8f2ed}
  .link-btns button.wrong{border-color:var(--left);background:#fbeae8}
  .save-scene{
    position:relative;z-index:5;padding-top:88px;text-align:center;
  }
  .save-hero{font-size:64px;line-height:1;margin:4px 0 8px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
  .save-choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .save-choices button{
    border:2.5px solid var(--ink);background:var(--paper);border-radius:14px;
    padding:12px 14px;font:inherit;font-weight:800;font-size:var(--fs-xs);
    cursor:pointer;text-align:left;min-height:52px;display:flex;align-items:center;gap:10px;
  }
  body.urdu .save-choices button{text-align:right}
  .save-choices button .cem{font-size:26px}
  .save-choices button.right{border-color:var(--ok);background:#e8f2ed}
  .save-choices button.wrong{border-color:var(--left);background:#fbeae8}
  .outcome{
    margin-top:10px;border-radius:14px;padding:10px 12px;font-weight:700;font-size:var(--fs-xs);
    display:none;border:2px solid var(--ok);background:#e8f2ed;color:var(--ok);
  }
  .outcome.show{display:block}
  .outcome.bad{border-color:var(--left);background:#fbeae8;color:var(--left)}
  .readout{
    margin-top:-18px;position:relative;z-index:2;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.win{background:var(--ok)}
  .statechip.miss{background:var(--left)}
  .headline{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .headline.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
  .hintbox{
    margin-top:14px;border:2px solid var(--a);background:#eaf1f9;border-radius:14px;
    padding:11px 14px;font-size:var(--fs-xs);color:var(--a);font-weight:700;line-height:1.55;
    display:none;
  }
  .hintbox.show{display:block}
  body.urdu .hintbox{line-height:var(--lh)}
  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .prog{margin:0 0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft)}
  .btns{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}
  .btns button{
    border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);
    font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;min-height:50px;
    padding:8px 14px;flex:1;
  }
  .btns .go{background:var(--ink);color:var(--paper)}
  .btns button:active{transform:scale(.97)}
  .btns button:disabled{opacity:.4;cursor:default}
  .choice{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;font-weight:700;
  }
  .choice.ur{text-align:right;line-height:var(--lh)}
  .choice:hover{border-color:var(--ink)}
  .choice.right{border-color:var(--ok);background:#e8f2ed}
  .choice.wrong{border-color:var(--left);background:#fbeae8}
  .dots{display:flex;gap:6px;justify-content:center;margin:10px 0 0}
  .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--ink)}
  .dots i.ok{background:var(--ok)}
  .legend{
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;font-size:var(--fs-cap);font-weight:800;
  }
  .legend span{padding:4px 10px;border-radius:999px;border:2px solid}
  .legend .lp{border-color:var(--prod);color:var(--prod);background:#eef5e6}
  .legend .lc{border-color:var(--cons);color:var(--cons);background:#faf0e6}
  .legend .ld{border-color:var(--decomp);color:var(--decomp);background:#f3eef8}
  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .qhead h2{font-size:var(--fs-lg);font-weight:800;margin:0;flex:1}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--left);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}
  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}
  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar" "head  head" "tabs  tabs" "story story"
        "left  right" "quiz  quiz" "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .story{grid-area:story} .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation:none !important}
  }

<script>
(function(){
  "use strict";

  function $(id){ return document.getElementById(id); }
  function isolate(s){ return "\u2066" + s + "\u2069"; }
  function setText(el, str){
    if (!el) return;
    el.textContent = (lang === "ur") ? isolate(str) : str;
    el.classList.toggle("ur", lang === "ur");
    el.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
  }
  function t(o){ return (o && o[lang]) || (o && o.en) || ""; }
  function shuffle(arr){
    var a = arr.slice(), i, j, tmp;

      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var lang="ru";

  /* ---------- CHAIN ---------- */
  function renderChain(){
    var ch = CHAINS[chainIdx];
    var pad = $("scenePad");
    var slots = "";
    var i;
    for (i=0;i<ch.order.length;i++){
      if (i) slots += '<span class="chain-arrow">→</span>';
      if (chainPicked[i]){
        var id = chainPicked[i];
        slots += '<div class="chain-slot filled"><span class="em">'+ORGS[id].em+'</span><span>'+orgLabel(id)+'</span></div>';
      } else {
        slots += '<div class="chain-slot">'+(i+1)+'</div>';
      }
    }
    pad.innerHTML = hillsBg() + '<div class="chain-row">'+slots+'</div>';

    var pool = shuffle(ch.order.concat(ch.extras));
    var box = $("actionBox");
    box.innerHTML = "";
    var row = document.createElement("div");
    row.className = "bank";
    pool.forEach(function(id){
      var used = chainPicked.indexOf(id) >= 0;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "org-card pickable" + (used ? " picked" : "");
      b.innerHTML = '<span class="org-em">'+ORGS[id].em+'</span><p class="org-lab"></p>';
      setText(b.querySelector(".org-lab"), orgLabel(id));
      if (!used){
        b.addEventListener("click", function(){ onChainPick(id); });
      }
      row.appendChild(b);
    });
    box.appendChild(row);

    var done = chainPicked.length === ch.order.length &&
      chainPicked.every(function(id, ix){ return id === ch.order[ix]; });
    setText($("statechip"), done ? t(T.nice) : t(ch.title));
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (done?" win":"");
    setText($("headline"), t(T.askChain));
    setText($("detail"), t(T.pick));
    $("hintbox").classList.remove("show");
    setText($("prog"), t(T.progC) + ": " + Object.keys(chainDone).length + "/" + CHAINS.length);
    dots($("prog"), CHAINS.length, chainIdx, chainDone);
  }

  function onChainPick(id){
    var ch = CHAINS[chainIdx];
    var next = chainPicked.length;
    if (next >= ch.order.length) return;
    if (id === ch.order[next]){
      chainPicked.push(id);
      if (chainPicked.length === ch.order.length){
        chainDone[ch.id] = true;
        award("chain-"+ch.id, 1);
        if (Object.keys(chainDone).length === CHAINS.length){
          doneModes.chain = true;
          award("mode-chain", 2);
        }
        setText($("statechip"), t(T.nice));
        $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
      }
      renderChain();
    } else {
      setText($("statechip"), t(T.oops));
      $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
      setText($("detail"), t(ch.hint));
    }
  }

          '<div class="web-bin cons" data-bin="cons"><h3></h3><div class="drop" id="binCons"></div></div>' +
          '<div class="web-bin decomp" data-bin="decomp"><h3></h3><div class="drop" id="binDecomp"></div></div>' +
        '</div>';
      setText(pad.querySelector(".prod h3"), t(T.prod));
      setText(pad.querySelector(".cons h3"), t(T.cons));
      setText(pad.querySelector(".decomp h3"), t(T.decomp));

      ["prod","cons","decomp"].forEach(function(bin){
        pad.querySelector('[data-bin="'+bin+'"]').addEventListener("click", function(){
          if (!webSelected) return;
          webSort[webSelected] = bin;
          webSelected = null;
          renderWeb();
        });
      });

      // fill bins
      w.items.forEach(function(id){
        var bin = webSort[id];
        if (!bin) return;
        var el = document.createElement("span");
        el.className = "mini-org";
        el.textContent = ORGS[id].em;
        el.title = orgLabel(id);
        el.addEventListener("click", function(e){
          e.stopPropagation();
          delete webSort[id];
          renderWeb();
        });
        var target = bin==="prod"?$("binProd"):bin==="cons"?$("binCons"):$("binDecomp");
        target.appendChild(el);
      });

      var bank = document.createElement("div");
      bank.className = "bank";
      w.items.forEach(function(id){
        if (webSort[id]) return;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "org-card pickable" + (webSelected===id?" ok":"");
        b.innerHTML = '<span class="org-em">'+ORGS[id].em+'</span><p class="org-lab"></p>';
        setText(b.querySelector(".org-lab"), orgLabel(id));
        b.addEventListener("click", function(){ webSelected = id; renderWeb(); });
        bank.appendChild(b);
      });
      box.appendChild(bank);

      var check = document.createElement("button");
      check.type = "button";
      check.className = "chip";
      check.style.marginTop = "8px";
      check.style.width = "100%";
      setText(check, t(T.checkSort));
      check.addEventListener("click", checkSort);
      box.appendChild(check);

      setText($("headline"), t(T.askSort));
      setText($("detail"), webSelected ? orgLabel(webSelected) + " → ?" : t(T.pick));
    } else {
      pad.innerHTML = hillsBg() +
        '<div class="save-scene"><div class="save-hero">🕸️</div>' +
        '<div class="legend"><span class="lp"></span><span class="lc"></span><span class="ld"></span></div></div>';
      setText(pad.querySelector(".lp"), t(T.prod));
      setText(pad.querySelector(".lc"), t(T.cons));
      setText(pad.querySelector(".ld"), t(T.decomp));

      var prompt = document.createElement("p");
      prompt.style.fontWeight = "800";
      prompt.style.marginBottom = "8px";
      setText(prompt, t(w.prompt));
      box.appendChild(prompt);

      var btns = document.createElement("div");
      btns.className = "link-btns";
      var opts = shuffle(w.opts.slice());
      opts.forEach(function(opt){
        var b = document.createElement("button");
        b.type = "button";
        b.innerHTML = '<span style="font-size:20px;margin-right:6px">'+opt.em+'</span>';
        var lab = document.createElement("span");
        setText(lab, t(opt));
        b.appendChild(lab);
        b.addEventListener("click", function(){
          if (webDone[w.id]) return;
          if (opt.ok){
            b.classList.add("right");
            webDone[w.id] = true;
            award("web-"+w.id, 1);
            maybeWebModeDone();
            setText($("statechip"), t(T.nice));
            $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
          } else {
            b.classList.add("wrong");
            setText($("statechip"), t(T.oops));
            $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
          }
        });
        btns.appendChild(b);
      });
      box.appendChild(btns);
      setText($("headline"), t(T.askLink));
      setText($("detail"), t(w.title));
    }

    var doneFlag = !!webDone[w.id];
    setText($("statechip"), doneFlag ? t(T.nice) : t(w.title));
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (doneFlag?" win":"");
    setText($("prog"), t(T.progW) + ": " + Object.keys(webDone).length + "/" + WEB.length);
  }

  function checkSort(){
    var w = WEB[webIdx];
    if (w.type !== "sort") return;
    var ok = true;
    w.items.forEach(function(id){
      var need = ORGS[id].role;
      if (webSort[id] !== need) ok = false;
    });
    if (ok && w.items.every(function(id){ return webSort[id]; })){
      webDone[w.id] = true;
      award("web-"+w.id, 1);
      maybeWebModeDone();
      setText($("statechip"), t(T.nice));
      $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
      setText($("detail"), t(T.sunLabel));
    } else {
      setText($("statechip"), t(T.oops));
      $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
      setText($("detail"), t(w.hint));
    }
  }

  function maybeWebModeDone(){
    if (Object.keys(webDone).length === WEB.length){
      doneModes.web = true;
      award("mode-web", 2);
    }
  }

  /* ---------- SAVE ---------- */
  function renderSave(){
    var s = SAVE[saveIdx];
    var pad = $("scenePad");
    pad.innerHTML = hillsBg() +
      '<div class="save-scene"><div class="save-hero">'+s.hero+'</div></div>';

    var box = $("actionBox");
    box.innerHTML = "";
    var sceneP = document.createElement("p");
    sceneP.style.fontWeight = "700";
    sceneP.style.marginBottom = "8px";
    setText(sceneP, t(s.scene));
    box.appendChild(sceneP);

    var choices = document.createElement("div");
    choices.className = "save-choices";
    var outcome = document.createElement("div");
    outcome.className = "outcome";
    outcome.id = "saveOut";

    s.opts.forEach(function(opt){
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="cem">'+opt.em+'</span>';
      var lab = document.createElement("span");
      setText(lab, t(opt));
      b.appendChild(lab);
      if (saveDone[s.id]){
        if (opt.ok) b.classList.add("right");
        b.disabled = true;
      }
      b.addEventListener("click", function(){
        if (saveDone[s.id]) return;
        if (opt.ok){
          b.classList.add("right");
          saveDone[s.id] = true;
          award("save-"+s.id, 1);
          if (Object.keys(saveDone).length === SAVE.length){
            doneModes.save = true;
            award("mode-save", 2);
          }
          outcome.className = "outcome show";
          setText(outcome, t(opt.out));
          setText($("statechip"), t(T.nice));
          $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
          Array.prototype.forEach.call(choices.querySelectorAll("button"), function(x){ x.disabled = true; });
        } else {
          b.classList.add("wrong");
          outcome.className = "outcome show bad";
          setText(outcome, t(opt.out));
          setText($("statechip"), t(T.oops));
          $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
        }
      });
      choices.appendChild(b);
    });
    box.appendChild(choices);
    box.appendChild(outcome);
    if (saveDone[s.id]){
      var good = s.opts.filter(function(o){ return o.ok; })[0];
      outcome.className = "outcome show";
      setText(outcome, t(good.out));
    }

    setText($("statechip"), saveDone[s.id] ? t(T.nice) : t(s.title));
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (saveDone[s.id]?" win":"");
    setText($("headline"), t(T.askSave));
    setText($("detail"), t(s.title));
    $("hintbox").classList.remove("show");
    setText($("prog"), t(T.progS) + ": " + Object.keys(saveDone).length + "/" + SAVE.length);
  }

  function dots(el, total, idx, doneMap){
    /* prog text already set; optional visual via actionBox not needed */
  }

  /* ---------- QUIZ ---------- */
  function pickQuiz(){ quizSet = shuffle(QUIZ).slice(0, 5); }
  function renderQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizSet.forEach(function(item, qi){
      var div = document.createElement("div");
      div.className = "q";
      var p = document.createElement("p");
      setText(p, (qi+1) + ". " + t(item.q));
      div.appendChild(p);
      var fb = document.createElement("p");
      fb.className = "fb";
      item.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang==="ur"?" ur":"");
        b.setAttribute("dir", lang==="ur"?"rtl":"ltr");
        b.textContent = (lang==="ur") ? isolate(t(opt)) : t(opt);
        b.addEventListener("click", function(){
          if (div.getAttribute("data-locked")) return;
          div.setAttribute("data-locked","1");
          if (oi === item.correct){
            b.classList.add("right");
            award("quiz-"+qi, 1);
            setText(fb, t(item.why));
          } else {
            b.classList.add("wrong");
            var correctBtn = div.querySelectorAll(".opt")[item.correct];
            if (correctBtn) correctBtn.classList.add("right");
            setText(fb, t(item.why));
          }
          fb.classList.add("show");
        });
        div.appendChild(b);
      });
      div.appendChild(fb);
      box.appendChild(div);
    });
  }

  /* ---------- shell ---------- */
  function storyHtml(){
    if (mode === "chain") return t(T.storyChain);
    if (mode === "web") return t(T.storyWeb);
    return t(T.storySave);
  }

  function tabBadges(){
    function lab(btn, labelObj, key){
      var badge = doneModes[key] ? ' <span class="badge">★</span>' : "";
      btn.innerHTML = "";
      var span = document.createElement("span");
      if (lang === "ur"){ span.classList.add("ur"); span.setAttribute("dir","rtl"); }
      span.textContent = (lang==="ur") ? isolate(t(labelObj)) : t(labelObj);
      btn.appendChild(span);
      if (badge){
        var b = document.createElement("span");
        b.innerHTML = badge;
        btn.appendChild(b);
      }
    }
    lab($("tabChain"), T.tabChain, "chain");
    lab($("tabWeb"), T.tabWeb, "web");
    lab($("tabSave"), T.tabSave, "save");
    $("tabChain").setAttribute("aria-pressed", mode==="chain"?"true":"false");
    $("tabWeb").setAttribute("aria-pressed", mode==="web"?"true":"false");
    $("tabSave").setAttribute("aria-pressed", mode==="save"?"true":"false");
  }

  function setMode(m){
    mode = m;
    $("hintbox").classList.remove("show");
    if (mode === "chain"){ chainPicked = []; renderChain(); }
    else if (mode === "web"){ webSelected = null; if (WEB[webIdx].type==="sort"){ /* keep sort progress */ } renderWeb(); }
    else renderSave();
    applyChrome();
  }

  function applyChrome(){
    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    $("story").innerHTML = storyHtml();
    $("story").classList.toggle("ur", lang==="ur");
    $("story").setAttribute("dir", lang==="ur"?"rtl":"ltr");
    setText($("ctlHead"), t(T.ctl));
    setText($("nextBtn"), t(T.next));
    setText($("hintBtn"), t(T.hint));
    setText($("resetBtn"), t(T.reset));
    setText($("quizHead"), t(T.quiz));
    setText($("newQuiz"), t(T.newQuiz));
    $("langBtn").textContent = (lang === "en") ? "اردو" : "EN";
    $("langBtn").setAttribute("aria-pressed", lang==="ur"?"true":"false");
    document.body.classList.toggle("urdu", lang==="ur");
    document.documentElement.lang = (lang==="ur") ? "ur" : "en";
    tabBadges();
    document.querySelectorAll("footer [data-en]").forEach(function(el){
      setText(el, lang==="ur" ? el.getAttribute("data-ur") : el.getAttribute("data-en"));
    });
  }

  function applyLang(){
    applyChrome();
    if (mode === "chain") renderChain();
    else if (mode === "web") renderWeb();
    else renderSave();
    renderQuiz();
  }

  function next(){
    if (mode === "chain"){
      chainIdx = (chainIdx + 1) % CHAINS.length;
      chainPicked = [];
      renderChain();
    } else if (mode === "web"){
      webIdx = (webIdx + 1) % WEB.length;
      webSelected = null;
      if (WEB[webIdx].type === "sort") webSort = {};
      renderWeb();
    } else {
      saveIdx = (saveIdx + 1) % SAVE.length;
      renderSave();
    }
    applyChrome();
  }

  function showHint(){
    var h;
    if (mode === "chain") h = CHAINS[chainIdx].hint;
    else if (mode === "web") h = WEB[webIdx].hint;
    else h = SAVE[saveIdx].hint;
    setText($("hintbox"), t(h));
    $("hintbox").classList.add("show");
  }

  function resetMode(){
    if (mode === "chain"){
      chainPicked = [];
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("chain-")===0 || k==="mode-chain") delete awarded[k]; });
      chainDone = {}; doneModes.chain = false;
      recountStars();
      renderChain();
    } else if (mode === "web"){
      webSort = {}; webSelected = null;
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("web-")===0 || k==="mode-web") delete awarded[k]; });
      webDone = {}; doneModes.web = false;
      recountStars();
      renderWeb();
    } else {
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("save-")===0 || k==="mode-save") delete awarded[k]; });
      saveDone = {}; doneModes.save = false;
      recountStars();
      renderSave();
    }
    tabBadges();
  }

  /* speak cancel → 80ms */
  function cleanSpeakText(s){
    return String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  function buildSpeakText(){
    var bits = [];
    bits.push(t(T.title));
    bits.push(cleanSpeakText(storyHtml()));
    bits.push(cleanSpeakText(($("headline") && $("headline").textContent) || ""));
    bits.push(cleanSpeakText(($("detail") && $("detail").textContent) || ""));
    bits.push(t(T.tip));
    return bits.filter(Boolean).join(". ");
  }
  function pickVoice(voices, want){
    var i, v, L;
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf(want) === 0) return v;
    }
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf("en") === 0) return v;
    }
    return voices[0] || null;
  }
  var speakTimer = null;
  function setSpeaking(on){
    var btn = $("speakBtn");
    if (!btn) return;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.style.opacity = on ? "0.65" : "";
  }
  function doSpeak(text, asLang){
    var u = new SpeechSynthesisUtterance(text);
    u.rate=0.82;
    var __v=window.ai4kidsPickVoice&&ai4kidsPickVoice();if(__v){u.voice=__v;u.lang=((__v.lang||'').toLowerCase().indexOf('ur')===0)?'ur-PK':'hi-IN';}else{u.lang='hi-IN';}u.rate=.82;
    var voices = window.speechSynthesis.getVoices() || [];
    var voice = pickVoice(voices, asLang === "ur" ? "ur" : "en");
    if (voice) u.voice = voice;
    u.onstart = function(){ setSpeaking(true); };
    u.onend = function(){ setSpeaking(false); };
    u.onerror = function(){
      setSpeaking(false);
      if (asLang === "ur"){
        var fallback = cleanSpeakText(T.title.en + ". " + T.storyChain.en + ". " + T.tip.en);
        var u2 = new SpeechSynthesisUtterance(fallback);
        u2.lang = 'hi-IN'; u2.rate = 0.92;
        var v2 = pickVoice(window.speechSynthesis.getVoices() || [], "en");
        if (v2) u2.voice = v2;
        u2.onstart = function(){ setSpeaking(true); };
        u2.onend = u2.onerror = function(){ setSpeaking(false); };
        window.speechSynthesis.speak(u2);
      }
    };
    window.speechSynthesis.speak(u);
  }
  if ("speechSynthesis" in window){
    try { window.speechSynthesis.getVoices(); } catch (e0) {}
    if (typeof window.speechSynthesis.addEventListener === "function"){
      window.speechSynthesis.addEventListener("voiceschanged", function(){
        try { window.speechSynthesis.getVoices(); } catch (e1) {}
      });
    }
  } else {
    var noBtn = $("speakBtn");
    if (noBtn){ noBtn.disabled = true; noBtn.title = "Voice not available on this device"; }
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });
  $("tabChain").addEventListener("click", function(){ setMode("chain"); });
  $("tabWeb").addEventListener("click", function(){ setMode("web"); });
  $("tabSave").addEventListener("click", function(){ setMode("save"); });
  $("nextBtn").addEventListener("click", next);
  $("hintBtn").addEventListener("click", showHint);
  $("resetBtn").addEventListener("click", resetMode);
  $("newQuiz").addEventListener("click", function(){ pickQuiz(); renderQuiz(); });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      var text = buildSpeakText();
      if (!text) return;
      if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
      window.speechSynthesis.cancel();
      setSpeaking(false);
      var speakLang = lang;
      speakTimer = setTimeout(function(){
        speakTimer = null;
        doSpeak(text, speakLang);
      }, 80);
    }catch(e){ setSpeaking(false); }
  });

  pickQuiz();
  applyLang();
})();
</script>
<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
</body>
