<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digestive System — نظامِ ہضم | AI4Kids Class 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */

:root{
  --fs-cap: clamp(0.85rem, 2.2vw, 1.05rem);
  --fs-xs: clamp(1rem, 2.6vw, 1.2rem);
  --fs-sm: clamp(1.15rem, 3vw, 1.4rem);
  --fs-md: clamp(1.3rem, 3.4vw, 1.65rem);
  --fs-lg: clamp(1.55rem, 4vw, 2rem);
  --fs-xl: clamp(1.9rem, 5vw, 2.5rem);
}

/* /AI4KIDS_FS_SCALE */

  :root{
    --bg:#f3e7d8;
    --bg-deep:#e6d5c1;
    --body-fill:#f9efe2;
    --body-line:#c9b49b;
    --organ:#d8bfa6;
    --organ-on:#c96f4a;
    --organ-deep:#a4512f;
    --food:#e8a33d;
    --ink:#2a2118;
    --ink-soft:#5b4a3a;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#7a5230;
    --good:#4e7d4a;

    --fs-cap:clamp(14px, 3.8vw, 16px);--fs-xs:clamp(16px, 4.2vw, 18px);--fs-sm:clamp(18px, 4.8vw, 20px);--fs-md:clamp(19px, 5.2vw, 22px);--fs-lg:clamp(22px, 6vw, 26px);--fs-xl:clamp(30px, 8vw, 38px);
    --lh:1.5;
  }
  /* Urdu is set larger than Latin — Nastaliq reads smaller at the same size. */
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);--fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);--fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--food);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 16px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg-deep) 100%);
  }
  .scene svg{display:block;width:100%;height:auto}
  .organ{fill:none;stroke:var(--organ);stroke-linecap:round;stroke-linejoin:round;
         transition:stroke .4s ease,stroke-width .4s ease}
  .organ.solid{fill:var(--organ);stroke:none;transition:fill .4s ease}
  .organ.on{stroke:var(--organ-on)}
  .organ.solid.on{fill:var(--organ-on);stroke:none}
  #food{transition:transform .7s cubic-bezier(.4,.1,.3,1)}
  #foodBlob{transition:r .7s ease,fill .7s ease}
  /* Each action animation shows the verb, not just the position. A child who
     sees the pipe squeezing remembers "pushed", not "it moved down". */
  .act{display:none}
  .act.show{display:block}

  .tooth{fill:#fff;stroke:var(--body-line);stroke-width:1.5}
  .tooth.up{animation:chewUp 1.1s ease-in-out infinite}
  .tooth.down{animation:chewDown 1.1s ease-in-out infinite}
  @keyframes chewUp{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
  @keyframes chewDown{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  /* Rings of muscle squeeze shut one after another, top to bottom. The delays are
     tuned so each ring closes just AFTER the bite has passed it — the squeeze is
     behind the food, pushing it, which is the whole point of peristalsis. */
  .mring{stroke:var(--organ);stroke-width:3;stroke-linecap:round;
         transform-box:fill-box;transform-origin:center}
  #act1.show .mring{animation:pinch 2.4s ease-in-out infinite}
  .m0{animation-delay:0s}    .m1{animation-delay:.2s}   .m2{animation-delay:.65s}
  .m3{animation-delay:1.1s}  .m4{animation-delay:1.54s} .m5{animation-delay:1.84s}
  @keyframes pinch{
    0%,45%,100%{transform:scaleX(1);stroke:var(--organ);stroke-width:3}
    18%{transform:scaleX(.34);stroke:var(--organ-on);stroke-width:7}
  }
  /* the bite runs down the pipe on a loop while this stop is showing */
  #food.travel{animation:downPipe 2.4s ease-in-out infinite}
  @keyframes downPipe{
    0%{transform:translate(130px,90px)}
    100%{transform:translate(130px,144px)}
  }

  .swirl{fill:none;stroke:var(--organ-deep);stroke-width:3;stroke-linecap:round;opacity:.85;
         transform-origin:116px 180px;animation:churn 2.4s linear infinite}
  .swirl.tip{stroke-width:3}
  @keyframes churn{to{transform:rotate(360deg)}}

  .absorb{fill:#b23a48;opacity:0}
  .a1{animation:absorbR 2.2s ease-out infinite}
  .a2{animation:absorbR 2.2s ease-out infinite .8s}
  .a3{animation:absorbL 2.2s ease-out infinite .4s}
  .a4{animation:absorbL 2.2s ease-out infinite 1.2s}
  @keyframes absorbR{0%{opacity:0;transform:translate(0,0)}
                     25%{opacity:.95}
                     100%{opacity:0;transform:translate(36px,-10px)}}
  @keyframes absorbL{0%{opacity:0;transform:translate(0,0)}
                     25%{opacity:.95}
                     100%{opacity:0;transform:translate(-34px,-8px)}}

  .drop{fill:#2b7fbf;opacity:0}
  .d1{animation:water 2.4s ease-out infinite}
  .d2{animation:water 2.4s ease-out infinite .9s}
  .d3{animation:water 2.4s ease-out infinite 1.7s}
  @keyframes water{0%{opacity:0;transform:translate(0,0)}
                   25%{opacity:.9}
                   100%{opacity:0;transform:translate(-18px,-16px)}}

  .exit{fill:none;stroke:var(--organ-deep);stroke-width:3.5;stroke-linecap:round;
        stroke-linejoin:round;animation:out 1.8s ease-in-out infinite}
  @keyframes out{0%,100%{opacity:.25;transform:translateY(0)}
                 50%{opacity:.9;transform:translateY(5px)}}

  #actLbl{fill:var(--accent);font-size:15px;font-weight:800;letter-spacing:.02em;
          font-family:"Baloo Bhaijaan 2",sans-serif}
  body.urdu #actLbl{font-family:"Noto Nastaliq Urdu",serif;font-size:14px}

  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.6}}

  .readout{
    margin-top:-18px;position:relative;z-index:2;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .stagechip{display:inline-block;background:var(--organ-deep);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px}
  .stagechip.ur{padding:2px 14px 7px}
  .oname{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .oname.ur{line-height:1.95}
  .ojob{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .facts{display:flex;gap:10px;margin-top:16px}
  .fact{flex:1;border:2px solid var(--line);border-radius:14px;padding:11px 10px;text-align:center}
  .fact.now{border-color:var(--organ-on);background:#fbf0e8}
  .fact em{display:block;font-style:normal;font-size:var(--fs-cap);color:var(--ink-soft);
           font-weight:600;margin-bottom:4px}
  .fact b{display:block;font-size:var(--fs-sm);font-weight:800;line-height:1.3}
  .fact.now b{color:var(--organ-deep)}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
    border-left:3px solid var(--organ-on);padding-left:11px;
  }
  .why-note b{color:var(--organ-deep);font-weight:800}
  body.urdu .why-note{
    border-left:0;border-right:3px solid var(--organ-on);padding-left:0;padding-right:11px;
    line-height:var(--lh);
  }

  /* journey controls */
  .drive{margin-top:22px}
  .drive h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 12px;color:var(--ink-soft)}
  .btns{display:flex;gap:10px}
  .btns button{
    border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);
    font:inherit;font-weight:800;font-size:var(--fs-sm);cursor:pointer;min-height:54px;padding:0 16px;
  }
  .btns .go{flex:1;background:var(--ink);color:var(--paper)}
  .btns button:disabled{opacity:.35;cursor:default}
  .btns button:active:not(:disabled){transform:scale(.97)}

  .track{display:flex;gap:5px;margin-top:16px}
  .track i{flex:1;height:9px;border-radius:999px;background:#e8ddcc;transition:background .4s ease}
  .track i.done{background:var(--organ-on)}
  .clock{margin:12px 0 0;text-align:center;font-size:var(--fs-xs);font-weight:700;color:var(--accent)}

  .stops{margin-top:22px}
  .stops h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 12px;color:var(--ink-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .schip{
    border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;
    font:inherit;font-size:var(--fs-xs);font-weight:600;color:var(--ink);cursor:pointer;min-height:44px;
  }
  .schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--good);background:#e9f2e8;font-weight:600}
  .opt.wrong{border-color:var(--organ-on);background:#fbeae4}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;
      grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar"
        "head  head"
        "left  right"
        "quiz  quiz"
        "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar}
    .head{grid-area:head}
    .left{grid-area:left}
    .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px}
    footer{grid-area:foot}
    .drive{margin-top:0}
  }

  @media (prefers-reduced-motion:reduce){
    .pulse{animation:none;opacity:.4}
    .tooth,.swirl,.absorb,.drop,.exit{animation:none}
    #act1.show .mring,#food.travel{animation:none}
    .absorb,.drop{opacity:.7}
    *{transition-duration:.01ms !important}
  }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

  </div>

  <div class="readout">

      en:"Stomach", ur:"معدہ",

      food:{en:"A thick soupy paste", ur:"گاڑھا لیس دار مادہ"},
      time:{en:"2 to 4 hours", ur:"2 سے 4 گھنٹے"},
      job:{en:"The stomach churns the food and mixes strong acid into it. The acid breaks down what teeth could not, and kills most germs that came in with the meal.",
           ur:"معدہ کھانے کو بلوتا ہے اور اس میں تیز تیزاب ملاتا ہے۔ تیزاب وہ کچھ توڑ دیتا ہے جو دانت نہ توڑ سکے، اور کھانے کے ساتھ آنے والے زیادہ تر جراثیم مار دیتا ہے۔"},
      why:{en:"Most children think the stomach is where the body takes the food in. It is not. The stomach only prepares it — almost nothing is absorbed here.",
           ur:"زیادہ تر بچے سمجھتے ہیں کہ جسم خوراک معدے سے لیتا ہے۔ ایسا نہیں ہے۔ معدہ صرف تیاری کرتا ہے — یہاں تقریباً کچھ جذب نہیں ہوتا۔"} },

    { x:130, y:280, r:9, mins:300,
      en:"Small intestine", ur:"چھوٹی آنت",
      act:{en:"Glucose into the blood", ur:"گلوکوز خون میں"},
      food:{en:"Glucose and nutrients entering blood", ur:"گلوکوز اور غذائی اجزاء خون میں"},
      time:{en:"4 to 6 hours", ur:"4 سے 6 گھنٹے"},
      job:{en:"By now the roti has been broken down into glucose and other nutrients. These are small enough to pass through the wall of the intestine into the blood, which carries them to every part of you.",
           ur:"اب تک روٹی ٹوٹ کر گلوکوز اور دوسرے غذائی اجزاء بن چکی ہے۔ یہ اتنے چھوٹے ہوتے ہیں کہ آنت کی دیوار سے گزر کر خون میں شامل ہو جاتے ہیں، اور خون انہیں جسم کے ہر حصے تک پہنچا دیتا ہے۔"},
      why:{en:"It is called small because it is narrow, not short. Uncoiled it would be about 6 metres — longer than your classroom. All that length gives the blood more surface to collect food from.",
           ur:"اسے چھوٹی اس لیے کہتے ہیں کہ یہ تنگ ہے، مختصر نہیں۔ سیدھی کی جائے تو تقریباً 6 میٹر لمبی — آپ کے کمرۂ جماعت سے بھی لمبی۔ اتنی لمبائی خون کو خوراک لینے کے لیے زیادہ جگہ دیتی ہے۔"} },

    { x:84, y:276, r:9, mins:900,
      en:"Large intestine", ur:"بڑی آنت",
      act:{en:"Taking the water back", ur:"پانی واپس لینا"},
      food:{en:"Leftovers, slowly drying", ur:"باقی ماندہ، آہستہ آہستہ خشک"},
      time:{en:"12 to 24 hours", ur:"12 سے 24 گھنٹے"},
      job:{en:"Whatever the body could not use arrives here as a watery leftover. The large intestine takes the water back out and returns it to the body.",
           ur:"جو کچھ جسم استعمال نہ کر سکا، وہ پانی ملے ہوئے باقی ماندہ کی صورت یہاں پہنچتا ہے۔ بڑی آنت اس میں سے پانی واپس نکال کر جسم کو لوٹا دیتی ہے۔"},
      why:{en:"This is why you must drink water. If the body is short of water it pulls out too much here, and what is left becomes hard and painful to pass.",
           ur:"اسی لیے پانی پینا ضروری ہے۔ اگر جسم میں پانی کم ہو تو یہ یہاں سے ضرورت سے زیادہ کھینچ لیتا ہے، اور باقی ماندہ سخت ہو کر تکلیف دیتا ہے۔"} },

    { x:124, y:352, r:8, mins:0,
      en:"The end", ur:"آخری مرحلہ",
      act:{en:"Leaving the body", ur:"جسم سے باہر"},
      food:{en:"Waste, ready to leave", ur:"فضلہ، نکلنے کو تیار"},
      time:{en:"whole trip: about a day", ur:"پورا سفر: تقریباً ایک دن"},
      job:{en:"What is left holds nothing the body needs, so it is stored for a while and then passed out.",
           ur:"جو بچا ہے اس میں جسم کے کام کی کوئی چیز نہیں، اس لیے کچھ دیر جمع رہ کر باہر نکال دیا جاتا ہے۔"},
      why:{en:"One bite, six stops, about 24 hours. Right now, food from yesterday's dinner is somewhere along this path inside you.",
           ur:"ایک لقمہ، چھ پڑاؤ، تقریباً 24 گھنٹے۔ ابھی اسی وقت، کل رات کے کھانے کا کچھ حصہ آپ کے اندر اسی راستے پر کہیں موجود ہے۔"} }
  ];

  var T = {
    driveHead:{en:"Move the food along", ur:"کھانے کو آگے بڑھائیں"},
    stopsHead:{en:"Or jump to a stop", ur:"یا سیدھا کسی پڑاؤ پر جائیں"},
    next:{en:"Next →", ur:"→ آگے"},
    back:{en:"← Back", ur:"واپس ←"},
    restart:{en:"Start again", ur:"دوبارہ شروع"},
    stage:{en:"Stop {n} of 6", ur:"6 میں سے {n} واں پڑاؤ"},
    foodLbl:{en:"The food is now", ur:"کھانا اب"},
    timeLbl:{en:"Time spent here", ur:"یہاں لگنے والا وقت"},
    clock:{en:"Time since the first bite: {t}", ur:"پہلے لقمے سے اب تک: {t}"},
    whyLbl:{en:"Worth knowing:", ur:"جاننے کی بات:"},
    quiz:{en:"Check yourself", ur:"اپنا امتحان لیں"},
    mins:{en:"{n} minutes", ur:"{n} منٹ"},
    hrs:{en:"about {n} hours", ur:"تقریباً {n} گھنٹے"},
    day:{en:"about a day", ur:"تقریباً ایک دن"},
    zero:{en:"just started", ur:"ابھی شروع"}
  };

  var QUIZ = [
    { q:{en:"In what order does the bite travel?",
         ur:"لقمہ کس ترتیب سے سفر کرتا ہے؟"},
      o:[{en:"Mouth → stomach → food pipe → small intestine → large intestine",
          ur:"منہ ← معدہ ← خوراک کی نالی ← چھوٹی آنت ← بڑی آنت"},
         {en:"Mouth → food pipe → stomach → small intestine → large intestine",
          ur:"منہ ← خوراک کی نالی ← معدہ ← چھوٹی آنت ← بڑی آنت"},
         {en:"Mouth → food pipe → stomach → large intestine → small intestine",
          ur:"منہ ← خوراک کی نالی ← معدہ ← بڑی آنت ← چھوٹی آنت"},
         {en:"Mouth → small intestine → stomach → food pipe → large intestine",
          ur:"منہ ← چھوٹی آنت ← معدہ ← خوراک کی نالی ← بڑی آنت"}],
      a:1,
      f:{en:"Chew, push, churn, absorb, dry out. Small comes before large — small is where the body feeds, large is where the water comes back.",
         ur:"چبانا، دھکیلنا، بلونا، جذب کرنا، خشک کرنا۔ چھوٹی آنت پہلے آتی ہے — وہیں جسم خوراک لیتا ہے، اور بڑی آنت میں پانی واپس آتا ہے۔"} },

    { q:{en:"How does food get from your mouth down to your stomach?",
         ur:"کھانا آپ کے منہ سے معدے تک کیسے پہنچتا ہے؟"},
      o:[{en:"It falls down because of gravity", ur:"کشش ثقل سے نیچے گرتا ہے"},
         {en:"Muscles squeeze it along the pipe", ur:"نالی کے پٹھے اسے دبا کر آگے بڑھاتے ہیں"},
         {en:"Air blows it down", ur:"ہوا اسے نیچے دھکیلتی ہے"},
         {en:"Water washes it down", ur:"پانی اسے بہا کر لے جاتا ہے"}],
      a:1,
      f:{en:"Muscles push it. That is why swallowing works upside down, and why astronauts can eat in space.",
         ur:"پٹھے دھکیلتے ہیں۔ اسی لیے الٹا لٹک کر بھی نگلا جا سکتا ہے، اور خلاباز خلا میں کھا سکتے ہیں۔"} },

    { q:{en:"Food is broken down into glucose and other nutrients. Where do these pass into the blood?",
         ur:"خوراک ٹوٹ کر گلوکوز اور دوسرے غذائی اجزاء بن جاتی ہے۔ یہ خون میں کہاں شامل ہوتے ہیں؟"},
      o:[{en:"The stomach", ur:"معدہ"},
         {en:"The mouth", ur:"منہ"},
         {en:"The small intestine", ur:"چھوٹی آنت"},
         {en:"The large intestine", ur:"بڑی آنت"}],
      a:2,
      f:{en:"The stomach only breaks food down — almost nothing is absorbed there. Glucose and nutrients cross the wall of the small intestine into the blood, and the blood carries them everywhere. This is the same glucose a plant makes for itself; we get ours by eating.",
         ur:"معدہ صرف خوراک توڑتا ہے — وہاں تقریباً کچھ جذب نہیں ہوتا۔ گلوکوز اور غذائی اجزاء چھوٹی آنت کی دیوار سے گزر کر خون میں شامل ہوتے ہیں، اور خون انہیں پورے جسم میں پہنچاتا ہے۔ یہ وہی گلوکوز ہے جو پودا اپنے لیے بناتا ہے — ہم اسے کھا کر حاصل کرتے ہیں۔"} },

    { q:{en:"What is the main job of the large intestine?",
         ur:"بڑی آنت کا بنیادی کام کیا ہے؟"},
      o:[{en:"Taking the water back out of the leftovers", ur:"باقی ماندہ سے پانی واپس نکالنا"},
         {en:"Grinding the food", ur:"کھانے کو پیسنا"},
         {en:"Making acid", ur:"تیزاب بنانا"},
         {en:"Cooling the food down", ur:"کھانے کو ٹھنڈا کرنا"}],
      a:0,
      f:{en:"It returns the water to the body. Drink enough water and this step goes smoothly.",
         ur:"یہ پانی جسم کو واپس لوٹاتی ہے۔ کافی پانی پییں تو یہ مرحلہ آسانی سے گزرتا ہے۔"} }
  ];

  function $(id){ return document.getElementById(id); }
  function t(o){ return o[lang]; }

  var LRI = "\u2066", PDI = "\u2069";
  var LATIN_RUN = /[A-Za-z0-9][A-Za-z0-9 .,+()\/@_-]*[A-Za-z0-9]|[A-Za-z0-9]/g;
  function isolate(s){ return s.replace(LATIN_RUN, function(m){ return LRI + m + PDI; }); }

  function setText(el, str){
    el.textContent = (lang === "ur") ? isolate(str) : str;
    el.classList.toggle("ur", lang === "ur");
    el.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
  }

  /* progress pips */
  for (var i=0;i<S.length;i++) $("track").appendChild(document.createElement("i"));

  /* stop chips */
  S.forEach(function(s, i){
    var b = document.createElement("button");
    b.type = "button"; b.className = "schip";
    b.setAttribute("data-i", i); b.setAttribute("aria-pressed","false");
    b.addEventListener("click", function(){ step = i; render(); });
    $("chips").appendChild(b);
  });

  $("next").addEventListener("click", function(){
    step = (step >= S.length - 1) ? 0 : step + 1;
    render();
  });
  $("back").addEventListener("click", function(){
    if (step > 0){ step--; render(); }
  });

  function elapsed(upto){
    var m = 0;
    for (var i=0;i<=upto;i++) m += S[i].mins;
    if (m < 1)    return t(T.zero);
    if (m < 60)   return t(T.mins).replace("{n}", String(Math.round(m)));
    if (m < 1200) return t(T.hrs).replace("{n}", String(Math.round(m/60)));
    return t(T.day);
  }

  function render(){
    var s = S[step];

    // highlight the organ we are inside
    for (var i=0;i<S.length;i++){
      var el = $("o" + i);
      if (el) el.classList.toggle("on", i === step);
    }
    // the stomach outlet is a separate shape but belongs to the stomach
    $("o2b").classList.toggle("on", step === 2);
    {
    }

    // show only the action belonging to this stop
    Array.prototype.forEach.call(document.querySelectorAll(".act"), function(g, i){
      g.classList.toggle("show", i === step);
    });
    $("actLbl").textContent = t(s.act);
    $("actLbl").setAttribute("dir", lang === "ur" ? "rtl" : "ltr");

    // move the bite
    $("food").classList.toggle("travel", step === 1);
    $("food").style.transform = "translate(" + s.x + "px," + s.y + "px)";
    $("foodBlob").setAttribute("r", String(s.r));

    // pips
    Array.prototype.forEach.call($("track").children, function(pip, i){
      pip.classList.toggle("done", i <= step);
    });

    // chips
    Array.prototype.forEach.call($("chips").children, function(b, i){
      b.setAttribute("aria-pressed", i === step ? "true" : "false");
      b.textContent = S[i][lang];
    });

    setText($("stagechip"), t(T.stage).replace("{n}", String(step + 1)));
    setText($("oname"), s[lang]);
    setText($("ojob"), t(s.job));
    setText($("lblFood"), t(T.foodLbl));
    setText($("valFood"), t(s.food));
    setText($("lblTime"), t(T.timeLbl));
    setText($("valTime"), t(s.time));
    $("whyLbl").textContent = t(T.whyLbl);
    setText($("whyText"), t(s.why));
    setText($("clock"), t(T.clock).replace("{t}", elapsed(step)));

    setText($("next"), (step >= S.length - 1) ? t(T.restart) : t(T.next));
    setText($("back"), t(T.back));
    $("back").disabled = (step === 0);

    lastSpoken = s[lang] + ". " + t(s.job);
  }

  var lastSpoken = "";

  function buildQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    QUIZ.forEach(function(item){
      var wrap = document.createElement("div");
      wrap.className = "q";
      var q = document.createElement("p");
      setText(q, t(item.q));
      wrap.appendChild(q);
      var fb = document.createElement("p");
      fb.className = "fb";
      item.o.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang === "ur" ? " ur" : "");
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.textContent = t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done") === "1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show","fb");
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb);
      box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");

    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });

    setText($("driveHead"), t(T.driveHead));
    setText($("stopsHead"), t(T.stopsHead));
    setText($("quizHead"), t(T.quiz));

    buildQuiz();
    render();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });

  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(lastSpoken);
      u.lang = (lang === "ur") ? "ur-PK" : "en-US";
      u.rate = 0.92;
      var voices = window.speechSynthesis.getVoices() || [];
      for (var i=0;i<voices.length;i++){
        if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(lang === "ur" ? "ur" : "en") === 0){
          u.voice = voices[i]; break;
        }
      }
      window.speechSynthesis.speak(u);
    }catch(e){ /* no voice available — stay quiet */ }
  });

  applyLang();
})();
</script>
</body>
</html>
