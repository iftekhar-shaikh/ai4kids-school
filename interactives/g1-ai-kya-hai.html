.demo-stage{background:#fffefb;border:2px solid var(--line);border-radius:17px;padding:13px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:3px solid var(--line);background:#fff;border-radius:15px;min-height:100px;padding:11px 8px;cursor:pointer;text-align:center;font-weight:800}.card.selected{border-color:var(--blue);background:var(--blue2)}.emoji{display:block;font-size:2.25rem;line-height:1.1;margin-bottom:5px}.play{background:var(--green);border:3px solid #236b45;color:#fff;border-radius:16px;padding:11px 18px;min-height:54px;cursor:pointer;font-weight:850;font-size:var(--fs-md);width:100%;margin-top:13px}.demo-msg{border-radius:13px;background:var(--yellow);padding:10px 13px;margin:11px 0 0;font-weight:750}.lesson-grid{display:grid;gap:13px}.lesson{border:3px solid var(--line);border-radius:18px;background:#fff;padding:15px 17px;scroll-margin-top:12px}.tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:3px 13px;font-size:var(--fs-cap);font-weight:900;margin-bottom:9px}.hook .tag{background:var(--orange)}.misaal .tag{background:var(--green)}.karo .tag{background:var(--purple)}.lesson p{margin:0;font-size:var(--fs-sm)}.quiz{border-top:3px solid var(--ink);margin-top:29px;padding-top:20px}.quiz h2{font-size:var(--fs-lg);margin:0 0 17px}.q{margin-bottom:25px}.q-title{font-size:var(--fs-md);font-weight:800;margin:0 0 10px}.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;margin:8px 0;cursor:pointer;min-height:52px;font-size:var(--fs-sm)}.opt.right{border-color:var(--green);background:#e5f3eb;font-weight:800}.opt.wrong{border-color:var(--red);background:#fae5e1}.opt:disabled{cursor:default}.feedback{display:none;color:var(--muted);font-size:var(--fs-xs);margin:7px 0}.feedback.show{display:block}.score{display:none;text-align:center;border:3px solid var(--green);background:#e5f3eb;border-radius:15px;padding:12px;font-size:var(--fs-md);font-weight:900}.score.show{display:block}footer{margin-top:31px;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:var(--fs-cap)}@media(min-width:760px){.lesson-grid{grid-template-columns:1fr 1fr}.demo-wrap{padding:20px}.cards{grid-template-columns:repeat(3,1fr)}.play{width:auto;min-width:190px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><div class="wrap"><div class="bar"><span class="brand" id="brand"></span><button class="chip" id="langBtn" type="button" aria-pressed="false">Roman Urdu</button><button class="chip" id="speakBtn" type="button">🔊</button></div><header><h1 id="title"></h1><p class="sub" id="subtitle"></p></header><nav class="tabs" id="tabs"></nav><section class="demo-wrap" id="demo"><div class="demo-head"><h2 id="demoTitle"></h2><button class="chip" id="launch" type="button">Play</button></div><p class="demo-instruction" id="demoInstruction"></p><div class="demo-stage" id="demoStage"></div></section><main class="lesson-grid"><article class="lesson hook" id="hook"><span class="tag" id="hookTag"></span><p id="hookText"></p></article><article class="lesson" id="samjhao"><span class="tag" id="samjhaoTag"></span><p id="samjhaoText"></p></article><article class="lesson misaal" id="misaal"><span class="tag" id="misaalTag"></span><p id="misaalText"></p></article><article class="lesson karo" id="karo"><span class="tag" id="karoTag"></span><p id="karoText"></p></article></main><section class="quiz"><h2 id="quizHead"></h2><div id="quizBox"></div><div class="score" id="score"></div></section><footer id="foot"></footer></div><script>const DATA={"title":{"en":"AI kya hai?","ru":"AI kya hai?"},"desc":{"en":"A simple first look at AI","ru":"AI ka asaan ta’aruf"},"lesson":{"hook":{"en":"Have you asked a phone a question? A smart computer can try to answer. Today we meet AI!","ru":"Kya tum ne phone se sawal poocha hai? Smart computer jawab dene ki koshish kar sakta hai. Aaj hum AI se milenge!"},"samjhao":{"en":"AI means Artificial Intelligence. It helps a computer learn from examples and help people. AI is a tool, not a person, and it can make mistakes.","ru":"AI ka matlab Artificial Intelligence hai. Yeh computer ko misaalon se seekhne aur logon ki madad karne mein madad deti hai. AI insan nahi, ek tool hai aur ghalti kar sakti hai."},"misaal":{"en":"A voice helper answering a question or a learning app giving a hint may be using AI.","ru":"Voice helper sawal ka jawab de ya learning app hint de, to AI madad kar rahi ho sakti hai."},"karo":{"en":"Draw a machine that helps you. Tell an adult one job it can do.","ru":"Aisi machine banao jo tumhari madad kare. Baray ko batao ke woh ek kaun sa kaam karegi."}},"demo":{"type":"cards","title":{"en":"Ask the pretend AI","ru":"Nakli AI se pocho"},"instruction":{"en":"Choose a question, then press Ask.","ru":"Sawal chuno, phir Ask dabao."},"items":[["➕","Help me count","Ginti mein madad","I can help count! 1, 2, 3.","Main ginti mein madad kar sakti hoon! 1, 2, 3."],["🎵","Play a song","Gana chalao","I found a happy song!","Mujhe khushi wala gana mil gaya!"],["📚","Give a hint","Hint do","Try one small step first.","Pehle ek chhota step try karo."]]},"quiz":[{"q":{"en":"What is AI?","ru":"AI kya hota hai?"},"options":[{"en":"A machine that can think","ru":"Machine jo soch sakti hai."},{"en":"Only computer games","ru":"Sirf computer games."},{"en":"A mobile app","ru":"Ek mobile app."},{"en":"A toy","ru":"Ek khel."}],"correct":0,"explanation":{"en":"AI helps machines learn and understand.","ru":"AI wo technology hai jo machines ko sochne aur samajhne ki salahiyat deti hai."}},{"q":{"en":"Where is AI used?","ru":"Ai ka istemal kahan hota hai?"},"options":[{"en":"In robots","ru":"Roboton mein."},{"en":"Only on TV","ru":"Sirf TV par."},{"en":"For signing","ru":"Dastakhat karne mein."},{"en":"Only at home","ru":"Ghar ke kaamon mein."}],"correct":0,"explanation":{"en":"AI is often used in robots.","ru":"AI ka istemal aksar roboton mein hota hai jo insaano ki tarah kaam karte hain."}},{"q":{"en":"What is an easy goal of AI?","ru":"AI ka sab se asan maqsad kya hai?"},"options":[{"en":"To help people","ru":"Insaano ki madad karna."},{"en":"To run away","ru":"Khud chalana."},{"en":"To make people sad","ru":"Gham khush karna."},{"en":"Only to sing","ru":"Song sunana."}],"correct":0,"explanation":{"en":"AI can make work easier.","ru":"AI ka maqsad insaano ki madad aur unke liye kaamon ko aasan banana hai."}},{"q":{"en":"In the brief, where is AI used in Pakistan?","ru":"Pakistan mein AI ka istemal kis cheez ke liye ho raha hai?"},"options":[{"en":"Education","ru":"Taliem."},{"en":"Only language learning","ru":"Zubaan sikhne ke liye."},{"en":"Only movies","ru":"Sirf movies banane ke liye."},{"en":"Only small jobs","ru":"Maamuli kaamon ke liye."}],"correct":0,"explanation":{"en":"AI can help children learn.","ru":"Pakistan mein AI ka istemal taleemi tools mein hota hai jo bachon ko behtar sikhne mein madad dete hain."}},{"q":{"en":"Which task can AI help make easier?","ru":"AI ki madad se kaunsa kam aasan hota hai?"},"options":[{"en":"Work at home","ru":"Ghar ka kaam."},{"en":"Making money","ru":"Paise kamaana."},{"en":"Making friends","ru":"Dost banana."},{"en":"Filling lights","ru":"Battiyan bharna."}],"correct":0,"explanation":{"en":"AI can help with everyday work.","ru":"AI ghar ke kaamon ko automate karne ki wajah se aasan banata hai."}}]};</script><script>const D=DATA;(function(){let lang='en',selected=0,played=false,checked=false;const $=id=>document.getElementById(id),t=x=>x&&typeof x==='object'?(x[lang]||x.en||''):String(x||'');function put(e,x){e.textContent=t(x)}function label(k){return {play:{en:'Play',ru:'Khelo'},hook:{en:'HOOK',ru:'HOOK'},samjhao:{en:'SAMJHAO',ru:'SAMJHAO'},misaal:{en:'MISAAL',ru:'MISAAL'},karo:{en:'KARO',ru:'KARO'}}[k]}function render(){document.title=t(D.title)+' | AI4Kids Grade 1 AI';put($('brand'),{en:'AI4Kids · Grade 1 · AI & Technology',ru:'AI4Kids · Jamaat 1 · AI aur Technology'});put($('title'),D.title);put($('subtitle'),D.desc);$('langBtn').textContent=lang==='en'?'Roman Urdu':'English';$('langBtn').setAttribute('aria-pressed',lang==='ru');['hook','samjhao','misaal','karo'].forEach(k=>{put($(k+'Tag'),label(k));put($(k+'Text'),D.lesson[k])});put($('demoTitle'),D.demo.title);put($('demoInstruction'),D.demo.instruction);put($('quizHead'),{en:'Quiz — 5 questions',ru:'Quiz — 5 sawaal'});put($('foot'),{en:'AI4Kids · Grade 1 AI & Technology · Offline lesson',ru:'AI4Kids · Jamaat 1 AI aur Technology · Offline lesson'});let tabs=$('tabs');tabs.innerHTML='';['play','hook','samjhao','misaal','karo'].forEach(k=>{let b=document.createElement('button');b.className='tab';b.textContent=t(label(k));b.setAttribute('aria-pressed',k==='play');b.onclick=()=>{($(k==='play'?'demo':k)).scrollIntoView({behavior:'smooth'})};tabs.appendChild(b)});demo();quiz()}function demo(){let s=$('demoStage');s.innerHTML='';let row=document.createElement('div');row.className='cards';D.demo.items.forEach((it,i)=>{let b=document.createElement('button');b.className='card'+(selected===i?' selected':'');let e=document.createElement('span');e.className='emoji';e.textContent=it[0];b.appendChild(e);b.appendChild(document.createTextNode(t({en:it[1],ru:it[2]})));b.onclick=()=>{selected=i;played=false;checked=false;demo()};row.appendChild(b)});s.appendChild(row);let b=document.createElement('button');b.className='play';b.textContent=D.demo.type==='sort'?(lang==='en'?'✅ Check machine':'✅ Machine check karo'):(lang==='en'?'▶ Play':'▶ Chalao');b.onclick=()=>{if(D.demo.type==='sort')checked=true;else played=true;demo()};s.appendChild(b);let m=document.createElement('div');m.className='demo-msg';let it=D.demo.items[selected];m.textContent=D.demo.type==='sort'?(checked?t(it[4]):t({en:'Choose a machine, then check it.',ru:'Machine chuno, phir check karo.'})):(played?t({en:it[3],ru:it[4]}):t({en:'Choose a card, then press Play.',ru:'Card chuno, phir Play dabao.'}));s.appendChild(m)}function quiz(){let box=$('quizBox');box.innerHTML='';let done=0,score=0;D.quiz.forEach((q,qi)=>{let w=document.createElement('div');w.className='q';let p=document.createElement('p');p.className='q-title';p.textContent=(qi+1)+'. '+t(q.q);w.appendChild(p);let f=document.createElement('p');f.className='feedback';q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+t(o);b.onclick=()=>{if(w.dataset.done)return;w.dataset.done=1;done++;let ok=i===q.correct;if(ok)score++;w.querySelectorAll('button').forEach((x,j)=>{x.disabled=true;if(j===q.correct)x.classList.add('right');else if(j===i)x.classList.add('wrong')});f.textContent=(ok?'✓ ':'✗ ')+t(q.explanation);f.className='feedback show';if(done===5){$('score').textContent=(lang==='en'?'Your score: ':'Tumhara score: ')+score+' / 5';$('score').className='score show'}};w.appendChild(b)});w.appendChild(f);box.appendChild(w)})}$('langBtn').onclick=()=>{lang=lang==='en'?'ru':'en';selected=0;played=false;checked=false;render()};$('speakBtn').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t(D.title)+' '+t(D.desc));u.lang=lang==='ru'?'en-PK':'en-US';u.rate=.9;speechSynthesis.speak(u)}};$('launch').onclick=()=>{$('demo').scrollIntoView({behavior:'smooth'});demo()};render()})();</script></body></html>
