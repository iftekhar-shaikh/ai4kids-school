/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(0.95rem, 2.4vw, 1.15rem);
  --fs-xs: clamp(1.15rem, 3vw, 1.35rem);
  --fs-sm: clamp(1.3rem, 3.4vw, 1.55rem);
  --fs-md: clamp(1.45rem, 3.8vw, 1.8rem);
  --fs-lg: clamp(1.7rem, 4.6vw, 2.2rem);
  --fs-xl: clamp(2.1rem, 5.5vw, 2.75rem);
}
/* /AI4KIDS_FS_SCALE */


:root{
  --accent:#1a5b8f; --accent2:#c9702e; --ok:#2e7d4f; --no:#c4453a;
  --ink:#1f2933; --ink-soft:#4a5661; --paper:#fdfaf3; --line:#ded5c4;
  --board:#eef3f7; --board-deep:#d9e5ee; --good-bg:#e8f2ed; --bad-bg:#fbeae8;
  --fs-cap:clamp(14px, 3.8vw, 16px); --fs-xs:clamp(16px, 4.2vw, 18px);
  --fs-sm:clamp(18px, 4.8vw, 20px); --fs-md:clamp(19px, 5.2vw, 22px);
  --fs-lg:clamp(22px, 6vw, 26px); --fs-xl:clamp(30px, 8vw, 38px); --lh:1.5;
}
body.urdu{
  --fs-cap:clamp(15px, 4vw, 17px); --fs-xs:clamp(17px, 4.5vw, 19px);
  --fs-sm:clamp(19px, 5.2vw, 22px); --fs-md:clamp(21px, 5.6vw, 24px);
  --fs-lg:clamp(24px, 6.5vw, 28px); --fs-xl:clamp(28px, 7.5vw, 36px); --lh:2.1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
  font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
}
body.urdu{font-family:"Noto Nastaliq Urdu","Baloo Bhaijaan 2",serif;line-height:var(--lh)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px;flex-wrap:wrap}
.brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
.chip{
  border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
  font-size:var(--fs-xs);cursor:pointer;min-height:42px;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:focus-visible,button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
body.urdu h1{line-height:1.9}
.sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.tabs button{
  flex:1 1 18%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
  font-size:var(--fs-cap);cursor:pointer;min-height:52px;
}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.scene{
  position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
  background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  padding:14px;min-height:180px;
}
.readout{
  margin-top:12px;background:var(--paper);
  border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
}
.statechip{display:inline-block;color:#fff;border-radius:999px;
           padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px;
           background:var(--accent)}
.statechip.ok{background:var(--ok)} .statechip.no{background:var(--no)}
.lead{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
body.urdu .lead{line-height:1.95}
.detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
.why-note{
  margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
  border-left:3px solid var(--accent);padding-left:11px;
}
body.urdu .why-note{border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;line-height:var(--lh)}
.why-note b{color:var(--accent);font-weight:800}
.play{
  width:100%;margin-top:12px;border:3px solid var(--ink);border-radius:18px;
  background:var(--ink);color:var(--paper);font:inherit;font-weight:800;
  font-size:var(--fs-md);cursor:pointer;min-height:60px;
}
.play:active{transform:scale(.98)}
.play.alt{background:var(--paper);color:var(--ink)}
.play.go{background:var(--ok);border-color:var(--ok)}
.play.stop{background:var(--no);border-color:var(--no)}
.play:disabled{opacity:.45;cursor:not-allowed}
.two{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.two .play{flex:1;min-width:120px;margin-top:0}
.panel{margin-top:14px}
.panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
.lesson{margin-top:8px}
.lcard{
  border:3px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;background:#fffdf8;
}
.lcard .tag{
  display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
  padding:3px 12px;font-size:var(--fs-cap);font-weight:800;margin-bottom:8px;
}
.lcard.hook .tag{background:var(--accent2)}
.lcard.misaal .tag{background:var(--ok)}
.lcard.karo .tag{background:#6b4a8f}
.lcard p{margin:0;font-size:var(--fs-sm);line-height:1.55}
body.urdu .lcard p{line-height:var(--lh)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.card{
  border:3px solid var(--line);background:var(--paper);border-radius:16px;
  padding:14px 10px;font:inherit;cursor:pointer;min-height:88px;color:var(--ink);text-align:center;
}
.card .emoji{font-size:32px;display:block;margin-bottom:4px}
.card .lbl{font-size:var(--fs-sm);font-weight:800;display:block;line-height:1.3}
.card.on{border-color:var(--accent);background:#e8eef8;box-shadow:0 0 0 3px rgba(26,91,143,.2)}
.card.ok{border-color:var(--ok);background:var(--good-bg)}
.card.no{border-color:var(--no);background:var(--bad-bg)}
.card:disabled{opacity:.9;cursor:default}
.schip{
  border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 15px;
  font:inherit;font-size:var(--fs-cap);font-weight:800;color:var(--ink);cursor:pointer;min-height:46px;
}
.schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.step{
  border:3px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;
  background:var(--paper);display:flex;align-items:center;gap:10px;cursor:pointer;
  font-size:var(--fs-sm);font-weight:700;min-height:56px;
}
.step .num{
  flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--fs-xs);
}
.step.sel{border-color:var(--accent);background:#e8eef8}
.step.done{border-color:var(--ok);background:var(--good-bg)}
.step.bad{border-color:var(--no);background:var(--bad-bg)}
.bar-row{display:flex;align-items:flex-end;gap:8px;height:140px;padding:8px 4px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar-col .barf{width:100%;border-radius:10px 10px 4px 4px;background:var(--accent);min-height:8px;border:2px solid var(--ink)}
.bar-col .bl{font-size:var(--fs-cap);font-weight:800;text-align:center}
.robot-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:280px;margin:0 auto;
}
.cell{
  aspect-ratio:1;border:2px solid var(--line);border-radius:10px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.cell.goal{background:#e8f2ed;border-color:var(--ok)}
.cell.path{background:#e8eef8}
.cmd-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cmd{
  border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-weight:800;
  font-size:var(--fs-xs);cursor:pointer;background:var(--paper);min-height:48px;
}
.cmd-list{margin-top:10px;min-height:48px;padding:10px;border:2px dashed var(--line);border-radius:12px;font-size:var(--fs-xs);font-weight:700}
.pitch{position:relative;height:200px;border-radius:14px;background:linear-gradient(180deg,#3d8b6e,#2a5f4a);border:3px solid var(--ink);overflow:hidden}
.pitch .stump{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:28px}
.pitch .ball{position:absolute;width:18px;height:18px;border-radius:50%;background:#f5f5f5;border:2px solid var(--ink);left:12%;top:30%;z-index:2}
.pitch .trail{position:absolute;inset:0;pointer-events:none}
.safe-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pw{width:100%;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;font:inherit;font-size:var(--fs-md);margin-top:8px}
.meter{height:14px;border-radius:999px;background:var(--line);border:2px solid var(--ink);overflow:hidden;margin-top:10px}
.meter>span{display:block;height:100%;width:0%;background:var(--no);transition:width .25s,background .25s}
.quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
.q{margin-bottom:26px}
.q>p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
.opt{
  display:block;width:100%;text-align:left;margin-bottom:10px;
  border:2px solid var(--line);background:var(--paper);border-radius:12px;
  padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);min-height:52px;
}
body.urdu .opt{text-align:right}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--good-bg);font-weight:600}
.opt.wrong{border-color:var(--no);background:var(--bad-bg)}
.fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.55}
.fb.show{display:block}
.score{
  margin-top:14px;padding:14px;border:3px solid var(--ink);border-radius:16px;
  font-weight:800;font-size:var(--fs-md);text-align:center;display:none;
}
.score.show{display:block}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--ink-soft)}
.hidden{display:none !important}
.pat-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:70px}
.pat-item{
  width:56px;height:56px;border-radius:14px;border:3px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:28px;background:#fff;
}
.pat-item.q{background:#fff8e8;border-style:dashed}
@media (min-width:820px){
  .wrap{
    max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
    grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "lesson lesson" "quiz quiz" "foot foot";
    align-items:start;
  }
  .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
  .left{grid-area:left} .right{grid-area:right}
  .lesson{grid-area:lesson}
  .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation:none !important}
}

function buildTabs(){
  var tabs=$("tabs"); tabs.innerHTML="";
  var list=[
    ["play", {en:"Play", ur:"کھیلو"}],
    ["hook", {en:"Hook", ur:"ہُک"}],
    ["samjhao", {en:"Samjhao", ur:"سمجھاؤ"}],
    ["misaal", {en:"Misaal", ur:"مثال"}],
    ["karo", {en:"Karo", ur:"کرو"}]
  ];
  list.forEach(function(x){
    var b=document.createElement("button"); b.type="button";
    b.setAttribute("data-tab", x[0]);
    b.setAttribute("aria-pressed", tab===x[0]?"true":"false");

      tab=x[0];
      Array.prototype.forEach.call(tabs.querySelectorAll("button"), function(btn){

      renderMain();
    });
    tabs.appendChild(b);
  });
}

   {cls:"samjhao",tag:{en:"SAMJHAO",ur:"سمجھاؤ"},body:LESSON.samjhao},
   {cls:"misaal",tag:{en:"MISAAL",ur:"مثال"},body:LESSON.misaal},
   {cls:"karo",tag:{en:"KARO",ur:"کرو"},body:LESSON.karo}
  ].forEach(function(c){
    var d=document.createElement("div"); d.className="lcard "+c.cls;
    var tag=document.createElement("span"); tag.className="tag"; setText(tag,t(c.tag));
    var p=document.createElement("p"); setText(p,t(c.body));
    d.appendChild(tag); d.appendChild(p); box.appendChild(d);
  });
}

var quizScore=0, quizDone=0;
function buildQuiz(){
  var box=$("quizBox"); box.innerHTML=""; quizScore=0; quizDone=0;
  var sb=$("scoreBox"); sb.classList.remove("show"); sb.textContent="";
  setText($("quizHead"), t({en:"Quiz — 5 sawaal", ur:"کوئز — ۵ سوال"}));
  QUIZ.forEach(function(item, qi){
    var wrap=document.createElement("div"); wrap.className="q";
    var q=document.createElement("p");
    setText(q, (qi+1)+". "+t(item.q));
    wrap.appendChild(q);
    var fb=document.createElement("p"); fb.className="fb";
    ["a","b","c","d"].forEach(function(k, oi){
      var b=document.createElement("button"); b.type="button"; b.className="opt";
      b.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      var label = String.fromCharCode(65+oi)+". "+t(item[k]);
      b.textContent = (lang==="ur") ? isolate(label) : label;
      b.addEventListener("click", function(){
        if(wrap.getAttribute("data-done")==="1") return;
        wrap.setAttribute("data-done","1"); quizDone++;
        if(item.correct===k) quizScore++;
        ["a","b","c","d"].forEach(function(kk, xi){
          var btn=wrap.querySelectorAll(".opt")[xi];
          if(kk===item.correct) btn.classList.add("right");
          else if(kk===k) btn.classList.add("wrong");
        });
        setText(fb, t(item.explanation)); fb.classList.add("show");
        if(quizDone===QUIZ.length){
          sb.classList.add("show");
          setText(sb, t({en:"Your score",ur:"آپ کا اسکور"})+": "+quizScore+" "+t({en:"out of",ur:"میں سے"})+" "+QUIZ.length);
        }
      });
      wrap.appendChild(b);
    });
    wrap.appendChild(fb); box.appendChild(wrap);
  });
}

function showLessonTab(key){
  var left=$("leftPane"), right=$("rightPane");
  left.innerHTML=""; right.innerHTML="";
  var map={hook:LESSON.hook, samjhao:LESSON.samjhao, misaal:LESSON.misaal, karo:LESSON.karo};
  var tags={hook:{en:"HOOK",ur:"ہُک"},samjhao:{en:"SAMJHAO",ur:"سمجھاؤ"},misaal:{en:"MISAAL",ur:"مثال"},karo:{en:"KARO",ur:"کرو"}};
  var html='<div class="lesson" style="margin:0"><div class="lcard '+key+'"><span class="tag" id="ltag"></span><p id="lbody"></p></div></div>';
  left.innerHTML=html;
  setText($("ltag"), t(tags[key]));
  setText($("lbody"), t(map[key]));
  lastSpoken = t(map[key]);
  right.innerHTML='<div class="readout"><span class="statechip" id="sc"></span><p class="lead" id="ld"></p><p class="detail" id="dt"></p><p class="why-note"><b id="wl"></b> <span id="wt"></span></p></div>';
  setText($("sc"), t(tags[key]));
  setText($("ld"), t(META.title));
  setText($("dt"), t(META.sub));
  setText($("wl"), t({en:"Ghaur karein:",ur:"غور کریں:"}));
  setText($("wt"), t(META.tip));
}

function renderMain(){
  if(tab==="play"){ renderPlay(); }
  else { showLessonTab(tab); }
}

function applyLang(){
  document.body.classList.toggle("urdu", lang==="ur");
  document.documentElement.lang = (lang==="ur")?"ur":"en";
  document.documentElement.dir = (lang==="ur")?"rtl":"ltr";
  var lb=$("langBtn");
  lb.textContent = (lang==="en")?"اردو":"English";
  lb.setAttribute("aria-pressed", lang==="ur"?"true":"false");
  setText($("brand"), t({en:"AI4Kids · Grade 3 · AI & Technology", ur:"AI4Kids · جماعت ۳ · اے آئی اور ٹیکنالوجی"}));
  setText($("title"), t(META.title));
  setText($("subtitle"), t(META.sub));
  setText($("foot"), t({en:"AI4Kids Islamabad · Grade 3 AI & Technology · "+META.footEn,
    ur:"AI4Kids اسلام آباد · جماعت ۳ اے آئی اور ٹیکنالوجی · "+META.footUr}));
  buildTabs(); buildLessonCards(); buildQuiz(); renderMain();
}

$("langBtn").addEventListener("click", function(){ lang=(lang==="en")?"ur":"en"; applyLang(); });
$("speakBtn").addEventListener("click", function(){
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(lastSpoken || t(META.title));
    u.lang=(lang==="ur")?"ur-PK":"en-US"; u.rate=0.92;
    var voices=window.speechSynthesis.getVoices()||[];
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang && voices[i].lang.toLowerCase().indexOf(lang==="ur"?"ur":"en")===0){ u.voice=voices[i]; break; }
    }
    window.speechSynthesis.speak(u);
  }catch(e){}
});

/* ===== TOPIC DEMO ===== */

var safeIdx=0, safePick=null, safeScore=0;
var SCENES=[
  {em:"📧", ask:{en:"Email: 'Click to win 1 crore!' What do you do?",ur:"ای میل: 'کلک کرو اور ۱ کروڑ جیتو!' تم کیا کرو گے؟"},
   opts:[{en:"Ignore / tell an adult",ur:"نظر انداز / بڑے کو بتاؤ",ok:true},{en:"Click the link",ur:"لنک کھولو",ok:false}],
   tip:{en:"Too-good offers are often scams. Stay safe!",ur:"بہت سستی پیشکش اکثر فراڈ ہوتی ہیں۔ محفوظ رہو!"}},
  {em:"🎮", ask:{en:"A game asks for your home address. Share it?",ur:"گیم گھر کا پتہ مانگتی ہے۔ شیئر کریں؟"},
   opts:[{en:"No — never share personal info",ur:"نہیں — ذاتی معلومات مت دو",ok:true},{en:"Yes, so I can play",ur:"ہاں، کھیلنے کے لیے",ok:false}],
   tip:{en:"Name, address, school, password — keep private!",ur:"نام، پتہ، اسکول، پاس ورڈ — خفیہ رکھو!"}},
  {em:"🔐", ask:{en:"Which password is stronger?",ur:"کون سا پاس ورڈ مضبوط ہے؟"},
   opts:[{en:"Ali123!School",ur:"Ali123!School",ok:true},{en:"1234",ur:"1234",ok:false}],
   tip:{en:"Mix letters, numbers, and symbols. Don't use easy guesses!",ur:"حروف، نمبر اور علامتیں ملاؤ۔ آسان اندازہ مت رکھو!"}},
  {em:"🌐", ask:{en:"Where should you read news online?",ur:"آن لائن خبریں کہاں سے پڑھنی چاہئیں؟"},
   opts:[{en:"Trusted sites / ask teacher",ur:"معتبر سائٹس / استاد سے پوچھو",ok:true},{en:"Any random link",ur:"کوئی بھی لنک",ok:false}],
   tip:{en:"Not everything online is true — check trusted sources.",ur:"آن لائن سب سچ نہیں — معتبر ذرائع چیک کرو۔"}},
  {em:"👋", ask:{en:"Online stranger asks to meet after school. OK?",ur:"آن لائن اجنبی اسکول کے بعد ملنے کو کہے؟"},
   opts:[{en:"No — tell parents",ur:"نہیں — والدین کو بتاؤ",ok:true},{en:"Yes, go alone",ur:"ہاں، اکیلے جاؤ",ok:false}],
   tip:{en:"Never meet online strangers. Tell a trusted adult.",ur:"آن لائن اجنبی سے مت ملو۔ بھروسہ مند بڑے کو بتاؤ۔"}}
];
function renderPlay(){
  var left=$("leftPane"), right=$("rightPane");
  var S=SCENES[safeIdx];
  left.innerHTML='<div class="scene" style="text-align:center"><div style="font-size:56px;margin:8px 0">'+S.em+'</div><p class="lead" id="ask" style="margin:0"></p></div><div class="readout"><span class="statechip" id="sc"></span><p class="lead" id="ld"></p><p class="detail" id="dt"></p><p class="why-note"><b id="wl"></b> <span id="wt"></span></p></div>';
  right.innerHTML='<div class="panel"><h2 id="ph"></h2><div class="safe-row" id="opts"></div><button type="button" class="play alt" id="next" style="margin-top:12px"></button><div style="margin-top:16px"><label class="detail" id="pwLbl"></label><input class="pw" id="pw" type="text" autocomplete="off" spellcheck="false"><div class="meter"><span id="meter"></span></div><p class="detail" id="pwHint" style="margin-top:8px"></p></div></div>';
  setText($("ask"), t(S.ask));
  setText($("ph"), t({en:"Choose the safe action",ur:"محفوظ عمل چنو"}));
  setText($("wl"), t({en:"Ghaur karein:",ur:"غور کریں:"}));
  setText($("pwLbl"), t({en:"Try a strong password:",ur:"مضبوط پاس ورڈ آزماؤ:"}));
  var opts=$("opts");
  S.opts.forEach(function(o, i){
    var b=document.createElement("button"); b.type="button"; b.className="card";
    if(safePick!==null){ if(o.ok) b.classList.add("ok"); else if(i===safePick) b.classList.add("no"); b.disabled=true; }
    b.innerHTML='<span class="lbl"></span>'; setText(b.querySelector(".lbl"), t({en:o.en,ur:o.ur}));
    b.onclick=function(){
      if(safePick!==null) return;
      safePick=i;
      if(o.ok) safeScore++;
      renderPlay();
    };
    opts.appendChild(b);
  });
  if(safePick===null){
    setText($("sc"), t({en:"Safety check "+(safeIdx+1)+"/"+SCENES.length, ur:"سیفٹی چیک "+(safeIdx+1)+"/"+SCENES.length}));
    setText($("ld"), t({en:"Think before you click!",ur:"کلک سے پہلے سوچو!"}));
    setText($("dt"), t({en:"Pick the safer choice.",ur:"محفوظ انتخاب چنو۔"}));
    setText($("wt"), t({en:"AI and internet are useful — and we use them carefully.",ur:"اے آئی اور انٹرنیٹ فائدہ مند ہیں — احتیاط سے استعمال کرو۔"}));
    lastSpoken=t(S.ask);
  } else {
    var ok=S.opts[safePick].ok;
    $("sc").className="statechip "+(ok?"ok":"no");
    setText($("sc"), ok?t({en:"Safe choice!",ur:"محفوظ انتخاب!"}):t({en:"Risky — try the other",ur:"خطرناک — دوسرا آزماؤ"}));
    setText($("ld"), t(S.tip));
    setText($("dt"), t({en:"Score",ur:"اسکور"})+": "+safeScore+" / "+SCENES.length);
    setText($("wt"), t(S.tip));
    lastSpoken=t(S.tip);
  }
  setText($("next"), safeIdx<SCENES.length-1?t({en:"Next situation",ur:"اگلی صورت"}):t({en:"Start over",ur:"پھر سے"}));
  $("next").onclick=function(){
    if(safeIdx<SCENES.length-1){ safeIdx++; safePick=null; }
    else { safeIdx=0; safePick=null; safeScore=0; }
    renderPlay();
  };
  function scorePw(v){
    var s=0;
    if(v.length>=8) s++;
    if(/[A-Z]/.test(v)&&/[a-z]/.test(v)) s++;
    if(/\d/.test(v)) s++;
    if(/[^A-Za-z0-9]/.test(v)) s++;
    return s;
  }
  var pw=$("pw"), meter=$("meter");
  pw.addEventListener("input", function(){
    var s=scorePw(pw.value);
    var pct=[0,25,50,75,100][s];
    var col=["var(--no)","var(--no)","var(--accent2)","#c9a227","var(--ok)"][s];
    meter.style.width=pct+"%"; meter.style.background=col;
    var msgs=[
      {en:"Type to test strength",ur:"مضبوطی جانچنے کے لیے لکھو"},
      {en:"Weak — too short or simple",ur:"کمزور — بہت چھوٹا یا سادہ"},
      {en:"Okay — add more variety",ur:"ٹھیک — مزید تنوع ڈالو"},
      {en:"Good — almost strong",ur:"اچھا — تقریباً مضبوط"},
      {en:"Strong password!",ur:"مضبوط پاس ورڈ!"}
    ];
    setText($("pwHint"), t(msgs[s]));
  });
  setText($("pwHint"), t({en:"Type to test strength",ur:"مضبوطی جانچنے کے لیے لکھو"}));
}


applyLang();
})();
