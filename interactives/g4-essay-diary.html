  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);

body{font-size:var(--fs-md)!important;line-height:1.5!important;}

  :root{
    --board:#f1f0ea;
    --board-deep:#e3e1d6;
    --essay:#2f6fb5;
    --essay-deep:#1d4c85;
    --diary:#6b4a8f;
    --diary-deep:#4a3266;
    --intro:#2e7d55;
    --bodyc:#c9702e;
    --concl:#a8632e;
    --ink:#241f18;
    --ink-soft:#554c41;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#1d4c85;
    --ok:#2e7d4f;
    --no:#c4453a;
    --trap:#c9702e;

    --fs-sm:clamp(20px, 5.3vw, 22px);
    --fs-md:clamp(21px, 5.7vw, 24px);
    --fs-lg:clamp(24px, 6.5vw, 28px);

  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);

  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);

    font-size:var(--fs-xs);cursor:pointer;min-height:44px;
  }

  .chip:focus-visible,button:focus-visible{outline:3px solid var(--trap);outline-offset:2px}
  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}

  .tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
  .tabs button{
    flex:1;min-width:62px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:9px 4px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:56px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .scene{
    border-radius:22px;border:3px solid var(--ink);padding:16px 14px;min-height:120px;
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);

    border:3px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;
    background:var(--paper);
  }
  .lesson .tag{
    display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
    padding:3px 12px;font-size:var(--fs-cap);font-weight:800;margin-bottom:8px;
  }
  .lesson .block p{margin:0;font-size:var(--fs-sm);line-height:1.65}
  .cmp{display:flex;gap:10px;flex-wrap:wrap}
  .ccard{
    flex:1 1 200px;border:3px solid var(--line);border-radius:18px;padding:14px 14px;
    background:var(--paper);
  }

  .ccard.diary{border-color:var(--diary)}
  .ccard h3{margin:0 0 10px;font-size:var(--fs-lg);font-weight:800}
  .ccard.essay h3{color:var(--essay-deep)}
  .ccard.diary h3{color:var(--diary-deep)}
  .row{margin:0 0 10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .row:last-child{border:none;margin:0;padding:0}
  .row em{display:block;font-style:normal;font-size:var(--fs-cap);font-weight:800;
          color:var(--ink-soft);margin-bottom:3px}
  .row span{display:block;font-size:var(--fs-sm);font-weight:600;line-height:1.5}
  .slots{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .slot{
    border:3px dashed var(--line);border-radius:16px;padding:12px 14px;min-height:64px;
    background:rgba(255,255,255,.55);display:flex;align-items:center;gap:10px;
  }
  .slot.filled{border-style:solid;border-color:var(--ink);background:var(--paper)}
  .slot.ok{border-color:var(--ok);background:#e8f2ec}
  .slot.bad{border-color:var(--no);background:#fbeae8}

    flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--fs-sm);

  .slot .ph{color:var(--ink-soft);font-weight:700;font-size:var(--fs-xs)}

  .piece{
    border:3px solid var(--ink);background:#fff;border-radius:14px;padding:12px 14px;
    font:inherit;font-weight:800;font-size:var(--fs-sm);cursor:grab;min-height:52px;
    color:var(--ink);touch-action:manipulation;
  }
  .piece:active{cursor:grabbing}
  .piece.used{opacity:.35;pointer-events:none}
  .piece.intro{border-color:var(--intro);background:#e8f2ec;color:var(--intro)}
  .piece.body{border-color:var(--bodyc);background:#fef3e8;color:var(--bodyc)}
  .piece.concl{border-color:var(--concl);background:#f7ebe0;color:var(--concl)}

    margin-top:12px;border:3px solid var(--ink);background:var(--ink);color:var(--paper);
    border-radius:14px;padding:12px 18px;font:inherit;font-weight:800;font-size:var(--fs-sm);
    cursor:pointer;min-height:52px;width:100%;

  .resetbtn{background:var(--paper);color:var(--ink);margin-top:8px}
  .fbbox{
    margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:700;font-size:var(--fs-sm);
    display:none;line-height:1.55;
  }
  .fbbox.show{display:block}
  .fbbox.ok{background:#e8f2ec;border:2px solid var(--ok);color:var(--ok)}
  .fbbox.no{background:#fbeae8;border:2px solid var(--no);color:var(--no)}

  .dform input,.dform select,.dform textarea{

    font:inherit;font-size:var(--fs-sm);background:#fff;color:var(--ink);min-height:48px;
  }

    flex:1 1 28%;border:2px solid var(--line);background:var(--paper);border-radius:999px;

  }
  .feel button[aria-pressed="true"]{border-color:var(--diary);background:#efe8f6;color:var(--diary-deep)}
  .essaybox{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:16px 16px}
  .essaybox p{margin:0 0 12px;font-size:var(--fs-sm);line-height:1.7}
  .essaybox p:last-child{margin:0}
  .essaybox mark{
    border-radius:5px;padding:2px 6px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);color:inherit;
  }
  .essaybox mark.mi{background:#c8e6d4}
  .essaybox mark.mb{background:#ffe4c4}
  .essaybox mark.mc{background:#f5d9c0}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .legend span{
    display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-cap);font-weight:800;
    padding:6px 12px;border-radius:999px;border:2px solid var(--line);
  }
  .legend .dot{width:12px;height:12px;border-radius:3px}
  .legend .di .dot{background:#c8e6d4} .legend .db .dot{background:#ffe4c4} .legend .dc .dot{background:#f5d9c0}
  .readout{
    margin-top:12px;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px}
  .statechip.ok{background:var(--ok)} .statechip.no{background:var(--no)}
  .lead{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.4}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:14px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:54px;
  }
  .opt.ur{text-align:right}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--no);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.6}
  .fb.show{display:block}
  .score{
    margin-top:8px;padding:14px 16px;border:3px solid var(--ink);border-radius:16px;
    font-weight:800;font-size:var(--fs-md);text-align:center;display:none;
  }
  .score.show{display:block}
  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}
  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "quiz quiz" "foot foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
  }
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }

  function placePart(slotI, partId){
    if (planChecked) return;
    var old = planOrder[slotI];
    for (var i=0;i<3;i++) if (planOrder[i]===partId) planOrder[i]=null;
    planOrder[slotI] = partId;
    if (old && old !== partId){ /* freed */ }
    renderPlan();
  }

  function renderPlan(){
    var left = $("leftPane"); left.innerHTML = "";
    var scene = document.createElement("div"); scene.className = "scene";
    var slots = document.createElement("div"); slots.className = "slots";
    for (var i=0;i<3;i++){
      (function(si){
        var sl = document.createElement("div");
        sl.className = "slot" + (planOrder[si] ? " filled" : "");
        if (planChecked){
          sl.className += (planOrder[si] === CORRECT[si]) ? " ok" : " bad";
        }
        sl.setAttribute("data-slot", String(si));
        var num = document.createElement("span"); num.className = "num"; num.textContent = String(si+1);
        sl.appendChild(num);
        if (planOrder[si]){
          var p = partById(planOrder[si]);
          var lab = document.createElement("button");
          lab.type = "button";
          lab.className = "piece " + p.cls;
          lab.style.cssText = "border-width:2px;padding:8px 12px;margin:0;flex:1;text-align:inherit;cursor:pointer";
          setText(lab, t(p.label));
          lab.addEventListener("click", function(){
            if (planChecked) return;
            planOrder[si] = null;
            renderPlan();
          });
          sl.appendChild(lab);
        } else {
          var ph = document.createElement("span"); ph.className = "ph";
          setText(ph, t(T.slotPh));
          sl.appendChild(ph);
        }
        sl.addEventListener("dragover", function(e){ e.preventDefault(); });
        sl.addEventListener("drop", function(e){
          e.preventDefault();
          var id = e.dataTransfer.getData("text/plain");
          if (id) placePart(si, id);
        });
        slots.appendChild(sl);
      })(i);
    }
    scene.appendChild(slots);

    var bank = document.createElement("div"); bank.className = "bank";
    PARTS.forEach(function(p){
      var used = planOrder.indexOf(p.id) !== -1;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "piece " + p.cls + (used ? " used" : "");
      b.draggable = !used && !planChecked;
      setText(b, t(p.label));
      b.addEventListener("dragstart", function(e){
        e.dataTransfer.setData("text/plain", p.id);
      });
      b.addEventListener("click", function(){
        if (used || planChecked) return;
        for (var j=0;j<3;j++){
          if (planOrder[j] === null){ placePart(j, p.id); return; }
        }
      });
      bank.appendChild(b);
    });
    scene.appendChild(bank);

    var chk = document.createElement("button");
    chk.type = "button"; chk.className = "checkbtn";
    setText(chk, t(T.check));
    chk.addEventListener("click", function(){
      if (planOrder.indexOf(null) !== -1) return;
      planChecked = true;
      var good = planOrder[0]==="intro" && planOrder[1]==="body" && planOrder[2]==="concl";
      lastSpoken = good ? "Shabash! Intro, body, conclusion." : "Try again. Intro, body, conclusion.";
      renderPlan();
    });
    scene.appendChild(chk);

    var rst = document.createElement("button");
    rst.type = "button"; rst.className = "resetbtn";
    setText(rst, t(T.reset));
    rst.addEventListener("click", function(){
      planOrder = [null,null,null]; planChecked = false; renderPlan();
    });
    scene.appendChild(rst);

    if (planChecked){
      var good = planOrder[0]==="intro" && planOrder[1]==="body" && planOrder[2]==="concl";
      var fb = document.createElement("div");
      fb.className = "fbbox show " + (good ? "ok" : "no");
      setText(fb, good ? t(T.planOk) : t(T.planNo));
      scene.appendChild(fb);
    }
    left.appendChild(scene);

    var right = $("rightPane"); right.innerHTML = "";
    var ro = document.createElement("div"); ro.className = "readout";
    var chip = document.createElement("span"); chip.className = "statechip";
    setText(chip, lang==="en" ? "Tip" : "ٹپ");
    var lead = document.createElement("p"); lead.className = "lead";
    setText(lead, lang==="en" ? "Essay order" : "Essay کی ترتیب");
    var detail = document.createElement("p"); detail.className = "detail";
    setText(detail, lang==="en"
      ? "1 Introduction → 2 Body (details) → 3 Conclusion. Tap pieces into empty slots, or drag them."
      : "۱ شروع → ۲ درمیان (تفصیل) → ۳ اختتام۔ خالی سلاٹ میں ٹیپ کرو، یا ڈریگ کرو۔");
    ro.appendChild(chip); ro.appendChild(lead); ro.appendChild(detail);
    right.appendChild(ro);
    lastSpoken = "Put introduction, body, and conclusion in order.";
  }

  function renderDiary(){
    var saved = loadDiary() || {};
    if (!diaryFeel && saved.feel) diaryFeel = saved.feel;
    var left = $("leftPane"); left.innerHTML = "";
    var form = document.createElement("div"); form.className = "dform scene";

    var inpD = document.createElement("input"); inpD.type = "date"; inpD.id = "dDate";
    inpD.value = saved.date || new Date().toISOString().slice(0,10);
    form.appendChild(ld); form.appendChild(inpD);

    var lf = document.createElement("label"); setText(lf, t(T.feeling));
    form.appendChild(lf);
    var feel = document.createElement("div"); feel.className = "feel";
    FEELS.forEach(function(f){
      var b = document.createElement("button");
      b.type = "button";
      setText(b, t(f));
      b.setAttribute("aria-pressed", diaryFeel === f.id ? "true" : "false");
      b.addEventListener("click", function(){
        diaryFeel = f.id;

          x.setAttribute("aria-pressed","false");

        b.setAttribute("aria-pressed","true");

      feel.appendChild(b);

        var bt = document.createElement("button");

          wrap.setAttribute("data-done","1");
          quizAnswered++;
          if (oi === item.a) quizScore++;
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show");
          if (quizAnswered === QUIZ.length){
            var sb = $("scoreBox");
            sb.classList.add("show");
            setText(sb, t(T.score) + ": " + quizScore + " " + t(T.of) + " " + QUIZ.length);
          }
        });
        wrap.appendChild(bt);
      });
      wrap.appendChild(fb); box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");
    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });
    buildQuiz(); render();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en"; applyLang();
  });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u2 = new SpeechSynthesisUtterance(lastSpoken);
      u2.lang = 'hi-IN'; u2.rate = 0.85;
      window.speechSynthesis.speak(u2);
    }catch(e){}
  });

  applyLang();
})();
</script>
<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
