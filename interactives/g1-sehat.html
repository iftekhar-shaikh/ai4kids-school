safely.","ru":"Humari sehat kaafi cheezon par depend karti hai, aur unme se ek hai sehatmand khana. Sehatmand khana aisa khana hai jo humein taqat de. Yeh fruits, sabziyan, daalain aur doodh jese cheezein hain. Inhe khane se humare jism ki growth hoti hai aur hum zyada active rehte hain. Ab baat karte hain haath dhone ki. Jab hum khana khate hain ya bahar jaate hain, to hamesha apne haath dhone chahiye. Isse germs aur bacteria khatam ho jaate hain jo beemariyaan faela sakte hain. Haath dhona sirf khana khane se pehle nahi, balki toilet use karne ke baad bhi bohot zaroori hai. Agar aap apne haath dhote hain to aap khud ko aur apne doston ko bimarion se bacha sakte hain. Isliye, hamesha sabun se achi tarah se haath dhona sikhna chahiye. Yeh ek aasan aur aham tareeqa hai sehatmand rehne ka. Khud ko sehatmand rakhne ke liye, sirf khana nahi, balki masroof rehna bhi zaroori hai. Khelna, daudna aur khush rehna bhi humari sehat ke liye acha hai. Isliye, hamesha healthy cheezon ka intikhab karein."},"misaal":{"en":"Before lunch, wash hands with soap. Choose a banana and water often, and enjoy chips only sometimes.","ru":"Socho agar aap bazaar jaate hain aur wahan sabzi wale ke paas se fresh sabziyan lete hain, to aapne sehatmand khane ka intikhab kiya. Lekin agar aap wahan se chaat ya pakore lete hain, jo dher saare tel mein bane hote hain, to yeh aapki sehat ke liye acha nahi hai. Isliye, behtar yeh hai ke hum hamesha sehatmand khane ko chunen."},"karo":{"en":"Make a healthy-day checklist: wash hands, brush teeth, drink water, eat fruit, play, and sleep on time.","ru":"Ghar ya school mein ek \"Healthy Eating Chart\" banao. Is chart par un sabziyon, fruits aur grains ki pictures chipkaao jo aapko achi lagti hain. Phir inhe daily khane ki koshish karo. Saath mein, ek routine banao jisme aap haath dhone ka waqt zaroor rakhte hain, jaise khana khane se pehle aur toilet use karne ke baad."},"demo":{"type":"cards","title":{"en":"Healthy choice game","ru":"Sehatmand choice game"},"instruction":{"en":"Tap a card to learn the healthy choice.","ru":"Card par tap karke sehatmand choice seekho."},"items":[{"emoji":"🍎","name":{"en":"Fruit","ru":"Phal"},"label":{"en":"Fruit gives useful nutrients.","ru":"Phal faidemand ghizaiyat deta hai."}},{"emoji":"🧼","name":{"en":"Soap","ru":"Sabun"},"label":{"en":"Soap helps wash away germs.","ru":"Sabun germs dhone mein madad deta hai."}},{"emoji":"💧","name":{"en":"Water","ru":"Pani"},"label":{"en":"Clean water helps keep us hydrated.","ru":"Saaf pani jism ko pani wala rakhta hai."}},{"emoji":"🪥","name":{"en":"Brush","ru":"Brush"},"label":{"en":"Brushing helps keep teeth clean.","ru":"Brush daant saaf rakhne mein madad deta hai."}}]},"quiz":[{"q":{"en":"When should we wash our hands?","ru":"Humein haath kab dhone chahiye?"},"o":[{"en":"Before eating","ru":"Khane se pehle"},{"en":"Never","ru":"Kabhi nahi"},{"en":"Only birthdays","ru":"Sirf birthday par"},{"en":"After sleeping only","ru":"Sirf sone ke baad"}],"a":0,"e":{"en":"Wash hands before eating and after the toilet.","ru":"Wash hands before eating and after the toilet."}},{"q":{"en":"Which is a healthy drink?","ru":"Sehatmand drink kaunsi hai?"},"o":[{"en":"Clean water","ru":"Saaf pani"},{"en":"Too much fizzy drink","ru":"Bohat zyada fizzy drink"},{"en":"Dirty water","ru":"Ganda pani"},{"en":"Paint","ru":"Paint"}],"a":0,"e":{"en":"Clean water is a healthy choice.","ru":"Clean water is a healthy choice."}},{"q":{"en":"What helps keep teeth clean?","ru":"Daant saaf rakhne mein kya madad deta hai?"},"o":[{"en":"Toothbrush","ru":"Daant ka brush"},{"en":"A stone","ru":"Pathar"},{"en":"Mud","ru":"Kechar"},{"en":"No cleaning","ru":"Safai nahi"}],"a":0,"e":{"en":"Brush teeth regularly.","ru":"Brush teeth regularly."}},{"q":{"en":"Which food is healthy?","ru":"Kaunsa khana sehatmand hai?"},"o":[{"en":"Vegetables","ru":"Sabziyan"},{"en":"Only sweets","ru":"Sirf mithai"},{"en":"Only crisps","ru":"Sirf crisps"},{"en":"Soap","ru":"Sabun"}],"a":0,"e":{"en":"Vegetables help our body grow.","ru":"Vegetables help our body grow."}},{"q":{"en":"Why do we sleep?","ru":"Hum kyun sote hain?"},"o":[{"en":"To rest and grow","ru":"Aaram aur growth ke liye"},{"en":"To get dirty","ru":"Ganda hone ke liye"},{"en":"To skip food","ru":"Khana chhorne ke liye"},{"en":"To break toys","ru":"Khilone torne ke liye"}],"a":0,"e":{"en":"Sleep gives the body rest.","ru":"Sleep gives the body rest."}}]};
(function(){'use strict';var lang='en',selected=0,answered=0,score=0;
function $(id){return document.getElementById(id)}

function setCommon(){document.documentElement.lang=lang;document.title=t(DATA.title)+' | AI4Kids Grade 1 Science';put($('brand'),{en:'AI4Kids · Grade 1 · Science',ru:'AI4Kids · Jamaat 1 · Science'});put($('title'),DATA.title);put($('subtitle'),DATA.desc);put($('quizHead'),{en:'Quiz — 5 questions',ru:'Quiz — 5 sawaal'});put($('foot'),{en:'AI4Kids · Grade 1 Science · Offline lesson',ru:'AI4Kids · Jamaat 1 Science · Offline lesson'});$('langBtn').textContent=lang==='en'?'Roman Urdu':'English';$('langBtn').setAttribute('aria-pressed',lang==='ru');var L=labels();['hook','samjhao','misaal','karo'].forEach(function(k){put($(k+'Tag'),L[k]);put($(k+'Text'),DATA[k])});put($('demoTitle'),DATA.demo.title);put($('demoInstruction'),DATA.demo.instruction);put($('launch'),{en:'Play demo',ru:'Demo khelo'});renderTabs();renderDemo();renderQuiz()}

function renderQuiz(){var box=$('quizBox');box.innerHTML='';answered=0;score=0;$('score').classList.remove('show');DATA.quiz.forEach(function(q,qi){var wrap=document.createElement('section');wrap.className='q';var title=document.createElement('p');title.className='q-title';title.textContent=(qi+1)+'. '+t(q.q);wrap.appendChild(title);q.o.forEach(function(op,oi){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+oi)+'. '+t(op);b.onclick=function(){if(wrap.dataset.done)return;wrap.dataset.done='1';answered++;var ok=oi===q.a;if(ok)score++;b.classList.add(ok?'right':'wrong');if(!ok)wrap.querySelectorAll('.opt').forEach(function(x,xi){if(xi===q.a)x.classList.add('right')});var fb=wrap.querySelector('.feedback');fb.textContent=(ok?'✓ ':'✗ ')+t(q.e);fb.classList.add('show');wrap.querySelectorAll('button').forEach(function(x){x.disabled=true});if(answered===DATA.quiz.length){$('score').textContent=t({en:'Your score: '+score+' / 5 — '+(score===5?'Excellent!':'Good practice!'),ru:'Tumhara score: '+score+' / 5 — '+(score===5?'Shabash!':'Achi practice!')});$('score').classList.add('show')}};wrap.appendChild(b)});var fb=document.createElement('p');fb.className='feedback';wrap.appendChild(fb);box.appendChild(wrap)})}
$('langBtn').onclick=function(){lang=lang==='en'?'ru':'en';selected=0;setCommon()};$('speakBtn').onclick=function(){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t(DATA.title)+' '+t(DATA.desc));u.lang=lang==='en'?'en-US':'en-PK';u.rate=.9;window.speechSynthesis.speak(u)};$('launch').onclick=function(){$('demo').scrollIntoView({behavior:'smooth'});renderDemo()};setCommon()})();</script></body></html>
