<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prepositions — Jagah aur Waqt | AI4Kids Grade 4 English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#eef2f0;
    --board-deep:#dde4e1;
    --crate:#c9a878;
    --crate-deep:#96774a;
    --cat:#6b6f76;
    --cat-deep:#43474d;
    --place:#2f6fb5;
    --place-deep:#1d4c85;
    --time:#6b4a8f;
    --time-deep:#4a3266;
    --ink:#241f18;
    --ink-soft:#554c41;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#1d4c85;
    --ok:#2e7d4f;
    --no:#c4453a;

    --fs-cap:clamp(15px, 3.9vw, 16px);
    --fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.7vw, 19px);
    --fs-md:clamp(19px, 5.1vw, 21px);
    --fs-lg:clamp(22px, 5.9vw, 25px);
    --fs-xl:clamp(28px, 7.6vw, 34px);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.55;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:44px;
  }
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--crate-deep);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}

  .tabs{display:flex;gap:7px;margin:0 0 14px}
  .tabs button{
    flex:1;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:56px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  }
  .scene svg{display:block;width:100%;height:auto}
  #catG{transition:transform .4s cubic-bezier(.4,.1,.3,1)}

  .band{
    margin-top:12px;border:3px solid var(--ink);border-radius:16px;background:#fff;
    padding:14px 12px;text-align:center;
  }
  .band .en{font-size:var(--fs-lg);font-weight:800;line-height:1.4;margin:0}
  .band .en mark{background:#ffe9b8;border-radius:5px;padding:1px 6px;
                 box-shadow:inset 0 -2px 0 #e8b23d;color:inherit}
  .band .ur{font-size:var(--fs-xs);color:var(--ink-soft);margin:7px 0 0;font-weight:700}
  .band .blank{display:inline-block;min-width:96px;border-bottom:4px solid var(--crate-deep);
               color:var(--crate-deep)}

  .picks{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .picks button{
    flex:1 1 30%;border:3px solid var(--line);background:var(--paper);border-radius:16px;
    padding:12px 6px;font:inherit;font-weight:800;font-size:var(--fs-sm);color:var(--ink-soft);
    cursor:pointer;min-height:60px;
  }
  .picks button.good{border-color:var(--ok);background:#e8f2ec;color:var(--ok)}
  .picks button.bad{border-color:var(--no);background:#fbeae8;color:var(--no)}

  .readout{
    margin-top:12px;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px}
  .statechip.ok{background:var(--ok)} .statechip.no{background:var(--no)}
  .lead{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.4}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .rule{
    margin-top:14px;border:2px dashed var(--accent);background:#eef2f8;border-radius:14px;
    padding:12px 14px;font-size:var(--fs-xs);font-weight:700;color:var(--accent);line-height:1.6;
  }
  .rule b{background:#fff;border-radius:5px;padding:1px 6px}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}

  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .schip{
    border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;
    font:inherit;font-size:var(--fs-cap);font-weight:800;color:var(--ink);cursor:pointer;min-height:46px;
  }
  .schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .schip.done{border-color:var(--ok)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:52px;
  }
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--no);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.6}
  .fb.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "quiz quiz" "foot foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){
    #catG{transition:none}
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <span class="brand">AI4Kids · Grade 4 · English</span>
  </div>

  <div class="head">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  </div>

  <div class="tabs" role="group">
    <button type="button" id="tabPlc" aria-pressed="true">Billi kahan hai</button>
    <button type="button" id="tabTst" aria-pressed="false">Pehchanein</button>
    <button type="button" id="tabTim" aria-pressed="false">Waqt: at, on, in</button>
  </div>

  <div class="left">
  <div class="scene">
    <svg viewBox="0 0 320 200" role="img" id="svg" aria-label="Billi aur dabbe ki tasveer"></svg>
  </div>

  <div class="band" id="band"></div>
  <div class="picks" id="picks"></div>

  <div class="readout">
    <span class="statechip" id="statechip"></span>
    <p class="lead" id="lead"></p>
    <p class="detail" id="detail"></p>
    <p class="rule" id="rule"></p>
    <p class="why-note"><b>Ghaur karein:</b> <span id="whyText"></span></p>
  </div>
  </div>

  <div class="right">
  <div class="panel">
    <h2 id="panelHead"></h2>
    <div class="chips" id="chips" role="group"></div>
  </div>
  </div>

  <div class="quiz">
    <h2 id="quizHead" style="font-size:var(--fs-lg);font-weight:800;margin:0 0 18px">Apna imtihan lein</h2>
    <div id="quizBox"></div>
  </div>

  <footer>
    <p>AI4Kids — Islamabad ka do zabanon wala AI aur coding school. WhatsApp 0337 1468899</p>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var tab="plc";
  var plcI=0;
  var tstI=0, tstPick=null, tstDone={};
  var timI=0, timPick=null, timDone={};

  /* x,y = billi ki jagah. front:true ka matlab billi dabbe ke saamne banegi */
  var PLACES=[
    { p:"in", x:160, y:128, front:false, inside:true, two:false,
      s:"The cat is <mark>in</mark> the box.", u:"Billi dabbe ke andar hai.",
      note:"in = andar. Dabbe, kamre, paani \u2014 kisi cheez ke andar hone par in." },
    { p:"on", x:160, y:92, front:true, inside:false, two:false,
      s:"The cat is <mark>on</mark> the box.", u:"Billi dabbe ke oopar baithi hai.",
      note:"on = oopar, magar chhoo kar. Mez par kitab, deewar par tasveer \u2014 sab on." },
    { p:"under", x:160, y:172, front:true, inside:false, two:false,
      s:"The cat is <mark>under</mark> the box.", u:"Billi dabbe ke neeche hai.",
      note:"under = neeche. Mez ke neeche, palang ke neeche \u2014 under." },
    { p:"behind", x:172, y:112, front:false, inside:false, two:false,
      s:"The cat is <mark>behind</mark> the box.", u:"Billi dabbe ke peechhe hai.",
      note:"behind = peechhe. Billi nazar nahin aa rahi kyunki dabba saamne hai." },
    { p:"in front of", x:150, y:160, front:true, inside:false, two:false,
      s:"The cat is <mark>in front of</mark> the box.", u:"Billi dabbe ke saamne hai.",
      note:"in front of = saamne. Yeh teen lafzon ka group hai, magar kaam ek preposition ka karta hai." },
    { p:"next to", x:242, y:152, front:true, inside:false, two:false,
      s:"The cat is <mark>next to</mark> the box.", u:"Billi dabbe ke bilkul saath hai.",
      note:"next to = bilkul saath, chipki hui. Isi ke liye beside bhi bola jata hai." },
    { p:"near", x:284, y:152, front:true, inside:false, two:false,
      s:"The cat is <mark>near</mark> the box.", u:"Billi dabbe ke paas hai, magar chipki hui nahin.",
      note:"near = paas, magar thora faasla hai. next to aur near ka farq yahi hai." },
    { p:"between", x:160, y:152, front:true, inside:false, two:true,
      s:"The cat is <mark>between</mark> the two boxes.", u:"Billi do dabbon ke darmiyan hai.",
      note:"between = do cheezon ke darmiyan. Do se zyada hon to among istemal hota hai." }
  ];

  /* pehchanne wali mashq \u2014 billi rakhi hui hai, lafz chunna hai */
  var TEST=[
    { i:0, opts:["in","on","under"] },
    { i:2, opts:["on","under","behind"] },
    { i:3, opts:["behind","in front of","next to"] },
    { i:1, opts:["in","on","near"] },
    { i:6, opts:["next to","near","between"] },
    { i:7, opts:["between","behind","under"] },
    { i:4, opts:["in front of","behind","on"] },
    { i:5, opts:["next to","in","under"] }
  ];

  var TIME=[
    { s:"School starts ___ 8 o'clock.", ans:"at",
      u:"Gharri ka theek waqt bataya ja raha hai. Aise nuqte par hamesha at: at 8 o'clock, at 5:30, at noon." },
    { s:"We have a test ___ Monday.", ans:"on",
      u:"Din ka naam aaya, to on. Har din aur har tareekh par on: on Monday, on Friday." },
    { s:"My birthday is ___ 14 August.", ans:"on",
      u:"Tareekh bhi din hi hoti hai, to phir on: on 14 August, on 1 January." },
    { s:"It is very cold ___ January.", ans:"in",
      u:"Mahina lamba arsa hai, to in. Mahine, saal aur mausam par in: in January, in 2026, in winter." },
    { s:"We go to the park ___ the evening.", ans:"in",
      u:"Din ke lambe hisson par in: in the morning, in the afternoon, in the evening." },
    { s:"I sleep early ___ night.", ans:"at",
      u:"Yeh istisna hai. \u201cin the morning\u201d hota hai magar \u201cat night\u201d \u2014 \u201cin the night\u201d nahin. Yeh qaide se nahin nikalta, yaad rakhna parta hai." }
  ];

  var NS="http://www.w3.org/2000/svg";
  function mk(tag,a){ var e=document.createElementNS(NS,tag);
    for (var k in a) e.setAttribute(k,a[k]); return e; }
  function $(id){ return document.getElementById(id); }

  function crate(g, cx){
    // chaar chhoti tangein, taake "under" saaf nazar aaye
    [cx-34, cx+26].forEach(function(lx){
      g.appendChild(mk("rect",{x:lx,y:158,width:9,height:20,fill:"var(--crate-deep)"}));
    });
    g.appendChild(mk("rect",{x:cx-42,y:104,width:84,height:56,rx:5,
                             fill:"var(--crate)",stroke:"var(--crate-deep)","stroke-width":3}));
    g.appendChild(mk("line",{x1:cx-42,y1:122,x2:cx+42,y2:122,
                             stroke:"var(--crate-deep)","stroke-width":2.5}));
    g.appendChild(mk("line",{x1:cx,y1:104,x2:cx,y2:160,
                             stroke:"var(--crate-deep)","stroke-width":2.5}));
  }
  function cat(g, x, y){
    var c=mk("g",{id:"catG", transform:"translate("+x+","+y+")"});
    c.appendChild(mk("ellipse",{cx:0,cy:8,rx:24,ry:14,fill:"var(--cat)"}));
    c.appendChild(mk("path",{d:"M22 4 q16 -6 12 -20",fill:"none",stroke:"var(--cat)",
                             "stroke-width":6,"stroke-linecap":"round"}));
    c.appendChild(mk("circle",{cx:-18,cy:-10,r:14,fill:"var(--cat)"}));
    c.appendChild(mk("path",{d:"M-30 -18 L-33 -32 L-21 -24 Z",fill:"var(--cat)"}));
    c.appendChild(mk("path",{d:"M-6 -18 L-3 -32 L-15 -24 Z",fill:"var(--cat)"}));
    c.appendChild(mk("circle",{cx:-23,cy:-11,r:3,fill:"#fff"}));
    c.appendChild(mk("circle",{cx:-13,cy:-11,r:3,fill:"#fff"}));
    c.appendChild(mk("circle",{cx:-23,cy:-11,r:1.6,fill:"var(--cat-deep)"}));
    c.appendChild(mk("circle",{cx:-13,cy:-11,r:1.6,fill:"var(--cat-deep)"}));
    g.appendChild(c);
  }

  function drawScene(pl){
    var svg=$("svg"); svg.innerHTML=""; svg.setAttribute("viewBox","0 0 320 200");
    var g=mk("g",{}); svg.appendChild(g);
    g.appendChild(mk("rect",{x:0,y:178,width:320,height:22,fill:"#8f9a86"}));

    if (pl.two){
      // billi do dabbon ke darmiyan
      crate(g, 92); crate(g, 228);
      cat(g, pl.x, pl.y);
      return;
    }
    if (pl.front){
      crate(g, 160); cat(g, pl.x, pl.y);         // billi saamne
    } else if (pl.inside){
      // dabbe ke andar: pehle peechhe ka hissa, phir billi, phir saamne ka rukh
      [126, 186].forEach(function(lx){
        g.appendChild(mk("rect",{x:lx,y:158,width:9,height:20,fill:"var(--crate-deep)"}));
      });
      g.appendChild(mk("rect",{x:118,y:104,width:84,height:56,rx:5,
                               fill:"#e0c79c",stroke:"var(--crate-deep)","stroke-width":3}));
      cat(g, pl.x, pl.y);
      g.appendChild(mk("rect",{x:118,y:130,width:84,height:30,rx:4,
                               fill:"var(--crate)",stroke:"var(--crate-deep)","stroke-width":3}));
      g.appendChild(mk("line",{x1:160,y1:130,x2:160,y2:160,
                               stroke:"var(--crate-deep)","stroke-width":2.5}));
    } else {
      cat(g, pl.x, pl.y); crate(g, 160);         // billi peechhe
    }
    if (pl.p==="near"){
      g.appendChild(mk("line",{x1:206,y1:168,x2:258,y2:168,stroke:"var(--place)",
                               "stroke-width":3,"stroke-dasharray":"5 5"}));
      var t=mk("text",{x:232,y:162,"text-anchor":"middle","font-size":"12","font-weight":"800",
                       fill:"var(--place-deep)","font-family":"Baloo Bhaijaan 2, sans-serif"});
      t.textContent="thora faasla"; g.appendChild(t);
    }
  }

  function band(html, urdu){
    var b=$("band"); b.innerHTML="";
    var e=document.createElement("p"); e.className="en"; e.innerHTML=html; b.appendChild(e);
    if (urdu){ var u=document.createElement("p"); u.className="ur"; u.textContent=urdu; b.appendChild(u); }
  }

  function render(){
    ["Plc","Tst","Tim"].forEach(function(x){
      $("tab"+x).setAttribute("aria-pressed", tab===x.toLowerCase() ? "true":"false");
    });
    var picks=$("picks"), chips=$("chips");
    picks.innerHTML=""; chips.innerHTML="";
    var chip=$("statechip"); chip.className="statechip";

    if (tab==="plc"){
      var pl=PLACES[plcI];
      drawScene(pl);
      $("title").textContent="Billi ko hilayein, aur lafz badalta jayega.";
      $("subtitle").textContent="Preposition wohi lafz hai jo batata hai ke cheez kahan hai.";
      $("panelHead").textContent="Koi lafz dabayein";
      band(pl.s, pl.u);
      chip.textContent=pl.p;
      $("lead").textContent=pl.p;
      $("detail").textContent=pl.note;
      $("rule").innerHTML="Preposition ke baad hamesha koi <b>naam</b> aata hai: in <b>the box</b>, under <b>the table</b>, near <b>the door</b>. Akela preposition kabhi nahin aata.";
      $("whyText").innerHTML = pl.p==="next to" || pl.p==="near"
        ? "In dono ka farq dhyan se dekhein: <b>next to</b> ka matlab bilkul saath, chipka hua. <b>near</b> ka matlab paas, magar thora faasla. Urdu mein dono ke liye aksar \u201cpaas\u201d hi bol dete hain, isi liye bache inhein mila dete hain."
        : "Ek hi billi, ek hi dabba, aur jumla bhi takreeban wohi. <b>Sirf ek lafz badalta hai</b> \u2014 aur poori tasveer badal jati hai. Isi liye preposition chhota sa lafz hokar bhi itna zaroori hai.";
      PLACES.forEach(function(x,i){
        var b=document.createElement("button"); b.type="button"; b.className="schip";
        b.textContent=x.p;
        b.setAttribute("aria-pressed", i===plcI ? "true":"false");
        b.addEventListener("click", function(){ plcI=i; render(); });
        chips.appendChild(b);
      });
      return;
    }

    if (tab==="tst"){
      var t=TEST[tstI], p2=PLACES[t.i];
      drawScene(p2);
      $("title").textContent="Tasveer dekhein aur sahi lafz chunein.";
      $("subtitle").textContent="Ab lafz nahin bataya jayega \u2014 aap ko pehchanna hai.";
      $("panelHead").textContent="Koi tasveer chunein";
      band(tstPick===null
        ? 'The cat is <span class="blank">______</span> the box.'
        : "The cat is <mark>"+p2.p+"</mark> the box.",
        tstPick===null ? "" : p2.u);
      t.opts.forEach(function(o){
        var b=document.createElement("button"); b.type="button"; b.textContent=o;
        if (tstPick!==null)
          b.className = (o===p2.p) ? "good" : (o===tstPick ? "bad":"");
        b.addEventListener("click", function(){
          if (tstPick!==null) return;
          tstPick=o; tstDone[tstI]=true; render();
        });
        picks.appendChild(b);
      });
      if (tstPick===null){
        chip.textContent="Billi kahan hai?";
        $("lead").textContent=""; $("detail").textContent="";
      } else {
        var good = tstPick===p2.p;
        chip.className="statechip " + (good ? "ok":"no");
        chip.textContent = good ? "Bilkul theek" : "Dobara dekhein";
        $("lead").textContent=p2.p;
        $("detail").textContent=p2.note;
      }
      $("rule").innerHTML="Tarkeeb: pehle dekhein billi <b>andar</b> hai, <b>oopar</b>, <b>neeche</b>, ya <b>bagal mein</b>. Us ke baad lafz khud saamne aa jata hai.";
      $("whyText").innerHTML="Preposition ratta lagane se nahin aate. Tasveer dekh kar chunne se aate hain \u2014 kyunki asal zindagi mein bhi aap <b>pehle jagah dekhte hain</b>, phir lafz bolte hain.";
      TEST.forEach(function(x,i){
        var b=document.createElement("button"); b.type="button";
        b.className="schip" + (tstDone[i] ? " done":"");
        b.textContent=String(i+1)+(tstDone[i]?" \u2605":"");
        b.setAttribute("aria-pressed", i===tstI ? "true":"false");
        b.addEventListener("click", function(){ tstI=i; tstPick=null; render(); });
        chips.appendChild(b);
      });
      return;
    }

    // waqt
    var tm=TIME[timI];
    var svg=$("svg"); svg.innerHTML=""; svg.setAttribute("viewBox","0 0 320 200");
    var g=mk("g",{}); svg.appendChild(g);
    var boxes=[["at","nuqta \u2014 theek waqt","8 o'clock, night"],
               ["on","din \u2014 poora ek din","Monday, 14 August"],
               ["in","lamba arsa","January, 2026, morning"]];
    boxes.forEach(function(b,i){
      var on = tm.ans===b[0] && timPick!==null;
      g.appendChild(mk("rect",{x:12+i*102,y:42,width:94,height:116,rx:14,
                               fill: on ? "#ece5f6":"#fff",
                               stroke: on ? "var(--time)":"#c8ccd4","stroke-width": on?4:2.5}));
      var t1=mk("text",{x:59+i*102,y:78,"text-anchor":"middle","font-size":"24","font-weight":"800",
                        fill: on ? "var(--time-deep)":"var(--ink-soft)",
                        "font-family":"Baloo Bhaijaan 2, sans-serif"});
      t1.textContent=b[0]; g.appendChild(t1);
      var t2=mk("text",{x:59+i*102,y:104,"text-anchor":"middle","font-size":"12","font-weight":"800",
                        fill:"var(--ink-soft)","font-family":"Baloo Bhaijaan 2, sans-serif"});
      t2.textContent=b[1]; g.appendChild(t2);
      b[2].split(", ").forEach(function(ex,k){
        var t3=mk("text",{x:59+i*102,y:126+k*17,"text-anchor":"middle","font-size":"12",
                          "font-weight":"700",fill:"#7b8492",
                          "font-family":"Baloo Bhaijaan 2, sans-serif"});
        t3.textContent=ex; g.appendChild(t3);
      });
    });
    $("title").textContent="Waqt ke liye: at, on, ya in?";
    $("subtitle").textContent="Faisla is se hota hai ke waqt ka tukra kitna bara hai.";
    $("panelHead").textContent="Koi jumla chunein";
    band(timPick===null
      ? tm.s.replace("___", '<span class="blank">___</span>')
      : tm.s.replace("___", "<mark>"+tm.ans+"</mark>"), "");
    ["at","on","in"].forEach(function(o){
      var b=document.createElement("button"); b.type="button"; b.textContent=o;
      if (timPick!==null)
        b.className = (o===tm.ans) ? "good" : (o===timPick ? "bad":"");
      b.addEventListener("click", function(){
        if (timPick!==null) return;
        timPick=o; timDone[timI]=true; render();
      });
      picks.appendChild(b);
    });
    if (timPick===null){
      chip.textContent="Kaunsa lagega?";
      $("lead").textContent=""; $("detail").textContent="";
    } else {
      var ok2 = timPick===tm.ans;
      chip.className="statechip " + (ok2 ? "ok":"no");
      chip.textContent = ok2 ? "Bilkul theek" : "Dobara dekhein";
      $("lead").textContent=tm.ans;
      $("detail").textContent=tm.u;
    }
    $("rule").innerHTML="Waqt ka tukra jitna chhota, lafz utna chhota: <b>at</b> = ek nuqta, <b>on</b> = ek din, <b>in</b> = lamba arsa.";
    $("whyText").innerHTML="Yeh tarteeb yaad rakhne mein madad karti hai \u2014 chhote se bare ki taraf: <b>at 8 o'clock \u2192 on Monday \u2192 in January \u2192 in 2026</b>. Magar <b>at night</b> ek istisna hai, jo qaide se nahin nikalta.";
    TIME.forEach(function(x,i){
      var b=document.createElement("button"); b.type="button";
      b.className="schip" + (timDone[i] ? " done":"");
      b.textContent=String(i+1)+(timDone[i]?" \u2605":"");
      b.setAttribute("aria-pressed", i===timI ? "true":"false");
      b.addEventListener("click", function(){ timI=i; timPick=null; render(); });
      chips.appendChild(b);
    });
  }

  ["Plc","Tst","Tim"].forEach(function(x){
    $("tab"+x).addEventListener("click", function(){
      var m=x.toLowerCase();
      if (tab===m) return;
      tab=m; tstPick=null; timPick=null; render();
    });
  });

  var QUIZ=[
    { q:"Billi dabbe ke andar hai. Kaunsa lafz aayega?",
      o:["on","in","under","near"], a:1,
      f:"in = andar. Dabbe, kamre, paani \u2014 kisi cheez ke andar hone par hamesha in." },
    { q:"next to aur near mein kya farq hai?",
      o:["Koi farq nahin","next to = bilkul saath, near = paas magar thora faasla","near sirf logon ke liye","next to sirf dabbon ke liye"],
      a:1,
      f:"Urdu mein dono ke liye aksar \u201cpaas\u201d bol dete hain, isi liye bache inhein mila dete hain. English mein farq faasle ka hai." },
    { q:"\u201cThe cat is ___ the two boxes.\u201d",
      o:["between","among","behind","in"], a:0,
      f:"between = do cheezon ke darmiyan. Do se zyada hon to among aata hai." },
    { q:"\u201cSchool starts ___ 8 o'clock.\u201d",
      o:["in","on","at","for"], a:2,
      f:"Gharri ka theek waqt bataya ja raha hai \u2014 ek nuqta. Aise mauqe par hamesha at." },
    { q:"\u201cMy birthday is ___ 14 August.\u201d",
      o:["at","on","in","to"], a:1,
      f:"Tareekh bhi ek din hoti hai, aur har din par on lagta hai: on Monday, on 14 August." },
    { q:"\u201cIt is very cold ___ January.\u201d",
      o:["at","on","in","by"], a:2,
      f:"Mahina ek lamba arsa hai. Mahine, saal aur mausam par in: in January, in 2026, in winter." },
    { q:"Waqt walay teenon lafz tarteeb se kaise yaad rakhein?",
      o:["Alphabet ke hisaab se","Waqt ka tukra chhote se bara: at, on, in","Ratta laga kar","Koi tarteeb nahin"],
      a:1,
      f:"at 8 o'clock \u2192 on Monday \u2192 in January \u2192 in 2026. Tukra jitna bara, lafz utna \u201cwide\u201d." },
    { q:"\u201cI sleep early ___ night.\u201d \u2014 aur yeh qaide par poora nahin utarta. Kyun?",
      o:["Kyunki raat chhoti hoti hai","Kyunki yeh ek istisna hai jo yaad rakhna parta hai","Kyunki raat mein sona mana hai","Kyunki night ek din hai"],
      a:1,
      f:"\u201cin the morning\u201d hota hai magar \u201cat night\u201d. Har zaban mein kuch cheezein qaide se nahin nikaltin \u2014 unhein sun sun kar yaad karna parta hai." }
  ];

  function buildQuiz(){
    var box=$("quizBox"); box.innerHTML="";
    QUIZ.forEach(function(item){
      var wrap=document.createElement("div"); wrap.className="q";
      var q=document.createElement("p"); q.textContent=item.q; wrap.appendChild(q);
      var fb=document.createElement("p"); fb.className="fb";
      item.o.forEach(function(opt,oi){
        var b=document.createElement("button"); b.type="button"; b.className="opt";
        b.textContent=opt;
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done")==="1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x,xi){
            if (xi===item.a) x.classList.add("right");
            else if (xi===oi) x.classList.add("wrong");
          });
          fb.textContent=item.f; fb.classList.add("show");
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb); box.appendChild(wrap);
    });
  }

  buildQuiz();
  render();
})();
</script>
</body>
</html>
