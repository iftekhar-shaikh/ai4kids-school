function award(key,n){if(awarded[key])return;awarded[key]=true;stars+=(n||1);$("starCount").textContent=String(stars)}

function markWin(prefix,id,doneMap,modeKey,total){if(doneMap[id])return;doneMap[id]=true;award(prefix+"-"+id,1);if(Object.keys(doneMap).length>=total){doneModes[modeKey]=true;award("mode-"+modeKey,2)}tabBadges()}
function skyHTML(){return '<div class="sky-layer"><div class="sun-ball"></div><div class="cloud c1"></div><div class="cloud c2"></div></div>'}
function prepScene(){var pad=$("scenePad");pad.innerHTML=skyHTML();var stage=document.createElement("div");stage.className="num-stage";pad.appendChild(stage);return stage}

function showStep(i,n){setText($("statechip"),(i+1)+" / "+n);$("statechip").className="statechip"+(lang==="ur"?" ur":"")}
function showWin(msg){setText($("headline"),msg);$("statechip").className="statechip win"+(lang==="ur"?" ur":"");setText($("statechip"),t(T.nice))}
function showMiss(){setText($("headline"),t(T.oops));$("statechip").className="statechip miss"+(lang==="ur"?" ur":"");setText($("statechip"),t(T.oops))}
function stableOrder(key,arr){if(optKey!==key){optKey=key;optOrder=shuffle(arr)}return optOrder}
function clearHint(){$("hintbox").classList.remove("show")}
function makeFracEl(n,d){var w=document.createElement("span");w.className="frac-bar";w.setAttribute("dir","ltr");var tn=document.createElement("span");tn.className="n";tn.textContent=String(n);var line=document.createElement("span");line.className="line";var td=document.createElement("span");td.className="d";td.textContent=String(d);w.appendChild(tn);w.appendChild(line);w.appendChild(td);return w}
function addPie(stage,n,d){var pie=document.createElement("div");pie.className="pie";var i,max=Math.min(d,12);for(i=0;i<max;i++){var s=document.createElement("span");if(i<n)s.className="on";pie.appendChild(s)}stage.appendChild(pie)}
function addShowFrac(stage,ch){
  if(ch.kind==="mixed"||ch.w!=null){
    var m=document.createElement("div");m.className="mixed-hero";
    var w=document.createElement("span");w.textContent=String(ch.w);m.appendChild(w);
    m.appendChild(makeFracEl(ch.n,ch.d));stage.appendChild(m);
  }else{
    var nn=ch.n,dd=ch.d;
    if((nn==null||dd==null)&&ch.show){var parts=String(ch.show).split("/");nn=+parts[0];dd=+parts[1]}
    var h=document.createElement("div");h.className="frac-hero";h.setAttribute("dir","ltr");
    h.appendChild(makeFracEl(nn,dd));stage.appendChild(h);
    if(dd&&dd<=12)addPie(stage,Math.min(nn,dd),dd);
  }
}
function addEqLine(stage,eq){
  var el=document.createElement("div");el.className="eqline";el.setAttribute("dir","ltr");el.textContent=eq;stage.appendChild(el);
}

function renderSort(){
  var ch=SORT[sortIdx],stage=prepScene();addBlurb(stage,ch);addShowFrac(stage,ch);
  addCap(stage,lang==="en"?"Compare top and bottom. Mixed has a whole.":"اوپر اور نیچے دیکھو۔ مختلط میں پورا ہوتا ہے۔");
  showStep(sortIdx,SORT.length);setText($("headline"),t(ch.title));
  setText($("detail"),sortDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(sortDone[ch.id])showWin(t(ch.done));
  var box=$("actionBox");box.innerHTML="";
  var choices=document.createElement("div");choices.className="save-choices";
  stableOrder("sort-"+ch.id,TYPES.slice()).forEach(function(tp){
    var b=document.createElement("button");b.type="button";setText(b,t(tp));
    if(sortDone[ch.id]&&tp.id===ch.kind)b.classList.add("right");b.disabled=!!sortDone[ch.id];
    b.addEventListener("click",function(){if(sortDone[ch.id])return;if(tp.id===ch.kind){markWin("sort",ch.id,sortDone,"sort",SORT.length);renderSort()}else{b.classList.add("wrong");showMiss()}});
    choices.appendChild(b);
  });
  box.appendChild(choices);
  setText($("prog"),t(T.progSort)+": "+Object.keys(sortDone).length+"/"+SORT.length);
}

function renderOps(){
  var ch=OPS[opsIdx],stage=prepScene();addBlurb(stage,ch);addEqLine(stage,ch.eq);
  addCap(stage,lang==="en"?"Pick the correct answer. Like = same bottom.":"صحیح جواب چنو۔ ہم جنس = ایک جیسا نیچے۔");
  showStep(opsIdx,OPS.length);setText($("headline"),t(ch.title));
  setText($("detail"),opsDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(opsDone[ch.id])showWin(t(ch.done));
  var box=$("actionBox");box.innerHTML="";
  var choices=document.createElement("div");choices.className="save-choices";
  var indexed=ch.opts.map(function(o,i){return{o:o,i:i}});
  stableOrder("ops-"+ch.id,indexed).forEach(function(item){
    var b=document.createElement("button");b.type="button";b.className="numc";b.textContent=item.o;b.setAttribute("dir","ltr");
    if(opsDone[ch.id]&&item.i===ch.correct)b.classList.add("right");b.disabled=!!opsDone[ch.id];
    b.addEventListener("click",function(){if(opsDone[ch.id])return;if(item.i===ch.correct){markWin("ops",ch.id,opsDone,"ops",OPS.length);renderOps()}else{b.classList.add("wrong");showMiss()}});
    choices.appendChild(b);
  });
  box.appendChild(choices);
  setText($("prog"),t(T.progOps)+": "+Object.keys(opsDone).length+"/"+OPS.length);
}

function renderDiv(){
  var ch=DIV[divIdx],stage=prepScene();addBlurb(stage,ch);addEqLine(stage,ch.eq);
  addCap(stage,lang==="en"?"Only ÷ by a whole. Keep top, grow the bottom.":"صرف پورے سے ÷۔ اوپر رکھو، نیچے بڑا کرو۔");
  showStep(divIdx,DIV.length);setText($("headline"),t(ch.title));
  setText($("detail"),divDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(divDone[ch.id])showWin(t(ch.done));
  var box=$("actionBox");box.innerHTML="";
  var choices=document.createElement("div");choices.className="save-choices";
  var indexed=ch.opts.map(function(o,i){return{o:o,i:i}});
  stableOrder("div-"+ch.id,indexed).forEach(function(item){
    var b=document.createElement("button");b.type="button";b.className="numc";b.textContent=item.o;b.setAttribute("dir","ltr");
    if(divDone[ch.id]&&item.i===ch.correct)b.classList.add("right");b.disabled=!!divDone[ch.id];
    b.addEventListener("click",function(){if(divDone[ch.id])return;if(item.i===ch.correct){markWin("div",ch.id,divDone,"div",DIV.length);renderDiv()}else{b.classList.add("wrong");showMiss()}});
    choices.appendChild(b);
  });
  box.appendChild(choices);
  setText($("prog"),t(T.progDiv)+": "+Object.keys(divDone).length+"/"+DIV.length);
}

function pickQuiz(){
  var pin=[],rest=[],i;quizState={};
  for(i=0;i<QUIZ.length;i++){if(QUIZ[i].pin)pin.push(QUIZ[i]);else rest.push(QUIZ[i])}
  rest=shuffle(rest);quizSet=shuffle(pin.concat(rest.slice(0,5-pin.length)));
}
function renderQuiz(){
  var box=$("quizBox");box.innerHTML="";
  quizSet.forEach(function(item,qi){
    var wrap=document.createElement("div");wrap.className="q";
    var p=document.createElement("p");setText(p,(qi+1)+". "+t(item.q));wrap.appendChild(p);
    if(lang==="en"&&item.ru){var g=document.createElement("p");g.className="gloss";g.textContent=item.ru;wrap.appendChild(g)}
    var st=quizState[item.id];
    item.opts.forEach(function(opt,oi){
      var b=document.createElement("button");b.type="button";b.className="opt"+(lang==="ur"?" ur":"");setText(b,t(opt));
      if(st&&oi===item.correct)b.classList.add("right");
      if(st==="no"&&quizState[item.id+"-pick"]===oi&&oi!==item.correct)b.classList.add("wrong");
      if(st)b.disabled=true;
      b.addEventListener("click",function(){
        if(quizState[item.id])return;
        quizState[item.id+"-pick"]=oi;
        if(oi===item.correct){quizState[item.id]="ok";b.classList.add("right");award("quiz-"+item.id,1)}
        else{quizState[item.id]="no";b.classList.add("wrong");var kids=wrap.querySelectorAll(".opt");if(kids[item.correct])kids[item.correct].classList.add("right")}
        fb.classList.add("show");
        var all=wrap.querySelectorAll(".opt"),k;for(k=0;k<all.length;k++)all[k].disabled=true;
      });
      wrap.appendChild(b);
    });
    var fb=document.createElement("p");fb.className="fb"+(st?" show":"");setText(fb,t(item.why));wrap.appendChild(fb);
    box.appendChild(wrap);
  });
}
function storyHtml(){if(mode==="sort")return t(T.storySort);if(mode==="ops")return t(T.storyOps);return t(T.storyDiv)}
function currentTip(){if(mode==="sort")return T.tipSort;if(mode==="ops")return T.tipOps;return T.tipDiv}
function tabBadges(){
  function lab(btn,label,key){btn.innerHTML="";var span=document.createElement("span");setText(span,t(label));btn.appendChild(span);if(doneModes[key]){var b=document.createElement("span");b.className="badge";b.textContent=" ★";btn.appendChild(b)}}
  lab($("tabSort"),T.tabSort,"sort");lab($("tabOps"),T.tabOps,"ops");lab($("tabDiv"),T.tabDiv,"div");
  $("tabSort").setAttribute("aria-pressed",mode==="sort"?"true":"false");
  $("tabOps").setAttribute("aria-pressed",mode==="ops"?"true":"false");
  $("tabDiv").setAttribute("aria-pressed",mode==="div"?"true":"false");
}
function renderCurrent(){if(mode==="sort")renderSort();else if(mode==="ops")renderOps();else renderDiv()}
function setMode(m){mode=m;optKey="";renderCurrent();applyChrome()}
function applyChrome(){
  setText($("title"),t(T.title));setText($("subtitle"),t(T.sub));
  $("story").innerHTML=storyHtml();$("story").classList.toggle("ur",lang==="ur");$("story").setAttribute("dir",lang==="ur"?"rtl":"ltr");
  setText($("ctlHead"),t(T.ctl));setText($("nextBtn"),t(T.next));setText($("hintBtn"),t(T.hint));setText($("resetBtn"),t(T.reset));
  setText($("quizHead"),t(T.quiz));setText($("newQuiz"),t(T.newQuiz));
  $("langBtn").textContent=(lang==="en")?"اردو":"EN";$("langBtn").setAttribute("aria-pressed",lang==="ur"?"true":"false");
  document.body.classList.toggle("urdu",lang==="ur");
  document.documentElement.lang=(lang==="ur")?"ur":"en";
  document.documentElement.dir=(lang==="ur")?"rtl":"ltr";
  document.title=t(T.title)+" | AI4Kids Class 4";
  tabBadges();
  var foot=document.querySelector("footer p");
  if(foot)setText(foot,foot.getAttribute(lang==="ur"?"data-ur":"data-en"));
}
function applyLang(){applyChrome();renderCurrent();renderQuiz()}
function next(){
  optKey="";
  if(mode==="sort"){sortIdx=(sortIdx+1)%SORT.length;renderSort()}
  else if(mode==="ops"){opsIdx=(opsIdx+1)%OPS.length;renderOps()}
  else{divIdx=(divIdx+1)%DIV.length;renderDiv()}
}
function showHint(){
  var h=mode==="sort"?SORT[sortIdx].hint:(mode==="ops"?OPS[opsIdx].hint:DIV[divIdx].hint);
  var hb=$("hintbox");setText(hb,t(h));hb.classList.add("show");
}
function resetMode(){
  if(mode==="sort"){Object.keys(awarded).forEach(function(k){if(k.indexOf("sort-")===0||k==="mode-sort")delete awarded[k]});sortDone={};sortIdx=0;doneModes.sort=false;recountStars();renderSort()}
  else if(mode==="ops"){Object.keys(awarded).forEach(function(k){if(k.indexOf("ops-")===0||k==="mode-ops")delete awarded[k]});opsDone={};opsIdx=0;doneModes.ops=false;recountStars();renderOps()}
  else{Object.keys(awarded).forEach(function(k){if(k.indexOf("div-")===0||k==="mode-div")delete awarded[k]});divDone={};divIdx=0;doneModes.div=false;recountStars();renderDiv()}
  optKey="";tabBadges();applyChrome();
}
function cleanSpeakText(s){return String(s||"").replace(/<[^>]+>/g," ").replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&amp;/g,"&").replace(/\s+/g," ").trim()}
function buildSpeakText(){
  var bits=[];bits.push(t(T.title));bits.push(cleanSpeakText(storyHtml()));
  bits.push(cleanSpeakText(($("headline")&&$("headline").textContent)||""));
  bits.push(cleanSpeakText(($("detail")&&$("detail").textContent)||""));
  bits.push(t(currentTip()));return bits.filter(Boolean).join(". ");
}
function pickVoice(voices,want){
  var i,v,L;for(i=0;i<voices.length;i++){v=voices[i];L=(v.lang||"").toLowerCase().replace("_","-");if(L.indexOf(want)===0)return v}
  for(i=0;i<voices.length;i++){v=voices[i];L=(v.lang||"").toLowerCase().replace("_","-");if(L.indexOf("en")===0)return v}
  return voices[0]||null;
}
function setSpeaking(on){var btn=$("speakBtn");if(!btn)return;btn.setAttribute("aria-pressed",on?"true":"false");btn.style.opacity=on?"0.65":""}
function doSpeak(text,asLang){
  var u=new SpeechSynthesisUtterance(text);u.rate=0.82;var __v=window.ai4kidsPickVoice&&ai4kidsPickVoice();if(__v){u.voice=__v;u.lang=((__v.lang||'').toLowerCase().indexOf('ur')===0)?'ur-PK':'hi-IN';}else{u.lang='hi-IN';}u.rate=.82;
  var voices=window.speechSynthesis.getVoices()||[];var voice=pickVoice(voices,asLang==="ur"?"ur":"en");if(voice)u.voice=voice;
  u.onstart=function(){setSpeaking(true)};u.onend=function(){setSpeaking(false)};
  u.onerror=function(){setSpeaking(false);if(asLang==="ur"){var fallback=cleanSpeakText(T.title.en+". "+T.storySort.en+". "+T.tipSort.en);var u2=new SpeechSynthesisUtterance(fallback);u2.lang='hi-IN';u2.rate=0.92;var v2=pickVoice(window.speechSynthesis.getVoices()||[],"en");if(v2)u2.voice=v2;u2.onstart=function(){setSpeaking(true)};u2.onend=u2.onerror=function(){setSpeaking(false)};window.speechSynthesis.speak(u2)}};
  window.speechSynthesis.speak(u);
}
if("speechSynthesis" in window){
  try{window.speechSynthesis.getVoices()}catch(e0){}
  if(typeof window.speechSynthesis.addEventListener==="function"){window.speechSynthesis.addEventListener("voiceschanged",function(){try{window.speechSynthesis.getVoices()}catch(e1){}})}
}else{var noBtn=$("speakBtn");if(noBtn){noBtn.disabled=true;noBtn.title="Voice not available on this device"}}
$("langBtn").addEventListener("click",function(){lang=(lang==="en")?"ur":"en";applyLang()});
$("tabSort").addEventListener("click",function(){setMode("sort")});
$("tabOps").addEventListener("click",function(){setMode("ops")});
$("tabDiv").addEventListener("click",function(){setMode("div")});
$("nextBtn").addEventListener("click",next);
$("hintBtn").addEventListener("click",showHint);
$("resetBtn").addEventListener("click",resetMode);
$("newQuiz").addEventListener("click",function(){pickQuiz();renderQuiz()});
$("speakBtn").addEventListener("click",function(){
  try{
    if(!("speechSynthesis" in window))return;
    var text=buildSpeakText();if(!text)return;
    if(speakTimer){clearTimeout(speakTimer);speakTimer=null}
    window.speechSynthesis.cancel();setSpeaking(false);
    var speakLang=lang;
    speakTimer=setTimeout(function(){speakTimer=null;doSpeak(text,speakLang)},80);
  }catch(e){setSpeaking(false)}
});
pickQuiz();applyLang();
})();
</script>
<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
