  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}

    margin-top:-18px;position:relative;z-index:2;background:var(--paper);

  }

  .statechip.ur{padding:2px 14px 7px}
  .statechip.win{background:var(--ok)}
  .statechip.miss{background:var(--left)}
  .statechip.fire{background:var(--fire)}
  .headline{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .headline.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
  .hintbox{
    margin-top:14px;border:2px solid var(--a);background:#f0eaf8;border-radius:14px;
    padding:11px 14px;font-size:var(--fs-xs);color:var(--a);font-weight:700;line-height:1.55;

  .panel{margin-top:22px}

  .prog{margin:0 0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft)}

    border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);

    padding:8px 14px;flex:1;

  .btns .yes{border-color:var(--ok);color:var(--ok)}
  .btns .no{border-color:var(--left);color:var(--left)}

  .btns button:disabled{opacity:.4;cursor:default}

  }
  .sig:disabled{opacity:.4}

    border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;
    font-size:36px;color:#fff;font-weight:800;position:relative;z-index:2;
    transition:box-shadow .25s, transform .2s, background .25s;
  }

    box-shadow:0 0 0 8px rgba(232,93,76,.35),0 0 28px rgba(232,93,76,.55);
    transform:scale(1.08);
  }
  .axon{
    width:6px;height:48px;margin:0 auto;background:var(--line);border-radius:4px;
    transition:background .25s, box-shadow .25s;
  }
  .axon.lit{background:var(--fire);box-shadow:0 0 12px var(--fire)}
  .thresh-bar{
    height:14px;background:#fff;border:2px solid var(--ink);border-radius:999px;
    overflow:hidden;margin:10px auto 0;max-width:220px;
  }
  .thresh-fill{height:100%;width:0%;background:var(--a);transition:width .2s,background .2s}
  .thresh-fill.ready{background:var(--fire)}
  .net-svg{width:100%;height:200px;display:block}
  .net-node{
    cursor:pointer;stroke:var(--ink);stroke-width:3;
  }
  .net-node.picked{stroke:var(--gold);stroke-width:4}
  .net-node.on{fill:#7a5aa8}

    border:2px solid var(--ink);background:var(--paper);border-radius:12px;
    padding:10px 12px;font:inherit;font-weight:800;font-size:var(--fs-cap);

  .qhead h2{font-size:var(--fs-lg);font-weight:800;margin:0;flex:1}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--left);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}
  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}
  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;
      grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar"
        "head  head"
        "tabs  tabs"

        "left  right"
        "quiz  quiz"

  ];

  var meet = {act:0, threshold:4, fires:0, fired:false};
  var link = {picked:null, done:{}, selected:[]};
  var train = {idx:0, weights:{fruit:1, ball:1}, correct:0, answered:false};
  var quizSet = [];

  function award(key, n){
    if (awarded[key]) return;
    awarded[key] = true;
    stars += (n || 1);
    $("starCount").textContent = String(stars);
  }

  function storyHtml(){
    var s = mode === "meet" ? T.storyMeet : mode === "link" ? T.storyLink : T.storyTrain;
    return t(s);
  }

  function shuffle(arr){
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--){
      j = Math.floor(Math.random() * (i + 1));
      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  /* ---------- MEET A NEURON ---------- */
  function renderMeet(){
    var pad = $("scenePad");
    pad.innerHTML = "";
    var stage = document.createElement("div");
    stage.className = "neuron-stage";
    var pct = Math.min(100, Math.round((meet.act / meet.threshold) * 100));
    var ready = meet.act >= meet.threshold;
    stage.innerHTML =
      '<div class="neuron-body' + (meet.fired ? " hot" : "") + '" id="nBody">⚡</div>' +
      '<div class="axon' + (meet.fired ? " lit" : "") + '" id="nAxon"></div>' +
      '<div class="thresh-bar"><div class="thresh-fill' + (ready ? " ready" : "") + '" style="width:' + pct + '%"></div></div>' +
      '<div class="sig-row" id="sigRow"></div>';
    pad.appendChild(stage);

    var row = $("sigRow");
    SIGNALS.forEach(function(s, i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "sig";
      b.disabled = meet.fired;
      b.textContent = s.emoji + " " + t(s.label);
      if (lang === "ur"){ b.classList.add("ur"); b.setAttribute("dir","rtl"); }
      b.addEventListener("click", function(){ addSignal(s.w); });
      row.appendChild(b);
    });

    setText($("statechip"), meet.fired ? t(T.fired) : t(T.waiting));
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (meet.fired ? " fire" : "");
    setText($("headline"), t(T.tapSignals));
    setText($("detail"), t(T.threshold) + " · " + meet.act + "/" + meet.threshold);
    $("hintbox").classList.remove("show");
    $("actionBox").innerHTML = "";
    updateProg();
  }

  function addSignal(w){
    if (meet.fired) return;
    meet.act += w;
    if (meet.act >= meet.threshold){
      meet.fired = true;
      meet.fires += 1;
      award("meet-fire-" + meet.fires, 1);
      doneModes.meet = true;
      setText($("statechip"), t(T.fired));
      $("statechip").className = "statechip fire" + (lang==="ur"?" ur":"");
    }
    renderMeet();
    tabBadges();
  }

  /* ---------- CONNECT THE NET ---------- */
  var NODE_POS = {
    I1:{x:40,y:50,lab:{en:"In 1",ur:"ان ۱"}},
    I2:{x:40,y:150,lab:{en:"In 2",ur:"ان ۲"}},
    H1:{x:160,y:50,lab:{en:"Hid 1",ur:"پوش ۱"}},
    H2:{x:160,y:150,lab:{en:"Hid 2",ur:"پوش ۲"}},
    O:{x:280,y:100,lab:{en:"Out",ur:"آؤٹ"}}
  };

  function linkKey(a,b){
    var pair = [a,b].sort();
    return pair[0] + "-" + pair[1];
  }

  function isNeeded(a,b){
    return NEED_LINKS.some(function(L){
      return (L.from===a && L.to===b) || (L.from===b && L.to===a);
    });
  }

  function renderLink(){
    var pad = $("scenePad");
    pad.innerHTML = "";
    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 320 200");
    svg.classList.add("net-svg");

    // draw done links
    NEED_LINKS.forEach(function(L){
      var k = linkKey(L.from, L.to);
      if (!link.done[k]) return;
      var p1 = NODE_POS[L.from], p2 = NODE_POS[L.to];
      var line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", p1.x); line.setAttribute("y1", p1.y);
      line.setAttribute("x2", p2.x); line.setAttribute("y2", p2.y);
      line.setAttribute("stroke", "#2e7d4f");
      line.setAttribute("stroke-width", "5");
      line.setAttribute("stroke-linecap", "round");
      svg.appendChild(line);
    });

    Object.keys(NODE_POS).forEach(function(id){
      var p = NODE_POS[id];
      var g = document.createElementNS(svgNS, "g");
      g.style.cursor = "pointer";
      var c = document.createElementNS(svgNS, "circle");
      c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 22);
      c.setAttribute("fill", link.selected.indexOf(id) >= 0 ? "#e8b23d" : "#7a5aa8");
      c.setAttribute("stroke", "#1e2a36");
      c.setAttribute("stroke-width", link.selected.indexOf(id) >= 0 ? "4" : "3");
      var tx = document.createElementNS(svgNS, "text");
      tx.setAttribute("x", p.x); tx.setAttribute("y", p.y + 5);
      tx.setAttribute("text-anchor", "middle");
      tx.setAttribute("fill", "#fff");
      tx.setAttribute("font-size", "11");
      tx.setAttribute("font-weight", "800");
      tx.setAttribute("font-family", "Baloo Bhaijaan 2,sans-serif");
      tx.textContent = t(p.lab);
      g.appendChild(c); g.appendChild(tx);
      g.addEventListener("click", function(){ pickNode(id); });
      svg.appendChild(g);
    });

    pad.appendChild(svg);

    var doneCount = Object.keys(link.done).length;
    var all = NEED_LINKS.length;
    setText($("statechip"), doneCount >= all ? t(T.linkOk) : t(T.linkNeed));
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (doneCount >= all ? " win" : "");
    setText($("headline"), t(T.linkNeed));
    setText($("detail"), t(T.tip));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "link-btn" + (doneCount >= all ? " done" : "");
    btn.textContent = t(T.connect) + " (" + doneCount + "/" + all + ")";
    if (lang === "ur"){ btn.classList.add("ur"); btn.setAttribute("dir","rtl"); }
    btn.disabled = link.selected.length !== 2;
    btn.addEventListener("click", tryConnect);
    box.appendChild(btn);

    if (doneCount >= all){
      doneModes.link = true;
      award("link-all", 2);
    }
    updateProg();
    tabBadges();
  }

  function pickNode(id){
    var i = link.selected.indexOf(id);
    if (i >= 0){
      link.selected.splice(i, 1);
    } else {
      if (link.selected.length >= 2) link.selected.shift();
      link.selected.push(id);
    }
    renderLink();
  }

  function tryConnect(){
    if (link.selected.length !== 2) return;
    var a = link.selected[0], b = link.selected[1];
    var k = linkKey(a, b);
    if (!isNeeded(a, b)){
      setText($("detail"), lang==="en"
        ? "Those two do not need a direct link. Try input→hidden or hidden→output."
        : "ان دو کا براہِ راست لنک نہیں۔ ان پٹ→پوشیدہ یا پوشیدہ→آؤٹ پٹ آزماؤ۔");
      $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
      link.selected = [];
      renderLink();
      return;
    }
    if (!link.done[k]){
      link.done[k] = true;
      award("link-" + k, 1);
    }
    link.selected = [];
    renderLink();
  }

  /* ---------- TRAIN ---------- */
  function renderTrain(){
    var ex = TRAIN_EX[train.idx % TRAIN_EX.length];
    var pad = $("scenePad");
    pad.innerHTML = "";
    var card = document.createElement("div");
    card.className = "ex-card";
    card.innerHTML =
      '<div class="ex-emoji">' + ex.emoji + '</div>' +
      '<p class="photo-label" id="exName"></p>' +
      '<div class="weight-row" id="wRow"></div>';
    pad.appendChild(card);
    setText($("exName"), t(ex.label));

    var wr = $("wRow");
    ["fruit","ball"].forEach(function(k){
      var chip = document.createElement("span");
      chip.className = "wchip" + (train.weights[k] >= 3 ? " strong" : "");
      chip.textContent = t(T[k]) + " ×" + train.weights[k];
      if (lang === "ur"){ chip.classList.add("ur"); chip.setAttribute("dir","rtl"); }
      wr.appendChild(chip);
    });

    // mini net viz
    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 280 90");
    svg.style.width = "100%";
    svg.style.height = "90px";
    svg.style.display = "block";
    svg.style.marginTop = "8px";
    var wf = Math.min(8, 2 + train.weights.fruit);
    var wb = Math.min(8, 2 + train.weights.ball);
    [["40","45","140","30",wf,"#2e7d4f"],["40","45","140","60",wb,"#c9702e"],
     ["140","30","240","45",wf,"#2e7d4f"],["140","60","240","45",wb,"#c9702e"]].forEach(function(L){
      var line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", L[0]); line.setAttribute("y1", L[1]);
      line.setAttribute("x2", L[2]); line.setAttribute("y2", L[3]);
      line.setAttribute("stroke", L[5]);
      line.setAttribute("stroke-width", String(L[4]));
      line.setAttribute("stroke-linecap", "round");
      line.setAttribute("opacity", "0.85");
      svg.appendChild(line);
    });
    [[40,45,"👁️"],[140,30,"F"],[140,60,"B"],[240,45,"✓"]].forEach(function(n){
      var c = document.createElementNS(svgNS, "circle");
      c.setAttribute("cx", n[0]); c.setAttribute("cy", n[1]); c.setAttribute("r", 16);
      c.setAttribute("fill", "#5b4a8f"); c.setAttribute("stroke", "#1e2a36"); c.setAttribute("stroke-width", "2");
      svg.appendChild(c);
      var tx = document.createElementNS(svgNS, "text");
      tx.setAttribute("x", n[0]); tx.setAttribute("y", n[1] + 5);
      tx.setAttribute("text-anchor", "middle"); tx.setAttribute("fill", "#fff");
      tx.setAttribute("font-size", "12"); tx.setAttribute("font-weight", "800");
      tx.textContent = n[2];
      svg.appendChild(tx);
    });
    pad.appendChild(svg);

    var done = train.correct >= 4;
    setText($("statechip"), done ? t(T.trainDone) : (train.answered ? t(T.trainOk) : t(T.trainAsk)));
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (done ? " win" : "");
    setText($("headline"), t(T.trainAsk));
    setText($("detail"), t(T.tip));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    if (!train.answered && !done){
      ["fruit","ball"].forEach(function(ans){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "link-btn";
        b.style.margin = "4px";
        b.textContent = (ans === "fruit" ? "🍎 " : "⚽ ") + t(T[ans]);
        if (lang === "ur"){ b.classList.add("ur"); b.setAttribute("dir","rtl"); }
        b.addEventListener("click", function(){ answerTrain(ans); });
        box.appendChild(b);
      });
    }

    if (done){
      doneModes.train = true;
      award("train-done", 2);
    }
    updateProg();
    tabBadges();
  }

  function answerTrain(ans){
    if (train.answered) return;
    var ex = TRAIN_EX[train.idx % TRAIN_EX.length];
    train.answered = true;
    if (ans === ex.ans){
      train.weights[ans] = Math.min(5, train.weights[ans] + 1);
      train.correct += 1;
      award("train-" + train.idx, 1);
      setText($("statechip"), t(T.trainOk));
      $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
    } else {
      setText($("statechip"), t(T.trainMiss));
      $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
      setText($("detail"), lang==="en"
        ? ("This was a " + t(T[ex.ans]) + ". Wrong guess — link stays soft.")
        : ("یہ " + t(T[ex.ans]) + " تھا۔ غلط — لنک نرم رہا۔"));
    }
    renderTrain();
  }

  /* ---------- shared UI ---------- */
  function updateProg(){
    var el = $("prog");
    if (mode === "meet"){
      setText(el, t(T.progMeet) + ": " + meet.fires);
    } else if (mode === "link"){
      setText(el, t(T.progLink) + ": " + Object.keys(link.done).length + "/" + NEED_LINKS.length);
    } else {
      setText(el, t(T.progTrain) + ": " + train.correct + "/4");
    }
  }

  function tabBadges(){
    function label(btn, base, key){
      var s = t(base);
      if (doneModes[key]) s += " ★";
      btn.innerHTML = "";
      var span = document.createElement("span");
      span.textContent = s;
      if (lang === "ur"){ span.className = "ur"; span.setAttribute("dir","rtl"); }
      btn.appendChild(span);
    }
    label($("tabMeet"), T.tabMeet, "meet");
    label($("tabLink"), T.tabLink, "link");
    label($("tabTrain"), T.tabTrain, "train");
  }

  function setMode(m){
    mode = m;
    $("tabMeet").setAttribute("aria-pressed", m === "meet" ? "true" : "false");
    $("tabLink").setAttribute("aria-pressed", m === "link" ? "true" : "false");
    $("tabTrain").setAttribute("aria-pressed", m === "train" ? "true" : "false");
    var story = $("story");
    story.innerHTML = storyHtml();
    story.classList.toggle("ur", lang === "ur");
    story.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
    $("nextBtn").textContent = t(T.next);
    if (m === "meet") renderMeet();
    else if (m === "link") renderLink();
    else renderTrain();
    tabBadges();
  }

  function next(){
    if (mode === "meet"){
      meet.act = 0; meet.fired = false;
      renderMeet();
    } else if (mode === "link"){
      link.selected = [];
      renderLink();
    } else {
      train.idx = (train.idx + 1) % TRAIN_EX.length;
      train.answered = false;
      renderTrain();
    }
  }

  function resetMode(){
    if (mode === "meet"){
      meet = {act:0, threshold:4, fires:0, fired:false};
      renderMeet();
    } else if (mode === "link"){
      link = {picked:null, done:{}, selected:[]};
      // clear awards for links so stars don't re-award wrongly — leave awarded as-is
      renderLink();
    } else {
      train = {idx:0, weights:{fruit:1, ball:1}, correct:0, answered:false};
      renderTrain();
    }
    tabBadges();
  }

  function showHint(){
    var hb = $("hintbox");
    var msg;
    if (mode === "meet"){
      msg = lang === "en"
        ? "Each tap adds energy. Think (+2) helps faster. Fill the bar to fire!"
        : "ہر ٹیپ توانائی بڑھاتی ہے۔ سوچو (+2) تیز مدد کرتا ہے۔ بار بھرو تو فائر!";
    } else if (mode === "link"){
      msg = lang === "en"
        ? "Connect: In1→Hid1, In2→Hid1, In1→Hid2, Hid1→Out, Hid2→Out."
        : "جوڑو: ان۱→پوش۱، ان۲→پوش۱، ان۱→پوش۲، پوش۱→آؤٹ، پوش۲→آؤٹ۔";
    } else {
      var ex = TRAIN_EX[train.idx % TRAIN_EX.length];
      msg = lang === "en"
        ? ("Look: " + ex.label.en + " — fruit or ball? Right picks thicken the matching line.")
        : ("دیکھو: " + ex.label.ur + " — پھل یا گیند؟ درست انتخاب مماثل لکیر موٹی کرتا ہے۔");
    }
    setText(hb, msg);
    hb.classList.add("show");
  }

  /* ---------- quiz ---------- */
  function pickQuiz(){
    quizSet = shuffle(QUIZ).slice(0, 5);
  }

  function renderQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizSet.forEach(function(item, qi){
      var q = document.createElement("div");
      q.className = "q";
      var p = document.createElement("p");
      setText(p, (qi+1) + ". " + t(item.q));
      q.appendChild(p);
      item.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang === "ur" ? " ur" : "");
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.textContent = (lang === "ur") ? isolate(t(opt)) : t(opt);
        b.addEventListener("click", function(){
          if (b.parentNode.querySelector(".opt.right, .opt.wrong")) return;
          var ok = (oi === item.a);
          b.classList.add(ok ? "right" : "wrong");
          if (!ok){
            var correct = b.parentNode.querySelectorAll(".opt")[item.a];
            if (correct) correct.classList.add("right");
          } else {
            award("quiz-" + qi, 1);
          }
          var fb = document.createElement("p");
          fb.className = "fb show";
          setText(fb, ok
            ? (lang==="en"?"Shabash!":"شاباش!")
            : (lang==="en"?"Look at the green answer.":"سبز جواب دیکھو۔"));
          q.appendChild(fb);
        });
        q.appendChild(b);
      });
      box.appendChild(q);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    document.documentElement.lang = (lang === "ur") ? "ur" : "en";
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");
    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    setText($("ctlHead"), t(T.ctl));
    setText($("quizHead"), t(T.quiz));
    $("nextBtn").textContent = t(T.next);
    $("hintBtn").textContent = t(T.hint);
    $("resetBtn").textContent = t(T.reset);
    $("newQuiz").textContent = t(T.newQuiz);
    if (lang === "ur"){
      ["nextBtn","hintBtn","resetBtn","newQuiz"].forEach(function(id){
        $(id).classList.add("ur"); $(id).setAttribute("dir","rtl");
      });
    } else {
      ["nextBtn","hintBtn","resetBtn","newQuiz"].forEach(function(id){
        $(id).classList.remove("ur"); $(id).setAttribute("dir","ltr");
      });
    }
    document.querySelectorAll("footer [data-en]").forEach(function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });
    setMode(mode);
    renderQuiz();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });
  $("tabMeet").addEventListener("click", function(){ setMode("meet"); });
  $("tabLink").addEventListener("click", function(){ setMode("link"); });
  $("tabTrain").addEventListener("click", function(){ setMode("train"); });
  $("nextBtn").addEventListener("click", next);
  $("hintBtn").addEventListener("click", showHint);
  $("resetBtn").addEventListener("click", resetMode);
  $("newQuiz").addEventListener("click", function(){ pickQuiz(); renderQuiz(); });

  /* ---------- speak (cancel → delay) ---------- */
  function cleanSpeakText(s){
    return String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  function buildSpeakText(){
    var bits = [];
    bits.push(t(T.title));
    bits.push(cleanSpeakText(storyHtml().replace(/<b>/g,"").replace(/<\/b>/g,"")));
    bits.push(cleanSpeakText(($("headline") && $("headline").textContent) || ""));
    bits.push(cleanSpeakText(($("detail") && $("detail").textContent) || ""));
    bits.push(t(T.tip));
    return bits.filter(Boolean).join(". ");
  }
  function pickVoice(voices, want){
    var i, v, L;
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf(want) === 0) return v;
    }
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf("en") === 0) return v;
    }
    return voices[0] || null;
  }
  var speakTimer = null;
  function setSpeaking(on){
    var btn = $("speakBtn");
    if (!btn) return;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.style.opacity = on ? "0.65" : "";
  }
  function doSpeak(text, asLang){
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92;
    u.lang = (asLang === "ur") ? "ur-PK" : "en-US";
    var voices = window.speechSynthesis.getVoices() || [];
    var voice = pickVoice(voices, asLang === "ur" ? "ur" : "en");
    if (voice) u.voice = voice;
    u.onstart = function(){ setSpeaking(true); };
    u.onend = function(){ setSpeaking(false); };
    u.onerror = function(){
      setSpeaking(false);
      if (asLang === "ur"){
        var fallback = cleanSpeakText(
          T.title.en + ". " + T.storyMeet.en.replace(/<[^>]+>/g," ") + ". " + T.tip.en
        );
        var u2 = new SpeechSynthesisUtterance(fallback);
        u2.lang = "en-US"; u2.rate = 0.92;
        var v2 = pickVoice(window.speechSynthesis.getVoices() || [], "en");
        if (v2) u2.voice = v2;
        u2.onstart = function(){ setSpeaking(true); };
        u2.onend = u2.onerror = function(){ setSpeaking(false); };
        window.speechSynthesis.speak(u2);
      }
    };
    window.speechSynthesis.speak(u);
  }
  if ("speechSynthesis" in window){
    try { window.speechSynthesis.getVoices(); } catch (e0) {}
    if (typeof window.speechSynthesis.addEventListener === "function"){
      window.speechSynthesis.addEventListener("voiceschanged", function(){
        try { window.speechSynthesis.getVoices(); } catch (e1) {}
      });
    }
  } else {
    var noBtn = $("speakBtn");
    if (noBtn){
      noBtn.disabled = true;
      noBtn.title = "Voice not available on this device";
    }
  }
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      var text = buildSpeakText();
      if (!text) return;
      if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
      window.speechSynthesis.cancel();
      setSpeaking(false);
      var speakLang = lang;
      speakTimer = setTimeout(function(){
        speakTimer = null;
        doSpeak(text, speakLang);
      }, 80);
    }catch(e){ setSpeaking(false); }
  });

  pickQuiz();
  applyLang();
})();
</script>
</body>
</html>
