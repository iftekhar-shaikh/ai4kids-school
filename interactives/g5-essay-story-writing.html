<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">

<title>Essay aur Story Writing — لکھنا سیکھیں | AI4Kids Class 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

  :root{
    --board:#f4f0e8;
    --board-deep:#e7dfd1;
    --story:#c9702e;
    --story-deep:#96500f;
    --essay:#3a6ea8;
    --essay-deep:#26497a;
    --grow:#2e7d55;
    --grow-deep:#1d5a3c;
    --ink:#241f18;
    --ink-soft:#554c41;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#6b4a8f;
    --ok:#2e7d4f;
    --no:#c4453a;

    --fs-cap:clamp(15px, 3.9vw, 16px);
    --fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.7vw, 19px);
    --fs-md:clamp(19px, 5.1vw, 21px);
    --fs-lg:clamp(22px, 5.9vw, 25px);
    --fs-xl:clamp(28px, 7.6vw, 34px);
    --lh:1.5;
  }
  /* Urdu is set larger than Latin — Nastaliq reads smaller at the same size. */
  body.urdu{
    --fs-cap:clamp(17px, 4.4vw, 18px);
    --fs-xs:clamp(18px, 4.7vw, 20px);
    --fs-sm:clamp(20px, 5.2vw, 22px);
    --fs-md:clamp(21px, 5.6vw, 23px);
    --fs-lg:clamp(24px, 6.4vw, 27px);
    --fs-xl:clamp(27px, 7.2vw, 32px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:44px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--story);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .tabs{display:flex;gap:7px;margin:0 0 14px}
  .tabs button{
    flex:1;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:56px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  }
  .scene svg{display:block;width:100%;height:auto}

  .readout{
    margin-top:14px;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--story);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.e{background:var(--essay)} .statechip.g{background:var(--grow)}
  .stagename{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .stagename.ur{line-height:1.95}
  .job{margin:0 0 10px;color:var(--ink-soft);font-size:var(--fs-sm)}

  .sample{
    border:2px solid var(--line);background:#fffdf7;border-radius:14px;padding:13px 15px;
    font-size:var(--fs-sm);line-height:1.6;direction:ltr;
  }
  .sample em{display:block;font-style:normal;font-size:var(--fs-cap);color:var(--ink-soft);
             font-weight:700;margin-bottom:6px}
  .sample .txt{font-weight:600}
  .sample .txt u{text-decoration:none;background:#d9f0e4;border-radius:5px;padding:1px 4px;
                 box-shadow:inset 0 -2px 0 var(--grow)}

  .sofar{
    margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:12px 14px;
    font-size:var(--fs-xs);line-height:1.7;color:var(--ink-soft);direction:ltr;
  }
  .sofar em{display:block;font-style:normal;font-size:var(--fs-cap);font-weight:700;
            margin-bottom:6px;color:var(--ink)}
  .sofar span.on{color:var(--ink);font-weight:600}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}
  body.urdu .why-note{
    border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;
    line-height:var(--lh);
  }

  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .schip{
    border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;
    font:inherit;font-size:var(--fs-cap);font-weight:700;color:var(--ink);cursor:pointer;min-height:46px;
  }
  .schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .btns{display:flex;gap:9px}
  .btns button{
    border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);
    font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;min-height:54px;
    padding:0 14px;flex:1;
  }
  .btns .go{background:var(--ink);color:var(--paper)}
  .btns button:disabled{opacity:.35;cursor:default}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:52px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--no);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "quiz quiz" "foot foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

<body>
<div class="wrap">

  <div class="bar">
    <span class="brand">AI4Kids · Class 5 English</span>
    <button class="chip" id="langBtn" aria-pressed="false">اردو</button>
    <button class="chip" id="speakBtn" aria-label="Sunlo">🔊</button>
  </div>

  <div class="head">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  </div>

  <div class="tabs" role="group">
    <button type="button" id="tabStory" aria-pressed="true"></button>
    <button type="button" id="tabEssay" aria-pressed="false"></button>
    <button type="button" id="tabGrow" aria-pressed="false"></button>
  </div>

  <div class="left">
  <div class="scene">
    <svg viewBox="0 0 320 200" role="img" id="svg" aria-label="The shape of the piece of writing"></svg>
  </div>

  <div class="readout">
    <span class="statechip" id="statechip"></span>
    <p class="stagename" id="stagename"></p>
    <p class="job" id="job"></p>
    <div class="sample" id="sample"></div>
    <div class="sofar" id="sofar"></div>

  </div>
  </div>

  <div class="right">
  <div class="panel">
    <h2 id="pickHead"></h2>
    <div class="chips" id="chips" role="group"></div>
    <h2 id="stepHead"></h2>
    <div class="btns" id="btns"></div>
  </div>
  </div>

  <div class="quiz">
    <h2 id="quizHead" style="font-size:var(--fs-lg);font-weight:800;margin:0 0 18px"></h2>
    <div id="quizBox"></div>
  </div>

  <footer>
    <p data-en="AI4Kids — Islamabad's bilingual AI and coding school. WhatsApp 0337 1468899" data-ur="اے آئی فور کڈز — اسلام آباد کا دو زبانوں والا اے آئی اور کوڈنگ سکول۔ واٹس ایپ 0337 1468899"></p>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var lang="ru";
  var tab  = "story";
  var sIdx = 0, sStep = 0;      // story
  var eIdx = 0, eStep = 0;      // essay
  var gIdx = 0, gStep = 0;      // growing a sentence

  /* ---------- the five parts of a story ---------- */
  var SPARTS = [
    { en:"Who and where", ur:"کون اور کہاں",
      job:{en:"Name the person and the place in the very first line. The reader has to be able to picture it before anything happens.",
           ur:"پہلی ہی سطر میں شخص اور جگہ بتا دیں۔ کچھ ہونے سے پہلے قاری کے ذہن میں تصویر بننی چاہیے۔"} },
    { en:"Something goes wrong", ur:"کوئی مسئلہ کھڑا ہوتا ہے",
      job:{en:"This is the engine of the whole story. Without a problem, nothing else has anywhere to go.",
           ur:"یہی پوری کہانی کا انجن ہے۔ مسئلہ نہ ہو تو باقی سب کچھ کہیں نہیں جاتا۔"} },
    { en:"They try to fix it", ur:"وہ کوشش کرتا ہے",
      job:{en:"Show at least one attempt that does not quite work. An easy fix makes a boring story.",
           ur:"کم از کم ایک ایسی کوشش دکھائیں جو پوری طرح کامیاب نہ ہو۔ آسان حل کہانی کو پھیکا کر دیتا ہے۔"} },
    { en:"The turning point", ur:"موڑ",
      job:{en:"The moment everything changes. This is where the reader sits up.",
           ur:"وہ لمحہ جہاں سب کچھ بدل جاتا ہے۔ یہیں قاری سنبھل کر بیٹھتا ہے۔"} },
    { en:"How it ends", ur:"انجام",
      job:{en:"Close the problem you opened, and say how the person felt. Do not open anything new here.",
           ur:"جو مسئلہ کھولا تھا اسے بند کریں، اور بتائیں کہ شخص نے کیسا محسوس کیا۔ یہاں کوئی نئی بات نہ شروع کریں۔"} }
  ];
  var STORIES = [
    { name:"The lost puppy",
      lines:["Ayesha was walking home from school through the narrow lane behind the bakery.",
             "A small brown puppy was sitting by the drain, shivering and crying.",
             "She called out to it softly, but it backed away and hid under a parked rickshaw.",
             "Then she remembered the paratha in her bag, and held out a torn piece.",
             "The puppy crept out and ate from her hand. Ayesha carried it home, and for the first time all day she was smiling."] },
    { name:"The missed bus",
      lines:["Bilal woke up late on the morning of his science test.",
             "By the time he reached the corner, the school bus was already turning out of sight.",
             "He ran after it for a whole street, waving his bag, but it never stopped.",
             "An old man on a bicycle stopped beside him and offered him a ride.",
             "Bilal reached school just as the bell rang. He never set one alarm again — he set three."] },
    { name:"The cricket match",
      lines:["Our class was playing the final against 5-B on the dusty ground behind the school.",
             "We needed eleven runs off the last over, and I was the one holding the bat.",
             "I swung hard at the first two balls and missed both. My hands would not stop shaking.",
             "Then I stopped trying to hit it hard, and just watched the ball instead.",
             "The last ball went past the boundary. My whole class ran onto the pitch shouting my name."] }
  ];

  /* ---------- the four parts of an essay ---------- */
  var EPARTS = [
    { en:"Opening", ur:"تعارف",
      job:{en:"Say what the essay is about in one clear sentence. No story, no suspense — an essay tells the reader straight away.",
           ur:"ایک صاف جملے میں بتا دیں کہ مضمون کس بارے میں ہے۔ نہ کہانی، نہ تجسس — مضمون قاری کو فوراً بتا دیتا ہے۔"} },
    { en:"First point", ur:"پہلا نکتہ",
      job:{en:"One reason, with an example. One point per paragraph — do not put two in the same one.",
           ur:"ایک وجہ، ساتھ ایک مثال۔ ہر پیراگراف میں ایک ہی نکتہ — دو ایک ساتھ نہ ڈالیں۔"} },
    { en:"Second point", ur:"دوسرا نکتہ",
      job:{en:"A different reason, again with an example. If it repeats the first point, it is not a second point.",
           ur:"ایک اور وجہ، پھر ایک مثال کے ساتھ۔ اگر یہ پہلے نکتے کو دہرا رہی ہے تو یہ دوسرا نکتہ نہیں۔"} },
    { en:"Closing", ur:"اختتام",
      job:{en:"Pull your points together in one or two lines. Never bring in a brand new fact at the end.",
           ur:"اپنے نکات کو ایک دو سطروں میں سمیٹ دیں۔ آخر میں کوئی بالکل نئی بات ہرگز نہ لائیں۔"} }
  ];
  var ESSAYS = [
    { name:"My School",
      lines:["My school is in Islamabad, and it is the place where I spend most of my day.",
             "The teachers explain things patiently. When I could not understand fractions, my maths teacher stayed back and drew them for me on the board.",
             "The ground is large enough for everyone. At break time the whole of Class 5 plays cricket there together, and nobody is left sitting alone.",
             "Good teachers and space to play are what make a school good, and mine has both."] },
    { name:"Why water matters",
      lines:["Water is the one thing no living body can manage without, and we use it every single day.",
             "Our bodies need it constantly. A person can live for weeks without food but only a few days without water.",
             "It is also easy to waste without noticing. A tap left running while brushing your teeth loses several litres every morning.",
             "Because we need it so badly and waste it so easily, using water carefully is everybody's job."] },
    { name:"My favourite season",
      lines:["Winter is my favourite season of the year in Islamabad.",
             "The weather makes everything easier. You can play outside all afternoon without getting tired the way you do in June.",
             "It is also the season of the best food at home. My grandmother makes gajar ka halwa, and the whole house smells of it.",
             "Cool afternoons and warm kitchens are why I wait for winter all year."] }
  ];

  /* ---------- growing one sentence ---------- */
  var GROWS = [
    { base:"The dog ran.",
      steps:[
        { add:"small brown ", at:4, en:"Say what kind", ur:"کس قسم کا، یہ بتائیں",
          out:"The small brown dog ran.", hl:"small brown",
          job:{en:"A reader cannot see \u201ca dog\u201d. Two describing words and suddenly they can.",
               ur:"قاری صرف \u201cایک کتا\u201d نہیں دیکھ سکتا۔ دو صفتیں لگاتے ہی وہ دیکھ لیتا ہے۔"} },
        { out:"The small brown dog ran across the muddy street.", hl:"across the muddy street",
          en:"Say where", ur:"کہاں، یہ بتائیں",
          job:{en:"Now put it somewhere. A place turns a sentence into a scene.",
               ur:"اب اسے کسی جگہ رکھیں۔ جگہ آتے ہی جملہ ایک منظر بن جاتا ہے۔"} },
        { out:"The small brown dog ran across the muddy street, frightened by the thunder.",
          hl:"frightened by the thunder", en:"Say why, or how it felt", ur:"کیوں، یا کیسا محسوس ہوا",
          job:{en:"This is the line that makes a reader care. Until now they knew what happened; now they know why.",
               ur:"یہی وہ سطر ہے جو قاری کو دلچسپی دیتی ہے۔ اب تک اسے پتا تھا کیا ہوا؛ اب پتا ہے کیوں۔"} }
      ] },
    { base:"I saw a bird.",
      steps:[
        { out:"I saw a bright green parrot.", hl:"bright green parrot",
          en:"Say what kind", ur:"کس قسم کا، یہ بتائیں",
          job:{en:"\u201cBird\u201d could be anything. Name it and the picture appears.",
               ur:"\u201cپرندہ\u201d کچھ بھی ہو سکتا ہے۔ نام لیں تو تصویر بن جاتی ہے۔"} },
        { out:"I saw a bright green parrot on the branch outside my window.",
          hl:"on the branch outside my window", en:"Say where", ur:"کہاں، یہ بتائیں",
          job:{en:"Outside my window is better than in a tree, because it puts the reader where you were standing.",
               ur:"\u201cکھڑکی کے باہر\u201d \u201cدرخت پر\u201d سے بہتر ہے، کیونکہ یہ قاری کو وہیں لے جاتا ہے جہاں آپ کھڑے تھے۔"} },
        { out:"I saw a bright green parrot on the branch outside my window, and it stared straight back at me.",
          hl:"and it stared straight back at me", en:"Say what happened next", ur:"پھر کیا ہوا، یہ بتائیں",
          job:{en:"One small action at the end makes the sentence come alive instead of just sitting still.",
               ur:"آخر میں ایک چھوٹی سی حرکت جملے کو ساکن رہنے کے بجائے زندہ کر دیتی ہے۔"} }
      ] },
    { base:"The rain came.",
      steps:[
        { out:"The heavy rain came suddenly.", hl:"heavy", en:"Say how much, how fast",
          ur:"کتنی، کتنی تیز، یہ بتائیں",
          job:{en:"Heavy and suddenly cost you two words and change the whole feeling.",
               ur:"\u201cتیز\u201d اور \u201cاچانک\u201d صرف دو لفظ ہیں، مگر پورا تاثر بدل دیتے ہیں۔"} },
        { out:"The heavy rain came suddenly, drumming on the tin roof.",
          hl:"drumming on the tin roof", en:"Say what you could hear or see",
          ur:"کیا سنائی یا دکھائی دیا، یہ بتائیں",
          job:{en:"Sound is the most forgotten detail in children's writing, and the one that works hardest.",
               ur:"آواز وہ تفصیل ہے جو بچوں کی تحریر میں سب سے زیادہ بھول جاتی ہے، اور سب سے زیادہ کام کرتی ہے۔"} },
        { out:"The heavy rain came suddenly, drumming on the tin roof, and we all ran inside laughing.",
          hl:"and we all ran inside laughing", en:"Say what people did",
          ur:"لوگوں نے کیا کیا، یہ بتائیں",
          job:{en:"End with people. A scene with nobody in it is only weather.",
               ur:"لوگوں پر ختم کریں۔ جس منظر میں کوئی نہ ہو وہ صرف موسم ہے، منظر نہیں۔"} }
      ] }
  ];

  function $(id){ return document.getElementById(id); }
  function t(o){ return o[lang]; }

  var LRI = "\u2066", PDI = "\u2069";
  var LATIN_RUN = /[A-Za-z0-9][A-Za-z0-9 .,'\u2019+()\/@_-]*[A-Za-z0-9.]|[A-Za-z0-9]/g;
  function isolate(s){ return s.replace(LATIN_RUN, function(m){ return LRI + m + PDI; }); }
  function setText(el, str){
    el.textContent = (lang === "ur") ? isolate(str) : str;
    el.classList.toggle("ur", lang === "ur");
    el.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
  }
  function fill(s,m){ Object.keys(m).forEach(function(k){ s=s.split("{"+k+"}").join(m[k]); }); return s; }

  var NS = "http://www.w3.org/2000/svg";
  function mk(tag,a){ var e=document.createElementNS(NS,tag);
    for (var k in a) e.setAttribute(k,a[k]); return e; }

  /* ---------- pictures ---------- */
  function drawStory(step){
    var svg=$("svg"); svg.innerHTML=""; svg.setAttribute("viewBox","0 0 320 200");
    var g=mk("g",{}); svg.appendChild(g);
    // the story mountain: up to the turning point, then down
    var pts=[[30,160],[92,132],[154,84],[216,40],[290,150]];
    g.appendChild(mk("polyline",{points:pts.map(function(p){return p.join(",");}).join(" "),
                                 fill:"none", stroke:"var(--story)", "stroke-width":5,
                                 "stroke-linecap":"round", "stroke-linejoin":"round", opacity:.4}));
    pts.forEach(function(p,i){
      var on = i === step, done = i < step;
      g.appendChild(mk("circle",{cx:p[0], cy:p[1], r: on ? 15 : 9,
                                 fill: (on||done) ? "var(--story)" : "#cfc4b2",
                                 stroke:"var(--ink)", "stroke-width": on ? 3 : 2}));
      var tx=mk("text",{x:p[0], y:p[1]+ (on?6:5), "text-anchor":"middle",
                        "font-size": on ? "15" : "12", "font-weight":"800",
                        fill: (on||done) ? "#fff" : "var(--ink-soft)",
                        "font-family":"Baloo Bhaijaan 2, sans-serif"});
      tx.textContent=String(i+1); g.appendChild(tx);
    });
    var lab=mk("text",{x:216, y:22, "text-anchor":"middle", "font-size":"13",
                       "font-weight":"800", fill:"var(--story-deep)",
                       "font-family": lang==="ur" ? "Noto Nastaliq Urdu, serif"
                                                  : "Baloo Bhaijaan 2, sans-serif"});
    lab.textContent = t(SPARTS[3]); g.appendChild(lab);
  }

  function drawEssay(step){
    var svg=$("svg"); svg.innerHTML=""; svg.setAttribute("viewBox","0 0 320 200");
    var g=mk("g",{}); svg.appendChild(g);
    // four stacked blocks: opening on top, two points, closing at the bottom
    var H=[34,40,40,34], y=22;
    for (var i=0;i<4;i++){
      var on = i === step, done = i < step;
      var pad = (i===0||i===3) ? 30 : 12;
      g.appendChild(mk("rect",{x:40+pad/2, y:y, width:240-pad, height:H[i], rx: (i===0||i===3) ? 16 : 7,
                               fill: on ? "var(--essay)" : (done ? "#9db6d4" : "#d6dde6"),
                               stroke:"var(--ink)", "stroke-width": on ? 3 : 2}));
      var tx=mk("text",{x:160, y:y+H[i]/2+5, "text-anchor":"middle", "font-size":"13",
                        "font-weight":"800", fill: (on||done) ? "#fff" : "var(--ink-soft)",
                        "font-family": lang==="ur" ? "Noto Nastaliq Urdu, serif"
                                                   : "Baloo Bhaijaan 2, sans-serif"});
      tx.textContent=t(EPARTS[i]); g.appendChild(tx);
      y += H[i] + 8;
    }
  }

  function drawGrow(step){
    var svg=$("svg"); svg.innerHTML=""; svg.setAttribute("viewBox","0 0 320 200");
    var g=mk("g",{}); svg.appendChild(g);
    var labels=["base","1","2","3"];
    for (var i=0;i<4;i++){
      var on = i === step, done = i < step;
      var w = 84 + i*56;
      g.appendChild(mk("rect",{x:160-w/2, y:24+i*42, width:w, height:32, rx:9,
                               fill: on ? "var(--grow)" : (done ? "#9ccab4" : "#dbe4de"),
                               stroke:"var(--ink)", "stroke-width": on ? 3 : 2}));
      var tx=mk("text",{x:160, y:24+i*42+21, "text-anchor":"middle", "font-size":"13",
                        "font-weight":"800", fill:(on||done) ? "#fff" : "var(--ink-soft)",
                        "font-family":"Baloo Bhaijaan 2, sans-serif"});
      var gsx = GROWS[gIdx];
      var sent = i===0 ? gsx.base : gsx.steps[i-1].out;
      var n = sent.replace(/[.,]/g,"").trim().split(/\s+/).length;
      tx.textContent = n + (lang==="ur" ? " الفاظ" : " words");
      g.appendChild(tx);
    }
  }

  /* ---------- render ---------- */
  function render(){
    ["Story","Essay","Grow"].forEach(function(x){
      $("tab"+x).setAttribute("aria-pressed", tab===x.toLowerCase() ? "true":"false");
    });
    setText($("tabStory"), t(T.tabStory));
    setText($("tabEssay"), t(T.tabEssay));
    setText($("tabGrow"),  t(T.tabGrow));
    $("whyLbl").textContent = t(T.whyLbl);
    setText($("quizHead"), t(T.quiz));
    var chips=$("chips"); chips.innerHTML="";
    var btns=$("btns"); btns.innerHTML="";
    var chip=$("statechip"); chip.className="statechip";
    setText($("stepHead"), t(T.stepHead));

    var list, parts, idx, step, setIdx, setStep, colour;
    if (tab === "story"){ list=STORIES; parts=SPARTS; idx=sIdx; step=sStep;
      setIdx=function(v){sIdx=v;sStep=0;}; setStep=function(v){sStep=v;}; colour=""; }
    else if (tab === "essay"){ list=ESSAYS; parts=EPARTS; idx=eIdx; step=eStep;
      setIdx=function(v){eIdx=v;eStep=0;}; setStep=function(v){eStep=v;}; colour="e"; }
    else { list=GROWS; parts=null; idx=gIdx; step=gStep;
      setIdx=function(v){gIdx=v;gStep=0;}; setStep=function(v){gStep=v;}; colour="g"; }

    var total = (tab === "grow") ? GROWS[idx].steps.length + 1 : parts.length;
    chip.className = "statechip " + colour;
    setText(chip, fill(t(T.stepOf), {n:step+1, t:total}));

    if (tab === "story"){
      drawStory(step);
      setText($("title"), t(T.titleStory));
      setText($("subtitle"), t(T.subStory));
      setText($("pickHead"), t(T.pickStory));
      setText($("stagename"), t(parts[step]));
      setText($("job"), t(parts[step].job));
      $("sample").innerHTML = "";
      var em=document.createElement("em"); em.textContent=t(T.sampleLbl);
      em.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      var tx=document.createElement("div"); tx.className="txt";

      lastSpoken = list[idx].lines[step];
    } else if (tab === "essay"){
      drawEssay(step);
      setText($("title"), t(T.titleEssay));
      setText($("subtitle"), t(T.subEssay));
      setText($("pickHead"), t(T.pickEssay));
      setText($("stagename"), t(parts[step]));
      setText($("job"), t(parts[step].job));
      $("sample").innerHTML = "";
      var em2=document.createElement("em"); em2.textContent=t(T.sampleLbl);
      em2.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      var tx2=document.createElement("div"); tx2.className="txt";
      tx2.textContent = list[idx].lines[step];
      $("sample").appendChild(em2); $("sample").appendChild(tx2);
      buildSoFar(list[idx].lines, step, t(T.sofarLbl));
      setText($("whyText"), (step===1||step===2) ? t(T.whyEssayEx) : t(T.whyEssay));
      lastSpoken = list[idx].lines[step];
    } else {
      drawGrow(step);
      setText($("title"), t(T.titleGrow));
      setText($("subtitle"), t(T.subGrow));
      setText($("pickHead"), t(T.pickGrow));
      var gs = GROWS[idx];
      var cur = step === 0 ? gs.base : gs.steps[step-1].out;
      var hl  = step === 0 ? null : gs.steps[step-1].hl;
      setText($("stagename"), step === 0
        ? (lang==="ur" ? "شروع کا جملہ" : "The starting sentence")
        : t(gs.steps[step-1]));
      setText($("job"), step === 0
        ? (lang==="ur" ? "چار لفظ۔ کچھ غلط نہیں، مگر قاری کو کچھ دکھائی نہیں دیتا۔"
                       : "Four words. Nothing wrong with it, but the reader cannot see anything.")
        : t(gs.steps[step-1].job));
      $("sample").innerHTML = "";
      var em3=document.createElement("em"); em3.textContent=t(T.growLbl);
      em3.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      var tx3=document.createElement("div"); tx3.className="txt";
      if (hl && cur.indexOf(hl) >= 0){
        var i0 = cur.indexOf(hl);
        tx3.appendChild(document.createTextNode(cur.slice(0,i0)));
        var u=document.createElement("u"); u.textContent=hl; tx3.appendChild(u);
        tx3.appendChild(document.createTextNode(cur.slice(i0+hl.length)));
      } else tx3.textContent = cur;
      $("sample").appendChild(em3); $("sample").appendChild(tx3);
      $("sofar").style.display="none";
      setText($("whyText"), t(T.whyGrow));
      lastSpoken = cur;
    }

    list.forEach(function(x,i){
      var b=document.createElement("button");
      b.type="button"; b.className="schip";
      b.textContent = x.name || x.base;
      b.setAttribute("dir","ltr");
      b.setAttribute("aria-pressed", i===idx ? "true":"false");
      b.addEventListener("click", function(){ setIdx(i); render(); });
      chips.appendChild(b);
    });

    var bk=document.createElement("button"); bk.type="button";
    setText(bk, t(T.back)); bk.disabled = (step===0);
    bk.addEventListener("click", function(){ if (step>0){ setStep(step-1); render(); } });
    var nx=document.createElement("button"); nx.type="button"; nx.className="go";
    setText(nx, step >= total-1 ? t(T.restart) : t(T.next));
    nx.addEventListener("click", function(){ setStep(step >= total-1 ? 0 : step+1); render(); });
    btns.appendChild(bk); btns.appendChild(nx);
  }

  function buildSoFar(lines, step, label){
    var box=$("sofar"); box.style.display=""; box.innerHTML="";
    var em=document.createElement("em"); em.textContent=label;
    em.setAttribute("dir", lang==="ur"?"rtl":"ltr");
    box.appendChild(em);
    lines.forEach(function(l,i){
      if (i > step) return;
      var sp=document.createElement("span");
      sp.className = i===step ? "on" : "";
      sp.textContent = l + " ";
      box.appendChild(sp);
    });
  }

  var lastSpoken="";

  ["Story","Essay","Grow"].forEach(function(x){
    $("tab"+x).addEventListener("click", function(){
      var m=x.toLowerCase();
      if (tab===m) return;
      tab=m; render();
    });
  });

    var box=$("quizBox"); box.innerHTML="";
    QUIZ.forEach(function(item){
      var wrap=document.createElement("div"); wrap.className="q";
      var q=document.createElement("p"); setText(q,t(item.q)); wrap.appendChild(q);
      var fb=document.createElement("p"); fb.className="fb";
      item.o.forEach(function(opt,oi){
        var b=document.createElement("button");
        b.type="button";
        b.className="opt" + (lang==="ur" ? " ur" : "");
        b.setAttribute("dir", lang==="ur" ? "rtl":"ltr");
        b.textContent=t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done")==="1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x,xi){
            if (xi===item.a) x.classList.add("right");
            else if (xi===oi) x.classList.add("wrong");
          });
          setText(fb,t(item.f)); fb.classList.add("show","fb");
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb); box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang==="ur");
    var lb=$("langBtn");
    lb.textContent = (lang==="en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang==="ur" ? "true":"false");
    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function(el){
      setText(el, el.getAttribute(lang==="en" ? "data-en":"data-ur"));
    });
    buildQuiz(); render();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang==="en") ? "ur":"en"; applyLang();
  });

  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(lastSpoken);
      u.lang='hi-IN'; u.rate=0.9;
      window.speechSynthesis.speak(u);
    }catch(e){ /* no voice available — stay quiet */ }
  });

  applyLang();
})();
</script>
<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
