<style>
:root{--ink:#17252f;--muted:#526672;--paper:#fffdf7;--line:#d9d2c5;--blue:#176b87;--blue2:#e2f2f5;--orange:#d56f2f;--green:#2e8156;--purple:#72519a;--red:#b94d45;--yellow:#fff0b8;--cap:clamp(1rem,2.8vw,1.15rem);--sm:clamp(1.12rem,3.3vw,1.38rem);--md:clamp(1.28rem,3.8vw,1.65rem);--lg:clamp(1.55rem,4.8vw,2.1rem);--xl:clamp(2rem,7vw,3rem)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--sm);line-height:1.55;padding-bottom:48px}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:15px 0 7px}
.brand{font-weight:900;color:var(--blue);margin-right:auto;font-size:var(--cap)}
button{font:inherit;color:inherit}
.chip,.tab{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:8px 15px;cursor:pointer;font-weight:800;min-height:45px}
.chip[aria-pressed=true],.tab[aria-pressed=true]{background:var(--ink);color:#fff}
h1{font-size:var(--xl);line-height:1.15;margin:12px 0 4px}.sub{color:var(--muted);margin:0 0 16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border-radius:14px;flex:1 1 16%;font-size:var(--cap);min-height:52px}
.demo{border:3px solid var(--ink);border-radius:23px;background:linear-gradient(140deg,#e7f4f6,#fff1d9);padding:16px;margin-bottom:20px}
.demo-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.demo-head h2{font-size:var(--lg);margin:0;flex:1}
.hint{color:var(--muted);margin:4px 0 13px}.stage{background:#fffefa;border:2px solid var(--line);border-radius:17px;padding:13px}
.play{background:var(--green);border:3px solid #236b45;color:#fff;border-radius:15px;padding:10px 17px;min-height:52px;cursor:pointer;font-weight:900;font-size:var(--md);width:100%;margin-top:12px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{border:3px solid var(--line);background:#fff;border-radius:15px;min-height:93px;padding:10px 8px;cursor:pointer;text-align:center;font-weight:900}
.card:hover,.card.selected,.card.active{border-color:var(--blue);background:var(--blue2)}
.emoji{display:block;font-size:2.35rem;line-height:1.1;margin-bottom:4px}
.demo-msg{border-radius:13px;background:var(--yellow);padding:10px 13px;margin:12px 0 0;font-weight:800}
.lesson-grid{display:grid;gap:13px}
.lesson{border:3px solid var(--line);border-radius:18px;background:#fff;padding:15px 17px;scroll-margin-top:12px}
.lesson .tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:3px 13px;font-size:var(--cap);font-weight:900;margin-bottom:9px}
.lesson.hook .tag{background:var(--orange)}.lesson.misaal .tag{background:var(--green)}.lesson.karo .tag{background:var(--purple)}
.lesson p{margin:0;font-size:var(--sm);white-space:pre-wrap}
.quiz{border-top:3px solid var(--ink);margin-top:30px;padding-top:20px}.quiz h2{font-size:var(--lg);margin:0 0 17px}
.q{margin-bottom:25px}.q-title{font-size:var(--md);font-weight:900;margin:0 0 10px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;margin:8px 0;cursor:pointer;min-height:52px;font-size:var(--sm)}
.opt.right{border-color:var(--green);background:#e6f4eb;font-weight:900}.opt.wrong{border-color:var(--red);background:#f9e6e1}
.feedback{display:none;color:var(--muted);font-size:var(--cap);margin:7px 0}.feedback.show{display:block}
.score{display:none;text-align:center;border:3px solid var(--green);background:#e6f4eb;border-radius:15px;padding:13px;font-size:var(--md);font-weight:900}.score.show{display:block}
footer{margin-top:31px;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:var(--cap)}
@media(min-width:760px){.lesson-grid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(3,1fr)}.play{width:auto;min-width:190px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
/* AI4KIDS_BRAND */:root{--ink:#17252f;--muted:#526672;--paper:#fffdf7;--card:#ffffff;--line:#d9d2c5;--green:#27ae60;--green-deep:#1e8449;--teal:#1abc9c;--purple:#8e44ad;--orange:#e67e22;--yellow:#fff0b8;--red:#e74c3c;--whatsapp:#25D366;--font:'Segoe UI','Trebuchet MS',Tahoma,sans-serif}/* /AI4KIDS_BRAND */

.demo-rich{display:flex;flex-direction:column;gap:10px}
.demo-score{font-weight:900;font-size:var(--md);background:var(--yellow);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;display:inline-block}
.demo-prompt{font-size:var(--md);font-weight:900;margin:0;padding:10px 12px;background:#e2f2f5;border:2px solid var(--ink);border-radius:12px}
.demo-actions{display:flex;gap:8px;flex-wrap:wrap}
.demo-actions .play{width:auto;flex:1;min-width:140px;margin-top:0}
.card.correct-flash{border-color:var(--green)!important;background:#e6f4eb!important;transform:scale(1.03)}
.card.wrong-flash{border-color:var(--red)!important;background:#f9e6e1!important}
.scene-strip{border:3px solid var(--ink);border-radius:16px;overflow:hidden;margin-bottom:8px;background:#fff}
.scene-strip svg{display:block;width:100%;height:auto}

</style></head><body>
<div class="wrap">
<div class="bar"><span class="brand" id="brand"></span>
<button class="chip" id="langBtn" type="button" aria-pressed="true">English</button>
<button class="chip" id="speakBtn" type="button" aria-label="Read aloud">🔊</button></div>

</div>
<script>/* AI4KIDS_RICH_DEMO */const D={"file": "g1-social-rules.html", "title": {"en": "Rules aur manners", "ru": "Rules aur manners"}, "desc": {"en": "Achhe tareeqe aur qawaid", "ru": "Achhe tareeqe aur qawaid"}, "lesson": {"hook": {"en": "Sadi socho — Rules aur manners hamari zindagi se kaise judta hai? Pakistan / Islamabad context mein seekhein!", "ru": "Sadi socho — Rules aur manners hamari zindagi se kaise judta hai? Pakistan / Islamabad context mein seekhein!"}, "samjhao": {"en": "Rules aur manners samjho: yeh Social Studies ka zaroori topic hai. Points: Please, Shukriya, Chup, Line.", "ru": "Rules aur manners samjho: yeh Social Studies ka zaroori topic hai. Points: Please, Shukriya, Chup, Line."}, "misaal": {"en": "Misaal Islamabad/Pakistan se: Please kehna achha manners hai. Shukriya zaroor bolo.", "ru": "Misaal Islamabad/Pakistan se: Please kehna achha manners hai. Shukriya zaroor bolo."}, "karo": {"en": "Activity: 3 cheezein likho jo Rules aur manners se related hon. Ek drawing bhi banao.", "ru": "Activity: 3 cheezein likho jo Rules aur manners se related hon. Ek drawing bhi banao."}}, "demo": {"type": "cards", "title": {"en": "Khelo — tap cards", "ru": "Khelo — cards par tap karo"}, "hint": {"en": "Tap a card to hear and learn.", "ru": "Seekhne ke liye card par tap karo."}, "items": [{"emoji": "🙏", "name": {"en": "Please", "ru": "Please"}, "line": {"en": "Please kehna achha manners hai.", "ru": "Please kehna achha manners hai."}}, {"emoji": "😊", "name": {"en": "Shukriya", "ru": "Shukriya"}, "line": {"en": "Shukriya zaroor bolo.", "ru": "Shukriya zaroor bolo."}}, {"emoji": "🤫", "name": {"en": "Chup", "ru": "Chup"}, "line": {"en": "Library mein chup raho.", "ru": "Library mein chup raho."}}, {"emoji": "🚶", "name": {"en": "Line", "ru": "Line"}, "line": {"en": "Line mein raho.", "ru": "Line mein raho."}}, {"emoji": "🗑️", "name": {"en": "Kachra", "ru": "Kachra"}, "line": {"en": "Kachra bin mein dalo.", "ru": "Kachra bin mein dalo."}}, {"emoji": "⏰", "name": {"en": "Waqt", "ru": "Waqt"}, "line": {"en": "Time par aao.", "ru": "Time par aao."}}]}, "quizTitle": {"en": "Rules aur manners Quiz", "ru": "Rules aur manners Quiz"}, "quiz": [{"q": {"en": "Rules aur manners mein 'Please' ka sahi khayal kya hai?", "ru": "Rules aur manners mein 'Please' ka sahi khayal kya hai?"}, "opts": [{"en": "Please kehna achha manners hai.", "ru": "Please kehna achha manners hai."}, {"en": "Shukriya zaroor bolo.", "ru": "Shukriya zaroor bolo."}, {"en": "Sirf khel", "ru": "Sirf khel"}, {"en": "Kuch nahi", "ru": "Kuch nahi"}], "ans": 0, "exp": {"en": "Sahi: Please kehna achha manners hai.", "ru": "Sahi: Please kehna achha manners hai."}}, {"q": {"en": "Kaunsa option 'Shukriya' se related hai?", "ru": "Kaunsa option 'Shukriya' se related hai?"}, "opts": [{"en": "Shukriya zaroor bolo.", "ru": "Shukriya zaroor bolo."}, {"en": "Bilkul ghalat baat", "ru": "Bilkul ghalat baat"}, {"en": "Sirf TV", "ru": "Sirf TV"}, {"en": "Kuch mat karo", "ru": "Kuch mat karo"}], "ans": 0, "exp": {"en": "Shukriya: Shukriya zaroor bolo.", "ru": "Shukriya: Shukriya zaroor bolo."}}, {"q": {"en": "'Chup' ke bare mein sahi jumla chuno:", "ru": "'Chup' ke bare mein sahi jumla chuno:"}, "opts": [{"en": "Library mein chup raho.", "ru": "Library mein chup raho."}, {"en": "Yeh zaroori nahi", "ru": "Yeh zaroori nahi"}, {"en": "Sirf bade logon ke liye", "ru": "Sirf bade logon ke liye"}, {"en": "Hamesha ghalat", "ru": "Hamesha ghalat"}], "ans": 0, "exp": {"en": "Library mein chup raho.", "ru": "Library mein chup raho."}}, {"q": {"en": "Hum 'Line' se kya seekhte hain?", "ru": "Hum 'Line' se kya seekhte hain?"}, "opts": [{"en": "Line mein raho.", "ru": "Line mein raho."}, {"en": "Gussa karna", "ru": "Gussa karna"}, {"en": "Jhoot bolna", "ru": "Jhoot bolna"}, {"en": "Kachra phenkna", "ru": "Kachra phenkna"}], "ans": 0, "exp": {"en": "Line mein raho.", "ru": "Line mein raho."}}, {"q": {"en": "Is sabaq 'Rules aur manners' ka best message kya hai?", "ru": "Is sabaq 'Rules aur manners' ka best message kya hai?"}, "opts": [{"en": "Kachra bin mein dalo.", "ru": "Kachra bin mein dalo."}, {"en": "Rules todna", "ru": "Rules todna"}, {"en": "Dusron ko tang karna", "ru": "Dusron ko tang karna"}, {"en": "Padhai chhorna", "ru": "Padhai chhorna"}], "ans": 0, "exp": {"en": "Kachra bin mein dalo.", "ru": "Kachra bin mein dalo."}}]};</script>
<script>
(function(){
'use strict';
var lang='ru', selected=0, answered=0, points=0, lastSpoken='';

function ai4kidsSpeak(text, preferLang){
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(text||''));
    var want=(preferLang||lang)==='en'?'en':'ur';
    u.rate=0.82;
    var voices=window.speechSynthesis.getVoices()||[];
    var pick=null;
    if(want!=='en'){
      pick=voices.find(function(v){return /urdu|hindi|ur-PK|hi-IN|hi_IN|ur_PK/i.test(v.lang+' '+v.name);});
      u.lang=pick?pick.lang:'ur-PK';
    }else{
      pick=voices.find(function(v){return /^en/i.test(v.lang);});
      u.lang=pick?pick.lang:'en-US';
    }
    if(pick) u.voice=pick;
    lastSpoken=String(text||'');
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.ai4kidsSpeak=ai4kidsSpeak;
window.AI4KIDS_TTS={speak:ai4kidsSpeak};

function $(id){return document.getElementById(id)}
function t(x){return x&&typeof x==='object'?(x[lang]||x.ru||x.en||''):String(x||'')}
function set(el,x){el.textContent=t(x)}
function labels(){return{play:{en:'Play',ru:'Khelo'},hook:{en:'HOOK',ru:'HOOK'},samjhao:{en:'SAMJHAO',ru:'SAMJHAO'},misaal:{en:'MISAAL',ru:'MISAAL'},karo:{en:'KARO',ru:'KARO'}}}

function render(){
  document.documentElement.lang=lang==='en'?'en':'ur';
  document.title=t(D.title)+' | AI4Kids Grade 1';
  set($('brand'),{en:'AI4Kids · Grade 1 · Social Studies',ru:'AI4Kids · Grade 1 · Social Studies'});
  set($('title'),D.title); set($('subtitle'),D.desc);
  $('langBtn').textContent=lang==='ru'?'English':'Roman Urdu';
  $('langBtn').setAttribute('aria-pressed', lang==='ru'?'true':'false');
  var L=labels();
  [['hook','hookText'],['samjhao','samjhaoText'],['misaal','misaalText'],['karo','karoText']].forEach(function(x){
    set($(x[0]+'Tag'),L[x[0]]); set($(x[1]),D.lesson[x[0]]);
  });
  set($('demoTitle'),D.demo.title); set($('demoHint'),D.demo.hint); set($('launch'),L.play);
  set($('quizTitle'),D.quizTitle);
  set($('foot'),{en:'AI4Kids · Grade 1 · Offline lesson',ru:'AI4Kids · Grade 1 · Offline lesson'});
  var tb=$('tabs'); tb.innerHTML='';
  ['play','hook','samjhao','misaal','karo'].forEach(function(k){
    var b=document.createElement('button'); b.className='tab'; b.type='button'; b.textContent=t(L[k]);
    b.onclick=function(){$(k==='play'?'demo':k).scrollIntoView({behavior:'smooth'})};
    tb.appendChild(b);
  });
  renderDemo(); renderQuiz();
}

function renderDemo(){
  var s=$('stage'); if(!s) return;
  var items=(D.demo&&D.demo.items)||[];
  var mode='learn';
  var streak=0, done=0, target=0;
  function shuffle(a){var x=a.slice(); for(var i=x.length-1;i>0;i--){var j=(Math.random()*(i+1))|0; var t=x[i]; x[i]=x[j]; x[j]=t;} return x;}
  function pickTarget(){ if(!items.length) return 0; target=(Math.random()*items.length)|0; }
  function paint(){
    var html='';
    html+='<div class="scene-strip" aria-hidden="true"><svg viewBox="0 0 640 100" role="img"><rect width="640" height="100" fill="#fff4e0"/><rect x="420" y="40" width="70" height="45" fill="#27ae60" stroke="#17252f" stroke-width="2"/><polygon points="420,40 455,18 490,40" fill="#1e8449" stroke="#17252f" stroke-width="2"/><text x="40" y="55" font-size="22" font-weight="900" fill="#17252f">Islamabad · ghar · school</text><circle cx="280" cy="48" r="26" fill="#f2c9a0" stroke="#17252f" stroke-width="2"/><rect x="264" y="74" width="32" height="18" rx="4" fill="#1f7a4c"/></svg></div>';
    html+='<div class="demo-rich">';
    html+='<div class="demo-score">⭐ '+streak+' sahi · '+done+' rounds</div>';
    if(mode==='challenge' && items.length){
      html+='<p class="demo-prompt">🎯 Dhundo: <span>'+t(items[target].name)+'</span></p>';
    } else {
      html+='<p class="demo-prompt">📖 Seekho: card dabao — suno aur padho</p>';
    }
    html+='<div class="cards">';
    var order = mode==='challenge' ? shuffle(items.map(function(_,i){return i;})) : items.map(function(_,i){return i;});
    order.forEach(function(i){
      var it=items[i];
      html+='<button type="button" class="card" data-i="'+i+'"><span class="emoji">'+(it.emoji||'⭐')+'</span>'+t(it.name)+'</button>';
    });
    html+='</div>';
    html+='<p class="demo-msg" id="demoMsg">'+(mode==='learn'?'Card par tap karo.':'Sahi card dhundo!')+'</p>';
    html+='<div class="demo-actions">';
    html+='<button type="button" class="play" id="modeBtn">'+(mode==='learn'?'🎯 Challenge shuru':'📖 Seekho mode')+'</button>';
    html+='<button type="button" class="play" id="speakDemo" style="background:var(--purple);border-color:#5e2d7a">🔊 Sunlo</button>';
    html+='</div></div>';
    s.innerHTML=html;
    s.querySelectorAll('.card').forEach(function(btn){
      btn.onclick=function(){
        var i=+btn.getAttribute('data-i');
        var it=items[i];
        var msg=$('demoMsg');
        if(mode==='learn'){
          btn.classList.add('active');
          if(msg) msg.textContent=t(it.line||it.name);
          ai4kidsSpeak(t(it.name)+'. '+t(it.line||''), lang);
          return;
        }
        // challenge
        if(i===target){
          streak++; done++;
          btn.classList.add('correct-flash');
          if(msg) msg.textContent='Sahi! '+t(it.name)+' ⭐';
          ai4kidsSpeak('Sahi! '+t(it.name), lang);
          setTimeout(function(){ pickTarget(); paint(); }, 650);
        } else {
          streak=Math.max(0, streak-1);
          btn.classList.add('wrong-flash');
          if(msg) msg.textContent='Dobara try — dhundo: '+t(items[target].name);
          ai4kidsSpeak('Dobara try karo', lang);
          setTimeout(function(){ btn.classList.remove('wrong-flash'); }, 450);
        }
      };
    });
    var mb=$('modeBtn');
    if(mb) mb.onclick=function(){
      mode = mode==='learn'?'challenge':'learn';
      if(mode==='challenge'){ pickTarget(); streak=0; done=0; }
      paint();
    };
    var sb=$('speakDemo');
    if(sb) sb.onclick=function(){
      if(mode==='challenge' && items[target]) ai4kidsSpeak('Dhundo '+t(items[target].name), lang);
      else if(items[0]) ai4kidsSpeak(t(D.title)+'. '+t(items[0].line||items[0].name), lang);
    };
  }
  pickTarget();
  paint();
}

function renderQuiz(){
  var box=$('quizBox'); box.innerHTML=''; answered=0; points=0; $('score').classList.remove('show');
  D.quiz.forEach(function(q,qi){
    var w=document.createElement('div'); w.className='q';
    var h=document.createElement('p'); h.className='q-title'; h.textContent=(qi+1)+'. '+t(q.q); w.appendChild(h);
    q.opts.forEach(function(opt,oi){
      var b=document.createElement('button'); b.type='button'; b.className='opt';
      b.textContent=String.fromCharCode(65+oi)+'. '+t(opt);
      b.onclick=function(){
        if(w.dataset.done) return; w.dataset.done='1'; answered++;
        var right=oi===q.ans; if(right) points++;
        b.classList.add(right?'right':'wrong');
        w.querySelectorAll('.opt').forEach(function(x,xi){if(xi===q.ans)x.classList.add('right'); x.disabled=true;});
        var f=w.querySelector('.feedback'); f.textContent=(right?'✓ ':'✗ ')+t(q.exp); f.className='feedback show';
        if(answered===D.quiz.length){
          $('score').textContent='Score: '+points+' / 5'; $('score').classList.add('show');
        }
      };
      w.appendChild(b);
    });
    var f=document.createElement('p'); f.className='feedback'; w.appendChild(f); box.appendChild(w);
  });
}

$('langBtn').onclick=function(){lang=lang==='ru'?'en':'ru'; selected=0; render();};
$('speakBtn').onclick=function(){ai4kidsSpeak(t(D.title)+'. '+t(D.desc));};
$('launch').onclick=function(){$('demo').scrollIntoView({behavior:'smooth'}); ai4kidsSpeak(t(D.demo.title));};
if('speechSynthesis' in window){speechSynthesis.addEventListener('voiceschanged', function(){});}
render();
})();
</script>
</body></html>
