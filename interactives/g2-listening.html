\n\1</head><body><main class="wrap"><div class="bar"><span id="brand" class="brand"></span><button id="lang" class="chip" aria-pressed="false">Roman Urdu</button><button id="speak" class="chip" aria-label="Play">🔊</button></div><header><h1 id="title"></h1><p id="sub" class="sub"></p></header><nav id="tabs" class="tabs"></nav><div class="columns"><div id="left"></div><div id="right"></div></div><div id="lessons"></div><section class="quiz"><h2 id="qh"></h2><div id="quiz"></div><div id="score" class="score"></div></section><footer id="foot"></footer></main><script>const DATA={"title":{"en":"Listening skills","ur":"Listening skills"},"desc":{"en":"2-3 step instructions follow karna","ur":"2-3 step instructions follow karna"},"sections":[{"key":"hook","tag":{"en":"HOOK","ur":"HOOK"},"body":{"en":"Have you ever missed a step because you were not listening? Good listeners use ears, eyes, and memory. Today we will follow two- and three-step instructions.","ur":"Kya aapko kabhi apne dost ko cricket khelte hue suna hai? Jab unhoon ne ball ka chakkar dekha aur chalo chalo keh kar daud lagai, toh kya aapne suna ke unhoon ne kya kaha? Aaj hum seekhenge ke kaise behtar \"Listening skills\" se hum aise palon ko behtar samajh sakte hain!"}},{"key":"samjhao","tag":{"en":"SAMJHAO","ur":"SAMJHAO"},"body":{"en":"Listening means hearing carefully and understanding. Remember order words such as first, next, and last. Follow each step in order; do not swap steps.","ur":"Aaj hum \"Listening skills\" ke baare mein baat karenge. Listening skills ka matlab hai doosre logon ki baatein dhyan se sunna aur samajhna. Jab hum achi tarah sunte hain, toh hum jaan sakte hain ke samne wala kya keh raha hai. Yeh skills bohat zaroori hain, kyunki iss se hum behtar dosti kar sakte hain aur khaas tor par school mein apne teachers ko bhi acchi tarah samajh sakte hain.\n\nListening skills ko behtar karne ke liye, 2-3 step instructions ko follow karna seekhna bohot zaroori hai. Jab koi aapko kahin jaane ya kuch karne ka keh raha hota hai, toh aapko dhyan se sunna chahiye. Aapko instructions ko yaad rakhna hoga taake aap sahi se unhe follow kar sakein. \n\nEk aur baat hai, jab hum sun rahe hote hain, toh humein sirf sunna nahi hai, balki samajhna bhi hai. Aap kaya kah rahe hain? Kya yeh kya sach hai? Yeh choti choti baatein humein bohot madad karti hain. \n\nAakhir mein, jab aap listening skills ko aam zindagi mein istemal karte hain, toh yeh aapko behtar communicator banata hai. Aap asani se apne dosto ke sath, teachers ke sath aur ghar walon ke sath baat kar sakte hain!"}},{"key":"misaal","tag":{"en":"MISAAL","ur":"MISAAL"},"body":{"en":"If Mum says, “Pick up the book, put it on the table, then bring your pencil,” do those three steps in order. Careful listening also helps at a market.","ur":"Chalo ek misaal lete hain bazaar ki. Jab aap apni maa ke sath bazaar jaate hain, toh unhoon ko kehna hota hai ke kya kharidna hai — jaise ke 5 kilo aalu, 2 kilo tamatar, aur kuch dahi. Agar aap dhyan se sunenge, toh aap galat cheez nahi le jaayenge. Aapko yeh yaad rakhna hoga ke maa ne kya kaha tha. Is tarah se, aap listening skills se bazaar mein asani se kaam kar sakte hain."}},{"key":"karo","tag":{"en":"KARO","ur":"KARO"},"body":{"en":"Ask a family member for a two- or three-step instruction. Repeat it, then do it in order. Take turns being the speaker.","ur":"Ab aap ek fun activity kar sakte hain! Aap apne ghar walon se kahin ke woh aapko ek choti si recipe bataein, jaise ke sandwich kaise banana hai. Unki baatein dhyan se suno aur phir khud sandwich banao. Jab aap sandwich banayenge, toh dekhein ke kitni baatein yaad rakhni parti hain jo aapne unse suni hoti. Yeh aap ki Listening skills ko behtar karega!\n\n## SAWAAL\n1. Listening skills ka kya matlab hai?\n2. Aap kis tarah se doosron ki baatein behtar sun sakte hain?\n3. Bazaar mein listening skills ka istemal karne ka kya faida hai?\n\nTake care and keep listening,  \nEnglish Ma'am"}}],"quiz":[{"q":{"en":"Book first on the table, then pick up the pencil. What do you do?","ur":"Agar aap ko apni kitaab utakar table par rakhni hai aur phir apna pencil uthana hai, to aap kya karenge?"},"opts":[{"en":"Put the book on the table, then pick up the pencil.","ur":"Kitaab utakar table par rakhungi aur phir pencil uthaoongi."},{"en":"Pick up the pencil, then put down the book.","ur":"Pencil uthaoongi phir kitaab rakhoongi."},{"en":"Look at the table and do nothing.","ur":"Table ko dekhun gi phir kuch nahi karungi."},{"en":"Nothing.","ur":"Kuch nahi."}],"ans":0,"exp":{"en":"Kyun sahi hai: Yeh sahi hai kyunke pehle kitaab rakhni hai, phir pencil uthani hai.","ur":"Kyun sahi hai: Yeh sahi hai kyunke pehle kitaab rakhni hai, phir pencil uthani hai."}},{"q":{"en":"Give your friend water, then drink tea. What comes first?","ur":"Agar aapko apne dost ko paani dena hai aur khud chai peeni hai, to sab se pehle aap kya karenge?"},"opts":[{"en":"Give water to your friend.","ur":"Dost ko paani doongi pehle."},{"en":"Start drinking tea.","ur":"Khud chai peeni shuru karungi."},{"en":"Give nothing.","ur":"Dost ko kuch nahi doongi."},{"en":"Ask your friend for water.","ur":"Dost se kahein gi paani chahiye?"}],"ans":0,"exp":{"en":"Kyun sahi hai: Pehle dost ko paani dena hoga phir khud chai peena sahi hai.","ur":"Kyun sahi hai: Pehle dost ko paani dena hoga phir khud chai peena sahi hai."}},{"q":{"en":"Get ready, then go to school. What do you do?","ur":"Agar teacher kehati hain ke aapko khud ko tayar karna hai aur phir school jana hai, to aap kya karenge?"},"opts":[{"en":"Get ready first, then go to school.","ur":"Pehle tayar honga, phir school jaun ga."},{"en":"Go straight to school.","ur":"Seedha school jaunga."},{"en":"Do not get ready.","ur":"Tayar nahi honga."},{"en":"Ask the teacher.","ur":"Teacher se poochun ga."}],"ans":2,"exp":{"en":"Kyun sahi hai: Ye sahi nahi hai kyunke tayar hona pehla kaam hai.","ur":"Kyun sahi hai: Ye sahi nahi hai kyunke tayar hona pehla kaam hai."}},{"q":{"en":"Make a sandwich, then play. How do you start?","ur":"Agar aapko sandwich banana hai aur phir khelna hai, to aap kaise shuru karenge?"},"opts":[{"en":"Make the sandwich, then play.","ur":"Sandwich banaungi phir khelungi."},{"en":"Start playing.","ur":"Khelna shuru karungi."},{"en":"Do not make a sandwich.","ur":"Sandwich nahi banana."},{"en":"Ask Mum.","ur":"Maa se poochungi."}],"ans":0,"exp":{"en":"Kyun sahi hai: Pehle sandwich banana zaroori hai, phir khelna sahi hai.","ur":"Kyun sahi hai: Pehle sandwich banana zaroori hai, phir khelna sahi hai."}},{"q":{"en":"Eat before playing. What do you do?","ur":"Agar aapko khana khelne se pehle khana khana hai, to aap kya karenge?"},"opts":[{"en":"Eat, then go to play.","ur":"Khana khane ke baad khelne jaungi."},{"en":"Start playing.","ur":"Khelna shuru karungi."},{"en":"Do not eat.","ur":"Khana nahi khauga."},{"en":"Wait for food.","ur":"Khana khane ka wait karungi."}],"ans":3,"exp":{"en":"Kyun sahi hai: Khana khana pehle zaroori hai, phir khelna chahiye.","ur":"Kyun sahi hai: Khana khana pehle zaroori hai, phir khelna chahiye."}}],"demo":{"type":"listen","title":{"en":"Listen and order","ur":"Suno aur tarteeb do"},"prompt":{"en":"Play the instruction, then tap steps in order.","ur":"Hidayat play karo, phir steps tarteeb se chuo."},"instruction":{"en":"First touch your book, next clap twice, last sit down.","ur":"Pehle kitaab chuo, phir do dafa taali bajao, aakhir mein baith jao."},"steps":[["Touch your book","Apni kitaab chuo"],["Clap twice","Do dafa taali bajao"],["Sit down","Baith jao"]]}};(function(){"use strict";var d=DATA,lang="en",tab="play",sel=null,qd=0,sc=0,last="";function $(x){return document.getElementById(x)}function t(x){return x&&typeof x==="object"?(x[lang]||x.en||""):String(x||"")}function set(e,x){if(!e)return;e.textContent=t(x);e.dir=lang==="ur"?"rtl":"ltr"}function say(x){last=t(x);try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(last);u.lang=lang==="ur"?"ur-PK":"en-US";u.rate=.9;speechSynthesis.speak(u)}c
