<style>
/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

  :root{
    --board:#e8f0ea;--board-deep:#c5d8c8;--sky:#7eb8d4;--sky2:#4a8fb8;
    --park:#5a9a6a;--park2:#3a7a4a;--accent:#0d5c3d;--flag-g:#01411C;
    --ok:#2e7d4f;--ink:#1a2e22;--ink-soft:#4a5a4e;--paper:#fdfaf3;
    --line:#d0dcc8;--gold:#d4a017;--left:#c4453a;
    --good-bin:#0d5c3d;--opp-bin:#c4453a;
    --home:#c45c3a;--school:#2f6fb5;--hood:#0d5c3d;
    --fs-cap:clamp(14px, 3.8vw, 16px);--fs-xs:clamp(16px, 4.2vw, 18px);--fs-sm:clamp(18px, 4.8vw, 20px);--fs-md:clamp(19px, 5.2vw, 22px);--fs-lg:clamp(22px, 6vw, 26px);--fs-xl:clamp(30px, 8vw, 38px);--lh:1.5;
  }
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);--fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);--fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);--lh:2.1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .stars{display:flex;align-items:center;gap:6px;font-weight:800;font-size:var(--fs-xs);
         background:#fff6e2;border:2px solid var(--gold);border-radius:999px;padding:7px 13px}
  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}
  .tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
  .tabs button{
    flex:1 1 28%;min-width:90px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:10px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:54px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .tabs button .badge{color:var(--gold)}
  .story{
    background:#fff8ea;border:2px dashed var(--gold);border-radius:16px;padding:13px 15px;
    font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6;margin-bottom:14px;
  }
  body.urdu .story{line-height:var(--lh)}
  .story b{color:var(--ink)}
  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:
      radial-gradient(circle at 12% 18%, rgba(212,160,23,.18) 0 8px, transparent 9px),
      radial-gradient(circle at 88% 22%, rgba(13,92,61,.12) 0 6px, transparent 7px),
      linear-gradient(180deg,var(--sky) 0%,var(--sky2) 34%,#a8c9a0 34%,#8fb888 42%,var(--board) 42%);
    min-height:280px;
  }
  .scene-pad{padding:10px 12px 18px;min-height:260px;position:relative}
  .sky-layer{position:absolute;inset:0 0 58% 0;pointer-events:none;overflow:hidden}
  .crescent-deco{
    position:absolute;top:10px;right:16px;width:36px;height:36px;z-index:1;
  }
  body.urdu .crescent-deco{right:auto;left:16px}
  .cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:40px;opacity:.9}
  .cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
  .c1{width:48px;height:15px;top:18px;left:12%}
  .c1:before{width:22px;height:22px;top:-12px;left:6px}
  .c1:after{width:18px;height:18px;top:-8px;left:24px}
  .c2{width:34px;height:12px;top:34px;left:55%;opacity:.7}
  .c2:before{width:16px;height:16px;top:-9px;left:4px}
  .c2:after{width:12px;height:12px;top:-5px;left:16px}
  .hills{position:absolute;left:0;right:0;bottom:42%;height:40px;z-index:1;pointer-events:none}
  .hill{position:absolute;bottom:0;border-radius:50% 50% 0 0;
        background:linear-gradient(180deg,#4a8a5a,#2d5530)}
  .h-a{width:42%;height:36px;left:-4%;opacity:.55}
  .h-b{width:38%;height:28px;right:8%;opacity:.5}
  .ground-strip{
    position:absolute;left:0;right:0;bottom:0;height:32%;
    background:
      repeating-linear-gradient(90deg, transparent 0 18px, rgba(13,92,61,.06) 18px 20px),
      linear-gradient(180deg,#8fbc78 0%,#6a9a58 100%);
    z-index:2;border-top:3px solid #4a7040;
  }
  .geom-edge{
    position:absolute;left:0;right:0;bottom:31%;height:6px;z-index:3;pointer-events:none;
    background:repeating-linear-gradient(90deg, var(--gold) 0 8px, var(--accent) 8px 16px, transparent 16px 20px);
    opacity:.55;
  }
  .comic-stage{position:relative;z-index:5;padding-top:78px;text-align:center;min-height:150px}
  .comic-hero{font-size:56px;line-height:1;margin:4px 0 8px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
  .comic-panel{
    display:inline-flex;align-items:center;gap:8px;background:rgba(253,250,243,.95);
    border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px;margin:4px;
    box-shadow:0 3px 0 rgba(30,42,26,.12);font-weight:800;font-size:var(--fs-cap);
  }
  .comic-panel .em{font-size:28px}
  .sort-grid{
    position:relative;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:10px;
    padding-top:88px;
  }
  .sort-bin{
    border:2.5px solid var(--ink);border-radius:14px;padding:10px 8px;min-height:120px;
    background:rgba(253,250,243,.88);text-align:center;cursor:pointer;
  }
  .sort-bin.good-bin{border-color:var(--good-bin);background:rgba(230,242,234,.95)}
  .sort-bin.opp-bin{border-color:var(--opp-bin);background:rgba(251,234,232,.92)}
  .sort-bin.hot{box-shadow:0 0 0 3px rgba(13,92,61,.3)}
  .sort-bin h3{margin:0 0 8px;font-size:var(--fs-cap);font-weight:800}
  .sort-bin .drop{min-height:60px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
  .item-card{
    background:rgba(253,250,243,.95);border:2.5px solid var(--ink);border-radius:16px;
    padding:8px 10px 10px;text-align:center;min-width:72px;max-width:120px;
    box-shadow:0 3px 0 rgba(30,42,26,.15);cursor:pointer;user-select:none;
  }
  .item-card:hover{transform:translateY(-2px)}
  .item-card.selected{border-color:var(--accent);background:#e8f5ec;box-shadow:0 0 0 3px rgba(13,92,61,.25)}
  .item-card.ok{border-color:var(--ok);background:#e8f2ed}
  .item-card.no{border-color:var(--left);background:#fbeae8}
  .item-em{font-size:34px;line-height:1.1;display:block;margin-bottom:2px}
  .item-lab{font-size:var(--fs-cap);font-weight:800;line-height:1.25;margin:0}
  .bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;position:relative;z-index:5}
  .mini-chip{
    border:2px solid var(--ink);border-radius:12px;padding:6px 8px;background:#fff;
    line-height:1;cursor:pointer;min-width:40px;font-size:22px;
  }
  .save-choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .save-choices button{
    border:2.5px solid var(--ink);background:var(--paper);border-radius:14px;
    padding:12px 14px;font:inherit;font-weight:800;font-size:var(--fs-xs);
    cursor:pointer;text-align:left;min-height:52px;display:flex;align-items:center;gap:10px;
  }
  body.urdu .save-choices button{text-align:right}
  .save-choices button .cem{font-size:26px}
  .save-choices button.right{border-color:var(--ok);background:#e8f2ed}
  .save-choices button.wrong{border-color:var(--left);background:#fbeae8}
  .map-row{
    position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:8px;
    justify-content:center;align-items:stretch;padding-top:88px;min-height:130px;
  }
  .map-node{
    flex:1 1 28%;min-width:90px;border:2.5px solid var(--ink);border-radius:16px;
    background:rgba(253,250,243,.95);padding:10px 8px;text-align:center;
    box-shadow:0 3px 0 rgba(30,42,26,.12);
  }
  .map-node .nem{font-size:36px;line-height:1;display:block;margin-bottom:4px}
  .map-node .nlab{font-size:var(--fs-cap);font-weight:800;margin:0}
  .map-node.home{border-color:var(--home)}
  .map-node.school{border-color:var(--school)}
  .map-node.hood{border-color:var(--hood)}
  .map-node.done{background:#e8f2ed;border-color:var(--ok)}
  .map-arrow{font-size:20px;font-weight:800;color:var(--accent);align-self:center}
  .readout{
    margin-top:-18px;position:relative;z-index:2;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.win{background:var(--ok)}
  .statechip.miss{background:var(--left)}
  .headline{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .headline.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
  .hintbox{
    margin-top:14px;border:2px solid var(--accent);background:#e8f5ec;border-radius:14px;
    padding:11px 14px;font-size:var(--fs-xs);color:var(--accent);font-weight:700;line-height:1.55;
    display:none;
  }
  .hintbox.show{display:block}
  body.urdu .hintbox{line-height:var(--lh)}
  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .prog{margin:0 0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft)}
  .btns{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}
  .btns button{
    border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);
    font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;min-height:50px;
    padding:8px 14px;flex:1;
  }
  .btns .go{background:var(--ink);color:var(--paper)}
  .btns button:active{transform:scale(.97)}
  .btns button:disabled{opacity:.4;cursor:default}
  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .qhead h2{font-size:var(--fs-lg);font-weight:800;margin:0;flex:1}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--left);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}
  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}
  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar" "head  head" "tabs  tabs" "story story"
        "left  right" "quiz  quiz" "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .story{grid-area:story} .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation:none !important}
  }

          if (valuesDone[ch.id]) return;
          delete valuesSort[id];
          renderValues();
        });
        (bin==="good"?$("binGood"):$("binOpp")).appendChild(el);
      });

      var bank = document.createElement("div");
      bank.className = "bank";
      ch.items.forEach(function(id){
        if (valuesSort[id]) return;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "item-card" + (valuesSelected===id?" selected":"");
        b.innerHTML = '<span class="item-em">'+CARDS[id].em+'</span><p class="item-lab"></p>';
        setText(b.querySelector(".item-lab"), t(CARDS[id]));
        b.addEventListener("click", function(){
          if (valuesDone[ch.id]) return;
          valuesSelected = id;
          renderValues();
        });
        bank.appendChild(b);
      });
      box.appendChild(bank);

      if (!valuesDone[ch.id]){
        var chk = document.createElement("button");
        chk.type = "button";
        chk.style.cssText = "margin-top:10px;width:100%;border:2px solid var(--ink);border-radius:14px;background:var(--ink);color:var(--paper);font:inherit;font-weight:800;min-height:48px;cursor:pointer";
        setText(chk, t(T.checkSort));
        chk.addEventListener("click", function(){
          var ok = true;
          ch.items.forEach(function(id){
            if (valuesSort[id] !== CARDS[id].bin) ok = false;
          });
          if (ok && Object.keys(valuesSort).filter(function(k){ return ch.items.indexOf(k)>=0; }).length === ch.items.length){
            valuesDone[ch.id] = true;
            award("values-"+ch.id, 1);
            setText($("headline"), t(ch.done));
            $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
            setText($("statechip"), t(T.nice));
            maybeValuesDone();
            renderValues();
          } else {
            setText($("headline"), t(T.oops));
            $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
            setText($("statechip"), t(T.oops));
          }
        });
        box.appendChild(chk);
      }

      setText($("headline"), valuesDone[ch.id] ? t(ch.done) : t(ch.title));
      setText($("detail"), valuesSelected ? t(CARDS[valuesSelected]) + " → ?" : t(T.askSort));
    } else {
      var card = CARDS[ch.card];
      pad.innerHTML = skyHTML() +
        '<div class="comic-stage">' + kidsSVG() +
        '<div class="comic-panel"><span class="em">'+card.em+'</span><span class="plab"></span></div></div>';
      setText(pad.querySelector(".plab"), t(card));

      setText($("headline"), valuesDone[ch.id] ? t(ch.done) : t(ch.title));
      setText($("detail"), t(T.askPick));

      var choices = document.createElement("div");
      choices.className = "save-choices";
      [
        {id:"good", em:"💚", en:"Seerat beauty", ur:"سیرت کی خوبصورتی"},
        {id:"opp", em:"🚫", en:"Opposite", ur:"الٹ"}
      ].forEach(function(c){
        var b = document.createElement("button");
        b.type = "button";
        if (valuesDone[ch.id] && c.id === card.bin) b.classList.add("right");
        b.innerHTML = '<span class="cem">'+c.em+'</span><span class="clab"></span>';
        setText(b.querySelector(".clab"), t(c));
        b.disabled = !!valuesDone[ch.id];
        b.addEventListener("click", function(){
          if (valuesDone[ch.id]) return;
          if (c.id === card.bin){
            valuesDone[ch.id] = true;
            award("values-"+ch.id, 1);
            b.classList.add("right");
            setText($("headline"), t(ch.done));
            $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
            setText($("statechip"), t(T.nice));
            maybeValuesDone();
            renderValues();
          } else {
            b.classList.add("wrong");
            setText($("headline"), t(T.oops));
            $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
            setText($("statechip"), t(T.oops));
            setTimeout(function(){ b.classList.remove("wrong"); }, 600);
          }
        });
        choices.appendChild(b);
      });
      box.appendChild(choices);
    }
    setText($("prog"), t(T.progV) + ": " + Object.keys(valuesDone).length + "/" + VALUES.length);
  }

  /* ---------- STORIES ---------- */
  function renderStories(){
    var ch = STORIES[storiesIdx];
    var pad = $("scenePad");
    pad.innerHTML = skyHTML() +
      '<div class="comic-stage"><div class="comic-hero">'+ch.hero+'</div>' +
      '<div class="comic-panel"><span class="em">🧒</span><span class="plab"></span></div></div>';
    setText(pad.querySelector(".plab"), t(ch.title));

    setText($("statechip"), (storiesIdx+1) + " / " + STORIES.length);
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (storiesDone[ch.id]?" win":"");
    if (storiesDone[ch.id]) setText($("statechip"), t(T.nice));
    setText($("headline"), storiesDone[ch.id] ? t(ch.done) : t(ch.title));
    setText($("detail"), t(ch.prompt));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    var choices = document.createElement("div");
    choices.className = "save-choices";
    ch.choices.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button";
      if (storiesDone[ch.id] && c.id === ch.correct) b.classList.add("right");
      b.innerHTML = '<span class="cem">'+c.em+'</span><span class="clab"></span>';
      setText(b.querySelector(".clab"), t(c));
      b.disabled = !!storiesDone[ch.id];
      b.addEventListener("click", function(){
        if (storiesDone[ch.id]) return;
        if (c.id === ch.correct){
          storiesDone[ch.id] = true;
          award("stories-"+ch.id, 1);
          b.classList.add("right");
          setText($("headline"), t(ch.done));
          $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.nice));
          maybeStoriesDone();
          tabBadges();
          renderStories();
        } else {
          b.classList.add("wrong");
          setText($("headline"), t(T.oops));
          $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.oops));
          setTimeout(function(){ b.classList.remove("wrong"); }, 600);
        }
      });
      choices.appendChild(b);
    });
    box.appendChild(choices);
    setText($("prog"), t(T.progS) + ": " + Object.keys(storiesDone).length + "/" + STORIES.length);
  }

  /* ---------- AMAL ---------- */
  function renderAmal(){
    var ch = AMAL[amalIdx];
    var pad = $("scenePad");
    if (amalDone.a1) amalPlaces.home = true;
    if (amalDone.a2) amalPlaces.school = true;
    if (amalDone.a3) amalPlaces.hood = true;

    pad.innerHTML = skyHTML() +
      '<div class="map-row">' +
        '<div class="map-node home'+(amalPlaces.home?" done":"")+'"><span class="nem">🏠</span><p class="nlab" id="mapHome"></p></div>' +
        '<span class="map-arrow">→</span>' +
        '<div class="map-node school'+(amalPlaces.school?" done":"")+'"><span class="nem">🏫</span><p class="nlab" id="mapSchool"></p></div>' +
        '<span class="map-arrow">→</span>' +
        '<div class="map-node hood'+(amalPlaces.hood?" done":"")+'"><span class="nem">🤝</span><p class="nlab" id="mapHood"></p></div>' +
      '</div>';
    setText($("mapHome"), t(T.home));
    setText($("mapSchool"), t(T.school));
    setText($("mapHood"), t(T.hood));

    setText($("statechip"), (amalIdx+1) + " / " + AMAL.length);
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (amalDone[ch.id]?" win":"");
    if (amalDone[ch.id]) setText($("statechip"), t(T.nice));
    setText($("headline"), amalDone[ch.id] ? t(ch.done) : t(ch.title));
    setText($("detail"), t(ch.prompt));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    var choices = document.createElement("div");
    choices.className = "save-choices";
    ch.choices.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button";
      if (amalDone[ch.id] && c.id === ch.correct) b.classList.add("right");
      b.innerHTML = '<span class="cem">'+c.em+'</span><span class="clab"></span>';
      setText(b.querySelector(".clab"), t(c));
      b.disabled = !!amalDone[ch.id];
      b.addEventListener("click", function(){
        if (amalDone[ch.id]) return;
        if (c.id === ch.correct){
          amalDone[ch.id] = true;
          if (ch.place === "home") amalPlaces.home = true;
          if (ch.place === "school") amalPlaces.school = true;
          if (ch.place === "hood") amalPlaces.hood = true;
          award("amal-"+ch.id, 1);
          b.classList.add("right");
          setText($("headline"), t(ch.done));
          $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.nice));
          maybeAmalDone();
          tabBadges();
          renderAmal();
        } else {
          b.classList.add("wrong");
          setText($("headline"), t(T.oops));
          $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.oops));
          setTimeout(function(){ b.classList.remove("wrong"); }, 600);
        }
      });
      choices.appendChild(b);
    });
    box.appendChild(choices);
    setText($("prog"), t(T.progA) + ": " + Object.keys(amalDone).length + "/" + AMAL.length);
  }

  /* ---------- QUIZ ---------- */
  function pickQuiz(){ quizSet = shuffle(QUIZ).slice(0, 5); }
  function renderQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizSet.forEach(function(item, qi){
      var wrap = document.createElement("div");
      wrap.className = "q";
      var p = document.createElement("p");
      if (lang === "ur"){
        p.textContent = isolate((qi+1) + ". " + t(item.q));
        p.classList.remove("ur");
        p.setAttribute("dir", "ltr");
        p.style.fontFamily = '"Baloo Bhaijaan 2",sans-serif';
        p.style.lineHeight = "1.5";
      } else {
        setText(p, (qi+1) + ". " + t(item.q));
      }
      wrap.appendChild(p);
      var answered = false;
      item.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        if (lang === "ur"){
          b.className = "opt";
          b.textContent = isolate(t(opt));
          b.setAttribute("dir", "ltr");
          b.style.textAlign = "left";
          b.style.fontFamily = '"Baloo Bhaijaan 2",sans-serif';
        } else {
          b.className = "opt";
          setText(b, t(opt));
        }
        b.addEventListener("click", function(){
          if (answered) return;
          answered = true;
          if (oi === item.correct){
            b.classList.add("right");
            award("quiz-"+qi, 1);
          } else {
            b.classList.add("wrong");
            var kids = wrap.querySelectorAll(".opt");
            if (kids[item.correct]) kids[item.correct].classList.add("right");
          }
          fb.classList.add("show");
        });
        wrap.appendChild(b);
      });
      var fb = document.createElement("p");
      fb.className = "fb";
      if (lang === "ur"){
        fb.textContent = isolate(t(item.why));
        fb.setAttribute("dir", "ltr");
        fb.style.fontFamily = '"Baloo Bhaijaan 2",sans-serif';
      } else {
        setText(fb, t(item.why));
      }
      wrap.appendChild(fb);
      box.appendChild(wrap);
    });
  }

  function storyHtml(){
    if (mode === "values") return t(T.storyValues);
    if (mode === "stories") return t(T.storyStories);
    return t(T.storyAmal);
  }

  function tabBadges(){
    function lab(btn, label, key){
      btn.innerHTML = "";
      var span = document.createElement("span");
      setText(span, t(label));
      btn.appendChild(span);
      if (doneModes[key]){
        var b = document.createElement("span");
        b.className = "badge"; b.textContent = " ★";
        btn.appendChild(b);
      }
    }
    lab($("tabValues"), T.tabValues, "values");
    lab($("tabStories"), T.tabStories, "stories");
    lab($("tabAmal"), T.tabAmal, "amal");
    $("tabValues").setAttribute("aria-pressed", mode==="values"?"true":"false");
    $("tabStories").setAttribute("aria-pressed", mode==="stories"?"true":"false");
    $("tabAmal").setAttribute("aria-pressed", mode==="amal"?"true":"false");
  }

  function setMode(m){
    mode = m;
    valuesSelected = null;
    if (mode === "values") renderValues();
    else if (mode === "stories") renderStories();
    else renderAmal();
    applyChrome();
  }

  function applyChrome(){
    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    $("story").innerHTML = storyHtml();
    $("story").classList.toggle("ur", lang==="ur");
    $("story").setAttribute("dir", lang==="ur"?"rtl":"ltr");
    setText($("ctlHead"), t(T.ctl));
    setText($("nextBtn"), t(T.next));
    setText($("hintBtn"), t(T.hint));
    setText($("resetBtn"), t(T.reset));
    setText($("quizHead"), t(T.quiz));
    setText($("newQuiz"), t(T.newQuiz));
    $("langBtn").textContent = (lang === "en") ? "اردو" : "EN";
    $("langBtn").setAttribute("aria-pressed", lang==="ur"?"true":"false");
    document.body.classList.toggle("urdu", lang==="ur");
    document.documentElement.lang = (lang==="ur") ? "ur" : "en";
    document.documentElement.dir = (lang==="ur") ? "rtl" : "ltr";
    tabBadges();
    var foot = document.querySelector("footer p");
    if (foot) setText(foot, foot.getAttribute(lang==="ur"?"data-ur":"data-en"));
  }

  function applyLang(){
    applyChrome();
    if (mode === "values") renderValues();
    else if (mode === "stories") renderStories();
    else renderAmal();
    renderQuiz();
  }

  function next(){
    if (mode === "values"){
      valuesIdx = (valuesIdx + 1) % VALUES.length;
      valuesSelected = null;
      if (VALUES[valuesIdx].type === "sort"){
        valuesSort = {};
      }
      renderValues();
    } else if (mode === "stories"){
      storiesIdx = (storiesIdx + 1) % STORIES.length;
      renderStories();
    } else {
      amalIdx = (amalIdx + 1) % AMAL.length;
      renderAmal();
    }
  }

  function showHint(){
    var h;
    if (mode === "values") h = VALUES[valuesIdx].hint;
    else if (mode === "stories") h = STORIES[storiesIdx].hint;
    else h = AMAL[amalIdx].hint;
    var hb = $("hintbox");
    setText(hb, t(h));
    hb.classList.add("show");
  }

  function resetMode(){
    if (mode === "values"){
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("values-")===0 || k==="mode-values") delete awarded[k]; });
      valuesDone = {}; valuesSort = {}; valuesSelected = null; valuesIdx = 0;
      doneModes.values = false;
      recountStars(); renderValues();
    } else if (mode === "stories"){
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("stories-")===0 || k==="mode-stories") delete awarded[k]; });
      storiesDone = {}; storiesIdx = 0; doneModes.stories = false;
      recountStars(); renderStories();
    } else {
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("amal-")===0 || k==="mode-amal") delete awarded[k]; });
      amalDone = {}; amalIdx = 0; amalPlaces = {home:false, school:false, hood:false}; doneModes.amal = false;
      recountStars(); renderAmal();
    }
    tabBadges();
    applyChrome();
  }

  function cleanSpeakText(s){
    return String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  function buildSpeakText(){
    var bits = [];
    bits.push(t(T.title));
    bits.push(cleanSpeakText(storyHtml()));
    bits.push(cleanSpeakText(($("headline") && $("headline").textContent) || ""));
    bits.push(cleanSpeakText(($("detail") && $("detail").textContent) || ""));
    bits.push(t(T.tip));
    return bits.filter(Boolean).join(". ");
  }
  function pickVoice(voices, want){
    var i, v, L;
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf(want) === 0) return v;
    }
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf("en") === 0) return v;
    }
    return voices[0] || null;
  }
  var speakTimer = null;
  function setSpeaking(on){
    var btn = $("speakBtn");
    if (!btn) return;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.style.opacity = on ? "0.65" : "";
  }
  function doSpeak(text, asLang){
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92;
    u.lang = (asLang === "ur") ? "ur-PK" : "en-US";
    var voices = window.speechSynthesis.getVoices() || [];
    var voice = pickVoice(voices, asLang === "ur" ? "ur" : "en");
    if (voice) u.voice = voice;
    u.onstart = function(){ setSpeaking(true); };
    u.onend = function(){ setSpeaking(false); };
    u.onerror = function(){
      setSpeaking(false);
      if (asLang === "ur"){
        var fallback = cleanSpeakText(T.title.en + ". " + T.storyValues.en + ". " + T.tip.en);
        var u2 = new SpeechSynthesisUtterance(fallback);
        u2.lang = "en-US"; u2.rate = 0.92;
        var v2 = pickVoice(window.speechSynthesis.getVoices() || [], "en");
        if (v2) u2.voice = v2;
        u2.onstart = function(){ setSpeaking(true); };
        u2.onend = u2.onerror = function(){ setSpeaking(false); };
        window.speechSynthesis.speak(u2);
      }
    };
    window.speechSynthesis.speak(u);
  }
  if ("speechSynthesis" in window){
    try { window.speechSynthesis.getVoices(); } catch (e0) {}
    if (typeof window.speechSynthesis.addEventListener === "function"){
      window.speechSynthesis.addEventListener("voiceschanged", function(){
        try { window.speechSynthesis.getVoices(); } catch (e1) {}
      });
    }
  } else {
    var noBtn = $("speakBtn");
    if (noBtn){ noBtn.disabled = true; noBtn.title = "Voice not available on this device"; }
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });
  $("tabValues").addEventListener("click", function(){ setMode("values"); });
  $("tabStories").addEventListener("click", function(){ setMode("stories"); });
  $("tabAmal").addEventListener("click", function(){ setMode("amal"); });
  $("nextBtn").addEventListener("click", next);
  $("hintBtn").addEventListener("click", showHint);
  $("resetBtn").addEventListener("click", resetMode);
  $("newQuiz").addEventListener("click", function(){ pickQuiz(); renderQuiz(); });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      var text = buildSpeakText();
      if (!text) return;
      if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
      window.speechSynthesis.cancel();
      setSpeaking(false);
      var speakLang = lang;
      speakTimer = setTimeout(function(){
        speakTimer = null;
        doSpeak(text, speakLang);
      }, 80);
    }catch(e){ setSpeaking(false); }
  });

  pickQuiz();
  applyLang();
})();
</script>
</body>
</html>
