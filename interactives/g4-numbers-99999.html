{id:"qord",q:{en:"Which list is ascending (small to big)?",ur:"صعودی ترتیب (چھوٹے سے بڑا) کون سی ہے؟"},ru:"Ascending (chhote se bara) kaun si line hai?",opts:[{en:"2,910 ; 2,190 ; 2,019",ur:"2,910 ; 2,190 ; 2,019"},{en:"2,190 ; 2,019 ; 2,910",ur:"2,190 ; 2,019 ; 2,910"},{en:"2,019 ; 2,190 ; 2,910",ur:"2,019 ; 2,190 ; 2,910"},{en:"2,019 ; 2,910 ; 2,190",ur:"2,019 ; 2,910 ; 2,190"}],correct:2,why:{en:"Ascending is small to big: 2,019 < 2,190 < 2,910. Descending is the opposite, big to small.",ur:"صعودی چھوٹے سے بڑا ہے: 2,019 < 2,190 < 2,910۔ نزولی اس کا الٹ ہے، بڑے سے چھوٹا۔"}},
{id:"q10k",q:{en:"Round 64,800 to the nearest 10,000.",ur:"64,800 کو قریب ترین 10,000 پر گول کرو۔"},ru:"64,800 ko nearest 10,000 par round karo.",opts:[{en:"65,000",ur:"65,000"},{en:"60,000",ur:"60,000"},{en:"70,000",ur:"70,000"},{en:"64,000",ur:"64,000"}],correct:1,why:{en:"Nearest 10,000 looks at the thousands digit. Thousands is 4, and 0 to 4 stays, so 64,800 becomes 60,000. The answer is still under 99,999.",ur:"قریب ترین 10,000 ہزار کا ہندسہ دیکھتی ہے۔ ہزار 4 ہے، 0 سے 4 رہتا ہے، اس لیے 64,800 سے 60,000۔ جواب اب بھی 99,999 سے کم ہے۔"}}
];
var placeIdx=0,placeDone={},expandBuilt=[],tileFor="",tileOrder=[];
var compIdx=0,compDone={};
var romIdx=0,romDone={},romMap={};
var optKey="",optOrder=[],quizSet=[],quizState={};

function award(key,n){if(awarded[key])return;awarded[key]=true;stars+=(n||1);$("starCount").textContent=String(stars)}
function recountStars(){stars=0;Object.keys(awarded).forEach(function(k){stars+=(k.indexOf("mode-")===0)?2:1});$("starCount").textContent=String(stars)}
function markWin(prefix,id,doneMap,modeKey,total){if(doneMap[id])return;doneMap[id]=true;award(prefix+"-"+id,1);if(Object.keys(doneMap).length>=total){doneModes[modeKey]=true;award("mode-"+modeKey,2)}tabBadges()}
function skyHTML(){return '<div class="sky-layer"><div class="sun-ball"></div><div class="cloud c1"></div><div class="cloud c2"></div></div>'}
function prepScene(){var pad=$("scenePad");pad.innerHTML=skyHTML();var stage=document.createElement("div");stage.className="num-stage";pad.appendChild(stage);return stage}
function addBlurb(stage,ch){var em=document.createElement("div");em.className="hero-em";em.textContent=ch.em||"🔢";stage.appendChild(em);var box=document.createElement("div");box.className="card-box";setText(box,t(ch.blurb));stage.appendChild(box)}
function addHero(stage,n){var h=document.createElement("div");h.className="num-hero";h.textContent=fmt(n);stage.appendChild(h);var s=document.createElement("p");s.className="sayline";setText(s,readOf(n));stage.appendChild(s)}
function addCap(stage,msg){var c=document.createElement("div");c.className="capline";setText(c,msg);stage.appendChild(c)}
function showStep(i,n){setText($("statechip"),(i+1)+" / "+n);$("statechip").className="statechip"+(lang==="ur"?" ur":"")}
function showWin(msg){setText($("headline"),msg);$("statechip").className="statechip win"+(lang==="ur"?" ur":"");setText($("statechip"),t(T.nice))}
function showMiss(){setText($("headline"),t(T.oops));$("statechip").className="statechip miss"+(lang==="ur"?" ur":"");setText($("statechip"),t(T.oops))}
function stableOrder(key,arr){if(optKey!==key){optKey=key;optOrder=shuffle(arr)}return optOrder}
function clearHint(){$("hintbox").classList.remove("show")}
function renderPlace(){
  var ch=PLACE[placeIdx],stage=prepScene();
  addBlurb(stage,ch);
  if(ch.kind==="expand"){
    var eq=document.createElement("div");eq.className="eqline";var bits=[],i;
    var src=placeDone[ch.id]?ch.parts.map(function(v){return{v:v}}):expandBuilt;for(i=0;i<ch.parts.length;i++)bits.push(src[i]?fmt(src[i].v):"___");
    eq.textContent=fmt(ch.n)+"  =  "+bits.join("  +  ");stage.appendChild(eq);
    addCap(stage,lang==="en"?"Skip a zero place. Biggest value first.":"صفر والی جگہ چھوڑ دو۔ پہلے سب سے بڑی قیمت۔");
  }else{
    addHero(stage,ch.n);
    var row=document.createElement("div");row.className="drow";
    var ds=digitsOf(ch.n),wi=(ch.kind==="digit")?placeIndex(ch.which):-1;
    ds.forEach(function(d,di){var sp=document.createElement("span");sp.className="dshow";if(ch.kind==="place"&&di===ch.hot)sp.className+=" hot";if(placeDone[ch.id]&&ch.kind==="digit"&&di===wi)sp.className+=" win";sp.textContent=d;row.appendChild(sp)});
    stage.appendChild(row);addCap(stage,t(T.leftBig));
  }
  showStep(placeIdx,PLACE.length);setText($("headline"),t(ch.title));
  setText($("detail"),placeDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(placeDone[ch.id])showWin(t(ch.done));
  var box=$("actionBox");box.innerHTML="";
  if(ch.kind==="digit"){
    var bank=document.createElement("div");bank.className="bank ltrb";
    var digs=digitsOf(ch.n),want=placeIndex(ch.which);
    digs.forEach(function(d,di){
      var b=document.createElement("button");b.type="button";b.className="mini-item dig";b.textContent=d;b.setAttribute("dir","ltr");
      if(placeDone[ch.id]&&di===want)b.classList.add("right");b.disabled=!!placeDone[ch.id];
      b.addEventListener("click",function(){if(placeDone[ch.id])return;if(di===want){markWin("place",ch.id,placeDone,"place",PLACE.length);renderPlace()}else{b.classList.add("wrong");showMiss()}});
      bank.appendChild(b);
    });
    box.appendChild(bank);
  }else if(ch.kind==="place"){
    var choices=document.createElement("div");choices.className="save-choices";
    var order=stableOrder("place-"+ch.id,PLACES.map(function(p){return p.id}));
    var hotPlace=["tt","th","h","t","o"][ch.hot];
    order.forEach(function(pid){
      var p=placeById(pid),b=document.createElement("button");b.type="button";setText(b,placeLabel(p));
      if(placeDone[ch.id]&&pid===hotPlace)b.classList.add("right");b.disabled=!!placeDone[ch.id];
      b.addEventListener("click",function(){if(placeDone[ch.id])return;if(pid===hotPlace){markWin("place",ch.id,placeDone,"place",PLACE.length);renderPlace()}else{b.classList.add("wrong");showMiss()}});
      choices.appendChild(b);
    });
    box.appendChild(choices);
  }else{
    if(tileFor!==ch.id){tileFor=ch.id;var tiles=[];ch.parts.forEach(function(v,i){tiles.push({v:v,k:"g"+i})});ch.traps.forEach(function(v,i){tiles.push({v:v,k:"t"+i})});tileOrder=shuffle(tiles);expandBuilt=[]}
    var tbank=document.createElement("div");tbank.className="bank ltrb";
    tileOrder.forEach(function(tile){
      var used=false,ui;if(placeDone[ch.id]){if(tile.k.charAt(0)==="g")used=true}else{for(ui=0;ui<expandBuilt.length;ui++)if(expandBuilt[ui].k===tile.k)used=true}
      var b=document.createElement("button");b.type="button";b.className="mini-item tile"+(used?" used":"")+(placeDone[ch.id]&&tile.k.charAt(0)==="g"?" right":"");b.textContent=fmt(tile.v);b.disabled=used||!!placeDone[ch.id];
      b.addEventListener("click",function(){if(placeDone[ch.id]||used)return;var expect=ch.parts[expandBuilt.length];if(tile.v===expect){expandBuilt.push({k:tile.k,v:tile.v});if(expandBuilt.length===ch.parts.length)markWin("place",ch.id,placeDone,"place",PLACE.length);renderPlace()}else{b.classList.add("wrong");showMiss()}});
      tbank.appendChild(b);
    });
    box.appendChild(tbank);
  }
  setText($("prog"),t(T.progPlace)+": "+Object.keys(placeDone).length+"/"+PLACE.length);
}
function renderCompare(){
  var ch=COMP[compIdx],stage=prepScene();addBlurb(stage,ch);
  if(ch.kind==="round"){
    addHero(stage,ch.n);
    var badge=document.createElement("div");badge.className="capline";setText(badge,(lang==="en"?"Nearest ":"قریب ترین ")+fmt(ch.step));stage.appendChild(badge);
  }else{
    var row=document.createElement("div");row.className="eqline";
    var nums=[];ch.opts.forEach(function(o){if(o.n)nums.push(fmt(o.n))});
    row.textContent=nums.join("   ·   ");stage.appendChild(row);
    addCap(stage,lang==="en"?"Compare from the left. Same digits, then look at the next place.":"بائیں سے دیکھو۔ ایک جیسے ہندسے چھوڑ کر اگلی جگہ دیکھو۔");
  }
  showStep(compIdx,COMP.length);setText($("headline"),t(ch.title));setText($("detail"),compDone[ch.id]?t(ch.why):t(ch.ask));clearHint();if(compDone[ch.id])showWin(t(ch.done));
  var box=$("actionBox");box.innerHTML="";var choices=document.createElement("div");choices.className="save-choices";
  stableOrder("comp-"+ch.id,ch.opts.slice()).forEach(function(opt){
    var b=document.createElement("button");b.type="button";
    if(opt.eq){setText(b,t(T.equal))}else{b.className="numc";b.textContent=fmt(opt.n);b.setAttribute("dir","ltr")}
    if(compDone[ch.id]&&opt.id===ch.correct)b.classList.add("right");b.disabled=!!compDone[ch.id];
    b.addEventListener("click",function(){if(compDone[ch.id])return;if(opt.id===ch.correct){markWin("comp",ch.id,compDone,"compare",COMP.length);renderCompare()}else{b.classList.add("wrong");showMiss()}});
    choices.appendChild(b);
  });
  box.appendChild(choices);
  setText($("prog"),t(T.progCompare)+": "+Object.keys(compDone).length+"/"+COMP.length);
}

function renderRoman(){
  var ch=ROMAN[romIdx],stage=prepScene();addBlurb(stage,ch);
  var big=document.createElement("div");big.className="roman-big";
  big.textContent=(ch.kind==="pick")?ch.show:ch.rows.map(function(r){return r.sym}).join("  ");
  stage.appendChild(big);
  showStep(romIdx,ROMAN.length);setText($("headline"),t(ch.title));setText($("detail"),romDone[ch.id]?t(ch.why):t(ch.ask));clearHint();if(romDone[ch.id])showWin(t(ch.done));
  var box=$("actionBox");box.innerHTML="";
  if(ch.kind==="match"){
    var grid=document.createElement("div");grid.className="match-grid";
    ch.rows.forEach(function(row){
      var div=document.createElement("div");div.className="match-row";
      var sym=document.createElement("span");sym.className="sym";sym.textContent=row.sym;div.appendChild(sym);
      var opts=document.createElement("span");opts.className="match-opts";
      ch.choices.forEach(function(val){
        var b=document.createElement("button");b.type="button";b.textContent=String(val);
        if(romDone[ch.id]&&val===row.val)b.classList.add("right");
        else if(!romDone[ch.id]&&romMap[row.id]===val)b.classList.add("pick");
        b.disabled=!!romDone[ch.id];
        b.addEventListener("click",function(){if(romDone[ch.id])return;romMap[row.id]=val;renderRoman()});
        opts.appendChild(b);
      });
      div.appendChild(opts);grid.appendChild(div);
    });
    box.appendChild(grid);
    if(!romDone[ch.id]){
      var chk=document.createElement("button");chk.type="button";chk.className="chk";setText(chk,t(T.check));
      chk.addEventListener("click",function(){
        var ok=true,i;for(i=0;i<ch.rows.length;i++)if(romMap[ch.rows[i].id]!==ch.rows[i].val)ok=false;
        if(ok){markWin("rom",ch.id,romDone,"roman",ROMAN.length);renderRoman()}else showMiss();
      });
      box.appendChild(chk);
    }
  }else{
    var choices=document.createElement("div");choices.className="save-choices";
    stableOrder("rom-"+ch.id,ch.opts.slice()).forEach(function(opt){
      var b=document.createElement("button");b.type="button";setText(b,t(opt));
      if(romDone[ch.id]&&opt.id===ch.correct)b.classList.add("right");b.disabled=!!romDone[ch.id];
      b.addEventListener("click",function(){if(romDone[ch.id])return;if(opt.id===ch.correct){markWin("rom",ch.id,romDone,"roman",ROMAN.length);renderRoman()}else{b.classList.add("wrong");showMiss()}});
      choices.appendChild(b);
    });
    box.appendChild(choices);
  }
  setText($("prog"),t(T.progRoman)+": "+Object.keys(romDone).length+"/"+ROMAN.length);
}
function pickQuiz(){
  var pin=[],rest=[],i;quizState={};
  for(i=0;i<QUIZ.length;i++){if(QUIZ[i].pin)pin.push(QUIZ[i]);else rest.push(QUIZ[i])}
  rest=shuffle(rest);quizSet=shuffle(pin.concat(rest.slice(0,5-pin.length)));
}
function renderQuiz(){
  var box=$("quizBox");box.innerHTML="";
  quizSet.forEach(function(item,qi){
    var wrap=document.createElement("div");wrap.className="q";
    var p=document.createElement("p");setText(p,(qi+1)+". "+t(item.q));wrap.appendChild(p);
    if(lang==="en"&&item.ru){var g=document.createElement("p");g.className="gloss";g.textContent=item.ru;wrap.appendChild(g)}
    var st=quizState[item.id];
    item.opts.forEach(function(opt,oi){
      var b=document.createElement("button");b.type="button";b.className="opt"+(lang==="ur"?" ur":"");setText(b,t(opt));
      if(st&&oi===item.correct)b.classList.add("right");
      if(st==="no"&&quizState[item.id+"-pick"]===oi&&oi!==item.correct)b.classList.add("wrong");
      if(st)b.disabled=true;
      b.addEventListener("click",function(){
        if(quizState[item.id])return;
        quizState[item.id+"-pick"]=oi;
        if(oi===item.correct){quizState[item.id]="ok";b.classList.add("right");award("quiz-"+item.id,1)}
        else{quizState[item.id]="no";b.classList.add("wrong");var kids=wrap.querySelectorAll(".opt");if(kids[item.correct])kids[item.correct].classList.add("right")}
        fb.classList.add("show");
        var all=wrap.querySelectorAll(".opt"),k;for(k=0;k<all.length;k++)all[k].disabled=true;
      });
      wrap.appendChild(b);
    });
    var fb=document.createElement("p");fb.className="fb"+(st?" show":"");setText(fb,t(item.why));wrap.appendChild(fb);
    box.appendChild(wrap);
  });
}
function storyHtml(){if(mode==="place")return t(T.storyPlace);if(mode==="compare")return t(T.storyCompare);return t(T.storyRoman)}
function currentTip(){if(mode==="place")return T.tipPlace;if(mode==="compare")return T.tipCompare;return T.tipRoman}
function tabBadges(){
  function lab(btn,label,key){btn.innerHTML="";var span=document.createElement("span");setText(span,t(label));btn.appendChild(span);if(doneModes[key]){var b=document.createElement("span");b.className="badge";b.textContent=" ★";btn.appendChild(b)}}
  lab($("tabPlace"),T.tabPlace,"place");lab($("tabComp"),T.tabComp,"compare");lab($("tabRoman"),T.tabRoman,"roman");
  $("tabPlace").setAttribute("aria-pressed",mode==="place"?"true":"false");
  $("tabComp").setAttribute("aria-pressed",mode==="compare"?"true":"false");
  $("tabRoman").setAttribute("aria-pressed",mode==="roman"?"true":"false");
}
function renderCurrent(){if(mode==="place")renderPlace();else if(mode==="compare")renderCompare();else renderRoman()}
function setMode(m){mode=m;renderCurrent();applyChrome()}
function applyChrome(){
  setText($("title"),t(T.title));setText($("subtitle"),t(T.sub));
  $("story").innerHTML=storyHtml();$("story").classList.toggle("ur",lang==="ur");$("story").setAttribute("dir",lang==="ur"?"rtl":"ltr");
  setText($("ctlHead"),t(T.ctl));setText($("nextBtn"),t(T.next));setText($("hintBtn"),t(T.hint));setText($("resetBtn"),t(T.reset));
  setText($("quizHead"),t(T.quiz));setText($("newQuiz"),t(T.newQuiz));
  $("langBtn").textContent=(lang==="en")?"اردو":"EN";$("langBtn").setAttribute("aria-pressed",lang==="ur"?"true":"false");
  document.body.classList.toggle("urdu",lang==="ur");
  document.documentElement.lang=(lang==="ur")?"ur":"en";
  document.documentElement.dir=(lang==="ur")?"rtl":"ltr";
  document.title=t(T.title)+" | AI4Kids Class 4";
  tabBadges();
  var foot=document.querySelector("footer p");
  if(foot)setText(foot,foot.getAttribute(lang==="ur"?"data-ur":"data-en"));
}
function applyLang(){applyChrome();renderCurrent();renderQuiz()}
function next(){
  optKey="";
  if(mode==="place"){placeIdx=(placeIdx+1)%PLACE.length;tileFor="";expandBuilt=[];renderPlace()}
  else if(mode==="compare"){compIdx=(compIdx+1)%COMP.length;renderCompare()}
  else{romIdx=(romIdx+1)%ROMAN.length;romMap={};renderRoman()}
}
function showHint(){
  var h=mode==="place"?PLACE[placeIdx].hint:(mode==="compare"?COMP[compIdx].hint:ROMAN[romIdx].hint);
  var hb=$("hintbox");setText(hb,t(h));hb.classList.add("show");
}
function resetMode(){
  if(mode==="place"){Object.keys(awarded).forEach(function(k){if(k.indexOf("place-")===0||k==="mode-place")delete awarded[k]});placeDone={};placeIdx=0;tileFor="";expandBuilt=[];doneModes.place=false;recountStars();renderPlace()}
  else if(mode==="compare"){Object.keys(awarded).forEach(function(k){if(k.indexOf("comp-")===0||k==="mode-compare")delete awarded[k]});compDone={};compIdx=0;doneModes.compare=false;recountStars();renderCompare()}
  else{Object.keys(awarded).forEach(function(k){if(k.indexOf("rom-")===0||k==="mode-roman")delete awarded[k]});romDone={};romIdx=0;romMap={};doneModes.roman=false;recountStars();renderRoman()}
  optKey="";tabBadges();applyChrome();
}
function cleanSpeakText(s){return String(s||"").replace(/<[^>]+>/g," ").replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&amp;/g,"&").replace(/\s+/g," ").trim()}
function buildSpeakText(){
  var bits=[];bits.push(t(T.title));bits.push(cleanSpeakText(storyHtml()));
  bits.push(cleanSpeakText(($("headline")&&$("headline").textContent)||""));
  bits.push(cleanSpeakText(($("detail")&&$("detail").textContent)||""));
  bits.push(t(currentTip()));return bits.filter(Boolean).join(". ");
}
function pickVoice(voices,want){
  var i,v,L;for(i=0;i<voices.length;i++){v=voices[i];L=(v.lang||"").toLowerCase().replace("_","-");if(L.indexOf(want)===0)return v}
  for(i=0;i<voices.length;i++){v=voices[i];L=(v.lang||"").toLowerCase().replace("_","-");if(L.indexOf("en")===0)return v}
  return voices[0]||null;
}
function setSpeaking(on){var btn=$("speakBtn");if(!btn)return;btn.setAttribute("aria-pressed",on?"true":"false");btn.style.opacity=on?"0.65":""}
function doSpeak(text,asLang){
  var u=new SpeechSynthesisUtterance(text);u.rate=0.92;u.lang=(asLang==="ur")?"ur-PK":"en-US";
  var voices=window.speechSynthesis.getVoices()||[];var voice=pickVoice(voices,asLang==="ur"?"ur":"en");if(voice)u.voice=voice;
  u.onstart=function(){setSpeaking(true)};u.onend=function(){setSpeaking(false)};
  u.onerror=function(){setSpeaking(false);if(asLang==="ur"){var fallback=cleanSpeakText(T.title.en+". "+T.storyPlace.en+". "+T.tipPlace.en);var u2=new SpeechSynthesisUtterance(fallback);u2.lang="en-US";u2.rate=0.92;var v2=pickVoice(window.speechSynthesis.getVoices()||[],"en");if(v2)u2.voice=v2;u2.onstart=function(){setSpeaking(true)};u2.onend=u2.onerror=function(){setSpeaking(false)};window.speechSynthesis.speak(u2)}};
  window.speechSynthesis.speak(u);
}
if("speechSynthesis" in window){
  try{window.speechSynthesis.getVoices()}catch(e0){}
  if(typeof window.speechSynthesis.addEventListener==="function"){window.speechSynthesis.addEventListener("voiceschanged",function(){try{window.speechSynthesis.getVoices()}catch(e1){}})}
}else{var noBtn=$("speakBtn");if(noBtn){noBtn.disabled=true;noBtn.title="Voice not available on this device"}}
$("langBtn").addEventListener("click",function(){lang=(lang==="en")?"ur":"en";applyLang()});
$("tabPlace").addEventListener("click",function(){setMode("place")});
$("tabComp").addEventListener("click",function(){setMode("compare")});
$("tabRoman").addEventListener("click",function(){setMode("roman")});
$("nextBtn").addEventListener("click",next);
$("hintBtn").addEventListener("click",showHint);
$("resetBtn").addEventListener("click",resetMode);
$("newQuiz").addEventListener("click",function(){pickQuiz();renderQuiz()});
$("speakBtn").addEventListener("click",function(){
  try{
    if(!("speechSynthesis" in window))return;
    var text=buildSpeakText();if(!text)return;
    if(speakTimer){clearTimeout(speakTimer);speakTimer=null}
    window.speechSynthesis.cancel();setSpeaking(false);
    var speakLang=lang;
    speakTimer=setTimeout(function(){speakTimer=null;doSpeak(text,speakLang)},80);
  }catch(e){setSpeaking(false)}
});
pickQuiz();applyLang();
})();
</script>
