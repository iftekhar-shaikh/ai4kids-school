}

    --ink-soft:#554c41;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#1d4c85;

    --no:#c4453a;
    --trap:#c9702e;

  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}

  .tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
  .tabs button{
    flex:1;min-width:70px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);

    cursor:pointer;min-height:88px;color:var(--ink);line-height:1.25;
  }
  .tcard em{display:block;font-style:normal;font-size:var(--fs-xs);margin-top:4px;font-weight:700;opacity:.85}
  .tcard.p[aria-pressed="true"]{background:var(--past);border-color:var(--past);color:#fff}
  .tcard.n[aria-pressed="true"]{background:var(--now);border-color:var(--now);color:#fff}
  .tcard.f[aria-pressed="true"]{background:var(--fut);border-color:var(--fut);color:#fff}

  .toggle{display:flex;gap:8px;margin-top:12px}

    flex:1;border:3px solid var(--line);background:var(--paper);border-radius:14px;

  .toggle button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

    margin-top:12px;background:var(--paper);

  }

  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
  .formula{

  .pair{margin:8px 0 0;font-size:var(--fs-sm);font-weight:700;direction:ltr}
  .pair span{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:10px;padding:4px 10px;margin:3px}

  .lesson .block{
    border:3px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;
    background:var(--paper);
  }
  .lesson .tag{
    display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
    padding:3px 12px;font-size:var(--fs-cap);font-weight:800;margin-bottom:8px;

    flex:1 1 40%;border:3px solid var(--line);background:var(--paper);border-radius:14px;
    padding:12px 10px;font:inherit;font-weight:800;font-size:var(--fs-xs);
    cursor:pointer;min-height:54px;color:var(--ink);
  }
  .picks button.good{border-color:var(--ok);background:#e8f2ec;color:var(--ok)}
  .picks button.bad{border-color:var(--no);background:#fbeae8;color:var(--no)}

  .panel{margin-top:18px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .schip{
    border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;
    font:inherit;font-size:var(--fs-cap);font-weight:800;color:var(--ink);cursor:pointer;min-height:46px;
  }
  .schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .schip.done{border-color:var(--ok)}

  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:14px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:54px;
  }
  .opt.ur{text-align:right}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--no);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.6}
  .fb.show{display:block}
  .score{
    margin-top:8px;padding:14px 16px;border:3px solid var(--ink);border-radius:16px;
    font-weight:800;font-size:var(--fs-md);text-align:center;display:none;
  }
  .score.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "quiz quiz" "foot foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

    nowHint:{en:"now or habit", ur:"ابھی یا عادت"},
    futHint:{en:"will happen", ur:"بعد میں ہوگا"},
    panelMatch:{en:"Pick a sentence", ur:"جملہ چنو"},
    panelMake:{en:"Who? · Doing what?", ur:"کون؟ · کیا؟"},
    matchAsk:{en:"Which tense?", ur:"کون سا زمانہ؟"},
    ok:{en:"Shabash! Correct.", ur:"شاباش! درست۔"},
    no:{en:"Not that one — try again next time.", ur:"یہ نہیں — اگلی بار دوبارہ سوچو۔"},
    quiz:{en:"Check yourself — 5 questions", ur:"اپنا امتحان — ۵ سوال"},
    score:{en:"Your score", ur:"تمہارا اسکور"},
    of:{en:"out of", ur:"میں سے"},
    compare:{en:"Simple vs Continuous", ur:"سادہ بمقابلہ جاری"}
  };

  /* Quiz — exact from brief; corrects a,b,c,a,b */
  var QUIZ = [
    {q:{en:"Usually I go to school in the morning. Which tense is this?",
        ur:"عام طور پر میں صبح اسکول جاتا ہوں۔ یہ کونسا tense ہے؟"},
     o:[{en:"Present Simple",ur:"Present Simple"},{en:"Past Simple",ur:"Past Simple"},
        {en:"Future Simple",ur:"Future Simple"},{en:"Present Continuous",ur:"Present Continuous"}],
     a:0,
     f:{en:"Habit / usual action = Present Simple.", ur:"عادت / عام کام = Present Simple۔ یہ جذبات ابھی ہو رہے ہیں۔"}},
    {q:{en:"Yesterday I used to meet my friend. Which tense is this?",
        ur:"کل میں دوستی سے ملتا تھا۔ یہ کونسا tense ہے؟"},
     o:[{en:"Present Simple",ur:"Present Simple"},{en:"Past Simple",ur:"Past Simple"},
        {en:"Future Simple",ur:"Future Simple"},{en:"Present Continuous",ur:"Present Continuous"}],
     a:1,
     f:{en:"It happened in the past = Past Simple.", ur:"یہ کام گزشتہ وقت میں ہوا تھا = Past Simple۔"}},
    {q:{en:"I will play cricket tomorrow. Which tense is this?",
        ur:"میں کل کرکٹ کھیلوں گا۔ یہ کونسا tense ہے؟"},
     o:[{en:"Present Simple",ur:"Present Simple"},{en:"Past Simple",ur:"Past Simple"},
        {en:"Future Simple",ur:"Future Simple"},{en:"Present Continuous",ur:"Present Continuous"}],
     a:2,
     f:{en:"Will + verb = Future Simple.", ur:"یہ جذبات آنے والے وقت کے لیے ہے = Future Simple۔"}},
    {q:{en:"I am reading a book right now. Which tense is this?",
        ur:"میں ابھی کتاب پڑھ رہا ہوں۔ یہ کونسا tense ہے؟"},
     o:[{en:"Present Continuous",ur:"Present Continuous"},{en:"Past Continuous",ur:"Past Continuous"},
        {en:"Future Continuous",ur:"Future Continuous"},{en:"Present Simple",ur:"Present Simple"}],
     a:0,
     f:{en:"Happening right now = Present Continuous.", ur:"یہ کام اس وقت ہو رہا ہے = Present Continuous۔"}},
    {q:{en:"She was watching a film yesterday. Which tense is this?",
        ur:"وہ کل فلم دیکھ رہی تھی۔ یہ کونسا tense ہے؟"},
     o:[{en:"Present Simple",ur:"Present Simple"},{en:"Past Continuous",ur:"Past Continuous"},
        {en:"Future Simple",ur:"Future Simple"},{en:"Present Continuous",ur:"Present Continuous"}],
     a:1,
     f:{en:"Was/were + -ing in the past = Past Continuous.", ur:"یہ کام گزشتہ وقت میں ہو رہا تھا = Past Continuous۔"}}
  ];

  function $(id){ return document.getElementById(id); }
  function t(o){ return o[lang]; }
  function key(){
    if (when === "fut" && form === "cont") return "fut-simple"; /* G4: no fut cont */
    return when + "-" + (form === "simple" ? "simple" : "cont");
  }
  var LRI = "\u2066", PDI = "\u2069";
  var LATIN_RUN = /[A-Za-z0-9][A-Za-z0-9 .,'\u2019+()\/@_-]*[A-Za-z0-9.]|[A-Za-z0-9]/g;
  function isolate(s){ return s.replace(LATIN_RUN, function(m){ return LRI + m + PDI; }); }
  function setText(el, str){
    el.textContent = (lang === "ur") ? isolate(str) : str;
    el.classList.toggle("ur", lang === "ur");
    el.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
  }

  function renderLearn(){
    var box = $("learnPane"); box.innerHTML = "";
    ["hook","samjhao","misaal","karo"].forEach(function(k){
      var L = LESSON[k];
      var d = document.createElement("div"); d.className = "block";
      var tag = document.createElement("span"); tag.className = "tag";
      setText(tag, t(L.tag));
      var p = document.createElement("p"); setText(p, t(L));
      d.appendChild(tag); d.appendChild(p); box.appendChild(d);
    });
    lastSpoken = LESSON.hook.en;
  }

  function renderTime(){
    var scene = $("scene"); scene.innerHTML = "";
    var row = document.createElement("div"); row.className = "time3";
    [["past","p",T.past,T.pastHint],["now","n",T.now,T.nowHint],["fut","f",T.fut,T.futHint]].forEach(function(c){
      var b = document.createElement("button");
      b.type = "button"; b.className = "tcard " + c[1];
      b.setAttribute("aria-pressed", when === c[0] ? "true" : "false");
      var lab = document.createElement("strong"); setText(lab, t(c[2]));
      var em = document.createElement("em"); setText(em, t(c[3]));
      b.appendChild(lab); b.appendChild(em);
      b.addEventListener("click", function(){
        when = c[0];
        if (when === "fut") form = "simple"; /* G4: future only simple */
        render();
      });
      row.appendChild(b);
    });
    scene.appendChild(row);

    var tog = document.createElement("div"); tog.className = "toggle";
    [["simple",T.simple],["cont",T.cont]].forEach(function(o){
      var b = document.createElement("button");
      b.type = "button";
      setText(b, t(o[1]));
      var disabled = (when === "fut" && o[0] === "cont");
      b.disabled = disabled;
      if (disabled){ b.style.opacity = ".4"; b.style.cursor = "not-allowed"; }
      b.setAttribute("aria-pressed", form === o[0] ? "true" : "false");
      b.addEventListener("click", function(){
        if (when === "fut" && o[0] === "cont") return;
        form = o[0]; render();
      });
      tog.appendChild(b);
    });
    scene.appendChild(tog);

    /* side-by-side compare strip */
    var compare = document.createElement("p");
    compare.className = "pair";
    compare.style.display = "";
    compare.style.marginTop = "12px";
    compare.style.textAlign = "center";
    var k = key();
    var simpleK = when + "-simple";
    var contK = when === "fut" ? null : when + "-cont";
    var html = "<b>" + isolate(t(T.compare)) + "</b><br>";
    if (when === "now"){
      html += "<span>I go</span> · <span>I am going</span>";
    } else if (when === "past"){
      html += "<span>I went</span> · <span>I was going</span>";
    } else {
      html += "<span>I will go</span>";
    }
    compare.innerHTML = html;
    compare.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
    scene.appendChild(compare);

    var chip = $("statechip"); chip.className = "statechip";
    setText(chip, t(NAMES[k]));
    $("lead").textContent = SAMPLES[k].en;
    $("lead").setAttribute("dir","ltr");
    setText($("detail"), SAMPLES[k].ur + " — " + t(USES[k]));
    $("formula").style.display = "";
    $("formula").textContent = FORMULAS[k];
    $("pair").style.display = "none";
    $("sidePanel").style.display = "none";
    lastSpoken = SAMPLES[k].en;
  }

  function renderMatch(){
    var m = MATCH[matchI];
    var scene = $("scene"); scene.innerHTML = "";
    var p = document.createElement("p");
    p.className = "lead"; p.style.margin = "0"; p.style.textAlign = "center";
    p.textContent = m.s; p.setAttribute("dir","ltr");
    scene.appendChild(p);

    var picks = document.createElement("div"); picks.className = "picks";
    var opts = ["now-simple","now-cont","past-simple","past-cont","fut-simple"];
    opts.forEach(function(ok){
      var b = document.createElement("button");
      b.type = "button";
      setText(b, t(NAMES[ok]));
      if (matchPick !== null){
        if (ok === m.key) b.className = "good";
        else if (ok === matchPick) b.className = "bad";
      }
      b.addEventListener("click", function(){
        if (matchPick !== null) return;
        matchPick = ok;
        if (ok === m.key) matchDone[matchI] = true;
        render();
      });
      picks.appendChild(b);
    });
    scene.appendChild(picks);

    var chip = $("statechip"); chip.className = "statechip";
    if (matchPick === null){
      setText(chip, t(T.matchAsk));
      $("lead").textContent = "";
      setText($("detail"), t(m.clue));
    } else {
      var good = matchPick === m.key;
      chip.className = "statechip " + (good ? "ok" : "no");
      setText(chip, good ? t(T.ok) : t(T.no));
      setText($("lead"), t(NAMES[m.key]));
      setText($("detail"), t(USES[m.key]) + " · " + t(m.clue));
    }
    $("formula").style.display = "none";
    $("pair").style.display = "none";

    $("sidePanel").style.display = "";
    setText($("panelHead"), t(T.panelMatch));
    var chips = $("chips"); chips.innerHTML = "";
    MATCH.forEach(function(x,i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "schip" + (matchDone[i] ? " done" : "");
      b.textContent = String(i+1) + (matchDone[i] ? " \u2605" : "");
      b.setAttribute("aria-pressed", i === matchI ? "true" : "false");
      b.addEventListener("click", function(){ matchI = i; matchPick = null; render(); });
      chips.appendChild(b);
    });
    lastSpoken = m.s;
  }

  function renderMake(){
    /* Force form/when via builder: pick subject + pick a ready verb form */
    var scene = $("scene"); scene.innerHTML = "";
    var hint = document.createElement("p");
    hint.style.margin = "0 0 10px"; hint.style.textAlign = "center";
    hint.style.fontWeight = "800"; hint.style.fontSize = "var(--fs-sm)";
    setText(hint, t(T.panelMake));
    scene.appendChild(hint);

    var whenRow = document.createElement("div"); whenRow.className = "toggle";
    [["past",T.past],["now",T.now],["fut",T.fut]].forEach(function(c){
      var b = document.createElement("button"); b.type = "button";
      setText(b, t(c[1]));
      b.setAttribute("aria-pressed", when === c[0] ? "true" : "false");
      b.addEventListener("click", function(){
        when = c[0];
        if (when === "fut") form = "simple";
        render();
      });
      whenRow.appendChild(b);
    });
    scene.appendChild(whenRow);

    var formRow = document.createElement("div"); formRow.className = "toggle";
    [["simple",T.simple],["cont",T.cont]].forEach(function(o){
      var b = document.createElement("button"); b.type = "button";
      setText(b, t(o[1]));
      var disabled = (when === "fut" && o[0] === "cont");
      b.disabled = disabled;
      if (disabled){ b.style.opacity = ".4"; b.style.cursor = "not-allowed"; }
      b.setAttribute("aria-pressed", form === o[0] ? "true" : "false");
      b.addEventListener("click", function(){
        if (when === "fut" && o[0] === "cont") return;
        form = o[0]; render();
      });
      formRow.appendChild(b);
    });
    scene.appendChild(formRow);

    var k = key();
    var bld = buildSent(subjI, verbI, when, form);
    var chip = $("statechip"); chip.className = "statechip";
    setText(chip, t(NAMES[k]));
    $("lead").innerHTML = "";
    var h = document.createElement("span"); h.textContent = bld.head + " ";
    var u = document.createElement("u"); u.textContent = bld.hl;
    var tl = document.createElement("span"); tl.textContent = " " + bld.tail + ".";
    $("lead").appendChild(h); $("lead").appendChild(u); $("lead").appendChild(tl);
    $("lead").setAttribute("dir","ltr");
    setText($("detail"), SUBJ[subjI].ur + " · " + VERBS[verbI].ur + " — " + t(USES[k]));
    $("formula").style.display = "";
    $("formula").textContent = FORMULAS[k];
    $("pair").style.display = "none";

    $("sidePanel").style.display = "";
    setText($("panelHead"), t(T.panelMake));
    var chips = $("chips"); chips.innerHTML = "";
    SUBJ.forEach(function(s,i){
      var bt = document.createElement("button");
      bt.type = "button"; bt.className = "schip";
      bt.textContent = s.w; bt.setAttribute("dir","ltr");
      bt.setAttribute("aria-pressed", i === subjI ? "true" : "false");
      bt.addEventListener("click", function(){ subjI = i; render(); });
      chips.appendChild(bt);
    });
    VERBS.forEach(function(v,i){
      var bt = document.createElement("button");
      bt.type = "button"; bt.className = "schip";
      bt.textContent = v.base; bt.setAttribute("dir","ltr");
      bt.setAttribute("aria-pressed", i === verbI ? "true" : "false");
      bt.addEventListener("click", function(){ verbI = i; render(); });
      chips.appendChild(bt);
    });
    lastSpoken = bld.head + " " + bld.hl + " " + bld.tail + ".";
  }

  function render(){
    ["Learn","Time","Match","Make"].forEach(function(x){
      $("tab"+x).setAttribute("aria-pressed", tab === x.toLowerCase() ? "true" : "false");
    });
    setText($("tabLearn"), t(T.tabLearn));
    setText($("tabTime"), t(T.tabTime));
    setText($("tabMatch"), t(T.tabMatch));
    setText($("tabMake"), t(T.tabMake));
    setText($("quizHead"), t(T.quiz));

    var isLearn = tab === "learn";
    $("learnPane").style.display = isLearn ? "" : "none";
    $("playPane").style.display = isLearn ? "none" : "";
    if (isLearn){
      setText($("title"), t(T.titleLearn));
      setText($("subtitle"), t(T.subLearn));
      $("sidePanel").style.display = "none";
      renderLearn();
      return;
    }
    if (tab === "time"){
      setText($("title"), t(T.titleTime));
      setText($("subtitle"), t(T.subTime));
      renderTime();
      return;
    }
    if (tab === "match"){
      setText($("title"), t(T.titleMatch));
      setText($("subtitle"), t(T.subMatch));
      renderMatch();
      return;
    }
    setText($("title"), t(T.titleMake));
    setText($("subtitle"), t(T.subMake));
    renderMake();
  }

  ["Learn","Time","Match","Make"].forEach(function(x){
    $("tab"+x).addEventListener("click", function(){
      var m = x.toLowerCase();
      if (tab === m) return;
      try{ window.speechSynthesis.cancel(); }catch(e){}
      tab = m; matchPick = null; render();
    });
  });

  function buildQuiz(){
    var box = $("quizBox"); box.innerHTML = "";
    quizScore = 0; quizAnswered = 0;
    $("scoreBox").classList.remove("show");
    QUIZ.forEach(function(item, qi){
      var wrap = document.createElement("div"); wrap.className = "q";
      var q = document.createElement("p"); setText(q, t(item.q)); wrap.appendChild(q);
      var fb = document.createElement("p"); fb.className = "fb";
      item.o.forEach(function(opt, oi){
        var bt = document.createElement("button");
        bt.type = "button"; bt.className = "opt" + (lang === "ur" ? " ur" : "");
        setText(bt, t(opt));
        bt.addEventListener("click", function(){
          if (wrap.getAttribute("data-done") === "1") return;
          wrap.setAttribute("data-done","1");
          quizAnswered++;
          if (oi === item.a) quizScore++;
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show");
          if (quizAnswered === QUIZ.length){
            var sb = $("scoreBox");
            sb.classList.add("show");
            setText(sb, t(T.score) + ": " + quizScore + " " + t(T.of) + " " + QUIZ.length);
          }
        });
        wrap.appendChild(bt);
      });
      wrap.appendChild(fb); box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");
    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });
    buildQuiz(); render();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en"; applyLang();
  });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u2 = new SpeechSynthesisUtterance(lastSpoken);
      u2.lang = "en-US"; u2.rate = 0.85;
      window.speechSynthesis.speak(u2);
    }catch(e){}
  });

  applyLang();
})();
</script>
</body>
</html>
