 hain. Har letter ka capital aur small form hota hai: A a, B b, C c. Letters mil kar words banate hain. Pehli sound suno, bolo aur likho: A for apple, B for ball, C for cat."},"misaal":{"en":"The word cat starts with C. The word dog starts with D. Look at the first letter, say its sound, and then say the whole word.","ur":"Cat word C se shuru hota hai. Dog word D se shuru hota hai. Pehla letter dekho, us ki sound bolo, phir poora word bolo."},"karo":{"en":"Make a small alphabet chart. Write five capital letters and their small partners. Draw one thing for each letter and say its first sound aloud.","ur":"Chhota sa alphabet chart banao. Paanch capital letters aur un ke small partners likho. Har letter ki ek drawing banao aur pehli sound zor se bolo."}},"demo":{"type":"letters","title":{"en":"Letter sound lab","ur":"Letter sound lab"},"hint":{"en":"Tap a letter, then press Play sound.","ur":"Letter par tap karo, phir Play sound dabao."},"items":[{"emoji":"🍎","letter":"A a","word":{"en":"apple","ur":"apple"},"sound":{"en":"/a/ as in apple","ur":"/a/ jaise apple mein"}},{"emoji":"⚽","letter":"B b","word":{"en":"ball","ur":"ball"},"sound":{"en":"/b/ as in ball","ur":"/b/ jaise ball mein"}},{"emoji":"🐱","letter":"C c","word":{"en":"cat","ur":"cat"},"sound":{"en":"/k/ as in cat","ur":"/k/ jaise cat mein"}},{"emoji":"🐶","letter":"D d","word":{"en":"dog","ur":"dog"},"sound":{"en":"/d/ as in dog","ur":"/d/ jaise dog mein"}},{"emoji":"🥚","letter":"E e","word":{"en":"egg","ur":"egg"},"sound":{"en":"/e/ as in egg","ur":"/e/ jaise egg mein"}},{"emoji":"🐟","letter":"F f","word":{"en":"fish","ur":"fish"},"sound":{"en":"/f/ as in fish","ur":"/f/ jaise fish mein"}}]},"quizTitle":{"en":"Alphabets aur Phonics Quiz","ur":"Alphabets aur Phonics Quiz"},"quiz":[{"q":{"en":"How many letters are in the English alphabet?","ur":"English alphabet mein kitne letters hain?"},"opts":[{"en":"26","ur":"26"},{"en":"10","ur":"10"},{"en":"15","ur":"15"},{"en":"50","ur":"50"}],"ans":0,"exp":{"en":"Engli  p=button({en:'🔊 Say it',ur:'🔊 Bolo'},'play',function(){speak(d.items[selected].word);});s.appendChild(p)}}function renderQuiz(){var box=$('quizBox');box.innerHTML='';answered=0;points=0;$('score').classList.remove('show');D.quiz.forEach(function(q,qi){var w=document.createElement('div');w.className='q';var h=document.createElement('p');h.className='q-title';h.textContent=(qi+1)+'. '+t(q.q);w.appendChild(h);q.opts.forEach(function(opt,oi){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+oi)+'. '+t(opt);b.onclick=function(){if(w.dataset.done)return;w.dataset.done='1';answered++;var right=oi===q.ans;if(right)points++;b.classList.add(right?'right':'wrong');w.querySelectorAll('.opt').forEach(function(x,xi){if(xi===q.ans)x.classList.add('right');x.disabled=true});var f=w.querySelector('.feedback');f.textContent=(right?'✓ ':'✗ ')+t(q.exp);f.className='feedback show';if(answered===D.quiz.length){$('score').textContent=(lang==='en'?'Score: ':'Score: ')+points+' / 5 '+(points===5?(lang==='en'?'— Excellent!':'— Shabash!'):'— '+(lang==='en'?'Keep practising!':'Practice jari rakho!'));$('score').classList.add('show')}};w.appendChild(b)});var f=document.createElement('p');f.className='feedback';w.appendChild(f);box.appendChild(w)})}$('langBtn').onclick=function(){lang=lang==='en'?'ur':'en';selected=0;step=0;render()};$('speakBtn').onclick=function(){speak(D.title);};$('launch').onclick=function(){$('demo').scrollIntoView({behavior:'smooth'});speak(D.demo.title)};render()})();</script></body></html>
