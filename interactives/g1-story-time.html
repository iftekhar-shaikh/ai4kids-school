in kya hota hai, aur lesson dhoondte hain. Pictures aur action words imagination mein madad karte hain."},"misaal":{"en":"Beginning: A little bird finds a seed. Middle: Her friends help plant it. End: A green plant grows, and they share the fruit. Lesson: Helping friends is kind.","ur":"Beginning: Chhoti bird ko seed milta hai. Middle: Friends usay plant karne mein madad karte hain. End: Green plant ugta hai aur woh fruit share karte hain. Lesson: Friends ki madad karna kindness hai."},"karo":{"en":"Retell the story with three drawings: beginning, middle, and end. Tell the story to someone using first, then, and finally.","ur":"Story ko teen drawings se dobara sunao: beginning, middle aur end. Kisi ko first, then aur finally use karke story batao."}},"demo":{"type":"story","title":{"en":"Tap-through story","ur":"Tap-through story"},"hint":{"en":"Press Next to read each picture scene.","ur":"Har picture scene parhne ke liye Next dabao."},"scenes":[{"emoji":"🐦🌱","head":{"en":"Beginning","ur":"Beginning"},"text":{"en":"A little bird finds a seed.","ur":"Chhoti bird ko seed milta hai."}},{"emoji":"🐰🐿️💧","head":{"en":"Middle","ur":"Middle"},"text":{"en":"Friends help her plant and water it.","ur":"Friends usay plant lagane aur paani dene mein madad karte hain."}},{"emoji":"🌳🍎😊","head":{"en":"End","ur":"End"},"text":{"en":"A plant grows. They share the fruit.","ur":"Plant ugta hai. Woh fruit share karte hain."}},{"emoji":"🤝❤️","head":{"en":"Lesson","ur":"Lesson"},"text":{"en":"Kind friends help one another.","ur":"Kind friends ek doosre ki madad karte hain."}}]},"quizTitle":{"en":"Story time Quiz","ur":"Story time Quiz"},"quiz":[{"q":{"en":"What did the little bird find?","ur":"Chhoti bird ko kya mila?"},"opts":[{"en":"a seed","ur":"ek seed"},{"en":"a shoe","ur":"ek joota"},{"en":"a book","ur":"ek book"},{"en":"a ball","ur":"ek ball"}],"ans":0,"exp":{"en":"The bird found a seed.","ur":"Bird ko seed mila."}},{"q":{"en":"Who helped the bird?","ur":"Bird ki madad kis ne ki?"},"opts":[{"en":"friends","ur":"friends"},{"en":"a cloud","ur":"baadal"},{"en":"a car","ur":"gaari"},{"en":"a king","ur":"badshah"}],"ans":0,"exp":{"en":"Her friends helped her.","ur":"Us ke friends ne madad ki."}},{"q":{"en":"What grew at the end?","ur":"End mein kya uga?"},"opts":[{"en":"a plant","ur":"ek plant"},{"en":"a shoe","ur":"ek joota"},{"en":"a boat","ur":"ek kashti"},{"en":"a house","ur":"ek ghar"}],"ans":0,"exp":{"en":"A green plant grew.","ur":"Green plant uga."}},{"q":{"en":"Which part comes first?","ur":"Sab se pehle kaunsa part aata hai?"},"opts":[{"en":"beginning","ur":"beginning"},{"en":"end","ur":"end"},{"en":"middle","ur":"middle"},{"en":"lesson","ur":"lesson"}],"ans":0,"exp":{"en":"The beginning starts the story.","ur":"Beginning story ko shuru karta hai."}},{"q":{"en":"What is the lesson?","ur":"Story ka lesson kya hai?"},"opts":[{"en":"Help friends","ur":"Friends ki madad karo"},{"en":"Hide the seed","ur":"Seed chhupao"},{"en":"Never share","ur":"Kabhi share na karo"},{"en":"Run away","ur":"Door bhaago"}],"ans":0,"exp":{"en":"Helping friends is kind.","ur":"Friends ki madad karna kindness hai."}}]};</script><script>(function(){'use strict';var lang='en',selected=0,step=0,chosenA=0,chosenC=0,answered=0,points=0;function $(id){return document.getElementById(id)}function t(x){return x&&typeof x==='object'?(x[lang]||x.en||''):String(x||'')}function set(el,x){el.textContent=t(x);el.dir='ltr'}function speak(x){if('speechSynthesis' in window){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t(x));u.lang=lang==='en'?'en-US':'en-PK';u.rate=.84;speechSynthesis.speak(u)}}function labels(){return{play:{en:'Play',ur:'Play'},hook:{en:'HOOK',ur:'HOOK'},samjhao:{en:'SAMJHAO',ur:'SAMJHAO'},misaal:{en:'MISAAL',ur:'MISAAL'},karo:{en:'KARO',ur:'KARO'}}}function render(){document.documentElement.lang=lang;document.title=t(D.title)+' | AI4Kids Grade 1 English';set($('brand'),{en:'AI4Kids · Grade 1 · English',ur:'AI4Kids · Grade 1 · English'});set($('tit tle2.className='row-title';title2.textContent=t({en:'Choose a color',ur:'Color chuno'});s.appendChild(title2);var row2=document.createElement('div');row2.className='choice-row';d.colors.forEach(function(c,i){var b=button({en:c,ur:c},'card'+(chosenC===i?' selected':''),function(){chosenC=i;renderDemo()});row2.appendChild(b)});s.appendChild(row2);var ck=button({en:'✅ Check match',ur:'✅ Match check karo'},'play',function(){renderDemo()});s.appendChild(ck);var ok=d.animals[chosenA].color===d.colors[chosenC];s.appendChild(msg(ok?{en:'Correct! The '+t(d.animals[chosenA].name)+' can be '+d.colors[chosenC]+'.',ur:'Bilkul! '+t(d.animals[chosenA].name)+' '+d.colors[chosenC]+' ho sakta hai.'}:{en:'Try again: look carefully at the animal.',ur:'Dobara try karo: animal ko ghour se dekho.'}))}else if(d.type==='story'){var sc=d.scenes[step%d.scenes.length],box=document.createElement('div');box.className='story-box';var em=document.createElement('div');em.className='story-emoji';em.textContent=sc.emoji;box.appendChild(em);var h=document.createElement('h3');set(h,sc.head);box.appendChild(h);box.appendChild(msg(sc.text));s.appendChild(box);var next=button({en:step>=d.scenes.length-1?'🔁 Start again':'▶ Next scene',ur:step>=d.scenes.length-1?'🔁 Dobara shuru':'▶ Agla scene'},function(){});next.className='play';next.onclick=function(){step=step>=d.scenes.length-1?0:step+1;renderDemo();speak(d.scenes[step].text)};s.appendChild(next)}else if(d.type==='trace'){var row=document.createElement('div');row.className='cards';d.items.forEach(function(it,i){var b=button(it.word,'card'+(selected===i?' selected':''),function(){selected=i;renderDemo()});row.appendChild(b)});s.appendChild(row);var tr=document.createElement('div');tr.className='trace';tr.textContent=d.items[selected].model;s.appendChild(tr);s.appendChild(msg({en:'Trace the grey model slowly. Now write it on paper.',ur:'Grey model ko aahista trace karo. Ab paper par likho.'}));var p=button({en:'🔊 Say it',ur:'🔊 Bolo'},'play',function(){speak(d.items[selected].word);});s.appendChild(p)}}function renderQuiz(){var box=$('quizBox');box.innerHTML='';answered=0;points=0;$('score').classList.remove('show');D.quiz.forEach(function(q,qi){var w=document.createElement('div');w.className='q';var h=document.createElement('p');h.className='q-title';h.textContent=(qi+1)+'. '+t(q.q);w.appendChild(h);q.opts.forEach(function(opt,oi){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+oi)+'. '+t(opt);b.onclick=function(){if(w.dataset.done)return;w.dataset.done='1';answered++;var right=oi===q.ans;if(right)points++;b.classList.add(right?'right':'wrong');w.querySelectorAll('.opt').forEach(function(x,xi){if(xi===q.ans)x.classList.add('right');x.disabled=true});var f=w.querySelector('.feedback');f.textContent=(right?'✓ ':'✗ ')+t(q.exp);f.className='feedback show';if(answered===D.quiz.length){$('score').textContent=(lang==='en'?'Score: ':'Score: ')+points+' / 5 '+(points===5?(lang==='en'?'— Excellent!':'— Shabash!'):'— '+(lang==='en'?'Keep practising!':'Practice jari rakho!'));$('score').classList.add('show')}};w.appendChild(b)});var f=document.createElement('p');f.className='feedback';w.appendChild(f);box.appendChild(w)})}$('langBtn').onclick=function(){lang=lang==='en'?'ur':'en';selected=0;step=0;render()};$('speakBtn').onclick=function(){speak(D.title);};$('launch').onclick=function(){$('demo').scrollIntoView({behavior:'smooth'});speak(D.demo.title)};render()})();</script></body></html>
