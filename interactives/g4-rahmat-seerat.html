<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rahmat-e-Aalam aur seerat stories | AI4Kids Grade 4 Urdu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#e8f0ea;--board-deep:#c5d8c8;--sky:#7eb8d4;--sky2:#4a8fb8;
    --accent:#0d5c3d;--ok:#2e7d4f;--ink:#1a2e22;--ink-soft:#4a5a4e;
    --paper:#fdfaf3;--line:#d0dcc8;--gold:#d4a017;--no:#c4453a;
    --story1:#0d5c3d;--story2:#2f6fb5;--story3:#8b5a2b;
    --fs-cap:clamp(14px, 3.8vw, 16px);--fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.8vw, 20px);--fs-md:clamp(19px, 5.2vw, 22px);
    --fs-lg:clamp(22px, 6vw, 26px);--fs-xl:clamp(30px, 8vw, 38px);--lh:1.5;
  }
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);
    --fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);
    --fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);--lh:2.1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.55;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:44px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}
  .sec{margin-top:22px}
  .sec h2{
    font-size:var(--fs-lg);font-weight:800;margin:0 0 10px;color:var(--accent);
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .tag{
    display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
    padding:3px 12px;font-size:var(--fs-cap);font-weight:700;letter-spacing:.02em;
  }
  .story{
    background:#fff8ea;border:2px dashed var(--gold);border-radius:16px;padding:14px 16px;
    font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.65;margin-bottom:4px;
  }
  body.urdu .story{line-height:var(--lh)}
  .story b{color:var(--ink)}

  /* Story cards */
  .scards{display:flex;flex-direction:column;gap:12px;margin-top:10px}
  .scard{
    border:3px solid var(--ink);border-radius:18px;padding:14px 14px 12px;
    background:linear-gradient(180deg,#e8f5ec,#fdfaf3);cursor:pointer;
    text-align:left;transition:box-shadow .12s ease, transform .12s ease;
  }
  body.urdu .scard{text-align:right}
  .scard:active{transform:scale(.99)}
  .scard.open{box-shadow:0 0 0 3px rgba(13,92,61,.28)}
  .scard.s1{border-color:var(--story1)}
  .scard.s2{border-color:var(--story2);background:linear-gradient(180deg,#e8f0f8,#fdfaf3)}
  .scard.s3{border-color:var(--story3);background:linear-gradient(180deg,#f5efe6,#fdfaf3)}
  .scard .em{font-size:36px;line-height:1;display:block;margin-bottom:4px}
  .scard h3{margin:0 0 6px;font-size:var(--fs-md);font-weight:800;color:var(--ink)}
  .scard .body{margin:0;font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.55;display:none}
  .scard.open .body{display:block}
  body.urdu .scard .body{line-height:var(--lh)}
  .scard .tap-hint{margin:8px 0 0;font-size:var(--fs-cap);font-weight:700;color:var(--accent)}
  .scard.open .tap-hint{display:none}

  /* Comprehension taps */
  .comp{margin-top:10px;display:none}
  .scard.open .comp{display:block}
  .comp h4{
    margin:10px 0 8px;font-size:var(--fs-xs);font-weight:800;color:var(--ink-soft);
  }
  .comp-row{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .comp-q{font-weight:800;font-size:var(--fs-sm);margin:0 0 4px;color:var(--ink)}
  body.urdu .comp-q{line-height:var(--lh)}
  .ctap{
    border:2.5px solid var(--line);background:var(--paper);border-radius:14px;
    padding:12px 14px;font:inherit;font-size:var(--fs-sm);font-weight:700;
    color:var(--ink);cursor:pointer;min-height:52px;text-align:left;
  }
  body.urdu .ctap{text-align:right;line-height:var(--lh)}
  .ctap.right{border-color:var(--ok);background:#e8f2ed}
  .ctap.wrong{border-color:var(--no);background:#fbeae8}
  .cfb{margin:4px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.5}
  .cfb.show{display:block}
  body.urdu .cfb{line-height:var(--lh)}

  /* Moral sorter */
  .sorter{margin-top:10px}
  .sort-prompt{font-size:var(--fs-sm);font-weight:700;color:var(--ink-soft);margin:0 0 10px}
  body.urdu .sort-prompt{line-height:var(--lh)}
  .sort-story{
    border:2.5px dashed var(--gold);border-radius:14px;padding:12px 14px;
    background:#fff8ea;margin-bottom:10px;font-weight:800;font-size:var(--fs-md);
  }
  body.urdu .sort-story{line-height:var(--lh)}
  .moral-opts{display:flex;flex-direction:column;gap:8px}
  .moral-btn{
    border:2.5px solid var(--line);background:var(--paper);border-radius:14px;
    padding:14px 16px;font:inherit;font-size:var(--fs-sm);font-weight:800;
    color:var(--ink);cursor:pointer;min-height:56px;text-align:left;
  }
  body.urdu .moral-btn{text-align:right;line-height:var(--lh)}
  .moral-btn.right{border-color:var(--ok);background:#e8f2ed}
  .moral-btn.wrong{border-color:var(--no);background:#fbeae8}
  .sort-nav{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .sort-nav button{
    flex:1;border:2px solid var(--ink);border-radius:14px;background:var(--paper);
    color:var(--ink);font:inherit;font-weight:800;font-size:var(--fs-xs);
    cursor:pointer;min-height:48px;padding:8px 12px;
  }
  .sort-nav .go{background:var(--ink);color:var(--paper)}
  .sort-fb{margin-top:8px;font-size:var(--fs-xs);font-weight:700;color:var(--accent);display:none}
  .sort-fb.show{display:block}
  body.urdu .sort-fb{line-height:var(--lh)}

  /* Checklist */
  .checklist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .citem{
    display:flex;align-items:center;gap:12px;border:2.5px solid var(--line);
    background:var(--paper);border-radius:14px;padding:12px 14px;cursor:pointer;
    font:inherit;font-weight:700;font-size:var(--fs-sm);text-align:left;color:var(--ink);
    min-height:56px;
  }
  body.urdu .citem{text-align:right;flex-direction:row-reverse}
  .citem .box{
    width:28px;height:28px;border:3px solid var(--ink);border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:16px;background:#fff;
  }
  .citem[aria-pressed="true"]{border-color:var(--ok);background:#e8f2ed}
  .citem[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:#fff}
  .citem .cem{font-size:26px;flex-shrink:0}

  .karo{
    margin-top:10px;border:3px solid var(--accent);background:#e8f5ec;border-radius:16px;
    padding:14px 16px;font-size:var(--fs-sm);font-weight:700;color:var(--accent);line-height:1.6;
  }
  body.urdu .karo{line-height:var(--lh)}
  .karo ol{margin:8px 0 0;padding-inline-start:1.4em}
  .karo li{margin-bottom:6px}
  .misaal{
    margin-top:10px;background:#eef2f8;border:2px solid var(--story2);border-radius:14px;
    padding:12px 14px;font-size:var(--fs-xs);font-weight:700;color:var(--story2);line-height:1.6;
  }
  body.urdu .misaal{line-height:var(--lh)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .qhead h2{font-size:var(--fs-lg);font-weight:800;margin:0;flex:1}
  .scorepill{
    background:#fff6e2;border:2px solid var(--gold);border-radius:999px;
    padding:7px 14px;font-weight:800;font-size:var(--fs-xs);
  }
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2.5px solid var(--line);background:var(--paper);border-radius:14px;
    padding:14px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:56px;font-weight:700;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed}
  .opt.wrong{border-color:var(--no);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.6}
  .fb.show{display:block}
  .donebox{
    margin-top:14px;border:3px solid var(--ok);background:#e8f2ed;border-radius:16px;
    padding:16px;text-align:center;display:none;
  }
  .donebox.show{display:block}
  .donebox b{font-size:var(--fs-lg);display:block;margin-bottom:4px}
  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}
  @media (min-width:820px){
    .wrap{max-width:920px;display:grid;gap:0 28px;grid-template-columns:1fr 1fr;
      grid-template-areas:"bar bar" "head head" "hook hook" "left right" "sort sort" "habits habits" "karo karo" "quiz quiz" "foot foot";
      align-items:start}
    .bar{grid-area:bar}.head{grid-area:head}.hook{grid-area:hook}
    .left{grid-area:left}.right{grid-area:right}
    .sort-sec{grid-area:sort}.habits-sec{grid-area:habits}
    .karo-sec{grid-area:karo}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <span class="brand">AI4Kids · Grade 4 · Urdu</span>
    <button class="chip" id="langBtn" aria-pressed="false" type="button">اردو</button>
    <button class="chip" id="speakBtn" aria-label="Sunlo" type="button">🔊</button>
  </div>

  <div class="head">
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
  </div>

  <div class="hook sec">
    <h2><span class="tag" id="hookTag">HOOK</span> <span id="hookHead"></span></h2>
    <p class="story" id="hookText"></p>
  </div>

  <div class="left">
    <div class="sec">
      <h2><span class="tag" id="samTag">SAMJHAO</span> <span id="samHead"></span></h2>
      <p class="story" id="samText"></p>
      <div class="scards" id="storyCards"></div>
    </div>
  </div>

  <div class="right">
    <div class="sec">
      <h2><span class="tag" id="misTag">MISAAL</span> <span id="misHead"></span></h2>
      <p class="misaal" id="misaalText"></p>
    </div>
  </div>

  <div class="sort-sec sec">
    <h2 id="sortHead"></h2>
    <p class="sort-prompt" id="sortIntro"></p>
    <div class="sorter" id="sorter"></div>
  </div>

  <div class="habits-sec sec">
    <h2 id="habitsHead"></h2>
    <p class="story" id="habitsIntro"></p>
    <div class="checklist" id="checklist"></div>
  </div>

  <div class="karo-sec sec">
    <h2><span class="tag" id="karoTag">KARO</span> <span id="karoHead"></span></h2>
    <div class="karo" id="karoBox"></div>
  </div>

  <div class="quiz">
    <div class="qhead">
      <h2 id="quizHead"></h2>
      <span class="scorepill" id="scorePill">0 / 5</span>
      <button type="button" class="chip" id="newQuiz"></button>
    </div>
    <div id="quizBox"></div>
    <div class="donebox" id="doneBox">
      <b id="doneTitle"></b>
      <span id="doneDetail"></span>
    </div>
  </div>

  <footer>
    <p id="foot"></p>
  </footer>
</div>

<script>
(function(){
  "use strict";

  function $(id){ return document.getElementById(id); }
  function isolate(s){ return "\u2066" + s + "\u2069"; }
  function setText(el, str){

    el.classList.toggle("ur", lang === "ur");
    el.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
  }
  function setHTML(el, html){
    if (!el) return;
    el.innerHTML = html;
    el.classList.toggle("ur", lang === "ur");
    el.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
  }
  function t(o){ return (o && o[lang]) || (o && o.en) || ""; }

  var lang = "en";
  var habitsDone = {};
  var storyOpen = {};
  var compAnswered = {};
  var sortIdx = 0;
  var sortLocked = false;
  var quizAnswered = {};
  var quizScore = 0;

  var T = {
    title:{en:"Rahmat-e-Aalam aur seerat stories", ur:"رحمتِ عالم اور سیرت کہانیاں"},
    sub:{en:"Chhoti seerat stories + sawalat — Class 4 soft hearts!",
         ur:"چھوٹی سیرت کہانیاں + سوالات — جماعت ۴ نرم دل!"},
    hookHead:{en:"Stories that soften the heart", ur:"دل نرم کرنے والی کہانیاں"},

    sam:{en:"Seerat = Nabi ﷺ ki zindagi ke waqiyat. Class 4: sachaai, meharbani, bachon se pyaar, janwaron par reham. Hum kahani padhte hain, asaan sawalat ke jawab dete hain, aur moral yaad karte hain. Tap a card!",
         ur:"سیرت = نبی ﷺ کی زندگی کے واقعات۔ جماعت ۴: سچائی، مہربانی، بچوں سے پیار، جانوروں پر رحم۔ ہم کہانی پڑھتے ہیں، آسان سوالوں کے جواب دیتے ہیں، اور سبق یاد کرتے ہیں۔ کارڈ ٹیپ کرو!"},
    misHead:{en:"In real life", ur:"حقیقی زندگی میں"},
    misaal:{en:"Ek bacche ko pyaar se samjhana — jaise Nabi ﷺ ne narmi se sikhaya.",
            ur:"ایک بچے کو پیار سے سمجھانا — جیسے نبی ﷺ نے نرمی سے سکھایا۔"},
    sortHead:{en:"🎯 Moral sorter — match story → moral", ur:"🎯 سبق ملاؤ — کہانی → سبق"},
    sortIntro:{en:"Read the story title. Tap the best moral!",
               ur:"کہانی کا عنوان پڑھو۔ بہترین سبق ٹیپ کرو!"},
    habitsHead:{en:"✅ Good habits checklist", ur:"✅ اچھی عادتوں کی فہرست"},

    karoHead:{en:"Your turn", ur:"تمہاری باری"},
    karo:{en:"<ol><li>Ek seerat story suno/parho.</li><li><b>3 lines</b> likho: <b>kya hua</b> + <b>kya seekha</b>.</li></ol>",
          ur:"<ol><li>ایک سیرت کہانی سنو/پڑھو۔</li><li><b>۳ سطریں</b> لکھو: <b>کیا ہوا</b> + <b>کیا سیکھا</b>۔</li></ol>"},
    quiz:{en:"Seerat Quiz", ur:"سیرت کوئز"},
    newQuiz:{en:"New quiz", ur:"نیا کوئز"},
    score:{en:"Score", ur:"اسکور"},
    doneTitle:{en:"Shabash!", ur:"شاباش!"},
    doneAll:{en:"You finished all 5 — soft heart and smart!", ur:"۵وں سوال ہو گئے — نرم دل اور ہوشیار!"},
    doneSome:{en:"Keep practising with adab!", ur:"ادب کے ساتھ مشق جاری رکھو!"},
    nextMoral:{en:"Next story", ur:"اگلی کہانی"},
    againMoral:{en:"Try again", ur:"دوبارہ"},
    tapOpen:{en:"Tap to open story 📖", ur:"کہانی کھولنے کے لیے ٹیپ 📖"},
    foot:{en:"AI4Kids — Islamabad bilingual school. Offline · Grade 4 Urdu · WhatsApp 0337 1468899",

  };

  /* Original educational paraphrases — kid-safe, respectful, not copyrighted text */
  var STORIES = [
    {
      id:"sachaai",
      cls:"s1",
      em:"✋✨",
      title:{en:"Sachaai — people trusted Nabi ﷺ", ur:"سچائی — لوگ نبی ﷺ پر بھروسہ کرتے تھے"},
      body:{en:"Long ago, people kept their special things safe with Nabi ﷺ. Why? Because he always told the truth and never cheated. Even before prophethood, friends called him honest and trustworthy. Class 4 seekh: sachaai dil jeet leti hai.",

      comps:[

          opts:[

            {k:"c", en:"Sirf a map", ur:"صرف ایک نقشہ", ok:false}

        {

          q:{en:"What do we seekh?", ur:"ہم کیا سیکھتے ہیں؟"},
          opts:[
            {k:"a", en:"Always tell the truth", ur:"ہمیشہ سچ بولو", ok:true},
            {k:"b", en:"Cheat for toys", ur:"کھلونوں کے لیے دھوکا", ok:false},
            {k:"c", en:"Hide every mistake forever", ur:"ہر غلطی ہمیشہ چھپاؤ", ok:false}
          ],
          exp:{en:"Sachaai = trust and soft hearts.", ur:"سچائی = بھروسہ اور نرم دل۔"}
        }
      ]
    },
    {
      id:"bachay",
      cls:"s2",
      em:"🧒💚",

  function paintStatic(){
    document.title = "Rahmat-e-Aalam aur seerat stories | AI4Kids Grade 4 Urdu";
    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    setText($("hookTag"), "HOOK");
    setText($("hookHead"), t(T.hookHead));
    setText($("hookText"), t(T.hook));
    setText($("samTag"), "SAMJHAO");
    setText($("samHead"), t(T.samHead));
    setText($("samText"), t(T.sam));
    setText($("misTag"), "MISAAL");
    setText($("misHead"), t(T.misHead));
    setText($("misaalText"), t(T.misaal));
    setText($("sortHead"), t(T.sortHead));
    setText($("sortIntro"), t(T.sortIntro));
    setText($("habitsHead"), t(T.habitsHead));
    setText($("habitsIntro"), t(T.habitsIntro));
    setText($("karoTag"), "KARO");
    setText($("karoHead"), t(T.karoHead));
    setHTML($("karoBox"), t(T.karo));
    setText($("quizHead"), t(T.quiz));
    setText($("newQuiz"), t(T.newQuiz));
    setText($("foot"), t(T.foot));
    $("langBtn").textContent = lang === "en" ? "اردو" : "EN";
    $("langBtn").setAttribute("aria-pressed", lang === "ur" ? "true" : "false");
    document.body.classList.toggle("urdu", lang === "ur");
    document.body.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
    document.documentElement.lang = lang === "ur" ? "ur" : "en";
    paintStories();
    paintSorter();
    paintHabits();
    updateScore();
  }

  function paintStories(){
    var box = $("storyCards");
    box.innerHTML = "";
    STORIES.forEach(function(S){
      var card = document.createElement("div");
      card.className = "scard " + S.cls + (storyOpen[S.id] ? " open" : "");
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");
      card.innerHTML =
        '<span class="em">' + S.em + '</span>' +
        '<h3></h3>' +
        '<p class="body"></p>' +
        '<p class="tap-hint"></p>' +
        '<div class="comp"></div>';
      setText(card.querySelector("h3"), t(S.title));
      setText(card.querySelector(".body"), t(S.body));
      setText(card.querySelector(".tap-hint"), t(T.tapOpen));

      var compBox = card.querySelector(".comp");
      S.comps.forEach(function(C, ci){
        var key = S.id + "-" + ci;
        var row = document.createElement("div");
        row.className = "comp-row";
        var q = document.createElement("p");
        q.className = "comp-q";
        setText(q, t(C.q));
        row.appendChild(q);
        C.opts.forEach(function(o){
          var b = document.createElement("button");
          b.type = "button";
          b.className = "ctap";
          setText(b, t(o));
          if (compAnswered[key]){
            b.disabled = true;
            if (o.ok) b.classList.add("right");
          } else {
            b.addEventListener("click", function(e){
              e.stopPropagation();
              if (compAnswered[key]) return;
              compAnswered[key] = true;
              var ok = !!o.ok;
              row.querySelectorAll(".ctap").forEach(function(ob){
                ob.disabled = true;
              });
              C.opts.forEach(function(oo, oi){
                var btns = row.querySelectorAll(".ctap");
                if (oo.ok) btns[oi].classList.add("right");
                else if (btns[oi] === b && !ok) btns[oi].classList.add("wrong");
              });
              var fb = document.createElement("p");
              fb.className = "cfb show";
              setText(fb, (ok ? "✓ " : "→ ") + t(C.exp));
              row.appendChild(fb);
            });
          }
          row.appendChild(b);
        });
        if (compAnswered[key]){
          var fb = document.createElement("p");
          fb.className = "cfb show";
          setText(fb, "→ " + t(C.exp));
          row.appendChild(fb);
        }
        compBox.appendChild(row);
      });

      function toggle(){
        storyOpen[S.id] = !storyOpen[S.id];
        paintStories();
        if (storyOpen[S.id]){
          doSpeak(t(S.title) + ". " + t(S.body), lang);
        }
      }
      card.addEventListener("click", function(e){
        if (e.target.closest(".ctap") || e.target.closest(".comp")) return;
        toggle();
      });
      card.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); }
      });
      box.appendChild(card);
    });
  }

  function paintSorter(){
    var box = $("sorter");
    box.innerHTML = "";
    var M = MORALS[sortIdx];
    if (!M) return;

    var title = document.createElement("div");
    title.className = "sort-story";
    setText(title, (sortIdx + 1) + "/" + MORALS.length + " — " + t(M.story));
    box.appendChild(title);

    var opts = document.createElement("div");
    opts.className = "moral-opts";
    var answered = sortLocked;
    M.opts.forEach(function(o){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "moral-btn";
      setText(b, t(o));
      if (answered){
        b.disabled = true;
        if (o.id === M.correct) b.classList.add("right");
      } else {
        b.addEventListener("click", function(){
          if (sortLocked) return;
          sortLocked = true;
          var ok = o.id === M.correct;
          opts.querySelectorAll(".moral-btn").forEach(function(ob){ ob.disabled = true; });
          M.opts.forEach(function(oo, oi){
            var btns = opts.querySelectorAll(".moral-btn");
            if (oo.id === M.correct) btns[oi].classList.add("right");
            else if (btns[oi] === b && !ok) btns[oi].classList.add("wrong");
          });
          var fb = $("sortFb");
          if (fb){
            fb.classList.add("show");
            setText(fb, (ok ? "✓ " : "→ ") + t(M.exp));
          }
          paintSortNav();
        });
      }
      opts.appendChild(b);
    });
    box.appendChild(opts);

    var fb = document.createElement("p");
    fb.className = "sort-fb" + (answered ? " show" : "");
    fb.id = "sortFb";
    if (answered) setText(fb, "→ " + t(M.exp));
    box.appendChild(fb);

    var nav = document.createElement("div");
    nav.className = "sort-nav";
    nav.id = "sortNav";
    box.appendChild(nav);
    paintSortNav();
  }

  function paintSortNav(){
    var nav = $("sortNav");
    if (!nav) return;
    nav.innerHTML = "";
    if (sortLocked){
      var next = document.createElement("button");
      next.type = "button";
      next.className = "go";
      if (sortIdx < MORALS.length - 1){
        setText(next, t(T.nextMoral));
        next.addEventListener("click", function(){
          sortIdx++;
          sortLocked = false;
          paintSorter();
        });
      } else {
        setText(next, t(T.againMoral));
        next.addEventListener("click", function(){
          sortIdx = 0;
          sortLocked = false;
          paintSorter();
        });
      }
      nav.appendChild(next);
    }
  }

  function paintHabits(){
    var box = $("checklist");
    box.innerHTML = "";
    HABITS.forEach(function(a){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "citem";
      b.setAttribute("aria-pressed", habitsDone[a.id] ? "true" : "false");
      b.innerHTML = '<span class="box">' + (habitsDone[a.id] ? "✓" : "") + '</span>' +
                    '<span class="cem">' + a.em + '</span>' +
                    '<span></span>';
      var lab = b.querySelector("span:last-child");
      setText(lab, t({en:a.en, ur:a.ur}));
      b.addEventListener("click", function(){
        habitsDone[a.id] = !habitsDone[a.id];
        paintHabits();
      });
      box.appendChild(b);
    });
  }

  function updateScore(){
    var n = Object.keys(quizAnswered).length;
    var s = quizScore;
    setText($("scorePill"), (lang === "en" ? "Score " : "اسکور ") + s + " / 5");
    if (n >= 5){
      $("doneBox").classList.add("show");
      setText($("doneTitle"), t(T.doneTitle));
      setText($("doneDetail"), s >= 4 ? t(T.doneAll) : t(T.doneSome) + " (" + s + "/5)");
    } else {
      $("doneBox").classList.remove("show");
    }
  }

  function paintQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizAnswered = {};
    quizScore = 0;
    QUIZ.forEach(function(item, qi){
      var div = document.createElement("div");
      div.className = "q";
      var p = document.createElement("p");
      setText(p, (qi + 1) + ". " + t(item.q));
      div.appendChild(p);
      item.opts.forEach(function(o){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt";
        setText(b, o.k.toUpperCase() + ") " + t(o));
        b.addEventListener("click", function(){
          if (quizAnswered[qi]) return;
          quizAnswered[qi] = true;
          var ok = o.k === item.correct;
          if (ok) quizScore++;
          var opts = div.querySelectorAll(".opt");
          opts.forEach(function(ob, oi){
            ob.disabled = true;
            if (item.opts[oi].k === item.correct) ob.classList.add("right");
            else if (ob === b && !ok) ob.classList.add("wrong");
          });
          var fb = document.createElement("p");
          fb.className = "fb show";
          setText(fb, (ok ? "✓ " : "→ ") + t(item.exp));
          div.appendChild(fb);
          updateScore();
        });
        div.appendChild(b);
      });
      box.appendChild(div);
    });
    updateScore();
  }

  var speakTimer = null;
  function doSpeak(text, speakLang){
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = speakLang === "ur" ? "ur-PK" : "en-US";
    u.rate = 0.92;
    try {
      var voices = window.speechSynthesis.getVoices() || [];
      var prefer = speakLang === "ur"
        ? voices.filter(function(v){ return /ur|hi-IN|hi_IN/i.test(v.lang); })
        : voices.filter(function(v){ return /^en/i.test(v.lang); });
      if (prefer[0]) u.voice = prefer[0];
    } catch (e) {}
    window.speechSynthesis.speak(u);
  }

  function speakPage(){
    var bits = [t(T.title), t(T.hook), t(T.sam), t(T.misaal)];
    doSpeak(bits.join(". "), lang);
  }

  function rebuildQuizLabels(){
    var answered = quizAnswered;
    var score = quizScore;
    var keys = Object.keys(answered);
    if (keys.length === 0){ paintQuiz(); return; }
    var box = $("quizBox");
    box.innerHTML = "";
    QUIZ.forEach(function(item, qi){
      var div = document.createElement("div");
      div.className = "q";
      var p = document.createElement("p");
      setText(p, (qi + 1) + ". " + t(item.q));
      div.appendChild(p);
      var locked = !!answered[qi];
      item.opts.forEach(function(o){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt";
        setText(b, o.k.toUpperCase() + ") " + t(o));
        if (locked){
          b.disabled = true;
          if (o.k === item.correct) b.classList.add("right");
        } else {
          b.addEventListener("click", function(){
            if (quizAnswered[qi]) return;
            quizAnswered[qi] = true;
            var ok = o.k === item.correct;
            if (ok) quizScore++;
            var opts = div.querySelectorAll(".opt");
            opts.forEach(function(ob, oi){
              ob.disabled = true;
              if (item.opts[oi].k === item.correct) ob.classList.add("right");
              else if (ob === b && !ok) ob.classList.add("wrong");
            });
            var fb = document.createElement("p");
            fb.className = "fb show";
            setText(fb, (ok ? "✓ " : "→ ") + t(item.exp));
            div.appendChild(fb);
            updateScore();
          });
        }
        div.appendChild(b);
      });
      if (locked){
        var fb = document.createElement("p");
        fb.className = "fb show";
        setText(fb, "→ " + t(item.exp));
        div.appendChild(fb);
      }
      box.appendChild(div);
    });
    quizScore = score;
    quizAnswered = answered;
    updateScore();
  }

  $("langBtn").addEventListener("click", function(){
    lang = lang === "en" ? "ur" : "en";
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    paintStatic();
    rebuildQuizLabels();
  });

  $("speakBtn").addEventListener("click", function(){
    if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
    if (window.speechSynthesis && window.speechSynthesis.speaking){
      window.speechSynthesis.cancel();
      return;
    }
    speakTimer = setTimeout(function(){ speakTimer = null; speakPage(); }, 80);
  });

  $("newQuiz").addEventListener("click", function(){ paintQuiz(); });

  paintStatic();
  paintQuiz();
})();
</script>
