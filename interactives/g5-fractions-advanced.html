  var MUL_ROUNDS = [
    {op:"×", a:[1,2], b:[1,3], ans:[1,6]},
    {op:"×", a:[2,3], b:[1,4], ans:[2,12]},
    {op:"×", a:[3,4], b:[2,5], ans:[6,20]},
    {op:"÷", a:[1,2], b:[1,4], ans:[4,2], flip:[4,1]},
    {op:"÷", a:[2,3], b:[1,3], ans:[6,3], flip:[3,1]},
    {op:"÷", a:[3,4], b:[1,2], ans:[6,4], flip:[2,1]},
    {op:"×", a:[1,3], b:[3,5], ans:[3,15]},
    {op:"÷", a:[1,2], b:[1,3], ans:[3,2], flip:[3,1]}
  ];

  var QUIZ = [
    {q:{en:"1/2 and 2/4 are…", ur:"۱/۲ اور ۲/۴ ہیں…"},
     opts:[{en:"Different values", ur:"مختلف قیمتیں"},{en:"Equivalent fractions", ur:"مساوی کسر"},{en:"Improper only", ur:"صرف غیر مختلط"},{en:"Not fractions", ur:"کسر نہیں"}], a:1},
    {q:{en:"To add 1/2 + 1/3 you first need…", ur:"۱/۲ + ۱/۳ جمع کرنے سے پہلے چاہیے…"},
     opts:[{en:"A common denominator (6)", ur:"مشترک مخرج (۶)"},{en:"To multiply only tops", ur:"صرف اوپر ضرب"},{en:"To ignore bottoms", ur:"نیچے نظر انداز"},{en:"A calculator only", ur:"صرف کیلکولیٹر"}], a:0},
    {q:{en:"1/2 + 1/3 = ?", ur:"۱/۲ + ۱/۳ = ؟"},
     opts:[{en:"2/5", ur:"۲/۵"},{en:"5/6", ur:"۵/۶"},{en:"1/6", ur:"۱/۶"},{en:"2/6", ur:"۲/۶"}], a:1},
    {q:{en:"2/3 × 1/4 = ?", ur:"۲/۳ × ۱/۴ = ؟"},
     opts:[{en:"2/7", ur:"۲/۷"},{en:"3/8", ur:"۳/۸"},{en:"2/12", ur:"۲/۱۲"},{en:"8/3", ur:"۸/۳"}], a:2},
    {q:{en:"To divide fractions: Keep · Change · Flip means…", ur:"کسر تقسیم: رکھو · بدلاؤ · الٹا یعنی…"},
     opts:[{en:"Delete both fractions", ur:"دونوں کسر مٹاؤ"},
           {en:"Keep 1st, change ÷ to ×, flip 2nd, then multiply", ur:"پہلی رکھو، ÷ کو ×، دوسری الٹی، پھر ضرب"},
           {en:"Only flip the first", ur:"صرف پہلی الٹی"},
           {en:"Add denominators", ur:"مخارج جمع کرو"}], a:1}
  ];

  var eq = {idx:0, answered:false, correct:0, step:0};
  var add = {idx:0, step:0, answered:false, correct:0}; /* 0=pick common, 1=pick answer */
  var mul = {idx:0, answered:false, correct:0, kcf:0}; /* kcf 0..3 for divide */
  var quizSet = [];

  function award(key, n){
    if (awarded[key]) return;
    awarded[key] = true;
    stars += (n || 1);
    $("starCount").textContent = String(stars);
  }

  function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a||1; }
  function simp(n,d){ var g=gcd(n,d); return [n/g, d/g]; }
  function fracEq(a,b){ return a[0]*b[1] === a[1]*b[0]; }
  function fracStr(f){ return f[0] + "/" + f[1]; }

  function fracHtml(f, cls){
    return '<span class="frac'+(cls?" "+cls:"")+'"><span class="num">'+f[0]+'</span><span class="line"></span><span class="den">'+f[1]+'</span></span>';
  }

  function barHtml(f, which){
    var n=f[0], d=f[1], cells="", i;
    for (i=0;i<d;i++) cells += '<i class="'+(i<n?"on":"")+'"></i>';
    return '<div class="fbar-wrap"><div class="fbar-lab">'+fracStr(f)+'</div><div class="fbar '+(which||"")+'">'+cells+'</div></div>';
  }

  function pizzaHtml(f){
    var deg = (f[0]/f[1])*360;
    return '<div class="pizza" style="background:conic-gradient(var(--slice) 0deg '+deg+'deg, var(--pizza) '+deg+'deg 360deg)" title="'+fracStr(f)+'"></div>';
  }

  function shuffle(arr){
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--){
      j = Math.floor(Math.random() * (i + 1));
      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function storyHtml(){
    var s = mode === "eq" ? T.storyEq : mode === "add" ? T.storyAdd : T.storyMul;
    return t(s);
  }

  /* ---------- EQ mode ---------- */
  function renderEq(){
    var r = EQ_ROUNDS[eq.idx % EQ_ROUNDS.length];
    var pad = $("scenePad");
    pad.innerHTML = "";
    var row = document.createElement("div");
    row.className = "frac-row";
    row.innerHTML = fracHtml(r.a) + '<span class="op">'+(r.kind==="cmp"?"?":"=") +'</span>' + fracHtml(r.b);
    pad.appendChild(row);
    var bars = document.createElement("div");
    bars.innerHTML = barHtml(r.a,"") + barHtml(r.b,"b");
    pad.appendChild(bars);

    var chip = $("statechip");
    chip.className = "statechip" + (eq.answered ? (eq.lastOk?" win":" miss") : "");
    setText(chip, r.kind === "equiv" ? t(T.equal) : t(T.diffDen));

    setText($("headline"), r.kind === "equiv" ? t(T.pickEq) : t(T.pickCmp));
    setText($("detail"), eq.answered && r.why ? t(r.why) : (r.a[1]===r.b[1] ? t(T.sameDen) : t(T.diffDen)));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    var grid = document.createElement("div");
    grid.className = "choice-grid";

    if (r.kind === "equiv"){
      r.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "choice";
        b.innerHTML = fracHtml(r.a) + ' = ' + fracHtml(opt);
        if (eq.answered){
          b.disabled = true;
          if (oi === r.ans) b.classList.add("right");
          else if (eq.picked === oi) b.classList.add("wrong");
        }
        b.addEventListener("click", function(){
          if (eq.answered) return;
          eq.answered = true;
          eq.picked = oi;
          eq.lastOk = (oi === r.ans);
          if (eq.lastOk){
            eq.correct++;
            award("eq-"+eq.idx, 2);
            if (eq.correct >= 3) doneModes.eq = true;
          }
          renderAll();
        });
        grid.appendChild(b);
      });
    } else {
      [["a", r.a], ["b", r.b]].forEach(function(pair){
        var key = pair[0], f = pair[1];
        var b = document.createElement("button");
        b.type = "button";
        b.className = "choice";
        b.innerHTML = t(T.bigger) + ": " + fracHtml(f);
        if (eq.answered){
          b.disabled = true;
          if (key === r.opts) b.classList.add("right");
          else if (eq.picked === key) b.classList.add("wrong");
        }
        b.addEventListener("click", function(){
          if (eq.answered) return;
          eq.answered = true;
          eq.picked = key;
          eq.lastOk = (key === r.opts);
          if (eq.lastOk){
            eq.correct++;
            award("eq-"+eq.idx, 2);
            if (eq.correct >= 3) doneModes.eq = true;
          }
          renderAll();
        });
        grid.appendChild(b);
      });
    }
    box.appendChild(grid);
    setText($("prog"), t(T.progEq) + ": " + (eq.idx+1) + "/" + EQ_ROUNDS.length +
      (doneModes.eq ? " ★" : ""));
  }

  /* ---------- ADD mode ---------- */
  function renderAdd(){
    var r = ADD_ROUNDS[add.idx % ADD_ROUNDS.length];
    var pad = $("scenePad");
    pad.innerHTML = "";
    var pizzas = document.createElement("div");
    pizzas.className = "pizza-row";
    pizzas.innerHTML = pizzaHtml(r.a) + '<span class="op">' + r.op + '</span>' + pizzaHtml(r.b);
    pad.appendChild(pizzas);
    var row = document.createElement("div");
    row.className = "frac-row";
    row.innerHTML = fracHtml(r.a) + '<span class="op">'+r.op+'</span>' + fracHtml(r.b) +
      (add.step >= 1 ? '<span class="eq">=</span>' + fracHtml(r.rewritten[0]) + '<span class="op">'+r.op+'</span>' + fracHtml(r.rewritten[1]) : "") +
      (add.step >= 2 && add.answered ? '<span class="eq">=</span>' + fracHtml(r.ans) : "");
    pad.appendChild(row);
    if (add.step >= 1){
      var bars = document.createElement("div");
      bars.innerHTML = barHtml(r.rewritten[0],"") + barHtml(r.rewritten[1],"b");
      pad.appendChild(bars);
    }

    var chip = $("statechip");
    chip.className = "statechip" + (add.answered ? (add.lastOk?" win":" miss") : "");
    setText(chip, add.step === 0 ? t(T.pickCommon) : t(T.pickSum));

    setText($("headline"), add.step === 0 ? t(T.pickCommon) : t(T.pickSum));
    setText($("detail"), add.answered && add.lastOk
      ? (lang==="en"
          ? ("Common den "+r.common+": "+fracStr(r.rewritten[0])+" "+r.op+" "+fracStr(r.rewritten[1])+" = "+fracStr(r.ans))
          : ("مشترک مخرج "+r.common+": "+fracStr(r.rewritten[0])+" "+r.op+" "+fracStr(r.rewritten[1])+" = "+fracStr(r.ans)))
      : (lang==="en" ? "Unlike denominators — make them match first." : "مخارج مختلف — پہلے برابر کرو۔"));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    var grid = document.createElement("div");
    grid.className = "choice-grid";

    if (add.step === 0){
      r.commons.forEach(function(c){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "choice";
        b.textContent = String(c);
        b.addEventListener("click", function(){
          if (add.step !== 0) return;
          if (c === r.common){
            add.step = 1;
            award("add-common-"+add.idx, 1);
            renderAll();
          } else {
            b.classList.add("wrong");
            setTimeout(function(){ b.classList.remove("wrong"); }, 500);
          }
        });
        grid.appendChild(b);
      });
    } else {
      var distractors = [
        r.ans,
        [r.a[0]+r.b[0], r.a[1]+r.b[1]],
        [r.ans[0]+1, r.ans[1]],
        simp(r.a[0]*r.b[0], r.a[1]*r.b[1])
      ];
      var seen = {}, opts = [];
      distractors.forEach(function(f){
        var k = fracStr(f);
        if (!seen[k] && f[1] > 0){ seen[k]=1; opts.push(f); }
      });
      while (opts.length < 4){
        var fake = [r.ans[0], r.ans[1]+opts.length];
        if (!seen[fracStr(fake)]){ seen[fracStr(fake)]=1; opts.push(fake); }
      }
      opts = shuffle(opts).slice(0,4);
      var ansIdx = 0;
      opts.forEach(function(f,i){ if (fracEq(f, r.ans)) ansIdx = i; });

      opts.forEach(function(f, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "choice";
        b.innerHTML = fracHtml(f);
        if (add.answered){
          b.disabled = true;
          if (fracEq(f, r.ans)) b.classList.add("right");
          else if (add.picked === oi) b.classList.add("wrong");
        }
        b.addEventListener("click", function(){
          if (add.answered) return;
          add.answered = true;
          add.picked = oi;
          add.lastOk = fracEq(f, r.ans);
          add.step = 2;
          if (add.lastOk){
            add.correct++;
            award("add-"+add.idx, 2);
            if (add.correct >= 3) doneModes.add = true;
          }
          renderAll();
        });
        grid.appendChild(b);
      });
    }
    box.appendChild(grid);
    setText($("prog"), t(T.progAdd) + ": " + (add.idx+1) + "/" + ADD_ROUNDS.length +
      (doneModes.add ? " ★" : ""));
  }

  /* ---------- MUL / DIV mode ---------- */
  function renderMul(){
    var r = MUL_ROUNDS[mul.idx % MUL_ROUNDS.length];
    var isDiv = r.op === "÷";
    var pad = $("scenePad");
    pad.innerHTML = "";

    var row = document.createElement("div");
    row.className = "frac-row";
    row.innerHTML = fracHtml(r.a) + '<span class="op">'+r.op+'</span>' + fracHtml(r.b);
    pad.appendChild(row);

    if (!isDiv){
      var rows = r.a[1], cols = r.b[1], onR = r.a[0], onC = r.b[0];
      var grid = document.createElement("div");
      grid.className = "area-grid";
      grid.style.gridTemplateColumns = "repeat("+cols+", 1fr)";
      var i, j;
      for (i=0;i<rows;i++){
        for (j=0;j<cols;j++){
          var cell = document.createElement("span");
          if (i < onR && j < onC) cell.className = "on";
          grid.appendChild(cell);
        }
      }
      pad.appendChild(grid);
      var cap = document.createElement("p");
      cap.style.textAlign = "center";
      cap.style.fontWeight = "800";
      cap.style.fontSize = "var(--fs-xs)";
      cap.textContent = (lang==="en")
        ? ("Shaded: "+r.a[0]+"×"+r.b[0]+" / "+r.a[1]+"×"+r.b[1]+" = "+fracStr(r.ans))
        : ("رنگین: "+r.a[0]+"×"+r.b[0]+" / "+r.a[1]+"×"+r.b[1]+" = "+fracStr(r.ans));
      if (mul.answered && mul.lastOk) pad.appendChild(cap);
    } else {
      var kcf = document.createElement("div");
      kcf.className = "kcf";
      var steps = [
        {lab:t(T.keep), done: mul.kcf >= 1},
        {lab:t(T.change), done: mul.kcf >= 2},
        {lab:t(T.flip), done: mul.kcf >= 3}
      ];
      steps.forEach(function(s){
        var d = document.createElement("div");
        d.className = "step" + (s.done ? " done" : "");
        d.textContent = s.lab;
        kcf.appendChild(d);
      });
      pad.appendChild(kcf);
      if (mul.kcf >= 3){
        var row2 = document.createElement("div");
        row2.className = "frac-row";
        row2.innerHTML = fracHtml(r.a) + '<span class="op">×</span>' + fracHtml(r.flip) +
          (mul.answered ? '<span class="eq">=</span>' + fracHtml(r.ans) : "");
        pad.appendChild(row2);
      }
    }

    var chip = $("statechip");
    chip.className = "statechip" + (mul.answered ? (mul.lastOk?" win":" miss") : "");
    setText(chip, isDiv ? t(T.modeDiv) : t(T.modeMul));

    setText($("headline"), isDiv ? t(T.pickDiv) : t(T.pickMul));
    setText($("detail"), isDiv
      ? (lang==="en" ? "Tap Keep → Change → Flip, then pick the answer." : "رکھو → بدلاؤ → الٹا ٹیپ کرو، پھر جواب چنو۔")
      : (lang==="en" ? "Area model: count shaded cells over total cells." : "رقبہ ماڈل: رنگین خانے کل خانوں پر۔"));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";

    if (isDiv && mul.kcf < 3){
      var go = document.createElement("button");
      go.type = "button";
      go.className = "choice";
      go.textContent = mul.kcf === 0 ? t(T.keep) : mul.kcf === 1 ? t(T.change) : t(T.flip);
      if (lang === "ur"){ go.classList.add("ur"); go.setAttribute("dir","rtl"); }
      go.addEventListener("click", function(){
        mul.kcf++;
        if (mul.kcf === 3) award("mul-kcf-"+mul.idx, 1);
        renderAll();
      });
      box.appendChild(go);
    } else {
      var distractors = [r.ans, [r.a[0]*r.b[0], r.a[1]+r.b[1]], [r.a[0]+r.b[0], r.a[1]*r.b[1]], simp(r.ans[0], r.ans[1]+1)];
      if (isDiv) distractors.push([r.a[0]*r.b[0], r.a[1]*r.b[1]]);
      var seen = {}, opts = [];
      distractors.forEach(function(f){
        var s = simp(f[0], f[1]);
        var k = fracStr(s);
        if (!seen[k] && s[1] > 0){ seen[k]=1; opts.push(s); }
      });
      // also include unsimplified ans for multiply practice
      if (!isDiv && !seen[fracStr(r.ans)]){ opts.unshift(r.ans); seen[fracStr(r.ans)]=1; }
      while (opts.length < 4){
        var fake = simp(r.ans[0]+opts.length, r.ans[1]);
        if (!seen[fracStr(fake)]){ seen[fracStr(fake)]=1; opts.push(fake); }
      }
      opts = shuffle(opts).slice(0,4);
      // ensure ans present
      var has = opts.some(function(f){ return fracEq(f, r.ans); });
      if (!has) opts[0] = simp(r.ans[0], r.ans[1]);

      var grid = document.createElement("div");
      grid.className = "choice-grid";
      opts.forEach(function(f, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "choice";
        b.innerHTML = fracHtml(f);
        if (mul.answered){
          b.disabled = true;
          if (fracEq(f, r.ans) || fracEq(f, simp(r.ans[0],r.ans[1]))) b.classList.add("right");
          else if (mul.picked === oi) b.classList.add("wrong");
        }
        b.addEventListener("click", function(){
          if (mul.answered) return;
          mul.answered = true;
          mul.picked = oi;
          mul.lastOk = fracEq(f, r.ans) || fracEq(f, simp(r.ans[0], r.ans[1]));
          if (mul.lastOk){
            mul.correct++;
            award("mul-"+mul.idx, 2);
            if (mul.correct >= 3) doneModes.mul = true;
          }
          renderAll();
        });
        grid.appendChild(b);
      });
      box.appendChild(grid);
    }
    setText($("prog"), t(T.progMul) + ": " + (mul.idx+1) + "/" + MUL_ROUNDS.length +
      (doneModes.mul ? " ★" : ""));
  }

  /* ---------- mode switch ---------- */
  function setMode(m){
    mode = m;
    $("tabEq").setAttribute("aria-pressed", m==="eq"?"true":"false");
    $("tabAdd").setAttribute("aria-pressed", m==="add"?"true":"false");
    $("tabMul").setAttribute("aria-pressed", m==="mul"?"true":"false");
    var badge = function(done){ return done ? ' <span class="badge">★</span>' : ""; };
    $("tabEq").innerHTML = t(T.tabEq) + badge(doneModes.eq);
    $("tabAdd").innerHTML = t(T.tabAdd) + badge(doneModes.add);
    $("tabMul").innerHTML = t(T.tabMul) + badge(doneModes.mul);
    if (lang === "ur"){
      ["tabEq","tabAdd","tabMul"].forEach(function(id){
        $(id).classList.add("ur"); $(id).setAttribute("dir","rtl");
      });
    } else {
      ["tabEq","tabAdd","tabMul"].forEach(function(id){
        $(id).classList.remove("ur"); $(id).setAttribute("dir","ltr");
      });
    }
    setHtml($("story"), storyHtml());
    renderAll();
  }

  function renderAll(){
    if (mode === "eq") renderEq();
    else if (mode === "add") renderAdd();
    else renderMul();
  }

  function next(){
    if (mode === "eq"){
      eq.idx = (eq.idx + 1) % EQ_ROUNDS.length;
      eq.answered = false; eq.picked = null; eq.lastOk = false;
    } else if (mode === "add"){
      add.idx = (add.idx + 1) % ADD_ROUNDS.length;
      add.step = 0; add.answered = false; add.picked = null; add.lastOk = false;
    } else {
      mul.idx = (mul.idx + 1) % MUL_ROUNDS.length;
      mul.answered = false; mul.picked = null; mul.lastOk = false; mul.kcf = 0;
    }
    renderAll();
  }

  function resetMode(){
    if (mode === "eq"){
      eq.answered = false; eq.picked = null; eq.lastOk = false;
    } else if (mode === "add"){
      add.step = 0; add.answered = false; add.picked = null; add.lastOk = false;
    } else {
      mul.answered = false; mul.picked = null; mul.lastOk = false; mul.kcf = 0;
    }
    renderAll();
  }

  function showHint(){
    var hb = $("hintbox");
    var msg = mode === "eq" ? t(T.tipEq) : mode === "add" ? t(T.tipAdd) : t(T.tipMul);
    setText(hb, msg);
    hb.classList.add("show");
  }

  /* ---------- quiz ---------- */
  function pickQuiz(){ quizSet = shuffle(QUIZ).slice(0, 5); }

  function renderQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizSet.forEach(function(item, qi){
      var q = document.createElement("div");
      q.className = "q";
      var p = document.createElement("p");
      setText(p, (qi+1) + ". " + t(item.q));
      q.appendChild(p);
      item.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang === "ur" ? " ur" : "");
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.textContent = (lang === "ur") ? isolate(t(opt)) : t(opt);
        b.addEventListener("click", function(){
          if (b.parentNode.querySelector(".opt.right, .opt.wrong")) return;
          var ok = (oi === item.a);
          b.classList.add(ok ? "right" : "wrong");
          if (!ok){
            var correct = b.parentNode.querySelectorAll(".opt")[item.a];
            if (correct) correct.classList.add("right");
          } else {
            award("quiz-" + qi, 1);
          }
          var fb = document.createElement("p");
          fb.className = "fb show";
          setText(fb, ok ? t(T.nice) : (lang==="en"?"Look at the green answer.":"سبز جواب دیکھو۔"));
          q.appendChild(fb);
        });
        q.appendChild(b);
      });
      box.appendChild(q);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    document.documentElement.lang = (lang === "ur") ? "ur" : "en";
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");
    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    setText($("ctlHead"), t(T.ctl));
    setText($("quizHead"), t(T.quiz));
    $("nextBtn").textContent = t(T.next);
    $("hintBtn").textContent = t(T.hint);
    $("resetBtn").textContent = t(T.reset);
    $("newQuiz").textContent = t(T.newQuiz);
    if (lang === "ur"){
      ["nextBtn","hintBtn","resetBtn","newQuiz"].forEach(function(id){
        $(id).classList.add("ur"); $(id).setAttribute("dir","rtl");
      });
    } else {
      ["nextBtn","hintBtn","resetBtn","newQuiz"].forEach(function(id){
        $(id).classList.remove("ur"); $(id).setAttribute("dir","ltr");
      });
    }
    document.querySelectorAll("footer [data-en]").forEach(function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });
    setMode(mode);
    renderQuiz();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });
  $("tabEq").addEventListener("click", function(){ setMode("eq"); });
  $("tabAdd").addEventListener("click", function(){ setMode("add"); });
  $("tabMul").addEventListener("click", function(){ setMode("mul"); });
  $("nextBtn").addEventListener("click", next);
  $("hintBtn").addEventListener("click", showHint);
  $("resetBtn").addEventListener("click", resetMode);
  $("newQuiz").addEventListener("click", function(){ pickQuiz(); renderQuiz(); });

  /* ---------- speak (cancel → delay 80ms) ---------- */
  function cleanSpeakText(s){
    return String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  function buildSpeakText(){
    var bits = [];
    bits.push(t(T.title));
    bits.push(cleanSpeakText(storyHtml()));
    bits.push(cleanSpeakText(($("headline") && $("headline").textContent) || ""));
    bits.push(cleanSpeakText(($("detail") && $("detail").textContent) || ""));
    bits.push(mode === "eq" ? t(T.tipEq) : mode === "add" ? t(T.tipAdd) : t(T.tipMul));
    return bits.filter(Boolean).join(". ");
  }
  function pickVoice(voices, want){
    var i, v, L;
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf(want) === 0) return v;
    }
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf("en") === 0) return v;
    }
    return voices[0] || null;
  }
  var speakTimer = null;
  function setSpeaking(on){
    var btn = $("speakBtn");
    if (!btn) return;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.style.opacity = on ? "0.65" : "";
  }
  function doSpeak(text, asLang){
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92;
    u.lang = (asLang === "ur") ? "ur-PK" : "en-US";
    var voices = window.speechSynthesis.getVoices() || [];
    var voice = pickVoice(voices, asLang === "ur" ? "ur" : "en");
    if (voice) u.voice = voice;
    u.onstart = function(){ setSpeaking(true); };
    u.onend = function(){ setSpeaking(false); };
    u.onerror = function(){
      setSpeaking(false);
      if (asLang === "ur"){
        var fallback = cleanSpeakText(
          T.title.en + ". " + T.storyEq.en.replace(/<[^>]+>/g," ") + ". " + T.tipEq.en
        );
        var u2 = new SpeechSynthesisUtterance(fallback);
        u2.lang = "en-US"; u2.rate = 0.92;
        var v2 = pickVoice(window.speechSynthesis.getVoices() || [], "en");
        if (v2) u2.voice = v2;
        u2.onstart = function(){ setSpeaking(true); };
        u2.onend = u2.onerror = function(){ setSpeaking(false); };
        window.speechSynthesis.speak(u2);
      }
    };
    window.speechSynthesis.speak(u);
  }
  if ("speechSynthesis" in window){
    try { window.speechSynthesis.getVoices(); } catch (e0) {}
    if (typeof window.speechSynthesis.addEventListener === "function"){
      window.speechSynthesis.addEventListener("voiceschanged", function(){
        try { window.speechSynthesis.getVoices(); } catch (e1) {}
      });
    }
  } else {
    var noBtn = $("speakBtn");
    if (noBtn){
      noBtn.disabled = true;
      noBtn.title = "Voice not available on this device";
    }
  }
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      var text = buildSpeakText();
      if (!text) return;
      if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
      window.speechSynthesis.cancel();
      setSpeaking(false);
      var speakLang = lang;
      speakTimer = setTimeout(function(){
        speakTimer = null;
        doSpeak(text, speakLang);
      }, 80);
    }catch(e){ setSpeaking(false); }
  });

  pickQuiz();
  applyLang();
})();
</script>
</body>
</html>
