\n\1</head><body><div class="wrap"><div class="bar"><span class="brand" id="brand"></span><button class="chip" id="langBtn" type="button" aria-pressed="false">Roman Urdu</button><button class="chip" id="speakBtn" type="button" aria-label="Read aloud">🔊</button></div><header><h1 id="title"></h1><p class="sub" id="subtitle"></p></header><nav class="tabs" id="tabs" aria-label="Lesson sections"></nav><section class="demo-wrap" id="demo"><div class="demo-head"><h2 id="demoTitle"></h2></div><p class="demo-instruction" id="demoInstruction"></p><div class="demo-stage" id="demoStage"></div></section><main class="lesson-grid"><article class="lesson hook" id="hook"><span class="tag" id="hookTag"></span><p id="hookText"></p></article><article class="lesson sam" id="sam"><span class="tag" id="samTag"></span><p id="samText"></p></article><article class="lesson mis" id="mis"><span class="tag" id="misTag"></span><p id="misText"></p></article><article class="lesson do" id="do"><span class="tag" id="doTag"></span><p id="doText"></p></article></main><section class="quiz"><h2 id="quizHead"></h2><div id="quizBox"></div><div class="score" id="score"></div></section><footer class="footer" id="foot"></footer></div><script>var LESSON={"file":"g1-machine-kya.html","title":{"en":"What is a Machine?","ru":"Machine kya hai?"},"desc":{"en":"Machines make work easier. Meet the lever and the wheel.","ru":"Machines kaam ko asaan banati hain. Lever aur wheel se milo."},"hook":{"en":"Have you seen a rickshaw, a bicycle, or a bottle opener? These helpers make a job easier. They are machines!","ru":"Kya tum ne rickshaw, cycle ya bottle opener dekha hai? Yeh helpers kaam asaan banate hain. Yeh machines hain!"},"sam":{"en":"A machine is a tool made to make work easier or faster. A lever is a strong bar that turns around a fixed point and can lift a heavy thing. A wheel is round, rolls, and helps things move.","ru":"Machine aik tool hai jo kaam ko asaan ya tez banane ke liye banta hai. Lever mazboot dandi hoti hai jo fixed point par ghoomti hai aur bhaari cheez utha sakti hai. Wheel gol hota hai, roll karta hai aur cheezen chalne mein madad deta hai."},"mis":{"en":"A seesaw is like a lever. A bicycle and a rickshaw use wheels. With a wheel, pushing and moving can feel easier.","ru":"Seesaw lever jaisa hota hai. Cycle aur rickshaw wheels use karte hain. Wheel se dhakka dena aur chalna asaan lagta hai."},"do":{"en":"With an adult, place a ruler on a pencil and gently lift a small book like a lever. Then roll a toy car. Never lift heavy things without help.","ru":"Baray ki madad se ruler ko pencil par rakh kar choti kitaab ko lever ki tarah ahista uthao. Phir toy car roll karo. Bhaari cheez bina madad ke na uthao."},"demo":{"type":"machine","title":{"en":"Try a machine","ru":"Machine try karo"},"ins":{"en":"Choose a helper to see what it does.","ru":"Aik helper chuno aur dekho yeh kya karta hai."},"items":[["⚖️","Lever","Lever helps lift a load.","Lever bhaari cheez uthane mein madad deta hai."],["🛞","Wheel","Wheel helps things roll and move.","Wheel cheezon ko roll aur move karne mein madad deta hai."],["🚲","Bicycle","A bicycle uses wheels to move.","Cycle chalne ke liye wheels use karti hai."]]},"quiz":[{"q":{"en":"What is a machine?","ru":"Machine kya hoti hai?"},"o":[{"en":"Tools that make work easier","ru":"Aise tools jo kaam asaan karte hain"},{"en":"Tools that make life harder","ru":"Aise tools jo zindagi ko mushkil karte hain"},{"en":"Tools that are only toys","ru":"Aise tools jo sirf khilone hain"},{"en":"Tools that only cook food","ru":"Aise tools jo sirf khana banate hain"}],"c":0,"e":{"en":"A machine is a tool that makes work easier.","ru":"Machine wo tool hai jo kaam asaan banata hai."}},{"q":{"en":"What is a lever?","ru":"Lever kis cheez ko kehte hain?"},"o":[{"en":"A bar that can lift something when pushed","ru":"Aisi dandi jo dabaane se cheez utha sakti hai"},{"en":"A part that only spins","ru":"Ek ghoomne wala part"},{"en":"A heavy thing","ru":"Aik bhari cheez"},{"en":"A small machine","ru":"Aik choti machine"}],"c":0,"e":{"en":"A lever uses a bar and a turning point to help lift.","ru":"Lever dandi aur turning point se cheez uthane mein madad deta hai."}},{"q":{"en":"What is a wheel used for?","ru":"Wheel kis kaam ke liye istemal hoti hai?"},"o":[{"en":"Moving a car","ru":"Gari chalane ke liye"},{"en":"Cooking food","ru":"Khana pakane ke liye"},{"en":"Cleaning a house","ru":"Ghar saaf karne ke liye"},{"en":"Studying","ru":"Padhai ke liye"}],"c":0,"e":{"en":"Wheels help cars and bicycles move.","ru":"Wheels car aur cycle ko chalne mein madad dete hain."}},{"q":{"en":"Which is an easy example of a lever?","ru":"Lever ka sabse aasan misaal kya hai?"},"o":[{"en":"A stick lifting something","ru":"Aik chhadi jo cheez uthaye"},{"en":"A toy","ru":"Ek khilona"},{"en":"A glass of water","ru":"Paani ka glass"},{"en":"A small cushion","ru":"Ek choti gaddi"}],"c":0,"e":{"en":"A stick can work like a simple lever.","ru":"Chhadi simple lever ki tarah kaam kar sakti hai."}},{"q":{"en":"What is a wheel connected with?","ru":"Wheel kis cheez se judi hoti hai?"},"o":[{"en":"A car or bicycle","ru":"Gari ya cycle"},{"en":"A roof","ru":"Ghar ki chhat"},{"en":"Books","ru":"Kitabon"},{"en":"A cloud","ru":"Badal"}],"c":0,"e":{"en":"Cars and bicycles often have wheels.","ru":"Cars aur cycles mein aksar wheels hotay hain."}}]};(function(){'use strict';function B(en,ru){return{en:en,ru:ru}}var lang='ru',sel=0,go=0,col=0,job=0,D=LESSON;function $(x){return document.getElementById(x)}function t(x){return x&&typeof x==='object'?(x[lang]||x.en||''):String(x||'')}function put(e,x){e.textContent=t(x);e.dir='ltr'}function labels(){return{play:{en:'Play',ru:'Play'},hook:{en:'HOOK',ru:'HOOK'},sam:{en:'SAMJHAO',ru:'SAMJHAO'},mis:{en:'MISAAL',ru:'MISAAL'},do:{en:'KARO',ru:'KARO'}}}function btn(text,fn){var b=document.createElement('button');b.type='button';b.className='play';b.textContent=text;b.onclick=fn;return b}function msg(s,x){var p=document.cr ick=function(){col=i;render()};r.appendChild(b)});s.appendChild(r);var rr=document.createElement('div');rr.className='cards';d.jobs.forEach(function(a,i){var b=document.createElement('button');b.className='card'+(job===i?' selected':'');b.innerHTML='<span class="emoji">'+a[0]+'</span>'+a[lang==='en'?1:2];b.onclick=function(){job=i;render()};rr.appendChild(b)});s.appendChild(rr);var y=document.createElement('div');y.className='toy';y.style.background=d.colors[col][2];y.innerHTML='<div>🤖</div><small>'+d.colors[col][lang==='en'?0:1]+' · '+d.jobs[job][lang==='en'?1:2]+'</small>';s.appendChild(y);msg(s,B('My robot can '+d.jobs[job][1]+'.','Mera robot '+d.jobs[job][2]+' kar sakta hai.'))}}function tabs(){var n=$('tabs'),L=labels();n.innerHTML='';['play','hook','sam','mis','do'].forEach(function(k){var b=document.createElement('button');b.className='tab';b.textContent=t(L[k]);b.setAttribute('aria-pressed',k==='play');b.onclick=function(){(k==='play'?$('demo'):$(k)).scrollIntoView({behavior:'smooth'})};n.appendChild(b)})}function quiz(){var box=$('quizBox');box.innerHTML='';$('score').classList.remove('show');var done=0,score=0;D.quiz.forEach(function(q,i){var w=document.createElement('div');w.className='q';var h=document.createElement('p');h.className='q-title';h.textContent=(i+1)+'. '+t(q.q);w.appendChild(h);var f=document.createElement('p');f.className='feedback';q.o.forEach(function(o,j){var b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+t(o);b.onclick=function(){if(w.dataset.done)return;w.dataset.done=1;done++;if(j===q.c)score++;w.querySelectorAll('.opt').forEach(function(x,k){if(k===q.c)x.classList.add('right');else if(k===j)x.classList.add('wrong')});f.textContent=(j===q.c?'✓ ':'✗ ')+t(q.e);f.classList.add('show');if(done===5){$('score').textContent=(lang==='en'?'Your score: ':'Tumhara score: ')+score+' / 5';$('score').classList.add('show')}};w.appendChild(b)});w.appendChild(f);box.appendChild(w)})}function render(){document.title=t(D.title)+' | AI4Kids Grade 1 Robotics';put($('brand'),B('AI4Kids · Grade 1 · Robotics','AI4Kids · Jamaat 1 · Robotics'));put($('title'),D.title);put($('subtitle'),D.desc);$('langBtn').textContent=lang==='en'?'Roman Urdu':'English';$('langBtn').setAttribute('aria-pressed',lang==='ru');put($('demoTitle'),D.demo.title);put($('demoInstruction'),D.demo.ins);var L=labels();['hook','sam','mis','do'].forEach(function(k){put($(k+'Tag'),L[k]);put($(k+'Text'),D[k])});put($('quizHead'),B('Quiz — 5 questions','Quiz — 5 sawaal'));put($('foot'),B('AI4Kids · Grade 1 Robotics · Learn, play, and stay safe.','AI4Kids · Jamaat 1 Robotics · Seekho, khelo aur safe raho.'));tabs();demo();quiz()}$('langBtn').onclick=function(){lang=lang==='en'?'ru':'en';render()};$('speakBtn').onclick=function(){if('speechSynthesis' in window){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(document.body.innerText);u.lang=lang==='en'?'en-US':'ur-PK';speechSynthesis.speak(u)}};render()})();</script></body></html>
