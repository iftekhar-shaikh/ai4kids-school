<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community helpers | AI4Kids Grade 3 General Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

  :root{
    --doc:#2a9bb8;
    --doc-deep:#1a6f86;
    --teach:#5b6fd9;
    --teach-deep:#3a4aa8;
    --farm:#2e9a5c;
    --farm-deep:#1e6b3f;
    --pol:#c9702e;
    --pol-deep:#9a5320;
    --fire:#c4453a;
    --fire-deep:#8f2e26;
    --clean:#3d8b6e;
    --clean-deep:#2a5f4a;
    --ok:#2e7d4f;
    --no:#c4453a;
    --ink:#1f2933;
    --ink-soft:#4a5661;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#1a5b8f;
    --warm:#c9702e;
    --care:#3d8b6e;
    --board:#eef3f7;
    --board-deep:#d9e5ee;
    --good-bg:#e8f2ed;
    --bad-bg:#fbeae8;

    --fs-cap:clamp(14px, 3.8vw, 16px);
    --fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.8vw, 20px);
    --fs-md:clamp(19px, 5.2vw, 22px);
    --fs-lg:clamp(22px, 6vw, 26px);
    --fs-xl:clamp(30px, 8vw, 38px);
    --lh:1.5;
  }
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);
    --fs-xs:clamp(17px, 4.5vw, 19px);
    --fs-sm:clamp(19px, 5.2vw, 22px);
    --fs-md:clamp(21px, 5.6vw, 24px);
    --fs-lg:clamp(24px, 6.5vw, 28px);
    --fs-xl:clamp(28px, 7.5vw, 36px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--warm);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .tabs{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
  .tabs button{
    flex:1 1 28%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:52px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
    padding:14px;
  }

  .readout{
    margin-top:12px;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px;
             background:var(--accent)}
  .statechip.ur{padding:2px 14px 7px}
  .lead{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .lead.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}
  body.urdu .why-note{
    border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;
    line-height:var(--lh);
  }

  .play{
    width:100%;margin-top:12px;border:3px solid var(--ink);border-radius:18px;
    background:var(--ink);color:var(--paper);font:inherit;font-weight:800;
    font-size:var(--fs-md);cursor:pointer;min-height:60px;
  }
  .play:active{transform:scale(.98)}
  .play.alt{background:var(--farm);border-color:var(--farm-deep)}
  .play:disabled{opacity:.45;cursor:not-allowed}

  .two{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .two .play{flex:1;min-width:140px;margin-top:0}

  .panel{margin-top:18px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}

  .lesson{
    margin-top:18px;border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
    background:var(--paper);
  }
  .lesson .tag{
    display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
    padding:4px 12px;font-size:var(--fs-cap);font-weight:800;margin-bottom:10px;
  }
  .lesson p{margin:0 0 10px;font-size:var(--fs-sm);line-height:1.55}
  .lesson p:last-child{margin-bottom:0}
  body.urdu .lesson p{line-height:var(--lh)}

  .helper-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .helper-btn{
    border:3px solid var(--line);background:var(--paper);border-radius:18px;
    padding:16px 10px;font:inherit;cursor:pointer;min-height:110px;color:var(--ink);
    text-align:center;
  }
  .helper-btn .emoji{font-size:36px;display:block;margin-bottom:6px}
  .helper-btn .lbl{font-size:var(--fs-sm);font-weight:800;display:block;line-height:1.3}
  .helper-btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px rgba(26,91,143,.2)}
  .helper-btn.doc[aria-pressed="true"]{border-color:var(--doc);background:#e6f5f9}
  .helper-btn.teach[aria-pressed="true"]{border-color:var(--teach);background:#eef0fb}
  .helper-btn.farm[aria-pressed="true"]{border-color:var(--farm);background:#e8f5ee}
  .helper-btn.pol[aria-pressed="true"]{border-color:var(--pol);background:#fbf1e8}
  .helper-btn.fire[aria-pressed="true"]{border-color:var(--fire);background:#fbeae8}
  .helper-btn.clean[aria-pressed="true"]{border-color:var(--clean);background:#eaf4ef}

  .match-prompt{
    margin-top:12px;padding:14px 16px;border:2px dashed var(--warm);border-radius:14px;
    background:#fbf1e8;font-size:var(--fs-sm);font-weight:700;color:#8a4a12;line-height:1.55;
  }
  body.urdu .match-prompt{line-height:var(--lh)}

  .tool-card{
    margin-top:12px;border:3px solid var(--ink);border-radius:18px;padding:18px 14px;
    background:var(--paper);text-align:center;
  }
  .tool-card .emoji{font-size:48px;display:block;margin-bottom:8px}
  .tool-card .name{font-size:var(--fs-lg);font-weight:800;margin:0 0 4px}
  .tool-card .hint{font-size:var(--fs-xs);color:var(--ink-soft);margin:0}

  .choice-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .choice-btn{
    border:3px solid var(--line);background:var(--paper);border-radius:14px;
    padding:14px 10px;font:inherit;font-weight:800;font-size:var(--fs-sm);
    cursor:pointer;min-height:72px;color:var(--ink);text-align:center;
  }
  .choice-btn .emoji{font-size:24px;display:block;margin-bottom:4px}
  .choice-btn.ok{border-color:var(--ok);background:var(--good-bg)}
  .choice-btn.no{border-color:var(--no);background:var(--bad-bg)}
  .choice-btn:disabled{opacity:.85;cursor:default}

  .scene-card{
    margin-top:12px;border:3px solid var(--ink);border-radius:18px;padding:18px 16px;
    background:linear-gradient(180deg,#fff8e8 0%,#f0e8d8 100%);text-align:center;
  }
  .scene-card .emoji{font-size:44px;display:block;margin-bottom:8px}
  .scene-card .ask{font-size:var(--fs-md);font-weight:800;margin:0 0 6px;line-height:1.35}
  .scene-card .ask.ur{line-height:1.95}
  .scene-card .hint{font-size:var(--fs-xs);color:var(--ink-soft);margin:0}

  .progress{
    margin-top:12px;height:14px;border-radius:999px;background:var(--line);overflow:hidden;
    border:2px solid var(--ink);
  }
  .progress > span{display:block;height:100%;background:var(--farm);width:0%;transition:width .3s}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:52px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e6f4ec;font-weight:600}
  .opt.wrong{border-color:var(--no);background:#fbeae4}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.55}
  .fb.show{display:block}
  .score{
    margin-top:8px;padding:14px 16px;border:3px solid var(--ok);border-radius:16px;
    background:#eaf4ee;font-size:var(--fs-md);font-weight:800;text-align:center;
    display:none;
  }
  .score.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  .hidden{display:none !important}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;
      grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar"
        "head  head"
        "tabs  tabs"
        "left  right"
        "quiz  quiz"
        "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar}
    .head{grid-area:head}
    .tabs{grid-area:tabs}
    .left{grid-area:left}
    .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px}
    footer{grid-area:foot}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important}
  }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

  <footer id="foot"></footer>
</div>

      if (matchPick){
        var correct = matchPick === item.ans;
        setText($("mChip"), correct ? (lang==="en"?"Correct!":"درست!") : (lang==="en"?"Try again":"دوبارہ"));
        $("mChip").style.background = correct ? "var(--ok)" : "var(--no)";
        setText($("mLead"), correct ? t(item.ok) : t(item.no));
        setText($("mDetail"), matchFeedback || "");
        lastSpoken = correct ? t(item.ok) : t(item.no);
      } else {
        setText($("mChip"), lang==="en"?"Your turn":"آپ کی باری");
        $("mChip").style.background = "var(--accent)";
        setText($("mLead"), t(MATCH.ask));
        setText($("mDetail"), t(item.hint));
        lastSpoken = t(item.name) + ". " + t(MATCH.ask);
      }

      Array.prototype.forEach.call(document.querySelectorAll("#matchChoices .choice-btn"), function(b){
        b.addEventListener("click", function(){
          if (matchPick) return;
          matchPick = b.getAttribute("data-id");
          var correct = matchPick === item.ans;
          if (correct){
            matchDone++;
            matchFeedback = t(item.ok);
          } else {
            matchFeedback = t(item.no);
          }
          renderMatch();
        });
      });
    }

    setText($("matchNext"), allDone ? t(MATCH.done) : t(MATCH.next));
    $("mGhaur").textContent = t(T.ghaur);
    setText($("mTip"), allDone
      ? (lang==="en"?"Role-play helpers at home — that is KARO!":"گھر پر ہیلپرز کی رول پلی کرو — یہی کرو ہے!")
      : (lang==="en"?"Stethoscope→doctor, chalk→teacher, tractor→farmer, whistle→police.":"سٹیتھوسکوپ→ڈاکٹر، چاک→استاد، ٹریکٹر→کسان، سیٹی→پولیس۔"));

    if ($("matchNext") && !allDone){
      $("matchNext").addEventListener("click", function(){
        if (!matchPick) return;
        if (matchPick === item.ans){
          if (matchIndex < MATCH.items.length - 1){
            matchIndex++;
            matchPick = null;
            matchFeedback = "";
          }
        } else {
          matchPick = null;
          matchFeedback = "";
        }
        renderMatch();
      });
    }
  }

  function renderThank(){
    var L = $("leftPane"), R = $("rightPane");
    var item = THANK.items[thankIndex];
    var pct = Math.round((thankDone / THANK.items.length) * 100);
    var allDone = thankDone >= THANK.items.length;

    L.innerHTML =
      '<div class="panel"><h2 id="thankHead"></h2>' +
      '<div class="match-prompt" id="thankAsk"></div>' +
      '<div class="scene-card">' +
        '<span class="emoji">'+(allDone?"🙏":item.emoji)+'</span>' +
        '<p class="ask" id="sceneAsk"></p>' +
        '<p class="hint" id="sceneHint"></p>' +
      '</div>' +
      '<div class="progress"><span id="thankBar" style="width:'+pct+'%"></span></div>' +
      '<p style="margin:8px 0 0;font-size:var(--fs-cap);font-weight:700;color:var(--ink-soft)" id="thankProg"></p>' +
      '</div>';

    var choicesHtml = "";
    THANK.choices.forEach(function(c){
      var cls = "choice-btn";
      if (!allDone && thankPick === c.id){
        cls += (c.id === item.ans) ? " ok" : " no";
      } else if (!allDone && thankPick && c.id === item.ans){
        cls += " ok";
      }
      choicesHtml += '<button type="button" class="'+cls+'" data-id="'+c.id+'"'+(thankPick||allDone?' disabled':'')+'>' +
        '<span class="emoji">'+c.emoji+'</span><span id="tc_'+c.id+'"></span></button>';
    });

    R.innerHTML =
      '<div class="scene">' +
        '<div class="readout" style="margin-top:0">' +
          '<span class="statechip" id="tChip"></span>' +
          '<p class="lead" id="tLead"></p>' +
          '<p class="detail" id="tDetail"></p>' +
        '</div>' +
        (allDone ? '' : '<div class="choice-row" id="thankChoices">'+choicesHtml+'</div>') +
        '<div class="two">' +
          '<button type="button" class="play alt" id="thankNext"'+(allDone||!thankPick?' disabled':'')+'></button>' +
        '</div>' +
        '<p class="why-note"><b id="tGhaur"></b> <span id="tTip"></span></p>' +
      '</div>' +
      '<div class="lesson" style="margin-top:12px"><span class="tag" id="tMisTag"></span><p id="tMis"></p></div>';

    setText($("thankHead"), t(THANK.head));
    setText($("thankAsk"), t(THANK.ask));
    setText($("thankProg"), t(THANK.prog) + ": " + thankDone + " / " + THANK.items.length);
    setText($("tMisTag"), t(MISAAL.tag));
    setText($("tMis"), t(MISAAL.p1));

    if (allDone){
      setText($("sceneAsk"), t(THANK.done));
      setText($("sceneHint"), t(THANK.shukriya));
      setText($("tChip"), t(THANK.shukriya));
      $("tChip").style.background = "var(--ok)";
      setText($("tLead"), t(THANK.done));
      setText($("tDetail"), t(KARO.p1));
      lastSpoken = t(THANK.done);
    } else {
      setText($("sceneAsk"), t(item.ask));
      setText($("sceneHint"), t(item.hint));
      THANK.choices.forEach(function(c){
        setText($("tc_"+c.id), t(c.lbl));
      });

      if (thankPick){
        var correct = thankPick === item.ans;
        setText($("tChip"), correct ? t(THANK.shukriya) : (lang==="en"?"Try again":"دوبارہ"));
        $("tChip").style.background = correct ? "var(--ok)" : "var(--no)";
        setText($("tLead"), correct ? t(item.ok) : t(item.no));
        setText($("tDetail"), thankFeedback || "");
        lastSpoken = correct ? t(item.ok) : t(item.no);
      } else {
        setText($("tChip"), lang==="en"?"Who helps?":"کون مدد کرتا ہے؟");
        $("tChip").style.background = "var(--warm)";
        setText($("tLead"), t(THANK.ask));
        setText($("tDetail"), t(item.hint));
        lastSpoken = t(item.ask);
      }

      Array.prototype.forEach.call(document.querySelectorAll("#thankChoices .choice-btn"), function(b){
        b.addEventListener("click", function(){
          if (thankPick) return;
          thankPick = b.getAttribute("data-id");
          var correct = thankPick === item.ans;
          if (correct){
            thankDone++;
            thankFeedback = t(item.ok);
          } else {
            thankFeedback = t(item.no);
          }
          renderThank();
        });
      });
    }

    setText($("thankNext"), allDone ? t(THANK.done) : t(THANK.next));
    $("tGhaur").textContent = t(T.ghaur);
    setText($("tTip"), allDone
      ? (lang==="en"?"Sick→doctor, learn→teacher, food→farmer, safety→police.":"بیمار→ڈاکٹر، سیکھنا→استاد، کھانا→کسان، حفاظت→پولیس۔")
      : (lang==="en"?"Say shukriya to every helper who makes Islamabad better!":"ہر ہیلپر کا شکریہ جو اسلام آباد بہتر بناتا ہے!"));

    if ($("thankNext") && !allDone){
      $("thankNext").addEventListener("click", function(){
        if (!thankPick) return;
        if (thankPick === item.ans){
          if (thankIndex < THANK.items.length - 1){
            thankIndex++;
            thankPick = null;
            thankFeedback = "";
          }
        } else {
          thankPick = null;
          thankFeedback = "";
        }
        renderThank();
      });
    }
  }

  function renderTab(){
    if (tab === "hook") renderHook();
    else if (tab === "helpers") renderHelpers();
    else if (tab === "match") renderMatch();
    else renderThank();
  }

  function buildQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizScore = 0;
    quizAnswered = 0;
    $("scoreBox").classList.remove("show");

    QUIZ.forEach(function(item, qi){
      var wrap = document.createElement("div");
      wrap.className = "q";
      var q = document.createElement("p");
      setText(q, (qi+1) + ". " + t(item.q));
      wrap.appendChild(q);
      var fb = document.createElement("p");
      fb.className = "fb";
      item.o.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang === "ur" ? " ur" : "");
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.textContent = (lang === "ur") ? isolate(t(opt)) : t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done") === "1") return;
          wrap.setAttribute("data-done","1");
          quizAnswered++;
          var correct = (oi === item.a);
          if (correct) quizScore++;
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi && !correct) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show");
          if (quizAnswered === QUIZ.length){
            var sb = $("scoreBox");
            setText(sb, t(T.scoreLbl) + ": " + quizScore + " " + t(T.of) + " " + QUIZ.length);
            sb.classList.add("show");
          }
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb);
      box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    document.documentElement.lang = (lang === "ur") ? "ur" : "en";
    document.documentElement.dir = (lang === "ur") ? "rtl" : "ltr";

    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");

    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    setText($("quizHead"), t(T.quiz));
    setText($("foot"), t(T.foot));

    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
      var key = b.getAttribute("data-tab");
      setText(b, t(T.tabs[key]));
      b.setAttribute("aria-pressed", key === tab ? "true" : "false");
    });

    buildQuiz();
    renderTab();
  }

  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
    b.addEventListener("click", function(){
      tab = b.getAttribute("data-tab");
      Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(x){
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      renderTab();
    });
  });

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });

  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(lastSpoken);
      u.lang = (lang === "ur") ? "ur-PK" : "en-US";
      u.rate = 0.92;
      var voices = window.speechSynthesis.getVoices() || [];
      for (var i=0;i<voices.length;i++){
        if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(lang === "ur" ? "ur" : "en") === 0){
          u.voice = voices[i]; break;
        }
      }
      window.speechSynthesis.speak(u);
    }catch(e){}
  });

  applyLang();
})();
</script>
</body>
</html>
