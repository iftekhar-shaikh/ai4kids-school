\n\1</head><body><main class="wrap"><div class="bar"><span id="brand" class="brand"></span><button id="lang" class="chip" aria-pressed="false">Roman Urdu</button><button id="speak" class="chip" aria-label="Play">🔊</button></div><header><h1 id="title"></h1><p id="sub" class="sub"></p></header><nav id="tabs" class="tabs"></nav><div class="columns"><div id="left"></div><div id="right"></div></div><div id="lessons"></div><section class="quiz"><h2 id="qh"></h2><div id="quiz"></div><div id="score" class="score"></div></section><footer id="foot"></footer></main><script>const DATA={"title":{"en":"School aur ghar","ur":"School aur ghar"},"desc":{"en":"Vocabulary — school, home, food, clothes","ur":"Vocabulary — school, home, food, clothes"},"sections":[{"key":"hook","tag":{"en":"HOOK","ur":"HOOK"},"body":{"en":"Think about two places you know well: school and home. What do you see in each place? Let us learn words for school, home, food, and clothes.","ur":"Bachay, aap kabhi sochay hain ke school aur ghar mein kya kya cheezen hoti hain? Kya aapko school mein khana pasand hai ya ghar par? Aur kya aapko school ke liye ya ghar ke liye zyada acha lagta hai?"}},{"key":"samjhao","tag":{"en":"SAMJHAO","ur":"SAMJHAO"},"body":{"en":"School is where we learn, meet teachers, and play. Home is where we live with family and rest. We eat lunch at school and meals at home. A uniform is for school; comfortable clothes are for home.","ur":"Aaj hum \"School aur Ghar\" ke bare mein baat karenge. School hamara wo jagah hai jahan hum seekhte hain. Wahan humare teachers hote hain jo humein new cheezein sikhate hain. School mein hum dost banate hain aur khelte hain. Ye sab cheezen humari learning ka hissa hain.\n\nGhar hamari wo jagah hai jahan hum apne family ke sath rehte hain. Ghar par hum relax karte hain aur apne pyaray logon ke sath waqt guzarte hain. Ghar mein sab log milkar khana khate hain aur ek doosre ke sath baatein karte hain. \n\nFood bhi school aur ghar dono mein zaroori hai. School mein hum lunch karte hain aur ghar par dinner. Hamara favorite khana kya hai? Biryani, chicken karahi, ya pizza? Ye khanay humein taakat dete hain.\n\nClothes ka bhi school aur ghar par alag maqsad hota hai. School mein humein uniform pehnni hoti hai taake hum sab same nazar aayen. Ghar par hum comfortable clothes pehente hain jahan hum relaxed feel karte hain."}},{"key":"misaal","tag":{"en":"MISAAL","ur":"MISAAL"},"body":{"en":"A school may have books, a teacher, a desk, and lunch. A home may have a kitchen, family, food, and clothes. We can say, “I read a book at school.”","ur":"Aapne bazaar mein kabhi dekha hai ke log kis tarah se khanay ki shopping karte hain? Baazaar mein sabziyan, fruits aur khanay ki cheezen milti hain. Aksar hum lunch ke liye ghar par biryani banate hain, jo humein school se wapas aakar khana hota hai. Jo khana ghar par banta hai wo hamesha sabse acha hota hai!"}},{"key":"karo","tag":{"en":"KARO","ur":"KARO"},"body":{"en":"Make a two-column chart. Write school words on one side and home words on the other. Add food and clothes, then show it to your teacher or family.","ur":"Ab ek fun activity karte hain. Aapko apne school aur ghar ke liye ek chart banana hai! Chart par aapko school aur ghar ki cheezen likhni hain — jese school - books, teachers, lunch, aur ghar - kitchen, family, clothes. Is chart ko apne teachers ya family ko dikhao aur unse in cheezon ke bare mein baat karo.\n\n## SAWAAL\n1. School aur ghar mein kaun se cheezein hoti hain?\n2. Aapko school ka khana kaise lagta hai?\n3. Ghar par aapka favorite khana kya hai?\n\nEnglish Ma'am"}}],"quiz":[{"q":{"en":"What is the English word for “school”?","ur":"School ka Urdu kya hai?"},"opts":[{"en":"School","ur":"School"},{"en":"Home","ur":"Ghar"},{"en":"Food","ur":"Khana"},{"en":"Clothes","ur":"Kapray"}],"ans":0,"exp":{"en":"School ka matlab school hi hota hai.","ur":"School ka matlab school hi hota hai."}},{"q":{"en":"What is the purpose of a home?","ur":"Ghar ka maqasid kya hai?"},"opt
