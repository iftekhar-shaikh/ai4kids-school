 deta hai. Light sensor roshni, sound sensor awaaz aur distance sensor qareeb cheez notice karta hai. Sensors clues dete hain taa-ke robot apna program follow kare."},"mis":{"en":"A robot vacuum can use a distance sensor to notice a wall and turn. A doorbell uses a button sensor to notice a press.","ru":"Robot vacuum distance sensor se wall notice karke turn kar sakta hai. Doorbell button sensor se press notice karti hai."},"do":{"en":"Point to a bright window, a quiet corner, and a nearby book. Pretend your eyes and ears are sensors. Tell a partner what each one notices.","ru":"Roshan window, khamosh kona aur qareeb kitaab ki taraf ishara karo. Apni aankhon aur kaanon ko sensors samjho. Partner ko batao har sensor kya notice karta hai."},"demo":{"type":"sensor","title":{"en":"Sensor scan","ru":"Sensor scan"},"ins":{"en":"Choose a sensor, then press Scan to see its clue.","ru":"Sensor chuno, phir Scan dabao aur clue dekho."},"items":[["👁️","Light sensor","Clue: I notice bright light.","Clue: Mujhe roshni nazar aa rahi hai."],["👂","Sound sensor","Clue: I notice a sound.","Clue: Mujhe awaaz sunai de rahi hai."],["📏","Distance sensor","Clue: Something is near.","Clue: Koi cheez qareeb hai."]]},"quiz":[{"q":{"en":"What can robot eyes help notice?","ru":"Robot ki aankhein kis cheez ko dekhne mein madad karti hain?"},"o":[{"en":"Colours","ru":"Rang"},{"en":"Guests","ru":"Mehman"},{"en":"Luck","ru":"Taqdeer"},{"en":"Light","ru":"Roshni"}],"c":0,"e":{"en":"A camera-like sensor can notice colours and objects.","ru":"Camera jaisa sensor rang aur cheezen notice kar sakta hai."}},{"q":{"en":"What do robot ears listen to?","ru":"Robot ke kaan kis cheez ko sunne ke liye hote hain?"},"o":[{"en":"A house sound","ru":"Ghar ki awaz"},{"en":"Sounds of the world","ru":"Duniya ki awaz"},{"en":"Weather","ru":"Mausam"},{"en":"Its own voice","ru":"Khud ki awaz"}],"c":1,"e":{"en":"A sound sensor notices sounds around the robot.","ru":"Sound sensor robot ke aas paas ki awazein notice karta hai."}},{"q":{"en":"Are sensors only for robots?","ru":"Kya sensors sirf robot ke liye hain?"},"o":[{"en":"Yes","ru":"Haan"},{"en":"No","ru":"Nahin"},{"en":"Sometimes","ru":"Kabhi kabhi"},{"en":"For humans only","ru":"Sirf humans ke liye"}],"c":1,"e":{"en":"Sensors are also used in phones, cars, and many tools.","ru":"Sensors phones, cars aur bohot se tools mein bhi hotay hain."}},{"q":{"en":"How can robot eyes work?","ru":"Robot ki aankhein kis tarah kaam karti hain?"},"o":[{"en":"By noticing light","ru":"Roshni ko dekh kar"},{"en":"By themselves","ru":"Khud se"},{"en":"With air","ru":"Hawa se"},{"en":"With friends","ru":"Doston se"}],"c":0,"e":{"en":"A light or camera sensor notices light.","ru":"Light ya camera sensor roshni notice karta hai."}},{"q":{"en":"Can robot ears hear every sound?","ru":"Kya robot ke kaan har awaaz sun sakte hain?"},"o":[{"en":"Yes, every sound","ru":"Haan, har awaaz"},{"en":"No, only some sounds","ru":"Nahin, sirf kuch awaz"},{"en":"Sometimes","ru":"Kabhi kabhi"},{"en":"None","ru":"Koi bhi nahin"}],"c":1,"e":{"en":"A sensor hears only the sounds it is made to notice.","ru":"Sensor sirf woh awazein sunta hai jinhein notice karne ke liye bana ho."}}]};(function(){'use strict';function B(en,ru){return{en:en,ru:ru}}var lang='en',sel=0,go=0,col=0,job=0,D=LESSON;function $(x){return document.getElementById(x)}function t(x){return x&&typeof x==='object'?(x[lang]||x.en||''):String(x||'')}function put(e,x){e.textContent=t(x);e.dir='ltr'}function labels(){return{play:{en:'Play',ru:'Play'},hook:{en:'HOOK',ru:'HOOK'},sam:{en:'SAMJHAO',ru:'SAMJHAO'},mis:{en:'MISAAL',ru:'MISAAL'},do:{en:'KARO',ru:'KARO'}}}function btn(text,fn){var b=document.createElement('button');b.type='button';b.className='play';b.textContent=text;b.onclick=fn;return b}function msg(s,x){var p=document.createElement('div');p.className='demo-msg';put(p,x);s.appendChild(p)}function demo(){var s=$('demoStage');s.innerHTML='';var d=D.demo;if(d.type==='machine'||d.type==='sensor'||d.typ D.desc);$('langBtn').textContent=lang==='en'?'Roman Urdu':'English';$('langBtn').setAttribute('aria-pressed',lang==='ru');put($('demoTitle'),D.demo.title);put($('demoInstruction'),D.demo.ins);var L=labels();['hook','sam','mis','do'].forEach(function(k){put($(k+'Tag'),L[k]);put($(k+'Text'),D[k])});put($('quizHead'),B('Quiz — 5 questions','Quiz — 5 sawaal'));put($('foot'),B('AI4Kids · Grade 1 Robotics · Learn, play, and stay safe.','AI4Kids · Jamaat 1 Robotics · Seekho, khelo aur safe raho.'));tabs();demo();quiz()}$('langBtn').onclick=function(){lang=lang==='en'?'ru':'en';render()};$('speakBtn').onclick=function(){if('speechSynthesis' in window){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(document.body.innerText);u.lang=lang==='en'?'en-US':'ur-PK';speechSynthesis.speak(u)}};render()})();</script></body></html>
