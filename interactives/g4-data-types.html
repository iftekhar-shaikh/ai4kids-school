<title>Data types / ڈیٹا کی اقسام | AI4Kids Class 4</title>

<style>
/* AI4KIDS_BRAND */:root{--ink:#17252f;--muted:#526672;--paper:#fffdf7;--card:#ffffff;--line:#d9d2c5;--green:#27ae60;--green-deep:#1e8449;--teal:#1abc9c;--purple:#8e44ad;--orange:#e67e22;--yellow:#fff0b8;--red:#e74c3c;--whatsapp:#25D366;--font:'Segoe UI','Trebuchet MS',Tahoma,sans-serif}/* /AI4KIDS_BRAND */

/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

  :root{
    --board:#e8e4f5;--board-deep:#d4cce8;--sky:#c9b8f0;--sky2:#9b7fd4;
    --accent:#5b4a8f;--ok:#2e7d4f;--ink:#1e2a1a;--ink-soft:#4a5744;
    --paper:#fdfaf3;--line:#d5dec8;--gold:#e8b23d;--left:#c4453a;
    --num:#2f6fb5;--txt:#c9702e;--bool:#3d9b8f;--list:#8b5a2b;
    --fs-cap:clamp(14px, 3.8vw, 16px);--fs-xs:clamp(16px, 4.2vw, 18px);--fs-sm:clamp(18px, 4.8vw, 20px);--fs-md:clamp(19px, 5.2vw, 22px);--fs-lg:clamp(22px, 6vw, 26px);--fs-xl:clamp(30px, 8vw, 38px);--lh:1.5;
  }
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);--fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);--fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);--lh:2.1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--font);
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .stars{display:flex;align-items:center;gap:6px;font-weight:800;font-size:var(--fs-xs);
         background:#fff6e2;border:2px solid var(--gold);border-radius:999px;padding:7px 13px}
  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}
  .tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
  .tabs button{
    flex:1 1 28%;min-width:90px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:10px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:54px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .tabs button .badge{color:var(--gold)}
  .story{
    background:#fff8ea;border:2px dashed var(--gold);border-radius:16px;padding:13px 15px;
    font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6;margin-bottom:14px;
  }
  body.urdu .story{line-height:var(--lh)}
  .story b{color:var(--ink)}
  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 38%,var(--board) 38%,var(--board-deep) 100%);
    min-height:280px;
  }
  .scene-pad{padding:10px 12px 18px;min-height:260px;position:relative}
  .sky-layer{position:absolute;inset:0 0 58% 0;pointer-events:none;overflow:hidden}
  .sun-ball{
    position:absolute;top:12px;right:18px;width:36px;height:36px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffe9a0,#f5c542 60%,#e0a020);
    box-shadow:0 0 18px rgba(245,197,66,.45);z-index:1;
  }
  body.urdu .sun-ball{right:auto;left:18px}
  .cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:40px;opacity:.9}
  .cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
  .c1{width:48px;height:15px;top:18px;left:12%}
  .c1:before{width:22px;height:22px;top:-12px;left:6px}
  .c1:after{width:18px;height:18px;top:-8px;left:24px}
  .c2{width:34px;height:12px;top:34px;left:55%;opacity:.7}
  .c2:before{width:16px;height:16px;top:-9px;left:4px}
  .c2:after{width:12px;height:12px;top:-5px;left:16px}
  .type-stage{position:relative;z-index:5;padding-top:70px;text-align:center;min-height:150px}
  .type-hero{font-size:52px;line-height:1;margin:4px 0 8px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
  .type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .type-bin{
    border:2.5px dashed rgba(30,42,26,.4);border-radius:14px;
    background:rgba(253,250,243,.85);padding:8px 6px;min-height:72px;
    text-align:center;font-weight:800;font-size:var(--fs-cap);
  }
  .type-bin.num{border-color:var(--num)}
  .type-bin.txt{border-color:var(--txt)}
  .type-bin.bool{border-color:var(--bool)}
  .type-bin.list{border-color:var(--list)}
  .type-bin .bin-title{margin-bottom:4px;color:var(--ink-soft);font-size:14px}
  .type-bin .drop{font-size:18px;min-height:28px;line-height:1.2}
  .bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;position:relative;z-index:5}
  .mini-item{
    border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff;
    line-height:1;cursor:pointer;min-width:44px;min-height:48px;font-weight:800;font-size:var(--fs-cap);
    display:flex;align-items:center;gap:4px;
  }
  .mini-item.used{opacity:.3;pointer-events:none}
  .mini-item.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,74,143,.2)}
  .save-choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .save-choices button{
    border:2.5px solid var(--ink);background:var(--paper);border-radius:14px;
    padding:12px 14px;font:inherit;font-weight:800;font-size:var(--fs-xs);
    cursor:pointer;text-align:left;min-height:52px;display:flex;align-items:center;gap:10px;
  }
  body.urdu .save-choices button{text-align:right}
  .save-choices button .cem{font-size:26px}
  .save-choices button.right{border-color:var(--ok);background:#e8f2ed}
  .save-choices button.wrong{border-color:var(--left);background:#fbeae8}
  .type-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
  .type-pill{
    border:2px solid var(--ink);border-radius:12px;padding:8px 12px;background:#fff;
    font-size:var(--fs-cap);font-weight:800;cursor:pointer;min-height:44px;
  }
  .type-pill.num{border-color:var(--num);background:#e8f1f9}
  .type-pill.txt{border-color:var(--txt);background:#fef3e8}
  .type-pill.bool{border-color:var(--bool);background:#e6f5f2}
  .type-pill.list{border-color:var(--list);background:#f5efe8}
  .type-pill.on{box-shadow:0 0 0 3px rgba(91,74,143,.3)}
  .type-pill.right{border-color:var(--ok);background:#e8f2ed}
  .type-pill.wrong{border-color:var(--left);background:#fbeae8}
  .match-grid{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .match-row{
    display:flex;align-items:center;gap:8px;background:rgba(253,250,243,.95);
    border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-weight:800;font-size:var(--fs-xs);
  }
  .match-row .mem{font-size:28px;flex-shrink:0}
  .match-row .mtxt{flex:1;line-height:1.35;text-align:left}
  body.urdu .match-row .mtxt{text-align:right;line-height:1.85}
  .match-opts{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
  .match-opts button{
    border:2px solid var(--ink);border-radius:10px;padding:6px 10px;background:#fff;
    font:inherit;font-weight:800;font-size:14px;cursor:pointer;min-height:36px;
  }
  .match-opts button.right{border-color:var(--ok);background:#e8f2ed}
  .match-opts button.wrong{border-color:var(--left);background:#fbeae8}
  .outcome{
    margin-top:10px;border-radius:14px;padding:10px 12px;font-weight:700;font-size:var(--fs-xs);
    display:none;border:2px solid var(--ok);background:#e8f2ed;color:var(--ok);
  }
  .outcome.show{display:block}
  .outcome.bad{border-color:var(--left);background:#fbeae8;color:var(--left)}
  .readout{
    margin-top:-18px;position:relative;z-index:2;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.win{background:var(--ok)}
  .statechip.miss{background:var(--left)}
  .headline{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .headline.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
  .hintbox{
    margin-top:14px;border:2px solid var(--accent);background:#f0ebf8;border-radius:14px;
    padding:11px 14px;font-size:var(--fs-xs);color:var(--accent);font-weight:700;line-height:1.55;
    display:none;
  }
  .hintbox.show{display:block}
  body.urdu .hintbox{line-height:var(--lh)}
  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .prog{margin:0 0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft)}
  .btns{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}
  .btns button{
    border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);
    font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;min-height:50px;
    padding:8px 14px;flex:1;
  }
  .btns .go{background:var(--ink);color:var(--paper)}
  .btns button:active{transform:scale(.97)}
  .btns button:disabled{opacity:.4;cursor:default}
  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .qhead h2{font-size:var(--fs-lg);font-weight:800;margin:0;flex:1}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--left);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}
  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}
  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar" "head  head" "tabs  tabs" "story story"
        "left  right" "quiz  quiz" "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .story{grid-area:story} .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation:none !important}
  }

  function renderSort(){
    var ch = SORT[sortIdx];
    var pad = $("scenePad");
    pad.innerHTML = skyHTML() +
      '<div class="type-stage">' +
      '<div class="type-hero">📦🔢🔤</div>' +
      '<div class="type-grid">' +
      '<div class="type-bin num"><div class="bin-title" id="binNum"></div><div class="drop" id="dropNum"></div></div>' +

      '</div></div>';
    setText($("binNum"), typeLabel("num"));
    setText($("binTxt"), typeLabel("txt"));
    setText($("binBool"), typeLabel("bool"));
    setText($("binList"), typeLabel("list"));

    function refreshBins(){
      var drops = {num:"", txt:"", bool:"", list:""};
      ch.cards.forEach(function(c){
        if (sortMap[c.id]) drops[sortMap[c.id]] += c.em + " ";
      });
      $("dropNum").textContent = drops.num || "—";
      $("dropTxt").textContent = drops.txt || "—";
      $("dropBool").textContent = drops.bool || "—";
      $("dropList").textContent = drops.list || "—";
    }
    refreshBins();

    setText($("statechip"), (sortIdx+1) + " / " + SORT.length);
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"");
    setText($("headline"), t(ch.title));
    setText($("detail"), t(T.askSort));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    var bank = document.createElement("div");
    bank.className = "bank";
    ch.cards.forEach(function(c){
      var used = !!sortMap[c.id];
      var m = document.createElement("button");
      m.type = "button";
      m.className = "mini-item" + (used ? " used" : "") + (sortSelected===c.id ? " selected" : "");
      m.innerHTML = c.em + " <span></span>";
      setText(m.querySelector("span"), t(c));
      m.disabled = used || !!sortDone[ch.id];
      m.addEventListener("click", function(){
        if (used || sortDone[ch.id]) return;
        sortSelected = c.id;
        renderSort();
      });
      bank.appendChild(m);
    });
    box.appendChild(bank);

    var bins = document.createElement("div");
    bins.className = "save-choices";
    ["num","txt","bool","list"].forEach(function(tk){
      var tp = TYPES[tk];
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="cem">'+tp.em+'</span><span class="clab"></span>';
      setText(b.querySelector(".clab"), t(tp));
      b.disabled = !!sortDone[ch.id] || !sortSelected;
      b.addEventListener("click", function(){
        if (sortDone[ch.id] || !sortSelected) return;
        sortMap[sortSelected] = tk;
        sortSelected = null;
        renderSort();
      });
      bins.appendChild(b);
    });
    box.appendChild(bins);

    if (!sortDone[ch.id]){
      var chk = document.createElement("button");
      chk.type = "button";
      chk.style.cssText = "margin-top:10px;width:100%;border:2px solid var(--ink);border-radius:14px;background:var(--ink);color:var(--paper);font:inherit;font-weight:800;min-height:48px;cursor:pointer";
      setText(chk, t(T.checkSort));
      chk.addEventListener("click", function(){
        var ok = true;
        ch.cards.forEach(function(c){
          if (sortMap[c.id] !== c.type) ok = false;
        });
        if (ok && Object.keys(sortMap).length === ch.cards.length){
          sortDone[ch.id] = true;
          award("sort-"+ch.id, 1);
          setText($("headline"), t(ch.done));
          $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.nice));
          if (Object.keys(sortDone).length >= SORT.length){

          $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.oops));
        }
      });
      box.appendChild(chk);
    }

    setText($("prog"), t(T.progSort) + ": " + Object.keys(sortDone).length + "/" + SORT.length);
  }

  /* ---------- PICK ---------- */
  function renderPick(){
    var ch = PICK[pickIdx];
    var pad = $("scenePad");
    pad.innerHTML = skyHTML() +
      '<div class="type-stage">' +
      '<div class="type-hero">'+ch.em+'</div>' +
      '<div class="type-row" id="pickScene"></div></div>';
    var sc = document.createElement("div");
    sc.style.cssText = "background:rgba(253,250,243,.95);border:2.5px solid var(--ink);border-radius:14px;padding:12px;font-weight:800;font-size:var(--fs-xs);max-width:300px;margin:0 auto";
    setText(sc, t(ch.scene));
    $("pickScene").appendChild(sc);

    setText($("statechip"), (pickIdx+1) + " / " + PICK.length);
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"");
    setText($("headline"), t(ch.title));
    setText($("detail"), t(T.askPick));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    var row = document.createElement("div");
    row.className = "type-row";
    ["num","txt","bool","list"].forEach(function(tk){
      var tp = TYPES[tk];
      var b = document.createElement("button");
      b.type = "button";
      b.className = "type-pill " + tp.cls;
      if (pickDone[ch.id] && tk === ch.correct) b.classList.add("right");
      setText(b, tp.em + " " + t(tp));
      b.disabled = !!pickDone[ch.id];
      b.addEventListener("click", function(){
        if (pickDone[ch.id]) return;
        if (tk === ch.correct){
          pickDone[ch.id] = true;
          award("pick-"+ch.id, 1);
          b.classList.add("right");
          setText($("headline"), t(ch.done));
          $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.nice));
          if (Object.keys(pickDone).length >= PICK.length){
            doneModes.pick = true;
            award("mode-pick", 2);
          }
          tabBadges();
        } else {
          b.classList.add("wrong");
          setText($("headline"), t(T.oops));
          $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.oops));
        }
      });
      row.appendChild(b);
    });
    box.appendChild(row);
    setText($("prog"), t(T.progPick) + ": " + Object.keys(pickDone).length + "/" + PICK.length);
  }

  /* ---------- WHY ---------- */
  function renderWhy(){
    var ch = WHY[whyIdx];
    var pad = $("scenePad");
    pad.innerHTML = skyHTML() +
      '<div class="type-stage">' +
      '<div class="type-hero">🧩💡</div>' +
      '<div class="type-row">' +
      '<span class="type-pill num">'+TYPES.num.em+'</span>' +
      '<span class="type-pill txt">'+TYPES.txt.em+'</span>' +
      '<span class="type-pill bool">'+TYPES.bool.em+'</span>' +
      '<span class="type-pill list">'+TYPES.list.em+'</span>' +
      '</div></div>';

    setText($("statechip"), (whyIdx+1) + " / " + WHY.length);
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"");
    setText($("headline"), t(ch.title));
    setText($("detail"), t(T.askWhy));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    var grid = document.createElement("div");
    grid.className = "match-grid";
    ch.rows.forEach(function(row){
      var div = document.createElement("div");
      div.className = "match-row";
      div.innerHTML = '<span class="mem">'+row.em+'</span><span class="mtxt"></span><span class="match-opts"></span>';
      setText(div.querySelector(".mtxt"), t(row.use));
      var opts = div.querySelector(".match-opts");
      ["num","txt","bool","list"].forEach(function(tk){
        var tp = TYPES[tk];
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = tp.em;
        b.title = t(tp);
        if (whyDone[ch.id] && whyMap[row.id] === tk){
          if (tk === row.type) b.classList.add("right");
        } else if (whyMap[row.id] === tk){
          b.classList.add("on");
          b.style.boxShadow = "0 0 0 2px var(--accent)";
        }
        b.disabled = !!whyDone[ch.id];
        b.addEventListener("click", function(){
          if (whyDone[ch.id]) return;
          whyMap[row.id] = tk;
          renderWhy();
        });
        opts.appendChild(b);
      });
      grid.appendChild(div);
    });
    box.appendChild(grid);

    if (!whyDone[ch.id]){
      var chk = document.createElement("button");
      chk.type = "button";
      chk.style.cssText = "margin-top:10px;width:100%;border:2px solid var(--ink);border-radius:14px;background:var(--ink);color:var(--paper);font:inherit;font-weight:800;min-height:48px;cursor:pointer";
      setText(chk, t(T.checkMatch));
      chk.addEventListener("click", function(){
        var ok = true;
        ch.rows.forEach(function(r){
          if (whyMap[r.id] !== r.type) ok = false;
        });
        if (ok && Object.keys(whyMap).length === ch.rows.length){
          whyDone[ch.id] = true;
          award("why-"+ch.id, 1);
          setText($("headline"), t(ch.done));
          $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.nice));
          if (Object.keys(whyDone).length >= WHY.length){
            doneModes.why = true;
            award("mode-why", 2);
          }
          tabBadges();
          renderWhy();
        } else {
          setText($("headline"), t(T.oops));
          $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.oops));
        }
      });
      box.appendChild(chk);
    }

    setText($("prog"), t(T.progWhy) + ": " + Object.keys(whyDone).length + "/" + WHY.length);
  }

  /* ---------- QUIZ ---------- */
  function pickQuiz(){ quizSet = shuffle(QUIZ).slice(0, 5); }
  function renderQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizSet.forEach(function(item, qi){
      var wrap = document.createElement("div");
      wrap.className = "q";
      var p = document.createElement("p");
      setText(p, (qi+1) + ". " + t(item.q));
      wrap.appendChild(p);
      var answered = false;
      item.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang==="ur"?" ur":"");
        setText(b, t(opt));
        b.addEventListener("click", function(){
          if (answered) return;
          answered = true;
          if (oi === item.correct){
            b.classList.add("right");
            award("quiz-"+qi, 1);
          } else {
            b.classList.add("wrong");
            var kids = wrap.querySelectorAll(".opt");
            if (kids[item.correct]) kids[item.correct].classList.add("right");
          }
          fb.classList.add("show");
        });
        wrap.appendChild(b);
      });
      var fb = document.createElement("p");
      fb.className = "fb";
      setText(fb, t(item.why));
      wrap.appendChild(fb);
      box.appendChild(wrap);
    });
  }

  function storyHtml(){
    if (mode === "sort") return t(T.storySort);
    if (mode === "pick") return t(T.storyPick);
    return t(T.storyWhy);
  }

  function tabBadges(){
    function lab(btn, label, key){
      btn.innerHTML = "";
      var span = document.createElement("span");
      setText(span, t(label));
      btn.appendChild(span);
      if (doneModes[key]){
        var b = document.createElement("span");
        b.className = "badge"; b.textContent = " ★";
        btn.appendChild(b);
      }
    }
    lab($("tabSort"), T.tabSort, "sort");
    lab($("tabPick"), T.tabPick, "pick");
    lab($("tabWhy"), T.tabWhy, "why");
    $("tabSort").setAttribute("aria-pressed", mode==="sort"?"true":"false");
    $("tabPick").setAttribute("aria-pressed", mode==="pick"?"true":"false");
    $("tabWhy").setAttribute("aria-pressed", mode==="why"?"true":"false");
  }

  function setMode(m){
    mode = m;
    if (mode === "sort"){ sortSelected = null; renderSort(); }
    else if (mode === "pick") renderPick();
    else { renderWhy(); }
    applyChrome();
  }

  function applyChrome(){
    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    $("story").innerHTML = storyHtml();
    $("story").classList.toggle("ur", lang==="ur");
    $("story").setAttribute("dir", lang==="ur"?"rtl":"ltr");
    setText($("ctlHead"), t(T.ctl));
    setText($("nextBtn"), t(T.next));
    setText($("hintBtn"), t(T.hint));
    setText($("resetBtn"), t(T.reset));
    setText($("quizHead"), t(T.quiz));
    setText($("newQuiz"), t(T.newQuiz));
    $("langBtn").textContent = (lang === "en") ? "اردو" : "EN";
    $("langBtn").setAttribute("aria-pressed", lang==="ur"?"true":"false");
    document.body.classList.toggle("urdu", lang==="ur");
    document.documentElement.lang = (lang==="ur") ? "ur" : "en";
    document.documentElement.dir = (lang==="ur") ? "rtl" : "ltr";
    tabBadges();
    var foot = document.querySelector("footer p");
    if (foot) setText(foot, foot.getAttribute(lang==="ur"?"data-ur":"data-en"));
  }

  function applyLang(){
    applyChrome();
    if (mode === "sort") renderSort();
    else if (mode === "pick") renderPick();
    else renderWhy();
    renderQuiz();
  }

  function next(){
    if (mode === "sort"){
      sortIdx = (sortIdx + 1) % SORT.length;
      sortMap = {}; sortSelected = null;
      renderSort();
    } else if (mode === "pick"){
      pickIdx = (pickIdx + 1) % PICK.length;
      renderPick();
    } else {
      whyIdx = (whyIdx + 1) % WHY.length;
      whyMap = {};
      renderWhy();
    }
  }

  function showHint(){
    var h;
    if (mode === "sort") h = SORT[sortIdx].hint;
    else if (mode === "pick") h = PICK[pickIdx].hint;
    else h = WHY[whyIdx].hint;
    var hb = $("hintbox");
    setText(hb, t(h));
    hb.classList.add("show");
  }

  function resetMode(){
    if (mode === "sort"){
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("sort-")===0 || k==="mode-sort") delete awarded[k]; });
      sortDone = {}; sortIdx = 0; sortMap = {}; sortSelected = null; doneModes.sort = false;
      recountStars(); renderSort();
    } else if (mode === "pick"){
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("pick-")===0 || k==="mode-pick") delete awarded[k]; });
      pickDone = {}; pickIdx = 0; doneModes.pick = false;
      recountStars(); renderPick();
    } else {
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("why-")===0 || k==="mode-why") delete awarded[k]; });
      whyDone = {}; whyIdx = 0; whyMap = {}; doneModes.why = false;
      recountStars(); renderWhy();
    }
    tabBadges();
    applyChrome();
  }

  function cleanSpeakText(s){
    return String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  function buildSpeakText(){
    var bits = [];
    bits.push(t(T.title));
    bits.push(cleanSpeakText(storyHtml()));
    bits.push(cleanSpeakText(($("headline") && $("headline").textContent) || ""));
    bits.push(cleanSpeakText(($("detail") && $("detail").textContent) || ""));
    bits.push(t(T.tip));
    return bits.filter(Boolean).join(". ");
  }
  function pickVoice(voices, want){
    var i, v, L;
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf(want) === 0) return v;
    }
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf("en") === 0) return v;
    }
    return voices[0] || null;
  }
  var speakTimer = null;
  function setSpeaking(on){
    var btn = $("speakBtn");
    if (!btn) return;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.style.opacity = on ? "0.65" : "";
  }
  function doSpeak(text, asLang){
    var u = new SpeechSynthesisUtterance(text);
    u.rate=0.82;
    var __v=window.ai4kidsPickVoice&&ai4kidsPickVoice();if(__v){u.voice=__v;u.lang=((__v.lang||'').toLowerCase().indexOf('ur')===0)?'ur-PK':'hi-IN';}else{u.lang='hi-IN';}u.rate=.82;
    var voices = window.speechSynthesis.getVoices() || [];
    var voice = pickVoice(voices, asLang === "ur" ? "ur" : "en");
    if (voice) u.voice = voice;
    u.onstart = function(){ setSpeaking(true); };
    u.onend = function(){ setSpeaking(false); };
    u.onerror = function(){
      setSpeaking(false);
      if (asLang === "ur"){
        var fallback = cleanSpeakText(T.title.en + ". " + T.storySort.en + ". " + T.tip.en);
        var u2 = new SpeechSynthesisUtterance(fallback);
        u2.lang = 'hi-IN'; u2.rate = 0.92;
        var v2 = pickVoice(window.speechSynthesis.getVoices() || [], "en");
        if (v2) u2.voice = v2;
        u2.onstart = function(){ setSpeaking(true); };
        u2.onend = u2.onerror = function(){ setSpeaking(false); };
        window.speechSynthesis.speak(u2);
      }
    };
    window.speechSynthesis.speak(u);
  }
  if ("speechSynthesis" in window){
    try { window.speechSynthesis.getVoices(); } catch (e0) {}
    if (typeof window.speechSynthesis.addEventListener === "function"){
      window.speechSynthesis.addEventListener("voiceschanged", function(){
        try { window.speechSynthesis.getVoices(); } catch (e1) {}
      });
    }
  } else {
    var noBtn = $("speakBtn");
    if (noBtn){ noBtn.disabled = true; noBtn.title = "Voice not available on this device"; }
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });
  $("tabSort").addEventListener("click", function(){ setMode("sort"); });
  $("tabPick").addEventListener("click", function(){ setMode("pick"); });
  $("tabWhy").addEventListener("click", function(){ setMode("why"); });
  $("nextBtn").addEventListener("click", next);
  $("hintBtn").addEventListener("click", showHint);
  $("resetBtn").addEventListener("click", resetMode);
  $("newQuiz").addEventListener("click", function(){ pickQuiz(); renderQuiz(); });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      var text = buildSpeakText();
      if (!text) return;
      if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
      window.speechSynthesis.cancel();
      setSpeaking(false);
      var speakLang = lang;
      speakTimer = setTimeout(function(){
        speakTimer = null;
        doSpeak(text, speakLang);
      }, 80);
    }catch(e){ setSpeaking(false); }
  });

  pickQuiz();
  applyLang();
})();
</script>
<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
</body>
