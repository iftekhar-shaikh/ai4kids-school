function award(key,n){if(awarded[key])return;awarded[key]=true;stars+=(n||1);$("starCount").textContent=String(stars)}
function recountStars(){stars=0;Object.keys(awarded).forEach(function(k){stars+=(k.indexOf("mode-")===0)?2:1});$("starCount").textContent=String(stars)}
function markWin(prefix,id,doneMap,modeKey,total){if(doneMap[id])return;doneMap[id]=true;award(prefix+"-"+id,1);if(Object.keys(doneMap).length>=total){doneModes[modeKey]=true;award("mode-"+modeKey,2)}tabBadges()}
function skyHTML(){return '<div class="sky-layer"><div class="sun-ball"></div><div class="cloud c1"></div><div class="cloud c2"></div></div>'}
function prepScene(){var pad=$("scenePad");pad.innerHTML=skyHTML();var stage=document.createElement("div");stage.className="num-stage";pad.appendChild(stage);return stage}
function addBlurb(stage,ch){var em=document.createElement("div");em.className="hero-em";em.textContent=ch.em||"📐";stage.appendChild(em);var box=document.createElement("div");box.className="card-box";setText(box,t(ch.blurb));stage.appendChild(box)}
function addShow(stage,ch){var h=document.createElement("div");h.className="num-hero";h.textContent=ch.show;stage.appendChild(h)}
function addPills(stage,ch){if(!ch.pills||!ch.pills.length)return;var row=document.createElement("div");row.className="fact-pills";ch.pills.forEach(function(p){var s=document.createElement("span");s.className="pill";var pl=p.toLowerCase();if(pl.indexOf("acute")>=0||pl.indexOf("< 90")>=0)s.className+=" acute";else if(pl.indexOf("right")>=0||pl.indexOf("= 90")>=0)s.className+=" right";else if(pl.indexOf("obtuse")>=0)s.className+=" obtuse";s.textContent=p;row.appendChild(s)});stage.appendChild(row)}
function degColor(d){if(d<90)return"#5b9bd5";if(d===90)return"#e08a3a";return"#9b6bc7"}
function angleSVG(deg,label,w){
  var r=52,cx=70,cy=78,rad=deg*Math.PI/180;
  var x2=cx+r*Math.cos(rad),y2=cy-r*Math.sin(rad);
  var large=deg>180?1:0;
  var col=degColor(deg);
  var sq="";
  if(deg===90)sq='<rect x="'+(cx+2)+'" y="'+(cy-14)+'" width="12" height="12" fill="none" stroke="#1e2a1a" stroke-width="2"/>';
  var arc='<path d="M '+(cx+28)+' '+cy+' A 28 28 0 '+large+' 0 '+ (cx+28*Math.cos(rad))+' '+(cy-28*Math.sin(rad))+'" fill="'+col+'" fill-opacity=".35" stroke="'+col+'" stroke-width="2"/>';
  return '<svg viewBox="0 0 '+(w||140)+' 100" aria-hidden="true"><line x1="'+(cx-55)+'" y1="'+cy+'" x2="'+(cx+55)+'" y2="'+cy+'" stroke="#1e2a1a" stroke-width="3" stroke-linecap="round"/><line x1="'+cx+'" y1="'+cy+'" x2="'+x2+'" y2="'+y2+'" stroke="#1e2a1a" stroke-width="3" stroke-linecap="round"/>'+arc+sq+'<circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="#1e2a1a"/><text x="'+cx+'" y="18" text-anchor="middle" font-size="13" font-weight="800" fill="#1e2a1a">'+(label||(deg+"°"))+'</text></svg>';
}
function linesSVG(kind){
  if(kind==="parallel"){
    return '<svg viewBox="0 0 160 90" aria-hidden="true"><line x1="20" y1="28" x2="140" y2="28" stroke="#1e2a1a" stroke-width="4" stroke-linecap="round"/><line x1="20" y1="58" x2="140" y2="58" stroke="#1e2a1a" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="28" x2="50" y2="58" stroke="#2f6fb5" stroke-width="2" stroke-dasharray="3 3"/><line x1="100" y1="28" x2="100" y2="58" stroke="#2f6fb5" stroke-width="2" stroke-dasharray="3 3"/><text x="80" y="82" text-anchor="middle" font-size="11" font-weight="800" fill="#1d6b52">= gap</text></svg>';
  }
  return '<svg viewBox="0 0 160 90" aria-hidden="true"><line x1="25" y1="20" x2="135" y2="70" stroke="#1e2a1a" stroke-width="4" stroke-linecap="round"/><line x1="25" y1="70" x2="135" y2="20" stroke="#1e2a1a" stroke-width="4" stroke-linecap="round"/><circle cx="80" cy="45" r="5" fill="#c4453a"/><text x="80" y="84" text-anchor="middle" font-size="11" font-weight="800" fill="#c4453a">meet</text></svg>';
}
function addAngle(stage,deg,label){var d=document.createElement("div");d.className="ang-wrap";d.innerHTML=angleSVG(deg,label);stage.appendChild(d)}
function addCompare(stage,a,b){var row=document.createElement("div");row.className="compare-row";var m1=document.createElement("div");m1.className="mini";m1.innerHTML=angleSVG(a,a+"°",120);var m2=document.createElement("div");m2.className="mini";m2.innerHTML=angleSVG(b,b+"°",120);row.appendChild(m1);row.appendChild(m2);stage.appendChild(row)}
function addLinesPic(stage,kind){var d=document.createElement("div");d.className="ang-wrap";d.innerHTML=linesSVG(kind);stage.appendChild(d)}
function showStep(i,n){setText($("statechip"),(i+1)+" / "+n);$("statechip").className="statechip"+(lang==="ur"?" ur":"")}
function showWin(msg){setText($("headline"),msg);$("statechip").className="statechip win"+(lang==="ur"?" ur":"");setText($("statechip"),t(T.nice))}
function showMiss(){setText($("headline"),t(T.oops));$("statechip").className="statechip miss"+(lang==="ur"?" ur":"");setText($("statechip"),t(T.oops))}
function stableOrder(key,arr){if(optKey!==key){optKey=key;optOrder=shuffle(arr)}return optOrder}
function clearHint(){$("hintbox").classList.remove("show")}

function renderChoices(ch,doneMap,prefix,modeKey,total,rerender){
  var box=$("actionBox");box.innerHTML="";
  var choices=document.createElement("div");choices.className="save-choices";
  stableOrder(prefix+"-"+ch.id,ch.opts.slice()).forEach(function(opt){
    var b=document.createElement("button");b.type="button";
    var en=opt.en||"";
    if(/^\d/.test(en)&&en.indexOf("°")>=0&&en.length<=6){b.className="numc";b.textContent=en;b.setAttribute("dir","ltr")}
    else setText(b,t(opt));
    if(doneMap[ch.id]&&opt.id===ch.correct)b.classList.add("right");
    b.disabled=!!doneMap[ch.id];
    b.addEventListener("click",function(){if(doneMap[ch.id])return;if(opt.id===ch.correct){markWin(prefix,ch.id,doneMap,modeKey,total);rerender()}else{b.classList.add("wrong");showMiss()}});
    choices.appendChild(b);
  });
  box.appendChild(choices);
}

function renderName(){
  var ch=NAME[nameIdx],stage=prepScene();
  addBlurb(stage,ch);addShow(stage,ch);addPills(stage,ch);addAngle(stage,ch.deg,ch.deg+"°");
  showStep(nameIdx,NAME.length);setText($("headline"),t(ch.title));
  setText($("detail"),nameDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(nameDone[ch.id])showWin(t(ch.done));
  renderChoices(ch,nameDone,"name","name",NAME.length,renderName);
  setText($("prog"),t(T.progName)+": "+Object.keys(nameDone).length+"/"+NAME.length);
}
function renderOrder(){
  var ch=ORDER[orderIdx],stage=prepScene();
  addBlurb(stage,ch);addShow(stage,ch);addPills(stage,ch);
  if(ch.kind==="bigger")addCompare(stage,ch.a,ch.b);
  else if(ch.kind==="read")addAngle(stage,ch.deg,ch.deg+"°");
  else{
    var cap=document.createElement("div");cap.className="capline";
    setText(cap,lang==="en"?"Ascending = small → big.":"صعودی = چھوٹا → بڑا۔");
    stage.appendChild(cap);
  }
  showStep(orderIdx,ORDER.length);setText($("headline"),t(ch.title));
  setText($("detail"),orderDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(orderDone[ch.id])showWin(t(ch.done));
  renderChoices(ch,orderDone,"order","order",ORDER.length,renderOrder);
  setText($("prog"),t(T.progOrder)+": "+Object.keys(orderDone).length+"/"+ORDER.length);
}
function renderLines(){
  var ch=LINES[linesIdx],stage=prepScene();
  addBlurb(stage,ch);addShow(stage,ch);addPills(stage,ch);
  addLinesPic(stage,ch.kind==="parallel"?"parallel":"cross");
  showStep(linesIdx,LINES.length);setText($("headline"),t(ch.title));
  setText($("detail"),linesDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(linesDone[ch.id])showWin(t(ch.done));
  renderChoices(ch,linesDone,"lines","lines",LINES.length,renderLines);
  setText($("prog"),t(T.progLines)+": "+Object.keys(linesDone).length+"/"+LINES.length);
}

function pickQuiz(){
  var pin=[],rest=[],i;quizState={};
  for(i=0;i<QUIZ.length;i++){if(QUIZ[i].pin)pin.push(QUIZ[i]);else rest.push(QUIZ[i])}
  rest=shuffle(rest);quizSet=shuffle(pin.concat(rest.slice(0,5-pin.length)));
}
function renderQuiz(){
  var box=$("quizBox");box.innerHTML="";
  quizSet.forEach(function(item,qi){
    var wrap=document.createElement("div");wrap.className="q";
    var p=document.createElement("p");setText(p,(qi+1)+". "+t(item.q));wrap.appendChild(p);
    if(lang==="en"&&item.ru){var g=document.createElement("p");g.className="gloss";g.textContent=item.ru;wrap.appendChild(g)}
    var st=quizState[item.id];
    item.opts.forEach(function(opt,oi){
      var b=document.createElement("button");b.type="button";b.className="opt"+(lang==="ur"?" ur":"");setText(b,t(opt));
      if(st&&oi===item.correct)b.classList.add("right");
      if(st==="no"&&quizState[item.id+"-pick"]===oi&&oi!==item.correct)b.classList.add("wrong");
      if(st)b.disabled=true;
      b.addEventListener("click",function(){
        if(quizState[item.id])return;
        quizState[item.id+"-pick"]=oi;
        if(oi===item.correct){quizState[item.id]="ok";b.classList.add("right");award("quiz-"+item.id,1)}
        else{quizState[item.id]="no";b.classList.add("wrong");var kids=wrap.querySelectorAll(".opt");if(kids[item.correct])kids[item.correct].classList.add("right")}
        fb.classList.add("show");
        var all=wrap.querySelectorAll(".opt"),k;for(k=0;k<all.length;k++)all[k].disabled=true;
      });
      wrap.appendChild(b);
    });
    var fb=document.createElement("p");fb.className="fb"+(st?" show":"");setText(fb,t(item.why));wrap.appendChild(fb);
    box.appendChild(wrap);
  });
}
function storyHtml(){if(mode==="name")return t(T.storyName);if(mode==="order")return t(T.storyOrder);return t(T.storyLines)}
function currentTip(){if(mode==="name")return T.tipName;if(mode==="order")return T.tipOrder;return T.tipLines}
function tabBadges(){
  function lab(btn,label,key){btn.innerHTML="";var span=document.createElement("span");setText(span,t(label));btn.appendChild(span);if(doneModes[key]){var b=document.createElement("span");b.className="badge";b.textContent=" ★";btn.appendChild(b)}}
  lab($("tabName"),T.tabName,"name");lab($("tabOrder"),T.tabOrder,"order");lab($("tabLines"),T.tabLines,"lines");
  $("tabName").setAttribute("aria-pressed",mode==="name"?"true":"false");
  $("tabOrder").setAttribute("aria-pressed",mode==="order"?"true":"false");
  $("tabLines").setAttribute("aria-pressed",mode==="lines"?"true":"false");
}
function renderCurrent(){if(mode==="name")renderName();else if(mode==="order")renderOrder();else renderLines()}
function setMode(m){mode=m;optKey="";renderCurrent();applyChrome()}
function applyChrome(){
  setText($("title"),t(T.title));setText($("subtitle"),t(T.sub));
  $("story").innerHTML=storyHtml();$("story").classList.toggle("ur",lang==="ur");$("story").setAttribute("dir",lang==="ur"?"rtl":"ltr");
  setText($("ctlHead"),t(T.ctl));setText($("nextBtn"),t(T.next));setText($("hintBtn"),t(T.hint));setText($("resetBtn"),t(T.reset));
  setText($("quizHead"),t(T.quiz));setText($("newQuiz"),t(T.newQuiz));
  $("langBtn").textContent=(lang==="en")?"اردو":"EN";$("langBtn").setAttribute("aria-pressed",lang==="ur"?"true":"false");
  document.body.classList.toggle("urdu",lang==="ur");
  document.documentElement.lang=(lang==="ur")?"ur":"en";
  document.documentElement.dir=(lang==="ur")?"rtl":"ltr";
  document.title=t(T.title)+" | AI4Kids Class 4";
  tabBadges();
  var foot=document.querySelector("footer p");
  if(foot)setText(foot,foot.getAttribute(lang==="ur"?"data-ur":"data-en"));
}
function applyLang(){applyChrome();renderCurrent();renderQuiz()}
function next(){
  optKey="";
  if(mode==="name"){nameIdx=(nameIdx+1)%NAME.length;renderName()}
  else if(mode==="order"){orderIdx=(orderIdx+1)%ORDER.length;renderOrder()}
  else{linesIdx=(linesIdx+1)%LINES.length;renderLines()}
}
function showHint(){
  var h=mode==="name"?NAME[nameIdx].hint:(mode==="order"?ORDER[orderIdx].hint:LINES[linesIdx].hint);
  var hb=$("hintbox");setText(hb,t(h));hb.classList.add("show");
}
function resetMode(){
  if(mode==="name"){Object.keys(awarded).forEach(function(k){if(k.indexOf("name-")===0||k==="mode-name")delete awarded[k]});nameDone={};nameIdx=0;doneModes.name=false;recountStars();renderName()}
  else if(mode==="order"){Object.keys(awarded).forEach(function(k){if(k.indexOf("order-")===0||k==="mode-order")delete awarded[k]});orderDone={};orderIdx=0;doneModes.order=false;recountStars();renderOrder()}
  else{Object.keys(awarded).forEach(function(k){if(k.indexOf("lines-")===0||k==="mode-lines")delete awarded[k]});linesDone={};linesIdx=0;doneModes.lines=false;recountStars();renderLines()}
  optKey="";tabBadges();applyChrome();
}
function cleanSpeakText(s){return String(s||"").replace(/<[^>]+>/g," ").replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&amp;/g,"&").replace(/\s+/g," ").trim()}
function buildSpeakText(){
  var bits=[];bits.push(t(T.title));bits.push(cleanSpeakText(storyHtml()));
  bits.push(cleanSpeakText(($("headline")&&$("headline").textContent)||""));
  bits.push(cleanSpeakText(($("detail")&&$("detail").textContent)||""));
  bits.push(t(currentTip()));return bits.filter(Boolean).join(". ");
}
function pickVoice(voices,want){
  var i,v,L;for(i=0;i<voices.length;i++){v=voices[i];L=(v.lang||"").toLowerCase().replace("_","-");if(L.indexOf(want)===0)return v}
  for(i=0;i<voices.length;i++){v=voices[i];L=(v.lang||"").toLowerCase().replace("_","-");if(L.indexOf("en")===0)return v}
  return voices[0]||null;
}
function setSpeaking(on){var btn=$("speakBtn");if(!btn)return;btn.setAttribute("aria-pressed",on?"true":"false");btn.style.opacity=on?"0.65":""}
function doSpeak(text,asLang){
  var u=new SpeechSynthesisUtterance(text);u.rate=0.92;u.lang=(asLang==="ur")?"ur-PK":"en-US";
  var voices=window.speechSynthesis.getVoices()||[];var voice=pickVoice(voices,asLang==="ur"?"ur":"en");if(voice)u.voice=voice;
  u.onstart=function(){setSpeaking(true)};u.onend=function(){setSpeaking(false)};
  u.onerror=function(){setSpeaking(false);if(asLang==="ur"){var fallback=cleanSpeakText(T.title.en+". "+T.storyName.en+". "+T.tipName.en);var u2=new SpeechSynthesisUtterance(fallback);u2.lang="en-US";u2.rate=0.92;var v2=pickVoice(window.speechSynthesis.getVoices()||[],"en");if(v2)u2.voice=v2;u2.onstart=function(){setSpeaking(true)};u2.onend=u2.onerror=function(){setSpeaking(false)};window.speechSynthesis.speak(u2)}};
  window.speechSynthesis.speak(u);
}
if("speechSynthesis" in window){
  try{window.speechSynthesis.getVoices()}catch(e0){}
  if(typeof window.speechSynthesis.addEventListener==="function"){window.speechSynthesis.addEventListener("voiceschanged",function(){try{window.speechSynthesis.getVoices()}catch(e1){}})}
}else{var noBtn=$("speakBtn");if(noBtn){noBtn.disabled=true;noBtn.title="Voice not available on this device"}}
$("langBtn").addEventListener("click",function(){lang=(lang==="en")?"ur":"en";applyLang()});
$("tabName").addEventListener("click",function(){setMode("name")});
$("tabOrder").addEventListener("click",function(){setMode("order")});
$("tabLines").addEventListener("click",function(){setMode("lines")});
$("nextBtn").addEventListener("click",next);
$("hintBtn").addEventListener("click",showHint);
$("resetBtn").addEventListener("click",resetMode);
$("newQuiz").addEventListener("click",function(){pickQuiz();renderQuiz()});
$("speakBtn").addEventListener("click",function(){
  try{
    if(!("speechSynthesis" in window))return;
    var text=buildSpeakText();if(!text)return;
    if(speakTimer){clearTimeout(speakTimer);speakTimer=null}
    window.speechSynthesis.cancel();setSpeaking(false);
    var speakLang=lang;
    speakTimer=setTimeout(function(){speakTimer=null;doSpeak(text,speakLang)},80);
  }catch(e){setSpeaking(false)}
});
pickQuiz();applyLang();
})();
</script>
</body>
</html>
