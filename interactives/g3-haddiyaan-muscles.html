<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haddiyaan aur muscles | AI4Kids Grade 3 General Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_BRAND */:root{--ink:#17252f;--muted:#526672;--paper:#fffdf7;--card:#ffffff;--line:#d9d2c5;--green:#27ae60;--green-deep:#1e8449;--teal:#1abc9c;--purple:#8e44ad;--orange:#e67e22;--yellow:#fff0b8;--red:#e74c3c;--whatsapp:#25D366;--font:'Segoe UI','Trebuchet MS',Tahoma,sans-serif}/* /AI4KIDS_BRAND */

/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

  :root{
    --skin:#f5c9a8;
    --bone:#e8d9b8;
    --bone-deep:#c4a86a;
    --muscle:#c94a4a;
    --muscle-deep:#8f2e2e;
    --joint:#5b8fd9;
    --joint-deep:#2f5fa0;
    --tooth:#fff8e8;
    --ok:#2e7d4f;
    --no:#c4453a;
    --ink:#1f2933;
    --ink-soft:#4a5661;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#1a5b8f;
    --warm:#c9702e;
    --care:#3d8b6e;
    --board:#eef3f7;
    --board-deep:#d9e5ee;

    --fs-cap:clamp(14px, 3.8vw, 16px);
    --fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.8vw, 20px);
    --fs-md:clamp(19px, 5.2vw, 22px);
    --fs-lg:clamp(22px, 6vw, 26px);
    --fs-xl:clamp(30px, 8vw, 38px);
    --lh:1.5;
  }
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);
    --fs-xs:clamp(17px, 4.5vw, 19px);
    --fs-sm:clamp(19px, 5.2vw, 22px);
    --fs-md:clamp(21px, 5.6vw, 24px);
    --fs-lg:clamp(24px, 6.5vw, 28px);
    --fs-xl:clamp(28px, 7.5vw, 36px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--font);
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--warm);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .tabs{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
  .tabs button{
    flex:1 1 28%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:52px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  }
  .scene svg{display:block;width:100%;height:auto}
  .zone{cursor:pointer;transition:opacity .2s, stroke-width .2s}
  .zone:hover,.zone.on{opacity:1}
  .zone:not(.on){opacity:.75}
  .zone.on{stroke-width:3.5}

  .readout{
    margin-top:12px;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px;
             background:var(--accent)}
  .statechip.ur{padding:2px 14px 7px}
  .lead{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .lead.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}
  body.urdu .why-note{
    border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;
    line-height:var(--lh);
  }

  .play{
    width:100%;margin-top:12px;border:3px solid var(--ink);border-radius:18px;
    background:var(--ink);color:var(--paper);font:inherit;font-weight:800;
    font-size:var(--fs-md);cursor:pointer;min-height:60px;
  }
  .play:active{transform:scale(.98)}
  .play.alt{background:var(--muscle);border-color:var(--muscle-deep)}

  .two{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .two .play{flex:1;min-width:140px;margin-top:0}

  .card-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .card{flex:1;min-width:120px;border:3px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
  .card em{display:block;font-style:normal;font-size:var(--fs-cap);color:var(--ink-soft);
           font-weight:700;margin-bottom:4px}
  .card b{display:block;font-size:var(--fs-md);font-weight:800;line-height:1.25}
  .card.bone{border-color:var(--bone-deep)}
  .card.muscle{border-color:var(--muscle)}
  .card.joint{border-color:var(--joint)}

  .panel{margin-top:18px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}

  .lesson{
    margin-top:18px;border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
    background:var(--paper);
  }
  .lesson .tag{
    display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
    padding:4px 12px;font-size:var(--fs-cap);font-weight:800;margin-bottom:10px;
  }
  .lesson p{margin:0 0 10px;font-size:var(--fs-sm);line-height:1.55}
  .lesson p:last-child{margin-bottom:0}
  body.urdu .lesson p{line-height:var(--lh)}

  .teeth-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .tooth-btn{
    border:3px solid var(--line);background:var(--paper);border-radius:16px;
    padding:12px 6px;font:inherit;cursor:pointer;min-height:90px;color:var(--ink);
  }
  .tooth-btn .emoji{font-size:28px;display:block;margin-bottom:4px}
  .tooth-btn .lbl{font-size:var(--fs-cap);font-weight:800;display:block}
  .tooth-btn[aria-pressed="true"]{border-color:var(--ink);background:#fff8e8}
  .tooth-btn.ok{border-color:var(--ok);background:#e8f2ed}
  .tooth-btn.no{border-color:var(--no);background:#fbeae8}

  .sort-prompt{
    margin-top:12px;padding:14px 16px;border:2px dashed var(--warm);border-radius:14px;
    background:#fbf1e8;font-size:var(--fs-sm);font-weight:700;color:#8a4a12;line-height:1.55;
  }
  body.urdu .sort-prompt{line-height:var(--lh)}

  .care-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .care{
    border:3px solid var(--care);border-radius:16px;padding:14px 12px;background:#eaf6f1;
    text-align:center;
  }
  .care .emoji{font-size:32px;display:block;margin-bottom:6px}
  .care b{display:block;font-size:var(--fs-sm);font-weight:800;margin-bottom:4px;line-height:1.3}
  .care span{display:block;font-size:var(--fs-cap);color:var(--ink-soft);font-weight:600;line-height:1.4}

  .arm-svg .forearm{transform-origin:118px 95px;transition:transform .45s ease}
  .arm-svg.bent .forearm{transform:rotate(-55deg)}
  .arm-svg .bicep{transform-origin:95px 88px;transition:transform .45s ease, fill .45s}
  .arm-svg.bent .bicep{transform:scaleY(1.35) scaleX(.92);fill:var(--muscle-deep)}
  .leg-svg .shin{transform-origin:160px 120px;transition:transform .45s ease}
  .leg-svg.kick .shin{transform:rotate(-40deg)}
  .leg-svg .quad{transition:fill .45s, transform .45s;transform-origin:155px 95px}
  .leg-svg.kick .quad{fill:var(--muscle-deep);transform:scaleY(1.2) scaleX(.95)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:52px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e6f4ec;font-weight:600}
  .opt.wrong{border-color:var(--no);background:#fbeae4}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.55}
  .fb.show{display:block}
  .score{
    margin-top:8px;padding:14px 16px;border:3px solid var(--ok);border-radius:16px;
    background:#eaf4ee;font-size:var(--fs-md);font-weight:800;text-align:center;
    display:none;
  }
  .score.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  .hidden{display:none !important}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;
      grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar"
        "head  head"
        "tabs  tabs"
        "left  right"
        "quiz  quiz"
        "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar}
    .head{grid-area:head}
    .tabs{grid-area:tabs}
    .left{grid-area:left}
    .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px}
    footer{grid-area:foot}
  }
  @media (prefers-reduced-motion:reduce){
    .arm-svg .forearm,.arm-svg .bicep,.leg-svg .shin,.leg-svg .quad{transition:none}
    *{transition-duration:.01ms !important}
  }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

<body>
<div class="wrap">

  <div class="bar">
    <span class="brand">AI4Kids · Grade 3 · General Science</span>
    <button class="chip" id="langBtn" aria-pressed="false">اردو</button>
    <button class="chip" id="speakBtn" aria-label="Sunein">🔊</button>
  </div>

  <div class="head">
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
  </div>

  <div class="tabs" role="group" id="tabs">
    <button type="button" data-tab="hook" aria-pressed="true">Hook</button>
    <button type="button" data-tab="body" aria-pressed="false">Body</button>
    <button type="button" data-tab="move" aria-pressed="false">Move</button>
    <button type="button" data-tab="teeth" aria-pressed="false">Teeth</button>
    <button type="button" data-tab="care" aria-pressed="false">Care</button>

  <div class="left" id="leftPane"></div>
  <div class="right" id="rightPane"></div>

    <h2 id="quizHead" style="font-size:var(--fs-lg);font-weight:800;margin:0 0 16px"></h2>

    <div class="score" id="scoreBox"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
(function(){
  var lang="ru";

  var lastSpoken = "";

  var T = {
    brand: {en:"AI4Kids · Grade 3 · General Science", ur:"AI4Kids · جماعت ۳ · جنرل سائنس"},

  var HOOK = {
    tag:{en:"HOOK", ur:"ہُک"},
    p1:{
      en:"Have you ever thought — when you play cricket in Islamabad, what parts of your body are working? Your haddiyaan (bones) and muscles help you run, bat, and catch!",
      ur:"کیا آپ نے کبھی سوچا — جب آپ اسلام آباد میں کرکٹ کھیلتے ہیں، تو آپ کی باڈی کے کون سے حصے کام کر رہے ہوتے ہیں؟ آپ کی ہڈیاں اور مسکلز ہی آپ کو دوڑنے، بیٹ مارنے اور کیچ پکڑنے میں مدد دیتی ہیں!"
    },
    p2:{
      en:"Imagine: if you had no bones and no muscles, how would you feel? You could not stand, walk, or even smile!",
      ur:"سوچیے: اگر آپ کی ہڈیاں اور مسکلز نہ ہوتیں، تو آپ کیسا محسوس کرتے؟ آپ کھڑے، چل، یا مسکرا بھی نہیں سکتے!"
    }
  };
  var SAMJHAO = {
    tag:{en:"SAMJHAO", ur:"سمجھاؤ"},
    p1:{
      en:"Bones make your skeleton. They are the strongest support in your body. A grown-up has about 206 bones. Bones meet at joints — like your knees and elbows — so you can bend.",
      ur:"ہڈیاں آپ کا کنکال بناتی ہیں۔ یہ باڈی کا سب سے مضبوط سہارا ہیں۔ بڑے انسان میں تقریباً ۲۰۶ ہڈیاں ہوتی ہیں۔ ہڈیاں جوڑوں (joints) پر ملتی ہیں — جیسے گھٹنے اور کہنی — تاکہ آپ مڑ سکیں۔"
    },
    p2:{
      en:"Muscles pull on bones when they contract (get shorter and fatter). You have more than 600 muscles. That is how you lift your arm or kick a ball.",
      ur:"مسکلز جب سکڑتی ہیں (مختصر اور موٹی ہوتی ہیں) تو ہڈیوں کو کھینچتی ہیں۔ آپ کے پاس ۶۰۰ سے زیادہ مسکلز ہیں۔ اسی لیے آپ بازو اٹھا سکتے یا گیند کو لات مار سکتے ہیں۔"
    },
    p3:{
      en:"Teeth help you eat. Different teeth do different jobs — cut, tear, or chew. Without teeth, food would be hard to eat!",
      ur:"دانت کھانے میں مدد دیتے ہیں۔ مختلف دانت مختلف کام کرتے ہیں — کاٹنا، پھاڑنا، یا چبانا۔ دانتوں کے بغیر کھانا مشکل ہو جاتا!"
    }
  };
  var MISAAL = {
    tag:{en:"MISAAL", ur:"مثال"},
    p1:{
      en:"Think of the bazaar: when you lift a bag of biryani or point at a shop, your muscles and bones work together. Walking to school, climbing stairs, brushing teeth — all need bones, joints, and muscles.",
      ur:"بازار سوچیے: جب آپ بریانی کا تھیلا اٹھاتے ہیں یا دکان کی طرف اشارہ کرتے ہیں، تو مسکلز اور ہڈیاں مل کر کام کرتی ہیں۔ اسکول جانا، سیڑھیاں چڑھنا، دانت صاف کرنا — سب میں ہڈیاں، جوڑ اور مسکلز چاہیے ہوتے ہیں۔"

  var KARO = {

    p1:{

    }
  };

  var ZONES = {

      chipBg:"var(--bone-deep)",
      name:{en:"Haddiyaan — your strong frame", ur:"ہڈیاں — آپ کا مضبوط فریم"},

      },
      tip:{
        en:"Kid label: skull (sir), ribs (pasliyan), spine (reedh), arm & leg bones.",
        ur:"بچوں کے لیبل: کھوپڑی (سر)، پسلیاں، ریڑھ، بازو اور ٹانگ کی ہڈیاں۔"
      }
    },
    muscles:{
      chip:{en:"Muscles", ur:"مسکلز"},
      chipBg:"var(--muscle)",
      name:{en:"Muscles — the movers", ur:"مسکلز — چلانے والے"},
      desc:{

      '</div>';
    R.innerHTML =
      '<div class="readout">' +
        '<span class="statechip" id="mChip"></span>' +
        '<p class="lead" id="mLead"></p>' +
        '<p class="detail" id="mDetail"></p>' +
        '<p class="why-note"><b id="mGhaur"></b> <span id="mTip"></span></p>' +
      '</div>';

    setText($("moveHead"), t(MOVE.head));
    setText($("bendBtn"), armBent ? t(MOVE.straighten) : t(MOVE.bend));
    setText($("kickBtn"), legKick ? t(MOVE.reset) : t(MOVE.kick));

    if (legKick){
      setText($("mChip"), t(MOVE.kick));
      $("mChip").style.background = "var(--muscle)";
      setText($("mLead"), t(MOVE.kickLead));
      setText($("mDetail"), t(MOVE.kickDetail));
      lastSpoken = t(MOVE.kickLead) + ". " + t(MOVE.kickDetail);
    } else {
      setText($("mChip"), t(MOVE.bend));
      $("mChip").style.background = "var(--joint)";
      setText($("mLead"), t(MOVE.armLead));
      setText($("mDetail"), t(MOVE.armDetail));
      lastSpoken = t(MOVE.armLead) + ". " + t(MOVE.armDetail);
    }
    $("mGhaur").textContent = t(T.ghaur);
    setText($("mTip"), t(MOVE.tip));

    $("bendBtn").addEventListener("click", function(){
      armBent = !armBent;
      renderMove();
    });
    $("kickBtn").addEventListener("click", function(){
      legKick = !legKick;
      renderMove();
    });
  }

  function renderTeeth(){
    var L = $("leftPane"), R = $("rightPane");
    var job = TEETH.jobs[toothJobIndex];
    var types = ["incisors","canines","molars"];
    var emoji = {incisors:"🦷", canines:"🧛", molars:"🫓"};

    L.innerHTML =
      '<div class="panel"><h2 id="teethHead"></h2></div>' +
      '<div class="sort-prompt"><span id="promptAsk"></span><br><span id="promptJob"></span></div>' +
      '<div class="teeth-grid" id="teethGrid"></div>' +
      '<button type="button" class="play" id="nextJob" style="margin-top:12px"></button>';
    R.innerHTML =
      '<div class="readout">' +
        '<span class="statechip" id="tChip" style="background:var(--warm)"></span>' +
        '<p class="lead" id="tLead"></p>' +
        '<p class="detail" id="tDetail"></p>' +
      '</div>' +
      '<div class="card-row" style="margin-top:12px">' +
        '<div class="card"><em id="tiE"></em><b id="tiB"></b></div>' +
        '<div class="card"><em id="tcE"></em><b id="tcB"></b></div>' +
        '<div class="card"><em id="tmE"></em><b id="tmB"></b></div>' +
      '</div>';

    setText($("teethHead"), t(TEETH.head));
    setText($("promptAsk"), t(TEETH.promptAsk));
    setText($("promptJob"), t(job.ask));

    var grid = $("teethGrid");
    types.forEach(function(id){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tooth-btn";
      b.setAttribute("data-id", id);
      if (toothPick === id){
        b.setAttribute("aria-pressed","true");
        b.classList.add(id === job.ans ? "ok" : "no");
      } else {
        b.setAttribute("aria-pressed","false");
      }
      b.innerHTML = '<span class="emoji">'+emoji[id]+'</span><span class="lbl"></span>';
      setText(b.querySelector(".lbl"), t(TEETH.types[id]));
      b.addEventListener("click", function(){
        toothPick = id;
        if (id === job.ans) toothFeedback = "ok";
        else toothFeedback = "no";
        renderTeeth();
      });
      grid.appendChild(b);
    });

    setText($("tiE"), t(TEETH.types.incisors));
    setText($("tiB"), t(TEETH.types.incisors.job));
    setText($("tcE"), t(TEETH.types.canines));
    setText($("tcB"), t(TEETH.types.canines.job));
    setText($("tmE"), t(TEETH.types.molars));
    setText($("tmB"), t(TEETH.types.molars.job));

    if (toothFeedback === "ok"){
      setText($("tChip"), lang==="en"?"Correct!":"درست!");
      $("tChip").style.background = "var(--ok)";
      setText($("tLead"), t(job.ok));
      setText($("tDetail"), "");
      lastSpoken = t(job.ok);
    } else if (toothFeedback === "no"){
      setText($("tChip"), lang==="en"?"Try again":"پھر کوشش");
      $("tChip").style.background = "var(--no)";
      setText($("tLead"), t(job.no));
      setText($("tDetail"), "");
      lastSpoken = t(job.no);
    } else {
      setText($("tChip"), t(TEETH.promptAsk));
      $("tChip").style.background = "var(--warm)";
      setText($("tLead"), t(job.ask));
      setText($("tDetail"), lang==="en"
        ? "Incisors cut · Canines tear · Molars chew"
        : "انسیزر کاٹتے · کینائنز پھاڑتے · مولرز چباتے");
      lastSpoken = t(job.ask);
    }

    var nextBtn = $("nextJob");
    if (toothJobIndex >= TEETH.jobs.length - 1 && toothFeedback === "ok"){
      setText(nextBtn, t(TEETH.done));
      nextBtn.disabled = true;
    } else {
      setText(nextBtn, t(TEETH.next));
      nextBtn.disabled = toothFeedback !== "ok";
      nextBtn.addEventListener("click", function(){
        if (toothFeedback !== "ok") return;
        toothJobIndex = (toothJobIndex + 1) % TEETH.jobs.length;
        toothPick = null;
        toothFeedback = "";
        renderTeeth();
      });
    }
  }

  function renderCare(){
    var L = $("leftPane"), R = $("rightPane");
    L.innerHTML =
      '<div class="panel"><h2 id="careHead"></h2></div>' +
      '<div class="care-grid" id="careGrid"></div>';
    R.innerHTML =
      '<div class="readout">' +
        '<span class="statechip" id="careChip" style="background:var(--care)"></span>' +
        '<p class="lead" id="careLead"></p>' +
        '<p class="why-note"><b id="careGhaur"></b> <span id="careTip"></span></p>' +
      '</div>' +
      '<div class="lesson" style="margin-top:12px"><span class="tag" id="careKarTag"></span><p id="careKar"></p></div>';

    setText($("careHead"), t(CARE.head));
    var grid = $("careGrid");
    CARE.items.forEach(function(item){
      var d = document.createElement("div");
      d.className = "care";
      d.innerHTML = '<span class="emoji">'+item.emoji+'</span><b></b><span></span>';
      setText(d.querySelector("b"), t(item.title));
      setText(d.querySelector("span"), t(item.desc));
      grid.appendChild(d);
    });
    setText($("careChip"), lang==="en"?"Stay strong":"مضبوط رہو");
    setText($("careLead"), t(CARE.tip));
    $("careGhaur").textContent = t(T.ghaur);
    setText($("careTip"), lang==="en"
      ? "Milk + exercise for bones; brush for teeth — every day!"
      : "ہڈیوں کے لیے دودھ + ورزش؛ دانتوں کے لیے برش — ہر روز!");
    setText($("careKarTag"), t(KARO.tag));
    setText($("careKar"), t(KARO.p1));
    lastSpoken = t(CARE.tip);
  }

  function renderTab(){
    if (tab === "hook") renderHook();
    else if (tab === "body") renderBody();
    else if (tab === "move") renderMove();
    else if (tab === "teeth") renderTeeth();
    else renderCare();
  }

  function buildQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizScore = 0;
    quizAnswered = 0;
    $("scoreBox").classList.remove("show");

    QUIZ.forEach(function(item, qi){
      var wrap = document.createElement("div");
      wrap.className = "q";
      var q = document.createElement("p");
      setText(q, (qi+1) + ". " + t(item.q));
      wrap.appendChild(q);
      var fb = document.createElement("p");
      fb.className = "fb";
      item.o.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang === "ur" ? " ur" : "");
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.textContent = (lang === "ur") ? isolate(t(opt)) : t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done") === "1") return;
          wrap.setAttribute("data-done","1");
          quizAnswered++;
          var correct = (oi === item.a);
          if (correct) quizScore++;
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi && !correct) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show");
          if (quizAnswered === QUIZ.length){
            var sb = $("scoreBox");
            setText(sb, t(T.scoreLbl) + ": " + quizScore + " " + t(T.of) + " " + QUIZ.length);
            sb.classList.add("show");
          }
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb);
      box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    document.documentElement.lang = (lang === "ur") ? "ur" : "en";
    document.documentElement.dir = (lang === "ur") ? "rtl" : "ltr";

    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");

    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    setText($("quizHead"), t(T.quiz));
    setText($("foot"), t(T.foot));

    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
      var key = b.getAttribute("data-tab");
      setText(b, t(T.tabs[key]));
      b.setAttribute("aria-pressed", key === tab ? "true" : "false");
    });

    buildQuiz();
    renderTab();
  }

  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
    b.addEventListener("click", function(){
      tab = b.getAttribute("data-tab");
      Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(x){
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      renderTab();
    });
  });

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });

  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(lastSpoken);
      var __v=window.ai4kidsPickVoice&&ai4kidsPickVoice();if(__v){u.voice=__v;u.lang=((__v.lang||'').toLowerCase().indexOf('ur')===0)?'ur-PK':'hi-IN';}else{u.lang='hi-IN';}u.rate=.82
      window.speechSynthesis.speak(u);
    }catch(e){}
  });

  applyLang();
})();
</script>
<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
