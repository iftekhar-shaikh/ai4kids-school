function shapeDemo(s){var shapes=[['rectangle','▭','Rectangle','4 sides; opposite sides can be long and short.','4 sides hoti hain; saamne wali sides lambi ya chhoti ho sakti hain.'],['square','□','Square','4 equal sides.','4 barabar sides hoti hain.'],['circle','●','Circle','Round; no corners.','Gol; koi kona nahi.'],['triangle','△','Triangle','3 sides and 3 corners.','3 sides aur 3 konay.']];var i=demoState.shape==null?0:demoState.shape,x=shapes[i];s.innerHTML='<div class="shape-grid">'+shapes.map(function(a,j){return '<button class="shape '+(j===i?'selected':'')+'" data-shape="'+j+'"><span class="shape-icon">'+a[1]+'</span>'+a[2]+'</button>'}).join('')+'</div><div class="shape-info">'+esc(lang==='en'?x[3]:x[4])+'</div><button class="play wide" id="shapePlay">🔷 '+esc(t({en:'Name the shape',ru:'Shape ka naam batao'}))+'</button>';s.querySelectorAll('[data-shape]').forEach(function(b){b.onclick=function(){demoState.shape=Number(b.dataset.shape);renderDemo()}});$('shapePlay').onclick=function(){showMsg(msg('This is a '+x[2]+'. Look for it at home!','Yeh '+x[2]+' hai. Ghar mein is shape ko dhoondo!'))}}
function renderQuiz(){var box=$('quizBox');box.innerHTML='';$('score').classList.remove('show');var done=0,score=0;DATA.quiz.forEach(function(q,i){var w=document.createElement('div');w.className='q';var p=document.createElement('p');p.className='q-title';p.textContent=(i+1)+'. '+t(q.q);w.appendChild(p);var fb=document.createElement('p');fb.className='feedback';q.options.forEach(function(o,j){var b=document.createElement('button');b.className='opt';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+t(o);b.onclick=function(){if(w.dataset.done)return;w.dataset.done='1';done++;var ok=j===q.correct;if(ok)score++;b.classList.add(ok?'right':'wrong');if(!ok)w.querySelectorAll('.opt')[q.correct].classList.add('right');fb.textContent=(ok?'✓ ':'✗ ')+t(q.explanation);fb.classList.add('show');w.querySelectorAll('button').forEach(function(x){x.disabled=true});if(done===DATA.quiz.length){$('score').textContent=t({en:'Score: '+score+' / 5 — '+(score===5?'Excellent!':'Good practice!'),ru:'Score: '+score+' / 5 — '+(score===5?'Shabash!':'Achi practice!')});$('score').classList.add('show')}};w.appendChild(b)});w.appendChild(fb);box.appendChild(w)})}
$('langBtn').onclick=function(){lang=lang==='en'?'ru':'en';demoState={};render()};$('speakBtn').onclick=function(){if('speechSynthesis' in window){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t(DATA.title)+' '+t(DATA.sub));u.lang=lang==='en'?'en-US':'en-PK';u.rate=.9;speechSynthesis.speak(u)}};$('launch').onclick=function(){$('demoStage').scrollIntoView({behavior:'smooth'});renderDemo()};render()})();</script>
