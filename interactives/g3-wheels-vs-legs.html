  var box=$("lessonBox"); if(!box) return; box.innerHTML="";
  var cards=[{cls:"hook", tag:{en:"HOOK",ur:"ہک"}, body:LESSON.hook},
   {cls:"samjhao", tag:{en:"SAMJHAO",ur:"سمجھاؤ"}, body:LESSON.samjhao},

}
var quizScore=0, quizDone=0;
function buildQuiz(){

      var b=document.createElement("button"); b.type="button"; b.className="opt";

    svg.appendChild(mk("circle",{cx:x+18,cy:180,r:14,fill:"#1f2933"}));
    svg.appendChild(mk("circle",{cx:x+52,cy:180,r:14,fill:"#1f2933"}));
    svg.appendChild(mk("circle",{cx:x+18,cy:180,r:5,fill:"#94a3b8"}));
    svg.appendChild(mk("circle",{cx:x+52,cy:180,r:5,fill:"#94a3b8"}));

  } else {
    var bob = Math.sin(anim/10)*6;
    svg.appendChild(mk("rect",{x:x+15,y:110+bob,width:40,height:50,rx:8,fill:"#a78bfa",stroke:"#5b21b6","stroke-width":2}));
    svg.appendChild(mk("circle",{cx:x+35,cy:100+bob,r:16,fill:"#c4b5fd",stroke:"#5b21b6","stroke-width":2}));
    svg.appendChild(mk("circle",{cx:x+28,cy:98+bob,r:3,fill:"#1f2933"}));
    svg.appendChild(mk("circle",{cx:x+42,cy:98+bob,r:3,fill:"#1f2933"}));
    // legs
    var swing=Math.sin(anim/8)*12;
    svg.appendChild(mk("line",{x1:x+22,y1:160+bob,x2:x+10+swing,y2:185,stroke:"#5b21b6","stroke-width":5,"stroke-linecap":"round"}));
    svg.appendChild(mk("line",{x1:x+48,y1:160+bob,x2:x+60-swing,y2:185,stroke:"#5b21b6","stroke-width":5,"stroke-linecap":"round"}));
  }
  var lab=mk("text",{x:160,y:30,"text-anchor":"middle","font-size":"14","font-weight":"800",fill:"#1f2933"});
  lab.textContent = (mode==="wheels"?"🛞 ":"🦿 ")+(rocky?"ROCKY":"FLAT");
  svg.appendChild(lab);
}
function onTab(){ stopAnim(); }
function render(){
  buildTabs([["compare",{en:"Wheels vs legs",ur:"پہیے بمقابلہ ٹانگیں"}],["terrain",{en:"Terrain test",ur:"زمین آزمائش"}],["choose",{en:"Which to pick?",ur:"کون سا چنیں؟"}]]);
  if(!tab||tab==="main") tab="compare";
  setText($("whyLbl"), t({en:"Notice:",ur:"غور کریں:"}));
  $("chips").innerHTML=""; $("controls").innerHTML=""; $("two").innerHTML="";
  var play=$("playBtn"), play2=$("playBtn2");
  play.className="play"; play2.className="play alt hidden";

  if(tab==="compare"){
    setText($("title"), t({en:"Two ways to move",ur:"چلنے کے دو طریقے"}));
    setText($("subtitle"), t({en:"Tap wheels or legs — watch how the robot moves.",ur:"پہیے یا ٹانگیں دباؤ — روبوٹ کیسے چلتا ہے دیکھو۔"}));
    setText($("panelHead"), t({en:"Choose mover",ur:"چلنے والا چنو"}));
    play.classList.add("hidden");
    [["wheels",{en:"Wheels",ur:"پہیے"}],["legs",{en:"Legs",ur:"ٹانگیں"}]].forEach(function(x){
      var b=document.createElement("button"); b.type="button"; b.className="schip";
      b.setAttribute("aria-pressed", mode===x[0]?"true":"false");
      setText(b,t(x[1]));
      b.onclick=function(){ mode=x[0]; rocky=false; render(); };
      $("chips").appendChild(b);
    });
    setText(play, t({en:"Move!",ur:"چلو!"}));
    play.classList.remove("hidden"); play.classList.add("go");
    play.onclick=function(){
      stopAnim(); anim=0;
      animT=setInterval(function(){ anim+=4; if(anim>220) anim=0; drawCompare(); },40);
    };
    drawCompare();
    setText($("statechip"), mode==="wheels"?t({en:"Wheeled",ur:"پہیہ والا"}):t({en:"Legged",ur:"ٹانگ والا"}));
    setText($("lead"), mode==="wheels"?t({en:"Fast on flat roads",ur:"ہموار سڑک پر تیز"}):t({en:"Steady on uneven ground",ur:"اونچی نیچی زمین پر مستحکم"}));
    setText($("detail"), mode==="wheels"?t({en:"Rolls smoothly — great for halls and streets.",ur:"آسانی سے گہومتا — ہال اور سڑک کے لیے بہترین۔"}):t({en:"Steps over bumps — great for outdoors.",ur:"اونچائی پار کرتا — باہر کے لیے بہترین۔"}));
    setText($("trade"), t({en:"Some research robots use BOTH wheels and legs!",ur:"کچھ ریسرچ روبوٹ پہیے اور ٹانگیں دونوں استعمال کرتے ہیں!"}));
    setText($("whyText"), t({en:"Right mover = right job.",ur:"صحیح چلنے والا = صحیح کام۔"}));
    return;
  }
  if(tab==="terrain"){
    setText($("title"), t({en:"Flat vs rocky test",ur:"ہموار بمقابلہ پتھریلی"}));
    setText($("subtitle"), t({en:"Change the ground. See which robot struggles.",ur:"زمین بدلو۔ کون سا روبوٹ مشکل میں پڑتا ہے دیکھو۔"}));
    setText($("panelHead"), t({en:"Ground",ur:"زمین"}));
    play.classList.add("hidden");
    [["flat",{en:"Flat floor",ur:"ہموار فرش"}],["rocky",{en:"Rocky path",ur:"پتھریلا راستہ"}]].forEach(function(x){
      var b=document.createElement("button"); b.type="button"; b.className="schip";
      var isR=x[0]==="rocky";
      b.setAttribute("aria-pressed", rocky===isR?"true":"false");
      setText(b,t(x[1]));
      b.onclick=function(){ rocky=isR; render(); };
      $("chips").appendChild(b);
    });
    [["wheels",{en:"Try wheels",ur:"پہیے آزماؤ"}],["legs",{en:"Try legs",ur:"ٹانگیں آزماؤ"}]].forEach(function(x){
      var b=document.createElement("button"); b.type="button"; b.className="schip";
      b.setAttribute("aria-pressed", mode===x[0]?"true":"false");
      setText(b,t(x[1]));
      b.onclick=function(){
        mode=x[0]; anim=0; stopAnim();
        animT=setInterval(function(){ anim+= rocky && mode==="wheels" ? 1.5 : 4; if(anim>220) anim=0; drawCompare(); },40);
        render();
      };
      $("chips").appendChild(b);
    });
    drawCompare();
    var hard = rocky && mode==="wheels";
    $("statechip").className="statechip "+(hard?"no":"ok");
    setText($("statechip"), hard?t({en:"Struggling",ur:"مشکل"}):t({en:"Doing well",ur:"اچھا چل رہا"}));
    setText($("lead"), hard?t({en:"Wheels slip on rocks!",ur:"پتھروں پر پہیے پھسلتے ہیں!"}):t({en:"Good match for this ground",ur:"اس زمین کے لیے اچھا میچ"}));
    setText($("detail"), t({en:"Legs climb bumps. Wheels love smooth floors.",ur:"ٹانگیں اونچائی چڑھتی ہیں۔ پہیے ہموار فرش پسند کرتے ہیں۔"}));
    setText($("trade"),""); setText($("whyText"), t({en:"Engineers pick wheels or legs based on the place.",ur:"انجینئر جگہ دیکھ کر پہیے یا ٹانگیں چنتے ہیں۔"}));
    return;
  }
  stopAnim(); rocky=false; drawCompare();
  setText($("title"), t({en:"Pick for the job",ur:"کام کے لیے چنو"}));
  setText($("subtitle"), t({en:"Which robot for which place?",ur:"کس جگہ کون سا روبوٹ؟"}));
  setText($("panelHead"), t({en:"Jobs",ur:"کام"}));
  play.classList.add("hidden");
  [
    {id:"hall",en:"School hall",ur:"سکول ہال",pick:"wheels"},
    {id:"field",en:"Rocky field",ur:"پتھریلا میدان",pick:"legs"},
    {id:"factory",en:"Factory floor",ur:"فیکٹری فرش",pick:"wheels"}
  ].forEach(function(x){
    var b=document.createElement("button"); b.type="button"; b.className="schip";
    setText(b,t({en:x.en,ur:x.ur}));
    b.onclick=function(){
      mode=x.pick; drawCompare();
      setText($("statechip"), x.pick==="wheels"?t({en:"Wheels win",ur:"پہیے جیت"}):t({en:"Legs win",ur:"ٹانگیں جیت"}));
      setText($("lead"), t({en:x.en+" → "+(x.pick==="wheels"?"wheels":"legs"), ur:x.ur+" → "+(x.pick==="wheels"?"پہیے":"ٹانگیں")}));
      $("statechip").className="statechip ok";
    };
    $("chips").appendChild(b);
  });
  setText($("statechip"), t({en:"Your turn",ur:"تمہاری باری"}));
  setText($("lead"), t({en:"Tap a place to choose",ur:"جگہ دبا کر چنو"}));
  setText($("detail"), t({en:"Matching the mover to the place is smart engineering!",ur:"چلنے والے کو جگہ سے ملانا ہوشیار انجینئرنگ!"}));
  setText($("trade"), t({en:"Pakistan factories often use wheeled robots on smooth floors.",ur:"پاکستان کی فیکٹریوں میں ہموار فرش پر اکثر پہیہ والے روبوٹ۔"}));
  setText($("whyText"), t({en:"No single best robot — only the best fit!",ur:"کوئی ایک بہترین روبوٹ نہیں — صرف بہترین میچ!"}));
}


applyLang();
})();

<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
