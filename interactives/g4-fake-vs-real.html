  @media (min-width:820px){

          b.classList.add("wrong");
          setText($("headline"), t(T.oops));
          $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.oops));
        }
      });
      choices.appendChild(b);
    });
    box.appendChild(choices);
    setText($("prog"), t(T.progSpot) + ": " + Object.keys(spotDone).length + "/" + SPOT.length);
  }

  /* ---------- FLAGS ---------- */
  function renderFlags(){
    var ch = FLAGS[flagsIdx];
    var whyKeys = Object.keys(ch.whys);
    var pad = $("scenePad");
    pad.innerHTML = skyHTML() +
      '<div class="hero-stage">' +
      '<div class="hero-em">🚩🔍</div>' +
      '<div class="flag-pills" id="flagPills"></div></div>';
    var pills = $("flagPills");
    whyKeys.forEach(function(wk){
      var sp = document.createElement("span");
      sp.className = "flag-pill";
      setText(sp, t(ch.whys[wk]));
      pills.appendChild(sp);
    });

    setText($("statechip"), (flagsIdx+1) + " / " + FLAGS.length);
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"");
    setText($("headline"), t(ch.title));
    setText($("detail"), t(T.askFlags));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    var grid = document.createElement("div");
    grid.className = "match-grid";
    ch.rows.forEach(function(row){
      var div = document.createElement("div");
      div.className = "match-row";
      div.innerHTML = '<span class="mem">'+row.em+'</span><span class="mtxt"></span><span class="match-opts"></span>';
      setText(div.querySelector(".mtxt"), t(row.clue));
      var opts = div.querySelector(".match-opts");
      whyKeys.forEach(function(wk, wi){
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = String(wi + 1);
        b.title = t(ch.whys[wk]);
        if (flagsDone[ch.id] && flagsMap[row.id] === wk){
          if (wk === row.why) b.classList.add("right");
        } else if (flagsMap[row.id] === wk){
          b.style.boxShadow = "0 0 0 2px var(--accent)";
          b.style.borderColor = "var(--accent)";
        }
        b.disabled = !!flagsDone[ch.id];
        b.addEventListener("click", function(){
          if (flagsDone[ch.id]) return;
          flagsMap[row.id] = wk;
          renderFlags();
        });
        opts.appendChild(b);
      });
      grid.appendChild(div);
    });
    box.appendChild(grid);

    /* legend */
    var leg = document.createElement("div");
    leg.style.cssText = "margin-top:8px;font-size:var(--fs-cap);color:var(--ink-soft);font-weight:700";
    var legBits = whyKeys.map(function(wk, wi){ return (wi+1) + " = " + t(ch.whys[wk]); });
    setText(leg, legBits.join(" · "));
    box.appendChild(leg);

    if (!flagsDone[ch.id]){
      var chk = document.createElement("button");
      chk.type = "button";
      chk.style.cssText = "margin-top:10px;width:100%;border:2px solid var(--ink);border-radius:14px;background:var(--ink);color:var(--paper);font:inherit;font-weight:800;min-height:48px;cursor:pointer";
      setText(chk, t(T.checkMatch));
      chk.addEventListener("click", function(){
        var ok = true;
        ch.rows.forEach(function(r){
          if (flagsMap[r.id] !== r.why) ok = false;
        });
        if (ok && Object.keys(flagsMap).length === ch.rows.length){
          flagsDone[ch.id] = true;
          award("flags-"+ch.id, 1);
          setText($("headline"), t(ch.done));
          $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.nice));
          if (Object.keys(flagsDone).length >= FLAGS.length){
            doneModes.flags = true;
            award("mode-flags", 2);
          }
          tabBadges();
          renderFlags();
        } else {
          setText($("headline"), t(T.oops));
          $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.oops));
        }
      });
      box.appendChild(chk);
    }

    setText($("prog"), t(T.progFlags) + ": " + Object.keys(flagsDone).length + "/" + FLAGS.length);
  }

  /* ---------- SHARE ---------- */
  function renderShare(){
    var ch = SHARE[shareIdx];
    var pad = $("scenePad");
    pad.innerHTML = skyHTML() +
      '<div class="hero-stage">' +
      '<div class="hero-em">📲🤝</div>' +
      '<div class="share-bins">' +
      '<div class="share-bin do"><div class="bin-title" id="binDo"></div><div class="drop" id="dropDo"></div></div>' +
      '<div class="share-bin dont"><div class="bin-title" id="binDont"></div><div class="drop" id="dropDont"></div></div>' +
      '</div></div>';
    setText($("binDo"), t(T.binDo));
    setText($("binDont"), t(T.binDont));

    function refreshDrops(){
      var dDo = "", dDont = "";
      ch.items.forEach(function(it){
        if (shareMap[it.id] === "do") dDo += it.em + " ";
        if (shareMap[it.id] === "dont") dDont += it.em + " ";
      });
      $("dropDo").textContent = dDo || "—";
      $("dropDont").textContent = dDont || "—";
    }
    refreshDrops();

    setText($("statechip"), (shareIdx+1) + " / " + SHARE.length);
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"");
    setText($("headline"), t(ch.title));
    setText($("detail"), t(T.askShare));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    var list = document.createElement("div");
    list.className = "share-list";
    ch.items.forEach(function(it){
      var used = !!shareMap[it.id];
      var b = document.createElement("button");
      b.type = "button";
      b.className = "share-item";
      if (shareSelected === it.id) b.classList.add("selected");
      if (shareDone[ch.id]){
        b.classList.add(it.kind === "do" ? "picked-do" : "picked-dont");
        b.disabled = true;
      } else if (used){
        b.classList.add(shareMap[it.id] === "do" ? "picked-do" : "picked-dont");
      }
      b.innerHTML = '<span class="sem">'+it.em+'</span><span class="stxt"></span>';
      setText(b.querySelector(".stxt"), t(it));
      b.disabled = !!shareDone[ch.id];
      b.addEventListener("click", function(){
        if (shareDone[ch.id]) return;
        shareSelected = it.id;
        renderShare();
      });
      list.appendChild(b);
    });
    box.appendChild(list);

    var bins = document.createElement("div");
    bins.className = "save-choices";
    ["do","dont"].forEach(function(k){
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="cem">'+(k==="do"?"✅":"🚫")+'</span><span class="clab"></span>';
      setText(b.querySelector(".clab"), t(k==="do" ? T.binDo : T.binDont));
      b.disabled = !!shareDone[ch.id] || !shareSelected;
      b.addEventListener("click", function(){
        if (shareDone[ch.id] || !shareSelected) return;
        shareMap[shareSelected] = k;
        shareSelected = null;
        renderShare();
      });
      bins.appendChild(b);
    });
    box.appendChild(bins);

    if (!shareDone[ch.id]){
      var chk = document.createElement("button");
      chk.type = "button";
      chk.style.cssText = "margin-top:10px;width:100%;border:2px solid var(--ink);border-radius:14px;background:var(--ink);color:var(--paper);font:inherit;font-weight:800;min-height:48px;cursor:pointer";
      setText(chk, t(T.checkShare));
      chk.addEventListener("click", function(){
        var ok = true;
        ch.items.forEach(function(it){
          if (shareMap[it.id] !== it.kind) ok = false;
        });
        if (ok && Object.keys(shareMap).length === ch.items.length){
          shareDone[ch.id] = true;
          award("share-"+ch.id, 1);
          setText($("headline"), t(ch.done));
          $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.nice));
          if (Object.keys(shareDone).length >= SHARE.length){
            doneModes.share = true;
            award("mode-share", 2);
          }
          tabBadges();
          renderShare();
        } else {
          setText($("headline"), t(T.oops));
          $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.oops));
        }
      });
      box.appendChild(chk);
    }

    setText($("prog"), t(T.progShare) + ": " + Object.keys(shareDone).length + "/" + SHARE.length);
  }

  /* ---------- QUIZ ---------- */
  function pickQuiz(){ quizSet = shuffle(QUIZ).slice(0, 5); }
  function renderQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizSet.forEach(function(item, qi){
      var wrap = document.createElement("div");
      wrap.className = "q";
      var p = document.createElement("p");
      setText(p, (qi+1) + ". " + t(item.q));
      wrap.appendChild(p);
      var answered = false;
      item.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang==="ur"?" ur":"");
        setText(b, t(opt));
        b.addEventListener("click", function(){
          if (answered) return;
          answered = true;
          if (oi === item.correct){
            b.classList.add("right");
            award("quiz-"+qi, 1);
          } else {
            b.classList.add("wrong");
            var kids = wrap.querySelectorAll(".opt");
            if (kids[item.correct]) kids[item.correct].classList.add("right");
          }
          fb.classList.add("show");
        });
        wrap.appendChild(b);
      });
      var fb = document.createElement("p");
      fb.className = "fb";
      setText(fb, t(item.why));
      wrap.appendChild(fb);
      box.appendChild(wrap);
    });
  }

  function storyHtml(){
    if (mode === "spot") return t(T.storySpot);
    if (mode === "flags") return t(T.storyFlags);
    return t(T.storyShare);
  }

  function tabBadges(){
    function lab(btn, label, key){
      btn.innerHTML = "";
      var span = document.createElement("span");
      setText(span, t(label));
      btn.appendChild(span);
      if (doneModes[key]){
        var b = document.createElement("span");
        b.className = "badge"; b.textContent = " ★";
        btn.appendChild(b);
      }
    }
    lab($("tabSpot"), T.tabSpot, "spot");
    lab($("tabFlags"), T.tabFlags, "flags");
    lab($("tabShare"), T.tabShare, "share");
    $("tabSpot").setAttribute("aria-pressed", mode==="spot"?"true":"false");
    $("tabFlags").setAttribute("aria-pressed", mode==="flags"?"true":"false");
    $("tabShare").setAttribute("aria-pressed", mode==="share"?"true":"false");
  }

  function setMode(m){
    mode = m;
    if (mode === "spot") renderSpot();
    else if (mode === "flags") renderFlags();
    else { shareSelected = null; renderShare(); }
    applyChrome();
  }

  function applyChrome(){
    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    $("story").innerHTML = storyHtml();
    $("story").classList.toggle("ur", lang==="ur");
    $("story").setAttribute("dir", lang==="ur"?"rtl":"ltr");
    setText($("ctlHead"), t(T.ctl));
    setText($("nextBtn"), t(T.next));
    setText($("hintBtn"), t(T.hint));
    setText($("resetBtn"), t(T.reset));
    setText($("quizHead"), t(T.quiz));
    setText($("newQuiz"), t(T.newQuiz));
    $("langBtn").textContent = (lang === "en") ? "اردو" : "EN";
    $("langBtn").setAttribute("aria-pressed", lang==="ur"?"true":"false");
    document.body.classList.toggle("urdu", lang==="ur");
    document.documentElement.lang = (lang==="ur") ? "ur" : "en";
    document.documentElement.dir = (lang==="ur") ? "rtl" : "ltr";
    tabBadges();
    var foot = document.querySelector("footer p");
    if (foot) setText(foot, foot.getAttribute(lang==="ur"?"data-ur":"data-en"));
  }

  function applyLang(){
    applyChrome();
    if (mode === "spot") renderSpot();
    else if (mode === "flags") renderFlags();
    else renderShare();
    renderQuiz();
  }

  function next(){
    if (mode === "spot"){
      spotIdx = (spotIdx + 1) % SPOT.length;
      renderSpot();
    } else if (mode === "flags"){
      flagsIdx = (flagsIdx + 1) % FLAGS.length;
      flagsMap = {};
      renderFlags();
    } else {
      shareIdx = (shareIdx + 1) % SHARE.length;
      shareMap = {}; shareSelected = null;
      renderShare();
    }
  }

  function showHint(){
    var h;
    if (mode === "spot") h = SPOT[spotIdx].hint;
    else if (mode === "flags") h = FLAGS[flagsIdx].hint;
    else h = SHARE[shareIdx].hint;
    var hb = $("hintbox");
    setText(hb, t(h));
    hb.classList.add("show");
  }

  function resetMode(){
    if (mode === "spot"){
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("spot-")===0 || k==="mode-spot") delete awarded[k]; });
      spotDone = {}; spotIdx = 0; doneModes.spot = false;
      recountStars(); renderSpot();
    } else if (mode === "flags"){
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("flags-")===0 || k==="mode-flags") delete awarded[k]; });
      flagsDone = {}; flagsIdx = 0; flagsMap = {}; doneModes.flags = false;
      recountStars(); renderFlags();
    } else {
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("share-")===0 || k==="mode-share") delete awarded[k]; });
      shareDone = {}; shareIdx = 0; shareMap = {}; shareSelected = null; doneModes.share = false;
      recountStars(); renderShare();
    }
    tabBadges();
    applyChrome();
  }

  function cleanSpeakText(s){
    return String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  function buildSpeakText(){
    var bits = [];
    bits.push(t(T.title));
    bits.push(cleanSpeakText(storyHtml()));
    bits.push(cleanSpeakText(($("headline") && $("headline").textContent) || ""));
    bits.push(cleanSpeakText(($("detail") && $("detail").textContent) || ""));
    bits.push(t(T.tip));
    return bits.filter(Boolean).join(". ");
  }
  function pickVoice(voices, want){
    var i, v, L;
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf(want) === 0) return v;
    }
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf("en") === 0) return v;
    }
    return voices[0] || null;
  }
  var speakTimer = null;
  function setSpeaking(on){
    var btn = $("speakBtn");
    if (!btn) return;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.style.opacity = on ? "0.65" : "";
  }
  function doSpeak(text, asLang){
    var u = new SpeechSynthesisUtterance(text);
    u.rate=0.82;
    var __v=window.ai4kidsPickVoice&&ai4kidsPickVoice();if(__v){u.voice=__v;u.lang=((__v.lang||'').toLowerCase().indexOf('ur')===0)?'ur-PK':'hi-IN';}else{u.lang='hi-IN';}u.rate=.82;
    var voices = window.speechSynthesis.getVoices() || [];
    var voice = pickVoice(voices, asLang === "ur" ? "ur" : "en");
    if (voice) u.voice = voice;
    u.onstart = function(){ setSpeaking(true); };
    u.onend = function(){ setSpeaking(false); };
    u.onerror = function(){
      setSpeaking(false);
      if (asLang === "ur"){
        var fallback = cleanSpeakText(T.title.en + ". " + T.storySpot.en + ". " + T.tip.en);
        var u2 = new SpeechSynthesisUtterance(fallback);
        u2.lang = 'hi-IN'; u2.rate = 0.92;
        var v2 = pickVoice(window.speechSynthesis.getVoices() || [], "en");
        if (v2) u2.voice = v2;
        u2.onstart = function(){ setSpeaking(true); };
        u2.onend = u2.onerror = function(){ setSpeaking(false); };
        window.speechSynthesis.speak(u2);
      }
    };
    window.speechSynthesis.speak(u);
  }
  if ("speechSynthesis" in window){
    try { window.speechSynthesis.getVoices(); } catch (e0) {}
    if (typeof window.speechSynthesis.addEventListener === "function"){
      window.speechSynthesis.addEventListener("voiceschanged", function(){
        try { window.speechSynthesis.getVoices(); } catch (e1) {}
      });
    }
  } else {
    var noBtn = $("speakBtn");
    if (noBtn){ noBtn.disabled = true; noBtn.title = "Voice not available on this device"; }
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });
  $("tabSpot").addEventListener("click", function(){ setMode("spot"); });
  $("tabFlags").addEventListener("click", function(){ setMode("flags"); });
  $("tabShare").addEventListener("click", function(){ setMode("share"); });
  $("nextBtn").addEventListener("click", next);
  $("hintBtn").addEventListener("click", showHint);
  $("resetBtn").addEventListener("click", resetMode);
  $("newQuiz").addEventListener("click", function(){ pickQuiz(); renderQuiz(); });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      var text = buildSpeakText();
      if (!text) return;
      if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
      window.speechSynthesis.cancel();
      setSpeaking(false);
      var speakLang = lang;
      speakTimer = setTimeout(function(){
        speakTimer = null;
        doSpeak(text, speakLang);
      }, 80);
    }catch(e){ setSpeaking(false); }
  });

  pickQuiz();
  applyLang();
})();
</script>
<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
</body>
