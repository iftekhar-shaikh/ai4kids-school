<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Din aur raat | AI4Kids Grade 3 General Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

  :root{
    --sun:#f5b942;
    --sun-deep:#d4920a;
    --day:#5bb8e8;
    --day-deep:#2a7fb0;
    --night:#2c3a6e;
    --night-deep:#1a2448;
    --earth:#3d8b6e;
    --earth-deep:#2a5f4a;
    --ok:#2e7d4f;
    --no:#c4453a;
    --ink:#1f2933;
    --ink-soft:#4a5661;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#1a5b8f;
    --warm:#c9702e;
    --care:#3d8b6e;
    --board:#eef3f7;
    --board-deep:#d9e5ee;
    --good-bg:#e8f2ed;
    --bad-bg:#fbeae8;
    --myth:#7b5ea7;

    --fs-cap:clamp(14px, 3.8vw, 16px);
    --fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.8vw, 20px);
    --fs-md:clamp(19px, 5.2vw, 22px);
    --fs-lg:clamp(22px, 6vw, 26px);
    --fs-xl:clamp(30px, 8vw, 38px);
    --lh:1.5;
  }
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);
    --fs-xs:clamp(17px, 4.5vw, 19px);
    --fs-sm:clamp(19px, 5.2vw, 22px);
    --fs-md:clamp(21px, 5.6vw, 24px);
    --fs-lg:clamp(24px, 6.5vw, 28px);
    --fs-xl:clamp(28px, 7.5vw, 36px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--warm);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .tabs{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
  .tabs button{
    flex:1 1 28%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:52px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,#0b1026 0%,#1a2448 45%,#2a3a5e 100%);
    padding:10px;
  }
  .scene.svg-ready svg{display:block;width:100%;height:auto}

  .readout{
    margin-top:12px;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px;
             background:var(--accent)}
  .statechip.ur{padding:2px 14px 7px}
  .lead{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .lead.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}
  body.urdu .why-note{
    border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;
    line-height:var(--lh);
  }

  .play{
    width:100%;margin-top:12px;border:3px solid var(--ink);border-radius:18px;
    background:var(--ink);color:var(--paper);font:inherit;font-weight:800;
    font-size:var(--fs-md);cursor:pointer;min-height:60px;
  }
  .play:active{transform:scale(.98)}
  .play.alt{background:var(--sun);border-color:var(--sun-deep);color:var(--ink)}
  .play.day{background:var(--day);border-color:var(--day-deep);color:var(--ink)}
  .play.night{background:var(--night);border-color:var(--night-deep);color:#fff}
  .play:disabled{opacity:.45;cursor:not-allowed}

  .two{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .two .play{flex:1;min-width:140px;margin-top:0}

  .card-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .card{flex:1;min-width:120px;border:3px solid var(--line);border-radius:16px;padding:14px 12px;text-align:center;background:var(--paper)}
  .card .emoji{font-size:36px;display:block;margin-bottom:6px}
  .card em{display:block;font-style:normal;font-size:var(--fs-cap);color:var(--ink-soft);
           font-weight:700;margin-bottom:4px}
  .card b{display:block;font-size:var(--fs-md);font-weight:800;line-height:1.3}
  .card.earth{border-color:var(--earth)}
  .card.sun{border-color:var(--sun-deep);background:#fff8e8}
  .card.spin{border-color:var(--day-deep);background:#e8f4fb}

  .panel{margin-top:18px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}

  .lesson{
    margin-top:18px;border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
    background:var(--paper);
  }
  .lesson .tag{
    display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
    padding:4px 12px;font-size:var(--fs-cap);font-weight:800;margin-bottom:10px;
  }
  .lesson p{margin:0 0 10px;font-size:var(--fs-sm);line-height:1.55}
  .lesson p:last-child{margin-bottom:0}
  body.urdu .lesson p{line-height:var(--lh)}

  .slider-wrap{margin-top:12px}
  .slider-wrap label{display:block;font-size:var(--fs-cap);font-weight:700;margin-bottom:6px;color:var(--ink-soft)}
  .spin-slider{
    width:100%;height:36px;cursor:pointer;accent-color:var(--sun);
  }

  .side-row{display:flex;gap:10px;margin-top:10px}
  .side-pill{
    flex:1;text-align:center;border-radius:14px;padding:10px 8px;font-weight:800;
    font-size:var(--fs-sm);border:3px solid var(--ink);min-height:52px;
    display:flex;align-items:center;justify-content:center;
  }
  .side-pill.day{background:#dff3fc;color:var(--day-deep);border-color:var(--day-deep)}
  .side-pill.night{background:#e8eaf5;color:var(--night);border-color:var(--night)}

  .sort-prompt{
    margin-top:12px;padding:14px 16px;border:2px dashed var(--warm);border-radius:14px;
    background:#fbf1e8;font-size:var(--fs-sm);font-weight:700;color:#8a4a12;line-height:1.55;
  }
  body.urdu .sort-prompt{line-height:var(--lh)}

  .sort-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .sort-bin{
    border:3px solid var(--line);border-radius:16px;padding:12px;min-height:140px;
    background:var(--paper);
  }
  .sort-bin.day{border-color:var(--day-deep);background:#e8f4fb}
  .sort-bin.night{border-color:var(--night);background:#eef0f8}
  .sort-bin h3{margin:0 0 8px;font-size:var(--fs-sm);font-weight:800;text-align:center}
  .sort-bin .drop{min-height:70px;display:flex;flex-direction:column;gap:6px}

  .act-btn{
    border:3px solid var(--line);background:var(--paper);border-radius:14px;
    padding:12px 10px;font:inherit;font-weight:700;font-size:var(--fs-cap);
    cursor:pointer;min-height:64px;color:var(--ink);text-align:center;width:100%;
  }
  .act-btn .emoji{font-size:24px;display:block;margin-bottom:2px}
  .act-btn.ok{border-color:var(--ok);background:var(--good-bg)}
  .act-btn.no{border-color:var(--no);background:var(--bad-bg)}
  .act-btn:disabled{opacity:.85;cursor:default}

  .choice-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .choice-btn{
    border:3px solid var(--line);background:var(--paper);border-radius:14px;
    padding:14px 10px;font:inherit;font-weight:800;font-size:var(--fs-sm);
    cursor:pointer;min-height:72px;color:var(--ink);text-align:center;
  }
  .choice-btn.day{border-color:var(--day-deep)}
  .choice-btn.night{border-color:var(--night)}
  .choice-btn.picked-ok{border-color:var(--ok);background:var(--good-bg)}
  .choice-btn.picked-no{border-color:var(--no);background:var(--bad-bg)}
  .choice-btn:disabled{opacity:.8;cursor:default}

  .myth-card{
    margin-top:12px;border:3px solid var(--myth);border-radius:18px;padding:16px 18px;
    background:#f3eef9;
  }
  .myth-card .emoji{font-size:40px;display:block;text-align:center;margin-bottom:8px}
  .myth-card h3{margin:0 0 8px;font-size:var(--fs-lg);font-weight:800;text-align:center;line-height:1.3}
  .myth-card p{margin:0;font-size:var(--fs-sm);line-height:1.55;color:var(--ink-soft)}
  body.urdu .myth-card p,body.urdu .myth-card h3{line-height:var(--lh)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:52px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e6f4ec;font-weight:600}
  .opt.wrong{border-color:var(--no);background:#fbeae4}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.55}
  .fb.show{display:block}
  .score{
    margin-top:8px;padding:14px 16px;border:3px solid var(--ok);border-radius:16px;
    background:#eaf4ee;font-size:var(--fs-md);font-weight:800;text-align:center;
    display:none;
  }
  .score.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  .hidden{display:none !important}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;
      grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar"
        "head  head"
        "tabs  tabs"
        "left  right"
        "quiz  quiz"
        "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar}
    .head{grid-area:head}
    .tabs{grid-area:tabs}
    .left{grid-area:left}
    .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px}
    footer{grid-area:foot}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important}
  }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

<body>
<div class="wrap">

  <div class="bar">
    <span class="brand">AI4Kids · Grade 3 · General Science</span>
    <button class="chip" id="langBtn" aria-pressed="false">اردو</button>
    <button class="chip" id="speakBtn" aria-label="Sunein">🔊</button>
  </div>

  <div class="head">
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
  </div>

  <div class="tabs" role="group" id="tabs">
    <button type="button" data-tab="hook" aria-pressed="true">Hook</button>
    <button type="button" data-tab="spin" aria-pressed="false">Spin</button>
    <button type="button" data-tab="cards" aria-pressed="false">Cards</button>
    <button type="button" data-tab="sort" aria-pressed="false">Sort</button>
    <button type="button" data-tab="myth" aria-pressed="false">Myth</button>
  </div>

  <div class="left" id="leftPane"></div>
  <div class="right" id="rightPane"></div>

  <div class="quiz">
    <h2 id="quizHead" style="font-size:var(--fs-lg);font-weight:800;margin:0 0 16px"></h2>
    <div id="quizBox"></div>
    <div class="score" id="scoreBox"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
(function(){
  var lang = "en";
  var tab = "hook";
  var lastSpoken = "";
  var earthAngle = 0; /* degrees: 0 = Pakistan facing sun (day) */
  var spinning = false;
  var spinTimer = null;
  var sortIndex = 0;
  var sortPick = null;
  var sortFeedback = "";
  var quizScore = 0;
  var quizAnswered = 0;

  var T = {
    brand: {en:"AI4Kids · Grade 3 · General Science", ur:"AI4Kids · جماعت ۳ · جنرل سائنس"},
    title: {en:"Din aur raat", ur:"دن اور رات"},
    sub: {
      en:"Earth turns — why day comes. Spin the Earth, sort day vs night, bust a moon myth!",
      ur:"زمین گھومتی ہے — دن کیوں آتا ہے۔ زمین گھماؤ، دن اور رات چُنو، چاند والا افسانہ توڑو!"
    },
    tabs: {
      hook:{en:"Hook", ur:"ہُک"},
      spin:{en:"Spin", ur:"گھماؤ"},
      cards:{en:"Cards", ur:"کارڈز"},
      sort:{en:"Sort", ur:"چُنو"},
      myth:{en:"Myth", ur:"افسانہ"}
    },
    quiz: {en:"Quiz — 5 sawaal", ur:"کوئز — ۵ سوال"},
    scoreLbl: {en:"Your score", ur:"آپ کا اسکور"},
    of: {en:"out of", ur:"میں سے"},
    foot: {
      en:"AI4Kids Islamabad · Grade 3 General Science · Din aur raat",
      ur:"AI4Kids اسلام آباد · جماعت ۳ جنرل سائنس · دن اور رات"
    },
    ghaur: {en:"Ghaur karein:", ur:"غور کریں:"}
  };

  var HOOK = {
    tag:{en:"HOOK", ur:"ہُک"},
    p1:{
      en:"Have you ever thought — when you are asleep, why is it day somewhere else on Earth? Or when you go to school, why is it night in another place? Let's open this secret!",
      ur:"کیا آپ نے کبھی سوچا ہے کہ جب آپ سوئے ہوتے ہیں، تو آپ کے آس پاس زمین پر کہیں دن کیوں ہوتا ہے؟ یا جب آپ اسکول جاتے ہیں، تو کہیں اور رات کیوں ہوتی ہے؟ چلو، اس راز کو سمجھتے ہیں!"
    },
    p2:{
      en:"Day and night are not a switch in the sky — they come because Earth itself is spinning!",
      ur:"دن اور رات آسمان کا سوئچ نہیں — یہ اس لیے آتے ہیں کہ خود زمین گھوم رہی ہے!"
    }
  };
  var SAMJHAO = {
    tag:{en:"SAMJHAO", ur:"سمجھاؤ"},
    p1:{
      en:"Earth spins on its axis — like a coin spinning. When Earth turns, one side faces the Sun and gets light: that is day. The other side faces away and is dark: that is night.",
      ur:"زمین اپنے محور (axis) پر گھومتی ہے — جیسے سکہ گھومتا ہے۔ جب زمین گھومتی ہے تو ایک حصہ سورج کی روشنی میں آتا ہے: وہ دن ہے۔ دوسرا حصہ اندھیرے میں ہوتا ہے: وہ رات ہے۔"
    },
    p2:{
      en:"One complete spin (one rotation) takes about 24 hours. In that time we feel a full day and a full night. The Sun keeps shining — Earth is what turns!",
      ur:"ایک مکمل گھومنا (ایک rotation) تقریباً ۲۴ گھنٹے میں ہوتا ہے۔ اس وقت میں ہم پورا دن اور پوری رات محسوس کرتے ہیں۔ سورج چمکتا رہتا ہے — گھومتی زمین ہے!"
    },
    p3:{
      en:"In every corner of Pakistan, when the Sun rises in the morning people wake up and the world feels alive. When night comes, people sleep and things grow quiet.",

    }
  };
  var MISAAL = {
    tag:{en:"MISAAL", ur:"مثال"},
    p1:{
      en:"Think of the bazaar in morning light — busy shops, buying, laughing. At night fewer people, shops close. That rhythm comes because Earth is spinning!",
      ur:"سوچو جب آپ بازار جاتے ہیں صبح کی روشنی میں — دکانیں کھلی، خریداری، ہنسی مذاق۔ رات کو لوگ کم، دکانیں بند۔ یہ سب زمین کے گھومنے کی وجہ سے ہے!"
    }
  };
  var KARO = {
    tag:{en:"KARO", ur:"کرو"},
    p1:{
      en:"Try at home or school: take a ball or globe and a flashlight. Shine the light (Sun) and slowly turn the ball (Earth). Watch one side bright (day) and the other dark (night)!",
      ur:"گھر یا اسکول میں آزمائیں: گیند یا گلوب اور فلیش لائٹ لیں۔ روشنی (سورج) چمکائیں اور گیند (زمین) آہستہ گھمائیں۔ دیکھو ایک حصہ روشن (دن) اور دوسرا اندھیرا (رات)!"
    }
  };

  var SPIN = {
    head:{en:"Earth–Sun demo — spin for day & night", ur:"زمین–سورج ڈیمو — گھما کر دن و رات دیکھو"},
    spinLbl:{en:"Spin Earth (degrees)", ur:"زمین گھماؤ (ڈگری)"},
    auto:{en:"Auto-spin", ur:"خود بخود گھماؤ"},
    stop:{en:"Stop", ur:"روکو"},
    reset:{en:"Reset", ur:"ری سیٹ"},
    daySide:{en:"☀ Day side", ur:"☀ دن والا حصہ"},
    nightSide:{en:"🌙 Night side", ur:"🌙 رات والا حصہ"},
    pkDay:{
      en:"Pakistan is on the sunny side — it is day!",
      ur:"پاکستان دھوپ والے حصے پر ہے — دن ہے!"
    },
    pkNight:{
      en:"Pakistan is on the dark side — it is night!",
      ur:"پاکستان اندھیرے حصے پر ہے — رات ہے!"
    },

  function $(id){ return document.getElementById(id); }

  var LRI = "\u2066", PDI = "\u2069";
  var LATIN_RUN = /[A-Za-z0-9][A-Za-z0-9 .,+()\/@_°%-]*[A-Za-z0-9°%]|[A-Za-z0-9%]/g;
  function isolate(s){ return String(s).replace(LATIN_RUN, function(m){ return LRI + m + PDI; }); }

  function setText(el, str){
    if (!el) return;
    el.textContent = (lang === "ur") ? isolate(str) : str;
    el.classList.toggle("ur", lang === "ur");
    el.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
  }

  function pkIsDay(){
    /* Marker at angle earthAngle; sun from left (180° in SVG space).
       Day when facing left-ish: angle mod 360 in [270..360) U [0..90] after transform.
       We place PK at top of globe at angle 0, sun on the left.
       Lit hemisphere is left half of circle in screen space; rotating globe by earthAngle.
       PK position: angle from +x = -90 + earthAngle (start at top).
       Simpler: at earthAngle=0, PK faces sun (day). Day while |normalized| < 90. */
    var a = ((earthAngle % 360) + 360) % 360;
    return (a <= 90 || a >= 270);
  }

    var a = earthAngle;
    return (
      '<svg class="svg-ready" viewBox="0 0 320 240" role="img" aria-label="Earth and Sun">' +
      '<defs><clipPath id="earthClip"><circle cx="200" cy="120" r="52"/></clipPath></defs>' +
      /* stars */
      '<circle cx="40" cy="30" r="1.5" fill="#fff" opacity=".7"/>' +
      '<circle cx="90" cy="50" r="1.2" fill="#fff" opacity=".5"/>' +

      '<circle cx="60" cy="200" r="1.3" fill="#fff" opacity=".5"/>' +
      /* sun left — fixed */
      '<circle cx="48" cy="120" r="28" fill="var(--sun)" stroke="var(--sun-deep)" stroke-width="3"/>' +
      '<circle cx="48" cy="120" r="18" fill="#ffe08a" opacity=".9"/>' +
      '<text x="48" y="168" text-anchor="middle" fill="var(--sun)" font-size="13" font-weight="800" font-family="Baloo Bhaijaan 2,sans-serif">Sun</text>' +
      '<path d="M80 120 H145" stroke="var(--sun)" stroke-width="3" stroke-dasharray="4 4" opacity=".7"/>' +
      /* lit hemisphere fixed toward sun (left); dark half right */
      '<g clip-path="url(#earthClip)">' +
        '<rect x="148" y="68" width="52" height="104" fill="var(--day)"/>' +
        '<rect x="200" y="68" width="52" height="104" fill="var(--night)"/>' +

      '<g clip-path="url(#earthClip)" transform="rotate('+a+' 200 120)">' +
        '<ellipse cx="168" cy="108" rx="16" ry="20" fill="var(--earth)" opacity=".9"/>' +
        '<ellipse cx="230" cy="135" rx="14" ry="18" fill="#243556" opacity=".55"/>' +

      '<div class="sort-prompt"><span id="promptAsk"></span><br><span id="promptAct" style="font-size:var(--fs-lg)"></span></div>' +
      '<div style="text-align:center;font-size:48px;margin:12px 0" id="actEmoji"></div>' +
      '<div class="choice-row">' +
        '<button type="button" class="choice-btn day" id="pickDay"></button>' +
        '<button type="button" class="choice-btn night" id="pickNight"></button>' +
      '</div>' +
      '<button type="button" class="play" id="nextSort" style="margin-top:12px"></button>';
    R.innerHTML =
      '<div class="readout">' +
        '<span class="statechip" id="soChip" style="background:var(--warm)"></span>' +
        '<p class="lead" id="soLead"></p>' +
        '<p class="detail" id="soDetail"></p>' +
      '</div>' +
      '<div class="sort-grid" style="margin-top:12px">' +
        '<div class="sort-bin day"><h3 id="binDay"></h3><div class="drop" id="dropDay"></div></div>' +
        '<div class="sort-bin night"><h3 id="binNight"></h3><div class="drop" id="dropNight"></div></div>' +
      '</div>';

    setText($("sortHead"), t(SORT.head));
    setText($("promptAsk"), t(SORT.ask));
    setText($("promptAct"), item.emoji + " " + t(item.ask));
    $("actEmoji").textContent = item.emoji;
    setText($("pickDay"), t(SORT.dayBtn));
    setText($("pickNight"), t(SORT.nightBtn));
    setText($("binDay"), t(SORT.dayBtn));
    setText($("binNight"), t(SORT.nightBtn));

    /* show previously correct placements */
    SORT.items.forEach(function(it, i){
      if (i > sortIndex) return;
      if (i === sortIndex && sortFeedback !== "ok") return;
      var chip = document.createElement("div");
      chip.className = "act-btn ok";
      chip.style.minHeight = "44px";
      chip.style.padding = "8px";
      chip.innerHTML = '<span class="emoji" style="font-size:18px;display:inline;margin:0 4px">'+it.emoji+'</span>';
      var span = document.createElement("span");
      setText(span, t(it.ask));
      chip.appendChild(span);
      if (it.ans === "day") $("dropDay").appendChild(chip);
      else $("dropNight").appendChild(chip);
    });

    var dayBtn = $("pickDay"), nightBtn = $("pickNight");
    if (sortPick){
      var ok = (sortPick === item.ans);
      dayBtn.disabled = true;
      nightBtn.disabled = true;
      if (sortPick === "day") dayBtn.classList.add(ok ? "picked-ok" : "picked-no");
      if (sortPick === "night") nightBtn.classList.add(ok ? "picked-ok" : "picked-no");
      if (ok){
        setText($("soChip"), lang==="en"?"Correct!":"درست!");
        $("soChip").style.background = "var(--ok)";
        setText($("soLead"), t(item.ok));
        setText($("soDetail"), "");
        lastSpoken = t(item.ok);
      } else {
        setText($("soChip"), lang==="en"?"Try again":"دوبارہ سوچو");
        $("soChip").style.background = "var(--no)";
        setText($("soLead"), t(item.no));
        setText($("soDetail"), "");
        lastSpoken = t(item.no);
        dayBtn.disabled = false;
        nightBtn.disabled = false;
      }
    } else {
      setText($("soChip"), lang==="en"?"Your turn":"آپ کی باری");
      $("soChip").style.background = "var(--warm)";
      setText($("soLead"), t(item.ask));
      setText($("soDetail"), t(SORT.ask));
      lastSpoken = t(item.ask);
    }

    dayBtn.onclick = function(){
      if (sortFeedback === "ok") return;
      sortPick = "day";
      sortFeedback = (item.ans === "day") ? "ok" : "no";
      renderSort();
    };
    nightBtn.onclick = function(){
      if (sortFeedback === "ok") return;
      sortPick = "night";
      sortFeedback = (item.ans === "night") ? "ok" : "no";
      renderSort();
    };

    var nextBtn = $("nextSort");
    if (sortIndex >= SORT.items.length - 1 && sortFeedback === "ok"){
      setText(nextBtn, t(SORT.done));
      nextBtn.disabled = true;
    } else {
      setText(nextBtn, t(SORT.next));
      nextBtn.disabled = sortFeedback !== "ok";
      nextBtn.onclick = function(){
        if (sortFeedback !== "ok") return;
        sortIndex = sortIndex + 1;
        if (sortIndex >= SORT.items.length) sortIndex = SORT.items.length - 1;
        sortPick = null;
        sortFeedback = "";
        renderSort();
      };
    }
  }

  function renderMyth(){
    stopSpin();
    var L = $("leftPane"), R = $("rightPane");
    L.innerHTML =
      '<div class="panel"><h2 id="mythHead"></h2></div>' +
      '<div class="myth-card">' +
        '<span class="emoji" id="mythEmoji"></span>' +
        '<h3 id="mythTitle"></h3>' +
        '<p id="mythMyth"></p>' +
      '</div>' +
      '<div class="lesson" style="margin-top:12px"><span class="tag" id="truthTag"></span><p id="mythTruth"></p></div>';
    R.innerHTML =
      '<div class="readout">' +
        '<span class="statechip" id="mChip" style="background:var(--myth)"></span>' +
        '<p class="lead" id="mLead"></p>' +
        '<p class="detail" id="mDetail"></p>' +
        '<p class="why-note"><b id="mGhaur"></b> <span id="mTip"></span></p>' +
      '</div>' +
      '<div class="card-row">' +
        '<div class="card sun"><span class="emoji">☀️</span><em id="mSunE"></em><b id="mSunB"></b></div>' +
        '<div class="card earth"><span class="emoji">🌍</span><em id="mEarE"></em><b id="mEarB"></b></div>' +
      '</div>';

    setText($("mythHead"), t(MYTH.head));
    $("mythEmoji").textContent = MYTH.emoji;
    setText($("mythTitle"), t(MYTH.title));
    setText($("mythMyth"), t(MYTH.myth));
    setText($("truthTag"), lang==="en"?"TRUTH":"سچ");
    setText($("mythTruth"), t(MYTH.truth));

    setText($("mChip"), lang==="en"?"Tip card":"ٹپ کارڈ");
    setText($("mLead"), t(MYTH.title));
    setText($("mDetail"), t(MYTH.tip));
    $("mGhaur").textContent = t(T.ghaur);
    setText($("mTip"), t(SPIN.tip));
    setText($("mSunE"), t(CARDS.items[1].title));
    setText($("mSunB"), lang==="en"?"Always on":"ہمیشہ روشن");
    setText($("mEarE"), t(CARDS.items[0].title));
    setText($("mEarB"), lang==="en"?"Turns = day/night":"گھومے = دن/رات");
    lastSpoken = t(MYTH.truth);
  }

  function renderTab(){
    if (tab === "hook") renderHook();
    else if (tab === "spin") renderSpin(false);
    else if (tab === "cards") renderCards();
    else if (tab === "sort") renderSort();
    else renderMyth();
  }

  function buildQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizScore = 0;
    quizAnswered = 0;
    $("scoreBox").classList.remove("show");

    QUIZ.forEach(function(item, qi){
      var wrap = document.createElement("div");
      wrap.className = "q";
      var q = document.createElement("p");
      setText(q, (qi+1) + ". " + t(item.q));
      wrap.appendChild(q);
      var fb = document.createElement("p");
      fb.className = "fb";
      item.o.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang === "ur" ? " ur" : "");
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.textContent = (lang === "ur") ? isolate(t(opt)) : t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done") === "1") return;
          wrap.setAttribute("data-done","1");
          quizAnswered++;
          var correct = (oi === item.a);
          if (correct) quizScore++;
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi && !correct) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show");
          if (quizAnswered === QUIZ.length){
            var sb = $("scoreBox");
            setText(sb, t(T.scoreLbl) + ": " + quizScore + " " + t(T.of) + " " + QUIZ.length);
            sb.classList.add("show");
          }
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb);
      box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    document.documentElement.lang = (lang === "ur") ? "ur" : "en";
    document.documentElement.dir = (lang === "ur") ? "rtl" : "ltr";

    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");

    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    setText($("quizHead"), t(T.quiz));
    setText($("foot"), t(T.foot));

    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
      var key = b.getAttribute("data-tab");
      setText(b, t(T.tabs[key]));
      b.setAttribute("aria-pressed", key === tab ? "true" : "false");
    });

    buildQuiz();
    renderTab();
  }

  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
    b.addEventListener("click", function(){
      tab = b.getAttribute("data-tab");
      Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(x){
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      renderTab();
    });
  });

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });

  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(lastSpoken);
      u.lang = (lang === "ur") ? "ur-PK" : "en-US";
      u.rate = 0.92;
      var voices = window.speechSynthesis.getVoices() || [];
      for (var i=0;i<voices.length;i++){
        if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(lang === "ur" ? "ur" : "en") === 0){
          u.voice = voices[i]; break;
        }
      }
      window.speechSynthesis.speak(u);
    }catch(e){}
  });

  applyLang();
})();
</script>
</body>
</html>
