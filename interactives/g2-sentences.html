\n\1</head><body><main class="wrap"><div class="bar"><span id="brand" class="brand"></span><button id="lang" class="chip" aria-pressed="false">Roman Urdu</button><button id="speak" class="chip" aria-label="Play">🔊</button></div><header><h1 id="title"></h1><p id="sub" class="sub"></p></header><nav id="tabs" class="tabs"></nav><div class="columns"><div id="left"></div><div id="right"></div></div><div id="lessons"></div><section class="quiz"><h2 id="qh"></h2><div id="quiz"></div><div id="score" class="score"></div></section><footer id="foot"></footer></main><script>const DATA={"title":{"en":"Sentences banana","ur":"Sentences banana"},"desc":{"en":"Statements aur questions likhna","ur":"Statements aur questions likhna"},"sections":[{"key":"hook","tag":{"en":"HOOK","ur":"HOOK"},"body":{"en":"When you share an idea or ask a friend something, you use a sentence. Let us make clear sentences and use the right ending mark.","ur":"Aik din Student ke dost ne kaha, \"Kya tumhein pata hai, hum kis tarah se achi baatein karte hain?\" Student ko samajh nahi aaya. Usne socha, \"Kya hum sirf baatein karte hain ya kuch aur bhi karte hain?\""}},{"key":"samjhao","tag":{"en":"SAMJHAO","ur":"SAMJHAO"},"body":{"en":"A statement tells something and ends with a full stop: “I like mangoes.” A question asks something and ends with a question mark: “Do you like mangoes?” Start with a capital letter.","ur":"Aaj hum seekhenge ke sentences kaise bante hain. Jab hum kuch kehna chahte hain to hum sentences banate hain. Sentences do tarah ke hote hain: Statements aur Questions. \n\nStatements wo hote hain jinmein hum koi baat karte hain. Jaise \"Maam biryani pasand karti hain.\" Ye ek statement hai kyunki ismein sirf ek baat ki gayi hai. Jaise hi hum kehte hain \"Main cricket khelta hoon,\" toh hum apne shauk ke bare mein baat kar rahe hain. \n\nQuestions wo hote hain jinke zariye hum kisi se kuch puchte hain. Jaise \"Kya tum cricket khelte ho?\" Ye ek question hai kyunki hum jawab chahte hain. Jab hum kisi se kuch poochte hain, toh hamesha question mark (?) lagaana nahi bhoolna chahiye.\n\nAb agar hum sochay \"Ye kya hai?\" toh ye question hai. Hum is tarah se sentences banakar apni feelings aur soch ko dusron tak pohanchate hain. Hamara lessons ka maksad ye hai ke aap achi tarah se statements aur questions banana seekh sakein."}},{"key":"misaal","tag":{"en":"MISAAL","ur":"MISAAL"},"body":{"en":"At a market, “The biryani is tasty.” is a statement. “Is the biryani hot?” is a question. The first tells; the second asks.","ur":"Socho aap bazaar gaye hain aur wahan aapne aman biryani dekhi. Aap keh sakte hain, \"Yeh biryani bohat tasty hai.\" Ye ek statement hai. Aap agar poochna chahte hain, \"Yeh biryani kitni kharch hai?\" toh ye ek question hai. Aap in sentences ka istemal bazaar mein asaani se kar sakte hain."}},{"key":"karo","tag":{"en":"KARO","ur":"KARO"},"body":{"en":"Write three statements about your favourite food. Then write three questions. Check the capital letter and ending mark.","ur":"Ghar ya school mein aap ek activity kar sakte hain. Aap apne dosto ya family ke sath baith kar kuch statements aur questions likhein. Pehle apne pasandida khaney ke bare mein 3 statements likhein. Phir us khaney ke bare mein 3 questions banayen. Jaise aap \"Biryani itni tasty hai\" ya \"Kya biryani khanay ko aata hai?\" Aap in sentences ko share karein aur unse jawab lein!\n\n## SAWAAL\n1. Statements aur questions ka kya farq hai?\n2. Aapne apne ghar mein kis cheez ka ek statement banaya?\n3. Kya aap ek question bana sakte hain jo aapke dost se puchne layak ho?\n\nKhush raho aur seekhte raho! \n\nSign off: English Ma'am"}}],"quiz":[{"q":{"en":"“Kya tum school ja rahe ho?” asks for which answer?","ur":"Kya tum school ja rahe ho?"},"opts":[{"en":"Yes, I am going to school.","ur":"Haan, mein school ja raha hoon."},{"en":"Do you want food?","ur":"Kya tum khana khana chahte ho?"},{"en":"My name is Ali.","ur":"Mera naam Ali hai."},{"en":"Mangoes are tasty.","ur":"Aam bahut tasty hain."}],"ans":0,"exp":{"en":"Yeh ek sawal hai aur iska jawab hai ke haan.","ur":"Yeh ek sawal hai aur iska jawab hai ke haan."}},{"q":{"en":"Which answer is marked correct for “Ghar ka kaam kaise karte hain?”","ur":"Ghar ka kaam kaise karte hain?"},"opts":[{"en":"We clean first.","ur":"Pehle saaf karte hain."},{"en":"We do not go anywhere.","ur":"Kahi nahin jate hain."},{"en":"How much money?","ur":"Kitne paise hain?"},{"en":"The weather is nice.","ur":"Mausam bohat achha hai."}],"ans":1,"exp":{"en":"Yeh ek sawal hai jo ghar ka kaam puch raha hai.","ur":"Yeh ek sawal hai jo ghar ka kaam puch raha hai."}},{"q":{"en":"Which answer is marked correct in the friend-name question?","ur":"Tumhara dost kis naam se jana jata hai?"},"opts":[{"en":"Rizwan.","ur":"Rizwan."},{"en":"Are you playing?","ur":"Kya tum khel rahe ho?"},{"en":"It is time for the ride.","ur":"Sawari ka waqt hai."},{"en":"This is easy.","ur":"Yeh aasan hai."}],"ans":2,"exp":{"en":"Yeh ek statement hai jo waqt ki baat kar raha hai.","ur":"Yeh ek statement hai jo waqt ki baat kar raha hai."}},{"q":{"en":"Which is the statement marked correct for “Aam kis tarah ka phal hai?”","ur":"Aam kis tarah ka phal hai?"},"opts":[{"en":"It is good to eat.","ur":"Ye khanay mein achha hai."},{"en":"Did you eat?","ur":"Kya tum ne khana khaya?"},{"en":"I am studying maths.","ur":"Mein math padh raha hoon."},{"en":"It is time to go home.","ur":"Ghar janay ka waqt hai."}],"ans":0,"exp":{"en":"Yeh ek statement hai aur aam ke bare mein jaankari de raha hai.","ur":"Yeh ek statement hai aur aam ke bare mein jaankari de raha hai."}},{"q":{"en":"Which answer is marked correct for “Tumhara favorite khana kya hai?”","ur":"Tumhara favorite khana kya hai?"},"opts":[{"en":"Biryani.","ur":"Biryani."},{"en":"He called me.","ur":"Usne mujhe bulaya."},{"en":"This is a book.","ur":"Yeh kitab hai."},{"en":"Listen to a story.","ur":"Kahani suno."}],"ans":3,"exp":{"en":"Yeh ek sawal hai jo favorite khane ko puch raha hai.","ur":"Yeh ek sa
