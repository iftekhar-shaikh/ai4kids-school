  function placePart(slotI, partId){
    if (partChecked) return;
    for (var i=0;i<6;i++) if (partOrder[i]===partId) partOrder[i]=null;
    partOrder[slotI] = partId;
    renderParts();
  }

  function renderParts(){
    var left = $("leftPane"); left.innerHTML = "";
    var scene = document.createElement("div"); scene.className = "scene";
    var slots = document.createElement("div"); slots.className = "slots";
    for (var i=0;i<6;i++){
      (function(si){
        var sl = document.createElement("div");
        sl.className = "slot" + (partOrder[si] ? " filled" : "");
        if (partChecked){
          sl.className += (partOrder[si] === CORRECT[si]) ? " ok" : " bad";
        }
        var num = document.createElement("span"); num.className = "num"; num.textContent = String(si+1);
        sl.appendChild(num);
        if (partOrder[si]){
          var p = partById(partOrder[si]);
          var lab = document.createElement("button");
          lab.type = "button";
          lab.className = "piece " + p.cls;
          lab.style.cssText = "border-width:2px;padding:6px 10px;margin:0;flex:1;text-align:inherit;cursor:pointer";
          setText(lab, t(p.label));
          lab.addEventListener("click", function(){
            if (partChecked) return;
            partOrder[si] = null;
            renderParts();
          });
          sl.appendChild(lab);
        } else {
          var ph = document.createElement("span"); ph.className = "ph";
          setText(ph, t(T.slotPh));
          sl.appendChild(ph);
        }
        slots.appendChild(sl);
      })(i);
    }
    scene.appendChild(slots);

    var bank = document.createElement("div"); bank.className = "bank";
    PARTS.forEach(function(p){
      var used = partOrder.indexOf(p.id) !== -1;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "piece " + p.cls + (used ? " used" : "");
      setText(b, t(p.label));
      b.addEventListener("click", function(){
        if (used || partChecked) return;
        for (var j=0;j<6;j++){
          if (partOrder[j] === null){ placePart(j, p.id); return; }
        }
      });
      bank.appendChild(b);
    });
    scene.appendChild(bank);

    var chk = document.createElement("button");
    chk.type = "button"; chk.className = "checkbtn";
    setText(chk, t(T.check));
    chk.addEventListener("click", function(){
      if (partOrder.indexOf(null) !== -1) return;
      partChecked = true;
      var good = true;
      for (var i=0;i<6;i++) if (partOrder[i] !== CORRECT[i]) good = false;
      lastSpoken = good
        ? "Shabash! Address, date, salutation, body, closing, signature."
        : "Try again. Remember the formal letter order.";
      renderParts();
    });
    scene.appendChild(chk);

    var rst = document.createElement("button");
    rst.type = "button"; rst.className = "resetbtn";
    setText(rst, t(T.reset));
    rst.addEventListener("click", function(){
      partOrder = [null,null,null,null,null,null]; partChecked = false; renderParts();
    });
    scene.appendChild(rst);

    if (partChecked){
      var good = true;
      for (var g=0;g<6;g++) if (partOrder[g] !== CORRECT[g]) good = false;
      var fb = document.createElement("div");
      fb.className = "fbbox show " + (good ? "ok" : "no");
      setText(fb, good ? t(T.planOk) : t(T.planNo));
      scene.appendChild(fb);
    }
    left.appendChild(scene);

    var right = $("rightPane"); right.innerHTML = "";
    var ro = document.createElement("div"); ro.className = "readout";
    var chip = document.createElement("span"); chip.className = "statechip";
    setText(chip, t(T.tipParts));
    var lead = document.createElement("p"); lead.className = "lead";
    setText(lead, t(T.tipPartsLead));
    var detail = document.createElement("p"); detail.className = "detail";
    setText(detail, t(T.tipPartsDet));
    ro.appendChild(chip); ro.appendChild(lead); ro.appendChild(detail);
    right.appendChild(ro);
    lastSpoken = "Put address, date, salutation, body, closing, and signature in order.";
  }

  function loadLetter(){
    try{
      var raw = localStorage.getItem(LS);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveLetter(data){
    try{ localStorage.setItem(LS, JSON.stringify(data)); }catch(e){}
  }

  function buildLetterText(data){
    var name = data.name || (lang==="en"?"Ayesha Khan":"عائشہ خان");
    var addr = data.addr || (lang==="en"?"House 12, Street 7, G-10/2, Islamabad":"گھر ۱۲، سٹریٹ ۷، جی-۱۰/۲، اسلام آباد");
    var school = data.school || "Islamabad Model School";
    var date = data.date || "";
    var reason = data.reason || "";
    var days = data.days || "";
    var body;
    if (data.kind === "leave"){
      body = lang==="en"
        ? ("I am a student of Class 4. I request leave for " + (days || "___") + " day(s).\n\nReason: " + (reason || "___") + "\n\nI will complete my missed work when I return.")
        : ("میں کلاس ۴ کا/کی طالب علم ہوں۔ مجھے " + (days || "___") + " دن کی چھٹی درکار ہے۔\n\nوجہ: " + (reason || "___") + "\n\nواپس آ کر چھوٹا ہوا کام مکمل کروں گا۔");
    } else {
      body = lang==="en"
        ? ("I request permission for the following:\n\n" + (reason || "___") + "\n\nI will follow all school rules and stay with my class.")
        : ("میں درج ذیل کے لیے اجازت کی درخواست کرتا/کرتی ہوں:\n\n" + (reason || "___") + "\n\nمیں تمام قواعد پر عمل کروں گا اور کلاس کے ساتھ رہوں گا۔");
    }
    return addr + "\n" + date + "\n\nThe Principal\n" + school + "\nIslamabad\n\nDear Principal,\n\n" + body + "\n\nYours sincerely,\n" + name + "\nClass 4";
  }

  function renderWriter(){
    var saved = loadLetter() || {};

      var lab = document.createElement("label"); setText(lab, t(T[labKey]));

      if (type !== "ta") inp.type = type || "text";

    var inpDate = field("date","wDate","date", saved.date || new Date().toISOString().slice(0,10));

      inpDays = field("days","wDays","text", saved.days, "2");

    function showPreview(data){

      ro.appendChild(chip); ro.appendChild(lead);

      box.style.marginTop = "10px";
      box.textContent = buildLetterText(data);
      if (lang==="ur"){ box.classList.add("ur"); box.setAttribute("dir","rtl"); }

      try{ localStorage.removeItem(LS); }catch(e){}

      showPreview(Object.assign({kind:letterKind}, saved));

      var ro = document.createElement("div"); ro.className = "readout";
      var chip = document.createElement("span"); chip.className = "statechip";

      renderParts(); return;
    }
    if (tab === "writer"){
      setText($("title"), t(T.titleWriter));
      setText($("subtitle"), t(T.subWriter));
      renderWriter(); return;
    }
    setText($("title"), t(T.titleSample));
    setText($("subtitle"), t(T.subSample));
    renderSample();
  }

  ["Learn","Compare","Parts","Writer","Sample"].forEach(function(x){
    $("tab"+x).addEventListener("click", function(){
      var m = x.toLowerCase();
      if (tab === m) return;
      try{ window.speechSynthesis.cancel(); }catch(e){}
      tab = m;
      render();
    });
  });

  function buildQuiz(){
    var box = $("quizBox"); box.innerHTML = "";
    quizScore = 0; quizAnswered = 0;
    $("scoreBox").classList.remove("show");
    QUIZ.forEach(function(item){
      var wrap = document.createElement("div"); wrap.className = "q";
      var q = document.createElement("p"); setText(q, t(item.q)); wrap.appendChild(q);
      var fb = document.createElement("p"); fb.className = "fb";
      item.o.forEach(function(opt, oi){
        var bt = document.createElement("button");
        bt.type = "button"; bt.className = "opt" + (lang === "ur" ? " ur" : "");
        setText(bt, t(opt));
        bt.addEventListener("click", function(){
          if (wrap.getAttribute("data-done") === "1") return;
          wrap.setAttribute("data-done","1");
          quizAnswered++;
          if (oi === item.a) quizScore++;
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show");
          if (quizAnswered === QUIZ.length){
            var sb = $("scoreBox");
            sb.classList.add("show");
            setText(sb, t(T.score) + ": " + quizScore + " " + t(T.of) + " " + QUIZ.length);
          }
        });
        wrap.appendChild(bt);
      });
      wrap.appendChild(fb); box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");
    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });
    buildQuiz(); render();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en"; applyLang();
  });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u2 = new SpeechSynthesisUtterance(lastSpoken);
      u2.lang = "en-US"; u2.rate = 0.85;
      window.speechSynthesis.speak(u2);
    }catch(e){}
  });

  applyLang();
})();
</script>
</body>
</html>
