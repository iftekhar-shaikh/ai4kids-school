<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robot dost | AI4Kids Grade 1 AI</title>
<style>:root{--ink:#1e2a33;--muted:#56636c;--paper:#fffdf7;--line:#ded5c4;--blue:#176b87;--blue2:#e6f3f6;--orange:#e07a32;--green:#2e7d4f;--red:#c4453a;--yellow:#fff0bd;--purple:#7652a5;--teal:#0d8a7c;--pink:#d45b8c;--sky:#7ec8e3;--sand:#f4e4bc;--fs-cap:clamp(0.9rem, 2.4vw, 1.1rem);--fs-xs:clamp(1.1rem, 2.8vw, 1.3rem);--fs-sm:clamp(1.25rem, 3.2vw, 1.5rem);--fs-md:clamp(1.4rem, 3.6vw, 1.75rem);--fs-lg:clamp(1.7rem, 4.2vw, 2.15rem);--fs-xl:clamp(2.05rem, 5.2vw, 2.7rem);--pad:clamp(12px,3.5vw,20px);--gap:clamp(8px,2.5vw,12px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;max-width:100%;overflow-x:hidden}
body{margin:0;padding:0 0 48px;background:var(--paper);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:var(--fs-sm);line-height:1.5;max-width:100%;overflow-x:hidden;width:100%}
.wrap{width:100%;max-width:min(980px,100%);margin:auto;padding:0 var(--pad);box-sizing:border-box}
.bar{display:flex;align-items:center;gap:var(--gap);flex-wrap:wrap;padding:14px 0 6px;width:100%}
.brand{font-weight:900;color:var(--blue);margin-right:auto;font-size:var(--fs-cap);min-width:0;flex:1 1 auto}
button{font:inherit;color:inherit;cursor:pointer;max-width:100%}
.chip,.tab{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:8px 15px;min-height:44px;font-weight:900}
.chip[aria-pressed=true],.tab[aria-pressed=true]{background:var(--ink);color:#fff}
.chip:focus-visible,.tab:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
h1{font-size:var(--fs-xl);line-height:1.15;margin:10px 0 5px;word-wrap:break-word;overflow-wrap:anywhere}
.sub{color:var(--muted);margin:0 0 16px;font-size:var(--fs-sm)}
.tabs{display:flex;gap:var(--gap);flex-wrap:wrap;margin-bottom:16px;width:100%}
.tab{flex:1 1 calc(33.33% - 8px);border-radius:14px;min-height:48px;font-size:var(--fs-cap);min-width:0}
.hero{border:3px solid var(--ink);border-radius:clamp(14px,3vw,22px);overflow:hidden;background:linear-gradient(160deg,#d9f0fa 0%,#fff6df 55%,#e8f7e9 100%);margin-bottom:16px;box-shadow:0 6px 0 #c9d5c0;width:100%;max-width:100%}
.hero svg,.scene svg,.card .ico svg{display:block;width:100%;height:auto;max-width:100%}
.hero svg{max-height:50vh}
.demo-wrap{border:3px solid var(--ink);border-radius:clamp(14px,3vw,22px);background:linear-gradient(140deg,#e9f4fa,#f9efdb);padding:var(--pad);margin-bottom:20px;box-shadow:0 5px 0 #cfd8c8;width:100%;max-width:100%}
.demo-head{display:flex;gap:var(--gap);align-items:center;flex-wrap:wrap;width:100%}
.demo-head h2{font-size:var(--fs-lg);margin:0;flex:1 1 auto;min-width:0}
.demo-instruction{color:var(--muted);margin:5px 0 12px}
.demo-stage{background:#fffefb;border:2px solid var(--line);border-radius:17px;padding:clamp(10px,2.5vw,14px);width:100%;max-width:100%;overflow:hidden}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);width:100%}
.card{border:3px solid var(--line);background:#fff;border-radius:16px;min-height:96px;padding:12px 8px;text-align:center;font-weight:900;font-size:var(--fs-xs);transition:transform .12s ease,border-color .12s;width:100%;max-width:100%}
.card:active{transform:scale(.97)}
.card.selected{border-color:var(--blue);background:var(--blue2);box-shadow:0 0 0 3px rgba(23,107,135,.2)}
.card .ico{display:block;width:min(56px,18vw);height:auto;aspect-ratio:1;margin:0 auto 6px}
.play{background:var(--green);border:3px solid #236b45;color:#fff;border-radius:15px;padding:12px 18px;min-height:54px;font-weight:900;font-size:var(--fs-md);width:100%;margin-top:12px}
.play:active{transform:scale(.98)}
.demo-msg{border-radius:13px;background:var(--yellow);padding:12px 14px;margin-top:12px;font-weight:800;font-size:var(--fs-sm);border:2px solid #e6d48a;min-height:52px;word-wrap:break-word}
.lesson-grid{display:grid;gap:13px;grid-template-columns:1fr;width:100%}
.lesson{border:3px solid var(--line);border-radius:18px;background:#fff;padding:clamp(12px,3vw,18px);scroll-margin-top:10px;width:100%;max-width:100%}
.lesson .tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:4px 13px;font-size:var(--fs-cap);font-weight:900;margin-bottom:9px}
.lesson.hook .tag{background:var(--orange)}
.lesson.misaal .tag{background:var(--green)}
.lesson.karo .tag{background:var(--purple)}
.lesson p{margin:0;font-size:var(--fs-sm);overflow-wrap:anywhere}
.quiz{border-top:3px solid var(--ink);margin-top:30px;padding-top:20px;width:100%}
.quiz h2{font-size:var(--fs-lg);margin:0 0 17px}
.q{margin-bottom:26px}
.q-title{font-weight:900;margin:0 0 11px;font-size:var(--fs-md);overflow-wrap:anywhere}
.opt{display:block;width:100%;max-width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;margin:8px 0;min-height:55px;font-size:var(--fs-sm);overflow-wrap:anywhere}
.opt.right{border-color:var(--green);background:#e5f3eb;font-weight:900}
.opt.wrong{border-color:var(--red);background:#fae5e1}
.feedback{display:none;color:var(--muted);margin:7px 0;font-size:var(--fs-cap)}
.feedback.show{display:block}
.score{display:none;text-align:center;border:3px solid var(--green);background:#e5f3eb;border-radius:15px;padding:13px;font-size:var(--fs-md);font-weight:900;width:100%}
.score.show{display:block}
footer{margin-top:31px;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:var(--fs-cap)}
@media(max-width:480px){
  .chip,.tab,.play,.opt,.card{width:100%}
  .tabs{flex-direction:column}
  .tab{flex:1 1 auto;width:100%}
  .bar .chip{flex:1 1 auto;min-width:calc(50% - 6px);text-align:center}
  .demo-head{flex-direction:column;align-items:stretch}
  .demo-head .chip{width:100%}
  .cards{grid-template-columns:1fr 1fr}
  .cards.c5{grid-template-columns:1fr 1fr}
  .play{width:100%!important;min-width:0!important}
}
@media(min-width:760px){
  .lesson-grid{grid-template-columns:1fr 1fr}
  .demo-wrap{padding:20px}
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cards.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cards.c5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .play{width:auto;min-width:200px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1rem, 2.6vw, 1.2rem);
  --fs-xs: clamp(1.2rem, 3.2vw, 1.45rem);
  --fs-sm: clamp(1.35rem, 3.6vw, 1.65rem);
  --fs-md: clamp(1.55rem, 4.2vw, 1.9rem);
  --fs-lg: clamp(1.85rem, 5vw, 2.4rem);
  --fs-xl: clamp(2.25rem, 6vw, 3rem);
}
/* /AI4KIDS_FS_SCALE */
</style>
</head>

<script>
const DATA={"title":{"en":"Robot dost","ru":"Robot dost"},"desc":{"en":"Robots can help people","ru":"Robots logon ki madad kar sakte hain"},"lesson":{"hook":{"en":"Imagine a little robot friend. What helpful job could it do?","ru":"Ek chhotay robot dost ka socho. Woh kaun sa madadgar kaam kar sakta hai?"},"samjhao":{"en":"A robot is a machine that can do a job. It may move, carry, clean, or help a doctor. It follows instructions; it is not a person or animal.","ru":"Robot ek machine hai jo kaam karti hai. Woh chal, cheezen utha, safai ya doctor ki madad kar sakta hai. Robot hidayat follow karta hai."},"misaal":{"en":"A floor-cleaning robot can move around a room. A school robot may show a lesson.","ru":"Farsh saaf karne wala robot kamray mein chal sakta hai. School robot lesson dikha sakta hai."},"karo":{"en":"Make a paper robot. Give it a name and draw one job it can do.","ru":"Kaghaz ka robot banao. Us ka naam rakho aur ek kaam draw karo."}},"demo":{"type":"cards","title":{"en":"Choose a robot job","ru":"Robot ka kaam chuno"},"instruction":{"en":"Choose a job, then press Robot, go!","ru":"Kaam chuno, phir Robot, go! dabao."},"items":[{"icon":"clean","name":{"en":"Clean","ru":"Safai"},"msg":{"en":"Beep! I cleaned the floor.","ru":"Beep! Main ne farsh saaf kar diya."},"kind":"play"},{"icon":"books","name":{"en":"Carry books","ru":"Kitaaben uthana"},"msg":{"en":"I carried the books to the shelf.","ru":"Main kitaaben shelf tak le gaya."},"kind":"play"},{"icon":"story","name":{"en":"Read a story","ru":"Kahani parhna"},"msg":{"en":"Once upon a time… let us read!","ru":"Ek dafa ka zikr hai… chalo parhte hain!"},"kind":"play"}]},"quiz":[{"q":{"en":"What is a robot?","ru":"Robot kya hota hai?"},"options":[{"en":"A machine that does a job","ru":"Ek machine jo kaam karti hai"},{"en":"An animal","ru":"Ek animal"},{"en":"A person","ru":"Ek insaan"},{"en":"A toy","ru":"Ek khilona"}],"correct":0,"explanation":{"en":"A robot is a machine that can help.","ru":"Robot ek machine hota hai jo humari madad karta hai."}},{"q":{"en":"Robots that work by themselves are part of what?","ru":"Khudkar kuch kaam karne wale robots kis cheez ka hissa hain?"},"options":[{"en":"AI and technology","ru":"AI aur technology"},{"en":"Toys","ru":"Khilone"},{"en":"Food","ru":"Ghar ke samaan"},{"en":"School bags","ru":"Khaana"}],"correct":0,"explanation":{"en":"AI and technology can help robots work.","ru":"AI aur technology robots ko khud kaam karne ke laayak banate hain."}},{"q":{"en":"What can a robot friend help with?","ru":"Robot dost kis kaam mein humari madad karte hain?"},"options":[{"en":"Housework","ru":"Ghar ka kaam"},{"en":"Study","ru":"Padhai"},{"en":"Play","ru":"Khelna"},{"en":"All of these","ru":"Sab kuch"}],"correct":3,"explanation":{"en":"Robots can help with many jobs.","ru":"Robots har tarah ke kaamon mein madad kar sakte hain."}},{"q":{"en":"Which robot name is in the brief?","ru":"Pakistan mein kaun sa robot kisam ka mashhoor hai?"},"options":[{"en":"Bolo Robot","ru":"Bolo Robot"},{"en":"Dolly the sheep","ru":"Dolly the sheep"},{"en":"Mango Robot","ru":"Mango Robot"},{"en":"Kaptaan Robot","ru":"Kaptaan Robot"}],"correct":0,"explanation":{"en":"The brief names Bolo Robot.","ru":"Bolo Robot Pakistan mein mashhoor hai jo bachon se baatcheet kar sakta hai."}},{"q":{"en":"What is one big benefit of a robot?","ru":"Robot ka sabse bada faida kya hai?"},"options":[{"en":"Working quickly","ru":"Sehat barqarar rakhna"},{"en":"Staying alive","ru":"Kaam ki tezi"},{"en":"Travelling only","ru":"Zinda rehna"},{"en":"Eating food","ru":"Safar karna"}],"correct":1,"explanation":{"en":"A robot can do some jobs quickly.","ru":"Robot ka kaam karne ki tezi insaan ki madad karti hai."}}],"subject":{"en":"AI4Kids · Grade 1 · AI & Technology","ru":"AI4Kids · Jamaat 1 · AI aur Technology"},"grade_label":"AI4Kids Grade 1 AI"};
const ICONS={"books":"<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\"><rect x=\"12\" y=\"16\" width=\"16\" height=\"36\" rx=\"2\" fill=\"#e07a32\" stroke=\"#1e2a33\" stroke-width=\"2\"/><rect x=\"28\" y=\"12\" width=\"16\" height=\"40\" rx=\"2\" fill=\"#176b87\" stroke=\"#1e2a33\" stroke-width=\"2\"/><rect x=\"44\" y=\"18\" width=\"12\" height=\"34\" rx=\"2\" fill=\"#2e7d4f\" stroke=\"#1e2a33\" stroke-width=\"2\"/></svg>","clean":"<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\"><ellipse cx=\"32\" cy=\"44\" rx=\"18\" ry=\"8\" fill=\"#b8e0d2\" stroke=\"#1e2a33\" stroke-width=\"2\"/><rect x=\"20\" y=\"22\" width=\"24\" height=\"18\" rx=\"6\" fill=\"#7ec8e3\" stroke=\"#1e2a33\" stroke-width=\"2\"/><circle cx=\"26\" cy=\"30\" r=\"3\" fill=\"#fff\"/><circle cx=\"38\" cy=\"30\" r=\"3\" fill=\"#fff\"/><path d=\"M18 48h28\" stroke=\"#2e7d4f\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>","robot":"<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\"><rect x=\"14\" y=\"18\" width=\"36\" height=\"32\" rx=\"8\" fill=\"#7ec8e3\" stroke=\"#1e2a33\" stroke-width=\"2.5\"/><circle cx=\"26\" cy=\"32\" r=\"5\" fill=\"#fff\"/><circle cx=\"38\" cy=\"32\" r=\"5\" fill=\"#fff\"/><circle cx=\"26\" cy=\"32\" r=\"2.5\" fill=\"#176b87\"/><circle cx=\"38\" cy=\"32\" r=\"2.5\" fill=\"#176b87\"/><rect x=\"24\" y=\"42\" width=\"16\" height=\"4\" rx=\"2\" fill=\"#e07a32\"/><rect x=\"28\" y=\"8\" width=\"8\" height=\"10\" rx=\"2\" fill=\"#7652a5\"/><circle cx=\"32\" cy=\"7\" r=\"3\" fill=\"#e07a32\"/></svg>","story":"<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\"><path d=\"M12 14h18c4 0 6 3 6 6v30c0-4-2-6-6-6H12V14z\" fill=\"#fff0bd\" stroke=\"#1e2a33\" stroke-width=\"2\"/><path d=\"M52 14H34c-4 0-6 3-6 6v30c0-4 2-6 6-6h18V14z\" fill=\"#e6f3f6\" stroke=\"#1e2a33\" stroke-width=\"2\"/></svg>"};
(function(){'use strict';
var lang='en',selected=0,played=false,checked=false;
var D=DATA;
function $(id){return document.getElementById(id)}
function t(x){return x&&typeof x==='object'?(x[lang]||x.en||''):String(x||'')}
function put(el,x){if(el)el.textContent=t(x)}
var labels={play:{en:'Play',ru:'Khelo'},hook:{en:'HOOK',ru:'HOOK'},samjhao:{en:'SAMJHAO',ru:'SAMJHAO'},misaal:{en:'MISAAL',ru:'MISAAL'},karo:{en:'KARO',ru:'KARO'}};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(){
  document.title=t(D.title)+' | '+D.grade_label;
  put($('brand'),D.subject);
  put($('title'),D.title);
  put($('subtitle'),D.desc);
  $('langBtn').textContent=lang==='en'?'Roman Urdu':'English';
  $('langBtn').setAttribute('aria-pressed',lang==='ru'?'true':'false');
  ['hook','samjhao','misaal','karo'].forEach(function(k){put($(k+'Tag'),labels[k]);put($(k+'Text'),D.lesson[k])});
  put($('demoTitle'),D.demo.title);
  put($('demoInstruction'),D.demo.instruction);
  put($('quizHead'),{en:'Quiz — 5 questions',ru:'Quiz — 5 sawaal'});
  put($('foot'),{en:'AI4Kids · Offline lesson · No account needed',ru:'AI4Kids · Offline sabaq · Account ki zaroorat nahi'});
  put($('launch'),labels.play);
  var tabs=$('tabs');tabs.innerHTML='';
  ['play','hook','samjhao','misaal','karo'].forEach(function(k){
    var b=document.createElement('button');b.className='tab';b.type='button';b.textContent=t(labels[k]);
    b.setAttribute('aria-pressed','false');
    b.onclick=function(){($(k==='play'?'demo':k)).scrollIntoView({behavior:'smooth'})};
    tabs.appendChild(b);
  });
  demo();quiz();
}
function demo(){
  var s=$('demoStage');s.innerHTML='';
  var items=D.demo.items||[];
  var n=items.length;
  var row=document.createElement('div');
  row.className='cards'+(n===4?' c4':n===5?' c5':'');
  items.forEach(function(it,i){
    var b=document.createElement('button');b.type='button';
    b.className='card'+(selected===i?' selected':'');
    b.innerHTML='<span class="ico">'+(ICONS[it.icon]||ICONS.robot)+'</span>'+esc(t(it.name));
    b.onclick=function(){selected=i;played=false;checked=false;demo()};
    row.appendChild(b);
  });
  s.appendChild(row);
  var b=document.createElement('button');b.type='button';b.className='play';
  var isSort=D.demo.type==='sort';
  b.textContent=isSort?(lang==='en'?'✅ Check machine':'✅ Machine check karo'):(lang==='en'?'▶ Play':'▶ Chalao');
  b.onclick=function(){if(isSort)checked=true;else played=true;demo()};
  s.appendChild(b);
  var m=document.createElement('div');m.className='demo-msg';
  var it=items[selected]||{msg:{en:'',ru:''}};
  if(isSort){
    m.textContent=checked?t(it.msg):t({en:'Choose a machine, then check it.',ru:'Machine chuno, phir check karo.'});
  }else if(it.kind==='info'){
    m.textContent=t(it.msg);
  }else{
    m.textContent=played?t(it.msg):t({en:'Choose a card, then press Play.',ru:'Card chuno, phir Play dabao.'});
  }
  s.appendChild(m);
  var accent=$('heroAccent');
  if(accent){accent.setAttribute('fill',['#7ec8e3','#e07a32','#7652a5','#2e7d4f','#d45b8c'][selected%5]);}
}
function quiz(){
  var box=$('quizBox');box.innerHTML='';$('score').className='score';
  var done=0,score=0;
  (D.quiz||[]).forEach(function(q,qi){
    var w=document.createElement('div');w.className='q';
    var p=document.createElement('p');p.className='q-title';p.textContent=(qi+1)+'. '+t(q.q);w.appendChild(p);
    var f=document.createElement('p');f.className='feedback';
    q.options.forEach(function(o,i){
      var b=document.createElement('button');b.type='button';b.className='opt';
      b.textContent=String.fromCharCode(65+i)+'. '+t(o);
      b.onclick=function(){
        if(w.dataset.done)return;w.dataset.done='1';done++;
        var ok=i===q.correct;if(ok)score++;
        w.querySelectorAll('button').forEach(function(x,j){
          x.disabled=true;
          if(j===q.correct)x.classList.add('right');
          else if(j===i)x.classList.add('wrong');
        });
        f.textContent=(ok?'✓ ':'✗ ')+t(q.explanation);f.className='feedback show';
        if(done===5){$('score').textContent=t({en:'Your score: '+score+' / 5',ru:'Tumhara score: '+score+' / 5'});$('score').className='score show'}
      };
      w.appendChild(b);
    });
    w.appendChild(f);box.appendChild(w);
  });
}
$('langBtn').onclick=function(){lang=lang==='en'?'ru':'en';selected=0;played=false;checked=false;render()};
$('speakBtn').onclick=function(){
  if('speechSynthesis'in window){
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t(D.title)+'. '+t(D.desc)+'. '+t(D.lesson.hook));
    u.lang=lang==='ru'?'en-PK':'en-US';u.rate=.92;speechSynthesis.speak(u);
  }
};
$('launch').onclick=function(){$('demo').scrollIntoView({behavior:'smooth'});demo()};
render();
})();
</script>
</body>
