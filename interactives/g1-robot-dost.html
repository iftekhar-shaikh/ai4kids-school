<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Robot dost | AI4Kids Grade 1 AI</title><style>:root{--ink:#202b36;--muted:#526170;--paper:#fffdf7;--line:#d8d1c3;--blue:#216a9b;--blue2:#dcecf6;--orange:#d4752c;--green:#2e8657;--red:#bb4b45;--yellow:#fff0bd;--purple:#765297;--fs-cap:clamp(.9rem,2.4vw,1.08rem);--fs-xs:clamp(1.05rem,2.8vw,1.25rem);--fs-sm:clamp(1.18rem,3.15vw,1.45rem);--fs-md:clamp(1.32rem,3.55vw,1.7rem);--fs-lg:clamp(1.62rem,4.3vw,2.15rem);--fs-xl:clamp(2rem,5.5vw,2.75rem)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--fs-sm);line-height:1.52;padding:0 0 48px}.wrap{max-width:1080px;margin:auto;padding:0 16px}.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:15px 0 7px}.brand{font-weight:850;color:var(--blue);margin-right:auto;font-size:var(--fs-xs)}button{font:inherit;color:inherit}.chip,.tab{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:8px 15px;cursor:pointer;font-weight:800;min-height:44px}.chip[aria-pressed=true],.tab[aria-pressed=true]{background:var(--ink);color:#fff}.chip:focus-visible,.tab:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}h1{font-size:var(--fs-xl);line-height:1.2;margin:10px 0 3px}.sub{color:var(--muted);margin:0 0 14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{border-radius:14px;flex:1 1 16%;font-size:var(--fs-cap);min-height:52px}.demo-wrap{border:3px solid var(--ink);border-radius:22px;background:linear-gradient(140deg,#e9f4fa,#f9efdb);padding:16px;margin-bottom:19px}.demo-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.demo-head h2{font-size:var(--fs-lg);margin:0;flex:1}.demo-instruction{margin:5px 0 12px;color:var(--muted)}.demo-stage{background:#fffefb;border:2px solid var(--line);border-radius:17px;padding:13px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:3px solid var(--line);background:#fff;border-radius:15px;min-height:100px;padding:11px 8px;cursor:pointer;text-align:center;font-weight:800}.card.selected{border-color:var(--blue);background:var(--blue2)}.emoji{display:block;font-size:2.25rem;line-height:1.1;margin-bottom:5px}.play{background:var(--green);border:3px solid #236b45;color:#fff;border-radius:16px;padding:11px 18px;min-height:54px;cursor:pointer;font-weight:850;font-size:var(--fs-md);width:100%;margin-top:13px}.demo-msg{border-radius:13px;background:var(--yellow);padding:10px 13px;margin:11px 0 0;font-weight:750}.lesson-grid{display:grid;gap:13px}.lesson{border:3px solid var(--line);border-radius:18px;background:#fff;padding:15px 17px;scroll-margin-top:12px}.tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:3px 13px;font-size:var(--fs-cap);font-weight:900;margin-bottom:9px}.hook .tag{background:var(--orange)}.misaal .tag{background:var(--green)}.karo .tag{background:var(--purple)}.lesson p{margin:0;font-size:var(--fs-sm)}.quiz{border-top:3px solid var(--ink);margin-top:29px;padding-top:20px}.quiz h2{font-size:var(--fs-lg);margin:0 0 17px}.q{margin-bottom:25px}.q-title{font-size:var(--fs-md);font-weight:800;margin:0 0 10px}.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;margin:8px 0;cursor:pointer;min-height:52px;font-size:var(--fs-sm)}.opt.right{border-color:var(--green);background:#e5f3eb;font-weight:800}.opt.wrong{border-color:var(--red);background:#fae5e1}.opt:disabled{cursor:default}.feedback{display:none;color:var(--muted);font-size:var(--fs-xs);margin:7px 0}.feedback.show{display:block}.score{display:none;text-align:center;border:3px solid var(--green);background:#e5f3eb;border-radius:15px;padding:12px;font-size:var(--fs-md);font-weight:900}.score.show{display:block}footer{margin-top:31px;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:var(--fs-cap)}@media(min-width:760px){.lesson-grid{grid-template-columns:1fr 1fr}.demo-wrap{padding:20px}.cards{grid-template-columns:repeat(3,1fr)}.play{width:auto;min-width:190px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><div class="wrap"><div class="bar"><span class="brand" id="brand"></span><button class="chip" id="langBtn" type="button" aria-pressed="false">Roman Urdu</button><button class="chip" id="speakBtn" type="button">🔊</button></div><header><h1 id="title"></h1><p class="sub" id="subtitle"></p></header><nav class="tabs" id="tabs"></nav><section class="demo-wrap" id="demo"><div class="demo-head"><h2 id="demoTitle"></h2><button class="chip" id="launch" type="button">Play</button></div><p class="demo-instruction" id="demoInstruction"></p><div class="demo-stage" id="demoStage"></div></section><main class="lesson-grid"><article class="lesson hook" id="hook"><span class="tag" id="hookTag"></span><p id="hookText"></p></article><article class="lesson" id="samjhao"><span class="tag" id="samjhaoTag"></span><p id="samjhaoText"></p></article><article class="lesson misaal" id="misaal"><span class="tag" id="misaalTag"></span><p id="misaalText"></p></article><article class="lesson karo" id="karo"><span class="tag" id="karoTag"></span><p id="karoText"></p></article></main><section class="quiz"><h2 id="quizHead"></h2><div id="quizBox"></div><div class="score" id="score"></div></section><footer id="foot"></footer></div><script>const DATA={"title":{"en":"Robot dost","ru":"Robot dost"},"desc":{"en":"Robots can help people","ru":"Robots logon ki madad kar sakte hain"},"lesson":{"hook":{"en":"Imagine a little robot friend. What helpful job could it do?","ru":"Ek chhotay robot dost ka socho. Woh kaun sa madadgar kaam kar sakta hai?"},"samjhao":{"en":"A robot is a machine that can do a job. It may move, carry, clean, or help a doctor. It follows instructions; it is not a person or animal.","ru":"Robot ek machine hai jo kaam karti hai. Woh chal, cheezen utha, safai ya doctor ki madad kar sakta hai. Robot hidayat follow karta hai."},"misaal":{"en":"A floor-cleaning robot can move around a room. A school robot may show a lesson.","ru":"Farsh saaf karne wala robot kamray mein chal sakta hai. School robot lesson dikha sakta hai."},"karo":{"en":"Make a paper robot. Give it a name and draw one job it can do.","ru":"Kaghaz ka robot banao. Us ka naam rakho aur ek kaam draw karo."}},"demo":{"type":"cards","title":{"en":"Choose a robot job","ru":"Robot ka kaam chuno"},"instruction":{"en":"Choose a job, then press Robot, go!","ru":"Kaam chuno, phir Robot, go! dabao."},"items":[["🧹","Clean","Safai","Beep! I cleaned the floor.","Beep! Main ne farsh saaf kar diya."],["📚","Carry books","Kitaaben uthana","I carried the books to the shelf.","Main kitaaben shelf tak le gaya."],["📖","Read a story","Kahani parhna","Once upon a time… let us read!","Ek dafa ka zikr hai… chalo parhte hain!"]]},"quiz":[{"q":{"en":"What is a robot?","ru":"Robot kya hota hai?"},"options":[{"en":"A machine that does a job","ru":"Ek machine jo kaam karti hai"},{"en":"An animal","ru":"Ek animal"},{"en":"A person","ru":"Ek insaan"},{"en":"A toy","ru":"Ek khilona"}],"correct":0,"explanation":{"en":"A robot is a machine that can help.","ru":"Robot ek machine hota hai jo humari madad karta hai."}},{"q":{"en":"Robots that work by themselves are part of what?","ru":"Khudkar kuch kaam karne wale robots kis cheez ka hissa hain?"},"options":[{"en":"AI and technology","ru":"AI aur technology"},{"en":"Toys","ru":"Khilone"},{"en":"Food","ru":"Ghar ke samaan"},{"en":"School bags","ru":"Khaana"}],"correct":0,"explanation":{"en":"AI and technology can help robots work.","ru":"AI aur technology robots ko khud kaam karne ke laayak banate hain."}},{"q":{"en":"What can a robot friend help with?","ru":"Robot dost kis kaam mein humari madad karte hain?"},"options":[{"en":"Housework","ru":"Ghar ka kaam"},{"en":"Study","ru":"Padhai"},{"en":"Play","ru":"Khelna"},{"en":"All of these","ru":"Sab kuch"}],"correct":3,"explanation":{"en":"Robots can help with many jobs.","ru":"Robots har tarah ke kaamon mein madad kar sakte hain."}},{"q":{"en":"Which robot name is in the brief?","ru":"Pakistan mein kaun sa robot kisam ka mashhoor hai?"},"options":[{"en":"Bolo Robot","ru":"Bolo Robot"},{"en":"Dolly the sheep","ru":"Dolly the sheep"},{"en":"Mango Robot","ru":"Mango Robot"},{"en":"Kaptaan Robot","ru":"Kaptaan Robot"}],"correct":0,"explanation":{"en":"The brief names Bolo Robot.","ru":"Bolo Robot Pakistan mein mashhoor hai jo bachon se baatcheet kar sakta hai."}},{"q":{"en":"What is one big benefit of a robot?","ru":"Robot ka sabse bada faida kya hai?"},"options":[{"en":"Working quickly","ru":"Sehat barqarar rakhna"},{"en":"Staying alive","ru":"Kaam ki tezi"},{"en":"Travelling only","ru":"Zinda rehna"},{"en":"Eating food","ru":"Safar karna"}],"correct":1,"explanation":{"en":"A robot can do some jobs quickly.","ru":"Robot ka kaam karne ki tezi insaan ki madad karti hai."}}]};</script><script>const D=DATA;(function(){let lang='en',selected=0,played=false,checked=false;const $=id=>document.getElementById(id),t=x=>x&&typeof x==='object'?(x[lang]||x.en||''):String(x||'');function put(e,x){e.textContent=t(x)}function label(k){return {play:{en:'Play',ru:'Khelo'},hook:{en:'HOOK',ru:'HOOK'},samjhao:{en:'SAMJHAO',ru:'SAMJHAO'},misaal:{en:'MISAAL',ru:'MISAAL'},karo:{en:'KARO',ru:'KARO'}}[k]}function render(){document.title=t(D.title)+' | AI4Kids Grade 1 AI';put($('brand'),{en:'AI4Kids · Grade 1 · AI & Technology',ru:'AI4Kids · Jamaat 1 · AI aur Technology'});put($('title'),D.title);put($('subtitle'),D.desc);$('langBtn').textContent=lang==='en'?'Roman Urdu':'English';$('langBtn').setAttribute('aria-pressed',lang==='ru');['hook','samjhao','misaal','karo'].forEach(k=>{put($(k+'Tag'),label(k));put($(k+'Text'),D.lesson[k])});put($('demoTitle'),D.demo.title);put($('demoInstruction'),D.demo.instruction);put($('quizHead'),{en:'Quiz — 5 questions',ru:'Quiz — 5 sawaal'});put($('foot'),{en:'AI4Kids · Grade 1 AI & Technology · Offline lesson',ru:'AI4Kids · Jamaat 1 AI aur Technology · Offline lesson'});let tabs=$('tabs');tabs.innerHTML='';['play','hook','samjhao','misaal','karo'].forEach(k=>{let b=document.createElement('button');b.className='tab';b.textContent=t(label(k));b.setAttribute('aria-pressed',k==='play');b.onclick=()=>{($(k==='play'?'demo':k)).scrollIntoView({behavior:'smooth'})};tabs.appendChild(b)});demo();quiz()}function demo(){let s=$('demoStage');s.innerHTML='';let row=document.createElement('div');row.className='cards';D.demo.items.forEach((it,i)=>{let b=document.createElement('button');b.className='card'+(selected===i?' selected':'');let e=document.createElement('span');e.className='emoji';e.textContent=it[0];b.appendChild(e);b.appendChild(document.createTextNode(t({en:it[1],ru:it[2]})));b.onclick=()=>{selected=i;played=false;checked=false;demo()};row.appendChild(b)});s.appendChild(row);let b=document.createElement('button');b.className='play';b.textContent=D.demo.type==='sort'?(lang==='en'?'✅ Check machine':'✅ Machine check karo'):(lang==='en'?'▶ Play':'▶ Chalao');b.onclick=()=>{if(D.demo.type==='sort')checked=true;else played=true;demo()};s.appendChild(b);let m=document.createElement('div');m.className='demo-msg';let it=D.demo.items[selected];m.textContent=D.demo.type==='sort'?(checked?t(it[4]):t({en:'Choose a machine, then check it.',ru:'Machine chuno, phir check karo.'})):(played?t({en:it[3],ru:it[4]}):t({en:'Choose a card, then press Play.',ru:'Card chuno, phir Play dabao.'}));s.appendChild(m)}function quiz(){let box=$('quizBox');box.innerHTML='';let done=0,score=0;D.quiz.forEach((q,qi)=>{let w=document.createElement('div');w.className='q';let p=document.createElement('p');p.className='q-title';p.textContent=(qi+1)+'. '+t(q.q);w.appendChild(p);let f=document.createElement('p');f.className='feedback';q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+t(o);b.onclick=()=>{if(w.dataset.done)return;w.dataset.done=1;done++;let ok=i===q.correct;if(ok)score++;w.querySelectorAll('button').forEach((x,j)=>{x.disabled=true;if(j===q.correct)x.classList.add('right');else if(j===i)x.classList.add('wrong')});f.textContent=(ok?'✓ ':'✗ ')+t(q.explanation);f.className='feedback show';if(done===5){$('score').textContent=(lang==='en'?'Your score: ':'Tumhara score: ')+score+' / 5';$('score').className='score show'}};w.appendChild(b)});w.appendChild(f);box.appendChild(w)})}$('langBtn').onclick=()=>{lang=lang==='en'?'ru':'en';selected=0;played=false;checked=false;render()};$('speakBtn').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t(D.title)+' '+t(D.desc));u.lang=lang==='ru'?'en-PK':'en-US';u.rate=.9;speechSynthesis.speak(u)}};$('launch').onclick=()=>{$('demo').scrollIntoView({behavior:'smooth'});demo()};render()})();</script></body></html>
