          if(kk===item.correct) btn.classList.add("right");
          else if(kk===k) btn.classList.add("wrong");
        });
        setText(fb, t(item.explanation)); fb.classList.add("show");
        if(quizDone===QUIZ.length){
          sb.classList.add("show");
          setText(sb, t({en:"Your score",ur:"آپ کا اسکور"})+": "+quizScore+" "+t({en:"out of",ur:"میں سے"})+" "+QUIZ.length);
        }
      });
      wrap.appendChild(b);
    });
    wrap.appendChild(fb); box.appendChild(wrap);
  });
}

var num=1, den=4, mode="proper";
function renderPlay(){
  var left=$("leftPane"), right=$("rightPane");
  left.innerHTML='<div class="scene"><div class="eq-line" id="fracLbl"></div><div class="frac-vis" id="bars"></div><div class="pizza" id="pizza"></div></div><div class="readout"><span class="statechip" id="sc"></span><p class="lead" id="ld"></p><p class="detail" id="dt"></p><p class="why-note"><b id="wl"></b> <span id="wt"></span></p></div>';
  right.innerHTML='<div class="panel"><h2 id="ph"></h2><div class="chips" id="presets"></div><div class="two" style="margin-top:10px"><button class="play alt" id="nMinus">Num −</button><button class="play alt" id="nPlus">Num +</button></div><div class="two"><button class="play alt" id="dMinus">Den −</button><button class="play alt" id="dPlus">Den +</button></div><button type="button" class="play go" id="btnEq" style="margin-top:10px"></button></div>';
  if(den<2) den=2; if(den>12) den=12; if(num<0) num=0; if(num>den*2) num=den*2;
  $("fracLbl").textContent=num+" / "+den;
  var bars=$("bars"); bars.innerHTML="";
  for(var i=0;i<den;i++){
    var p=document.createElement("div"); p.className="frac-piece"+(i<num?"":" off");
    if(i<num) p.style.background = num<den ? "#60a5fa" : (num===den ? "#34d399" : "#f472b6");
    bars.appendChild(p);
  }
  // pizza wedges via conic-gradient
  var pct = Math.min(100, (num/den)*100);
  var col = num<den ? "#f97316" : (num===den ? "#22c55e" : "#ec4899");
  $("pizza").style.background = "conic-gradient("+col+" 0% "+pct+"%, #fef3c7 "+pct+"% 100%)";
  var kind = num<den ? "proper" : (num===den ? "whole" : "improper");
  var kindT = {
    proper: bi("Proper fraction", "پراپر کسر"),
    whole: bi("Whole (=1)", "مکمل (=۱)"),
    improper: bi("Improper fraction", "امپراپر کسر")
  };
  function bi(en,ur){ return {en:en,ur:ur}; }
  setText($("sc"), t(kindT[kind]));
  $("sc").className="statechip "+(kind==="proper"?"ok":"");
  setText($("ld"), num+"/"+den+" — "+t(kindT[kind]));
  setText($("dt"), t({en:"Numerator on top, denominator below. Equal pieces!",ur:"اوپر صورت، نیچے مخرج۔ برابر حصے!"}));
  setText($("wl"), t({en:"Ghaur karein:",ur:"غور کریں:"}));
  setText($("wt"), t({en:"1/2 = 2/4 — equivalent fractions look different but equal.",ur:"۱/۲ = ۲/۴ — ایکویلنٹ کسر ایک جیسی قیمت۔"}));
  lastSpoken=t($("ld"));
  setText($("ph"), t({en:"Try these fractions",ur:"یہ کسر آزماؤ"}));
  var presets=[[1,2],[1,4],[3,4],[2,4],[5,3],[3,2],[6,8],[7,5],[4,4]];
  var pr=$("presets"); pr.innerHTML="";
  presets.forEach(function(p){
    var b=document.createElement("button"); b.type="button"; b.className="schip";
    b.setAttribute("aria-pressed", num===p[0]&&den===p[1]?"true":"false");
    b.textContent=p[0]+"/"+p[1];
    b.onclick=function(){ num=p[0]; den=p[1]; renderPlay(); };
    pr.appendChild(b);
  });
  $("nMinus").onclick=function(){ num=Math.max(0,num-1); renderPlay(); };
  $("nPlus").onclick=function(){ num=Math.min(den*2,num+1); renderPlay(); };
  $("dMinus").onclick=function(){ den=Math.max(2,den-1); if(num>den*2)num=den*2; renderPlay(); };
  $("dPlus").onclick=function(){ den=Math.min(12,den+1); renderPlay(); };
  setText($("btnEq"), t({en:"Show equivalent of 1/2",ur:"۱/۲ کا ایکویلنٹ دیکھو"}));
  $("btnEq").onclick=function(){ num=2; den=4; renderPlay(); };
}


applyLang();

<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
