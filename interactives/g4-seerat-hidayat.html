    .wrap{

  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }

    p.textContent=(lang==="ur") ? isolate(text) : text;
    p.setAttribute("dir", lang==="ur"?"rtl":"ltr");
    d.appendChild(em); d.appendChild(p); parent.appendChild(d);
  }

  function render(){
    ["Seer","Src","Ilm"].forEach(function(x){
      $("tab"+x).setAttribute("aria-pressed", tab===x.toLowerCase() ? "true":"false");
    });
    setText($("tabSeer"), t(T.tabSeer));
    setText($("tabSrc"), t(T.tabSrc));
    setText($("tabIlm"), t(T.tabIlm));
    $("whyLbl").textContent=t(T.whyLbl);
    setText($("quizHead"), t(T.quiz));
    setText($("review"), t(T.review));
    var flow=$("flow"), chips=$("chips"), lesson=$("lesson");
    flow.innerHTML=""; chips.innerHTML="";
    var tag=$("tagline"); tag.className="tagline";
    var chip=$("statechip"); chip.className="statechip";

    var list, i, setI;
    if (tab==="seer"){ list=SEER; i=seerI; setI=function(v){seerI=v;}; }
    else if (tab==="src"){ list=SRC; i=srcI; setI=function(v){srcI=v;}; tag.className="tagline q"; }
    else { list=ILM; i=ilmI; setI=function(v){ilmI=v;}; tag.className="tagline i"; }
    var c=list[i];

    setText($("title"), tab==="seer" ? t(T.titleSeer) : tab==="src" ? t(T.titleSrc) : t(T.titleIlm));
    setText($("subtitle"), tab==="seer" ? t(T.subSeer) : tab==="src" ? t(T.subSrc) : t(T.subIlm));
    setText($("panelHead"), tab==="seer" ? t(T.headSeer) : tab==="src" ? t(T.headSrc) : t(T.headIlm));
    setText(tag, tab==="seer" ? t(T.seerChip) : tab==="src" ? t(T.srcChip) : t(T.ilmChip));
    setText(chip, t(c));
    setText($("name"), t(c));

    if (tab==="src"){
      setText($("event"), t(c));
      box(flow, "q", t(T.qLbl), t(c.q));
      box(flow, "h", t(T.hLbl), t(c.h));
      setText($("detail"), "");
      lesson.style.display="none";
      setText($("whyText"), t(c.w));
    } else {
      setText($("event"), t(c.e ? c.e : c.d));
      setText($("detail"), "");
      lesson.style.display=""; lesson.innerHTML="";
      var em=document.createElement("em"); em.textContent=t(T.lessonLbl);
      em.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      var b=document.createElement("b");
      b.textContent=(lang==="ur") ? isolate(t(c.l)) : t(c.l);
      b.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      if (lang==="ur") b.className="ur";
      lesson.appendChild(em); lesson.appendChild(b);
      setText($("whyText"), tab==="seer" ? t(c.w) : t(c.l));
    }

    list.forEach(function(x,j){
      var bt=document.createElement("button"); bt.type="button"; bt.className="schip";
      setText(bt, t(x));
      bt.setAttribute("aria-pressed", j===i ? "true":"false");
      bt.addEventListener("click", function(){ setI(j); render(); });
      chips.appendChild(bt);
    });
    lastSpoken=t(c);
  }

  var lastSpoken="";

  ["Seer","Src","Ilm"].forEach(function(x){
    $("tab"+x).addEventListener("click", function(){
      var m=x.toLowerCase();
      if (tab===m) return;
      tab=m; render();
    });
  });

  function buildQuiz(){
    var box2=$("quizBox"); box2.innerHTML="";
    QUIZ.forEach(function(item){
      var wrap=document.createElement("div"); wrap.className="q";
      var q=document.createElement("p"); setText(q,t(item.q)); wrap.appendChild(q);
      var fb=document.createElement("p"); fb.className="fb";
      item.o.forEach(function(opt,oi){
        var b=document.createElement("button"); b.type="button";
        b.className="opt" + (lang==="ur" ? " ur":"");
        b.setAttribute("dir", lang==="ur" ? "rtl":"ltr");
        b.textContent=t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done")==="1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x,xi){
            if (xi===item.a) x.classList.add("right");
            else if (xi===oi) x.classList.add("wrong");
          });
          setText(fb,t(item.f)); fb.classList.add("show","fb");
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb); box2.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang==="ur");
    var lb=$("langBtn");
    lb.textContent=(lang==="ur") ? "English" : "اردو";
    lb.setAttribute("aria-pressed", lang==="ur" ? "true":"false");
    Array.prototype.forEach.call(document.querySelectorAll("[data-ur]"), function(el){
      setText(el, el.getAttribute(lang==="ur" ? "data-ur":"data-en"));
    });
    buildQuiz(); render();
  }
  $("langBtn").addEventListener("click", function(){
    lang=(lang==="ur") ? "en":"ur"; applyLang();
  });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(lastSpoken);
      var __v=window.ai4kidsPickVoice&&ai4kidsPickVoice();if(__v){u.voice=__v;u.lang=((__v.lang||'').toLowerCase().indexOf('ur')===0)?'ur-PK':'hi-IN';}else{u.lang='hi-IN';}u.rate=.82;
      window.speechSynthesis.speak(u);
    }catch(e){ /* no voice available — stay quiet */ }
  });

  applyLang();
})();
</script>
<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
