  var box=$("quizBox"); box.innerHTML=""; quizScore=0; quizDone=0;
  var sb=$("scoreBox"); sb.classList.remove("show"); sb.textContent="";
  setText($("quizHead"), t({en:"Quiz — 5 sawaal", ur:"کوئز — ۵ سوال"}));
  QUIZ.forEach(function(item, qi){
    var wrap=document.createElement("div"); wrap.className="q";
    var q=document.createElement("p");
    setText(q, (qi+1)+". "+t(item.q));
    wrap.appendChild(q);
    var fb=document.createElement("p"); fb.className="fb";
    ["a","b","c","d"].forEach(function(k, oi){
      var b=document.createElement("button"); b.type="button"; b.className="opt";
      b.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      var label = String.fromCharCode(65+oi)+". "+t(item[k]);
      b.textContent = (lang==="ur") ? isolate(label) : label;
      b.addEventListener("click", function(){
        if(wrap.getAttribute("data-done")==="1") return;
        wrap.setAttribute("data-done","1"); quizDone++;
        if(item.correct===k) quizScore++;
        ["a","b","c","d"].forEach(function(kk, xi){
          var btn=wrap.querySelectorAll(".opt")[xi];
          if(kk===item.correct) btn.classList.add("right");
          else if(kk===k) btn.classList.add("wrong");
        });
        setText(fb, t(item.explanation)); fb.classList.add("show");
        if(quizDone===QUIZ.length){
          sb.classList.add("show");
          setText(sb, t({en:"Your score",ur:"آپ کا اسکور"})+": "+quizScore+" "+t({en:"out of",ur:"میں سے"})+" "+QUIZ.length);
        }
      });
      wrap.appendChild(b);
    });
    wrap.appendChild(fb); box.appendChild(wrap);
  });
}

function showLessonTab(key){
  var left=$("leftPane"), right=$("rightPane");
  left.innerHTML=""; right.innerHTML="";
  var map={hook:LESSON.hook, samjhao:LESSON.samjhao, misaal:LESSON.misaal, karo:LESSON.karo};
  var tags={hook:{en:"HOOK",ur:"ہُک"},samjhao:{en:"SAMJHAO",ur:"سمجھاؤ"},misaal:{en:"MISAAL",ur:"مثال"},karo:{en:"KARO",ur:"کرو"}};
  left.innerHTML='<div class="lesson" style="margin:0"><div class="lcard '+key+'"><span class="tag" id="ltag"></span><p id="lbody"></p></div></div>';
  setText($("ltag"), t(tags[key]));
  setText($("lbody"), t(map[key]));
  lastSpoken = t(map[key]);
  right.innerHTML='<div class="readout"><span class="statechip" id="sc"></span><p class="lead" id="ld"></p><p class="detail" id="dt"></p><p class="why-note"><b id="wl"></b> <span id="wt"></span></p></div>';
  setText($("sc"), t(tags[key]));
  setText($("ld"), t(META.title));
  setText($("dt"), t(META.sub));
  setText($("wl"), t({en:"Ghaur karein:",ur:"غور کریں:"}));
  setText($("wt"), t(META.tip));
}

function renderMain(){
  if(tab==="play"){ renderPlay(); }
  else { showLessonTab(tab); }
}

function applyLang(){
  document.body.classList.toggle("urdu", lang==="ur");
  document.documentElement.lang = (lang==="ur")?"ur":"en";
  document.documentElement.dir = (lang==="ur")?"rtl":"ltr";
  var lb=$("langBtn");
  lb.textContent = (lang==="en")?"اردو":"English";
  lb.setAttribute("aria-pressed", lang==="ur"?"true":"false");
  setText($("brand"), t({en:"AI4Kids · Grade 3 · Math", ur:"AI4Kids · جماعت ۳ · ریاضی"}));
  setText($("title"), t(META.title));
  setText($("subtitle"), t(META.sub));
  setText($("foot"), t({en:"AI4Kids Islamabad · Grade 3 Math · "+META.footEn,
    ur:"AI4Kids اسلام آباد · جماعت ۳ ریاضی · "+META.footUr}));
  buildTabs(); buildLessonCards(); buildQuiz(); renderMain();
}

$("langBtn").addEventListener("click", function(){ lang=(lang==="en")?"ur":"en"; applyLang(); });
$("speakBtn").addEventListener("click", function(){
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(lastSpoken || t(META.title));
    u.lang=(lang==="ur")?"ur-PK":"en-US"; u.rate=0.92;
    var voices=window.speechSynthesis.getVoices()||[];
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang && voices[i].lang.toLowerCase().indexOf(lang==="ur"?"ur":"en")===0){ u.voice=voices[i]; break; }
    }
    window.speechSynthesis.speak(u);
  }catch(e){}
});

/* ===== TOPIC DEMO ===== */

var A=1572, B=2435, mode="add", revealed=false;
function pad4(x){ var s=String(x); while(s.length<4) s="0"+s; return s; }
function renderPlay(){
  var left=$("leftPane"), right=$("rightPane");
  var sum=A+B, diff=A-B;
  var result = mode==="add" ? sum : diff;
  left.innerHTML='<div class="scene"><div class="digit-row" id="places"></div><div class="eq-line" id="expr"></div><div class="big-num" id="ans" style="color:var(--accent)"></div></div><div class="readout"><span class="statechip" id="sc"></span><p class="lead" id="ld"></p><p class="detail" id="dt"></p><p class="why-note"><b id="wl"></b> <span id="wt"></span></p></div>';
  right.innerHTML='<div class="panel"><h2 id="ph"></h2><div class="chips" id="modeChips"></div><div class="chips" id="pairChips" style="margin-top:8px"></div><button type="button" class="play go" id="btnShow"></button><button type="button" class="play alt" id="btnNew" style="margin-top:8px"></button></div>';
  var places=["Th","H","T","O"];
  var urPlaces=["ہزار","سینکڑا","دہائی","اکائی"];
  var prow=$("places");
  places.forEach(function(p,i){
    var d=document.createElement("div"); d.className="digit-box place";
    d.textContent=lang==="ur"?urPlaces[i]:p;
    prow.appendChild(d);
  });
  $("expr").textContent = A+" "+(mode==="add"?"+":"−")+" "+B;
  $("ans").textContent = revealed ? String(result) : "????";
  setText($("ph"), t({en:"Choose operation",ur:"آپریشن چنو"}));
  setText($("sc"), mode==="add"?t({en:"Addition",ur:"جمع"}):t({en:"Subtraction",ur:"تفریق"}));
  setText($("ld"), revealed ? (A+(mode==="add"?" + ":" − ")+B+" = "+result) : t({en:"Solve column by column",ur:"کالم بہ کالم حل کرو"}));
  setText($("dt"), t({en:"Ones → tens → hundreds → thousands. Borrow when needed!",ur:"اکائی → دہائی → سینکڑا → ہزار۔ ضرورت ہو تو ادھار لو!"}));
  setText($("wl"), t({en:"Ghaur karein:",ur:"غور کریں:"}));
  setText($("wt"), t({en:"4-digit numbers go from 1000 to 9999.",ur:"۴ ہندسوں والے نمبر ۱۰۰۰ سے ۹۹۹۹ تک ہوتے ہیں۔"}));
  lastSpoken=t($("ld"));
  var mc=$("modeChips"); mc.innerHTML="";
  [["add",{en:"Add (+)",ur:"جمع (+)"}],["sub",{en:"Subtract (−)",ur:"تفریق (−)"}]].forEach(function(x){
    var b=document.createElement("button"); b.type="button"; b.className="schip";
    b.setAttribute("aria-pressed", mode===x[0]?"true":"false");
    setText(b,t(x[1]));
    b.onclick=function(){ mode=x[0]; revealed=false; renderPlay(); };
    mc.appendChild(b);
  });
  var pairs=[[1572,2435],[3752,1230],[6245,1789],[2345,1279],[4562,1788]];
  var pc=$("pairChips"); pc.innerHTML="";
  pairs.forEach(function(p){
    var b=document.createElement("button"); b.type="button"; b.className="schip";
    b.setAttribute("aria-pressed", A===p[0]&&B===p[1]?"true":"false");
    b.textContent=p[0]+" & "+p[1];
    b.onclick=function(){ A=p[0]; B=p[1]; revealed=false; renderPlay(); };
    pc.appendChild(b);
  });
  setText($("btnShow"), revealed?t({en:"Hide answer",ur:"جواب چھپاو"}):t({en:"Show answer",ur:"جواب دیکھو"}));
  $("btnShow").onclick=function(){ revealed=!revealed; renderPlay(); };
  setText($("btnNew"), t({en:"Random pair",ur:"نیا جوڑا"}));
  $("btnNew").onclick=function(){
    A=1000+Math.floor(Math.random()*8000);
    B=1000+Math.floor(Math.random()*Math.min(8000, mode==="sub"?A-1000:8000));
    if(mode==="sub" && B>=A) B=Math.max(1000, A-1000-Math.floor(Math.random()*500));
    revealed=false; renderPlay();
  };
}


applyLang();
})();
