*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{

  font-size:var(--fs-xs);cursor:pointer;min-height:44px;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

h1{font-size:var(--fs-xl);line-height:1.25;font-weight:800;margin:8px 0 4px}

.sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
.tabs{display:flex;gap:7px;margin:0 0 14px;flex-wrap:wrap}

.play:active{transform:scale(.98)}
.play.alt{background:var(--paper);color:var(--ink)}
.play.go{background:var(--ok);border-color:var(--ok)}
.play.stop{background:var(--no);border-color:var(--no)}
.play.hidden,.hidden{display:none !important}
.two{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

<script>
(function(){
"use strict";
var lang="en", tab="main";

function $(id){ return document.getElementById(id); }
function t(o){ return (o && typeof o==="object") ? (o[lang]||o.en||"") : (o||""); }
function setText(el, s){
  if(!el) return;
  el.textContent = s;
  if(lang==="ur"){ el.setAttribute("dir","rtl"); }
  else { el.setAttribute("dir","ltr"); }
}
function buildTabs(list){
  var tabs=$("tabs"); tabs.innerHTML="";
  list.forEach(function(x){
    var b=document.createElement("button"); b.type="button";
    b.setAttribute("aria-pressed", tab===x[0]?"true":"false");
    setText(b, t(x[1]));
    b.addEventListener("click", function(){ if(tab===x[0]) return; tab=x[0]; if(typeof onTab==="function") onTab(); render(); });
    tabs.appendChild(b);
  });
}
function buildLesson(){
  var box=$("lessonBox"); if(!box) return; box.innerHTML="";
  var cards=[{cls:"hook", tag:{en:"HOOK",ur:"ہک"}, body:LESSON.hook},
   {cls:"samjhao", tag:{en:"SAMJHAO",ur:"سمجھاؤ"}, body:LESSON.samjhao},
   {cls:"misaal", tag:{en:"MISAAL",ur:"مثال"}, body:LESSON.misaal}];
  if(LESSON.karo) cards.push({cls:"karo", tag:{en:"KARO",ur:"کرو"}, body:LESSON.karo});
  cards.forEach(function(c){
    var d=document.createElement("div"); d.className="lcard "+c.cls;
    var tag=document.createElement("span"); tag.className="tag"; setText(tag,t(c.tag));
    var p=document.createElement("p"); setText(p,t(c.body));
    d.appendChild(tag); d.appendChild(p); box.appendChild(d);
  });
}
var quizScore=0, quizDone=0;
function buildQuiz(){
  var box=$("quizBox"); box.innerHTML=""; quizScore=0; quizDone=0;
  var sb=$("scoreBox"); sb.classList.remove("show"); sb.textContent="";
  setText($("quizHead"), t({en:"Check yourself", ur:"اپنا امتحان لیں"}));
  QUIZ.forEach(function(item){
    var wrap=document.createElement("div"); wrap.className="q";
    var q=document.createElement("p"); setText(q, t(item.q)); wrap.appendChild(q);
    var fb=document.createElement("p"); fb.className="fb";
    ["a","b","c","d"].forEach(function(k, oi){
      var b=document.createElement("button"); b.type="button"; b.className="opt";
      b.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      b.textContent = String.fromCharCode(65+oi)+". "+t(item[k]);
      b.addEventListener("click", function(){
        if(wrap.getAttribute("data-done")==="1") return;
        wrap.setAttribute("data-done","1"); quizDone++;
        if(item.correct===k) quizScore++;
        ["a","b","c","d"].forEach(function(kk, xi){
          var btn=wrap.querySelectorAll(".opt")[xi];
          if(kk===item.correct) btn.classList.add("right");
          else if(kk===k) btn.classList.add("wrong");
        });
        setText(fb, t(item.explanation)); fb.classList.add("show");
        if(quizDone===QUIZ.length){
          sb.classList.add("show");
          setText(sb, t({en:"Score: "+quizScore+" / "+QUIZ.length, ur:"سکور: "+quizScore+" / "+QUIZ.length}));
        }
      });
      wrap.appendChild(b);
    });
    wrap.appendChild(fb); box.appendChild(wrap);
  });
}
function applyLang(){
  document.body.classList.toggle("urdu", lang==="ur");
  document.documentElement.lang = (lang==="ur") ? "ur" : "en";
  var lb=$("langBtn");
  lb.textContent = (lang==="en") ? "اردو" : "English";
  lb.setAttribute("aria-pressed", lang==="ur" ? "true":"false");
  setText($("foot"), t({en:"AI4Kids — Islamabad's bilingual AI and coding school. WhatsApp 0337 1468899",
    ur:"اے آئی فور کڈز — اسلام آباد کا دو زبانوں والا اے آئی اور کوڈنگ سکول۔ واٹس ایپ 0337 1468899"}));
  buildLesson(); buildQuiz(); render();
}
$("langBtn").addEventListener("click", function(){ lang=(lang==="en")?"ur":"en"; applyLang(); });
$("speakBtn").addEventListener("click", function(){
  try{
    if(!("speechSynthesis" in window)) return;

function armPoints(){
  var bx=80, by=200;
  var a1=(base-90)*Math.PI/180;
  var a2=a1+(elbow-90)*Math.PI/180;
  var l1=70, l2=60;
  var e1x=bx+Math.cos(a1)*l1, e1y=by+Math.sin(a1)*l1;
  var e2x=e1x+Math.cos(a2)*l2, e2y=e1y+Math.sin(a2)*l2;
  var gOpen=4+(100-grip)/100*18;
  return {bx:bx,by:by,e1x:e1x,e1y:e1y,e2x:e2x,e2y:e2y,gOpen:gOpen,a2:a2};
}
function drawArm(){
  var svg=$("svg"); svg.innerHTML="";
  svg.appendChild(mk("rect",{x:0,y:0,width:320,height:240,fill:"#e8eef2"}));
  svg.appendChild(mk("rect",{x:0,y:200,width:320,height:40,fill:"#94a3b8"}));
  var p=armPoints();
  // base
  svg.appendChild(mk("rect",{x:p.bx-24,y:p.by-8,width:48,height:16,rx:4,fill:"#334155"}));
  svg.appendChild(mk("line",{x1:p.bx,y1:p.by,x2:p.e1x,y2:p.e1y,stroke:"#1d4c85","stroke-width":14,"stroke-linecap":"round"}));
  svg.appendChild(mk("circle",{cx:p.e1x,cy:p.e1y,r:8,fill:"#f59e0b"}));
  svg.appendChild(mk("line",{x1:p.e1x,y1:p.e1y,x2:p.e2x,y2:p.e2y,stroke:"#2563eb","stroke-width":12,"stroke-linecap":"round"}));
  // gripper
  var gx=p.e2x, gy=p.e2y;
  var ca=Math.cos(p.a2), sa=Math.sin(p.a2);
  var px=-sa*p.gOpen, py=ca*p.gOpen;
  svg.appendChild(mk("line",{x1:gx+px,y1:gy+py,x2:gx+ca*16+px,y2:gy+sa*16+py,stroke:"#1f2933","stroke-width":5,"stroke-linecap":"round"}));
  svg.appendChild(mk("line",{x1:gx-px,y1:gy-py,x2:gx+ca*16-px,y2:gy+sa*16-py,stroke:"#1f2933","stroke-width":5,"stroke-linecap":"round"}));
  // object
  if(obj.grabbed){
    obj.x=gx+ca*10; obj.y=gy+sa*10;
  }
  svg.appendChild(mk("rect",{x:obj.x-12,y:obj.y-12,width:24,height:24,rx:4,fill:won?"#22c55e":"#c9702e",stroke:"#1f2933","stroke-width":2}));
  // drop zone
  svg.appendChild(mk("rect",{x:250,y:175,width:50,height:25,rx:4,fill:"none",stroke:"#2e7d4f","stroke-width":3,"stroke-dasharray":"6 4"}));
  var lab=mk("text",{x:275,y:168,"text-anchor":"middle","font-size":"11","font-weight":"800",fill:"#2e7d4f"});
  lab.textContent="GOAL"; svg.appendChild(lab);
}
function tryGrab(){
  var p=armPoints();
  var dx=p.e2x-obj.x, dy=p.e2y-obj.y;
  var near=Math.sqrt(dx*dx+dy*dy)<28;
  if(near && grip>55){ obj.grabbed=true; holding=true; }
  if(obj.grabbed && grip<35){ obj.grabbed=false; holding=false; }
  // win check
  if(obj.grabbed===false && obj.x>250 && obj.x<300 && obj.y>170 && obj.y<210){ won=true; }
}
function slider(parent,label,val,setFn){
  var row=document.createElement("div"); row.className="row";
  var nm=document.createElement("span"); nm.className="name"; setText(nm, label+" "+val);
  var rng=document.createElement("input"); rng.type="range"; rng.min=0; rng.max=100; rng.value=val;
  rng.oninput=function(){ setFn(+rng.value); setText(nm, label+" "+rng.value); drawArm(); tryGrab(); drawArm();
    if(won){ setText($("lead"), t({en:"Well done! Object in the goal!",ur:"شاباش! چیز منزل پر!"})); $("statechip").className="statechip ok"; setText($("statechip"), t({en:"SUCCESS",ur:"کامیابی"})); }
  };
  row.appendChild(nm); row.appendChild(rng); parent.appendChild(row);
}
function onTab(){}
function render(){
  buildTabs([["move",{en:"Move joints",ur:"جوڑ ہلاؤ"}],["pick",{en:"Pick challenge",ur:"چیلنج"}]]);
  if(!tab||tab==="main") tab="move";
  setText($("whyLbl"), t({en:"Notice:",ur:"غور کریں:"}));
  $("chips").innerHTML=""; var ctl=$("controls"); ctl.innerHTML="";
  var play=$("playBtn"), play2=$("playBtn2");
  play.className="play"; play2.className="play alt hidden";

  if(tab==="move"){
    setText($("title"), t({en:"Robotic arm joints",ur:"روبوٹک بازو کے جوڑ"}));
    setText($("subtitle"), t({en:"Base, elbow, gripper — slide to move the arm.",ur:"بیس، کہنی، گرپر — سرکا کر بازو ہلائیں۔"}));
    setText($("panelHead"), t({en:"Joint sliders",ur:"جوڑ سلائیڈر"}));
    play.classList.add("hidden");
    slider(ctl, t({en:"Base",ur:"بیس"}), base, function(v){ base=v; });
    slider(ctl, t({en:"Elbow",ur:"کہنی"}), elbow, function(v){ elbow=v; });
    slider(ctl, t({en:"Gripper",ur:"گرپر"}), grip, function(v){ grip=v; tryGrab(); });
    drawArm();
    setText($("statechip"), holding?t({en:"Holding",ur:"پکڑا"}):t({en:"Empty hand",ur:"خالی ہاتھ"}));
    setText($("lead"), t({en:"Each joint adds one kind of movement",ur:"ہر جوڑ ایک قسم کی حرکت دیتا ہے"}));
    setText($("detail"), t({en:"Base turns, elbow bends, gripper opens and closes — like your arm!",ur:"بیس گھومے، کہنی مڑے، گرپر کھلے بند — جیسے آپ کا ہاتھ!"}));
    setText($("trade"),""); setText($("whyText"), t({en:"More joints = more ways to reach a spot. That is flexibility.",ur:"زیادہ جوڑ = زیادہ پہنچ۔ یہی لچک ہے۔"}));
    return;
  }
  setText($("title"), t({en:"Pick the block!",ur:"بلاک اٹھاؤ!"}));
  setText($("subtitle"), t({en:"Move the arm, close gripper on the orange block, drop it in GOAL.",ur:"بازو ہلائیں، نارنجی بلاک پکڑیں، GOAL میں رکھیں۔"}));
  setText($("panelHead"), t({en:"Challenge",ur:"چیلنج"}));
  setText(play, t({en:"Reset challenge",ur:"ری سیٹ"}));
  play.classList.remove("hidden"); play.classList.add("alt");
  play.onclick=function(){ obj={x:240,y:190,grabbed:false}; holding=false; won=false; base=20; elbow=40; grip=20; render(); };
  slider(ctl, t({en:"Base",ur:"بیس"}), base, function(v){ base=v; });
  slider(ctl, t({en:"Elbow",ur:"کہنی"}), elbow, function(v){ elbow=v; });
  slider(ctl, t({en:"Grip",ur:"گرپر"}), grip, function(v){ grip=v; tryGrab(); });
  drawArm();
  $("statechip").className="statechip"+(won?" ok":"");
  setText($("statechip"), won?t({en:"SUCCESS",ur:"کامیابی"}):holding?t({en:"Holding block",ur:"بلاک پکڑا"}):t({en:"Reach & grab",ur:"پہنچو اور پکڑو"}));
  setText($("lead"), won?t({en:"You did it — precise pick and place!",ur:"کر دیا — درست پکڑو رکھو!"}):t({en:"Close gripper (high %) near the block to grab",ur:"بلاک کے پاس گرپر بند کرو (زیادہ %)"}));
  setText($("detail"), t({en:"Open gripper (low %) over GOAL to drop.",ur:"GOAL پر گرپر کھولو (کم %) تاکہ گرے۔"}));
  setText($("trade"), t({en:"Tip: get the tip near the block first, then squeeze.",ur:"مشورہ: پہلے نوک بلاک کے پاس، پھر دباؤ۔"}));
  setText($("whyText"), t({en:"Factory arms do this thousands of times a day — same idea!",ur:"فیکٹری بازو یہ دن میں ہزاروں بار کرتے ہیں — وہی خیال!"}));
}

applyLang();
})();
</script>
