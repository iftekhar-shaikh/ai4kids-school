<title>Data handling | AI4Kids Class 4</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--board:#e5f3ea;--board-deep:#c9e4d2;--sky:#c5e7f6;--sky2:#6eb0d4;--accent:#1d6b52;--ok:#2e7d4f;--ink:#1e2a1a;--ink-soft:#4a5744;--paper:#fdfaf3;--line:#d5dec8;--gold:#e8b23d;--left:#c4453a;--bar1:#2f6fb5;--bar2:#d4701f;--bar3:#2e7d4f;--bar4:#7a4fb5;--bar5:#c4453a;--fs-cap:clamp(12px,3.2vw,13px);--fs-xs:clamp(14px,3.7vw,15px);--fs-sm:clamp(16px,4.2vw,17px);--fs-md:clamp(17px,4.6vw,19px);--fs-lg:clamp(20px,5.4vw,23px);--fs-xl:clamp(27px,7.4vw,33px);--lh:1.5}
body.urdu{--fs-cap:clamp(13px,3.5vw,15px);--fs-xs:clamp(15px,4.1vw,17px);--fs-sm:clamp(17px,4.7vw,19px);--fs-md:clamp(19px,5.2vw,21px);--fs-lg:clamp(22px,6vw,25px);--fs-xl:clamp(26px,7vw,31px);--lh:2.1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
.brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
.chip{border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;font-size:var(--fs-xs);cursor:pointer;min-height:42px;touch-action:manipulation}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stars{display:flex;align-items:center;gap:6px;font-weight:800;font-size:var(--fs-xs);background:#fff6e2;border:2px solid var(--gold);border-radius:999px;padding:7px 13px}
h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
.sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
.ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
h1.ur{line-height:1.9}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{flex:1 1 28%;min-width:90px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:14px;padding:10px 6px;font:inherit;font-weight:800;font-size:var(--fs-cap);cursor:pointer;min-height:54px;line-height:1.2;touch-action:manipulation}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs button .badge{color:var(--gold)}
.story{background:#fff8ea;border:2px dashed var(--gold);border-radius:16px;padding:13px 15px;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6;margin-bottom:14px}
body.urdu .story{line-height:var(--lh)}
.story b{color:var(--ink)}
.scene{position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 36%,var(--board) 36%,var(--board-deep) 100%);min-height:280px}
.scene-pad{padding:10px 12px 18px;min-height:260px;position:relative}
.sky-layer{position:absolute;inset:0 0 58% 0;pointer-events:none;overflow:hidden}
.sun-ball{position:absolute;top:12px;right:18px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a0,#f5c542 60%,#e0a020);box-shadow:0 0 18px rgba(245,197,66,.45);z-index:1}
body.urdu .sun-ball{right:auto;left:18px}
.cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:40px;opacity:.9}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.c1{width:48px;height:15px;top:18px;left:12%}
.c1:before{width:22px;height:22px;top:-12px;left:6px}
.c1:after{width:18px;height:18px;top:-8px;left:24px}
.c2{width:34px;height:12px;top:34px;left:55%;opacity:.7}
.c2:before{width:16px;height:16px;top:-9px;left:4px}
.c2:after{width:12px;height:12px;top:-5px;left:16px}
.num-stage{position:relative;z-index:5;padding:62px 8px 8px;text-align:center}
.hero-em{font-size:34px;line-height:1;margin:0}
.capline{font-size:var(--fs-cap);font-weight:800;color:var(--accent);margin:6px 8px 0;line-height:1.45}
body.urdu .capline,body.urdu .hintbox,body.urdu .card-box{line-height:var(--lh)}
.card-box{background:rgba(253,250,243,.95);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;font-weight:800;font-size:var(--fs-xs);max-width:360px;margin:8px auto 0;line-height:1.4}
.chart-wrap{background:rgba(253,250,243,.96);border:2.5px solid var(--ink);border-radius:14px;padding:10px 10px 8px;margin:10px auto 0;max-width:360px;direction:ltr}
.chart-title{font-weight:800;font-size:13px;margin:0 0 8px;color:var(--ink);text-align:center;line-height:1.3}
.vchart{display:flex;align-items:flex-end;justify-content:space-around;gap:6px;height:140px;border-bottom:3px solid var(--ink);padding:0 4px 0;position:relative}
.vcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;min-width:0;height:100%}
.vbar{width:100%;max-width:42px;border-radius:8px 8px 2px 2px;border:2px solid var(--ink);min-height:4px;position:relative}
.vbar .vval{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;white-space:nowrap}
.vlab{font-size:10px;font-weight:800;margin-top:4px;line-height:1.15;text-align:center;max-width:100%;word-break:break-word}
.hchart{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.hrow{display:flex;align-items:center;gap:8px}
.hlab{width:72px;font-size:11px;font-weight:800;text-align:right;flex-shrink:0;line-height:1.2}
.htrack{flex:1;height:22px;background:#eef2e8;border-radius:6px;border:1.5px solid var(--line);overflow:hidden}
.hbar{height:100%;border-radius:4px;border:2px solid var(--ink);min-width:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.hbar .hval{font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.dchart{display:flex;align-items:flex-end;justify-content:space-around;gap:10px;height:140px;border-bottom:3px solid var(--ink);padding:0 4px}
.dgroup{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;height:100%;min-width:0}
.dpair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.dbar{width:18px;border-radius:6px 6px 2px 2px;border:2px solid var(--ink);min-height:4px;position:relative}
.dbar .dval{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800}
.dlab{font-size:10px;font-weight:800;margin-top:4px;text-align:center;line-height:1.15}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-size:11px;font-weight:800}
.leg{display:flex;align-items:center;gap:4px}
.swatch{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--ink);display:inline-block}
.chance-card{background:rgba(253,250,243,.95);border:2.5px solid var(--ink);border-radius:14px;padding:14px 12px;margin:10px auto 0;max-width:320px;font-weight:800;font-size:var(--fs-xs);line-height:1.4}
.chance-em{font-size:42px;line-height:1;margin:0 0 6px}
.word-pills{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0 0}
.wpill{border:2px solid var(--ink);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;background:#fff}
.wpill.on{background:var(--ink);color:var(--paper)}
.save-choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.save-choices button{border:2.5px solid var(--ink);background:var(--paper);border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;text-align:left;min-height:52px;display:flex;align-items:center;gap:10px;touch-action:manipulation}
body.urdu .save-choices button{text-align:right}
.save-choices button.numc{justify-content:center;text-align:center;direction:ltr;font-size:20px}
.save-choices button.right,.opt.right{border-color:var(--ok);background:#e8f2ed}
.save-choices button.wrong,.opt.wrong{border-color:var(--left);background:#fbeae8}
.readout{margin-top:-18px;position:relative;z-index:2;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:16px 18px}
.statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px}
.statechip.ur{padding:2px 14px 7px}
.statechip.win{background:var(--ok)}
.statechip.miss{background:var(--left)}
.headline{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
.headline.ur{line-height:1.95}
.detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
.hintbox{margin-top:14px;border:2px solid var(--accent);background:#e7f6ef;border-radius:14px;padding:11px 14px;font-size:var(--fs-xs);color:var(--accent);font-weight:700;line-height:1.55;display:none}
.hintbox.show{display:block}
.panel{margin-top:22px}
.panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
.prog{margin:0 0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft)}
.btns{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}
.btns button{border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;min-height:50px;padding:8px 14px;flex:1;touch-action:manipulation}
.btns .go{background:var(--ink);color:var(--paper)}
.btns button:active{transform:scale(.97)}
.btns button:disabled{opacity:.4;cursor:default}
.quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.qhead h2{font-size:var(--fs-lg);font-weight:800;margin:0;flex:1}
.q{margin-bottom:26px}
.q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
.q p.ur{font-weight:400}
.gloss{margin:-6px 0 12px;font-size:var(--fs-xs);color:var(--ink-soft);font-weight:600;line-height:1.45}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);min-height:50px;touch-action:manipulation}
.opt.ur{text-align:right;line-height:var(--lh)}
.opt:disabled{cursor:default}
.fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
.fb.show{display:block}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--ink-soft)}
@media (min-width:820px){
.wrap{max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;grid-template-areas:"bar bar" "head head" "tabs tabs" "story story" "left right" "quiz quiz" "foot foot";align-items:start}
.bar{grid-area:bar}.head{grid-area:head}.tabs{grid-area:tabs}.story{grid-area:story}.left{grid-area:left}.right{grid-area:right}.quiz{grid-area:quiz;margin-top:34px}footer{grid-area:foot}.panel{margin-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation:none !important}}
</style>

function buildVChart(title,items){
  var wrap=document.createElement("div");wrap.className="chart-wrap";
  var ti=document.createElement("div");ti.className="chart-title";setText(ti,t(title));wrap.appendChild(ti);
  var chart=document.createElement("div");chart.className="vchart";
  var mx=maxVal(items),i;
  for(i=0;i<items.length;i++){
    var col=document.createElement("div");col.className="vcol";
    var bar=document.createElement("div");bar.className="vbar";
    bar.style.height=Math.max(8,Math.round((items[i].v/mx)*120))+"px";
    bar.style.background=COLORS[i%COLORS.length];
    var vv=document.createElement("span");vv.className="vval";vv.textContent=String(items[i].v);bar.appendChild(vv);
    col.appendChild(bar);
    var lab=document.createElement("div");lab.className="vlab";lab.textContent=t(items[i]);col.appendChild(lab);
    chart.appendChild(col);
  }
  wrap.appendChild(chart);return wrap;
}
function buildHChart(title,items){
  var wrap=document.createElement("div");wrap.className="chart-wrap";
  var ti=document.createElement("div");ti.className="chart-title";setText(ti,t(title));wrap.appendChild(ti);
  var chart=document.createElement("div");chart.className="hchart";
  var mx=maxVal(items),i;
  for(i=0;i<items.length;i++){
    var row=document.createElement("div");row.className="hrow";
    var lab=document.createElement("div");lab.className="hlab";lab.textContent=t(items[i]);row.appendChild(lab);
    var track=document.createElement("div");track.className="htrack";
    var bar=document.createElement("div");bar.className="hbar";
    bar.style.width=Math.max(8,Math.round((items[i].v/mx)*100))+"%";
    bar.style.background=COLORS[i%COLORS.length];
    var hv=document.createElement("span");hv.className="hval";hv.textContent=String(items[i].v);bar.appendChild(hv);
    track.appendChild(bar);row.appendChild(track);chart.appendChild(row);
  }
  wrap.appendChild(chart);return wrap;
}
function buildDouble(ch){
  var wrap=document.createElement("div");wrap.className="chart-wrap";
  var ti=document.createElement("div");ti.className="chart-title";setText(ti,t(ch.chartTitle));wrap.appendChild(ti);
  var chart=document.createElement("div");chart.className="dchart";
  var mx=1,i,j;for(i=0;i<ch.g1.vals.length;i++){if(ch.g1.vals[i]>mx)mx=ch.g1.vals[i];if(ch.g2.vals[i]>mx)mx=ch.g2.vals[i]}
  for(i=0;i<ch.cats.length;i++){
    var g=document.createElement("div");g.className="dgroup";
    var pair=document.createElement("div");pair.className="dpair";
    var b1=document.createElement("div");b1.className="dbar";b1.style.height=Math.max(8,Math.round((ch.g1.vals[i]/mx)*120))+"px";b1.style.background="var(--bar1)";
    var v1=document.createElement("span");v1.className="dval";v1.textContent=String(ch.g1.vals[i]);b1.appendChild(v1);pair.appendChild(b1);
    var b2=document.createElement("div");b2.className="dbar";b2.style.height=Math.max(8,Math.round((ch.g2.vals[i]/mx)*120))+"px";b2.style.background="var(--bar2)";
    var v2=document.createElement("span");v2.className="dval";v2.textContent=String(ch.g2.vals[i]);b2.appendChild(v2);pair.appendChild(b2);
    g.appendChild(pair);
    var lab=document.createElement("div");lab.className="dlab";lab.textContent=t(ch.cats[i]);g.appendChild(lab);
    chart.appendChild(g);
  }
  wrap.appendChild(chart);
  var leg=document.createElement("div");leg.className="legend";
  var l1=document.createElement("span");l1.className="leg";l1.innerHTML='<span class="swatch" style="background:var(--bar1)"></span> ';
  var s1=document.createElement("span");s1.textContent=t(ch.g1);l1.appendChild(s1);
  var l2=document.createElement("span");l2.className="leg";l2.innerHTML='<span class="swatch" style="background:var(--bar2)"></span> ';
  var s2=document.createElement("span");s2.textContent=t(ch.g2);l2.appendChild(s2);
  leg.appendChild(l1);leg.appendChild(l2);wrap.appendChild(leg);
  return wrap;
}
function renderChoices(box,ch,doneMap,prefix,modeKey,total,rerender){
  box.innerHTML="";
  var choices=document.createElement("div");choices.className="save-choices";
  stableOrder(prefix+"-"+ch.id,ch.opts.slice()).forEach(function(opt){
    var b=document.createElement("button");b.type="button";setText(b,t(opt));
    if(doneMap[ch.id]&&opt.id===ch.correct)b.classList.add("right");b.disabled=!!doneMap[ch.id];
    b.addEventListener("click",function(){if(doneMap[ch.id])return;if(opt.id===ch.correct){markWin(prefix,ch.id,doneMap,modeKey,total);rerender()}else{b.classList.add("wrong");showMiss()}});
    choices.appendChild(b);
  });
  box.appendChild(choices);
}
function renderRead(){
  var ch=READ[readIdx],stage=prepScene();addBlurb(stage,ch);
  stage.appendChild(ch.orient==="h"?buildHChart(ch.chartTitle,ch.items):buildVChart(ch.chartTitle,ch.items));
  addCap(stage,lang==="en"?"Read the scale. Tall or long = more.":"اسکیل پڑھو۔ اونچی یا لمبی = زیادہ۔");
  showStep(readIdx,READ.length);setText($("headline"),t(ch.title));
  setText($("detail"),readDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(readDone[ch.id])showWin(t(ch.done));
  renderChoices($("actionBox"),ch,readDone,"read","read",READ.length,renderRead);
  setText($("prog"),t(T.progRead)+": "+Object.keys(readDone).length+"/"+READ.length);
}
function renderCompare(){
  var ch=COMP[compIdx],stage=prepScene();addBlurb(stage,ch);
  if(ch.kind==="double")stage.appendChild(buildDouble(ch));
  else stage.appendChild(buildVChart(ch.chartTitle,ch.items));
  addCap(stage,lang==="en"?"Compare heights. Double bar = two groups.":"اونچائی موازنہ۔ ڈبل بار = دو گروہ۔");
  showStep(compIdx,COMP.length);setText($("headline"),t(ch.title));
  setText($("detail"),compDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(compDone[ch.id])showWin(t(ch.done));
  renderChoices($("actionBox"),ch,compDone,"comp","compare",COMP.length,renderCompare);
  setText($("prog"),t(T.progCompare)+": "+Object.keys(compDone).length+"/"+COMP.length);
}
function wordKeys(){return ["impossible","unlikely","equal","likely","certain"]}
function renderChance(){
  var ch=CHANCE[chanceIdx],stage=prepScene();addBlurb(stage,ch);
  var card=document.createElement("div");card.className="chance-card";
  var em=document.createElement("div");em.className="chance-em";em.textContent=ch.em;card.appendChild(em);
  var sc=document.createElement("div");setText(sc,t(ch.scene));card.appendChild(sc);
  stage.appendChild(card);
  var pills=document.createElement("div");pills.className="word-pills";
  wordKeys().forEach(function(k){
    var p=document.createElement("span");p.className="wpill"+(chanceDone[ch.id]&&k===ch.correct?" on":"");
    p.textContent=t(WORDS[k]);pills.appendChild(p);
  });
  stage.appendChild(pills);
  addCap(stage,lang==="en"?"Match the scene to a chance word.":" منظر کو موقع کے لفظ سے ملاؤ۔");
  showStep(chanceIdx,CHANCE.length);setText($("headline"),t(ch.title));
  setText($("detail"),chanceDone[ch.id]?t(ch.why):t(ch.ask));clearHint();
  if(chanceDone[ch.id])showWin(t(ch.done));
  var box=$("actionBox");box.innerHTML="";
  var choices=document.createElement("div");choices.className="save-choices";
  var opts=wordKeys().map(function(k){return{id:k,en:WORDS[k].en,ur:WORDS[k].ur}});
  stableOrder("chance-"+ch.id,opts).forEach(function(opt){
    var b=document.createElement("button");b.type="button";setText(b,t(opt));
    if(chanceDone[ch.id]&&opt.id===ch.correct)b.classList.add("right");b.disabled=!!chanceDone[ch.id];
    b.addEventListener("click",function(){if(chanceDone[ch.id])return;if(opt.id===ch.correct){markWin("chance",ch.id,chanceDone,"chance",CHANCE.length);renderChance()}else{b.classList.add("wrong");showMiss()}});
    choices.appendChild(b);
  });
  box.appendChild(choices);
  setText($("prog"),t(T.progChance)+": "+Object.keys(chanceDone).length+"/"+CHANCE.length);
}
function pickQuiz(){
  var pin=[],rest=[],i;quizState={};
  for(i=0;i<QUIZ.length;i++){if(QUIZ[i].pin)pin.push(QUIZ[i]);else rest.push(QUIZ[i])}
  rest=shuffle(rest);quizSet=shuffle(pin.concat(rest.slice(0,5-pin.length)));
}
function renderQuiz(){
  var box=$("quizBox");box.innerHTML="";
  quizSet.forEach(function(item,qi){
    var wrap=document.createElement("div");wrap.className="q";
    var p=document.createElement("p");setText(p,(qi+1)+". "+t(item.q));wrap.appendChild(p);
    if(lang==="en"&&item.ru){var g=document.createElement("p");g.className="gloss";g.textContent=item.ru;wrap.appendChild(g)}
    var st=quizState[item.id];
    item.opts.forEach(function(opt,oi){
      var b=document.createElement("button");b.type="button";b.className="opt"+(lang==="ur"?" ur":"");setText(b,t(opt));
      if(st&&oi===item.correct)b.classList.add("right");
      if(st==="no"&&quizState[item.id+"-pick"]===oi&&oi!==item.correct)b.classList.add("wrong");
      if(st)b.disabled=true;
      b.addEventListener("click",function(){
        if(quizState[item.id])return;
        quizState[item.id+"-pick"]=oi;
        if(oi===item.correct){quizState[item.id]="ok";b.classList.add("right");award("quiz-"+item.id,1)}
        else{quizState[item.id]="no";b.classList.add("wrong");var kids=wrap.querySelectorAll(".opt");if(kids[item.correct])kids[item.correct].classList.add("right")}
        fb.classList.add("show");
        var all=wrap.querySelectorAll(".opt"),k;for(k=0;k<all.length;k++)all[k].disabled=true;
      });
      wrap.appendChild(b);
    });
    var fb=document.createElement("p");fb.className="fb"+(st?" show":"");setText(fb,t(item.why));wrap.appendChild(fb);
    box.appendChild(wrap);
  });
}
function storyHtml(){if(mode==="read")return t(T.storyRead);if(mode==="compare")return t(T.storyCompare);return t(T.storyChance)}
function currentTip(){if(mode==="read")return T.tipRead;if(mode==="compare")return T.tipCompare;return T.tipChance}
function tabBadges(){
  function lab(btn,label,key){btn.innerHTML="";var span=document.createElement("span");setText(span,t(label));btn.appendChild(span);if(doneModes[key]){var b=document.createElement("span");b.className="badge";b.textContent=" ★";btn.appendChild(b)}}
  lab($("tabRead"),T.tabRead,"read");lab($("tabComp"),T.tabComp,"compare");lab($("tabChance"),T.tabChance,"chance");
  $("tabRead").setAttribute("aria-pressed",mode==="read"?"true":"false");
  $("tabComp").setAttribute("aria-pressed",mode==="compare"?"true":"false");
  $("tabChance").setAttribute("aria-pressed",mode==="chance"?"true":"false");
}
function renderCurrent(){if(mode==="read")renderRead();else if(mode==="compare")renderCompare();else renderChance()}
function setMode(m){mode=m;renderCurrent();applyChrome()}
function applyChrome(){
  setText($("title"),t(T.title));setText($("subtitle"),t(T.sub));
  $("story").innerHTML=storyHtml();$("story").classList.toggle("ur",lang==="ur");$("story").setAttribute("dir",lang==="ur"?"rtl":"ltr");
  setText($("ctlHead"),t(T.ctl));setText($("nextBtn"),t(T.next));setText($("hintBtn"),t(T.hint));setText($("resetBtn"),t(T.reset));
  setText($("quizHead"),t(T.quiz));setText($("newQuiz"),t(T.newQuiz));
  $("langBtn").textContent=(lang==="en")?"اردو":"EN";$("langBtn").setAttribute("aria-pressed",lang==="ur"?"true":"false");
  document.body.classList.toggle("urdu",lang==="ur");
  document.documentElement.lang=(lang==="ur")?"ur":"en";
  document.documentElement.dir=(lang==="ur")?"rtl":"ltr";
  document.title=t(T.title)+" | AI4Kids Class 4";
  tabBadges();
  var foot=document.querySelector("footer p");
  if(foot)setText(foot,foot.getAttribute(lang==="ur"?"data-ur":"data-en"));
}
function applyLang(){applyChrome();renderCurrent();renderQuiz()}
function next(){
  optKey="";
  if(mode==="read"){readIdx=(readIdx+1)%READ.length;renderRead()}
  else if(mode==="compare"){compIdx=(compIdx+1)%COMP.length;renderCompare()}
  else{chanceIdx=(chanceIdx+1)%CHANCE.length;renderChance()}
}
function showHint(){
  var h=mode==="read"?READ[readIdx].hint:(mode==="compare"?COMP[compIdx].hint:CHANCE[chanceIdx].hint);
  var hb=$("hintbox");setText(hb,t(h));hb.classList.add("show");
}
function resetMode(){
  if(mode==="read"){Object.keys(awarded).forEach(function(k){if(k.indexOf("read-")===0||k==="mode-read")delete awarded[k]});readDone={};readIdx=0;doneModes.read=false;recountStars();renderRead()}
  else if(mode==="compare"){Object.keys(awarded).forEach(function(k){if(k.indexOf("comp-")===0||k==="mode-compare")delete awarded[k]});compDone={};compIdx=0;doneModes.compare=false;recountStars();renderCompare()}
  else{Object.keys(awarded).forEach(function(k){if(k.indexOf("chance-")===0||k==="mode-chance")delete awarded[k]});chanceDone={};chanceIdx=0;doneModes.chance=false;recountStars();renderChance()}
  optKey="";tabBadges();applyChrome();
}
function cleanSpeakText(s){return String(s||"").replace(/<[^>]+>/g," ").replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&amp;/g,"&").replace(/\s+/g," ").trim()}
function buildSpeakText(){
  var bits=[];bits.push(t(T.title));bits.push(cleanSpeakText(storyHtml()));
  bits.push(cleanSpeakText(($("headline")&&$("headline").textContent)||""));
  bits.push(cleanSpeakText(($("detail")&&$("detail").textContent)||""));
  bits.push(t(currentTip()));return bits.filter(Boolean).join(". ");
}
function pickVoice(voices,want){
  var i,v,L;for(i=0;i<voices.length;i++){v=voices[i];L=(v.lang||"").toLowerCase().replace("_","-");if(L.indexOf(want)===0)return v}
  for(i=0;i<voices.length;i++){v=voices[i];L=(v.lang||"").toLowerCase().replace("_","-");if(L.indexOf("en")===0)return v}
  return voices[0]||null;
}
function setSpeaking(on){var btn=$("speakBtn");if(!btn)return;btn.setAttribute("aria-pressed",on?"true":"false");btn.style.opacity=on?"0.65":""}
function doSpeak(text,asLang){
  var u=new SpeechSynthesisUtterance(text);u.rate=0.92;u.lang=(asLang==="ur")?"ur-PK":"en-US";
  var voices=window.speechSynthesis.getVoices()||[];var voice=pickVoice(voices,asLang==="ur"?"ur":"en");if(voice)u.voice=voice;
  u.onstart=function(){setSpeaking(true)};u.onend=function(){setSpeaking(false)};
  u.onerror=function(){setSpeaking(false);if(asLang==="ur"){var fallback=cleanSpeakText(T.title.en+". "+T.storyRead.en+". "+T.tipRead.en);var u2=new SpeechSynthesisUtterance(fallback);u2.lang="en-US";u2.rate=0.92;var v2=pickVoice(window.speechSynthesis.getVoices()||[],"en");if(v2)u2.voice=v2;u2.onstart=function(){setSpeaking(true)};u2.onend=u2.onerror=function(){setSpeaking(false)};window.speechSynthesis.speak(u2)}};
  window.speechSynthesis.speak(u);
}
if("speechSynthesis" in window){
  try{window.speechSynthesis.getVoices()}catch(e0){}
  if(typeof window.speechSynthesis.addEventListener==="function"){window.speechSynthesis.addEventListener("voiceschanged",function(){try{window.speechSynthesis.getVoices()}catch(e1){}})}
}else{var noBtn=$("speakBtn");if(noBtn){noBtn.disabled=true;noBtn.title="Voice not available on this device"}}
$("langBtn").addEventListener("click",function(){lang=(lang==="en")?"ur":"en";applyLang()});
$("tabRead").addEventListener("click",function(){setMode("read")});
$("tabComp").addEventListener("click",function(){setMode("compare")});
$("tabChance").addEventListener("click",function(){setMode("chance")});
$("nextBtn").addEventListener("click",next);
$("hintBtn").addEventListener("click",showHint);
$("resetBtn").addEventListener("click",resetMode);
$("newQuiz").addEventListener("click",function(){pickQuiz();renderQuiz()});
$("speakBtn").addEventListener("click",function(){
  try{
    if(!("speechSynthesis" in window))return;
    var text=buildSpeakText();if(!text)return;
    if(speakTimer){clearTimeout(speakTimer);speakTimer=null}
    window.speechSynthesis.cancel();setSpeaking(false);
    var speakLang=lang;
    speakTimer=setTimeout(function(){speakTimer=null;doSpeak(text,speakLang)},80);
  }catch(e){setSpeaking(false)}
});
pickQuiz();applyLang();
})();
</script>
</body>
</html>
