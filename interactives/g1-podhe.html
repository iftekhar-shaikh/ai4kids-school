:100px;padding:11px 8px;cursor:pointer;text-align:center;font-weight:800}.card:hover,.card.selected{border-color:var(--blue);background:var(--blue2)}.emoji{display:block;font-size:2.35rem;line-height:1.1;margin-bottom:5px}.card small{display:block;font-size:var(--fs-cap);font-weight:600;color:var(--muted)}.lesson-grid{display:grid;gap:13px}.lesson{border:3px solid var(--line);border-radius:18px;background:#fff;padding:16px 18px;scroll-margin-top:12px}.lesson .tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:4px 14px;font-size:var(--fs-cap);font-weight:900;margin-bottom:9px}.lesson.hook .tag{background:var(--orange)}.lesson.misaal .tag{background:var(--green)}.lesson.karo .tag{background:var(--purple)}.lesson p{margin:0;font-size:var(--fs-sm)}.quiz{border-top:3px solid var(--ink);margin-top:30px;padding-top:21px;scroll-margin-top:12px}.quiz h2{font-size:var(--fs-lg);margin:0 0 18px}.q{margin-bottom:27px}.q-title{font-size:var(--fs-md);font-weight:800;margin:0 0 10px}.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;min-height:54px;font-size:var(--fs-sm)}.opt.right{border-color:var(--green);background:#e5f3eb;font-weight:800}.opt.wrong{border-color:var(--red);background:#fae5e1}.feedback{display:none;color:var(--muted);font-size:var(--fs-cap);margin:8px 0}.feedback.show{display:block}.score{display:none;text-align:center;border:3px solid var(--green);background:#e5f3eb;border-radius:15px;padding:13px;font-size:var(--fs-md);font-weight:900}.score.show{display:block}footer{margin-top:31px;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:var(--fs-cap)}@media(min-width:760px){.lesson-grid{grid-template-columns:1fr 1fr}.demo-wrap{padding:20px}.cards{grid-template-columns:repeat(4,1fr)}.play{width:auto;min-width:190px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><div class="wrap"><div class="bar"><span class="brand" id="brand"></span><button class="chip" id="langBtn" type="button" aria-pressed="false">Roman Urdu</button><button class="chip" id="speakBtn" type="button" aria-label="Read title aloud">🔊</button></div><header><h1 id="title"></h1><p class="sub" id="subtitle"></p></header><nav class="tabs" id="tabs" aria-label="Lesson sections"></nav><section class="demo-wrap" id="demo" aria-labelledby="demoTitle"><div class="demo-head"><h2 id="demoTitle"></h2><button class="chip" id="launch" type="button">Play demo</button></div><p class="demo-instruction" id="demoInstruction"></p><div class="demo-stage" id="demoStage"></div></section><main class="lesson-grid"><article class="lesson hook" id="hook"><span class="tag" id="hookTag"></span><p id="hookText"></p></article><article class="lesson samjhao" id="samjhao"><span class="tag" id="samjhaoTag"></span><p id="samjhaoText"></p></article><article class="lesson misaal" id="misaal"><span class="tag" id="misaalTag"></span><p id="misaalText"></p></article><article class="lesson karo" id="karo"><span class="tag" id="karoTag"></span><p id="karoText"></p></article></main><section class="quiz" id="quiz"><h2 id="quizHead"></h2><div id="quizBox"></div><div class="score" id="score"></div></section><footer id="foot"></footer></div><script>const DATA={"file":"g1-podhe.html","title":"Podhe","desc":{"en":"Discover plant parts and their jobs.","ru":"Podhe ke parts aur un ke kaam daryaft karo."},"hook":{"en":"A tiny seed can grow into a plant. What helps a plant stand, drink water, and make food?","ru":"Aao dosto! Kya aap ne kabhi socha hai ke podhe kis tarah se zinda rehte hain? Kya aap ne apne ghar ke aangan mein ya bazaar mein podhon ko dekha hai? Haan, yeh podhe kitne khoobsurat hain na!"},"samjhao":{"en":"Roots take in water. The stem holds the plant up. Leaves use sunlight, air, and water to help make food. Flowers can make seeds.","ru":"Podhe har jagah maujood hain, aur yeh zindagi ka ek ahem hissa hain. Podhe do tarah ke hote hain: ek zaroori hissa, jo unhein zinda rakhta hai, aur doosra hissa, jo inhein khoobsurat banata hai. Har podhe ke chaar mukhya hissa hote hain: jar, tana, patti, aur phool. **Jar** podhe ka neeche wala hissa hota hai. Yeh zameen ke andar hota hai aur pani aur khurak ko podhe tak pohanchata hai. Jar podhe ko zinda rakhta hai. **Tana** podhe ka upar wala hissa hai. Yeh jar se patti tak jata hai. Tana podhe ko seedha rakhta hai aur patti aur phool ko support deta hai. **Patti** podhe ke sabse zaroori hisson mein se hai. Iska kaam roshni ko dharna hai. Patti ke zariye podha apni khurak banata hai. Yeh process \"Photosynthesis\" kehlata hai. **Phool** podhe ka sab se khoobsurat hisa hota hai. Phool ki rang-birangi khushboo aur sundarta inhein auron se alag banati hai. Phool podhe ki nayaayi yaane seeds (beejon) ko banana ka kaam bhi karte hain."},"misaal":{"en":"In a bean plant, roots drink water, the stem stands tall, leaves catch sunlight, and flowers can make seeds.","ru":"Chalo dosto, hum ek example lete hain! Jab aap bazaar jaate hain, wahan aap ko aam ke podhe milte hain. Aam ka podha jab bara hota hai to iski patti hara rang ki hoti hain aur jab yeh phool deta hai, toh baad mein aam banate hain. Is tarah, aam ke podhe ke jar, tana, patti, aur phool hain."},"karo":{"en":"Look at a safe plant with an adult. Point to root, stem, leaf, and flower. Do not pull it out.","ru":"Ab aapko ghar ya school mein ek chhoti si activity karni hai. Koi bhi podha lo, jaise chhota sa paudh, aur iska jar, tana, patti aur phool ghin kar dekho. Ab jaldi se in parts ko ek paper par likho aur yeh batao ke kis part ka kya kaam hai."},"demo":{"type":"cards","title":{"en":"Plant-part explorer","ru":"Plant-part explorer"},"instruction":{"en":"Tap a plant part to see its job.","ru":"Plant part par tap karke us ka kaam dekho."},"items":[{"emoji":"🌱","name":{"en":"Root","ru":"Jarr"},"label":{"en":"Root: takes in water and holds the plant.","ru":"Jarr: pani leti aur podhe ko thamti hai."}},{"emoji":"🌿","name":{"en":"Stem","ru":"Tana"},"label":{"en":"Stem: holds the plant up and carries water.","ru":"Tana: podhe ko seedha rakhta aur pani pohanchata hai."}},{"emoji":"🍃","name":{"en":"Leaf","ru":"Patti"},"label":{"en":"Leaf: uses sunlight to help make food.","ru":"Patti: dhoop se khana banane mein madad karti hai."}},{"emoji":"🌼","name":{"en":"Flower","ru":"Phool"},"label":{"en":"Flower: can help make seeds.","ru":"Phool: beej banane mein madad kar sakta hai."}}]},"quiz":[{"q":{"en":"Which plant part is under the soil?","ru":"Podhe ka kaunsa part mitti ke neeche hota hai?"},"o":[{"en":"Root","ru":"Jarr"},{"en":"Flower","ru":"Phool"},{"en":"Leaf","ru":"Patti"},{"en":"Fruit","ru":"Phal"}],"a":0,"e":{"en":"Roots grow under the soil.","ru":"Roots grow under the soil."}},{"q":{"en":"What holds a plant up?","ru":"Podhe ko seedha kaun rakhta hai?"},"o":[{"en":"Stem","ru":"Tana"},{"en":"Seed","ru":"Beej"},{"en":"Petal","ru":"Phool ki patti"},{"en":"Soil only","ru":"Sirf mitti"}],"a":0,"e":{"en":"The stem holds the plant up.","ru":"The stem holds the plant up."}},{"q":{"en":"Which part uses sunlight to help make food?","ru":"Kaunsa part dhoop se khana banane mein madad karta hai?"},"o":[{"en":"Leaf","ru":"Patti"},{"en":"Root","ru":"Jarr"},{"en":"Stone","ru":"Pathar"},{"en":"Pot","ru":"Ghamla"}],"a":0,"e":{"en":"Leaves use sunlight to help make food.","ru":"Leaves use sunlight to help make food."}},{"q":{"en":"What do plants need to grow?","ru":"Podhon ko ugne ke liye kya chahiye?"},"o":[{"en":"Water and sunlight","ru":"Pani aur dhoop"},{"en":"Only toys","ru":"Sirf khilone"},{"en":"Smoke","ru":"Dhuaan"},{"en":"No air","ru":"Hawa nahi"}],"a":0,"e":{"en":"Plants need water and sunlight.","ru":"Plants need water and sunlight."}},{"q":{"en":"What can a flower help make?","ru":"Phool kis cheez ko banane mein madad kar sakta hai?"},"o":[{"en":"Seeds","ru":"Beej"},{"en":"Shoes","ru":"Jootay"},{"en":"Books","ru":"Kitaabein"},{"en":"Stones","ru":"Pathar"}],"a":0,"e":{"en":"Flowers can help make seeds.","ru":"Flowers can help make seeds."}}]};
(function(){'use strict';var lang='en',selected=0,answered=0,score=0;

function setCommon(){document.documentElement.lang=lang;document.title=t(DATA.title)+' | AI4Kids Grade 1 Science';put($('brand'),{en:'AI4Kids · Grade 1 · Science',ru:'AI4Kids · Jamaat 1 · Science'});put($('title'),DATA.title);put($('subtitle'),DATA.desc);put($('quizHead'),{en:'Quiz — 5 questions',ru:'Quiz — 5 sawaal'});put($('foot'),{en:'AI4Kids · Grade 1 Science · Offline lesson',ru:'AI4Kids · Jamaat 1 Science · Offline lesson'});$('langBtn').textContent=lang==='en'?'Roman Urdu':'English';$('langBtn').setAttribute('aria-pressed',lang==='ru');var L=labels();['hook','samjhao','misaal','karo'].forEach(function(k){put($(k+'Tag'),L[k]);put($(k+'Text'),DATA[k])});put($('demoTitle'),DATA.demo.title);put($('demoInstruction'),DATA.demo.instruction);put($('launch'),{en:'Play demo',ru:'Demo khelo'});renderTabs();renderDemo();renderQuiz()}

function baseMsg(stage,text){var p=document.createElement('div');p.className='demo-msg';put(p,text);stage.appendChild(p)}

function renderQuiz(){var box=$('quizBox');box.innerHTML='';answered=0;score=0;$('score').classList.remove('show');DATA.quiz.forEach(function(q,qi){var wrap=document.createElement('section');wrap.className='q';var title=document.createElement('p');title.className='q-title';title.textContent=(qi+1)+'. '+t(q.q);wrap.appendChild(title);q.o.forEach(function(op,oi){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+oi)+'. '+t(op);b.onclick=function(){if(wrap.dataset.done)return;wrap.dataset.done='1';answered++;var ok=oi===q.a;if(ok)score++;b.classList.add(ok?'right':'wrong');if(!ok)wrap.querySelectorAll('.opt').forEach(function(x,xi){if(xi===q.a)x.classList.add('right')});var fb=wrap.querySelector('.feedback');fb.textContent=(ok?'✓ ':'✗ ')+t(q.e);fb.classList.add('show');wrap.querySelectorAll('button').forEach(function(x){x.disabled=true});if(answered===DATA.quiz.length){$('score').textContent=t({en:'Your score: '+score+' / 5 — '+(score===5?'Excellent!':'Good practice!'),ru:'Tumhara score: '+score+' / 5 — '+(score===5?'Shabash!':'Achi practice!')});$('score').classList.add('show')}};wrap.appendChild(b)});var fb=document.createElement('p');fb.className='feedback';wrap.appendChild(fb);box.appendChild(wrap)})}
$('langBtn').onclick=function(){lang=lang==='en'?'ru':'en';selected=0;setCommon()};$('speakBtn').onclick=function(){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t(DATA.title)+' '+t(DATA.desc));u.lang=lang==='en'?'en-US':'en-PK';u.rate=.9;window.speechSynthesis.speak(u)};$('launch').onclick=function(){$('demo').scrollIntoView({behavior:'smooth'});renderDemo()};setCommon()})();</script></body></html>
