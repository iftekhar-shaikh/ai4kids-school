<style>

:root{

  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}

:root{
  --accent:#1a5b8f; --accent2:#c9702e; --ok:#2e7d4f; --no:#c4453a;
  --ink:#1f2933; --ink-soft:#4a5661; --paper:#fdfaf3; --line:#ded5c4;
  --board:#eef3f7; --board-deep:#d9e5ee; --good-bg:#e8f2ed; --bad-bg:#fbeae8;
  --fs-cap:clamp(14px, 3.8vw, 16px); --fs-xs:clamp(16px, 4.2vw, 18px);
  --fs-sm:clamp(18px, 4.8vw, 20px); --fs-md:clamp(19px, 5.2vw, 22px);
  --fs-lg:clamp(22px, 6vw, 26px); --fs-xl:clamp(30px, 8vw, 38px); --lh:1.5;
}
body.urdu{
  --fs-cap:clamp(15px, 4vw, 17px); --fs-xs:clamp(17px, 4.5vw, 19px);
  --fs-sm:clamp(19px, 5.2vw, 22px); --fs-md:clamp(21px, 5.6vw, 24px);
  --fs-lg:clamp(24px, 6.5vw, 28px); --fs-xl:clamp(28px, 7.5vw, 36px); --lh:2.1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
  font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
}
body.urdu{font-family:"Noto Nastaliq Urdu","Baloo Bhaijaan 2",serif;line-height:var(--lh)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px;flex-wrap:wrap}
.brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
.chip{
  border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
  font-size:var(--fs-xs);cursor:pointer;min-height:42px;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:focus-visible,button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
body.urdu h1{line-height:1.9}
.sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.tabs button{
  flex:1 1 18%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
  font-size:var(--fs-cap);cursor:pointer;min-height:52px;
}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.scene{
  position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
  background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  padding:14px;min-height:180px;
}
.readout{
  margin-top:12px;background:var(--paper);
  border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
}
.statechip{display:inline-block;color:#fff;border-radius:999px;
           padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px;
           background:var(--accent)}
.statechip.ok{background:var(--ok)} .statechip.no{background:var(--no)}
.lead{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
body.urdu .lead{line-height:1.95}
.detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
.why-note{
  margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
  border-left:3px solid var(--accent);padding-left:11px;
}
body.urdu .why-note{border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;line-height:var(--lh)}
.why-note b{color:var(--accent);font-weight:800}
.play{
  width:100%;margin-top:12px;border:3px solid var(--ink);border-radius:18px;
  background:var(--ink);color:var(--paper);font:inherit;font-weight:800;
  font-size:var(--fs-md);cursor:pointer;min-height:60px;
}
.play:active{transform:scale(.98)}
.play.alt{background:var(--paper);color:var(--ink)}
.play.go{background:var(--ok);border-color:var(--ok)}
.play.stop{background:var(--no);border-color:var(--no)}
.play:disabled{opacity:.45;cursor:not-allowed}
.two{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.two .play{flex:1;min-width:120px;margin-top:0}
.panel{margin-top:14px}
.panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
.lesson{margin-top:8px}
.lcard{
  border:3px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;background:#fffdf8;
}
.lcard .tag{
  display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
  padding:3px 12px;font-size:var(--fs-cap);font-weight:800;margin-bottom:8px;
}
.lcard.hook .tag{background:var(--accent2)}
.lcard.misaal .tag{background:var(--ok)}
.lcard.karo .tag{background:#6b4a8f}
.lcard p{margin:0;font-size:var(--fs-sm);line-height:1.55}
body.urdu .lcard p{line-height:var(--lh)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.card{
  border:3px solid var(--line);background:var(--paper);border-radius:16px;
  padding:14px 10px;font:inherit;cursor:pointer;min-height:88px;color:var(--ink);text-align:center;
}
.card .emoji{font-size:32px;display:block;margin-bottom:4px}
.card .lbl{font-size:var(--fs-sm);font-weight:800;display:block;line-height:1.3}
.card .subl{font-size:var(--fs-cap);font-weight:700;color:var(--ink-soft);display:block;margin-top:2px}
.card.on{border-color:var(--accent);background:#e8eef8;box-shadow:0 0 0 3px rgba(26,91,143,.2)}
.card.ok{border-color:var(--ok);background:var(--good-bg)}
.card.no{border-color:var(--no);background:var(--bad-bg)}
.card:disabled{opacity:.9;cursor:default}
.schip{
  border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 15px;
  font:inherit;font-size:var(--fs-cap);font-weight:800;color:var(--ink);cursor:pointer;min-height:46px;
}
.schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.big-num{
  font-size:clamp(42px,12vw,64px);font-weight:800;text-align:center;line-height:1.1;
  font-family:"Baloo Bhaijaan 2",sans-serif;letter-spacing:.02em;
}
.eq-line{font-size:var(--fs-lg);font-weight:800;text-align:center;margin:8px 0;font-family:"Baloo Bhaijaan 2",sans-serif}
.digit-row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px 0}
.digit-box{
  min-width:52px;padding:10px 8px;border:3px solid var(--ink);border-radius:12px;
  background:#fff;font-weight:800;font-size:var(--fs-lg);text-align:center;
}
.digit-box.place{font-size:var(--fs-cap);color:var(--ink-soft);border-color:var(--line);background:transparent;border-style:dashed}
.frac-vis{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:10px 0;min-height:56px}
.frac-piece{
  width:40px;height:48px;border:2px solid var(--ink);border-radius:8px;
  background:#93c5fd;
}
.frac-piece.off{background:#e5e7eb;opacity:.55}
.pizza{
  width:160px;height:160px;border-radius:50%;border:4px solid var(--ink);
  margin:8px auto;position:relative;overflow:hidden;background:#fde68a;
}
.tally-mark{font-size:28px;font-weight:800;letter-spacing:2px;font-family:monospace}
.pict-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:6px 0;min-height:36px}
.carroll{
  display:grid;grid-template-columns:80px 1fr 1fr;gap:4px;font-size:var(--fs-cap);font-weight:700;
}
.carroll > div{border:2px solid var(--ink);border-radius:10px;padding:10px 8px;background:#fff;text-align:center;min-height:48px}
.carroll .head{background:var(--accent);color:#fff}
.carroll .side{background:#e8eef8}
.bar-row{display:flex;align-items:flex-end;gap:8px;height:140px;padding:8px 4px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar-col .barf{width:100%;border-radius:10px 10px 4px 4px;background:var(--accent);min-height:8px;border:2px solid var(--ink)}
.bar-col .bl{font-size:var(--fs-cap);font-weight:800;text-align:center}
.quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
.q{margin-bottom:26px}
.q>p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
.opt{
  display:block;width:100%;text-align:left;margin-bottom:10px;
  border:2px solid var(--line);background:var(--paper);border-radius:12px;
  padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);min-height:52px;
}
body.urdu .opt{text-align:right}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--good-bg);font-weight:600}
.opt.wrong{border-color:var(--no);background:var(--bad-bg)}
.fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.55}
.fb.show{display:block}
.score{
  margin-top:14px;padding:14px;border:3px solid var(--ink);border-radius:16px;
  font-weight:800;font-size:var(--fs-md);text-align:center;display:none;
}
.score.show{display:block}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--ink-soft)}
.hidden{display:none !important}
@media (min-width:820px){
  .wrap{
    max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
    grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "lesson lesson" "quiz quiz" "foot foot";
    align-items:start;
  }
  .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
  .left{grid-area:left} .right{grid-area:right}
  .lesson{grid-area:lesson}
  .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation:none !important}
}

var META = {"title": {"en": "Data handling", "ur": "ڈیٹا ہینڈلنگ"}, "sub": {"en": "Carroll diagram, tally chart, and picture graph — collect and show data!", "ur": "کیرول ڈایاگرام، ٹیلی چارٹ، تصویری گراف — ڈیٹا جمع کرو اور دکھاؤ!"}, "tip": {"en": "Tally marks: every fifth line crosses the first four. Pictures show counts at a glance.", "ur": "ٹیلی: پانچویں لکیر پہلی چار پر کراس۔ تصویریں گنتی ایک نظر میں۔"}, "footEn": "Data handling", "footUr": "ڈیٹا ہینڈلنگ"};

var QUIZ = [{"q": {"en": "Carroll diagram kis cheez ko dikhata hai?", "ur": "Carroll diagram kis cheez ko dikhata hai?"}, "a": {"en": "Kuch cheezon ko categories mein rakhna.", "ur": "Kuch cheezon ko categories mein rakhna."}, "b": {"en": "Numbers ka maamla.", "ur": "Numbers ka maamla."}, "c": {"en": "Sirf comparison.", "ur": "Sirf comparison."}, "d": {"en": "Sirf addition.", "ur": "Sirf addition."}, "correct": "a", "explanation": {"en": "Kyun sahi hai: Carroll diagram mein alag alag cheezon ko categories mein rakha jata hai.", "ur": "Kyun sahi hai: Carroll diagram mein alag alag cheezon ko categories mein rakha jata hai."}}, {"q": {"en": "Tally chart kis liye use hota hai?", "ur": "Tally chart kis liye use hota hai?"}, "a": {"en": "Data ko count karne ke liye.", "ur": "Data ko count karne ke liye."}, "b": {"en": "Sirf likhne ke liye.", "ur": "Sirf likhne ke liye."}, "c": {"en": "Pictures banane ke liye.", "ur": "Pictures banane ke liye."}, "d": {"en": "Numbers ko add karne ke liye.", "ur": "Numbers ko add karne ke liye."}, "correct": "a", "explanation": {"en": "Kyun sahi hai: Tally chart ka istemal data ko asani se count karne ke liye hota hai.", "ur": "Kyun sahi hai: Tally chart ka istemal data ko asani se count karne ke liye hota hai."}}, {"q": {"en": "Picture graph mein kya use hota hai?", "ur": "Picture graph mein kya use hota hai?"}, "a": {"en": "Pictures ya images.", "ur": "Pictures ya images."}, "b": {"en": "Sirf numbers.", "ur": "Sirf numbers."}, "c": {"en": "Kuch likha nahi hota.", "ur": "Kuch likha nahi hota."}, "d": {"en": "Sirf colors.", "ur": "Sirf colors."}, "correct": "a", "explanation": {"en": "Kyun sahi hai: Picture graph mein data ko dikhane ke liye pictures ya images ka istemal kiya jata hai.", "ur": "Kyun sahi hai: Picture graph mein data ko dikhane ke liye pictures ya images ka istemal kiya jata hai."}}, {"q": {"en": "Pakistan mein students ko zimmedariyan dikhane ke liye kaunsa chart acha hai?", "ur": "Pakistan mein students ko zimmedariyan dikhane ke liye kaunsa chart acha hai?"}, "a": {"en": "Tally chart.", "ur": "Tally chart."}, "b": {"en": "Sirf ek total chart.", "ur": "Sirf ek total chart."}, "c": {"en": "Koi chart nahi.", "ur": "Koi chart nahi."}, "d": {"en": "Khana khane ka chart.", "ur": "Khana khane ka chart."}, "correct": "a", "explanation": {"en": "Kyun sahi hai: Tally chart students ki zimmedariyan asani se dikhata hai.", "ur": "Kyun sahi hai: Tally chart students ki zimmedariyan asani se dikhata hai."}}, {"q": {"en": "Carroll diagram ka istemal kahan hota hai?", "ur": "Carroll diagram ka istemal kahan hota hai?"}, "a": {"en": "Jab cheezon ka comparison karna ho.", "ur": "Jab cheezon ka comparison karna ho."}, "b": {"en": "Sirf data ko likhna ho.", "ur": "Sirf data ko likhna ho."}, "c": {"en": "Bills banane mein.", "ur": "Bills banane mein."}, "d": {"en": "Sketch banane mein.", "ur": "Sketch banane mein."}, "correct": "a", "explanation": {"en": "Kyun sahi hai: Carroll diagram ka istemal cheezon ke comparison ke liye hota hai.", "ur": "Kyun sahi hai: Carroll diagram ka istemal cheezon ke comparison ke liye hota hai."}}];

function buildTabs(){
  var tabs=$("tabs"); tabs.innerHTML="";
  var list=[
    ["play", {en:"Play", ur:"کھیلو"}],
    ["hook", {en:"Hook", ur:"ہُک"}],
    ["samjhao", {en:"Samjhao", ur:"سمجھاؤ"}],
    ["misaal", {en:"Misaal", ur:"مثال"}],
    ["karo", {en:"Karo", ur:"کرو"}]
  ];
  list.forEach(function(x){
    var b=document.createElement("button"); b.type="button";
    b.setAttribute("data-tab", x[0]);
    b.setAttribute("aria-pressed", tab===x[0]?"true":"false");
    setText(b, t(x[1]));
    b.addEventListener("click", function(){
      tab=x[0];
      Array.prototype.forEach.call(tabs.querySelectorAll("button"), function(btn){
        btn.setAttribute("aria-pressed", btn.getAttribute("data-tab")===tab?"true":"false");
      });
      renderMain();
    });
    tabs.appendChild(b);
  });
}

  [{cls:"hook",tag:{en:"HOOK",ur:"ہُک"},body:LESSON.hook},
   {cls:"samjhao",tag:{en:"SAMJHAO",ur:"سمجھاؤ"},body:LESSON.samjhao},

      b.addEventListener("click", function(){
        if(wrap.getAttribute("data-done")==="1") return;
        wrap.setAttribute("data-done","1"); quizDone++;
        if(item.correct===k) quizScore++;
        ["a","b","c","d"].forEach(function(kk, xi){
          var btn=wrap.querySelectorAll(".opt")[xi];
          if(kk===item.correct) btn.classList.add("right");
          else if(kk===k) btn.classList.add("wrong");
        });
        setText(fb, t(item.explanation)); fb.classList.add("show");
        if(quizDone===QUIZ.length){
          sb.classList.add("show");
          setText(sb, t({en:"Your score",ur:"آپ کا اسکور"})+": "+quizScore+" "+t({en:"out of",ur:"میں سے"})+" "+QUIZ.length);
        }
      });
      wrap.appendChild(b);
    });
    wrap.appendChild(fb); box.appendChild(wrap);
  });
}

function showLessonTab(key){
  var left=$("leftPane"), right=$("rightPane");
  left.innerHTML=""; right.innerHTML="";
  var map={hook:LESSON.hook, samjhao:LESSON.samjhao, misaal:LESSON.misaal, karo:LESSON.karo};
  var tags={hook:{en:"HOOK",ur:"ہُک"},samjhao:{en:"SAMJHAO",ur:"سمجھاؤ"},misaal:{en:"MISAAL",ur:"مثال"},karo:{en:"KARO",ur:"کرو"}};
  left.innerHTML='<div class="lesson" style="margin:0"><div class="lcard '+key+'"><span class="tag" id="ltag"></span><p id="lbody"></p></div></div>';
  setText($("ltag"), t(tags[key]));
  setText($("lbody"), t(map[key]));
  lastSpoken = t(map[key]);
  right.innerHTML='<div class="readout"><span class="statechip" id="sc"></span><p class="lead" id="ld"></p><p class="detail" id="dt"></p><p class="why-note"><b id="wl"></b> <span id="wt"></span></p></div>';
  setText($("sc"), t(tags[key]));
  setText($("ld"), t(META.title));
  setText($("dt"), t(META.sub));
  setText($("wl"), t({en:"Ghaur karein:",ur:"غور کریں:"}));
  setText($("wt"), t(META.tip));
}

function renderMain(){
  if(tab==="play"){ renderPlay(); }
  else { showLessonTab(tab); }
}

function applyLang(){
  document.body.classList.toggle("urdu", lang==="ur");
  document.documentElement.lang = (lang==="ur")?"ur":"en";
  document.documentElement.dir = (lang==="ur")?"rtl":"ltr";
  var lb=$("langBtn");
  lb.textContent = (lang==="en")?"اردو":"English";
  lb.setAttribute("aria-pressed", lang==="ur"?"true":"false");
  setText($("brand"), t({en:"AI4Kids · Grade 3 · Math", ur:"AI4Kids · جماعت ۳ · ریاضی"}));
  setText($("title"), t(META.title));
  setText($("subtitle"), t(META.sub));
  setText($("foot"), t({en:"AI4Kids Islamabad · Grade 3 Math · "+META.footEn,
    ur:"AI4Kids اسلام آباد · جماعت ۳ ریاضی · "+META.footUr}));
  buildTabs(); buildLessonCards(); buildQuiz(); renderMain();
}

$("langBtn").addEventListener("click", function(){ lang=(lang==="en")?"ur":"en"; applyLang(); });
$("speakBtn").addEventListener("click", function(){
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(lastSpoken || t(META.title));
    u.lang=(lang==="ur")?"ur-PK":"en-US"; u.rate=0.92;
    var voices=window.speechSynthesis.getVoices()||[];
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang && voices[i].lang.toLowerCase().indexOf(lang==="ur"?"ur":"en")===0){ u.voice=voices[i]; break; }
    }
    window.speechSynthesis.speak(u);
  }catch(e){}
});

/* ===== TOPIC DEMO ===== */

var snack={apple:0, orange:0, banana:0, chips:0};
var view="tally";
function tallyStr(n){
  var s="", g=Math.floor(n/5), r=n%5;
  for(var i=0;i<g;i++) s+="卌 ";
  for(var j=0;j<r;j++) s+="|";
  return s || "—";
}
function renderPlay(){
  var left=$("leftPane"), right=$("rightPane");
  var total=snack.apple+snack.orange+snack.banana+snack.chips;
  left.innerHTML='<div class="scene" id="viz"></div><div class="readout"><span class="statechip" id="sc"></span><p class="lead" id="ld"></p><p class="detail" id="dt"></p><p class="why-note"><b id="wl"></b> <span id="wt"></span></p></div>';
  right.innerHTML='<div class="panel"><h2 id="ph"></h2><div class="chips" id="views"></div><h2 id="ph2" style="margin-top:12px"></h2><div class="grid2" id="adds"></div><button type="button" class="play alt" id="btnReset" style="margin-top:10px"></button></div>';
  var viz=$("viz");
  if(view==="tally"){
    [["🍎 Apple","apple"],["🍊 Orange","orange"],["🍌 Banana","banana"],["🍟 Chips","chips"]].forEach(function(row){
      var d=document.createElement("div"); d.style.margin="8px 0";
      d.innerHTML='<div style="font-weight:800">'+row[0]+' ('+snack[row[1]]+')</div><div class="tally-mark">'+tallyStr(snack[row[1]])+'</div>';
      viz.appendChild(d);
    });
  } else if(view==="pict"){
    [["🍎","apple"],["🍊","orange"],["🍌","banana"],["🍟","chips"]].forEach(function(row){
      var wrap=document.createElement("div"); wrap.className="pict-row";
      var lab=document.createElement("span"); lab.style.fontWeight="800"; lab.style.minWidth="28px"; lab.textContent=row[0];
      wrap.appendChild(lab);
      for(var i=0;i<snack[row[1]];i++){
        var s=document.createElement("span"); s.textContent=row[0]; s.style.fontSize="22px";
        wrap.appendChild(s);
      }
      if(snack[row[1]]===0){ var z=document.createElement("span"); z.textContent="—"; z.style.color="#9ca3af"; wrap.appendChild(z); }
      viz.appendChild(wrap);
    });
  } else {
    // carroll: sweet vs salty / fruit vs snack simplified as 2x2: fruit | not fruit vs counted
    var html='<div class="carroll">';
    html+='<div class="head"></div><div class="head">Fruit</div><div class="head">Snack</div>';
    html+='<div class="side">Many (≥3)</div><div>'+(snack.apple>=3?"🍎×"+snack.apple:"—")+(snack.orange>=3?" 🍊×"+snack.orange:"")+(snack.banana>=3?" 🍌×"+snack.banana:"")+'</div><div>'+(snack.chips>=3?"🍟×"+snack.chips:"—")+'</div>';
    html+='<div class="side">Few (&lt;3)</div><div>'+(snack.apple>0&&snack.apple<3?"🍎×"+snack.apple:"")+(snack.orange>0&&snack.orange<3?" 🍊×"+snack.orange:"")+(snack.banana>0&&snack.banana<3?" 🍌×"+snack.banana:"")+( (snack.apple<3&&snack.orange<3&&snack.banana<3&&snack.apple+snack.orange+snack.banana===0)?"—":"")+'</div><div>'+(snack.chips>0&&snack.chips<3?"🍟×"+snack.chips:(snack.chips===0?"—":""))+'</div>';
    html+='</div>';
    viz.innerHTML=html;
  }
  setText($("sc"), view==="tally"?t({en:"Tally chart",ur:"ٹیلی چارٹ"}):view==="pict"?t({en:"Picture graph",ur:"تصویری گراف"}):t({en:"Carroll diagram",ur:"کیرول ڈایاگرام"}));
  setText($("ld"), t({en:"Total votes: "+total, ur:"کل ووٹ: "+total}));
  setText($("dt"), t({en:"Tap snacks to collect data — then switch how you show it!",ur:"اسنیکس چھو کر ڈیٹا جمع کرو — پھر دکھانے کا طریقہ بدلو!"}));
  setText($("wl"), t({en:"Ghaur karein:",ur:"غور کریں:"}));
  setText($("wt"), t({en:"Same data, three views: tally, pictures, Carroll boxes.",ur:"ایک ہی ڈیٹا، تین نظارے: ٹیلی، تصویریں، کیرول خانے۔"}));
  lastSpoken=t($("ld"));
  setText($("ph"), t({en:"How to show data?",ur:"ڈیٹا کیسے دکھائیں؟"}));
  var vw=$("views"); vw.innerHTML="";
  [["tally",{en:"Tally",ur:"ٹیلی"}],["pict",{en:"Pictures",ur:"تصویریں"}],["carroll",{en:"Carroll",ur:"کیرول"}]].forEach(function(x){
    var b=document.createElement("button"); b.type="button"; b.className="schip";
    b.setAttribute("aria-pressed", view===x[0]?"true":"false");
    setText(b,t(x[1]));
    b.onclick=function(){ view=x[0]; renderPlay(); };
    vw.appendChild(b);
  });
  setText($("ph2"), t({en:"Add a vote",ur:"ووٹ جوڑو"}));
  var adds=$("adds"); adds.innerHTML="";
  [["🍎", "apple",{en:"Apple",ur:"سیب"}],["🍊","orange",{en:"Orange",ur:"سنگترہ"}],["🍌","banana",{en:"Banana",ur:"کیلا"}],["🍟","chips",{en:"Chips",ur:"چپس"}]].forEach(function(x){
    var b=document.createElement("button"); b.type="button"; b.className="card";
    b.innerHTML='<span class="emoji">'+x[0]+'</span><span class="lbl"></span><span class="subl">'+snack[x[1]]+'</span>';
    setText(b.querySelector(".lbl"), t(x[2]));
    b.onclick=function(){ snack[x[1]]++; renderPlay(); };
    adds.appendChild(b);
  });
  setText($("btnReset"), t({en:"Reset counts",ur:"گنتی صفر"}));
  $("btnReset").onclick=function(){ snack={apple:0,orange:0,banana:0,chips:0}; renderPlay(); };
}


applyLang();
})();
</script>
