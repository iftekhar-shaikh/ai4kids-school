<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Articles — a, an, the | AI4Kids Grade 4 English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */

:root{
  --fs-cap: clamp(0.85rem, 2.2vw, 1.05rem);
  --fs-xs: clamp(1rem, 2.6vw, 1.2rem);
  --fs-sm: clamp(1.15rem, 3vw, 1.4rem);
  --fs-md: clamp(1.3rem, 3.4vw, 1.65rem);
  --fs-lg: clamp(1.55rem, 4vw, 2rem);
  --fs-xl: clamp(1.9rem, 5vw, 2.5rem);
}

/* /AI4KIDS_FS_SCALE */

  :root{
    --board:#f1f0ea;
    --board-deep:#e3e1d6;
    --a:#2f6fb5;
    --a-deep:#1d4c85;
    --the:#6b4a8f;
    --the-deep:#4a3266;
    --none:#2e7d55;
    --none-deep:#1d5a3c;
    --trap:#c9702e;
    --ink:#241f18;
    --ink-soft:#554c41;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#1d4c85;
    --ok:#2e7d4f;
    --no:#c4453a;

    --fs-cap:clamp(15px, 3.9vw, 16px);
    --fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.7vw, 19px);
    --fs-md:clamp(19px, 5.1vw, 21px);
    --fs-lg:clamp(22px, 5.9vw, 25px);
    --fs-xl:clamp(28px, 7.6vw, 34px);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.55;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:44px;
  }
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--trap);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}

  .tabs{display:flex;gap:7px;margin:0 0 14px}
  .tabs button{
    flex:1;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:56px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  .scene{
    border-radius:22px;border:3px solid var(--ink);padding:18px 16px;min-height:150px;
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
    text-align:center;
  }
  .word{font-size:var(--fs-xl);font-weight:800;line-height:1.3;margin:0}
  .word .blank{
    display:inline-block;min-width:74px;border-bottom:4px solid var(--trap);
    color:var(--trap);
  }
  .sentence{font-size:var(--fs-md);font-weight:800;line-height:1.7;margin:0;text-align:left}
  .sentence .blank{
    display:inline-block;min-width:58px;border-bottom:3px solid var(--trap);
    color:var(--trap);text-align:center;
  }
  .sentence mark{background:#ffe9b8;border-radius:5px;padding:1px 5px;
                 box-shadow:inset 0 -2px 0 #e8b23d;color:inherit}
  .hear{
    margin-top:14px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);
    color:var(--ink);font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;
    min-height:48px;padding:0 18px;
  }

  .picks{display:flex;gap:8px;margin-top:12px}
  .picks button{
    flex:1;border:3px solid var(--line);background:var(--paper);border-radius:16px;
    padding:13px 8px;font:inherit;font-weight:800;font-size:var(--fs-md);color:var(--ink-soft);
    cursor:pointer;min-height:66px;
  }
  .picks button.good{border-color:var(--ok);background:#e8f2ec;color:var(--ok)}
  .picks button.bad{border-color:var(--no);background:#fbeae8;color:var(--no)}

  .readout{
    margin-top:12px;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px}
  .statechip.ok{background:var(--ok)} .statechip.no{background:var(--no)}
  .lead{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.4}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .two{display:flex;gap:10px;margin-top:14px}
  .card{flex:1;border:3px solid var(--line);border-radius:14px;padding:11px 9px;text-align:center}
  .card em{display:block;font-style:normal;font-size:var(--fs-cap);color:var(--ink-soft);
           font-weight:700;margin-bottom:5px}
  .card b{display:block;font-size:var(--fs-lg);font-weight:800;line-height:1.2}
  .card.let{border-color:var(--ink-soft)} .card.let b{color:var(--ink)}
  .card.snd{border-color:var(--trap)}     .card.snd b{color:var(--trap)}

  .rule{
    margin-top:14px;border:2px dashed var(--accent);background:#eef2f8;border-radius:14px;
    padding:12px 14px;font-size:var(--fs-xs);font-weight:700;color:var(--accent);line-height:1.6;
  }
  .rule b{background:#fff;border-radius:5px;padding:1px 6px}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}

  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .schip{
    border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;
    font:inherit;font-size:var(--fs-cap);font-weight:800;color:var(--ink);cursor:pointer;min-height:46px;
  }
  .schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .schip.done{border-color:var(--ok)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:52px;
  }
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--no);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.6}
  .fb.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "quiz quiz" "foot foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

<body>
<div class="wrap">

  <div class="bar">
    <span class="brand">AI4Kids · Grade 4 · English</span>
  </div>

  <div class="head">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  </div>

  <div class="tabs" role="group">
    <button type="button" id="tabSnd" aria-pressed="true">a ya an?</button>
    <button type="button" id="tabThe" aria-pressed="false">a/an ya the?</button>
    <button type="button" id="tabNil" aria-pressed="false">Kab kuch nahin</button>
  </div>

  <div class="left">
  <div class="scene" id="scene"></div>

  <div class="picks" id="picks"></div>

  <div class="readout">
    <span class="statechip" id="statechip"></span>
    <p class="lead" id="lead"></p>
    <p class="detail" id="detail"></p>
    <div class="two" id="two"></div>
    <p class="rule" id="rule"></p>
    <p class="why-note"><b>Ghaur karein:</b> <span id="whyText"></span></p>
  </div>
  </div>

  <div class="right">
  <div class="panel">
    <h2 id="panelHead"></h2>
    <div class="chips" id="chips" role="group"></div>
  </div>
  </div>

  <div class="quiz">
    <h2 id="quizHead" style="font-size:var(--fs-lg);font-weight:800;margin:0 0 18px">Apna imtihan lein</h2>
    <div id="quizBox"></div>
  </div>

  <footer>
    <p>AI4Kids — Islamabad ka do zabanon wala AI aur coding school. WhatsApp 0337 1468899</p>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var tab="snd";
  var sndI=0, sndPick=null, sndDone={};
  var theI=0, thePick=null, theDone={};
  var nilI=0, nilPick=null, nilDone={};

  /* trap:true ka matlab \u2014 harf aur awaaz ek dusre se ulat hain */
  var SND=[
    { w:"apple", art:"an", letter:"a", sound:"a", trap:false,
      u:"Harf bhi vowel, awaaz bhi vowel se shuru. Yahan koi pecheeda baat nahin \u2014 an apple." },
    { w:"book", art:"a", letter:"b", sound:"b", trap:false,
      u:"Harf bhi consonant, awaaz bhi. Seedha sa \u2014 a book." },
    { w:"hour", art:"an", letter:"h", sound:"aa", trap:true,
      u:"Yahan h bilkul bola hi nahin jata. Lafz shuru hota hai \u201caa\u201d ki awaaz se. Isi liye an hour, chahe h consonant hai." },
    { w:"university", art:"a", letter:"u", sound:"yu", trap:true,
      u:"u vowel hai, magar bolne mein \u201cyu\u201d aata hai \u2014 aur \u201cy\u201d consonant jaisi awaaz hai. Isi liye a university." },
    { w:"honest boy", art:"an", letter:"h", sound:"aa", trap:true,
      u:"Phir wohi baat: honest mein h khamosh hai. Awaaz \u201caa\u201d se shuru hoti hai, to an honest boy." },
    { w:"European country", art:"a", letter:"E", sound:"yu", trap:true,
      u:"E vowel hai magar bola jata hai \u201cyu-ro-pi-an\u201d. Awaaz consonant jaisi hai, to a European country." },
    { w:"umbrella", art:"an", letter:"u", sound:"um", trap:false,
      u:"Yeh u \u201cum\u201d bolta hai, \u201cyu\u201d nahin. Awaaz vowel wali hai, to an umbrella. University se moqabla karein \u2014 dono u se shuru, magar article alag!" },
    { w:"M.A. degree", art:"an", letter:"M", sound:"em", trap:true,
      u:"M consonant hai, magar padha jata hai \u201cem\u201d. Awaaz vowel se shuru hoti hai, to an M.A." },
    { w:"one-rupee note", art:"a", letter:"o", sound:"wun", trap:true,
      u:"o vowel hai, magar one bola jata hai \u201cwun\u201d. Awaaz consonant wali hai, to a one-rupee note." }
  ];

  /* a/an = pehli baar, koi bhi ek. the = woh wala jo pehle se maloom hai */
  var THE=[
    { s:"I saw ___ cat in the street. ___ cat was black.", ans:["a","The"],
      u:"Pehli baar zikr hua to \u201ca cat\u201d \u2014 koi bhi ek billi. Dusri baar aap dono jaante hain kaunsi, is liye \u201cThe cat\u201d." },
    { s:"Ali bought ___ book. ___ book was about space.", ans:["a","The"],
      u:"Wahi qaida: pehle a, phir the. English mein har nayi cheez pehle a/an se aati hai, aur us ke baad the se." },
    { s:"Look at ___ sun! It is very bright today.", ans:["the"],
      u:"Sooraj sirf ek hai \u2014 sab jaante hain kaunsa. Jis cheez ka koi muqabla hi na ho, us par hamesha the: the sun, the moon, the sky." },
    { s:"My father is ___ doctor.", ans:["a"],
      u:"Kaam ya peshe ke saath a/an aata hai: a doctor, a teacher, an engineer. Yahan yeh nahin bataya ja raha ke kaunsa doctor \u2014 sirf yeh ke woh doctor hain." },
    { s:"___ boy who won the race is my cousin.", ans:["The"],
      u:"Yahan saaf bataya ja raha hai ke kaunsa larka \u2014 jis ne race jeeti. Jab yeh maloom ho ke kaunsa wala, tab the." }
  ];

  /* yahan koi article nahin lagta */
  var NIL=[
    { s:"I go to ___ school every day.", nil:true, alt:"the",
      u:"Yahan school jaane ka maqsad bataya ja raha hai \u2014 parhne jana. Aise mauqe par kuch nahin lagta: go to school, go to bed, go to hospital.",
      w:"Agar aap kahen \u201cI went to the school to meet the principal\u201d to the sahi hai \u2014 kyunki ab aap imarat ki baat kar rahe hain, parhai ki nahin. Farq maqsad aur jagah ka hai." },
    { s:"___ cats are very clever animals.", nil:true, alt:"The",
      u:"Aam baat ho rahi hai \u2014 saari billiyan. Jab poori qism ki baat ho aur lafz jama (plural) ho, to kuch nahin lagta.",
      w:"\u201cThe cats are clever\u201d ka matlab ban jayega: woh khaas billiyan jo hum dono jaante hain. Article lagte hi baat aam se khaas ho jati hai." },
    { s:"We speak ___ Urdu at home.", nil:true, alt:"the",
      u:"Zabanon ke naam par article nahin lagta: Urdu, English, Punjabi, Arabic.",
      w:"Mulkon ke naam par bhi aksar nahin lagta \u2014 Pakistan, India. Magar kuch par lagta hai: the Netherlands, the USA. Yeh yaad rakhne wali cheez hai, qaide se nahin nikalti." },
    { s:"___ rice is grown in Pakistan.", nil:true, alt:"A",
      u:"Chawal ginne wali cheez nahin \u2014 aap \u201cone rice, two rice\u201d nahin kehte. Aisi cheezon par a/an kabhi nahin lagta.",
      w:"Paani, doodh, cheeni, hawa \u2014 sab aisi hi hain. Ginne ke liye alag lafz lagana parta hai: a glass of water, a kilo of rice." },
    { s:"___ Lahore is bigger than Multan.", nil:true, alt:"The",
      u:"Shehron aur logon ke naam par article nahin lagta: Lahore, Ahmed, Pakistan.",
      w:"Naam khud hi khaas hota hai \u2014 us ko khaas banane ke liye the ki zaroorat hi nahin rehti." },
    { s:"Please close ___ door.", nil:false, alt:"the",
      u:"Yahan the lagega. Kamre mein ek hi darwaza hai aur dono jaante hain kaunsa \u2014 is liye khaas hai.",
      w:"Yeh us se ulat misaal hai. Jab sunne wale ko maloom ho ke aap kis cheez ki baat kar rahe hain, to the zaroori hai." }
  ];

  function $(id){ return document.getElementById(id); }

  function say(text){
    try{
      if (!("speechSynthesis" in window)) return false;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.lang="en-US"; u.rate=0.72;
      window.speechSynthesis.speak(u);
      return true;
    }catch(e){ return false; }
  }

  function cards(list){
    var box=$("two"); box.innerHTML="";
    if (!list){ box.style.display="none"; return; }
    box.style.display="";
    list.forEach(function(c){
      var d=document.createElement("div"); d.className="card "+c[2];
      var em=document.createElement("em"); em.textContent=c[0];
      var b=document.createElement("b"); b.textContent=c[1];
      d.appendChild(em); d.appendChild(b); box.appendChild(d);
    });
  }

  function render(){
    ["Snd","The","Nil"].forEach(function(x){
      $("tab"+x).setAttribute("aria-pressed", tab===x.toLowerCase() ? "true":"false");
    });
    var scene=$("scene"), picks=$("picks"), chips=$("chips");
    scene.innerHTML=""; picks.innerHTML=""; chips.innerHTML="";
    var chip=$("statechip"); chip.className="statechip";

    if (tab==="snd"){
      var it=SND[sndI];
      $("title").textContent="a ya an? Faisla harf nahin, awaaz karti hai.";
      $("subtitle").textContent="Lafz sun kar dekhein ke woh kis awaaz se shuru hota hai, phir chunein.";
      $("panelHead").textContent="Koi lafz chunein";
      var w=document.createElement("p"); w.className="word";
      w.innerHTML='<span class="blank">___</span> ' + it.w;
      scene.appendChild(w);
      var hb=document.createElement("button"); hb.type="button"; hb.className="hear";
      hb.textContent="\uD83D\uDD0A Lafz sunein";
      hb.addEventListener("click", function(){
        if (!say(it.w)) hb.textContent="Is device par awaaz nahin chali";
      });
      scene.appendChild(hb);

      ["a","an"].forEach(function(opt){
        var b=document.createElement("button"); b.type="button"; b.textContent=opt;
        if (sndPick!==null)
          b.className = (opt===it.art) ? "good" : (opt===sndPick ? "bad":"");
        b.addEventListener("click", function(){
          if (sndPick!==null) return;
          sndPick=opt; sndDone[sndI]=true; say(it.art+" "+it.w); render();
        });
        picks.appendChild(b);
      });

      if (sndPick===null){
        chip.textContent="a ya an?";
        $("lead").textContent=""; $("detail").textContent="";
        cards(null);
      } else {
        var good = sndPick===it.art;
        chip.className="statechip " + (good ? "ok":"no");
        chip.textContent = good ? "Bilkul theek" : "Dobara dekhein";
        $("lead").textContent = it.art + " " + it.w;
        $("detail").textContent = it.u;
        cards([["Pehla harf", it.letter, "let"], ["Pehli awaaz", it.sound, "snd"]]);
      }
      $("rule").innerHTML = "Asal qaida: <b>vowel ki awaaz</b> se shuru ho to <b>an</b>, warna <b>a</b>. Qaida <b>harf</b> ka nahin, <b>awaaz</b> ka hai.";
      $("whyText").innerHTML = "Kitabon mein aksar likha hota hai \u201cvowel se pehle an\u201d \u2014 aur yehi ghalat-fehmi ki jarh hai. <b>university</b> u se shuru hota hai magar \u201ca\u201d leta hai, aur <b>hour</b> h se shuru hota hai magar \u201can\u201d leta hai. Lafz likha hua dekhne ke bajaye <b>bol kar</b> dekhein \u2014 jawab khud mil jayega.";
      SND.forEach(function(x,i){
        var b=document.createElement("button"); b.type="button";
        b.className="schip" + (sndDone[i] ? " done":"") ;
        b.textContent=x.w.split(" ")[0] + (sndDone[i] ? " \u2605":"");
        b.setAttribute("aria-pressed", i===sndI ? "true":"false");
        b.addEventListener("click", function(){ sndI=i; sndPick=null; render(); });
        chips.appendChild(b);
      });
      return;
    }

    if (tab==="the"){
      var th=THE[theI];
      $("title").textContent="a/an nayi cheez ke liye. the us cheez ke liye jo pehle se maloom ho.";
      $("subtitle").textContent="Urdu mein aisa koi lafz hota hi nahin, isi liye yeh mushkil lagta hai.";
      $("panelHead").textContent="Koi jumla chunein";
      var sp=document.createElement("p"); sp.className="sentence";
      var parts=th.s.split("___");
      var html=parts[0];
      for (var i=0;i<th.ans.length;i++){
        html += (thePick ? "<mark>"+th.ans[i]+"</mark>" : '<span class="blank">___</span>') + (parts[i+1]||"");
      }
      sp.innerHTML=html; scene.appendChild(sp);

      var opts = th.ans.length>1 ? ["a \u2026 The","The \u2026 a"]
               : (th.ans[0].toLowerCase()==="the" ? ["a","the"] : ["a","the"]);
      opts.forEach(function(opt,oi){
        var b=document.createElement("button"); b.type="button"; b.textContent=opt;
        var isRight = th.ans.length>1 ? (oi===0)
                    : (opt.toLowerCase()===th.ans[0].toLowerCase());
        if (thePick!==null)
          b.className = isRight ? "good" : (opt===thePick ? "bad":"");
        b.addEventListener("click", function(){
          if (thePick!==null) return;
          thePick=opt; theDone[theI]=true; render();
        });
        picks.appendChild(b);
      });

      if (thePick===null){
        chip.textContent="Kaunsa article?";
        $("lead").textContent=""; $("detail").textContent="";
      } else {
        chip.className="statechip ok";
        chip.textContent="Jawab";
        $("lead").textContent=th.ans.join("  \u2026  ");
        $("detail").textContent=th.u;
      }
      cards(null);
      $("rule").innerHTML = "<b>a / an</b> = koi bhi ek, pehli baar. <b>the</b> = wohi wala, jo sunne wale ko pehle se maloom hai.";
      $("whyText").innerHTML = "Urdu bolne walon ke liye yeh sab se mushkil hissa hai, kyunki <b>Urdu mein article hota hi nahin</b>. \u201cMaine billi dekhi\u201d aur \u201cmaine woh billi dekhi\u201d \u2014 Urdu mein farq \u201cwoh\u201d se aata hai. English mein wohi kaam <b>the</b> karta hai.";
      THE.forEach(function(x,i){
        var b=document.createElement("button"); b.type="button";
        b.className="schip" + (theDone[i] ? " done":"");
        b.textContent=String(i+1)+(theDone[i]?" \u2605":"");
        b.setAttribute("aria-pressed", i===theI ? "true":"false");
        b.addEventListener("click", function(){ theI=i; thePick=null; render(); });
        chips.appendChild(b);
      });
      return;
    }

    var nl=NIL[nilI];
    $("title").textContent="Kabhi kabhi koi article lagta hi nahin.";
    $("subtitle").textContent="Yeh woh jagah hai jahan Pakistani English mein sab se zyada article zyada lag jata hai.";
    $("panelHead").textContent="Koi jumla chunein";
    var sp2=document.createElement("p"); sp2.className="sentence";
    var shown = nilPick===null ? '<span class="blank">___</span>'
              : (nl.nil ? "<mark>(kuch nahin)</mark>" : "<mark>"+nl.alt+"</mark>");
    sp2.innerHTML = shown + nl.s.slice(3);
    scene.appendChild(sp2);

    [["nil","Kuch nahin"],["art", nl.alt]].forEach(function(o){
      var b=document.createElement("button"); b.type="button"; b.textContent=o[1];
      var isRight = (o[0]==="nil") === nl.nil;
      if (nilPick!==null)
        b.className = isRight ? "good" : (o[0]===nilPick ? "bad":"");
      b.addEventListener("click", function(){
        if (nilPick!==null) return;
        nilPick=o[0]; nilDone[nilI]=true; render();
      });
      picks.appendChild(b);
    });

    if (nilPick===null){
      chip.textContent="Article lagega ya nahin?";
      $("lead").textContent=""; $("detail").textContent="";
    } else {
      var ok2 = (nilPick==="nil")===nl.nil;
      chip.className="statechip " + (ok2 ? "ok":"no");
      chip.textContent = ok2 ? "Bilkul theek" : "Dobara dekhein";
      $("lead").textContent = nl.nil ? "Yahan koi article nahin lagta." : "Yahan the lagega.";
      $("detail").textContent = nl.u;
    }
    cards(null);
    $("rule").innerHTML = "Article nahin lagta: <b>jama mein aam baat</b> (cats are clever), <b>na ginne wali cheezein</b> (rice, water), <b>naam</b> (Lahore, Urdu), aur <b>maqsad wale jumle</b> (go to school).";
    $("whyText").innerHTML = nl.w;
    NIL.forEach(function(x,i){
      var b=document.createElement("button"); b.type="button";
      b.className="schip" + (nilDone[i] ? " done":"");
      b.textContent=String(i+1)+(nilDone[i]?" \u2605":"");
      b.setAttribute("aria-pressed", i===nilI ? "true":"false");
      b.addEventListener("click", function(){ nilI=i; nilPick=null; render(); });
      chips.appendChild(b);
    });
  }

  ["Snd","The","Nil"].forEach(function(x){
    $("tab"+x).addEventListener("click", function(){
      var m=x.toLowerCase();
      if (tab===m) return;
      try{ window.speechSynthesis.cancel(); }catch(e){}
      tab=m; sndPick=null; thePick=null; nilPick=null; render();
    });
  });

  var QUIZ=[
    { q:"Sahi kaunsa hai: ___ hour",
      o:["a hour","an hour","the hour sirf","koi nahin"], a:1,
      f:"h yahan bilkul bola nahin jata. Lafz \u201caa-war\u201d bolte hain, yaani vowel ki awaaz se shuru \u2014 is liye an hour." },
    { q:"Sahi kaunsa hai: ___ university",
      o:["an university","a university","the university sirf","koi nahin"], a:1,
      f:"u vowel hai magar bolne mein \u201cyu\u201d aata hai, jo consonant jaisi awaaz hai \u2014 is liye a university. Harf vowel hai, awaaz nahin." },
    { q:"a/an lagane ka asal qaida kya hai?",
      o:["Pehla harf vowel ho to an","Pehli awaaz vowel ki ho to an","Lafz lamba ho to an","Lafz naya ho to an"],
      a:1,
      f:"Qaida hamesha awaaz ka hai. Isi liye an hour aur a university dono sahi hain, halanke harf ulta ishara kar rahe hain." },
    { q:"\u201cI saw ___ cat. ___ cat was black.\u201d Khali jagahon mein kya aayega?",
      o:["the \u2026 a","a \u2026 The","a \u2026 a","the \u2026 the"], a:1,
      f:"Pehli baar zikr hua to a \u2014 koi bhi ek billi. Dusri baar dono jaante hain kaunsi, is liye The." },
    { q:"\u201cLook at ___ sun.\u201d Kya aayega?",
      o:["a","an","the","kuch nahin"], a:2,
      f:"Sooraj sirf ek hai, sab ko maloom hai kaunsa. Aisi cheezon par hamesha the: the sun, the moon, the sky." },
    { q:"\u201cI go to ___ school every day.\u201d",
      o:["a","the","kuch nahin","an"], a:2,
      f:"Yahan parhne jaane ka maqsad bataya ja raha hai, imarat ki baat nahin. Is liye kuch nahin: go to school, go to bed." },
    { q:"\u201c___ rice is grown in Pakistan.\u201d",
      o:["A","An","The","Kuch nahin"], a:3,
      f:"Chawal ginne wali cheez nahin \u2014 \u201cone rice, two rice\u201d nahin kehte. Aisi cheezon par a/an kabhi nahin lagta, aur yahan aam baat ho rahi hai is liye the bhi nahin." },
    { q:"Urdu bolne walon ko article mushkil kyun lagte hain?",
      o:["Kyunki woh mushkil alfaz hain","Kyunki Urdu mein article hota hi nahin","Kyunki woh chhote hain","Kyunki teen hain"],
      a:1,
      f:"Urdu mein \u201ca cat\u201d aur \u201cthe cat\u201d dono sirf \u201cbilli\u201d hain. Farq \u201cwoh\u201d lagane se aata hai. English mein wohi kaam the karta hai \u2014 is liye yeh seekhna parta hai, apne aap nahin aata." }
  ];

  function buildQuiz(){
    var box=$("quizBox"); box.innerHTML="";
    QUIZ.forEach(function(item){
      var wrap=document.createElement("div"); wrap.className="q";
      var q=document.createElement("p"); q.textContent=item.q; wrap.appendChild(q);
      var fb=document.createElement("p"); fb.className="fb";
      item.o.forEach(function(opt,oi){
        var b=document.createElement("button"); b.type="button"; b.className="opt";
        b.textContent=opt;
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done")==="1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x,xi){
            if (xi===item.a) x.classList.add("right");
            else if (xi===oi) x.classList.add("wrong");
          });
          fb.textContent=item.f; fb.classList.add("show");
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb); box.appendChild(wrap);
    });
  }

  buildQuiz();
  render();
})();
</script>
</body>
</html>
