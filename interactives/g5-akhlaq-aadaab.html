  .save-choices button.wrong{border-color:var(--left);background:#fbeae8}
  .map-row{
    position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:8px;

    flex:1 1 28%;min-width:90px;border:2.5px solid var(--ink);border-radius:16px;

  .readout{

  .statechip.miss{background:var(--left)}
  .headline{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}

  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

    display:none;
  }
  .hintbox.show{display:block}
  body.urdu .hintbox{line-height:var(--lh)}
  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .prog{margin:0 0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft)}
  .btns{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}
  .btns button{
    border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);

    padding:8px 14px;flex:1;

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}

  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);

  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--left);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar" "head  head" "tabs  tabs" "story story"
        "left  right" "quiz  quiz" "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .story{grid-area:story} .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation:none !important}
  }

    setText($("statechip"), (mannersIdx+1) + " / " + MANNERS.length);
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (mannersDone[ch.id]?" win":"");

      setText(pad.querySelector(".bad-bin h3"), t(T.badLab));

      ["good","bad"].forEach(function(bin){

        el.title = t(CARDS[id]);
        el.addEventListener("click", function(e){
          e.stopPropagation();
          if (mannersDone[ch.id]) return;
          delete mannersSort[id];
          renderManners();
        });
        (bin==="good"?$("binGood"):$("binBad")).appendChild(el);
      });

      var bank = document.createElement("div");
      bank.className = "bank";
      ch.items.forEach(function(id){
        if (mannersSort[id]) return;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "item-card" + (mannersSelected===id?" selected":"");
        b.innerHTML = '<span class="item-em">'+CARDS[id].em+'</span><p class="item-lab"></p>';
        setText(b.querySelector(".item-lab"), t(CARDS[id]));
        b.addEventListener("click", function(){
          if (mannersDone[ch.id]) return;
          mannersSelected = id;
          renderManners();
        });
        bank.appendChild(b);
      });
      box.appendChild(bank);

      if (!mannersDone[ch.id]){
        var chk = document.createElement("button");
        chk.type = "button";
        chk.style.cssText = "margin-top:10px;width:100%;border:2px solid var(--ink);border-radius:14px;background:var(--ink);color:var(--paper);font:inherit;font-weight:800;min-height:48px;cursor:pointer";
        setText(chk, t(T.checkSort));
        chk.addEventListener("click", function(){
          var ok = true;
          ch.items.forEach(function(id){
            if (mannersSort[id] !== CARDS[id].bin) ok = false;
          });
          if (ok && Object.keys(mannersSort).filter(function(k){ return ch.items.indexOf(k)>=0; }).length === ch.items.length){
            mannersDone[ch.id] = true;
            award("manners-"+ch.id, 1);
            setText($("headline"), t(ch.done));
            $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
            setText($("statechip"), t(T.nice));
            maybeMannersDone();
            renderManners();
          } else {
            setText($("headline"), t(T.oops));
            $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
            setText($("statechip"), t(T.oops));
          }
        });
        box.appendChild(chk);
      }

      setText($("headline"), mannersDone[ch.id] ? t(ch.done) : t(ch.title));
      setText($("detail"), mannersSelected ? t(CARDS[mannersSelected]) + " → ?" : t(T.askSort));
    } else {
      var card = CARDS[ch.card];
      pad.innerHTML = skyHTML() +
        '<div class="comic-stage">' + kidsSVG() +
        '<div class="comic-panel"><span class="em">'+card.em+'</span><span class="plab"></span></div></div>';
      setText(pad.querySelector(".plab"), t(card));

      setText($("headline"), mannersDone[ch.id] ? t(ch.done) : t(ch.title));
      setText($("detail"), t(T.askPick));

      var choices = document.createElement("div");
      choices.className = "save-choices";
      [
        {id:"good", em:"💚", en:"Good manners", ur:"اچھے آداب"},
        {id:"bad", em:"🚫", en:"Bad manners", ur:"برے آداب"}
      ].forEach(function(c){
        var b = document.createElement("button");
        b.type = "button";
        if (mannersDone[ch.id] && c.id === card.bin) b.classList.add("right");
        b.innerHTML = '<span class="cem">'+c.em+'</span><span class="clab"></span>';
        setText(b.querySelector(".clab"), t(c));
        b.disabled = !!mannersDone[ch.id];
        b.addEventListener("click", function(){
          if (mannersDone[ch.id]) return;
          if (c.id === card.bin){
            mannersDone[ch.id] = true;
            award("manners-"+ch.id, 1);
            b.classList.add("right");
            setText($("headline"), t(ch.done));
            $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
            setText($("statechip"), t(T.nice));
            maybeMannersDone();
            renderManners();
          } else {
            b.classList.add("wrong");
            setText($("headline"), t(T.oops));
            $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
            setText($("statechip"), t(T.oops));
            setTimeout(function(){ b.classList.remove("wrong"); }, 600);
          }
        });
        choices.appendChild(b);
      });
      box.appendChild(choices);
    }
    setText($("prog"), t(T.progM) + ": " + Object.keys(mannersDone).length + "/" + MANNERS.length);
  }

  /* ---------- SCENES ---------- */
  function renderScenes(){
    var ch = SCENES[scenesIdx];
    var pad = $("scenePad");
    pad.innerHTML = skyHTML() +
      '<div class="comic-stage"><div class="comic-hero">'+ch.hero+'</div>' +
      '<div class="comic-panel"><span class="em">🧒</span><span class="plab"></span></div></div>';
    setText(pad.querySelector(".plab"), t(ch.title));

    setText($("statechip"), (scenesIdx+1) + " / " + SCENES.length);
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (scenesDone[ch.id]?" win":"");
    if (scenesDone[ch.id]) setText($("statechip"), t(T.nice));
    setText($("headline"), scenesDone[ch.id] ? t(ch.done) : t(ch.title));
    setText($("detail"), t(ch.prompt));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    var choices = document.createElement("div");
    choices.className = "save-choices";
    ch.choices.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button";
      if (scenesDone[ch.id] && c.id === ch.correct) b.classList.add("right");
      b.innerHTML = '<span class="cem">'+c.em+'</span><span class="clab"></span>';
      setText(b.querySelector(".clab"), t(c));
      b.disabled = !!scenesDone[ch.id];
      b.addEventListener("click", function(){
        if (scenesDone[ch.id]) return;
        if (c.id === ch.correct){
          scenesDone[ch.id] = true;
          award("scenes-"+ch.id, 1);
          b.classList.add("right");
          setText($("headline"), t(ch.done));
          $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.nice));
          maybeScenesDone();
          tabBadges();
          renderScenes();
        } else {
          b.classList.add("wrong");
          setText($("headline"), t(T.oops));
          $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.oops));
          setTimeout(function(){ b.classList.remove("wrong"); }, 600);
        }
      });
      choices.appendChild(b);
    });
    box.appendChild(choices);
    setText($("prog"), t(T.progS) + ": " + Object.keys(scenesDone).length + "/" + SCENES.length);
  }

  /* ---------- MAP ---------- */
  function renderMap(){
    var ch = MAP[mapIdx];
    var pad = $("scenePad");
    if (mapDone.a1) mapPlaces.home = true;
    if (mapDone.a2) mapPlaces.school = true;
    if (mapDone.a3) mapPlaces.hood = true;

    pad.innerHTML = skyHTML() +
      '<div class="map-row">' +
        '<div class="map-node home'+(mapPlaces.home?" done":"")+'"><span class="nem">🏠</span><p class="nlab" id="mapHome"></p></div>' +
        '<span class="map-arrow">→</span>' +
        '<div class="map-node school'+(mapPlaces.school?" done":"")+'"><span class="nem">🏫</span><p class="nlab" id="mapSchool"></p></div>' +
        '<span class="map-arrow">→</span>' +
        '<div class="map-node hood'+(mapPlaces.hood?" done":"")+'"><span class="nem">🤝</span><p class="nlab" id="mapHood"></p></div>' +
      '</div>';
    setText($("mapHome"), t(T.home));
    setText($("mapSchool"), t(T.school));
    setText($("mapHood"), t(T.hood));

    setText($("statechip"), (mapIdx+1) + " / " + MAP.length);
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (mapDone[ch.id]?" win":"");
    if (mapDone[ch.id]) setText($("statechip"), t(T.nice));
    setText($("headline"), mapDone[ch.id] ? t(ch.done) : t(ch.title));
    setText($("detail"), t(ch.prompt));
    $("hintbox").classList.remove("show");

    var box = $("actionBox");
    box.innerHTML = "";
    var choices = document.createElement("div");
    choices.className = "save-choices";
    ch.choices.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button";
      if (mapDone[ch.id] && c.id === ch.correct) b.classList.add("right");
      b.innerHTML = '<span class="cem">'+c.em+'</span><span class="clab"></span>';
      setText(b.querySelector(".clab"), t(c));
      b.disabled = !!mapDone[ch.id];
      b.addEventListener("click", function(){
        if (mapDone[ch.id]) return;
        if (c.id === ch.correct){
          mapDone[ch.id] = true;
          if (ch.place === "home") mapPlaces.home = true;
          if (ch.place === "school") mapPlaces.school = true;
          if (ch.place === "hood") mapPlaces.hood = true;
          award("map-"+ch.id, 1);
          b.classList.add("right");
          setText($("headline"), t(ch.done));
          $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.nice));
          maybeMapDone();
          tabBadges();
          renderMap();
        } else {
          b.classList.add("wrong");
          setText($("headline"), t(T.oops));
          $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
          setText($("statechip"), t(T.oops));
          setTimeout(function(){ b.classList.remove("wrong"); }, 600);
        }
      });
      choices.appendChild(b);
    });
    box.appendChild(choices);
    setText($("prog"), t(T.progA) + ": " + Object.keys(mapDone).length + "/" + MAP.length);
  }

  /* ---------- QUIZ ---------- */
  function pickQuiz(){ quizSet = shuffle(QUIZ).slice(0, 5); }
  function renderQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizSet.forEach(function(item, qi){
      var wrap = document.createElement("div");
      wrap.className = "q";
      var p = document.createElement("p");
      if (lang === "ur"){
        p.textContent = isolate((qi+1) + ". " + t(item.q));
        p.classList.remove("ur");
        p.setAttribute("dir", "ltr");
        p.style.fontFamily = '"Baloo Bhaijaan 2",sans-serif';
        p.style.lineHeight = "1.5";
      } else {
        setText(p, (qi+1) + ". " + t(item.q));
      }
      wrap.appendChild(p);
      var answered = false;
      item.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        if (lang === "ur"){
          b.className = "opt";
          b.textContent = isolate(t(opt));
          b.setAttribute("dir", "ltr");
          b.style.textAlign = "left";
          b.style.fontFamily = '"Baloo Bhaijaan 2",sans-serif';
        } else {
          b.className = "opt";
          setText(b, t(opt));
        }
        b.addEventListener("click", function(){
          if (answered) return;
          answered = true;
          if (oi === item.correct){
            b.classList.add("right");
            award("quiz-"+qi, 1);
          } else {
            b.classList.add("wrong");
            var kids = wrap.querySelectorAll(".opt");
            if (kids[item.correct]) kids[item.correct].classList.add("right");
          }
          fb.classList.add("show");
        });
        wrap.appendChild(b);
      });
      var fb = document.createElement("p");
      fb.className = "fb";
      if (lang === "ur"){
        fb.textContent = isolate(t(item.why));
        fb.setAttribute("dir", "ltr");
        fb.style.fontFamily = '"Baloo Bhaijaan 2",sans-serif';
      } else {
        setText(fb, t(item.why));
      }
      wrap.appendChild(fb);
      box.appendChild(wrap);
    });
  }

  function storyHtml(){
    if (mode === "manners") return t(T.storyManners);
    if (mode === "scenes") return t(T.storyScenes);
    return t(T.storyMap);
  }

  function tabBadges(){
    function lab(btn, label, key){
      btn.innerHTML = "";
      var span = document.createElement("span");
      setText(span, t(label));
      btn.appendChild(span);
      if (doneModes[key]){
        var b = document.createElement("span");
        b.className = "badge"; b.textContent = " ★";
        btn.appendChild(b);
      }
    }
    lab($("tabManners"), T.tabManners, "manners");
    lab($("tabScenes"), T.tabScenes, "scenes");
    lab($("tabMap"), T.tabMap, "map");
    $("tabManners").setAttribute("aria-pressed", mode==="manners"?"true":"false");
    $("tabScenes").setAttribute("aria-pressed", mode==="scenes"?"true":"false");
    $("tabMap").setAttribute("aria-pressed", mode==="map"?"true":"false");
  }

  function setMode(m){
    mode = m;
    mannersSelected = null;
    if (mode === "manners") renderManners();
    else if (mode === "scenes") renderScenes();
    else renderMap();
    applyChrome();
  }

  function applyChrome(){
    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    $("story").innerHTML = storyHtml();
    $("story").classList.toggle("ur", lang==="ur");
    $("story").setAttribute("dir", lang==="ur"?"rtl":"ltr");
    setText($("ctlHead"), t(T.ctl));
    setText($("nextBtn"), t(T.next));
    setText($("hintBtn"), t(T.hint));
    setText($("resetBtn"), t(T.reset));
    setText($("quizHead"), t(T.quiz));
    setText($("newQuiz"), t(T.newQuiz));
    $("langBtn").textContent = (lang === "en") ? "اردو" : "EN";
    $("langBtn").setAttribute("aria-pressed", lang==="ur"?"true":"false");
    document.body.classList.toggle("urdu", lang==="ur");
    document.documentElement.lang = (lang==="ur") ? "ur" : "en";
    document.documentElement.dir = (lang==="ur") ? "rtl" : "ltr";
    tabBadges();
    var foot = document.querySelector("footer p");
    if (foot) setText(foot, foot.getAttribute(lang==="ur"?"data-ur":"data-en"));
  }

  function applyLang(){
    applyChrome();
    if (mode === "manners") renderManners();
    else if (mode === "scenes") renderScenes();
    else renderMap();
    renderQuiz();
  }

  function next(){
    if (mode === "manners"){
      mannersIdx = (mannersIdx + 1) % MANNERS.length;
      mannersSelected = null;
      if (MANNERS[mannersIdx].type === "sort"){
        mannersSort = {};
      }
      renderManners();
    } else if (mode === "scenes"){
      scenesIdx = (scenesIdx + 1) % SCENES.length;
      renderScenes();
    } else {
      mapIdx = (mapIdx + 1) % MAP.length;
      renderMap();
    }
  }

  function showHint(){
    var h;
    if (mode === "manners") h = MANNERS[mannersIdx].hint;
    else if (mode === "scenes") h = SCENES[scenesIdx].hint;
    else h = MAP[mapIdx].hint;
    var hb = $("hintbox");
    setText(hb, t(h));
    hb.classList.add("show");
  }

  function resetMode(){
    if (mode === "manners"){
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("manners-")===0 || k==="mode-manners") delete awarded[k]; });
      mannersDone = {}; mannersSort = {}; mannersSelected = null; mannersIdx = 0;
      doneModes.manners = false;
      recountStars(); renderManners();
    } else if (mode === "scenes"){
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("scenes-")===0 || k==="mode-scenes") delete awarded[k]; });
      scenesDone = {}; scenesIdx = 0; doneModes.scenes = false;
      recountStars(); renderScenes();
    } else {
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("map-")===0 || k==="mode-map") delete awarded[k]; });
      mapDone = {}; mapIdx = 0; mapPlaces = {home:false, school:false, hood:false}; doneModes.map = false;
      recountStars(); renderMap();
    }
    tabBadges();
    applyChrome();
  }

  function cleanSpeakText(s){
    return String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  function buildSpeakText(){
    var bits = [];
    bits.push(t(T.title));
    bits.push(cleanSpeakText(storyHtml()));
    bits.push(cleanSpeakText(($("headline") && $("headline").textContent) || ""));
    bits.push(cleanSpeakText(($("detail") && $("detail").textContent) || ""));
    bits.push(t(T.tip));
    return bits.filter(Boolean).join(". ");
  }
  function pickVoice(voices, want){
    var i, v, L;
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf(want) === 0) return v;
    }
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf("en") === 0) return v;
    }
    return voices[0] || null;
  }
  var speakTimer = null;
  function setSpeaking(on){
    var btn = $("speakBtn");
    if (!btn) return;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.style.opacity = on ? "0.65" : "";
  }
  function doSpeak(text, asLang){
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92;
    u.lang = (asLang === "ur") ? "ur-PK" : "en-US";
    var voices = window.speechSynthesis.getVoices() || [];
    var voice = pickVoice(voices, asLang === "ur" ? "ur" : "en");
    if (voice) u.voice = voice;
    u.onstart = function(){ setSpeaking(true); };
    u.onend = function(){ setSpeaking(false); };
    u.onerror = function(){
      setSpeaking(false);
      if (asLang === "ur"){
        var fallback = cleanSpeakText(T.title.en + ". " + T.storyManners.en + ". " + T.tip.en);
        var u2 = new SpeechSynthesisUtterance(fallback);
        u2.lang = "en-US"; u2.rate = 0.92;
        var v2 = pickVoice(window.speechSynthesis.getVoices() || [], "en");
        if (v2) u2.voice = v2;
        u2.onstart = function(){ setSpeaking(true); };
        u2.onend = u2.onerror = function(){ setSpeaking(false); };
        window.speechSynthesis.speak(u2);
      }
    };
    window.speechSynthesis.speak(u);
  }
  if ("speechSynthesis" in window){
    try { window.speechSynthesis.getVoices(); } catch (e0) {}
    if (typeof window.speechSynthesis.addEventListener === "function"){
      window.speechSynthesis.addEventListener("voiceschanged", function(){
        try { window.speechSynthesis.getVoices(); } catch (e1) {}
      });
    }
  } else {
    var noBtn = $("speakBtn");
    if (noBtn){ noBtn.disabled = true; noBtn.title = "Voice not available on this device"; }
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });
  $("tabManners").addEventListener("click", function(){ setMode("manners"); });
  $("tabScenes").addEventListener("click", function(){ setMode("scenes"); });
  $("tabMap").addEventListener("click", function(){ setMode("map"); });
  $("nextBtn").addEventListener("click", next);
  $("hintBtn").addEventListener("click", showHint);
  $("resetBtn").addEventListener("click", resetMode);
  $("newQuiz").addEventListener("click", function(){ pickQuiz(); renderQuiz(); });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      var text = buildSpeakText();
      if (!text) return;
      if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
      window.speechSynthesis.cancel();
      setSpeaking(false);
      var speakLang = lang;
      speakTimer = setTimeout(function(){
        speakTimer = null;
        doSpeak(text, speakLang);
      }, 80);
    }catch(e){ setSpeaking(false); }
  });

  pickQuiz();
  applyLang();
})();
</script>
</body>
</html>
