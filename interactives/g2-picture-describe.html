\n\1</head><body><main class="wrap"><div class="bar"><span id="brand" class="brand"></span><button id="lang" class="chip" aria-pressed="false">Roman Urdu</button><button id="speak" class="chip" aria-label="Play">🔊</button></div><header><h1 id="title"></h1><p id="sub" class="sub"></p></header><nav id="tabs" class="tabs"></nav><div class="columns"><div id="left"></div><div id="right"></div></div><div id="lessons"></div><section class="quiz"><h2 id="qh"></h2><div id="quiz"></div><div id="score" class="score"></div></section><footer id="foot"></footer></main><script>const DATA={"title":{"en":"Picture describe karo","ur":"Picture describe karo"},"desc":{"en":"Tasveeron ke baare mein batao","ur":"Tasveeron ke baare mein batao"},"sections":[{"key":"hook","tag":{"en":"HOOK","ur":"HOOK"},"body":{"en":"A picture can tell a story without words. What can you see, where is it, and how do people feel? Today we will describe pictures with clear words.","ur":"Aao bachon, socho agar aap ka paas ek khubsurat tasveer ho, jo aapke dosto ko dikhani ho. Aapko kya kehna pasand hoga? Kya aap bata sakte ho ke us tasveer mein kya hai? Aaj hum yehi seekhenge!"}},{"key":"samjhao","tag":{"en":"SAMJHAO","ur":"SAMJHAO"},"body":{"en":"First name the place and big things. Notice colours, size, position, actions, and feelings. Adjectives such as bright, small, red, happy, and busy make a description interesting.","ur":"Tasveeren sirf dekhne ke liye nahi hoti, balke unmein kahaniyan hoti hain. Jab hum kisi tasveer ko dekhte hain, to hum uski details par nazar dalte hain. Pehle hum dekhenge ke tasveer kya dikhati hai. Jaise ke ek larki aur larka bazaar mein khush hain, ya phir ek cricket match ki tasveer.\n\nPhir hum us tasveer ke rang aur chehron ki feelings par bhi tawajju dete hain. Kya woh muskurate hain ya phir serious hain? Isse hum tasveer ka asal maqsad samajhte hain. Tasveer ko describe karne ke liye humein adjectives ki bhi madad leni hoti hai. Jaise: khoobsurat, rang-birangi, ya chashmash.\n\nAb samjho, agar tasveer mein ek rickshaw hai, to hum keh sakte hain ke wo chota aur laal rang ka hai us mein ek aadmi baitha hua hai. Hum yeh bhi keh sakte hain ke rickshaw ke as paas bohot saare log hain jo is taraf dekh rahe hain.\n\nJab hum tasveer ko describe karte hain, to humein behtar safar or ehsaas de sakti hai. Humari soch ko dohraati hai aur humein us lamhe mein le jaati hai, jise tasveer ne qaid kiya hai."}},{"key":"misaal","tag":{"en":"MISAAL","ur":"MISAAL"},"body":{"en":"Imagine a busy street: “This is a bright street. A red rickshaw is near a shop. Two happy children are walking.”","ur":"Chalo ab hum ek example lete hain. Socho, aap bazaar gaye hain. Aapne ek tasveer liye, jis me ek stall hai jo biryani bech raha hai. Aap tasveer describe karte hain: \"Yeh tasveer ek bazaar ki hai. Stall bohot bada hai aur biryani ke deggay haseen hain. Log wahan khade hain aur unka chehra khushi se bhara hua hai. Ek aurat apne bacho ke saath hai jo khush ho kar biryani kharid rahi hai.\""}},{"key":"karo","tag":{"en":"KARO","ur":"KARO"},"body":{"en":"Choose a picture at home or school. Say where it is, what you see, and what people are doing. Use at least two adjectives.","ur":"Ab aap khud say ek tasveer dhoondna hai. Yeh tasveer ghar, school, ya outdoor se ho sakti hai. Jab aap tasveer lein, to uski details par hamesha tawajju dein. Phir woh tasveer doston ko dikhayein aur uska description dein. Koshish karein ke adjectives ka istemal zaroor karen!\n\n## SAWAAL\n1. Tasveer describe karne se humein kya faida hota hai?\n2. Kya aap ek tasveer ke kuch adjectives bata sakte hain?\n3. Jab aap bazaar jaate hain, to kaun kaun si cheezon ki tasveeren le sakte hain?\n\nBye, take care! \nEnglish Ma'am"}}],"quiz":[{"q":{"en":"What place is shown in the picture question?","ur":"Tasveer mein kahan ka nazara hai?"},"opts":[{"en":"A street scene","ur":"Gali ka nazara"},{"en":"A sea scene","ur":"Samundar ka nazara"},{"en":"A mountain scene","ur":"Parbat ka nazara"},{"en":"A field
