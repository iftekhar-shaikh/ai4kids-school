<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Automatic Gate — آٹومیٹک گیٹ | AI4Kids Grade 4 Automation & Robotics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#eef0f5; --board-deep:#dde1ea;
  --accent:#1d4c85; --accent2:#c9702e; --ok:#2e7d4f; --no:#c4453a;
  --ink:#1f2933; --ink-soft:#4a5661; --paper:#fdfaf3; --line:#ded5c4;
  --fs-cap:clamp(14px, 3.8vw, 16px); --fs-xs:clamp(16px, 4.2vw, 18px);
  --fs-sm:clamp(18px, 4.8vw, 20px); --fs-md:clamp(19px, 5.2vw, 22px);
  --fs-lg:clamp(22px, 6vw, 26px); --fs-xl:clamp(30px, 8vw, 38px); --lh:1.55;
}
body.urdu{
  --fs-cap:clamp(17px, 4.4vw, 18px); --fs-xs:clamp(18px, 4.7vw, 20px);
  --fs-sm:clamp(20px, 5.2vw, 22px); --fs-md:clamp(21px, 5.6vw, 24px);
  --fs-lg:clamp(24px, 6.4vw, 28px); --fs-xl:clamp(28px, 7.4vw, 34px); --lh:2.05;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
  font-size:var(--fs-sm);line-height:1.55;padding:0 0 40px;
}
body.urdu{font-family:"Noto Nastaliq Urdu","Baloo Bhaijaan 2",serif;line-height:var(--lh)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px;flex-wrap:wrap}
.brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
.chip{
  border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
  font-size:var(--fs-xs);cursor:pointer;min-height:44px;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:focus-visible,button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
h1{font-size:var(--fs-xl);line-height:1.25;font-weight:800;margin:8px 0 4px}
body.urdu h1{line-height:1.9}
.sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
.tabs{display:flex;gap:7px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{
  flex:1;min-width:88px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
  font-size:var(--fs-cap);cursor:pointer;min-height:54px;
}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.scene{
  position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
  background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  min-height:200px;
}
.scene svg,.scene canvas{display:block;width:100%;height:auto}
.play{
  width:100%;margin-top:12px;border:3px solid var(--ink);border-radius:18px;
  background:var(--ink);color:var(--paper);font:inherit;font-weight:800;
  font-size:var(--fs-md);cursor:pointer;min-height:60px;
}
.play:active{transform:scale(.98)}
.play.alt{background:var(--paper);color:var(--ink)}
.play.go{background:var(--ok);border-color:var(--ok)}
.play.stop{background:var(--no);border-color:var(--no)}
.play.hidden,.hidden{display:none !important}
.two{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.card{flex:1;min-width:110px;border:3px solid var(--line);border-radius:16px;padding:12px 9px;text-align:center;cursor:pointer}
.card em{display:block;font-style:normal;font-size:var(--fs-cap);color:var(--ink-soft);font-weight:700;margin-bottom:5px}
.card b{display:block;font-size:var(--fs-lg);font-weight:800;line-height:1.2}
.card span{display:block;font-size:var(--fs-cap);font-weight:700;color:var(--ink-soft);margin-top:3px}
.card.on{border-color:var(--accent);background:#e8eef8}
.card.hot{border-color:var(--accent2);background:#fbf1e8}
.readout{
  margin-top:12px;background:var(--paper);
  border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
}
.statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
           padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px}
.statechip.ok{background:var(--ok)} .statechip.no{background:var(--no)}
.lead{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.4}
body.urdu .lead{line-height:1.95}
.detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
.trade{
  margin-top:14px;border:2px dashed var(--accent2);background:#fbf1e8;border-radius:14px;
  padding:12px 14px;font-size:var(--fs-xs);font-weight:700;color:#8a4a12;line-height:1.6;
}
.why-note{
  margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6;
  border-left:3px solid var(--accent);padding-left:11px;
}
body.urdu .why-note{border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;line-height:var(--lh)}
.why-note b{color:var(--accent);font-weight:800}
.panel{margin-top:18px}
.panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
.row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.row .name{flex:none;width:34%;max-width:140px;font-size:var(--fs-xs);font-weight:700}
.row input[type=range]{flex:1;min-width:120px;height:36px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.schip{
  border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 15px;
  font:inherit;font-size:var(--fs-cap);font-weight:800;color:var(--ink);cursor:pointer;min-height:46px;
}
.schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.lesson{margin-top:8px}
.lcard{
  border:3px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;background:#fffdf8;
}
.lcard .tag{
  display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
  padding:3px 12px;font-size:var(--fs-cap);font-weight:800;margin-bottom:8px;
}
.lcard.hook .tag{background:var(--accent2)}
.lcard.misaal .tag{background:var(--ok)}
.lcard.karo .tag{background:#6b4a8f}
.lcard p{margin:0;font-size:var(--fs-sm);line-height:1.6}
body.urdu .lcard p{line-height:var(--lh)}
.quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
.q{margin-bottom:26px}
.q > p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
.opt{
  display:block;width:100%;text-align:left;margin-bottom:10px;
  border:2px solid var(--line);background:var(--paper);border-radius:12px;
  padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
  min-height:52px;
}
body.urdu .opt{text-align:right}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
.opt.wrong{border-color:var(--no);background:#fbeae8}
.fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.6}
.fb.show{display:block}
.score{
  margin-top:14px;padding:14px;border:3px solid var(--ink);border-radius:16px;
  font-weight:800;font-size:var(--fs-md);text-align:center;display:none;
}
.score.show{display:block}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
       font-size:var(--fs-xs);color:var(--ink-soft)}
@media (min-width:820px){
  .wrap{
    max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
    grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "lesson lesson" "quiz quiz" "foot foot";
    align-items:start;
  }
  .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
  .left{grid-area:left} .right{grid-area:right}
  .lesson{grid-area:lesson}
  .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition-duration:.01ms !important}
}


</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="brand">AI4Kids · Grade 4 · Robotics</span>
    <button class="chip" id="langBtn" aria-pressed="false">اردو</button>
    <button class="chip" id="speakBtn" aria-label="Sunlo">🔊</button>
  </div>
  <div class="head">
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
  </div>
  <div class="tabs" role="group" id="tabs"></div>
  <div class="left">
    <div class="scene" id="scene"><svg viewBox="0 0 320 240" id="svg" role="img"></svg></div>
    <div class="two" id="two"></div>
    <div class="readout">
      <span class="statechip" id="statechip"></span>
      <p class="lead" id="lead"></p>
      <p class="detail" id="detail"></p>
      <p class="trade" id="trade"></p>
      <p class="why-note"><b id="whyLbl"></b> <span id="whyText"></span></p>
    </div>
  </div>
  <div class="right">
    <div class="panel">
      <h2 id="panelHead"></h2>
      <div class="chips" id="chips" role="group"></div>

    <h2 id="quizHead" style="font-size:var(--fs-lg);font-weight:800;margin:0 0 18px"></h2>

    <p id="foot"></p>
  </footer>
</div>
<script>
(function(){
"use strict";
var lang="en", tab="main";

function $(id){ return document.getElementById(id); }
function t(o){ return (o && typeof o==="object") ? (o[lang]||o.en||"") : (o||""); }
function setText(el, s){
  if(!el) return;
  el.textContent = s;
  if(lang==="ur"){ el.setAttribute("dir","rtl"); }
  else { el.setAttribute("dir","ltr"); }
}
function buildTabs(list){
  var tabs=$("tabs"); tabs.innerHTML="";
  list.forEach(function(x){
    var b=document.createElement("button"); b.type="button";
    b.setAttribute("aria-pressed", tab===x[0]?"true":"false");
    setText(b, t(x[1]));
    b.addEventListener("click", function(){ if(tab===x[0]) return; tab=x[0]; if(typeof onTab==="function") onTab(); render(); });
    tabs.appendChild(b);
  });
}
function buildLesson(){
  var box=$("lessonBox"); if(!box) return; box.innerHTML="";
  var cards=[{cls:"hook", tag:{en:"HOOK",ur:"ہک"}, body:LESSON.hook},
   {cls:"samjhao", tag:{en:"SAMJHAO",ur:"سمجھاؤ"}, body:LESSON.samjhao},
   {cls:"misaal", tag:{en:"MISAAL",ur:"مثال"}, body:LESSON.misaal}];
  if(LESSON.karo) cards.push({cls:"karo", tag:{en:"KARO",ur:"کرو"}, body:LESSON.karo});
  cards.forEach(function(c){
    var d=document.createElement("div"); d.className="lcard "+c.cls;
    var tag=document.createElement("span"); tag.className="tag"; setText(tag,t(c.tag));
    var p=document.createElement("p"); setText(p,t(c.body));
    d.appendChild(tag); d.appendChild(p); box.appendChild(d);
  });
}
var quizScore=0, quizDone=0;
function buildQuiz(){
  var box=$("quizBox"); box.innerHTML=""; quizScore=0; quizDone=0;
  var sb=$("scoreBox"); sb.classList.remove("show"); sb.textContent="";
  setText($("quizHead"), t({en:"Check yourself", ur:"اپنا امتحان لیں"}));
  QUIZ.forEach(function(item){
    var wrap=document.createElement("div"); wrap.className="q";
    var q=document.createElement("p"); setText(q, t(item.q)); wrap.appendChild(q);
    var fb=document.createElement("p"); fb.className="fb";
    ["a","b","c","d"].forEach(function(k, oi){
      var b=document.createElement("button"); b.type="button"; b.className="opt";
      b.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      b.textContent = String.fromCharCode(65+oi)+". "+t(item[k]);
      b.addEventListener("click", function(){
        if(wrap.getAttribute("data-done")==="1") return;
        wrap.setAttribute("data-done","1"); quizDone++;
        if(item.correct===k) quizScore++;
        ["a","b","c","d"].forEach(function(kk, xi){
          var btn=wrap.querySelectorAll(".opt")[xi];
          if(kk===item.correct) btn.classList.add("right");
          else if(kk===k) btn.classList.add("wrong");
        });
        setText(fb, t(item.explanation)); fb.classList.add("show");
        if(quizDone===QUIZ.length){
          sb.classList.add("show");
          setText(sb, t({en:"Score: "+quizScore+" / "+QUIZ.length, ur:"سکور: "+quizScore+" / "+QUIZ.length}));
        }
      });
      wrap.appendChild(b);
    });
    wrap.appendChild(fb); box.appendChild(wrap);
  });
}
function applyLang(){
  document.body.classList.toggle("urdu", lang==="ur");
  document.documentElement.lang = (lang==="ur") ? "ur" : "en";
  var lb=$("langBtn");
  lb.textContent = (lang==="en") ? "اردو" : "English";
  lb.setAttribute("aria-pressed", lang==="ur" ? "true":"false");
  setText($("foot"), t({en:"AI4Kids — Islamabad's bilingual AI and coding school. WhatsApp 0337 1468899",
    ur:"اے آئی فور کڈز — اسلام آباد کا دو زبانوں والا اے آئی اور کوڈنگ سکول۔ واٹس ایپ 0337 1468899"}));
  buildLesson(); buildQuiz(); render();
}
$("langBtn").addEventListener("click", function(){ lang=(lang==="en")?"ur":"en"; applyLang(); });
$("speakBtn").addEventListener("click", function(){
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var lead=$("lead"); var text = (lead && lead.textContent) || ($("title")&&$("title").textContent) || "";
    var u=new SpeechSynthesisUtterance(text);
    u.lang=(lang==="ur")?"ur-PK":"en-US"; u.rate=0.92;
    window.speechSynthesis.speak(u);
  }catch(e){}
});

var dist=80, gateOpen=0, gateTarget=0, animTimer=null, carX=20;
var NS="http://www.w3.org/2000/svg";
function mk(tag,a){ var e=document.createElementNS(NS,tag); for(var k in a) e.setAttribute(k,a[k]); return e; }

var LESSON={
  hook:{en:"What if a door opened by itself when you walked up? Today we meet the automatic gate that opens as you arrive!",
        ur:"اگر دروازہ پاس آتے ہی خود کھل جائے؟ آج ملتے ہیں آٹومیٹک گیٹ سے جو آتے ہی کھل جاتا ہے!"},
  samjhao:{en:"An automatic gate opens and closes without a person pushing it. Sensors detect you and motors swing it open. Remotes and card systems work too. It feels safer and helps elders who cannot walk far. You see them at homes, schools, hospitals, factories, and malls where security matters.",
           ur:"آٹومیٹک گیٹ بغیر دھکے کھلتا بند ہوتا ہے۔ سینسر آپ دیکھتے ہیں اور موٹر کھولتی ہے۔ ریموٹ اور کارڈ بھی۔ محفوظ لگتا ہے اور بزرگوں کی مدد کرتا ہے۔ گھر، سکول، ہسپتال، فیکٹری اور مال میں جہاں سیکیورٹی ضروری ہو۔"},
  misaal:{en:"On Mall Road in Lahore a big shopping mall has a gate that opens when you approach — easy for customers and useful for security.",
          ur:"لاہور مال روڈ پر بڑے شاپنگ مال کا گیٹ پاس آتے ہی کھلتا ہے — گاہکوں کے لیے آسان اور سیکیورٹی کے لیے مفید۔"},
  karo:{en:"Build a cardboard gate with a rubber band. Roll a toy car close and make the gate swing open!",
        ur:"کارڈ بورڈ کا گیٹ ربر بینڈ سے بناؤ۔ کھلونا گاڑی قریب لاؤ اور گیٹ کھولو!"}
};
var QUIZ=[
  {q:{en:"What technology does an automatic door use?",ur:"Automatic darwaza kis technology par kaam karta hai?"},a:{en:"Sensors and motors",ur:"Sensors aur motors"},b:{en:"Manual control only",ur:"Manual control"},c:{en:"Opens only by hand",ur:"Pura haath se kholta hai"},d:{en:"No technology",ur:"Koi technology nahi hai"},correct:"a",explanation:{en:"It opens with sensors and motors.",ur:"Automatic darwaza sensors aur motors ki madad se khulta hai."}},
  {q:{en:"Where is this door often used?",ur:"Yeh darwaza kis maqam par istemal hota hai?"},a:{en:"At the house entrance",ur:"Ghar ki entry par"},b:{en:"When buying toys",ur:"Khilone kharidne par"},c:{en:"Inside the house rooms",ur:"Ghar ke andar"},d:{en:"In school classes",ur:"School ki classes mein"},correct:"a",explanation:{en:"Often used at the house entrance.",ur:"Yeh darwaza aksar ghar ki entry par istamal hota hai."}},
  {q:{en:"Why is an automatic door useful?",ur:"Automatic darwaza kyu faida mand hai?"},a:{en:"It saves time",ur:"Waqt ki bachat karta hai"},b:{en:"It costs more",ur:"Zyada kharch hota hai"},c:{en:"Only for weddings",ur:"Sirf shadiyon mein istemal hota hai"},d:{en:"Not for poor people",ur:"Gareebon ke liye nahi hai"},correct:"a",explanation:{en:"It saves time and opens easily.",ur:"Yeh waqt ki bachat karta hai aur asani se khulta hai."}},
  {q:{en:"How do these doors work?",ur:"In darwazon ka kaam karne ka tareeqa kya hai?"},a:{en:"Remote or motion sensors",ur:"Remote ya motion sensors se"},b:{en:"Only by hand",ur:"Sirf haath se kholna"},c:{en:"No need for anything",ur:"Koi zarurat nahi hoti"},d:{en:"Nobody knows",ur:"Koi nahi janta"},correct:"a",explanation:{en:"They open with remote or motion sensors.",ur:"Yeh remote ya motion sensors se khulte hain."}},
  {q:{en:"Where are automatic doors common in Pakistan?",ur:"Pakistan mein kis jagah par automatic darwaza aam hai?"},a:{en:"Shopping malls",ur:"Shopping malls"},b:{en:"Toy shops",ur:"Khilone ki dukaanon"},c:{en:"Mud houses",ur:"Kachay gharon mein"},d:{en:"Food tiffin boxes",ur:"Khana khilane wale dabbaon mein"},correct:"a",explanation:{en:"Shopping malls commonly have automatic doors.",ur:"Shopping malls mein automatic darwaze aam tor par dekhe jate hain."}}
];

function drawGate(){
  var svg=$("svg"); svg.innerHTML="";
  svg.appendChild(mk("rect",{x:0,y:0,width:320,height:240,fill:"#c5d5e0"}));
  svg.appendChild(mk("rect",{x:0,y:180,width:320,height:60,fill:"#6b7280"}));
  // walls
  svg.appendChild(mk("rect",{x:0,y:60,width:100,height:120,fill:"#a8b5c4"}));
  svg.appendChild(mk("rect",{x:220,y:60,width:100,height:120,fill:"#a8b5c4"}));
  // gate barrier — pivots from left pillar
  var ang = -gateOpen*75; // degrees open upward
  var gg=mk("g",{transform:"translate(100,160) rotate("+ang+")"});
  gg.appendChild(mk("rect",{x:0,y:-6,width:120,height:12,rx:3,fill:"#dc2626",stroke:"#7f1d1d","stroke-width":2}));
  gg.appendChild(mk("rect",{x:10,y:-6,width:20,height:12,fill:"#fef08a"}));
  gg.appendChild(mk("rect",{x:50,y:-6,width:20,height:12,fill:"#fef08a"}));
  gg.appendChild(mk("rect",{x:90,y:-6,width:20,height:12,fill:"#fef08a"}));
  svg.appendChild(gg);
  // sensor
  svg.appendChild(mk("rect",{x:108,y:150,width:16,height:12,rx:2,fill:"#1d4c85"}));
  // distance arc
  var reach = 20 + (100-dist)*1.4;
  svg.appendChild(mk("path",{d:"M116 156 Q"+(116+reach/2)+" "+(156-30)+" "+(116+reach)+" 156",fill:"none",stroke:"#38bdf8","stroke-width":2,"stroke-dasharray":"4 3"}));
  // car
  var cx = 20 + (100-dist)*1.6;
  carX=cx;
  svg.appendChild(mk("rect",{x:cx,y:165,width:44,height:20,rx:4,fill:"#2563eb",stroke:"#1e3a8a","stroke-width":2}));
  svg.appendChild(mk("circle",{cx:cx+10,cy:186,r:5,fill:"#1f2933"}));
  svg.appendChild(mk("circle",{cx:cx+34,cy:186,r:5,fill:"#1f2933"}));
}
function updateGateLogic(){
  // open when distance < 35
  gateTarget = dist < 35 ? 1 : 0;
  if(!animTimer){
    animTimer=setInterval(function(){
      if(Math.abs(gateOpen-gateTarget)<0.04){ gateOpen=gateTarget; }
      else gateOpen += (gateTarget-gateOpen)*0.12;
      drawGate();
      var open = gateOpen>0.7;
      $("statechip").className="statechip "+(open?"ok":"");
      setText($("statechip"), open?t({en:"OPEN",ur:"کھلا"}):t({en:"CLOSED",ur:"بند"}));
    },40);
  }
}
function onTab(){}
function render(){
  buildTabs([["sensor",{en:"Car approach",ur:"گاڑی قریب"}],["states",{en:"Open / Close",ur:"کھلا / بند"}],["safe",{en:"Safety tip",ur:"حفاظت"}]]);
  if(!tab||tab==="main") tab="sensor";
  setText($("whyLbl"), t({en:"Notice:",ur:"غور کریں:"}));
  $("chips").innerHTML=""; var ctl=$("controls"); ctl.innerHTML="";
  var play=$("playBtn"), play2=$("playBtn2");
  play.className="play"; play2.className="play alt hidden";

  if(tab==="sensor"){
    setText($("title"), t({en:"Sensor sees the car",ur:"سینسر گاڑی دیکھتا ہے"}));
    setText($("subtitle"), t({en:"Move the distance slider — gate opens when the car is close.",ur:"فاصلہ سرکائیں — قریب آتے ہی گیٹ کھلے گا۔"}));
    setText($("panelHead"), t({en:"Distance",ur:"فاصلہ"}));
    play.classList.add("hidden");
    var row=document.createElement("div"); row.className="row";
    var nm=document.createElement("span"); nm.className="name"; setText(nm, dist+" cm");
    var rng=document.createElement("input"); rng.type="range"; rng.min=10; rng.max=100; rng.value=dist;
    rng.oninput=function(){ dist=+rng.value; setText(nm, dist+" cm"); updateGateLogic();
      setText($("lead"), dist<35?t({en:"Car close → motor opens gate",ur:"گاڑی قریب → موٹر گیٹ کھولتی"}):t({en:"Car far → gate stays closed",ur:"گاڑی دور → گیٹ بند"}));
      setText($("detail"), t({en:"Distance now: "+dist+" cm. Threshold: 35 cm.",ur:"اب فاصلہ: "+dist+" سینٹی میٹر۔ حد: 35۔"}));
    };
    row.appendChild(nm); row.appendChild(rng); ctl.appendChild(row);
    updateGateLogic(); drawGate();
    setText($("statechip"), gateOpen>0.7?t({en:"OPEN",ur:"کھلا"}):t({en:"CLOSED",ur:"بند"}));
    setText($("lead"), t({en:"Ultrasonic sensor measures distance",ur:"الٹراسونک سینسر فاصلہ ناپتا ہے"}));
    setText($("detail"), t({en:"Slide closer than 35 cm to open.",ur:"۳۵ سینٹی میٹر سے قریب لائیں تو کھلے گا۔"}));
    setText($("trade"), t({en:"Same idea as mall doors that open when you walk up.",ur:"مال کے دروازوں جیسا خیال جو پاس آتے ہی کھلتے ہیں۔"}));
    setText($("whyText"), t({en:"Sensor → decision → motor. That is automation!",ur:"سینسر → فیصلہ → موٹر۔ یہی آٹومیشن!"}));
    return;
  }
  if(tab==="states"){
    setText($("title"), t({en:"Open and closed states",ur:"کھلا اور بند"}));
    setText($("subtitle"), t({en:"Tap to force open or close — like a remote.",ur:"ریموٹ کی طرح کھولیں یا بند کریں۔"}));
    setText($("panelHead"), t({en:"Remote",ur:"ریموٹ"}));
    setText(play, t({en:"Open gate",ur:"گیٹ کھولو"}));
    play.classList.add("go"); play.classList.remove("hidden");
    play2.classList.remove("hidden");
    setText(play2, t({en:"Close gate",ur:"گیٹ بند کرو"}));
    play.onclick=function(){ dist=20; gateTarget=1; updateGateLogic(); render(); };
    play2.onclick=function(){ dist=90; gateTarget=0; updateGateLogic(); render(); };
    drawGate();
    setText($("statechip"), gateOpen>0.5?t({en:"OPEN",ur:"کھلا"}):t({en:"CLOSED",ur:"بند"}));
    setText($("lead"), t({en:"Two states, one motor",ur:"دو حالتیں، ایک موٹر"}));
    setText($("detail"), t({en:"Remote or card can send the same open/close command.",ur:"ریموٹ یا کارڈ بھی یہی حکم بھیج سکتے ہیں۔"}));
    setText($("trade"),""); setText($("whyText"), t({en:"The motor only turns when the brain says open or close.",ur:"موٹر تبھی گھومتی ہے جب دماغ کھولو یا بند کہے۔"}));
    return;
  }
  setText($("title"), t({en:"Safety first!",ur:"پہلے حفاظت!"}));
  setText($("subtitle"), t({en:"Never stand under a moving gate.",ur:"چلتے گیٹ کے نیچے کبھی نہ کھڑے ہوں۔"}));
  setText($("panelHead"), t({en:"Tips",ur:"مشورے"}));
  play.classList.add("hidden"); play2.classList.add("hidden");
  drawGate();
  setText($("statechip"), t({en:"Safety",ur:"حفاظت"}));
  setText($("lead"), t({en:"Sensors also stop the gate if something is in the way.",ur:"راستے میں چیز ہو تو سینسر گیٹ روک بھی سکتے ہیں۔"}));
  setText($("detail"), t({en:"Kids: wait for the gate to fully open before walking or riding through.",ur:"بچو: گزرنے سے پہلے گیٹ پورا کھلا ہونے دیں۔"}));
  setText($("trade"), t({en:"Tip: If a gate beeps or flashes, stay back until an adult checks it.",ur:"مشورہ: گیٹ بیپ یا چمکے تو بڑوں کے چیک کرنے تک پیچھے رہیں۔"}));
  setText($("whyText"), t({en:"Automation must be safe — that is part of good engineering.",ur:"آٹومیشن محفوظ ہونی چاہیے — یہی اچھی انجینئرنگ ہے۔"}));
}

applyLang();
})();
</script>
</body>
</html>
