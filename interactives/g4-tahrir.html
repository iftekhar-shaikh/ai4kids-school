<body class="roman">
<div class="wrap">
<header class="top"><span class="brand">AI4Kids · Grade 4 · Urdu</span><button class="pill" id="lang" type="button" aria-pressed="false">Roman Urdu ↔ English</button><button class="pill" id="playAll" type="button">🔊 Play</button></header>
<section class="hero"><h1><span class="en">Tahrir</span><span class="roman">Tahrir</span></h1><p><span class="en">Grade 4 Urdu writing: paragraphs, applications, and short stories.</span><span class="roman">Class 4 Urdu tahrir: paragraph, darkhwast aur chhoti kahani likhna seekho.</span></p></section>
<section class="sec"><h2><span class="tag">HOOK</span> <span class="en">Your ideas deserve a page!</span><span class="roman">Tumhare khayalat ek safhay ke mustahiq hain!</span></h2><div class="card hook"><span class="en">Writing is putting your thought on paper. Even five clear sentences can tell a big idea.</span><span class="roman">Likhna apna khayal kaghaz par lana hai. Paanch saaf jumle bhi ek bara khayal bata sakte hain.</span></div></section>
<section class="sec"><h2><span class="tag">SAMJHAO</span> <span class="en">Three forms of tahrir</span><span class="roman">Tahrir ki teen qisamain</span></h2><div class="split"><div class="mini"><h3>Paragraph</h3><p><span class="en">Connected sentences about one idea.</span><span class="roman">Ek khayal par mabni juray hue jumle.</span></p></div><div class="mini"><h3>Darkhwast</h3><p><span class="en">A polite written request to a teacher or principal.</span><span class="roman">Ustad ya principal ko likhi hui adab se guzarish.</span></p></div><div class="mini"><h3>Short story</h3><p><span class="en">A small event with a beginning, middle, and ending.</span><span class="roman">Chhota waqia jismein shuruat, darmiyani baat aur khatma ho.</span></p></div></div></section>
<section class="sec"><h2><span class="tag">MISAAL</span> <span class="en">A simple leave application</span><span class="roman">Chhoti leave darkhwast</span></h2><div class="example"><div class="letter"><h3><span class="en">Remember these parts</span><span class="roman">In hisson ko yaad rakho</span></h3><p>1. <strong>Naam + class</strong></p><p>2. <strong>Wajah</strong> — why you need leave</p><p>3. <strong>Date</strong> — when you are writing</p><p>4. <strong>Adab se khatma</strong> — thank you</p><button class="play" data-say="Mohtaram Principal Sahib, mujhe bukhar hai. Bara-e-karam ek din ki chhutti dein. Shukriya.">🔊 <span class="en">Play example</span><span class="roman">Misaal suno</span></button></div><div class="letter"><h3>Darkhwast ka sample</h3><p>Mohtaram Principal Sahib,</p><p>Mujhe bukhar hai, is liye main kal school nahi aa sakunga. Bara-e-karam ek din ki chhutti manzoor farmayen.</p><p>Shukriya,<br>Ali — Class 4<br>19 September 2026</p></div></div></section>
<section class="sec"><h2><span class="tag">PLAY</span> <span class="en">Plan a paragraph</span><span class="roman">Paragraph ka mansuba banao</span></h2><div class="demo"><h3><span class="en">Tap each step, then choose an idea.</span><span class="roman">Har qadam tap karo, phir ek khayal chuno.</span></h3><div class="steps"><button class="step active" data-step="0">1. Shuruat</button><button class="step" data-step="1">2. Asl baat</button><button class="step" data-step="2">3. Khatma</button></div><div class="planner" id="planner"><strong>Shuruat:</strong><p>Apna topic aur pehla jumla chuno.</p></div><div class="choices" id="choices"></div><div id="planMsg" style="margin-top:10px;font-weight:800;color:var(--teal)"></div></div></section>
<section class="sec"><h2><span class="tag">PLAY</span> <span class="en">Make your own darkhwast</span><span class="roman">Apni darkhwast banao</span></h2><div class="demo"><h3><span class="en">Fill the boxes. The letter updates as you type.</span><span class="roman">Khanay bharo. Darkhwast foran badalti nazar aayegi.</span></h3><div class="formgrid"><label>Your name / Tumhara naam<input id="name" value="Ali"></label><label>Class<input id="klass" value="4"></label><label>Reason / Wajah<input id="reason" value="tabiyat kharab hai"></label><label>Date / Tareekh<input id="date" value="19 September 2026"></label></div><div class="preview" id="preview"></div><button class="play" id="playLetter" type="button">🔊 <span class="en">Play my letter</span><span class="roman">Meri darkhwast suno</span></button></div></section>
<section class="sec"><h2><span class="tag">KARO</span> <span class="en">Write it yourself</span><span class="roman">Ab khud likho</span></h2><div class="karo"><ol><li><span class="en">Write a five-sentence paragraph: “My School”. Use beginning → main idea → ending.</span><span class="roman">“Mera school” par paanch jumlon ka paragraph likho: shuruat → asal baat → khatma.</span></li><li><span class="en">Draft a short leave application to your principal. Add your name, class, reason, and date.</span><span class="roman">Principal ko chhoti leave darkhwast likho. Naam, class, wajah aur tareekh zaroor do.</span></li><li><span class="en">Tell a short story with a title and three parts. Keep words clear and simple.</span><span class="roman">Unwan ke saath chhoti kahani likho. Teen hisay rakho aur alfaaz saaf rakho.</span></li></ol></div></section>
<section class="quiz"><h2><span class="en">Tahrir Quiz</span><span class="roman">Tahrir Quiz</span> <span class="score" id="score">0 / 5</span></h2><div id="quiz"></div><div class="done" id="done"></div></section>
<footer><span class="en">Offline lesson · No account or internet needed.</span><span class="roman">Offline sabaq · Account ya internet ki zaroorat nahi.</span></footer>
</div>
<script>
const plan=[
{head:'Shuruat',text:'Paragraph ka topic aur pehla jumla chuno.',opts:['Mera school shehar ke qareeb hai.','Kal hum picnic par gaye.','Mera dost bohat madadgar hai.']},
{head:'Asl baat',text:'Topic ke baare mein do ya teen tafseel chuno.',opts:['Yahan library, playground aur saaf classrooms hain.','Hum ne phool dekhe aur lunch kiya.','Woh homework mein meri madad karta hai.']},
{head:'Khatma',text:'Aakhri jumla chuno jo khayal mukammal kare.',opts:['Mujhe apna school bohat pasand hai.','Is liye picnic ki yaad hamesha rahegi.','Aise dost par mujhe fakhr hai.']}];let current=0;const planner=document.querySelector('#planner'),choices=document.querySelector('#choices'),planMsg=document.querySelector('#planMsg');function drawPlan(){document.querySelectorAll('.step').forEach((b,i)=>b.classList.toggle('active',i===current));let p=plan[current];planner.innerHTML='<strong>'+p.head+':</strong><p>'+p.text+'</p>';choices.innerHTML=p.opts.map((x,i)=>`<button class="choice" data-i="${i}">${x}</button>`).join('');}document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{current=+b.dataset.step;drawPlan()});choices.onclick=e=>{if(e.target.matches('.choice')){planMsg.textContent='✅ Khoob! “'+e.target.textContent+'” tumhare plan ka hissa ban gaya.';if(current<2){current++;drawPlan()}else{planMsg.textContent='✅ Plan mukammal! Ab teenon jumlon ko mila kar paragraph likho.'}}};drawPlan();
const fields=['name','klass','reason','date'];function update(){let n=document.querySelector('#name').value||'________',k=document.querySelector('#klass').value||'4',r=document.querySelector('#reason').value||'________',d=document.querySelector('#date').value||'________';document.querySelector('#preview').textContent='Mohtaram Principal Sahib,\n\nMera naam '+n+' hai aur main Class '+k+' ka talib-e-ilm hoon. Meri '+r+', is liye main school nahi aa sakunga. Bara-e-karam mujhe ek din ki chhutti manzoor farmayen.\n\nShukriya,\n'+n+' — Class '+k+'\n'+d}fields.forEach(id=>document.querySelector('#'+id).addEventListener('input',update));update();
const qs=[['Paragraph kya hai?',['Connected jumlon ka group','Sirf ek word','Sirf emoji','Sirf blank page'],'A','Few sentences on one idea.'],['School leave darkhwast aksar kis ko?',['Principal / teacher','Sirf cricketer','Sirf shopkeeper only','Sirf map'],'A','School authority.'],['Tahrir se pehle kya?',['Idea / points socho','Sirf random scribble','Sirf panic','Sirf delete all'],'A','Plan first.'],['Darkhwast mein date kyun?',['Record / clarity','Sirf decoration','Sirf hide reason','Sirf joke'],'A','Date matters.'],['Achhi tahrir ki pehchan?',['Saaf + simple + poora matlab','Sirf mushkil words','Sirf shor','Sirf copy-paste junk'],'A','Clear and simple.']];let quiz=document.querySelector('#quiz'),answered=0,score=0;qs.forEach((x,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML='<p>'+(i+1)+'. '+x[0]+'</p>'+x[1].map((o,j)=>`<button class="opt" data-q="${i}" data-c="${String.fromCharCode(65+j)}">${String.fromCharCode(65+j)}) ${o}</button>`).join('')+`<div class="feedback" id="fb${i}">${x[3]}</div>`;quiz.append(d)});quiz.addEventListener('click',e=>{if(!e.target.matches('.opt')||e.target.disabled)return;let b=e.target,i=+b.dataset.q,bs=[...quiz.querySelectorAll(`[data-q="${i}"]`)];bs.forEach(x=>x.disabled=true);if(b.dataset.c==='A'){b.classList.add('right');score++}else{b.classList.add('wrong');bs[0].classList.add('right')}answered++;document.querySelector('#fb'+i).classList.add('show');document.querySelector('#score').textContent=score+' / 5';if(answered===5){let d=document.querySelector('#done');d.textContent=score===5?'Shabash! Perfect score — 5 / 5.':'Well done! Tum ne '+score+' / 5 sahi kiye.';d.classList.add('show')}});
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}document.querySelectorAll('.play').forEach(b=>b.onclick=()=>speak(b.dataset.say||document.querySelector('#preview').textContent));document.querySelector('#playAll').onclick=()=>speak('Tahrir. Paragraph, darkhwast aur chhoti kahani likhte waqt shuruat, asal baat aur khatma yaad rakho.');document.querySelector('#playLetter').onclick=()=>speak(document.querySelector('#preview').textContent);document.querySelector('#lang').onclick=e=>{let on=document.body.classList.toggle('roman');e.currentTarget.setAttribute('aria-pressed',on)};
</script>
<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
