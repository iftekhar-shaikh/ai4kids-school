<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Writing practice | AI4Kids Grade 1 English</title><style>
:root{--ink:#17252f;--muted:#526672;--paper:#fffdf7;--line:#d9d2c5;--blue:#176b87;--blue2:#e2f2f5;--orange:#d56f2f;--green:#2e8156;--purple:#72519a;--red:#b94d45;--yellow:#fff0b8;--cap:clamp(1rem,2.8vw,1.15rem);--sm:clamp(1.12rem,3.3vw,1.38rem);--md:clamp(1.28rem,3.8vw,1.65rem);--lg:clamp(1.55rem,4.8vw,2.1rem);--xl:clamp(2rem,7vw,3rem)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;font-size:var(--sm);line-height:1.55;padding-bottom:48px}.wrap{max-width:1100px;margin:auto;padding:0 16px}.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:15px 0 7px}.brand{font-weight:900;color:var(--blue);margin-right:auto;font-size:var(--cap)}button{font:inherit;color:inherit}.chip,.tab{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:8px 15px;cursor:pointer;font-weight:800;min-height:45px}.chip[aria-pressed=true],.tab[aria-pressed=true]{background:var(--ink);color:#fff}.chip:focus-visible,.tab:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}h1{font-size:var(--xl);line-height:1.15;margin:12px 0 4px}.sub{color:var(--muted);margin:0 0 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border-radius:14px;flex:1 1 16%;font-size:var(--cap);min-height:52px}.demo{border:3px solid var(--ink);border-radius:23px;background:linear-gradient(140deg,#e7f4f6,#fff1d9);padding:16px;margin-bottom:20px}.demo-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.demo-head h2{font-size:var(--lg);margin:0;flex:1}.hint{color:var(--muted);margin:4px 0 13px}.stage{background:#fffefa;border:2px solid var(--line);border-radius:17px;padding:13px}.play{background:var(--green);border:3px solid #236b45;color:#fff;border-radius:15px;padding:10px 17px;min-height:52px;cursor:pointer;font-weight:900;font-size:var(--md);width:100%;margin-top:12px}.play:active{transform:scale(.98)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:3px solid var(--line);background:#fff;border-radius:15px;min-height:93px;padding:10px 8px;cursor:pointer;text-align:center;font-weight:900}.card:hover,.card.selected,.card.active{border-color:var(--blue);background:var(--blue2)}.emoji{display:block;font-size:2.35rem;line-height:1.1;margin-bottom:4px}.card small{display:block;color:var(--muted);font-size:var(--cap);font-weight:600}.demo-msg{border-radius:13px;background:var(--yellow);padding:10px 13px;margin:12px 0 0;font-weight:800}.lesson-grid{display:grid;gap:13px}.lesson{border:3px solid var(--line);border-radius:18px;background:#fff;padding:15px 17px;scroll-margin-top:12px}.lesson .tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:3px 13px;font-size:var(--cap);font-weight:900;margin-bottom:9px}.lesson.hook .tag{background:var(--orange)}.lesson.misaal .tag{background:var(--green)}.lesson.karo .tag{background:var(--purple)}.lesson p{margin:0;font-size:var(--sm)}.row-title{font-weight:900;margin:4px 0 6px;color:var(--blue)}.choice-row{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice-row .card{min-height:66px}.story-box{text-align:center}.story-emoji{font-size:clamp(3rem,14vw,6rem);padding:12px}.trace{font-size:clamp(3.3rem,14vw,7rem);letter-spacing:.12em;color:#8fa5ad;border:4px dashed var(--blue);border-radius:16px;padding:15px 8px;background:repeating-linear-gradient(0deg,#fff 0,#fff 42px,#d9edf0 43px,#fff 45px);font-weight:900}.quiz{border-top:3px solid var(--ink);margin-top:30px;padding-top:20px}.quiz h2{font-size:var(--lg);margin:0 0 17px}.q{margin-bottom:25px}.q-title{font-size:var(--md);font-weight:900;margin:0 0 10px}.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;margin:8px 0;cursor:pointer;min-height:52px;font-size:var(--sm)}.opt.right{border-color:var(--green);background:#e6f4eb;font-weight:900}.opt.wrong{border-color:var(--red);background:#f9e6e1}.opt:disabled{cursor:default}.feedback{display:none;color:var(--muted);font-size:var(--cap);margin:7px 0}.feedback.show{display:block}.score{display:none;text-align:center;border:3px solid var(--green);background:#e6f4eb;border-radius:15px;padding:13px;font-size:var(--md);font-weight:900}.score.show{display:block}footer{margin-top:31px;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:var(--cap)}@media(min-width:760px){.lesson-grid{grid-template-columns:1fr 1fr}.demo{padding:20px}.cards{grid-template-columns:repeat(3,1fr)}.choice-row{grid-template-columns:repeat(3,1fr)}.play{width:auto;min-width:190px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="wrap"><div class="bar"><span class="brand" id="brand"></span><button class="chip" id="langBtn" type="button" aria-pressed="false">Roman Urdu</button><button class="chip" id="speakBtn" type="button" aria-label="Read aloud">🔊</button></div><header><h1 id="title"></h1><p class="sub" id="subtitle"></p></header><nav class="tabs" id="tabs" aria-label="Lesson sections"></nav><section class="demo" id="demo"><div class="demo-head"><h2 id="demoTitle"></h2><button class="chip" id="launch" type="button">Play</button></div><p class="hint" id="demoHint"></p><div class="stage" id="stage"></div></section><main class="lesson-grid"><article class="lesson hook" id="hook"><span class="tag" id="hookTag"></span><p id="hookText"></p></article><article class="lesson samjhao" id="samjhao"><span class="tag" id="samjhaoTag"></span><p id="samjhaoText"></p></article><article class="lesson misaal" id="misaal"><span class="tag" id="misaalTag"></span><p id="misaalText"></p></article><article class="lesson karo" id="karo"><span class="tag" id="karoTag"></span><p id="karoText"></p></article></main><section class="quiz"><h2 id="quizTitle"></h2><div id="quizBox"></div><div class="score" id="score"></div></section><footer id="foot"></footer></div><script>const D={"file":"g1-writing.html","title":{"en":"Writing practice","ur":"Writing practice"},"desc":{"en":"Trace capital letters, small letters, and easy words.","ur":"Capital letters, small letters aur easy words trace karo."},"lesson":{"hook":{"en":"Can your pencil make a smooth line? Today your hand and eyes will work together to make letters.","ur":"Kya tumhari pencil smooth line bana sakti hai? Aaj tumhara hand aur eyes mil kar letters banayenge."},"samjhao":{"en":"Writing starts with good sitting, a gentle pencil grip, and lines. Trace from left to right. Capital A and small a are partners. Letters join to make words such as cat and dog.","ur":"Writing ke liye seedha baithna, pencil ko narmi se pakarna aur lines zaroori hain. Left se right trace karo. Capital A aur small a partners hain. Letters mil kar cat aur dog jaise words banate hain."},"misaal":{"en":"Trace A A A, then write a on the line. Now trace cat: c, a, t. Say each sound while your pencil moves.","ur":"A A A trace karo, phir line par a likho. Ab cat trace karo: c, a, t. Pencil chalate waqt har sound bolo."},"karo":{"en":"Use paper or a whiteboard. Trace three letters and one word. Circle your neatest letter. Practise for five happy minutes.","ur":"Paper ya whiteboard use karo. Teen letters aur ek word trace karo. Apna sab se neat letter circle karo. Khushi se paanch minute practice karo."}},"demo":{"type":"trace","title":{"en":"Trace and write","ur":"Trace and write"},"hint":{"en":"Choose a model. Trace it with your finger or pencil on paper.","ur":"Model chuno. Finger ya pencil se paper par trace karo."},"items":[{"model":"A a","word":{"en":"A a — apple","ur":"A a — apple"}},{"model":"B b","word":{"en":"B b — ball","ur":"B b — ball"}},{"model":"C c","word":{"en":"C c — cat","ur":"C c — cat"}},{"model":"cat","word":{"en":"cat — a word","ur":"cat — ek word"}},{"model":"dog","word":{"en":"dog — a word","ur":"dog — ek word"}}]},"quizTitle":{"en":"Writing practice Quiz","ur":"Writing practice Quiz"},"quiz":[{"q":{"en":"Which way do we usually write English?","ur":"English aam tor par kis direction mein likhte hain?"},"opts":[{"en":"left to right","ur":"left se right"},{"en":"right to left","ur":"right se left"},{"en":"up to down only","ur":"sirf upar se neeche"},{"en":"in a circle","ur":"circle mein"}],"ans":0,"exp":{"en":"English words go from left to right.","ur":"English words left se right jate hain."}},{"q":{"en":"Which pair has a capital and small letter?","ur":"Kis pair mein capital aur small letter hain?"},"opts":[{"en":"C c","ur":"C c"},{"en":"C D","ur":"C D"},{"en":"c d","ur":"c d"},{"en":"1 2","ur":"1 2"}],"ans":0,"exp":{"en":"C is capital and c is small.","ur":"C capital aur c small hai."}},{"q":{"en":"Which word begins with c?","ur":"Kaunsa word c se shuru hota hai?"},"opts":[{"en":"cat","ur":"cat"},{"en":"dog","ur":"dog"},{"en":"sun","ur":"sun"},{"en":"ball","ur":"ball"}],"ans":0,"exp":{"en":"Cat begins with c.","ur":"Cat c se shuru hota hai."}},{"q":{"en":"What helps us write?","ur":"Humein writing mein kya madad deta hai?"},"opts":[{"en":"pencil","ur":"pencil"},{"en":"plate","ur":"plate"},{"en":"shoe","ur":"joota"},{"en":"spoon","ur":"chamach"}],"ans":0,"exp":{"en":"A pencil helps us write.","ur":"Pencil writing mein madad karti hai."}},{"q":{"en":"Why do we trace letters?","ur":"Hum letters trace kyun karte hain?"},"opts":[{"en":"to practise","ur":"practice ke liye"},{"en":"to eat","ur":"khane ke liye"},{"en":"to sleep","ur":"sone ke liye"},{"en":"to fly","ur":"urne ke liye"}],"ans":0,"exp":{"en":"Tracing helps our hand learn letter shapes.","ur":"Tracing se hamara hand letter shapes seekhta hai."}}]};</script><script>(function(){'use strict';var lang='en',selected=0,step=0,chosenA=0,chosenC=0,answered=0,points=0;function $(id){return document.getElementById(id)}function t(x){return x&&typeof x==='object'?(x[lang]||x.en||''):String(x||'')}function set(el,x){el.textContent=t(x);el.dir='ltr'}function speak(x){if('speechSynthesis' in window){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t(x));u.lang=lang==='en'?'en-US':'en-PK';u.rate=.84;speechSynthesis.speak(u)}}function labels(){return{play:{en:'Play',ur:'Play'},hook:{en:'HOOK',ur:'HOOK'},samjhao:{en:'SAMJHAO',ur:'SAMJHAO'},misaal:{en:'MISAAL',ur:'MISAAL'},karo:{en:'KARO',ur:'KARO'}}}function render(){document.documentElement.lang=lang;document.title=t(D.title)+' | AI4Kids Grade 1 English';set($('brand'),{en:'AI4Kids · Grade 1 · English',ur:'AI4Kids · Grade 1 · English'});set($('title'),D.title);set($('subtitle'),D.desc);$('langBtn').textContent=lang==='en'?'Roman Urdu':'English';$('langBtn').setAttribute('aria-pressed',lang==='ur');var L=labels();[['hook','hookText'],['samjhao','samjhaoText'],['misaal','misaalText'],['karo','karoText']].forEach(function(x){set($(x[0]+'Tag'),L[x[0]]);set($(x[1]),D.lesson[x[0]])});set($('demoTitle'),D.demo.title);set($('demoHint'),D.demo.hint);set($('launch'),L.play);set($('quizTitle'),D.quizTitle);set($('foot'),{en:'AI4Kids · Grade 1 English · Offline lesson',ur:'AI4Kids · Grade 1 English · Offline lesson'});var tb=$('tabs');tb.innerHTML='';['play','hook','samjhao','misaal','karo'].forEach(function(k){var b=document.createElement('button');b.className='tab';b.type='button';b.textContent=t(L[k]);b.setAttribute('aria-pressed',k==='play');b.onclick=function(){$(k==='play'?'demo':k).scrollIntoView({behavior:'smooth'})};tb.appendChild(b)});renderDemo();renderQuiz()}function msg(x){var p=document.createElement('div');p.className='demo-msg';set(p,x);return p}function button(text,cls,fn){var b=document.createElement('button');b.type='button';b.className=cls||'card';set(b,text);b.onclick=fn;return b}function renderDemo(){var s=$('stage');s.innerHTML='';var d=D.demo;if(d.type==='letters'){var row=document.createElement('div');row.className='cards';d.items.forEach(function(it,i){var b=document.createElement('button');b.type='button';b.className='card'+(selected===i?' selected':'');b.innerHTML='<span class="emoji">'+it.emoji+'</span>';b.appendChild(document.createTextNode(it.letter));var sm=document.createElement('small');sm.textContent=t(it.word);b.appendChild(sm);b.onclick=function(){selected=i;renderDemo()};row.appendChild(b)});s.appendChild(row);var p=button({en:'🔊 Play sound',ur:'🔊 Sound suno'},'play',function(){speak(d.items[selected].letter+' '+d.items[selected].word);renderDemo()});s.appendChild(p);s.appendChild(msg(d.items[selected].sound))}else if(d.type==='sentence'){d.rows.forEach(function(r,ri){var title=document.createElement('div');title.className='row-title';title.textContent=t({en:ri===0?'Choose a starter':ri===1?'Choose a sight word':'Choose an ending',ur:ri===0?'Starter chuno':ri===1?'Sight word chuno':'Ending chuno'});s.appendChild(title);var row=document.createElement('div');row.className='choice-row';r.forEach(function(it,i){var b=button(it.text,'card'+((ri===0?chosenA:chosenC)===i?' selected':''),function(){if(ri===0)chosenA=i;else chosenC=i;renderDemo()});row.appendChild(b)});s.appendChild(row)});var play=button({en:'🔊 Play sentence',ur:'🔊 Sentence suno'},'play',function(){var sentence=t(d.rows[0][chosenA].text)+' '+t(d.rows[1][chosenA===0?0:1].text)+' '+t(d.rows[2][chosenC].text);speak(sentence);s.appendChild(msg({en:'Great reading! '+sentence,ur:'Shabash reading! '+sentence}))});s.appendChild(play);s.appendChild(msg({en:'Build a sentence with the cards.',ur:'Cards se sentence banao.'}))}else if(d.type==='family'){var row=document.createElement('div');row.className='cards';d.items.forEach(function(it,i){var b=document.createElement('button');b.type='button';b.className='card'+(selected===i?' selected':'');b.innerHTML='<span class="emoji">'+it.emoji+'</span>';b.appendChild(document.createTextNode(t(it.name)));b.onclick=function(){selected=i;renderDemo();speak(d.items[i].line)};row.appendChild(b)});s.appendChild(row);s.appendChild(msg(d.items[selected].line))}else if(d.type==='match'){var title=document.createElement('div');title.className='row-title';title.textContent=t({en:'Choose an animal',ur:'Animal chuno'});s.appendChild(title);var row=document.createElement('div');row.className='choice-row';d.animals.forEach(function(it,i){var b=document.createElement('button');b.type='button';b.className='card'+(chosenA===i?' selected':'');b.innerHTML='<span class="emoji">'+it.emoji+'</span>';b.appendChild(document.createTextNode(t(it.name)));b.onclick=function(){chosenA=i;renderDemo()};row.appendChild(b)});s.appendChild(row);var title2=document.createElement('div');title2.className='row-title';title2.textContent=t({en:'Choose a color',ur:'Color chuno'});s.appendChild(title2);var row2=document.createElement('div');row2.className='choice-row';d.colors.forEach(function(c,i){var b=button({en:c,ur:c},'card'+(chosenC===i?' selected':''),function(){chosenC=i;renderDemo()});row2.appendChild(b)});s.appendChild(row2);var ck=button({en:'✅ Check match',ur:'✅ Match check karo'},'play',function(){renderDemo()});s.appendChild(ck);var ok=d.animals[chosenA].color===d.colors[chosenC];s.appendChild(msg(ok?{en:'Correct! The '+t(d.animals[chosenA].name)+' can be '+d.colors[chosenC]+'.',ur:'Bilkul! '+t(d.animals[chosenA].name)+' '+d.colors[chosenC]+' ho sakta hai.'}:{en:'Try again: look carefully at the animal.',ur:'Dobara try karo: animal ko ghour se dekho.'}))}else if(d.type==='story'){var sc=d.scenes[step%d.scenes.length],box=document.createElement('div');box.className='story-box';var em=document.createElement('div');em.className='story-emoji';em.textContent=sc.emoji;box.appendChild(em);var h=document.createElement('h3');set(h,sc.head);box.appendChild(h);box.appendChild(msg(sc.text));s.appendChild(box);var next=button({en:step>=d.scenes.length-1?'🔁 Start again':'▶ Next scene',ur:step>=d.scenes.length-1?'🔁 Dobara shuru':'▶ Agla scene'},function(){});next.className='play';next.onclick=function(){step=step>=d.scenes.length-1?0:step+1;renderDemo();speak(d.scenes[step].text)};s.appendChild(next)}else if(d.type==='trace'){var row=document.createElement('div');row.className='cards';d.items.forEach(function(it,i){var b=button(it.word,'card'+(selected===i?' selected':''),function(){selected=i;renderDemo()});row.appendChild(b)});s.appendChild(row);var tr=document.createElement('div');tr.className='trace';tr.textContent=d.items[selected].model;s.appendChild(tr);s.appendChild(msg({en:'Trace the grey model slowly. Now write it on paper.',ur:'Grey model ko aahista trace karo. Ab paper par likho.'}));var p=button({en:'🔊 Say it',ur:'🔊 Bolo'},'play',function(){speak(d.items[selected].word);});s.appendChild(p)}}function renderQuiz(){var box=$('quizBox');box.innerHTML='';answered=0;points=0;$('score').classList.remove('show');D.quiz.forEach(function(q,qi){var w=document.createElement('div');w.className='q';var h=document.createElement('p');h.className='q-title';h.textContent=(qi+1)+'. '+t(q.q);w.appendChild(h);q.opts.forEach(function(opt,oi){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+oi)+'. '+t(opt);b.onclick=function(){if(w.dataset.done)return;w.dataset.done='1';answered++;var right=oi===q.ans;if(right)points++;b.classList.add(right?'right':'wrong');w.querySelectorAll('.opt').forEach(function(x,xi){if(xi===q.ans)x.classList.add('right');x.disabled=true});var f=w.querySelector('.feedback');f.textContent=(right?'✓ ':'✗ ')+t(q.exp);f.className='feedback show';if(answered===D.quiz.length){$('score').textContent=(lang==='en'?'Score: ':'Score: ')+points+' / 5 '+(points===5?(lang==='en'?'— Excellent!':'— Shabash!'):'— '+(lang==='en'?'Keep practising!':'Practice jari rakho!'));$('score').classList.add('show')}};w.appendChild(b)});var f=document.createElement('p');f.className='feedback';w.appendChild(f);box.appendChild(w)})}$('langBtn').onclick=function(){lang=lang==='en'?'ur':'en';selected=0;step=0;render()};$('speakBtn').onclick=function(){speak(D.title);};$('launch').onclick=function(){$('demo').scrollIntoView({behavior:'smooth'});speak(D.demo.title)};render()})();</script></body></html>
