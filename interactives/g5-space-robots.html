<style>
/* AI4KIDS_FS_SCALE */

:root{
  --fs-cap: clamp(0.85rem, 2.2vw, 1.05rem);
  --fs-xs: clamp(1rem, 2.6vw, 1.2rem);
  --fs-sm: clamp(1.15rem, 3vw, 1.4rem);
  --fs-md: clamp(1.3rem, 3.4vw, 1.65rem);
  --fs-lg: clamp(1.55rem, 4vw, 2rem);
  --fs-xl: clamp(1.9rem, 5vw, 2.5rem);
}

/* /AI4KIDS_FS_SCALE */


  :root{
    --board:#1a2744;--board-deep:#0f1a2e;--sky:#1e3a5f;--sky2:#0d1b2a;
    --mars:#c45c3a;--mars2:#8b3a28;--moon:#d4d0c8;--accent:#5b8fd9;
    --ok:#2e7d4f;--ink:#1e2a1a;--ink-soft:#4a5744;--paper:#fdfaf3;
    --line:#d5dec8;--gold:#e8b23d;--left:#c4453a;--rover:#c45c3a;--arm:#3d9b8f;
    --sat:#5b8fd9;--solar:#f5c542;--dust:#c4a882;

  }
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);--fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);--fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);--lh:2.1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .stars{display:flex;align-items:center;gap:6px;font-weight:800;font-size:var(--fs-xs);
         background:#fff6e2;border:2px solid var(--gold);border-radius:999px;padding:7px 13px}
  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}
  .tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
  .tabs button{
    flex:1 1 28%;min-width:90px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:10px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:54px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .tabs button .badge{color:var(--gold)}
  .story{
    background:#fff8ea;border:2px dashed var(--gold);border-radius:16px;padding:13px 15px;
    font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6;margin-bottom:14px;
  }
  body.urdu .story{line-height:var(--lh)}
  .story b{color:var(--ink)}
  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,#0d1b2a 0%,#1e3a5f 40%,#c45c3a 40%,#8b3a28 55%,#5a2a1a 100%);
    min-height:280px;
  }
  .scene.space{background:linear-gradient(180deg,#050a14 0%,#0d1b2a 50%,#1a2744 100%)}
  .scene.earth{background:linear-gradient(180deg,#0d1b2a 0%,#1e3a5f 35%,#2a5a8a 35%,#3d7ab0 50%,#1a3a20 50%,#2d5530 100%)}
  .scene-pad{padding:10px 12px 18px;min-height:260px;position:relative}
  .sky-layer{position:absolute;inset:0 0 45% 0;pointer-events:none;overflow:hidden}
  .star-dot{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.85;box-shadow:0 0 4px #fff}
  .planet{position:absolute;border-radius:50%;z-index:1}
  .planet.mars-ball{width:48px;height:48px;top:14px;right:16px;background:radial-gradient(circle at 35% 35%,#e88a5a,#c45c3a 55%,#8b3a28);box-shadow:0 0 16px rgba(196,92,58,.4)}
  .planet.earth-ball{width:42px;height:42px;top:12px;right:16px;background:radial-gradient(circle at 35% 35%,#7ec8f0 0%,#2f6fb5 40%,#2e7d4f 70%);box-shadow:0 0 14px rgba(47,111,181,.35)}
  .planet.moon-ball{width:28px;height:28px;top:20px;left:14%;background:radial-gradient(circle at 40% 35%,#f0ebe3,#c5c0b8 70%);box-shadow:0 0 10px rgba(255,255,255,.25)}
  body.urdu .planet.mars-ball,body.urdu .planet.earth-ball{right:auto;left:16px}
  body.urdu .planet.moon-ball{left:auto;right:14%}
  .ground-strip{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(180deg,#a85a38 0%,#6b3420 100%);z-index:2;border-top:3px solid #4a2818}
  .ground-strip.mars:before{content:"";position:absolute;left:10%;top:20%;width:18px;height:8px;border-radius:50%;background:rgba(0,0,0,.15);box-shadow:40px 8px 0 rgba(0,0,0,.12),80px -4px 0 6px rgba(0,0,0,.1)}
  .station-strip{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,#3a4a60 0%,#2a3548 100%);z-index:2;border-top:3px solid #1a2430}
  .rover-stage,.arm-stage,.build-stage{position:relative;z-index:5;padding-top:70px;display:flex;justify-content:center;align-items:flex-end;min-height:155px}
  .rover-svg,.arm-svg,.sat-svg,.kids-svg{width:min(94%,300px);height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
  .item-card{background:rgba(253,250,243,.95);border:2.5px solid var(--ink);border-radius:16px;padding:8px 10px 10px;text-align:center;min-width:72px;max-width:110px;box-shadow:0 3px 0 rgba(30,42,26,.15);cursor:pointer;user-select:none}
  .item-card:hover{transform:translateY(-2px)}
  .item-card.picked{opacity:.35;pointer-events:none}
  .item-card.ok{border-color:var(--ok);background:#e8f2ed}
  .item-card.no{border-color:var(--left);background:#fbeae8}
  .item-card.selected{border-color:var(--accent);background:#eaf1f9;box-shadow:0 0 0 3px rgba(91,143,217,.25)}
  .item-em{font-size:34px;line-height:1.1;display:block;margin-bottom:2px}
  .item-lab{font-size:var(--fs-cap);font-weight:800;line-height:1.25;margin:0}
  .job-slots{position:relative;z-index:5;display:flex;flex-direction:column;gap:8px;padding-top:0;min-height:auto}
  .job-slot{border:2.5px dashed rgba(30,42,26,.4);border-radius:14px;background:rgba(253,250,243,.75);padding:10px 12px;min-height:52px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:var(--fs-xs);cursor:pointer;color:var(--ink-soft)}
  .job-slot.filled{border-style:solid;border-color:var(--ink);background:var(--paper);color:var(--ink)}
  .job-slot .jem{font-size:28px}
  .job-slot.right{border-color:var(--ok);background:#e8f2ed}
  .job-slot.wrong{border-color:var(--left);background:#fbeae8}
  .bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;position:relative;z-index:5}
  .mini-item{border:2px solid var(--ink);border-radius:12px;padding:6px 8px;background:#fff;line-height:1;cursor:pointer;min-width:44px;font-weight:800;font-size:var(--fs-cap);display:flex;align-items:center;gap:4px}
  .mini-item.used{opacity:.3;pointer-events:none}
  .save-scene{position:relative;z-index:5;padding-top:82px;text-align:center;min-height:140px}
  .save-hero{font-size:56px;line-height:1;margin:4px 0 8px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
  .save-choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .save-choices button{border:2.5px solid var(--ink);background:var(--paper);border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;text-align:left;min-height:52px;display:flex;align-items:center;gap:10px}
  body.urdu .save-choices button{text-align:right}
  .save-choices button .cem{font-size:26px}
  .save-choices button.right{border-color:var(--ok);background:#e8f2ed}
  .save-choices button.wrong{border-color:var(--left);background:#fbeae8}
  .step-row{position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding-top:0;min-height:auto}
  .step-slot{min-width:70px;min-height:72px;border:2.5px dashed rgba(30,42,26,.45);border-radius:14px;background:rgba(253,250,243,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;font-weight:800;font-size:var(--fs-cap);color:var(--ink-soft);cursor:pointer}
  .step-slot.filled{border-style:solid;border-color:var(--ink);background:var(--paper);color:var(--ink)}
  .step-slot .em{font-size:28px;line-height:1}
  .step-arrow{font-size:18px;font-weight:800;color:var(--rover);padding:0 1px}
  .part-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
  .part-btn{border:2.5px solid var(--ink);background:var(--paper);border-radius:14px;padding:10px 12px;font:inherit;font-weight:800;font-size:var(--fs-cap);cursor:pointer;min-height:48px;display:flex;align-items:center;gap:6px}
  .part-btn.selected{border-color:var(--accent);background:#eaf1f9;box-shadow:0 0 0 3px rgba(91,143,217,.2)}
  .part-btn.ok{border-color:var(--ok);background:#e8f2ed}
  .badge-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0;position:relative;z-index:5}
  .mini-badge{border:2px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff;font-size:var(--fs-cap);font-weight:800;display:flex;align-items:center;gap:4px}
  .outcome{margin-top:10px;border-radius:14px;padding:10px 12px;font-weight:700;font-size:var(--fs-xs);display:none;border:2px solid var(--ok);background:#e8f2ed;color:var(--ok)}
  .outcome.show{display:block}
  .outcome.bad{border-color:var(--left);background:#fbeae8;color:var(--left)}
  .readout{margin-top:-18px;position:relative;z-index:2;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:16px 18px}
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.win{background:var(--ok)}
  .statechip.miss{background:var(--left)}
  .headline{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .headline.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
  .hintbox{margin-top:14px;border:2px solid var(--accent);background:#eaf1f9;border-radius:14px;padding:11px 14px;font-size:var(--fs-xs);color:var(--accent);font-weight:700;line-height:1.55;display:none}
  .hintbox.show{display:block}
  body.urdu .hintbox{line-height:var(--lh)}
  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .prog{margin:0 0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft)}
  .btns{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}
  .btns button{border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;min-height:50px;padding:8px 14px;flex:1}
  .btns .go{background:var(--ink);color:var(--paper)}
  .btns button:active{transform:scale(.97)}
  .btns button:disabled{opacity:.4;cursor:default}
  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .qhead h2{font-size:var(--fs-lg);font-weight:800;margin:0;flex:1}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{display:block;width:100%;text-align:left;margin-bottom:10px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);min-height:50px}
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--left);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}
  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--ink-soft)}
  @media (min-width:820px){
    .wrap{max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;grid-template-areas:"bar   bar" "head  head" "tabs  tabs" "story story" "left  right" "quiz  quiz" "foot  foot";align-items:start}
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .story{grid-area:story} .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation:none !important}}

  /* ---------- WHY ---------- */

    } else {
      pad.innerHTML = spaceSky("mars") + '<div class="ground-strip mars"></div><div class="rover-stage">' + roverSVG({}) + '</div>';

      var row = document.createElement("div");
      row.style.display = "flex"; row.style.flexWrap = "wrap"; row.style.gap = "8px";
      ch.choices.forEach(function(id){

          if (whyDone[ch.id]) return;

            setText($("headline"), t(ch.done));

            tabBadges();
          } else {
            setText($("headline"), t(T.oops));
            $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");

    } else {

      ["rover","arm","probe"].forEach(function(sid){

  function next(){
    if (mode === "why"){
      whyIdx = (whyIdx + 1) % WHY.length; whySelected = null;
      if (WHY[whyIdx].type === "match") whyMap = {};
      renderWhy();
    } else if (mode === "rover"){
      roverIdx = (roverIdx + 1) % ROVER.length; roverSlots = []; roverSelected = null; renderRover();
    } else {
      buildIdx = (buildIdx + 1) % BUILD.length; renderBuild();
    }

  function showHint(){
    var h = mode === "why" ? WHY[whyIdx].hint : mode === "rover" ? ROVER[roverIdx].hint : BUILD[buildIdx].hint;
    var hb = $("hintbox"); setText(hb, t(h)); hb.classList.add("show");
  }

  function resetMode(){
    if (mode === "why"){
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("why-")===0 || k==="mode-why") delete awarded[k]; });
      whyDone = {}; whyMap = {}; whySelected = null; whyIdx = 0; doneModes.why = false;
      recountStars(); renderWhy();
    } else if (mode === "rover"){
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("rover-")===0 || k==="mode-rover") delete awarded[k]; });
      roverDone = {}; roverIdx = 0; roverSlots = []; roverSelected = null; doneModes.rover = false;
      recountStars(); renderRover();
    } else {
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("build-")===0 || k==="mode-build") delete awarded[k]; });
      buildDone = {}; buildPicked = {}; buildIdx = 0; doneModes.build = false;
      recountStars(); renderBuild();
    }
    tabBadges(); applyChrome();
  }

  function cleanSpeakText(s){ return String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }
  function buildSpeakText(){
    var bits = [t(T.title), cleanSpeakText(storyHtml()),
      cleanSpeakText(($("headline") && $("headline").textContent) || ""),
      cleanSpeakText(($("detail") && $("detail").textContent) || ""), t(T.tip)];
    return bits.filter(Boolean).join(". ");
  }
  function pickVoice(voices, want){
    var i, v, L;
    for (i=0;i<voices.length;i++){ v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-"); if (L.indexOf(want) === 0) return v; }
    for (i=0;i<voices.length;i++){ v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-"); if (L.indexOf("en") === 0) return v; }
    return voices[0] || null;
  }
  var speakTimer = null;
  function setSpeaking(on){
    var btn = $("speakBtn"); if (!btn) return;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.style.opacity = on ? "0.65" : "";
  }
  function doSpeak(text, asLang){
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92; u.lang = (asLang === "ur") ? "ur-PK" : "en-US";
    var voices = window.speechSynthesis.getVoices() || [];
    var voice = pickVoice(voices, asLang === "ur" ? "ur" : "en");
    if (voice) u.voice = voice;
    u.onstart = function(){ setSpeaking(true); };
    u.onend = function(){ setSpeaking(false); };
    u.onerror = function(){
      setSpeaking(false);
      if (asLang === "ur"){
        var fallback = cleanSpeakText(T.title.en + ". " + T.storyWhy.en + ". " + T.tip.en);
        var u2 = new SpeechSynthesisUtterance(fallback);
        u2.lang = "en-US"; u2.rate = 0.92;
        var v2 = pickVoice(window.speechSynthesis.getVoices() || [], "en");
        if (v2) u2.voice = v2;
        u2.onstart = function(){ setSpeaking(true); };
        u2.onend = u2.onerror = function(){ setSpeaking(false); };
        window.speechSynthesis.speak(u2);
      }
    };
    window.speechSynthesis.speak(u);
  }
  if ("speechSynthesis" in window){
    try { window.speechSynthesis.getVoices(); } catch (e0) {}
    if (typeof window.speechSynthesis.addEventListener === "function"){
      window.speechSynthesis.addEventListener("voiceschanged", function(){ try { window.speechSynthesis.getVoices(); } catch (e1) {} });
    }
  } else {
    var noBtn = $("speakBtn");
    if (noBtn){ noBtn.disabled = true; noBtn.title = "Voice not available on this device"; }
  }

  $("langBtn").addEventListener("click", function(){ lang = (lang === "en") ? "ur" : "en"; applyLang(); });
  $("tabWhy").addEventListener("click", function(){ setMode("why"); });
  $("tabRover").addEventListener("click", function(){ setMode("rover"); });
  $("tabBuild").addEventListener("click", function(){ setMode("build"); });
  $("nextBtn").addEventListener("click", next);
  $("hintBtn").addEventListener("click", showHint);
  $("resetBtn").addEventListener("click", resetMode);
  $("newQuiz").addEventListener("click", function(){ pickQuiz(); renderQuiz(); });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      var text = buildSpeakText();
      if (!text) return;
      if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
      window.speechSynthesis.cancel();
      setSpeaking(false);
      var speakLang = lang;
      speakTimer = setTimeout(function(){ speakTimer = null; doSpeak(text, speakLang); }, 80);
    }catch(e){ setSpeaking(false); }
  });

  pickQuiz();
  applyLang();
})();
</script>
</body>
</html>
