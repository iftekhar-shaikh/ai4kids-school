<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Citizenship — شہریت | AI4Kids Grade 4 Social Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */

:root{
  --fs-cap: clamp(0.85rem, 2.2vw, 1.05rem);
  --fs-xs: clamp(1rem, 2.6vw, 1.2rem);
  --fs-sm: clamp(1.15rem, 3vw, 1.4rem);
  --fs-md: clamp(1.3rem, 3.4vw, 1.65rem);
  --fs-lg: clamp(1.55rem, 4vw, 2rem);
  --fs-xl: clamp(1.9rem, 5vw, 2.5rem);
}

/* /AI4KIDS_FS_SCALE */

:root{
  --board:#eef0f5; --board-deep:#dde1ea; --accent:#1d4c85; --accent2:#c9702e;
  --ok:#2e7d4f; --no:#c4453a; --ink:#1f2933; --ink-soft:#4a5661; --paper:#fdfaf3;
  --line:#ded5c4; --bin-a:#2f6fb5; --bin-b:#c9702e; --gold:#e8b23d;
  --fs-cap:clamp(14px, 3.8vw, 16px); --fs-xs:clamp(16px, 4.2vw, 18px);
  --fs-sm:clamp(18px, 4.8vw, 20px); --fs-md:clamp(19px, 5.2vw, 22px);
  --fs-lg:clamp(22px, 6vw, 26px); --fs-xl:clamp(30px, 8vw, 38px); --lh:1.55;
}
body.urdu{
  --fs-cap:clamp(17px, 4.4vw, 18px); --fs-xs:clamp(18px, 4.7vw, 20px);
  --fs-sm:clamp(20px, 5.2vw, 22px); --fs-md:clamp(21px, 5.6vw, 24px);
  --fs-lg:clamp(24px, 6.4vw, 28px); --fs-xl:clamp(28px, 7.4vw, 34px); --lh:2.05;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;font-size:var(--fs-sm);line-height:1.55;padding:0 0 40px}
body.urdu{font-family:"Noto Nastaliq Urdu","Baloo Bhaijaan 2",serif;line-height:var(--lh)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px;flex-wrap:wrap}
.brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
.chip{border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;font-size:var(--fs-xs);cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:focus-visible,button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
h1{font-size:var(--fs-xl);line-height:1.25;font-weight:800;margin:8px 0 4px}
body.urdu h1{line-height:1.9}
.sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
.tabs{display:flex;gap:7px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{flex:1;min-width:88px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;font-size:var(--fs-cap);cursor:pointer;min-height:54px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.scene{position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);min-height:200px;padding:14px}
.play{width:100%;margin-top:12px;border:3px solid var(--ink);border-radius:18px;background:var(--ink);color:var(--paper);font:inherit;font-weight:800;font-size:var(--fs-md);cursor:pointer;min-height:60px}
.play:active{transform:scale(.98)}
.play.alt{background:var(--paper);color:var(--ink)}
.play.go{background:var(--ok);border-color:var(--ok)}
.play.hidden,.hidden{display:none !important}
.readout{margin-top:12px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:16px 18px}
.statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px}
.statechip.ok{background:var(--ok)}.statechip.no{background:var(--no)}
.lead{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.4}
body.urdu .lead{line-height:1.95}
.detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
.trade{margin-top:14px;border:2px dashed var(--accent2);background:#fbf1e8;border-radius:14px;padding:12px 14px;font-size:var(--fs-xs);font-weight:700;color:#8a4a12;line-height:1.6}
.why-note{margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6;border-left:3px solid var(--accent);padding-left:11px}
body.urdu .why-note{border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;line-height:var(--lh)}
.why-note b{color:var(--accent);font-weight:800}
.panel{margin-top:18px}
.panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.schip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 15px;font:inherit;font-size:var(--fs-cap);font-weight:800;color:var(--ink);cursor:pointer;min-height:46px}
.schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.schip.ok{border-color:var(--ok);background:#e8f2ed}
.schip.no{border-color:var(--no);background:#fbeae8}
.lcard{border:3px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;background:#fffdf8}
.lcard .tag{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:3px 12px;font-size:var(--fs-cap);font-weight:800;margin-bottom:8px}
.lcard.hook .tag{background:var(--accent2)}
.lcard.misaal .tag{background:var(--ok)}
.lcard.karo .tag{background:#6b4a8f}
.lcard p{margin:0;font-size:var(--fs-sm);line-height:1.6}
body.urdu .lcard p{line-height:var(--lh)}
.lesson{margin-top:8px}
.quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
.q{margin-bottom:26px}
.q > p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);min-height:52px}
body.urdu .opt{text-align:right}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
.opt.wrong{border-color:var(--no);background:#fbeae8}
.fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.6}
.fb.show{display:block}
.score{margin-top:14px;padding:14px;border:3px solid var(--ink);border-radius:16px;font-weight:800;font-size:var(--fs-md);text-align:center;display:none}
.score.show{display:block}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--ink-soft)}
.sort-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.bin{border:2.5px solid var(--ink);border-radius:14px;padding:10px 8px;min-height:100px;background:rgba(253,250,243,.9);text-align:center}
.bin h3{margin:0 0 8px;font-size:var(--fs-cap);font-weight:800}
.bin.a{border-color:var(--bin-a);background:rgba(232,240,250,.92)}
.bin.b{border-color:var(--bin-b);background:rgba(250,238,220,.92)}
.bin .drop{min-height:50px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.item{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;text-align:center;cursor:pointer;font-weight:800;font-size:var(--fs-cap);user-select:none;min-width:70px}
.item.sel{border-color:var(--accent);background:#e8eef8;box-shadow:0 0 0 3px rgba(29,76,133,.2)}
.item.ok{border-color:var(--ok);background:#e8f2ed}
.item.no{border-color:var(--no);background:#fbeae8}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{border:3px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center;cursor:pointer;background:#fffdf8}
.tcard.on{border-color:var(--accent);background:#e8eef8}
.tcard .em{font-size:36px;display:block;margin-bottom:4px}
.tcard b{display:block;font-size:var(--fs-sm);font-weight:800}
.tcard span{display:block;font-size:var(--fs-cap);color:var(--ink-soft);margin-top:4px;font-weight:700}
.choice{display:flex;flex-direction:column;gap:8px}
.choice button{border:2.5px solid var(--ink);background:var(--paper);border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;text-align:left;min-height:52px;display:flex;align-items:center;gap:10px}
body.urdu .choice button{text-align:right}
.choice button.right{border-color:var(--ok);background:#e8f2ed}
.choice button.wrong{border-color:var(--no);background:#fbeae8}
.slider-row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.slider-row input[type=range]{flex:1;min-width:140px;height:36px;accent-color:var(--accent)}
.compass{width:160px;height:160px;margin:10px auto;border-radius:50%;border:4px solid var(--ink);background:#fff;position:relative;display:flex;align-items:center;justify-content:center}
.compass .n,.compass .s,.compass .e,.compass .w{position:absolute;font-weight:800;font-size:var(--fs-md);cursor:pointer;padding:4px 8px;border-radius:8px}
.compass .n{top:6px;left:50%;transform:translateX(-50%)}.compass .s{bottom:6px;left:50%;transform:translateX(-50%)}
.compass .e{right:8px;top:50%;transform:translateY(-50%)}.compass .w{left:8px;top:50%;transform:translateY(-50%)}
.compass .n.on,.compass .s.on,.compass .e.on,.compass .w.on{background:var(--accent);color:#fff}
.compass .needle{width:4px;height:50px;background:var(--no);border-radius:2px;transform-origin:bottom center;transition:transform .3s}
.piggy{text-align:center;padding:16px}
.piggy .jar{font-size:64px;line-height:1}
.piggy .coins{font-size:var(--fs-lg);font-weight:800;margin:8px 0}
.check-list{display:flex;flex-direction:column;gap:8px}
.check-list label{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:800;font-size:var(--fs-xs);cursor:pointer;background:#fff}
.check-list label.on{border-color:var(--ok);background:#e8f2ed}
.check-list input{width:22px;height:22px;accent-color:var(--ok)}
.tl{margin:12px 0}
.tl-marks{display:flex;justify-content:space-between;font-size:var(--fs-cap);font-weight:800;margin-top:6px}
@media (min-width:820px){
  .wrap{max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "lesson lesson" "quiz quiz" "foot foot";align-items:start}
  .bar{grid-area:bar}.head{grid-area:head}.tabs{grid-area:tabs}.left{grid-area:left}.right{grid-area:right}
  .lesson{grid-area:lesson}.quiz{grid-area:quiz;margin-top:34px}footer{grid-area:foot}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition-duration:.01ms !important}}

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}

<body>
<div class="wrap">
  <div class="bar">
    <span class="brand">AI4Kids · Grade 4 · Social Studies</span>
    <button class="chip" id="langBtn" aria-pressed="false">اردو</button>
    <button class="chip" id="speakBtn" aria-label="Sunlo">🔊</button>
  </div>
  <div class="head">
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
  </div>
  <div class="tabs" role="group" id="tabs"></div>
  <div class="left">
    <div class="scene" id="scene"></div>
    <div class="readout">
      <span class="statechip" id="statechip"></span>
      <p class="lead" id="lead"></p>
      <p class="detail" id="detail"></p>
      <p class="trade" id="trade"></p>
      <p class="why-note"><b id="whyLbl"></b> <span id="whyText"></span></p>
    </div>
  </div>
  <div class="right">
    <div class="panel">
      <h2 id="panelHead"></h2>
      <div class="chips" id="chips" role="group"></div>
      <div id="controls"></div>
      <button type="button" class="play" id="playBtn"></button>
      <button type="button" class="play alt" id="playBtn2" style="margin-top:8px"></button>
    </div>
  </div>
  <div class="lesson" id="lessonBox"></div>
  <div class="quiz">
    <h2 id="quizHead" style="font-size:var(--fs-lg);font-weight:800;margin:0 0 18px"></h2>
    <div id="quizBox"></div>
    <div class="score" id="scoreBox"></div>
  </div>
  <footer><p id="foot"></p></footer>
</div>
<script>
(function(){
"use strict";
var lang="en", tab="main";
function $(id){ return document.getElementById(id); }
function t(o){ return (o && typeof o==="object") ? (o[lang]||o.en||"") : (o||""); }
function setText(el, s){
  if(!el) return;
  el.textContent = s;
  if(lang==="ur"){ el.setAttribute("dir","rtl"); }
  else { el.setAttribute("dir","ltr"); }
}
function buildTabs(list){
  var tabs=$("tabs"); tabs.innerHTML="";
  list.forEach(function(x){
    var b=document.createElement("button"); b.type="button";
    b.setAttribute("aria-pressed", tab===x[0]?"true":"false");
    setText(b, t(x[1]));
    b.addEventListener("click", function(){ if(tab===x[0]) return; tab=x[0]; if(typeof onTab==="function") onTab(); render(); });
    tabs.appendChild(b);
  });
}
function buildLesson(){
  var box=$("lessonBox"); if(!box) return; box.innerHTML="";
  var cards=[{cls:"hook", tag:{en:"HOOK",ur:"ہک"}, body:LESSON.hook},
   {cls:"samjhao", tag:{en:"SAMJHAO",ur:"سمجھاؤ"}, body:LESSON.samjhao},
   {cls:"misaal", tag:{en:"MISAAL",ur:"مثال"}, body:LESSON.misaal}];
  if(LESSON.karo) cards.push({cls:"karo", tag:{en:"KARO",ur:"کرو"}, body:LESSON.karo});
  cards.forEach(function(c){
    var d=document.createElement("div"); d.className="lcard "+c.cls;
    var tag=document.createElement("span"); tag.className="tag"; setText(tag,t(c.tag));
    var p=document.createElement("p"); setText(p,t(c.body));
    d.appendChild(tag); d.appendChild(p); box.appendChild(d);
  });
}
var quizScore=0, quizDone=0;
function buildQuiz(){
  var box=$("quizBox"); box.innerHTML=""; quizScore=0; quizDone=0;
  var sb=$("scoreBox"); sb.classList.remove("show"); sb.textContent="";
  setText($("quizHead"), t({en:"Check yourself", ur:"اپنا امتحان لیں"}));
  QUIZ.forEach(function(item){
    var wrap=document.createElement("div"); wrap.className="q";
    var q=document.createElement("p"); setText(q, t(item.q)); wrap.appendChild(q);
    var fb=document.createElement("p"); fb.className="fb";
    ["a","b","c","d"].forEach(function(k, oi){
      var b=document.createElement("button"); b.type="button"; b.className="opt";
      b.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      b.textContent = String.fromCharCode(65+oi)+". "+t(item[k]);
      b.addEventListener("click", function(){
        if(wrap.getAttribute("data-done")==="1") return;
        wrap.setAttribute("data-done","1"); quizDone++;
        if(item.correct===k) quizScore++;
        ["a","b","c","d"].forEach(function(kk, xi){
          var btn=wrap.querySelectorAll(".opt")[xi];
          if(kk===item.correct) btn.classList.add("right");
          else if(kk===k) btn.classList.add("wrong");
        });
        setText(fb, t(item.explanation)); fb.classList.add("show");
        if(quizDone===QUIZ.length){
          sb.classList.add("show");
          setText(sb, t({en:"Score: "+quizScore+" / "+QUIZ.length, ur:"سکور: "+quizScore+" / "+QUIZ.length}));
        }
      });
      wrap.appendChild(b);
    });
    wrap.appendChild(fb); box.appendChild(wrap);
  });
}
function applyLang(){
  document.body.classList.toggle("urdu", lang==="ur");
  document.documentElement.lang = (lang==="ur") ? "ur" : "en";
  var lb=$("langBtn");
  lb.textContent = (lang==="en") ? "اردو" : "English";
  lb.setAttribute("aria-pressed", lang==="ur" ? "true":"false");
  setText($("foot"), t({en:"AI4Kids — Islamabad's bilingual AI and coding school. Offline · Grade 4 Social Studies. WhatsApp 0337 1468899",
    ur:"اے آئی فور کڈز — اسلام آباد کا دو زبانوں والا سکول۔ آف لائن · گریڈ 4 سماجی علوم۔ واٹس ایپ 0337 1468899"}));
  setText($("whyLbl"), t({en:"Notice:",ur:"غور کریں:"}));
  buildLesson(); buildQuiz(); render();
}
$("langBtn").addEventListener("click", function(){ lang=(lang==="en")?"ur":"en"; applyLang(); });
$("speakBtn").addEventListener("click", function(){
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var lead=$("lead"); var text = (lead && lead.textContent) || ($("title")&&$("title").textContent) || "";
    var u=new SpeechSynthesisUtterance(text);
    u.lang=(lang==="ur")?"ur-PK":"en-US"; u.rate=0.92;
    window.speechSynthesis.speak(u);
  }catch(e){}
});
function onTab(){}

var LESSON={
  hook:{en:"In an Islamabad park, if someone litters — what will YOU do? One small act can keep our city clean!",
        ur:"اسلام آباد کے پارک میں اگر کوئی کوڑا پھینکے تو آپ کیا کریں گے؟ چھوٹے سے کام سے شہر صاف رہ سکتا ہے!"},
  samjhao:{en:"A citizen is a person who belongs to a country. A global citizen cares about people worldwide. A digital citizen stays polite and safe online too. Rights (huqooq) like education and care — and responsibilities like following laws, respecting others, and not littering. Civic sense: wait in line, don't shout, and help others.",
           ur:"شہری وہ شخص ہے جو کسی ملک کا حصہ ہو۔ عالمی شہری دنیا کے لوگوں کا خیال رکھتا ہے۔ ڈیجیٹل شہری انٹرنیٹ پر بھی تمیز اور حفاظت رکھتا ہے۔ حقوق جیسے تعلیم اور خیال رکھنا — اور ذمہ داریاں جیسے قانون ماننا، دوسروں کا احترام، اور گندگی نہ پھینکنا۔ شہری حس: لائن میں کھڑے ہونا، شور نہ کرنا، اور مدد کرنا۔"},
  misaal:{en:"Giving a seat on the school bus, waiting at a traffic light, and not forwarding fake news on WhatsApp — these are good citizen acts.",
          ur:"اسکول بس میں سیٹ دینا، ٹریفک لائٹ پر انتظار، اور واٹس ایپ پر جھوٹی خبر آگے نہ بھیجنا — یہ اچھے شہری کے کام ہیں۔"},
  karo:{en:"At home make a list of 3 rights and 3 responsibilities. Write one digital safety rule.",
        ur:"گھر میں 3 حقوق اور 3 ذمہ داریوں کی فہرست بناؤ۔ ایک ڈیجیٹل سیفٹی قاعدہ لکھو۔"}
};
var QUIZ=[
  {q:{en:"What is a citizen part of?",ur:"شہری کس چیز کا حصہ ہوتا ہے؟"},a:{en:"Country / community",ur:"ملک / کمیونٹی"},b:{en:"Only school",ur:"صرف اسکول"},c:{en:"Only a park",ur:"صرف پارک"},d:{en:"Only a mobile",ur:"صرف موبائل"},correct:"a",explanation:{en:"A citizen belongs to a country and community.",ur:"شہری ملک اور کمیونٹی کا حصہ ہوتا ہے۔"}},
  {q:{en:"Not littering is an example of…",ur:"کوڑا نہ پھینکنا کس قسم کی بات ہے؟"},a:{en:"A responsibility",ur:"ذمہ داری"},b:{en:"Only a game",ur:"صرف گیم"},c:{en:"Only fashion",ur:"صرف فیشن"},d:{en:"Only a holiday",ur:"صرف چھٹی"},correct:"a",explanation:{en:"Keeping places clean is a responsibility.",ur:"صاف رہنا ذمہ داری ہے۔"}},
  {q:{en:"A digital citizen keeps what online?",ur:"ڈیجیٹل شہری انٹرنیٹ پر کیا رکھتا ہے؟"},a:{en:"Manners and safety",ur:"تمیز اور حفاظت"},b:{en:"Only games",ur:"صرف گیمز"},c:{en:"Only photos",ur:"صرف تصاویر"},d:{en:"Only jokes",ur:"صرف مذاق"},correct:"a",explanation:{en:"A digital citizen stays safe and respectful.",ur:"ڈیجیٹل شہری محفوظ اور مؤدب رہتا ہے۔"}},
  {q:{en:"Waiting in a line shows…",ur:"لائن میں کھڑے ہونا کس چیز کی مثال ہے؟"},a:{en:"Civic sense",ur:"شہری حس"},b:{en:"A math sum",ur:"ریاضی کا سوال"},c:{en:"A drone flight",ur:"ڈرون پرواز"},d:{en:"Cooking",ur:"کھانا پکانا"},correct:"a",explanation:{en:"Line manners are civic sense.",ur:"لائن کے آداب شہری حس ہیں۔"}},
  {q:{en:"Forwarding fake news?",ur:"جھوٹی خبر آگے بھیجنا؟"},a:{en:"Wrong — check first",ur:"غلط — پہلے چیک کرو"},b:{en:"Always fine",ur:"ہمیشہ ٹھیک"},c:{en:"Only OK at night",ur:"صرف رات کو ٹھیک"},d:{en:"Don't tell the teacher",ur:"استاد کو نہ بتاؤ"},correct:"a",explanation:{en:"Verify first, then share.",ur:"پہلے تصدیق کرو، پھر شیئر کرو۔"}}
];
var selItem=null, sortDone=false, sceneIdx=0, tipIdx=0;
var SORT_ITEMS=[
  {id:"edu",em:"📚",bin:"r",en:"Right to learn",ur:"سیکھنے کا حق"},
  {id:"safe",em:"🛡️",bin:"r",en:"Feel safe",ur:"محفوظ رہنا"},
  {id:"lit",em:"🗑️",bin:"s",en:"No littering",ur:"کوڑا نہ پھینکو"},
  {id:"line",em:"🧍",bin:"s",en:"Wait in line",ur:"لائن میں انتظار"},
  {id:"care",em:"🏥",bin:"r",en:"Care when sick",ur:"بیماری میں دیکھ بھال"},
  {id:"resp",em:"🙏",bin:"s",en:"Respect others",ur:"دوسروں کا احترام"}
];
var placed={};
var SCENES=[
  {em:"🏞️🗑️",en:"Park litter",ur:"پارک میں کوڑا",q:{en:"You see a wrapper on the grass. What should a good citizen do?",ur:"گھاس پر ریپر دیکھا۔ اچھا شہری کیا کرے؟"},
   opts:[{id:"pick",en:"Pick it up → bin",ur:"اٹھا کر ڈالے میں",ok:1},{id:"kick",en:"Kick it away",ur:"لات مار کر ہٹاؤ",ok:0},{id:"add",en:"Add your own",ur:"اپنا بھی چھوڑو",ok:0}]},
  {em:"🧃🧍",en:"Canteen line",ur:"کینٹین لائن",q:{en:"The queue is long. Your friend is near the front. You…",ur:"قطار لمبی ہے۔ دوست آگے ہے۔ تم…"},
   opts:[{id:"wait",en:"Wait your turn",ur:"اپنی باری انتظار",ok:1},{id:"cut",en:"Cut in with friend",ur:"دوست کے ساتھ گھسو",ok:0},{id:"push",en:"Push others",ur:"دوسروں کو دھکیلو",ok:0}]},
  {em:"🚌💺",en:"School bus",ur:"اسکول بس",q:{en:"An older person needs a seat on the bus. You…",ur:"بڑی عمر کے شخص کو سیٹ چاہیے۔ تم…"},
   opts:[{id:"give",en:"Offer your seat",ur:"اپنی سیٹ دو",ok:1},{id:"ignore",en:"Look at phone",ur:"فون دیکھو",ok:0},{id:"laugh",en:"Laugh and stay",ur:"ہنسو اور بیٹھے رہو",ok:0}]}
];
var TIPS=[
  {em:"🔐",en:"Don't share passwords",ur:"پاس ورڈ شیئر نہ کرو",d:{en:"Keep passwords private — even from classmates.",ur:"پاس ورڈ خفیہ رکھو — ہم جماعت سے بھی۔"}},
  {em:"✅",en:"Check before share",ur:"شیئر سے پہلے چیک",d:{en:"Fake news spreads fast. Ask: is this true?",ur:"جھوٹی خبر تیزی سے پھیلتی ہے۔ پوچھو: کیا یہ سچ ہے؟"}},
  {em:"🤝",en:"Be kind online",ur:"آن لائن مہربان رہو",d:{en:"Write messages you would say face to face.",ur:"ویسا لکھو جو سامنے کہو گے۔"}},
  {em:"👨‍👩‍👧",en:"Tell a trusted adult",ur:"بھروسے مند بالغ کو بتاؤ",d:{en:"If something feels wrong online, tell family or a teacher.",ur:"اگر آن لائن کچھ غلط لگے تو گھر والوں یا استاد کو بتاؤ۔"}}
];
function renderSort(){
  var sc=$("scene"); sc.innerHTML="";
  var wrap=document.createElement("div"); wrap.className="sort-wrap";
  var ba=document.createElement("div"); ba.className="bin a"; ba.innerHTML="<h3></h3><div class='drop' id='dropR'></div>";
  var bb=document.createElement("div"); bb.className="bin b"; bb.innerHTML="<h3></h3><div class='drop' id='dropS'></div>";
  setText(ba.querySelector("h3"), t({en:"✊ Rights",ur:"✊ حقوق"}));
  setText(bb.querySelector("h3"), t({en:"✋ Responsibilities",ur:"✋ ذمہ داریاں"}));
  wrap.appendChild(ba); wrap.appendChild(bb); sc.appendChild(wrap);
  var bank=document.createElement("div"); bank.className="bank"; bank.id="bank";
  SORT_ITEMS.forEach(function(it){
    if(placed[it.id]) return;
    var el=document.createElement("div"); el.className="item"+(selItem===it.id?" sel":"");
    el.textContent=it.em+" "+t({en:it.en,ur:it.ur});
    el.onclick=function(){ selItem=it.id; render(); };
    bank.appendChild(el);
  });
  sc.appendChild(bank);
  ["r","s"].forEach(function(bin){
    var drop=$(bin==="r"?"dropR":"dropS");
    SORT_ITEMS.forEach(function(it){
      if(placed[it.id]!==bin) return;
      var el=document.createElement("div"); el.className="item "+(sortDone?(it.bin===bin?"ok":"no"):"");
      el.textContent=it.em;
      drop.appendChild(el);
    });
  });
  ba.onclick=function(){ if(!selItem||sortDone) return; placed[selItem]="r"; selItem=null; render(); };
  bb.onclick=function(){ if(!selItem||sortDone) return; placed[selItem]="s"; selItem=null; render(); };
}
function render(){
  buildTabs([["sort",{en:"Rights / duties",ur:"حقوق / ذمہ داری"}],["scenes",{en:"Civic scenes",ur:"شہری مناظر"}],["digital",{en:"Digital tips",ur:"ڈیجیٹل Tip"}]]);
  if(!tab||tab==="main") tab="sort";
  var chips=$("chips"); chips.innerHTML=""; $("controls").innerHTML="";
  var play=$("playBtn"), play2=$("playBtn2");
  play.className="play"; play2.className="play alt hidden";
  setText($("title"), t({en:"Citizenship",ur:"شہریت"}));
  if(tab==="sort"){
    setText($("subtitle"), t({en:"Tap a card, then tap Rights or Responsibilities.",ur:"کارڈ ٹیپ کرو، پھر حقوق یا ذمہ داری۔"}));
    setText($("panelHead"), t({en:"Sort the cards",ur:"کارڈ چھانٹو"}));
    renderSort();
    var n=Object.keys(placed).length;
    setText($("statechip"), t({en:"Sorted "+n+"/6",ur:"چھانٹی "+n+"/6"}));
    setText($("lead"), t({en:"Rights protect you. Responsibilities help everyone.",ur:"حقوق تمہیں بچاتے ہیں۔ ذمہ داریاں سب کی مدد کرتی ہیں۔"}));
    setText($("detail"), t({en:"Education & safety = rights. No litter & respect = responsibilities.",ur:"تعلیم و سلامتی = حقوق۔ کوڑا نہ اور احترام = ذمہ داریاں۔"}));
    setText($("trade"), t({en:"Islamabad tip: kids practise citizenship every day!",ur:"اسلام آباد ٹپ: بچے روز شہریت اپناتے ہیں!"}));
    setText($("whyText"), t({en:"A good citizen balances haqooq AND zimmedariyan.",ur:"اچھا شہری حقوق اور ذمہ داریاں دونوں رکھتا ہے۔"}));
    setText(play, t({en:"Check sort",ur:"چھانٹی چیک"}));
    play.onclick=function(){
      if(Object.keys(placed).length<6){ setText($("lead"), t({en:"Place all 6 cards first!",ur:"پہلے تمام 6 کارڈ رکھو!"})); return; }
      sortDone=true; var ok=0;
      SORT_ITEMS.forEach(function(it){ if(placed[it.id]===it.bin) ok++; });
      $("statechip").className="statechip "+(ok===6?"ok":"no");
      setText($("statechip"), t({en:ok+"/6 correct",ur:ok+"/6 درست"}));
      setText($("lead"), ok===6?t({en:"Shabash — perfect sort!",ur:"شاباش — بہترین!"}):t({en:"Almost — try Reset",ur:"قریب — ری سیٹ کرو"}));
      renderSort();
    };
    play2.classList.remove("hidden");
    setText(play2, t({en:"Reset",ur:"ری سیٹ"}));
    play2.onclick=function(){ placed={}; selItem=null; sortDone=false; $("statechip").className="statechip"; render(); };
    return;
  }
  if(tab==="scenes"){
    var s=SCENES[sceneIdx];
    setText($("subtitle"), t({en:"Pick the better citizen action.",ur:"بہتر شہری عمل چنو۔"}));
    setText($("panelHead"), t({en:"Scene "+(sceneIdx+1)+" of 3",ur:"منظر "+(sceneIdx+1)+" / 3"}));
    $("scene").innerHTML="<div style='text-align:center;font-size:56px;padding:20px 0'>"+s.em+"</div>";
    setText($("statechip"), t({en:s.en,ur:s.ur}));
    setText($("lead"), t(s.q));
    setText($("detail"),""); setText($("trade"),"");
    setText($("whyText"), t({en:"Civic sense = small kind choices every day.",ur:"شہری حس = روز مرہ چھوٹے اچھے انتخاب۔"}));
    var box=document.createElement("div"); box.className="choice";
    s.opts.forEach(function(o){
      var b=document.createElement("button"); b.type="button";
      setText(b, t({en:o.en,ur:o.ur}));
      b.onclick=function(){
        box.querySelectorAll("button").forEach(function(x){ x.classList.remove("right","wrong"); x.disabled=true; });
        if(o.ok){ b.classList.add("right"); setText($("lead"), t({en:"Shabash — good citizen!",ur:"شاباش — اچھے شہری!"})); $("statechip").className="statechip ok"; }
        else { b.classList.add("wrong"); setText($("lead"), t({en:"Try a kinder choice",ur:"مہربان انتخاب آزماؤ"})); $("statechip").className="statechip no";
          s.opts.forEach(function(oo,i){ if(oo.ok) box.children[i].classList.add("right"); });
        }
      };
      box.appendChild(b);
    });
    $("controls").appendChild(box);
    setText(play, t({en:"Next scene",ur:"اگلا منظر"}));
    play.onclick=function(){ sceneIdx=(sceneIdx+1)%SCENES.length; $("statechip").className="statechip"; render(); };
    return;
  }
  setText($("subtitle"), t({en:"Be a safe, kind digital citizen.",ur:"محفوظ، مہربان ڈیجیٹل شہری بنو۔"}));
  setText($("panelHead"), t({en:"Tip cards",ur:"ٹپ کارڈز"}));
  var tip=TIPS[tipIdx];
  $("scene").innerHTML="<div style='text-align:center;padding:24px'><div style='font-size:64px'>"+tip.em+"</div></div>";
  setText($("statechip"), t({en:"Digital tip "+(tipIdx+1),ur:"ڈیجیٹل ٹپ "+(tipIdx+1)}));
  setText($("lead"), t({en:tip.en,ur:tip.ur}));
  setText($("detail"), t(tip.d));
  setText($("trade"), t({en:"WhatsApp tip: pause before you forward!",ur:"واٹس ایپ ٹپ: آگے بھیجنے سے پہلے رک جاؤ!"}));
  setText($("whyText"), t({en:"Digital manners protect you and your friends.",ur:"ڈیجیٹل آداب تمہیں اور دوستوں کو بچاتے ہیں۔"}));
  TIPS.forEach(function(tp,i){
    var b=document.createElement("button"); b.type="button"; b.className="schip";
    b.setAttribute("aria-pressed", tipIdx===i?"true":"false");
    setText(b, tp.em+" "+(i+1));
    b.onclick=function(){ tipIdx=i; render(); };
    chips.appendChild(b);
  });
  setText(play, t({en:"Next tip",ur:"اگلی ٹپ"}));
  play.onclick=function(){ tipIdx=(tipIdx+1)%TIPS.length; render(); };
}

applyLang();
})();
</script>
</body>
</html>
