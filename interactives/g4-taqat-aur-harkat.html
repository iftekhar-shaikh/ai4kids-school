<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forces — قوتیں اور کششِ ثقل | AI4Kids Class 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#e6eef6;
    --sky-deep:#cfdce9;
    --vac:#20293a;
    --ground:#9b8b72;
    --ground-deep:#7d6f5b;
    --grav:#c9402e;
    --drag:#2f6fb5;
    --ink:#1f2933;
    --ink-soft:#4a5661;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#3a4a5c;
    --good:#2e7d4f;

    --fs-cap:clamp(14px, 3.8vw, 16px);--fs-xs:clamp(16px, 4.2vw, 18px);--fs-sm:clamp(18px, 4.8vw, 20px);--fs-md:clamp(19px, 5.2vw, 22px);--fs-lg:clamp(22px, 6vw, 26px);--fs-xl:clamp(30px, 8vw, 38px);
    --lh:1.5;
  }
  /* Urdu is set larger than Latin — Nastaliq reads smaller at the same size. */
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);--fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);--fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--grav);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 16px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky-deep) 100%);
    transition:background .5s ease;
  }
  .scene.vacuum{background:linear-gradient(180deg,#2c3648 0%,var(--vac) 100%)}
  .scene svg{display:block;width:100%;height:auto}
  .faller{transition:transform 0s linear}
  .airdot{fill:#fff;opacity:.5;transition:opacity .4s ease}
  .vacuum .airdot{opacity:0}
  .lbl{font-size:var(--fs-cap);font-weight:800;font-family:"Baloo Bhaijaan 2",sans-serif}
  .cap{fill:var(--ink-soft);font-size:var(--fs-cap);font-weight:700;
       font-family:"Baloo Bhaijaan 2",sans-serif}
  .vacuum .cap{fill:#c6d0dc}
  body.urdu .cap{font-family:"Noto Nastaliq Urdu",serif}

  .readout{
    margin-top:-18px;position:relative;z-index:2;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px;
             background:var(--accent);transition:background .3s ease}
  .statechip.ur{padding:2px 14px 7px}
  .verdict{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .verdict.ur{line-height:1.95}
  .why{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .forces{display:flex;gap:10px;margin-top:16px}
  .fbox{flex:1;border:2px solid var(--line);border-radius:14px;padding:11px 10px;text-align:center}
  .fbox em{display:block;font-style:normal;font-size:var(--fs-cap);color:var(--ink-soft);
           font-weight:600;margin-bottom:6px}
  .fbox b{display:block;font-size:var(--fs-xs);font-weight:800;line-height:1.3}
  .fbox.g{border-color:var(--grav);background:#fbeae7}
  .fbox.g b{color:var(--grav)}
  .fbox.d{border-color:var(--drag);background:#e9eff7}
  .fbox.d b{color:var(--drag)}
  .fbox.off{opacity:.4}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}
  body.urdu .why-note{
    border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;
    line-height:var(--lh);
  }

  .ctl{margin-top:22px}
  .ctl h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .bigbtn{
    width:100%;border:2px solid var(--ink);border-radius:16px;background:var(--ink);color:var(--paper);
    font:inherit;font-weight:800;font-size:var(--fs-md);cursor:pointer;min-height:58px;
  }
  .bigbtn:disabled{opacity:.4;cursor:default}
  .bigbtn:active:not(:disabled){transform:scale(.98)}
  .airbtn{
    width:100%;border:2px solid var(--ink);border-radius:16px;background:var(--paper);color:var(--ink);
    font:inherit;font-weight:800;font-size:var(--fs-sm);cursor:pointer;min-height:54px;margin-top:10px;
  }
  .airbtn.off{background:var(--vac);color:#fff;border-color:var(--vac)}

  .pickers{margin-top:22px}
  .pickers h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .lane{margin-bottom:14px}
  .lane .who{font-size:var(--fs-cap);font-weight:800;color:var(--ink-soft);margin-bottom:7px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .ochip{
    border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;
    font:inherit;font-size:var(--fs-cap);font-weight:600;color:var(--ink);cursor:pointer;min-height:44px;
  }
  .ochip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--good);background:#e6f4ec;font-weight:600}
  .opt.wrong{border-color:var(--grav);background:#fbeae4}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;
      grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar"
        "head  head"
        "left  right"
        "quiz  quiz"
        "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar}
    .head{grid-area:head}
    .left{grid-area:left}
    .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px}
    footer{grid-area:foot}
    .ctl{margin-top:0}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <span class="brand">AI4Kids · Class 5</span>
    <button class="chip" id="langBtn" aria-pressed="false">اردو</button>
    <button class="chip" id="speakBtn" aria-label="Sunein">🔊</button>
  </div>

  <div class="head">
  <h1 data-en="Does a heavier thing fall faster?" data-ur="کیا بھاری چیز تیز گرتی ہے؟"></h1>
  <p class="sub" data-en="Pick two things, drop them, and see for yourself." data-ur="دو چیزیں چنیں، گرائیں، اور خود دیکھ لیں۔"></p>
  </div>

  <div class="left">
  <div class="scene" id="scene">
    <svg viewBox="0 0 300 300" role="img" aria-label="Two objects held at the same height, ready to be dropped">
      <g id="air"></g>
      <text x="150" y="22" text-anchor="middle" class="cap" id="airLbl"></text>

      <!-- release line -->
      <line x1="30" y1="46" x2="270" y2="46" stroke="var(--ink-soft)"
            stroke-width="2" stroke-dasharray="5 6" opacity=".5"/>

      <g id="laneA"></g>
      <g id="laneB"></g>

      <rect x="0" y="272" width="300" height="28" fill="var(--ground)"/>
      <rect x="0" y="272" width="300" height="5" fill="var(--ground-deep)"/>
    </svg>
  </div>

  <div class="readout">
    <span class="statechip" id="statechip"></span>
    <p class="verdict" id="verdict"></p>
    <p class="why" id="why"></p>

    <div class="forces">
      <div class="fbox g">
        <em id="lblGrav"></em>
        <b id="valGrav"></b>
      </div>
      <div class="fbox d" id="dragBox">
        <em id="lblDrag"></em>
        <b id="valDrag"></b>
      </div>
    </div>

    <p class="why-note"><b id="whyLbl"></b> <span id="whyText"></span></p>
  </div>
  </div>

  <div class="right">
  <div class="ctl">
    <h2 id="ctlHead"></h2>
    <button type="button" class="bigbtn" id="dropBtn"></button>
    <button type="button" class="airbtn" id="airBtn"></button>
  </div>

  <div class="pickers">
    <h2 id="pickHead"></h2>
    <div class="lane">
      <div class="who" id="whoA"></div>
      <div class="chips" id="chipsA" role="group"></div>
    </div>
    <div class="lane">
      <div class="who" id="whoB"></div>
      <div class="chips" id="chipsB" role="group"></div>
    </div>
  </div>
  </div>

  <div class="quiz">
    <h2 id="quizHead" style="font-size:var(--fs-lg);font-weight:800;margin:0 0 18px"></h2>
    <div id="quizBox"></div>
  </div>

  <footer>
    <p data-en="AI4Kids — Islamabad's bilingual AI and coding school. WhatsApp 0337 1468899" data-ur="اے آئی فور کڈز — اسلام آباد کا دو زبانوں والا اے آئی اور کوڈنگ سکول۔ واٹس ایپ 0337 1468899"></p>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var lang = "en";
  var air  = true;
  var A = 0, B = 4;      // feather vs stone to start
  var falling = false;

  // mass drives the gravity arrow, drag drives the air-resistance arrow and the
  // fall time. Note paper and paper-ball share a mass on purpose.
  var O = [
    { en:"Feather", ur:"پَر",            mass:0.05, drag:0.95, c:"#e0d6c2", shape:"feather" },
    { en:"Flat sheet of paper", ur:"کھلا کاغذ",  mass:0.10, drag:0.85, c:"#f4efe2", shape:"sheet" },
    { en:"Same paper, crumpled", ur:"وہی کاغذ، مُڑا ہوا", mass:0.10, drag:0.15, c:"#efe7d4", shape:"ball" },
    { en:"Coin", ur:"سکہ",              mass:0.30, drag:0.05, c:"#b9a06a", shape:"coin" },
    { en:"Stone", ur:"پتھر",            mass:0.90, drag:0.08, c:"#8d8578", shape:"stone" }
  ];

  var T = {
    ctlHead:{en:"Run the test", ur:"تجربہ کریں"},
    pickHead:{en:"What to drop", ur:"کیا گرانا ہے"},
    whoA:{en:"Left side", ur:"بائیں طرف"},
    whoB:{en:"Right side", ur:"دائیں طرف"},
    drop:{en:"Drop them", ur:"دونوں گرائیں"},
    again:{en:"Lift them back up", ur:"دوبارہ اوپر اٹھائیں"},
    airOn:{en:"Air is in the room — tap to take it out", ur:"کمرے میں ہوا ہے — نکالنے کے لیے دبائیں"},
    airOff:{en:"Air has been taken out — tap to put it back", ur:"ہوا نکال دی گئی — واپس لانے کے لیے دبائیں"},
    airCapOn:{en:"air in the room", ur:"کمرے میں ہوا موجود"},
    airCapOff:{en:"no air — a vacuum", ur:"ہوا نہیں — خلا"},
    gravLbl:{en:"Force pulling down", ur:"نیچے کھینچنے والی قوت"},
    dragLbl:{en:"Force pushing up", ur:"اوپر دھکیلنے والی قوت"},
    gravity:{en:"Gravity", ur:"کششِ ثقل"},
    drag:{en:"Air resistance", ur:"ہوا کی رکاوٹ"},
    none:{en:"None — there is no air", ur:"کوئی نہیں — ہوا ہی نہیں"},
    whyLbl:{en:"Notice:", ur:"غور کریں:"},
    quiz:{en:"Check yourself", ur:"اپنا امتحان لیں"},
    ready:{chip:{en:"Ready", ur:"تیار"},
      v:{en:"Both are being held at the same height.", ur:"دونوں ایک ہی اونچائی پر پکڑے ہوئے ہیں۔"},
      w:{en:"Guess first: which one will land on the ground before the other? Then drop them and see.",
         ur:"پہلے اندازہ لگائیں: کون سا زمین پر پہلے پہنچے گا؟ پھر گرا کر دیکھیں۔"}},
    tie:{chip:{en:"They landed together", ur:"دونوں ایک ساتھ گرے"},
      v:{en:"Both hit the ground at the same moment.", ur:"دونوں ایک ہی لمحے زمین پر پہنچے۔"},
      w:{en:"With no air in the way, gravity pulls everything down at exactly the same rate. Heavy or light makes no difference at all.",
         ur:"جب راستے میں ہوا نہ ہو تو کششِ ثقل ہر چیز کو بالکل ایک ہی رفتار سے نیچے کھینچتی ہے۔ بھاری یا ہلکا ہونے سے کوئی فرق نہیں پڑتا۔"}},
    win:{chip:{en:"One landed first", ur:"ایک پہلے گرا"},
      v:{en:"{w} landed first.", ur:"{w} پہلے گرا۔"},
      w:{en:"Gravity pulled both down equally. The difference came from the air: the wider, lighter shape had more air pushing up against it, so it was held back.",
         ur:"کششِ ثقل نے دونوں کو برابر کھینچا۔ فرق ہوا کی وجہ سے پڑا: جو چیز زیادہ چوڑی اور ہلکی تھی، اس پر ہوا نے زیادہ زور لگایا، اس لیے وہ پیچھے رہ گئی۔"}},
    notePaper:{en:"This is the test to do at home. Take one sheet of paper, tear it in half, and crumple one half into a ball. Same paper, same weight — and the ball lands first every time. Weight was never the reason.",
               ur:"یہ تجربہ گھر پر ضرور کریں۔ ایک کاغذ لیں، آدھا پھاڑ دیں، اور آدھے کو مسل کر گیند بنا لیں۔ وہی کاغذ، وہی وزن — اور گیند ہر بار پہلے گرتی ہے۔ وزن کبھی وجہ تھی ہی نہیں۔"},
    noteVac:{en:"An astronaut did exactly this on the Moon, where there is no air: a feather and a hammer, dropped together, hit the ground at the same instant.",
             ur:"چاند پر ایک خلاباز نے بالکل یہی کیا، جہاں ہوا نہیں ہے: ایک پَر اور ایک ہتھوڑا ایک ساتھ گرائے، اور دونوں ایک ہی لمحے زمین پر پہنچے۔"},
    noteAir:{en:"Two forces are working at once here. Gravity pulls down, air resistance pushes up. What you see is the result of the two fighting each other.",
             ur:"یہاں ایک ساتھ دو قوتیں کام کر رہی ہیں۔ کششِ ثقل نیچے کھینچتی ہے، ہوا کی رکاوٹ اوپر دھکیلتی ہے۔ جو نظر آتا ہے وہ ان دونوں کے مقابلے کا نتیجہ ہے۔"}
  };

  var QUIZ = [
    { q:{en:"A stone and a feather are dropped together in a place with no air. What happens?",
         ur:"ایک پتھر اور ایک پَر ایسی جگہ ایک ساتھ گرائے جائیں جہاں ہوا نہ ہو۔ کیا ہوگا؟"},
      o:[{en:"The stone lands first because it is heavier", ur:"پتھر پہلے گرے گا کیونکہ وہ بھاری ہے"},
         {en:"They land at exactly the same moment", ur:"دونوں بالکل ایک ہی لمحے گریں گے"},
         {en:"The feather lands first because it is lighter", ur:"پَر پہلے گرے گا کیونکہ وہ ہلکا ہے"},
         {en:"Neither of them falls at all", ur:"دونوں میں سے کوئی نہیں گرے گا"}],
      a:1,
      f:{en:"Gravity pulls every object down at the same rate. In everyday life the feather looks slower only because the air is holding it back.",
         ur:"کششِ ثقل ہر چیز کو ایک ہی رفتار سے نیچے کھینچتی ہے۔ روزمرہ میں پَر صرف اس لیے سست لگتا ہے کہ ہوا اسے روکے رکھتی ہے۔"} },

    { q:{en:"One sheet of paper is left flat, an identical sheet is crumpled into a ball. Both are dropped in air. Which lands first?",
         ur:"ایک کاغذ کھلا رہنے دیں، بالکل ویسا ہی دوسرا کاغذ مسل کر گیند بنا لیں۔ دونوں ہوا میں گرائیں۔ کون پہلے گرے گا؟"},
      o:[{en:"The crumpled ball, because less air pushes against it",
          ur:"مُڑی ہوئی گیند، کیونکہ اس پر ہوا کم زور لگاتی ہے"},
         {en:"The flat sheet, because it is wider", ur:"کھلا کاغذ، کیونکہ وہ زیادہ چوڑا ہے"},
         {en:"They land together, because they weigh the same",
          ur:"دونوں ایک ساتھ، کیونکہ ان کا وزن برابر ہے"},
         {en:"The crumpled ball, because crumpling made it heavier",
          ur:"مُڑی ہوئی گیند، کیونکہ مسلنے سے وہ بھاری ہو گئی"}],
      a:0,
      f:{en:"Both weigh exactly the same — crumpling adds nothing. Only the shape changed, and a smaller shape catches less air.",
         ur:"دونوں کا وزن بالکل برابر ہے — مسلنے سے کچھ شامل نہیں ہوتا۔ صرف شکل بدلی، اور چھوٹی شکل ہوا کو کم روکتی ہے۔"} },

    { q:{en:"A stone is falling through the air right now. Which forces are acting on it?",
         ur:"ایک پتھر اس وقت ہوا میں گر رہا ہے۔ اس پر کون سی قوتیں کام کر رہی ہیں؟"},
      o:[{en:"Only gravity, pulling it down", ur:"صرف کششِ ثقل، جو اسے نیچے کھینچ رہی ہے"},
         {en:"Gravity pulling down, and air resistance pushing up",
          ur:"کششِ ثقل نیچے کھینچ رہی ہے، اور ہوا کی رکاوٹ اوپر دھکیل رہی ہے"},
         {en:"Only air resistance", ur:"صرف ہوا کی رکاوٹ"},
         {en:"No force at all, it is just falling", ur:"کوئی قوت نہیں، بس گر رہا ہے"}],
      a:1,
      f:{en:"Two forces at once, in opposite directions. Gravity wins for a stone, which is why it still falls fast — but the air is always pushing back.",
         ur:"ایک ساتھ دو قوتیں، مخالف سمتوں میں۔ پتھر کے لیے کششِ ثقل جیت جاتی ہے، اسی لیے وہ تیز گرتا ہے — مگر ہوا ہر وقت مزاحمت کرتی رہتی ہے۔"} }
  ];

  function $(id){ return document.getElementById(id); }
  function t(o){ return o[lang]; }

  var LRI = "\u2066", PDI = "\u2069";
  var LATIN_RUN = /[A-Za-z0-9][A-Za-z0-9 .,+()\/@_-]*[A-Za-z0-9]|[A-Za-z0-9]/g;
  function isolate(s){ return s.replace(LATIN_RUN, function(m){ return LRI + m + PDI; }); }

  function setText(el, str){
    el.textContent = (lang === "ur") ? isolate(str) : str;
    el.classList.toggle("ur", lang === "ur");
    el.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
  }

  var NS = "http://www.w3.org/2000/svg";
  function mk(tag, a){
    var e = document.createElementNS(NS, tag);
    for (var k in a) e.setAttribute(k, a[k]);
    return e;
  }

  var TOP = 64, GROUND = 258;

  function shapeOf(o, x, y){
    var g = mk("g", {});
    if (o.shape === "feather"){
      g.appendChild(mk("ellipse", {cx:x, cy:y, rx:7, ry:15, fill:o.c,
                                   stroke:"#b7ab93", "stroke-width":1.5,
                                   transform:"rotate(22 "+x+" "+y+")"}));
      g.appendChild(mk("line", {x1:x-4, y1:y+12, x2:x+5, y2:y-13,
                                stroke:"#b7ab93", "stroke-width":1.5}));
    } else if (o.shape === "sheet"){
      g.appendChild(mk("rect", {x:x-17, y:y-11, width:34, height:22, rx:2, fill:o.c,
                                stroke:"#cfc6b2", "stroke-width":1.5}));
    } else if (o.shape === "ball"){
      g.appendChild(mk("path", {d:"M"+(x-11)+" "+y+" L"+(x-6)+" "+(y-10)+" L"+(x+4)+" "+(y-11)+
                                  " L"+(x+11)+" "+(y-2)+" L"+(x+7)+" "+(y+9)+" L"+(x-4)+" "+(y+11)+" Z",
                                fill:o.c, stroke:"#cfc6b2", "stroke-width":1.5}));
    } else if (o.shape === "coin"){
      g.appendChild(mk("circle", {cx:x, cy:y, r:9, fill:o.c, stroke:"#9c854f", "stroke-width":1.5}));
    } else {
      g.appendChild(mk("path", {d:"M"+(x-13)+" "+(y+4)+" L"+(x-8)+" "+(y-9)+" L"+(x+5)+" "+(y-12)+
                                  " L"+(x+13)+" "+(y-1)+" L"+(x+9)+" "+(y+11)+" L"+(x-6)+" "+(y+12)+" Z",
                                fill:o.c, stroke:"#6f685c", "stroke-width":1.5}));
    }
    return g;
  }

  function forceArrow(g, x, y, len, dir, col, label){
    var y2 = y + dir * len;
    g.appendChild(mk("line", {x1:x, y1:y, x2:x, y2:y2, stroke:col, "stroke-width":3.5,
                              "stroke-linecap":"round"}));
    g.appendChild(mk("path", {d:"M"+(x-5)+" "+(y2 - dir*6)+" L"+x+" "+y2+" L"+(x+5)+" "+(y2 - dir*6),
                              fill:"none", stroke:col, "stroke-width":3.5,
                              "stroke-linecap":"round", "stroke-linejoin":"round"}));
    var tx = mk("text", {x:x+9, y:y + dir*len/2 + 4, "class":"lbl", fill:col});
    tx.textContent = label;
    g.appendChild(tx);
  }

  function fallTime(o){
    if (!air) return 0.9;                       // no air: everything falls together
    return 0.9 + 2.4 * (o.drag / (o.drag + o.mass));
  }

  function buildLane(gid, o, x){
    var g = $(gid);
    g.innerHTML = "";
    var holder = mk("g", {"class":"faller"});
    holder.appendChild(shapeOf(o, x, TOP));
    // gravity always acts; air resistance only when there is air
    forceArrow(holder, x - 30, TOP, 12 + o.mass * 26, 1, "var(--grav)", "G");
    if (air) forceArrow(holder, x + 30, TOP, 10 + o.drag * 28, -1, "var(--drag)", "A");
    g.appendChild(holder);
    return holder;
  }

  /* ---------- controls ---------- */
  ["A","B"].forEach(function(side){
    O.forEach(function(o, i){
      var b = document.createElement("button");
      b.type = "button"; b.className = "ochip";
      b.setAttribute("data-i", i); b.setAttribute("aria-pressed","false");
      b.addEventListener("click", function(){
        if (side === "A") A = i; else B = i;
        reset();
      });
      $("chips" + side).appendChild(b);
    });
  });

  $("airBtn").addEventListener("click", function(){ air = !air; reset(); });
  $("dropBtn").addEventListener("click", function(){ falling ? reset() : drop(); });

  function reset(){
    falling = false;
    render();
  }

  function drop(){
    falling = true;
    var hA = buildLane("laneA", O[A], 95);
    var hB = buildLane("laneB", O[B], 205);
    var dist = GROUND - TOP;
    // A feather reaches a steady speed and drifts down; a stone keeps speeding up.
    [[hA, O[A]], [hB, O[B]]].forEach(function(pair){
      var el = pair[0], o = pair[1];
      var ease = (air && o.drag > 0.5) ? "cubic-bezier(.25,.55,.5,1)" : "cubic-bezier(.45,0,.9,1)";
      el.style.transition = "transform " + fallTime(o).toFixed(2) + "s " + ease;
    });
    // let the browser paint the starting position first
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        hA.style.transform = "translateY(" + dist + "px)";
        hB.style.transform = "translateY(" + dist + "px)";
      });
    });
    paint(true);
  }

  function render(){
    buildLane("laneA", O[A], 95);
    buildLane("laneB", O[B], 205);
    paint(false);
  }

  function paint(dropped){
    var oa = O[A], ob = O[B];
    var ta = fallTime(oa), tb = fallTime(ob);

    $("scene").classList.toggle("vacuum", !air);
    $("airLbl").textContent = air ? t(T.airCapOn) : t(T.airCapOff);
    $("airLbl").setAttribute("dir", lang === "ur" ? "rtl" : "ltr");

    // air specks, so "no air" is something you can see
    var ag = $("air"); ag.innerHTML = "";
    var seed = 3;
    for (var i=0;i<26;i++){
      seed = (seed * 9301 + 49297) % 233280; var px = (seed/233280)*300;
      seed = (seed * 9301 + 49297) % 233280; var py = 34 + (seed/233280)*230;
      ag.appendChild(mk("circle", {cx:px.toFixed(1), cy:py.toFixed(1), r:1.6, "class":"airdot"}));
    }

    setText($("airBtn"), air ? t(T.airOn) : t(T.airOff));
    $("airBtn").classList.toggle("off", !air);
    setText($("dropBtn"), dropped ? t(T.again) : t(T.drop));

    ["A","B"].forEach(function(side){
      var selIdx = (side === "A") ? A : B;
      Array.prototype.forEach.call($("chips" + side).children, function(b, i){
        b.setAttribute("aria-pressed", i === selIdx ? "true" : "false");
        b.textContent = O[i][lang];
      });
    });
    setText($("whoA"), t(T.whoA));
    setText($("whoB"), t(T.whoB));

    var msg, chipCol = "var(--accent)";
    if (!dropped){
      msg = T.ready;
    } else if (Math.abs(ta - tb) < 0.06){
      msg = T.tie; chipCol = "var(--good)";
    } else {
      msg = T.win; chipCol = "var(--grav)";
    }
    $("statechip").style.background = chipCol;
    setText($("statechip"), t(msg.chip));
    var v = t(msg.v);
    if (msg === T.win) v = v.replace("{w}", (ta < tb ? oa : ob)[lang]);
    setText($("verdict"), v);
    setText($("why"), t(msg.w));

    setText($("lblGrav"), t(T.gravLbl));
    setText($("valGrav"), t(T.gravity));
    setText($("lblDrag"), t(T.dragLbl));
    setText($("valDrag"), air ? t(T.drag) : t(T.none));
    $("dragBox").classList.toggle("off", !air);

    $("whyLbl").textContent = t(T.whyLbl);
    var note = !air ? T.noteVac
             : ((oa.shape === "sheet" && ob.shape === "ball") ||
                (oa.shape === "ball"  && ob.shape === "sheet")) ? T.notePaper
             : T.noteAir;
    setText($("whyText"), t(note));

    lastSpoken = v + " " + t(msg.w);
  }

  var lastSpoken = "";

  /* ---------- quiz ---------- */
  function buildQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    QUIZ.forEach(function(item){
      var wrap = document.createElement("div");
      wrap.className = "q";
      var q = document.createElement("p");
      setText(q, t(item.q));
      wrap.appendChild(q);
      var fb = document.createElement("p");
      fb.className = "fb";
      item.o.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang === "ur" ? " ur" : "");
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.textContent = t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done") === "1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x, xi){
            if (xi === item.a) x.classList.add("right");
            else if (xi === oi) x.classList.add("wrong");
          });
          setText(fb, t(item.f));
          fb.classList.add("show","fb");
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb);
      box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang === "ur");
    var lb = $("langBtn");
    lb.textContent = (lang === "en") ? "اردو" : "English";
    lb.setAttribute("aria-pressed", lang === "ur" ? "true" : "false");

    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });

    setText($("ctlHead"), t(T.ctlHead));
    setText($("pickHead"), t(T.pickHead));
    setText($("quizHead"), t(T.quiz));

    buildQuiz();
    reset();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });

  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(lastSpoken);
      u.lang = (lang === "ur") ? "ur-PK" : "en-US";
      u.rate = 0.92;
      var voices = window.speechSynthesis.getVoices() || [];
      for (var i=0;i<voices.length;i++){
        if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(lang === "ur" ? "ur" : "en") === 0){
          u.voice = voices[i]; break;
        }
      }
      window.speechSynthesis.speak(u);
    }catch(e){ /* no voice available — stay quiet */ }
  });

  applyLang();
})();
</script>
</body>
</html>
