<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */

:root{
  --fs-cap: clamp(0.85rem, 2.2vw, 1.05rem);
  --fs-xs: clamp(1rem, 2.6vw, 1.2rem);
  --fs-sm: clamp(1.15rem, 3vw, 1.4rem);
  --fs-md: clamp(1.3rem, 3.4vw, 1.65rem);
  --fs-lg: clamp(1.55rem, 4vw, 2rem);
  --fs-xl: clamp(1.9rem, 5vw, 2.5rem);
}

/* /AI4KIDS_FS_SCALE */

  :root{
    --board:#f1f0e7;
    --board-deep:#e3e1d3;
    --home:#2e7d55;
    --home-deep:#1d5a3c;
    --friend:#3a6ea8;
    --friend-deep:#26497a;
    --nbr:#a0632c;
    --nbr-deep:#7a4718;
    --ink:#241f18;
    --ink-soft:#554c41;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#1d5a3c;
    --ok:#2e7d4f;
    --soft:#c9702e;

    --fs-cap:clamp(15px, 3.9vw, 16px);
    --fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.7vw, 19px);
    --fs-md:clamp(19px, 5.1vw, 21px);
    --fs-lg:clamp(22px, 5.9vw, 25px);
    --fs-xl:clamp(28px, 7.6vw, 34px);
    --lh:1.5;
  }
  /* Urdu is set larger than Latin — Nastaliq reads smaller at the same size. */
  body.urdu{
    --fs-cap:clamp(17px, 4.4vw, 18px);
    --fs-xs:clamp(18px, 4.7vw, 20px);
    --fs-sm:clamp(20px, 5.2vw, 22px);
    --fs-md:clamp(21px, 5.6vw, 23px);
    --fs-lg:clamp(24px, 6.4vw, 27px);
    --fs-xl:clamp(27px, 7.2vw, 32px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:44px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--soft);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .tabs{display:flex;gap:7px;margin:0 0 14px}
  .tabs button{
    flex:1;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:58px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  .scene{
    border-radius:22px;border:3px solid var(--ink);padding:18px 16px;min-height:150px;
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  }
  .where{
    display:inline-block;border-radius:999px;padding:5px 15px;margin-bottom:10px;
    font-size:var(--fs-cap);font-weight:800;color:#fff;background:var(--home);
  }
  .where.f{background:var(--friend)} .where.n{background:var(--nbr)}
  .where.ur{padding:3px 15px 8px}
  .story{font-size:var(--fs-md);font-weight:700;line-height:1.6;margin:0}
  .story.ur{line-height:var(--lh)}

  .opts{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .opts button{
    border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:13px 16px;
    font:inherit;font-size:var(--fs-sm);font-weight:700;color:var(--ink);cursor:pointer;
    min-height:58px;text-align:left;line-height:1.5;
  }
  body.urdu .opts button{text-align:right;line-height:var(--lh)}
  .opts button.best{border-color:var(--ok);background:#e8f2ed}
  .opts button.okish{border-color:var(--soft);background:#fbf1e8}
  .opts button.poor{border-color:#b9c0c8;background:#f1f3f5}

  .readout{
    margin-top:14px;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.ok{background:var(--ok)} .statechip.soft{background:var(--soft)}
  .says{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.4}
  .says.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .teach{
    margin-top:14px;border:2px solid var(--accent);background:#eaf2ed;border-radius:14px;
    padding:13px 15px;
  }
  .teach em{display:block;font-style:normal;font-size:var(--fs-cap);color:var(--ink-soft);
            font-weight:700;margin-bottom:6px}
  .teach b{display:block;font-size:var(--fs-sm);font-weight:800;color:var(--accent);line-height:2}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}
  body.urdu .why-note{
    border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;
    line-height:var(--lh);
  }
  .review{
    margin-top:16px;border:2px dashed var(--soft);border-radius:14px;padding:11px 13px;
    font-size:var(--fs-cap);color:var(--nbr-deep);font-weight:700;line-height:1.6;
  }
  body.urdu .review{line-height:var(--lh)}

  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .schip{
    border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 15px;
    font:inherit;font-size:var(--fs-cap);font-weight:800;color:var(--ink);cursor:pointer;min-height:46px;
  }
  .schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .schip.done{border-color:var(--ok)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:52px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--soft);background:#fbf1e8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "quiz quiz" "foot foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */
\n\1

<div class="wrap">

  <div class="bar">
    <span class="brand">AI4Kids · Grade 4 · Islamiyat</span>
    <button class="chip" id="langBtn" aria-pressed="false">English</button>

  <footer>

<script>
(function(){
  "use strict";

  var lang="ur", tab="home";      // this subject opens in Urdu
  var idx={home:0, friend:0, nbr:0};
  var picked=null, done={home:{},friend:{},nbr:{}};

  /* Each situation has three choices. q = quality: 2 best, 1 partly right, 0 weak.
     The teaching line is given as مفہوم — the sense of it, never a quoted wording. */
  var CASES={
    home:[
      { s:{ur:"آپ نے کھیلتے ہوئے امی کا پیالہ توڑ دیا۔ کمرے میں کوئی اور نہیں تھا۔",
            en:"You broke your mother's bowl while playing. Nobody else was in the room."},
        o:[{ur:"خود جا کر بتا دیں کہ مجھ سے ٹوٹا ہے", en:"Go and tell her yourself that you broke it", q:2,
            r:{ur:"یہی سب سے مشکل اور سب سے بہتر راستہ ہے۔ سچ بولنے میں ایک لمحہ بھاری گزرتا ہے، جھوٹ میں کئی دن۔",
               en:"The hardest road and the best one. Truth is heavy for a moment; a lie is heavy for days."}},
           {ur:"خاموش رہیں، شاید کسی کو پتا نہ چلے", en:"Stay quiet, maybe nobody will find out", q:0,
            r:{ur:"چھپانا جھوٹ کا پہلا قدم ہے۔ اور جو بات چھپائی جائے، اسے سنبھالنے کے لیے اور باتیں چھپانی پڑتی ہیں۔",
               en:"Hiding is the first step of a lie. And a hidden thing needs more hiding to keep it hidden."}},
           {ur:"کہہ دیں کہ بلی نے گرا دیا", en:"Say the cat knocked it over", q:0,
            r:{ur:"یہ صرف جھوٹ نہیں، کسی اور پر الزام بھی ہے۔ ایک غلطی چھپانے کے لیے دو غلطیاں کرنی پڑ گئیں۔",
               en:"This is not only a lie, it also blames someone else. One mistake has just cost two."}}],
        teach:{ur:"سچ بولنا مسلمان کی پہچان ہے۔ نبی ﷺ کو نبوت سے پہلے ہی \u201cصادق\u201d اور \u201cامین\u201d کہا جاتا تھا — یعنی سچا اور امانت دار۔",
               en:"Truthfulness marks a Muslim. Even before prophethood the Prophet \uFDFA was called Sadiq and Ameen \u2014 truthful and trustworthy."},
        why:{ur:"غور کریں کہ لوگ آپ ﷺ کو یہ نام اُس وقت دیتے تھے جب وہ ان کی بات ماننے کو تیار نہ تھے۔ اچھا اخلاق اُن پر بھی اثر کرتا ہے جو آپ سے اختلاف رکھتے ہوں۔",
             en:"Notice that people gave him \uFDFA those names while still refusing his message. Good character reaches even those who disagree with you."} },

      { s:{ur:"ابو تھکے ہوئے آئے ہیں اور آرام کر رہے ہیں۔ آپ کو اپنا نیا ڈرائنگ دکھانے کا بہت شوق ہے۔",
            en:"Your father has come home tired and is resting. You are excited to show him your new drawing."},
        o:[{ur:"انتظار کریں، جب وہ اٹھیں تو دکھائیں", en:"Wait, and show him when he gets up", q:2,
            r:{ur:"یہی ادب ہے۔ اور ڈرائنگ اُس وقت زیادہ اچھی لگے گی جب دیکھنے والا تازہ دم ہو۔",
               en:"This is adab. And the drawing will land better when the person seeing it is rested."}},
           {ur:"آہستہ سے پاس بیٹھ جائیں اور ساتھ آرام کریں", en:"Sit beside him quietly and rest too", q:2,
            r:{ur:"یہ بھی بہت اچھا ہے۔ کبھی کبھی سب سے اچھا ادب یہ ہوتا ہے کہ ساتھ خاموشی سے بیٹھ جائیں۔",
               en:"Also lovely. Sometimes the best adab is simply sitting quietly beside someone."}},
           {ur:"جگا کر ابھی دکھا دیں", en:"Wake him up and show him now", q:0,
            r:{ur:"شوق بُرا نہیں، مگر دوسرے کا آرام اپنی خوشی سے پہلے آتا ہے۔ یہی والدین کا ادب ہے۔",
               en:"The excitement is not wrong, but somebody's rest comes before your own eagerness. That is adab towards parents."}}],
        teach:{ur:"قرآن میں والدین کے ساتھ حسنِ سلوک کا حکم ہے، اور اُف تک کہنے سے منع کیا گیا ہے (مفہوم)۔",
               en:"The Quran commands kindness to parents, and forbids even saying \u201cuff\u201d to them (in meaning)."},
        why:{ur:"غور کریں کہ منع اونچی آواز سے نہیں، سب سے چھوٹے لفظ سے کیا گیا۔ ادب بڑی باتوں سے نہیں، چھوٹی چھوٹی باتوں سے شروع ہوتا ہے۔",
             en:"Notice the smallest word was the one forbidden, not shouting. Adab starts in small things, not big ones."} },

      { s:{ur:"آپ کی چھوٹی بہن نے آپ کی کاپی پر لکیریں کھینچ دی ہیں۔ آپ کو بہت غصہ آ رہا ہے۔",
            en:"Your little sister has scribbled on your notebook. You are very angry."},
        o:[{ur:"ایک لمحہ رک کر گہری سانس لیں، پھر بات کریں", en:"Stop for a moment, breathe, then talk", q:2,
            r:{ur:"غصہ آنا گناہ نہیں، غصے میں کام کرنا نقصان دیتا ہے۔ رک جانا ہی اصل طاقت ہے۔",
               en:"Feeling anger is not a sin; acting in it does the damage. Stopping is the real strength."}},
           {ur:"اسے مار دیں تاکہ دوبارہ نہ کرے", en:"Hit her so she does not do it again", q:0,
            r:{ur:"اس سے کاپی بھی ٹھیک نہیں ہوگی اور بہن بھی دور ہو جائے گی۔ وہ آپ سے چھوٹی ہے، وہ آپ سے سیکھ رہی ہے۔",
               en:"That fixes neither the notebook nor the sister. She is smaller than you, and she is learning from you."}},
           {ur:"امی کو بلا کر شکایت کریں", en:"Call your mother and complain", q:1,
            r:{ur:"یہ مارنے سے بہتر ہے، مگر پہلے خود اس سے نرمی سے بات کر کے دیکھیں۔ بڑا ہونا یہی ہوتا ہے۔",
               en:"Better than hitting, but try speaking to her gently yourself first. That is what being the elder means."}}],
        teach:{ur:"نبی ﷺ نے فرمایا کہ پہلوان وہ نہیں جو لوگوں کو پچھاڑ دے، بلکہ وہ ہے جو غصے کے وقت اپنے آپ پر قابو رکھے (مفہوم)۔",
               en:"The Prophet \uFDFA taught that the strong one is not he who overcomes people, but he who controls himself when angry (in meaning)."},
        why:{ur:"یہ بات الٹی لگتی ہے: طاقت کا مطلب رکنا؟ مگر سوچیں — مارنا آسان ہے، رک جانا مشکل۔ مشکل کام ہی طاقت مانگتا ہے۔",
             en:"It sounds backwards: strength means stopping? But think \u2014 hitting is easy, stopping is hard. The hard thing is what takes strength."} }
    ],

    friend:[
      { s:{ur:"امتحان میں آپ کا دوست پرچہ دکھانے کو کہہ رہا ہے۔ وہ آپ کا سب سے اچھا دوست ہے۔",
            en:"In the exam your friend asks to see your paper. He is your best friend."},
        o:[{ur:"منع کر دیں، اور بعد میں اسے پڑھا دیں", en:"Say no, and help him study afterwards", q:2,
            r:{ur:"یہی اصل دوستی ہے۔ نقل سے اسے آج نمبر ملیں گے اور اگلے سال پھر وہی مشکل۔ پڑھانے سے مسئلہ ختم ہو جائے گا۔",
               en:"This is real friendship. Copying gives him marks today and the same trouble next year. Teaching him ends the problem."}},
           {ur:"دکھا دیں، دوست کا حق ہے", en:"Show him \u2014 he is a friend after all", q:0,
            r:{ur:"دوستی کا مطلب یہ نہیں کہ دوست کے ساتھ مل کر غلط کام کیا جائے۔ یہ اس کی مدد نہیں، اس کا نقصان ہے۔",
               en:"Friendship does not mean doing wrong together. This is not helping him; it is harming him."}},
           {ur:"استاد سے اس کی شکایت کر دیں", en:"Report him to the teacher", q:1,

      f:{ur:"یہ جواب سچ بھی ہے اور امانت بھی۔ دوسرا جواب راز تو بچا لیتا ہے مگر جھوٹ بول کر — اور اس کی ضرورت ہی نہیں تھی۔",
         en:"That answer is both honest and trustworthy. The second one saves the secret by lying \u2014 and the lie was never needed."} }
  ];

  function $(id){ return document.getElementById(id); }
  function t(o){ return o[lang]; }
  var LRI="\u2066", PDI="\u2069";
  var LATIN_RUN=/[A-Za-z0-9][A-Za-z0-9 .,'\u2019+()\/@_-]*[A-Za-z0-9.]|[A-Za-z0-9]/g;
  function isolate(s){ return s.replace(LATIN_RUN, function(m){ return LRI+m+PDI; }); }
  function setText(el,str){
    el.textContent=(lang==="ur") ? isolate(str) : str;
    el.classList.toggle("ur", lang==="ur");
    el.setAttribute("dir", lang==="ur" ? "rtl":"ltr");
  }

  function list(){ return CASES[tab]; }

  function render(){
    ["Home","Friend","Nbr"].forEach(function(x){
      var m = x==="Nbr" ? "nbr" : x.toLowerCase();
      $("tab"+x).setAttribute("aria-pressed", tab===m ? "true":"false");
    });
    setText($("tabHome"), t(T.tabHome));
    setText($("tabFriend"), t(T.tabFriend));
    setText($("tabNbr"), t(T.tabNbr));
    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    setText($("panelHead"), t(T.head));
    $("whyLbl").textContent=t(T.whyLbl);
    setText($("quizHead"), t(T.quiz));
    setText($("review"), t(T.review));

    var L=list(), i=idx[tab], c=L[i];
    var w=$("where");
    w.className="where" + (tab==="friend" ? " f" : tab==="nbr" ? " n" : "");
    setText(w, tab==="home" ? t(T.whereH) : tab==="friend" ? t(T.whereF) : t(T.whereN));
    setText($("story"), t(c.s));

    var opts=$("opts"); opts.innerHTML="";
    c.o.forEach(function(o,oi){
      var b=document.createElement("button"); b.type="button";
      setText(b, t(o));
      if (picked!==null)
        b.className = o.q===2 ? "best" : (o.q===1 ? "okish" : "poor");
      b.addEventListener("click", function(){
        if (picked!==null) return;
        picked=oi; done[tab][i]=true; render();
      });
      opts.appendChild(b);
    });

    var chip=$("statechip"); chip.className="statechip";
    var teach=$("teach");
    if (picked===null){
      setText(chip, t(T.ask)); setText($("says"), ""); setText($("detail"), "");
      teach.style.display="none";
      setText($("whyText"), t(c.why));
    } else {
      var o=c.o[picked];
      chip.className="statechip " + (o.q===2 ? "ok" : o.q===1 ? "soft" : "");
      setText(chip, o.q===2 ? t(T.best) : o.q===1 ? t(T.okish) : t(T.poor));
      setText($("says"), t(o));
      setText($("detail"), t(o.r));
      teach.style.display="";
      teach.innerHTML="";
      var em=document.createElement("em"); em.textContent=t(T.teachLbl);
      em.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      var b2=document.createElement("b");
      b2.textContent=(lang==="ur") ? isolate(t(c.teach)) : t(c.teach);
      b2.setAttribute("dir", lang==="ur"?"rtl":"ltr");
      if (lang==="ur") b2.className="ur";
      teach.appendChild(em); teach.appendChild(b2);
      setText($("whyText"), t(c.why));
    }

    var chips=$("chips"); chips.innerHTML="";
    L.forEach(function(x,j){
      var b=document.createElement("button"); b.type="button";
      b.className="schip" + (done[tab][j] ? " done":"");
      b.textContent=String(j+1)+(done[tab][j] ? " \u2605":"");
      b.setAttribute("aria-pressed", j===i ? "true":"false");
      b.addEventListener("click", function(){ idx[tab]=j; picked=null; render(); });
      chips.appendChild(b);
    });
    lastSpoken=t(c.s);
  }

  var lastSpoken="";

  ["Home","Friend","Nbr"].forEach(function(x){
    $("tab"+x).addEventListener("click", function(){
      var m = x==="Nbr" ? "nbr" : x.toLowerCase();
      if (tab===m) return;
      tab=m; picked=null; render();
    });
  });

  function buildQuiz(){
    var box=$("quizBox"); box.innerHTML="";
    QUIZ.forEach(function(item){
      var wrap=document.createElement("div"); wrap.className="q";
      var q=document.createElement("p"); setText(q,t(item.q)); wrap.appendChild(q);
      var fb=document.createElement("p"); fb.className="fb";
      item.o.forEach(function(opt,oi){
        var b=document.createElement("button"); b.type="button";
        b.className="opt" + (lang==="ur" ? " ur":"");
        b.setAttribute("dir", lang==="ur" ? "rtl":"ltr");
        b.textContent=t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done")==="1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x,xi){
            if (xi===item.a) x.classList.add("right");
            else if (xi===oi) x.classList.add("wrong");
          });
          setText(fb,t(item.f)); fb.classList.add("show","fb");
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb); box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang==="ur");
    var lb=$("langBtn");
    lb.textContent=(lang==="ur") ? "English" : "اردو";
    lb.setAttribute("aria-pressed", lang==="ur" ? "true":"false");
    Array.prototype.forEach.call(document.querySelectorAll("[data-ur]"), function(el){
      setText(el, el.getAttribute(lang==="ur" ? "data-ur":"data-en"));
    });
    buildQuiz(); render();
  }
  $("langBtn").addEventListener("click", function(){
    lang=(lang==="ur") ? "en":"ur"; applyLang();
  });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(lastSpoken);
      u.lang=(lang==="ur") ? "ur-PK":"en-US"; u.rate=0.9;
      window.speechSynthesis.speak(u);
    }catch(e){ /* no voice available — stay quiet */ }
  });

  applyLang();
})();
</script>
</body>
</html>
