  svg.appendChild(mk("rect",{x:bx+18,y:by-10,width:14,height:12,fill:"#1f2933"}));
  var bt=mk("text",{x:bx+25,y:by+42,"text-anchor":"middle","font-size":"14","font-weight":"800",fill:"#fff"});
  bt.textContent="+ −"; svg.appendChild(bt);
  var cx=220,cy=100;
  svg.appendChild(mk("circle",{cx:cx,cy:cy,r:32,fill:lit?"#facc15":"#cbd5e1",stroke:"#1f2933","stroke-width":3}));
  if(lit){
    for(var i=0;i<8;i++){
      var a=i*Math.PI/4;
      svg.appendChild(mk("line",{x1:cx+Math.cos(a)*38,y1:cy+Math.sin(a)*38,x2:cx+Math.cos(a)*52,y2:cy+Math.sin(a)*52,stroke:"#f59e0b","stroke-width":3,"stroke-linecap":"round"}));
    }
  }
  svg.appendChild(mk("rect",{x:cx-10,y:cy+30,width:20,height:18,fill:"#64748b",stroke:"#1f2933","stroke-width":2}));
  var wcol = wireOk ? (closed?"#ef4444":"#94a3b8") : "#94a3b8";
  var dash = (!wireOk || !closed) ? "6 6" : "0";
  svg.appendChild(mk("path",{d:"M90 100 H160 V70 H220",fill:"none",stroke:wcol,"stroke-width":4,"stroke-dasharray":dash,"stroke-linecap":"round"}));
  var botCol = wireOk ? "#3b82f6" : "#94a3b8";
  svg.appendChild(mk("path",{d:"M90 150 H160 V148 H210",fill:"none",stroke:botCol,"stroke-width":4,"stroke-dasharray":(!wireOk)?"6 6":"0","stroke-linecap":"round"}));
  if(!closed){
    svg.appendChild(mk("line",{x1:155,y1:70,x2:175,y2:55,stroke:"#1f2933","stroke-width":4,"stroke-linecap":"round"}));
  } else {
    svg.appendChild(mk("circle",{cx:160,cy:70,r:5,fill:"#1f2933"}));
  }
  var lab=mk("text",{x:160,y:220,"text-anchor":"middle","font-size":"13","font-weight":"800",fill:"#1f2933"});
  lab.textContent = lit ? "ON" : "OFF"; svg.appendChild(lab);
}
function onTab(){}
function render(){
  buildTabs([["build",{en:"Build circuit",ur:"سرکٹ بناؤ"}],["break",{en:"Open / Close",ur:"کھلا / بند"}],["fix",{en:"Fix it",ur:"درست کرو"}]]);
  if(!tab||tab==="main") tab="build";
  setText($("whyLbl"), t({en:"Notice:",ur:"غور کریں:"}));
  $("chips").innerHTML=""; $("controls").innerHTML=""; $("two").innerHTML="";
  var play=$("playBtn"), play2=$("playBtn2");
  play.className="play"; play2.className="play alt hidden";

  if(tab==="build"){
    setText($("title"), t({en:"Battery + Wire + Bulb",ur:"بیٹری + تار + بلب"}));
    setText($("subtitle"), t({en:"Tap parts. Join them in a loop to light the bulb.",ur:"حصے دباؤ۔ لوپ جوڑو تاکہ بلب جلے۔"}));
    setText($("panelHead"), t({en:"Parts",ur:"حصے"}));
    play.classList.add("hidden");
    [["batt",{en:"Battery",ur:"بیٹری"}],["wire",{en:"Wire",ur:"تار"}],["bulb",{en:"Bulb",ur:"بلب"}]].forEach(function(x){
      var b=document.createElement("button"); b.type="button"; b.className="schip";
      b.setAttribute("aria-pressed", partHi===x[0]?"true":"false");
      setText(b,t(x[1]));
      b.onclick=function(){ partHi=x[0]; render(); };
      $("chips").appendChild(b);
    });
    drawCircuit();
    var tips={
      batt:{en:"Battery",ur:"بیٹری",d:{en:"Stores energy. Needs charge to push current.",ur:"توانائی رکھتی ہے۔ کرنٹ دھکیلنے کے لیے چارج چاہیے۔"}},
      wire:{en:"Wire",ur:"تار",d:{en:"Metal path that carries electricity from battery to bulb.",ur:"دھاتی راستہ جو بجلی بیٹری سے بلب تک لے جاتا ہے۔"}},
      bulb:{en:"Bulb",ur:"بلب",d:{en:"Turns electricity into light when current flows through.",ur:"کرنٹ گزرے تو بجلی کو روشنی بناتا ہے۔"}}
    };
    var p=tips[partHi]||tips.batt;
    setText($("statechip"), t({en:p.en,ur:p.ur}));
    setText($("lead"), t({en:p.en,ur:p.ur}));
    setText($("detail"), t(p.d));
    setText($("trade"), t({en:"Kid tip: Never touch real wires without an adult.",ur:"بچوں کی بات: بغیر بڑوں کے حقیقی تاریں نہ چھوؤ۔"}));
    setText($("whyText"), t({en:"Three parts in a closed loop = light!",ur:"بند لوپ میں تین حصے = روشنی!"}));
    return;
  }
  if(tab==="break"){
    setText($("title"), t({en:"Closed vs open circuit",ur:"بند اور کھلا سرکٹ"}));
    setText($("subtitle"), t({en:"Open the path — light goes out. Close it — light returns!",ur:"راستہ کھولو — روشنی گئی۔ بند کرو — واپس!"}));
    setText($("panelHead"), t({en:"Switch",ur:"سوئچ"}));
    setText(play, closed?t({en:"Open the circuit",ur:"سرکٹ کھولو"}):t({en:"Close the circuit",ur:"سرکٹ بند کرو"}));
    play.classList.toggle("stop", closed); play.classList.toggle("go", !closed);
    play.onclick=function(){ closed=!closed; render(); };
    drawCircuit();
    $("statechip").className="statechip "+(circuitLit()?"ok":"no");
    setText($("statechip"), circuitLit()?t({en:"LIT",ur:"جل رہا"}):t({en:"DARK",ur:"اندھیرا"}));
    setText($("lead"), closed?t({en:"Closed loop — current can flow",ur:"بند لوپ — کرنٹ بہہ سکتا ہے"}):t({en:"Open gap — current stops",ur:"کھلا گیپ — کرنٹ رک گیا"}));
    setText($("detail"), t({en:"A switch is just a gap you can open or close.",ur:"سوئچ صرف ایک گیپ ہے جو کھل یا بند ہو سکتا ہے۔"}));
    setText($("trade"),""); setText($("whyText"), t({en:"Closed = ON. Open = OFF. That is the secret!",ur:"بند = آن۔ کھلا = آف۔ یہی راز!"}));
    return;
  }
  setText($("title"), t({en:"What went wrong?",ur:"کیا خراب ہوا؟"}));
  setText($("subtitle"), t({en:"Toggle battery or wire health and watch the bulb.",ur:"بیٹری یا تار ٹھیک/خراب کرو اور بلب دیکھو۔"}));
  setText($("panelHead"), t({en:"Troubleshoot",ur:"خرابی ڈھونڈو"}));
  setText(play, battOk?t({en:"Kill battery",ur:"بیٹری خراب"}):t({en:"Fix battery",ur:"بیٹری ٹھیک"}));
  play.classList.remove("hidden");
  play2.classList.remove("hidden");
  setText(play2, wireOk?t({en:"Break wire",ur:"تار توڑو"}):t({en:"Fix wire",ur:"تار جوڑو"}));
  play.onclick=function(){ battOk=!battOk; render(); };
  play2.onclick=function(){ wireOk=!wireOk; render(); };
  closed=true; drawCircuit();
  $("statechip").className="statechip "+(circuitLit()?"ok":"no");
  setText($("statechip"), circuitLit()?t({en:"Working",ur:"چل رہا"}):t({en:"Not working",ur:"نہیں چل رہا"}));
  setText($("lead"), circuitLit()?t({en:"All good — path is complete",ur:"سب ٹھیک — راستہ مکمل"}):t({en:"Find the broken part!",ur:"خراب حصہ ڈھونڈو!"}));
  var battLabel = battOk ? (lang==="ur"?"ہاں":"yes") : (lang==="ur"?"نہیں":"no");
  var wireLabel = wireOk ? (lang==="ur"?"ہاں":"yes") : (lang==="ur"?"نہیں":"no");
  setText($("detail"), t({en:"Battery OK: "+battLabel+" · Wire OK: "+wireLabel, ur:"بیٹری ٹھیک: "+battLabel+" · تار ٹھیک: "+wireLabel}));
  setText($("trade"), t({en:"Robot tip: Circuits inside robots use the same idea!",ur:"روبوٹ ٹپ: روبوٹ کے اندر بھی یہی سرکٹ خیال!"}));
  setText($("whyText"), t({en:"If one part fails, the whole loop fails.",ur:"ایک حصہ خراب ہو تو پورا لوپ رک جاتا ہے۔"}));
}


applyLang();
})();

<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
