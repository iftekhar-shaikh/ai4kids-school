<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roshni aur saya — روشنی اور سایہ | AI4Kids Class 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#1a2230;--sky2:#2c3648;--floor:#4a5564;--sun:#f5b942;--sun2:#e08920;
    --ink:#1f2933;--ink-soft:#4a5661;--paper:#fdfaf3;--line:#ded5c4;
    --accent:#8a5a2b;--good:#2e7d4f;--bad:#c4453a;--glow:#ffe9a8;
    --fs-cap:clamp(14px, 3.8vw, 16px);--fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.8vw, 20px);--fs-md:clamp(19px, 5.2vw, 22px);
    --fs-lg:clamp(22px, 6vw, 26px);--fs-xl:clamp(30px, 8vw, 38px);
    --lh:1.5;
  }
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);
    --fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);
    --fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);
    --lh:2.1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 16px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}
  .sec{margin-top:26px}
  .sec h2{font-size:var(--fs-lg);font-weight:800;margin:0 0 12px;border-bottom:3px solid var(--ink);padding-bottom:8px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .src,.mat,.ref{
    border:3px solid var(--line);background:var(--paper);border-radius:16px;
    padding:14px 12px;cursor:pointer;text-align:center;min-height:100px;
    font:inherit;color:var(--ink);
  }
  .src .emo,.ref .emo{font-size:clamp(28px,8vw,36px);display:block;margin-bottom:6px;line-height:1}
  .src b,.mat b,.ref b{display:block;font-size:var(--fs-sm);font-weight:800}
  .src span,.mat em,.ref span{display:block;font-size:var(--fs-cap);color:var(--ink-soft);font-weight:600;margin-top:3px;font-style:normal}
  .src[aria-pressed="true"],.mat[aria-pressed="true"],.ref[aria-pressed="true"]{
    border-color:var(--ink);background:#fff6db;box-shadow:0 0 0 3px var(--glow);
  }
  .note{margin-top:12px;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;background:#fff}
  .note .tag{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:4px 12px;font-size:var(--fs-cap);font-weight:700;margin-bottom:8px}
  .note p{margin:0;font-size:var(--fs-sm);font-weight:600;line-height:1.45}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%,#3d4a5c 100%);
    height:260px;touch-action:none;user-select:none;
  }
  .floor{position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(180deg,#5a6574,#4a5564);border-top:2px solid #6a7584}
  .lamp{
    position:absolute;width:44px;height:44px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff7d0 0%,var(--sun) 45%,var(--sun2) 100%);
    box-shadow:0 0 28px 10px rgba(245,185,66,.55);cursor:grab;z-index:5;border:2px solid #fff8;
  }
  .block{
    position:absolute;width:36px;height:70px;background:#c9a66b;border:2px solid #8a6a3a;
    border-radius:6px 6px 2px 2px;z-index:4;cursor:grab;
  }
  .block:before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:28px;height:14px;background:#8a6a3a;border-radius:4px 4px 0 0}
  .shad{position:absolute;bottom:72px;height:14px;border-radius:50%;background:rgba(10,14,22,.72);z-index:3;pointer-events:none;filter:blur(1px)}
  .beam{position:absolute;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(255,220,120,.22) 0%,transparent 70%)}
  .hint{position:absolute;top:10px;left:12px;right:12px;z-index:6;color:#e8eef6;font-size:var(--fs-cap);font-weight:700;text-align:center;text-shadow:0 1px 3px #000a;pointer-events:none}
  .lead{font-weight:800;font-size:var(--fs-md);margin:0 0 6px}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .mat{text-align:left;min-height:72px}
  .mat .row{display:flex;align-items:center;gap:12px}
  .mat .preview{width:52px;height:52px;border-radius:12px;border:2px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
  .mat.opaque .preview{background:#5b4a3a}
  .mat.translucent .preview{background:linear-gradient(135deg,#fff8,#f5b94288)}
  .mat.transparent .preview{background:linear-gradient(135deg,#c5e8f888,#fff0)}
  .mat-demo{margin-top:12px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#1a2230;height:120px;position:relative}
  .mat-demo .sunspot{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#f5b942);box-shadow:0 0 20px #f5b942aa}
  .mat-demo .mblock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:10px;border:2px solid #fff4;transition:background .35s,opacity .35s}
  .mat-demo .spot{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#ffe9a8,#f5b94200);transition:opacity .35s,transform .35s}
  .mat-demo .caption{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#e8eef6;font-size:var(--fs-cap);font-weight:700}

  .bounce{margin-top:12px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#dce8f2,#b8c9d8);height:160px}
  .bounce svg{display:block;width:100%;height:100%}
  .bounce-note{margin-top:10px;font-size:var(--fs-sm);font-weight:600;color:var(--ink-soft);line-height:1.45}

  .lesson{display:flex;flex-direction:column;gap:10px}
  .lcard{border:3px solid var(--ink);border-radius:16px;padding:14px 16px;background:#fff}
  .lcard .badge{display:inline-block;color:#fff;border-radius:999px;padding:4px 12px;font-size:var(--fs-cap);font-weight:800;margin-bottom:8px}
  .lcard.hook .badge{background:#c4453a}
  .lcard.samjhao .badge{background:#2f6fb5}
  .lcard.misaal .badge{background:#2e7d4f}
  .lcard p{margin:0;font-size:var(--fs-sm);font-weight:600;line-height:1.5}

  .tip{border:3px dashed var(--sun2);background:#fff8e6;border-radius:16px;padding:16px}
  .tip h3{margin:0 0 8px;font-size:var(--fs-md);font-weight:800;color:var(--sun2)}
  .tip ol{margin:0;padding-left:22px;font-size:var(--fs-sm);font-weight:600;line-height:1.55}
  body.urdu .tip ol{padding-left:0;padding-right:22px}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q>p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .opt{display:block;width:100%;text-align:left;margin-bottom:10px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);min-height:52px}
  .opt.ur{text-align:right}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--good);background:#e6f4ec;font-weight:600}
  .opt.wrong{border-color:var(--bad);background:#fbeae4}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none;line-height:1.55}
  .fb.show{display:block}
  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--ink-soft)}
  @media (min-width:820px){
    .wrap{max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:"bar bar" "head head" "src shadow" "mat ref" "lesson tip" "quiz quiz" "foot foot";align-items:start}
    .bar{grid-area:bar}.head{grid-area:head}.sec-src{grid-area:src}.sec-shadow{grid-area:shadow}
    .sec-mat{grid-area:mat}.sec-ref{grid-area:ref}.sec-lesson{grid-area:lesson}.sec-tip{grid-area:tip}
    .quiz{grid-area:quiz}footer{grid-area:foot}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="brand">AI4Kids · Class 4 · Science</span>
    <button type="button" class="chip" id="langBtn" aria-pressed="false">اردو</button>
    <button type="button" class="chip" id="speakBtn" aria-label="Sunein">🔊</button>
  </div>

  <div class="head">
    <h1 data-en="Light and shadow" data-ur="روشنی اور سایہ"></h1>
    <p class="sub" data-en="Where does light come from? Why do you have a shadow in F-7? Tap, drag, and find out." data-ur="روشنی کہاں سے آتی ہے؟ ایف-۷ میں آپ کا سایہ کیوں بنتا ہے؟ دبائیں، کھینچیں، اور خود دیکھ لیں۔"></p>
  </div>

  <div class="sec sec-src">
    <h2 data-en="1. Where is the light from?" data-ur="۱. روشنی کہاں سے آئی؟"></h2>
    <div class="grid2" id="srcGrid" role="group" aria-label="Light sources"></div>
    <div class="note"><span class="tag" id="srcTag"></span><p id="srcText"></p></div>
  </div>

  <div class="sec sec-shadow">
    <h2 data-en="2. Make a shadow" data-ur="۲. سایہ بناؤ"></h2>
    <div class="scene" id="scene" aria-label="Shadow playground">
      <div class="hint" id="sceneHint"></div>
      <div class="beam" id="beam"></div>
      <div class="lamp" id="lamp" title="Drag light"></div>
      <div class="block" id="obj" title="Drag block"></div>
      <div class="shad" id="shad"></div>
      <div class="floor"></div>
    </div>
    <div class="note" style="margin-top:12px">
      <p class="lead" id="shLead"></p>
      <p class="detail" id="shDetail"></p>
    </div>
  </div>

  <div class="sec sec-mat">
    <h2 data-en="3. Does light pass through?" data-ur="۳. کیا روشنی پار جاتی ہے؟"></h2>
    <div id="matGrid" role="group" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="mat-demo" id="matDemo">
      <div class="sunspot"></div>
      <div class="mblock" id="matBlock"></div>
      <div class="spot" id="matSpot"></div>
      <div class="caption" id="matCap"></div>
    </div>
  </div>

  <div class="sec sec-ref">
    <h2 data-en="4. Bounce — reflection" data-ur="۴. اچھال — انعکاس"></h2>
    <div class="grid2" id="refGrid" role="group"></div>
    <div class="bounce">
      <svg viewBox="0 0 320 160" aria-hidden="true">
        <rect id="surf" x="110" y="40" width="100" height="80" rx="8" fill="#d8e8f4" stroke="#1f2933" stroke-width="3"/>
        <circle cx="40" cy="80" r="14" fill="#f5b942" stroke="#e08920" stroke-width="2"/>
        <path d="M54 80 L110 80" stroke="#f5b942" stroke-width="4" stroke-linecap="round"/>
        <path id="rayOut" d="M210 80 L270 50" stroke="#f5b942" stroke-width="4" stroke-linecap="round" opacity="1"/>
        <path id="rayAbsorb" d="M210 80 L250 80" stroke="#8a8074" stroke-width="4" stroke-linecap="round" opacity="0"/>
        <text id="bounceLbl" x="160" y="148" text-anchor="middle" fill="#4a5661" font-size="14" font-weight="800" font-family="Baloo Bhaijaan 2,sans-serif"></text>
      </svg>
    </div>
    <p class="bounce-note" id="bounceNote"></p>
  </div>

  <div class="sec sec-lesson">
    <h2 data-en="5. Remember this" data-ur="۵. یہ یاد رکھو"></h2>
    <div class="lesson">
      <div class="lcard hook"><span class="badge">HOOK</span><p id="cardHook"></p></div>
      <div class="lcard samjhao"><span class="badge" data-en="EXPLAIN" data-ur="سمجھاؤ"></span><p id="cardSamjhao"></p></div>
      <div class="lcard misaal"><span class="badge" data-en="EXAMPLE" data-ur="مثال"></span><p id="cardMisaal"></p></div>
    </div>
  </div>

  <div class="sec sec-tip">
    <h2 data-en="6. Try at home" data-ur="۶. گھر پر آزماؤ"></h2>
    <div class="tip"><h3 id="tipHead"></h3><ol id="tipList"></ol></div>
  </div>

  <div class="quiz">
    <h2 id="quizHead" style="font-size:var(--fs-lg);font-weight:800;margin:0 0 18px"></h2>
    <div id="quizBox"></div>
  </div>

  <footer>
    <p data-en="AI4Kids — Islamabad's bilingual AI and coding school. WhatsApp 0337 1468899" data-ur="اے آئی فور کڈز — اسلام آباد کا دو زبانوں والا اے آئی اور کوڈنگ سکول۔ واٹس ایپ 0337 1468899"></p>
  </footer>
</div>

var lang="en", srcIdx=0, matIdx=0, refIdx=0, lastSpoken="";

   cap:{en:"Light stops. Shadow forms.",ur:"روشنی رک جاتی ہے۔ سایہ بنتا ہے۔"},
   bg:"#5b4a3a",spot:0,blockOp:1},
  {cls:"translucent",emoji:"🪟",en:"Translucent",ur:"نیم شفاف",

};

         ur:["ایک کمرہ اندھیرا کریں۔","ٹارچ یا فون لائٹ جلائیں۔","بیم میں کتاب رکھیں — بڑا سایہ۔","روشنی قریب لائیں — سایہ بڑا۔","دور کریں — سایہ چھوٹا۔","صاف بوتل آزمائیں، پھر کالا موزہ۔"]}
};

/* Quiz corrects: a=0, a=0, b=1, a=0, d=3 */

   a:0,f:{en:"Opaque objects stop light. The dark patch behind them is the shadow.",ur:"مبہم چیزیں روشنی روکتی ہیں۔ ان کے پیچھے جو سیاہ نشان بنتا ہے وہی سایہ ہے۔"}},

   o:[{en:"No",ur:"نہیں"},{en:"Yes, you get a reflection",ur:"ہاں، عکس ملتا ہے"},{en:"Only in the dark",ur:"صرف اندھیرے میں"},{en:"Only if you search for it",ur:"صرف ڈھونڈنے پر"}],
   a:1,f:{en:"A mirror bounces light to your eyes. That bounce is reflection (aks).",ur:"آئینہ روشنی آنکھوں تک واپس بھیجتا ہے۔ یہی اچھال انعکاس (عکس) ہے۔"}},
  {q:{en:"Which thing reflects light the most (from these)?",ur:"ان میں سے کون سی چیز روشنی سب سے زیادہ اچھالتی ہے؟"},
   o:[{en:"Water",ur:"پانی"},{en:"Paper",ur:"کاغذ"},{en:"A golden colour",ur:"سنہرا رنگ"},{en:"A black thing",ur:"کالی چیز"}],
   a:0,f:{en:"Smooth water acts like a mirror. Black things soak light up instead.",ur:"صاف پانی آئینے جیسا کام کرتا ہے۔ کالی چیزیں روشنی پی جاتی ہیں۔"}},
  {q:{en:"What is the colour of light?",ur:"روشنی کا رنگ کیا ہوتا ہے؟"},
   o:[{en:"White",ur:"سفید"},{en:"Black",ur:"کالا"},{en:"Green",ur:"ہرا"},{en:"A rainbow / spectrum (sunoora)",ur:"سنورا / سپیکٹرم"}],
   a:3,f:{en:"Sunlight holds many colours mixed together — a spectrum. A rainbow shows them split apart.",ur:"سورج کی روشنی میں کئی رنگ ملے ہوتے ہیں — سپیکٹرم۔ قوسِ قزح انہیں الگ دکھا دیتی ہے۔"}}

function $(id){return document.getElementById(id)}
function t(o){return o[lang]}
var LRI="\u2066",PDI="\u2069";
var LATIN=/[A-Za-z0-9][A-Za-z0-9 .,+()\/@_-]*[A-Za-z0-9]|[A-Za-z0-9]/g;
function isolate(s){return s.replace(LATIN,function(m){return LRI+m+PDI})}
function setText(el,str){
  if(!el) return;
  el.textContent=(lang==="ur")?isolate(str):str;
  el.classList.toggle("ur",lang==="ur");
  el.setAttribute("dir",lang==="ur"?"rtl":"ltr");
}

function buildSources(){
  var g=$("srcGrid"); g.innerHTML="";
  SOURCES.forEach(function(s,i){
    var b=document.createElement("button");
    b.type="button"; b.className="src";
    b.setAttribute("aria-pressed",i===srcIdx?"true":"false");
    b.innerHTML='<span class="emo">'+s.emoji+'</span><b></b><span></span>';
    setText(b.querySelector("b"),t(s));
    setText(b.querySelector("span"),t(s.tag));
    b.addEventListener("click",function(){srcIdx=i;renderSources();lastSpoken=t(s)+". "+t(s.note)});
    g.appendChild(b);
  });
  renderSources();
}
function renderSources(){
  Array.prototype.forEach.call($("srcGrid").children,function(b,i){
    b.setAttribute("aria-pressed",i===srcIdx?"true":"false");
    setText(b.querySelector("b"),t(SOURCES[i]));
    setText(b.querySelector("span"),t(SOURCES[i].tag));
  });
  var s=SOURCES[srcIdx];
  setText($("srcTag"),t(s.tag));
  setText($("srcText"),t(s.note));
}

function updateShadow(){
  var scene=$("scene"), sw=scene.clientWidth||320, sh=scene.clientHeight||260;
  var floorY=sh-72, lx=lamp.x+22, ly=lamp.y+22, ox=block.x+18, oy=block.y+35, oh=70;
  var dist=Math.sqrt(Math.pow(ox-lx,2)+Math.pow(oy-ly,2));
  var near=Math.max(0.4,Math.min(2.8,140/Math.max(40,dist)));
  var shW=36*near*(0.9+Math.abs(ox-lx)/120);
  var shX=lx+(ox-lx)*(floorY-ly)/Math.max(1,(block.y+oh*0.85)-ly);
  var S=$("shad");
  S.style.width=Math.max(20,Math.min(200,shW))+"px";
  S.style.left=(shX-parseFloat(S.style.width)/2)+"px";
  S.style.opacity=String(Math.max(0.35,Math.min(0.9,0.5+near*0.15)));
  var B=$("beam"), midX=(lx+ox)/2, midY=(ly+oy)/2, beamW=Math.max(80,dist*1.2);
  B.style.width=beamW+"px"; B.style.height="70px";
  B.style.left=(midX-beamW/2)+"px"; B.style.top=(midY-35)+"px";
  var side=(lx<ox)?t({en:"left",ur:"بائیں"}):t({en:"right",ur:"دائیں"});
  var size=near>1.6?t({en:"big",ur:"بڑا"}):(near<0.85?t({en:"small",ur:"چھوٹا"}):t({en:"medium",ur:"درمیانہ"}));
  setText($("shLead"),t({en:"Shadow is "+size+", falling to the "+side+".",ur:"سایہ "+size+" ہے، "+side+" طرف گرا ہوا ہے۔"}));
  setText($("shDetail"),t({en:"Opaque block stops the light. Closer light → bigger shadow. Light to the side → shadow on the other side.",
    ur:"مبہم بلاک روشنی روکتا ہے۔ قریبی روشنی → بڑا سایہ۔ ایک طرف روشنی → دوسری طرف سایہ۔"}));
}
function placeNodes(){
  $("lamp").style.left=lamp.x+"px"; $("lamp").style.top=lamp.y+"px";
  $("obj").style.left=block.x+"px"; $("obj").style.top=block.y+"px";
  updateShadow();
}
function ptr(e){
  var r=$("scene").getBoundingClientRect(), tch=e.touches?e.touches[0]:e;
  return {x:tch.clientX-r.left,y:tch.clientY-r.top};
}
function startDrag(which,e){e.preventDefault();dragging=which}
function moveDrag(e){
  if(!dragging) return; e.preventDefault();
  var p=ptr(e), scene=$("scene"), maxX=scene.clientWidth, maxY=scene.clientHeight-72;
  if(dragging==="lamp"){lamp.x=Math.max(0,Math.min(maxX-44,p.x-22));lamp.y=Math.max(0,Math.min(maxY-80,p.y-22))}
  else{block.x=Math.max(10,Math.min(maxX-46,p.x-18));block.y=Math.max(50,Math.min(maxY-70,p.y-35))}
  placeNodes();
}
function endDrag(){dragging=null}
function initShadow(){
  $("lamp").addEventListener("mousedown",function(e){startDrag("lamp",e)});
  $("obj").addEventListener("mousedown",function(e){startDrag("obj",e)});
  $("lamp").addEventListener("touchstart",function(e){startDrag("lamp",e)},{passive:false});
  $("obj").addEventListener("touchstart",function(e){startDrag("obj",e)},{passive:false});
  window.addEventListener("mousemove",moveDrag,{passive:false});
  window.addEventListener("touchmove",moveDrag,{passive:false});
  window.addEventListener("mouseup",endDrag);
  window.addEventListener("touchend",endDrag);
  window.addEventListener("resize",placeNodes);
  placeNodes();
}

function buildMats(){
  var g=$("matGrid"); g.innerHTML="";
  MATS.forEach(function(m,i){
    var b=document.createElement("button");
    b.type="button"; b.className="mat "+m.cls;
    b.setAttribute("aria-pressed",i===matIdx?"true":"false");
    b.innerHTML='<div class="row"><div class="preview">'+m.emoji+'</div><div><b></b><em></em></div></div>';
    setText(b.querySelector("b"),t(m)); setText(b.querySelector("em"),t(m.sub));
    b.addEventListener("click",function(){matIdx=i;renderMats();lastSpoken=t(m)+". "+t(m.cap)});
    g.appendChild(b);
  });
  renderMatDemo();
}
function renderMats(){
  Array.prototype.forEach.call($("matGrid").children,function(b,i){
    b.setAttribute("aria-pressed",i===matIdx?"true":"false");
    setText(b.querySelector("b"),t(MATS[i])); setText(b.querySelector("em"),t(MATS[i].sub));
  });
  renderMatDemo();
}
function renderMatDemo(){
  var m=MATS[matIdx];
  $("matBlock").style.background=m.bg; $("matBlock").style.opacity=String(m.blockOp);
  $("matSpot").style.opacity=String(m.spot);
  $("matSpot").style.transform="translateY(-50%) scale("+(0.6+m.spot*0.8)+")";
  setText($("matCap"),t(m.cap));
}

function buildRefs(){
  var g=$("refGrid"); g.innerHTML="";
  REFS.forEach(function(r,i){
    var b=document.createElement("button");
    b.type="button"; b.className="ref";
    b.setAttribute("aria-pressed",i===refIdx?"true":"false");
    b.innerHTML='<span class="emo">'+r.emoji+'</span><b></b><span></span>';
    setText(b.querySelector("b"),t(r)); setText(b.querySelector("span"),t(r.sub));
    b.addEventListener("click",function(){refIdx=i;renderRefs();lastSpoken=t(r)+". "+t(r.note)});
    g.appendChild(b);
  });
  renderBounce();
}
function renderRefs(){
  Array.prototype.forEach.call($("refGrid").children,function(b,i){
    b.setAttribute("aria-pressed",i===refIdx?"true":"false");
    setText(b.querySelector("b"),t(REFS[i])); setText(b.querySelector("span"),t(REFS[i].sub));
  });
  renderBounce();
}
function renderBounce(){
  var r=REFS[refIdx];
  $("surf").setAttribute("fill",r.fill);
  var out=$("rayOut"), abs=$("rayAbsorb");
  if(r.bounce){
    var rad=r.angle*Math.PI/180;
    var x2=210+Math.cos(rad)*70, y2=80+Math.sin(rad)*70;
    out.setAttribute("d","M210 80 L"+x2.toFixed(1)+" "+y2.toFixed(1));
    out.setAttribute("opacity",String(r.outOp)); abs.setAttribute("opacity","0");
    setText($("bounceLbl"),t({en:"Light bounces back!",ur:"روشنی واپس اچھلتی ہے!"}));
  } else {
    out.setAttribute("opacity","0"); abs.setAttribute("opacity",String(r.absOp));
    setText($("bounceLbl"),t({en:"Light is absorbed",ur:"روشنی جذب ہو گئی"}));
  }
  setText($("bounceNote"),t(r.note));
}

function renderCards(){
  setText($("cardHook"),t(CARDS.hook));
  setText($("cardSamjhao"),t(CARDS.samjhao));
  setText($("cardMisaal"),t(CARDS.misaal));
  setText($("tipHead"),t(TIP.head));
  var ol=$("tipList"); ol.innerHTML=""; ol.setAttribute("dir",lang==="ur"?"rtl":"ltr");
  t(TIP.steps).forEach(function(step){var li=document.createElement("li"); setText(li,step); ol.appendChild(li)});
}

function buildQuiz(){
  var box=$("quizBox"); box.innerHTML="";
  QUIZ.forEach(function(item){
    var wrap=document.createElement("div"); wrap.className="q";
    var q=document.createElement("p"); setText(q,t(item.q)); wrap.appendChild(q);
    var fb=document.createElement("p"); fb.className="fb";
    item.o.forEach(function(opt,oi){
      var b=document.createElement("button"); b.type="button";
      b.className="opt"+(lang==="ur"?" ur":"");
      b.setAttribute("dir",lang==="ur"?"rtl":"ltr");
      b.textContent=(lang==="ur")?isolate(t(opt)):t(opt);
      b.addEventListener("click",function(){
        if(wrap.getAttribute("data-done")==="1") return;
        wrap.setAttribute("data-done","1");
        Array.prototype.forEach.call(wrap.querySelectorAll(".opt"),function(x,xi){
          if(xi===item.a) x.classList.add("right");
          else if(xi===oi) x.classList.add("wrong");
        });
        setText(fb,t(item.f)); fb.classList.add("show");
      });
      wrap.appendChild(b);
    });
    wrap.appendChild(fb); box.appendChild(wrap);
  });
}

function applyLang(){
  document.body.classList.toggle("urdu",lang==="ur");
  var lb=$("langBtn");
  lb.textContent=(lang==="en")?"اردو":"English";
  lb.setAttribute("aria-pressed",lang==="ur"?"true":"false");
  Array.prototype.forEach.call(document.querySelectorAll("[data-en]"),function(el){
    setText(el,el.getAttribute(lang==="en"?"data-en":"data-ur"));
  });
  setText($("quizHead"),t({en:"Check yourself",ur:"اپنا امتحان لیں"}));
  setText($("sceneHint"),t({en:"Drag the ☀️ light and the block",ur:"☀️ روشنی اور بلاک کو کھینچیں"}));
  renderSources(); renderMats(); renderRefs(); renderCards(); updateShadow(); buildQuiz();
  lastSpoken=t({en:"Light and shadow. Drag the light. Make a shadow.",ur:"روشنی اور سایہ۔ روشنی کھینچیں۔ سایہ بناؤ۔"});
}

$("langBtn").addEventListener("click",function(){lang=(lang==="en")?"ur":"en";applyLang()});
$("speakBtn").addEventListener("click",function(){
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(lastSpoken||(lang==="en"?"Light and shadow":"روشنی اور سایہ"));
    u.lang=(lang==="ur")?"ur-PK":"en-US"; u.rate=0.92;
    var voices=window.speechSynthesis.getVoices()||[];
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang&&voices[i].lang.toLowerCase().indexOf(lang==="ur"?"ur":"en")===0){u.voice=voices[i];break}
    }
    window.speechSynthesis.speak(u);
  }catch(e){}
});

buildSources(); buildMats(); buildRefs(); initShadow(); applyLang();
})();
</script>
