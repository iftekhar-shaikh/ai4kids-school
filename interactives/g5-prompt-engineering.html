<title>Prompt engineering — Achi baat / Best prompts | AI4Kids Class 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(0.95rem, 2.4vw, 1.15rem);
  --fs-xs: clamp(1.15rem, 3vw, 1.35rem);
  --fs-sm: clamp(1.3rem, 3.4vw, 1.55rem);
  --fs-md: clamp(1.45rem, 3.8vw, 1.8rem);
  --fs-lg: clamp(1.7rem, 4.6vw, 2.2rem);
  --fs-xl: clamp(2.1rem, 5.5vw, 2.75rem);
}
/* /AI4KIDS_FS_SCALE */

  :root{
    --board:#ebe4f7;
    --board-deep:#d9cef0;
    --a:#5b4a8f;
    --b:#c9702e;
    --both:#7a5aa8;
    --gold:#e8b23d;
    --left:#c4453a;
    --ok:#2e7d4f;
    --ink:#1e2a36;
    --ink-soft:#4a5a6b;
    --paper:#faf8fc;
    --line:#d4c8e8;
    --accent:#5b4a8f;
    --fire:#e85d4c;
    --fs-cap:clamp(14px, 3.8vw, 16px);--fs-xs:clamp(16px, 4.2vw, 18px);--fs-sm:clamp(18px, 4.8vw, 20px);--fs-md:clamp(19px, 5.2vw, 22px);--fs-lg:clamp(22px, 6vw, 26px);--fs-xl:clamp(30px, 8vw, 38px);
    --lh:1.5;
  }
  body.urdu{
    --fs-cap:clamp(15px, 4vw, 17px);--fs-xs:clamp(17px, 4.5vw, 19px);--fs-sm:clamp(19px, 5.2vw, 22px);--fs-md:clamp(21px, 5.6vw, 24px);--fs-lg:clamp(24px, 6.5vw, 28px);--fs-xl:clamp(28px, 7.5vw, 36px);
    --lh:2.1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .stars{display:flex;align-items:center;gap:6px;font-weight:800;font-size:var(--fs-xs);
         background:#fff6e2;border:2px solid var(--gold);border-radius:999px;padding:7px 13px}
  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}
  .tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
  .tabs button{
    flex:1 1 22%;min-width:72px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:10px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:54px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .tabs button .badge{color:var(--gold)}
  .story{
    background:#f0eaf8;border:2px dashed var(--a);border-radius:16px;padding:13px 15px;
    font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6;margin-bottom:14px;
  }
  body.urdu .story{line-height:var(--lh)}
  .story b{color:var(--ink)}
  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  }
  .scene-pad{padding:16px;min-height:220px}
  .readout{
    margin-top:-18px;position:relative;z-index:2;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.win{background:var(--ok)}
  .statechip.miss{background:var(--left)}
  .statechip.fire{background:var(--fire)}
  .headline{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .headline.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
  .hintbox{
    margin-top:14px;border:2px solid var(--a);background:#f0eaf8;border-radius:14px;
    padding:11px 14px;font-size:var(--fs-xs);color:var(--a);font-weight:700;line-height:1.55;
    display:none;
  }
  .hintbox.show{display:block}
  body.urdu .hintbox{line-height:var(--lh)}
  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .prog{margin:0 0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft)}
  .btns{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}
  .btns button{
    border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);
    font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;min-height:50px;
    padding:8px 14px;flex:1;
  }
  .btns .go{background:var(--ink);color:var(--paper)}
  .btns button:active{transform:scale(.97)}
  .btns button:disabled{opacity:.4;cursor:default}
  .prompt-card{
    background:var(--paper);border:3px solid var(--ink);border-radius:16px;
    padding:14px 16px;margin-bottom:10px;font-weight:700;font-size:var(--fs-sm);
    line-height:1.45;cursor:pointer;text-align:left;width:100%;
    font-family:inherit;color:var(--ink);
  }
  .prompt-card.ur{text-align:right;line-height:var(--lh);font-weight:400}
  .prompt-card.weak{border-style:dashed;border-color:var(--left);background:#fdf0ee}
  .prompt-card.strong{border-color:var(--ok);background:#e8f2ed}
  .prompt-card.picked{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,178,61,.35)}
  .prompt-card.wrong{border-color:var(--left);background:#fbeae8}
  .prompt-card.right{border-color:var(--ok);background:#e8f2ed}
  .prompt-card:disabled{cursor:default;opacity:.95}
  .bubble-label{
    display:inline-block;font-size:var(--fs-cap);font-weight:800;
    background:var(--ink);color:#fff;border-radius:999px;padding:3px 10px;margin-bottom:8px;
  }
  .bubble-label.weak{background:var(--left)}
  .bubble-label.strong{background:var(--ok)}
  .goal-box{
    background:#fff;border:2px dashed var(--a);border-radius:14px;
    padding:12px 14px;margin-bottom:12px;font-weight:700;font-size:var(--fs-sm);
  }
  .built-prompt{
    background:#fff;border:3px solid var(--ink);border-radius:16px;
    padding:14px 16px;min-height:72px;font-weight:700;font-size:var(--fs-sm);
    line-height:1.5;margin-bottom:10px;
  }
  .built-prompt.ur{font-weight:400;line-height:var(--lh)}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .dchip{
    border:2px solid var(--ink);background:var(--paper);border-radius:999px;
    padding:8px 14px;font:inherit;font-weight:800;font-size:var(--fs-cap);
    cursor:pointer;min-height:44px;
  }
  .dchip.on{background:var(--ok);color:#fff;border-color:var(--ok)}
  .dchip:disabled{opacity:.45;cursor:default}
  .vs-row{display:flex;flex-direction:column;gap:10px}
  .emoji-big{font-size:42px;text-align:center;margin:4px 0 8px}
  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .qhead h2{font-size:var(--fs-lg);font-weight:800;margin:0;flex:1}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--left);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}
  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}
  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;
      grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar"
        "head  head"
        "tabs  tabs"
        "story story"
        "left  right"
        "quiz  quiz"
        "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .story{grid-area:story} .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important}
  }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */

  function award(key, n){
    if (awarded[key]) return;
    awarded[key] = true;
    stars += (n || 1);
    $("starCount").textContent = String(stars);
  }

  function storyHtml(){
    var s = mode === "vague" ? T.storyVague : mode === "detail" ? T.storyDetail : T.storyPick;
    return t(s);

  function shuffle(arr){
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--){
      j = Math.floor(Math.random() * (i + 1));
      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  /* ---------- VAGUE VS CLEAR ---------- */
  function renderVague(){
    var r = VAGUE_ROUNDS[vague.idx % VAGUE_ROUNDS.length];
    var pad = $("scenePad");
    pad.innerHTML = "";
    var wrap = document.createElement("div");
    wrap.className = "vs-row";
    wrap.innerHTML = '<div class="emoji-big">' + r.emoji + '</div>';

    var order = shuffle([
      {kind:"weak", text:r.weak},
      {kind:"clear", text:r.clear}
    ]);

    order.forEach(function(item){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "prompt-card " + (item.kind === "weak" ? "weak" : "strong");
      if (lang === "ur"){ btn.classList.add("ur"); btn.setAttribute("dir","rtl"); }
      var lab = document.createElement("span");
      lab.className = "bubble-label " + (item.kind === "weak" ? "weak" : "strong");
      lab.textContent = item.kind === "weak"
        ? (lang==="en" ? "Prompt A" : "پرامپٹ اے")
        : (lang==="en" ? "Prompt B" : "پرامپٹ بی");
      btn.appendChild(lab);
      var p = document.createElement("div");
      p.textContent = (lang === "ur") ? isolate(t(item.text)) : t(item.text);
      btn.appendChild(p);
      btn.disabled = vague.answered;
      btn.addEventListener("click", function(){ chooseVague(item.kind, btn); });
      wrap.appendChild(btn);
    });
    pad.appendChild(wrap);

    setText($("statechip"), vague.answered ? t(T.niceClear) : t(T.pickClear));
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (vague.answered ? " win" : "");
    setText($("headline"), t(T.pickClear));
    setText($("detail"), vague.answered ? t(r.why) : t(T.tipVague));
    $("hintbox").classList.remove("show");
    $("actionBox").innerHTML = "";
    updateProg();
  }

  function chooseVague(kind, btn){
    if (vague.answered) return;
    vague.answered = true;
    var cards = $("scenePad").querySelectorAll(".prompt-card");
    cards.forEach(function(c){ c.disabled = true; });
    if (kind === "clear"){
      btn.classList.add("right");
      vague.correct += 1;
      award("vague-" + vague.idx, 1);
      doneModes.vague = true;
      setText($("statechip"), t(T.niceClear));
      $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
      setText($("detail"), t(VAGUE_ROUNDS[vague.idx % VAGUE_ROUNDS.length].why));
    } else {
      btn.classList.add("wrong");
      cards.forEach(function(c){
        if (c.classList.contains("strong")) c.classList.add("right");
      });
      setText($("statechip"), t(T.oopsVague));
      $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
      setText($("detail"), t(VAGUE_ROUNDS[vague.idx % VAGUE_ROUNDS.length].why));
    }
    tabBadges();
    updateProg();
  }

  /* ---------- ADD DETAILS ---------- */
  function renderDetail(){
    var r = DETAIL_ROUNDS[detail.idx % DETAIL_ROUNDS.length];
    var pad = $("scenePad");
    pad.innerHTML = "";
    var box = document.createElement("div");
    box.innerHTML = '<div class="emoji-big">' + r.emoji + '</div>';
    var baseLab = document.createElement("span");
    baseLab.className = "bubble-label";
    baseLab.textContent = t(T.base);
    box.appendChild(baseLab);

    var built = document.createElement("div");
    built.className = "built-prompt" + (lang==="ur"?" ur":"");
    built.setAttribute("dir", lang==="ur"?"rtl":"ltr");
    built.id = "builtPrompt";
    box.appendChild(built);

    var row = document.createElement("div");
    row.className = "chip-row";
    [["who", T.who, r.who],["what", T.what, r.what],["where", T.where, r.where]].forEach(function(pair){
      var key = pair[0], lab = pair[1], val = pair[2];
      var b = document.createElement("button");
      b.type = "button";
      b.className = "dchip" + (detail[key] ? " on" : "");
      b.textContent = t(lab) + ": " + t(val);
      if (lang === "ur"){ b.classList.add("ur"); b.setAttribute("dir","rtl"); }
      b.addEventListener("click", function(){ toggleDetail(key); });
      row.appendChild(b);
    });
    box.appendChild(row);
    pad.appendChild(box);

    refreshBuilt();
    var n = (detail.who?1:0) + (detail.what?1:0) + (detail.where?1:0);
    var done = n >= 3;
    setText($("statechip"), done ? t(T.detailOk) : t(T.needThree));
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (done ? " win" : "");
    setText($("headline"), t(T.addChips));
    setText($("detail"), done ? t(r.full) : t(T.tipDetail));
    $("hintbox").classList.remove("show");
    $("actionBox").innerHTML = "";
    if (done){
      doneModes.detail = true;
      award("detail-" + detail.idx, 2);
      detail.completed[detail.idx] = true;
    }
    updateProg();
    tabBadges();
  }

  function refreshBuilt(){
    var r = DETAIL_ROUNDS[detail.idx % DETAIL_ROUNDS.length];
    var el = $("builtPrompt");
    if (!el) return;
    var n = (detail.who?1:0) + (detail.what?1:0) + (detail.where?1:0);
    if (n >= 3){
      setText(el, t(r.full));
      el.classList.add("strong");
      el.style.borderColor = "var(--ok)";
      el.style.background = "#e8f2ed";
    } else {
      var parts = [t(r.base)];
      if (detail.who) parts.push(t(r.who));
      if (detail.what) parts.push(t(r.what));
      if (detail.where) parts.push(t(r.where));
      setText(el, parts.join(" "));
      el.style.borderColor = "";
      el.style.background = "";
    }
  }

  function toggleDetail(key){
    detail[key] = !detail[key];
    renderDetail();
  }

  /* ---------- BEST PROMPT PICK ---------- */
  function renderPick(){
    var r = PICK_ROUNDS[pick.idx % PICK_ROUNDS.length];
    var pad = $("scenePad");
    pad.innerHTML = "";
    var wrap = document.createElement("div");
    wrap.className = "vs-row";
    wrap.innerHTML = '<div class="emoji-big">' + r.emoji + '</div>';

    var goal = document.createElement("div");
    goal.className = "goal-box" + (lang==="ur"?" ur":"");
    goal.setAttribute("dir", lang==="ur"?"rtl":"ltr");
    var gl = document.createElement("span");
    gl.className = "bubble-label";
    gl.textContent = t(T.goal);
    goal.appendChild(gl);
    var gp = document.createElement("div");
    gp.style.marginTop = "6px";
    gp.textContent = (lang==="ur") ? isolate(t(r.goal)) : t(r.goal);
    goal.appendChild(gp);
    wrap.appendChild(goal);

    var opts = r.opts.slice();
    // keep stable visual order but shuffle once per idx via seeded-ish shuffle copy
    if (!r._order){
      r._order = shuffle([0,1,2]);
    }
    r._order.forEach(function(oi){
      var item = opts[oi];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "prompt-card";
      if (lang === "ur"){ btn.classList.add("ur"); btn.setAttribute("dir","rtl"); }
      btn.textContent = (lang==="ur") ? isolate(t(item)) : t(item);
      btn.disabled = pick.answered;
      btn.addEventListener("click", function(){ choosePick(oi, item.good, btn); });
      wrap.appendChild(btn);
    });
    pad.appendChild(wrap);

    setText($("statechip"), pick.answered ? t(T.pickOk) : t(T.pickBest));
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (pick.answered && pick._lastOk ? " win" : (pick.answered ? " miss" : ""));
    setText($("headline"), t(T.pickBest));
    setText($("detail"), pick.answered ? t(r.why) : t(T.tipPick));
    $("hintbox").classList.remove("show");
    $("actionBox").innerHTML = "";
    updateProg();
  }

  function choosePick(oi, good, btn){
    if (pick.answered) return;
    pick.answered = true;
    pick._lastOk = !!good;
    var cards = $("scenePad").querySelectorAll(".prompt-card");
    var r = PICK_ROUNDS[pick.idx % PICK_ROUNDS.length];
    cards.forEach(function(c){ c.disabled = true; });
    if (good){
      btn.classList.add("right");
      pick.correct += 1;
      award("pick-" + pick.idx, 1);
      doneModes.pick = true;
      setText($("statechip"), t(T.pickOk));
      $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
    } else {
      btn.classList.add("wrong");
      // highlight correct
      r._order.forEach(function(idx, pos){
        if (r.opts[idx].good) cards[pos].classList.add("right");
      });
      setText($("statechip"), t(T.pickMiss));
      $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
    }
    setText($("detail"), t(r.why));
    tabBadges();
    updateProg();
  }

  /* ---------- shared UI ---------- */
  function updateProg(){
    var el = $("prog");
    if (mode === "vague"){
      setText(el, t(T.progVague) + ": " + vague.correct + "/" + VAGUE_ROUNDS.length +
        " · #" + ((vague.idx % VAGUE_ROUNDS.length)+1));
    } else if (mode === "detail"){
      var n = (detail.who?1:0)+(detail.what?1:0)+(detail.where?1:0);
      setText(el, t(T.progDetail) + ": " + n + "/3 · #" + ((detail.idx % DETAIL_ROUNDS.length)+1));
    } else {
      setText(el, t(T.progPick) + ": " + pick.correct + "/" + PICK_ROUNDS.length +
        " · #" + ((pick.idx % PICK_ROUNDS.length)+1));
    }
  }

  function tabBadges(){
    function label(btn, base, key){
      var s = t(base);
      if (doneModes[key]) s += " ★";
      btn.innerHTML = "";
      var span = document.createElement("span");
      span.textContent = s;
      if (lang === "ur"){ span.className = "ur"; span.setAttribute("dir","rtl"); }
      btn.appendChild(span);
    }
    label($("tabVague"), T.tabVague, "vague");
    label($("tabDetail"), T.tabDetail, "detail");
    label($("tabPick"), T.tabPick, "pick");
  }

  function setMode(m){
    mode = m;
    $("tabVague").setAttribute("aria-pressed", m === "vague" ? "true" : "false");
    $("tabDetail").setAttribute("aria-pressed", m === "detail" ? "true" : "false");
    $("tabPick").setAttribute("aria-pressed", m === "pick" ? "true" : "false");
    var story = $("story");
    story.innerHTML = storyHtml();
    story.classList.toggle("ur", lang === "ur");
    story.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
    $("nextBtn").textContent = t(T.next);
    if (m === "vague") renderVague();
    else if (m === "detail") renderDetail();
    else renderPick();
    tabBadges();
  }

  function next(){
    if (mode === "vague"){
      vague.idx = (vague.idx + 1) % VAGUE_ROUNDS.length;
      vague.answered = false;
      renderVague();
    } else if (mode === "detail"){
      detail.idx = (detail.idx + 1) % DETAIL_ROUNDS.length;
      detail.who = false; detail.what = false; detail.where = false;
      renderDetail();
    } else {
      pick.idx = (pick.idx + 1) % PICK_ROUNDS.length;
      pick.answered = false;
      pick._lastOk = false;
      var r = PICK_ROUNDS[pick.idx % PICK_ROUNDS.length];
      r._order = null;
      renderPick();
    }
  }

  function resetMode(){
    if (mode === "vague"){
      vague = {idx:0, answered:false, correct:0};
      VAGUE_ROUNDS.forEach(function(){});
      renderVague();
    } else if (mode === "detail"){
      detail = {idx:0, who:false, what:false, where:false, completed:{}};
      renderDetail();
    } else {
      pick = {idx:0, answered:false, correct:0};
      PICK_ROUNDS.forEach(function(r){ r._order = null; });
      renderPick();
    }
    tabBadges();
  }

  function showHint(){
    var hb = $("hintbox");
    var msg;
    if (mode === "vague"){
      msg = lang === "en"
        ? "Look for numbers, places, and exact tasks (recipe, list, poem)."
        : "تعداد، جگہ، اور عین کام دیکھو (ریسیپی، فہرست، نظم)۔";
    } else if (mode === "detail"){
      msg = lang === "en"
        ? "Turn on all three chips: Who, What, and Where — then read the full prompt."
        : "تینوں چپس آن کرو: کون، کیا، کہاں — پھر پورا پرامپٹ پڑھو۔";
    } else {
      msg = lang === "en"
        ? "The best option names the goal clearly and adds useful limits."
        : "بہترین اختیار مقصد واضح نام دیتا ہے اور مفید حدیں جوڑتا ہے۔";
    }
    setText(hb, msg);
    hb.classList.add("show");
  }

  /* ---------- quiz ---------- */
  function pickQuiz(){
    quizSet = shuffle(QUIZ).slice(0, 5);
  }

  function renderQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizSet.forEach(function(item, qi){
      var q = document.createElement("div");
      q.className = "q";
      var p = document.createElement("p");
      setText(p, (qi+1) + ". " + t(item.q));
      q.appendChild(p);
      item.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang === "ur" ? " ur" : "");
        b.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
        b.textContent = (lang === "ur") ? isolate(t(opt)) : t(opt);
        b.addEventListener("click", function(){
          if (b.parentNode.querySelector(".opt.right, .opt.wrong")) return;
          var ok = (oi === item.a);
          b.classList.add(ok ? "right" : "wrong");
          if (!ok){
            var correct = b.parentNode.querySelectorAll(".opt")[item.a];
            if (correct) correct.classList.add("right");
          } else {
            award("quiz-" + qi, 1);
          }
          var fb = document.createElement("p");
          fb.className = "fb show";
          setText(fb, ok
            ? (lang==="en"?"Shabash!":"شاباش!")
            : (lang==="en"?"Look at the green answer.":"سبز جواب دیکھو۔"));
          q.appendChild(fb);
        });
        q.appendChild(b);
      });
      box.appendChild(q);
    });
  }

    } else {
      ["nextBtn","hintBtn","resetBtn","newQuiz"].forEach(function(id){
        $(id).classList.remove("ur"); $(id).setAttribute("dir","ltr");
      });
    }
    document.querySelectorAll("footer [data-en]").forEach(function(el){
      setText(el, el.getAttribute(lang === "en" ? "data-en" : "data-ur"));
    });
    setMode(mode);
    renderQuiz();
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });
  $("tabVague").addEventListener("click", function(){ setMode("vague"); });
  $("tabDetail").addEventListener("click", function(){ setMode("detail"); });
  $("tabPick").addEventListener("click", function(){ setMode("pick"); });
  $("nextBtn").addEventListener("click", next);
  $("hintBtn").addEventListener("click", showHint);
  $("resetBtn").addEventListener("click", resetMode);
  $("newQuiz").addEventListener("click", function(){ pickQuiz(); renderQuiz(); });

  /* ---------- speak (cancel → delay) ---------- */
  function cleanSpeakText(s){
    return String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  function buildSpeakText(){
    var bits = [];
    bits.push(t(T.title));
    bits.push(cleanSpeakText(storyHtml().replace(/<b>/g,"").replace(/<\/b>/g,"")));
    bits.push(cleanSpeakText(($("headline") && $("headline").textContent) || ""));
    bits.push(cleanSpeakText(($("detail") && $("detail").textContent) || ""));
    bits.push(t(T.tipVague));
    return bits.filter(Boolean).join(". ");
  }
  function pickVoice(voices, want){
    var i, v, L;
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf(want) === 0) return v;
    }
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf("en") === 0) return v;
    }
    return voices[0] || null;
  }
  var speakTimer = null;
  function setSpeaking(on){
    var btn = $("speakBtn");
    if (!btn) return;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.style.opacity = on ? "0.65" : "";
  }
  function doSpeak(text, asLang){
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92;
    u.lang = (asLang === "ur") ? "ur-PK" : "en-US";
    var voices = window.speechSynthesis.getVoices() || [];
    var voice = pickVoice(voices, asLang === "ur" ? "ur" : "en");
    if (voice) u.voice = voice;
    u.onstart = function(){ setSpeaking(true); };
    u.onend = function(){ setSpeaking(false); };
    u.onerror = function(){
      setSpeaking(false);
      if (asLang === "ur"){
        var fallback = cleanSpeakText(
          T.title.en + ". " + T.storyVague.en.replace(/<[^>]+>/g," ") + ". " + T.tipVague.en
        );
        var u2 = new SpeechSynthesisUtterance(fallback);
        u2.lang = "en-US"; u2.rate = 0.92;
        var v2 = pickVoice(window.speechSynthesis.getVoices() || [], "en");
        if (v2) u2.voice = v2;
        u2.onstart = function(){ setSpeaking(true); };
        u2.onend = u2.onerror = function(){ setSpeaking(false); };
        window.speechSynthesis.speak(u2);
      }
    };
    window.speechSynthesis.speak(u);
  }
  if ("speechSynthesis" in window){
    try { window.speechSynthesis.getVoices(); } catch (e0) {}
    if (typeof window.speechSynthesis.addEventListener === "function"){
      window.speechSynthesis.addEventListener("voiceschanged", function(){
        try { window.speechSynthesis.getVoices(); } catch (e1) {}
      });
    }
  } else {
    var noBtn = $("speakBtn");
    if (noBtn){
      noBtn.disabled = true;
      noBtn.title = "Voice not available on this device";
    }
  }
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      var text = buildSpeakText();
      if (!text) return;
      if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
      window.speechSynthesis.cancel();
      setSpeaking(false);
      var speakLang = lang;
      speakTimer = setTimeout(function(){
        speakTimer = null;
        doSpeak(text, speakLang);
      }, 80);
    }catch(e){ setSpeaking(false); }
  });

  pickQuiz();
  applyLang();
})();
</script>
</body>
</html>
