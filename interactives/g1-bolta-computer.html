, shayad jawab de."},"samjhao":{"en":"A microphone hears our voice. A computer changes sound into words and looks for an answer. A speaker plays the answer.","ru":"Microphone awaaz sunta hai. Computer awaaz ko alfaaz mein badal kar jawab dhoondta hai. Speaker jawab sunata hai."},"misaal":{"en":"Ask a voice helper for a timer, song, or simple fact. Do not share your address or secret.","ru":"Voice helper se timer, gana ya simple fact pooch sakte ho. Apna pata ya secret na batao."},"karo":{"en":"Play paper assistant: one child says a command and another gives a kind answer.","ru":"Paper assistant khelo: ek bacha command bole aur doosra pyara jawab de."}},"demo":{"type":"cards","title":{"en":"Talk to the pretend assistant","ru":"Nakli assistant se baat karo"},"instruction":{"en":"Choose a sentence, then press Answer.","ru":"Jumla chuno, phir Answer dabao."},"items":[["👋","Say hello","Hello kaho","Hello! Nice to hear you.","Hello! Tumhari awaaz sun kar khushi hui."],["⏰","Set a timer","Timer lagao","Okay! I can set a pretend timer.","Theek hai! Main nakli timer laga sakti hoon."],["❓","Ask a question","Sawal pocho","I heard your question. Let us check the answer.","Main ne sawal suna. Chalo jawab check karte hain."]]},"quiz":[{"q":{"en":"What are Alexa and Siri?","ru":"Alexa aur Siri kya hain?"},"options":[{"en":"Voice assistants that answer","ru":"Aik computer ka bolne wala hissa"},{"en":"A mobile game","ru":"Aik mobile game"},{"en":"A video player","ru":"Aik video player"},{"en":"A software update","ru":"Aik software update"}],"correct":0,"explanation":{"en":"They listen and answer.","ru":"Kyun sahi hai: Alexa aur Siri computer ka bolne wala hissa hain jo humein jawab dete hain."}},{"q":{"en":"How can a computer speak?","ru":"Computer kis tarah bolta hai?"},"options":[{"en":"With audio","ru":"Audio ke zariye"},{"en":"With video","ru":"Video ke zariye"},{"en":"With light","ru":"Light ke zariye"},{"en":"With text only","ru":"Text ke zariye"}],"correct":0,"explanation":{ o.type==='sort'?(checked?t(it[4]):t({en:'Choose a machine, then check it.',ru:'Machine chuno, phir check karo.'})):(played?t({en:it[3],ru:it[4]}):t({en:'Choose a card, then press Play.',ru:'Card chuno, phir Play dabao.'}));s.appendChild(m)}function quiz(){let box=$('quizBox');box.innerHTML='';let done=0,score=0;D.quiz.forEach((q,qi)=>{let w=document.createElement('div');w.className='q';let p=document.createElement('p');p.className='q-title';p.textContent=(qi+1)+'. '+t(q.q);w.appendChild(p);let f=document.createElement('p');f.className='feedback';q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+t(o);b.onclick=()=>{if(w.dataset.done)return;w.dataset.done=1;done++;let ok=i===q.correct;if(ok)score++;w.querySelectorAll('button').forEach((x,j)=>{x.disabled=true;if(j===q.correct)x.classList.add('right');else if(j===i)x.classList.add('wrong')});f.textContent=(ok?'✓ ':'✗ ')+t(q.explanation);f.className='feedback show';if(done===5){$('score').textContent=(lang==='en'?'Your score: ':'Tumhara score: ')+score+' / 5';$('score').className='score show'}};w.appendChild(b)});w.appendChild(f);box.appendChild(w)})}$('langBtn').onclick=()=>{lang=lang==='en'?'ru':'en';selected=0;played=false;checked=false;render()};$('speakBtn').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t(D.title)+' '+t(D.desc));u.lang=lang==='ru'?'en-PK':'en-US';u.rate=.9;speechSynthesis.speak(u)}};$('launch').onclick=()=>{$('demo').scrollIntoView({behavior:'smooth'});demo()};render()})();</script></body></html>
