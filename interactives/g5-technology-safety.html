body{font-size:var(--fs-md)!important;line-height:1.5!important;}

  :root{

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{

  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:42px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .stars{display:flex;align-items:center;gap:6px;font-weight:800;font-size:var(--fs-xs);
         background:#fff6e2;border:2px solid var(--gold);border-radius:999px;padding:7px 13px}
  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}

  .tabs button{
    flex:1 1 28%;min-width:90px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:10px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:54px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

    background:#fff8ea;border:2px dashed var(--gold);border-radius:16px;padding:13px 15px;
    font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6;margin-bottom:14px;
  }
  body.urdu .story{line-height:var(--lh)}
  .story b{color:var(--ink)}
  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 38%,var(--wall) 38%,var(--board) 100%);
    min-height:280px;
  }
  .scene-pad{padding:10px 12px 18px;min-height:260px;position:relative}
  .sky-layer{position:absolute;inset:0 0 58% 0;pointer-events:none;overflow:hidden}
  .sun-ball{
    position:absolute;top:12px;right:18px;width:42px;height:42px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffe9a0,#f5c542 60%,#e0a020);
    box-shadow:0 0 20px rgba(245,197,66,.5);z-index:1;
  }
  body.urdu .sun-ball{right:auto;left:18px}
  .cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:40px;opacity:.9}
  .cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
  .c1{width:50px;height:16px;top:20px;left:14%}
  .c1:before{width:24px;height:24px;top:-14px;left:8px}
  .c1:after{width:20px;height:20px;top:-8px;left:26px}
  .c2{width:36px;height:12px;top:36px;left:52%;opacity:.7}
  .c2:before{width:18px;height:18px;top:-10px;left:5px}
  .c2:after{width:14px;height:14px;top:-6px;left:18px}
  .hills{position:absolute;left:0;right:0;bottom:0;height:55px;z-index:1}
  .hill{position:absolute;bottom:0;border-radius:50% 50% 0 0;
        background:linear-gradient(180deg,#5a8a5a,#2d5530)}
  .h-a{width:45%;height:48px;left:-5%;opacity:.7}
  .h-b{width:40%;height:38px;right:5%;opacity:.65}
  .window-frame{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);width:72%;height:42%;
    border:3px solid #8b7355;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#9ec9f0,#b8d4a8);
    z-index:0;overflow:hidden;box-shadow:inset 0 0 0 2px #d4c4a8;
  }
  .mosque-tip{
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;
    border-bottom:28px solid #e8e4dc;opacity:.85;z-index:1;
  }
  .mosque-tip:after{content:"";position:absolute;left:-3px;top:-8px;width:6px;height:10px;background:#e8e4dc;border-radius:2px}
  .desk-strip{
    position:absolute;left:0;right:0;bottom:0;height:28%;
    background:linear-gradient(180deg,var(--desk) 0%,var(--desk-deep) 100%);
    z-index:2;border-top:3px solid #8b6914;
  }
  .desk-leg{position:absolute;bottom:0;width:10px;height:22%;background:#8b6914;z-index:1}

    position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:10px;
    justify-content:center;align-items:flex-end;min-height:150px;padding-top:70px;
  }
  .device-illu{
    background:rgba(253,250,243,.95);border:2.5px solid var(--ink);border-radius:16px;
    padding:10px 12px;text-align:center;min-width:88px;max-width:120px;
    box-shadow:0 3px 0 rgba(30,42,26,.12);
  }
  .device-illu .big{font-size:42px;line-height:1.1;display:block}
  .device-illu .lab{font-size:var(--fs-cap);font-weight:800;margin:4px 0 0}
  .part-card{
    background:rgba(253,250,243,.95);border:2.5px solid var(--ink);border-radius:16px;
    padding:8px 10px 10px;text-align:center;min-width:72px;max-width:100px;
    box-shadow:0 3px 0 rgba(30,42,26,.15);cursor:pointer;user-select:none;
  }
  .part-card:hover{transform:translateY(-2px)}
  .part-card.picked{opacity:.35;pointer-events:none}
  .part-card.ok{border-color:var(--ok);background:#e8f2ed}
  .part-card.no{border-color:var(--left);background:#fbeae8}
  .part-card.selected{border-color:var(--accent);background:#eaf1f9;box-shadow:0 0 0 3px rgba(47,111,181,.25)}
  .part-em{font-size:34px;line-height:1.1;display:block;margin-bottom:2px}
  .part-lab{font-size:var(--fs-cap);font-weight:800;line-height:1.25;margin:0}
  .job-slots{
    position:relative;z-index:5;display:flex;flex-direction:column;gap:8px;
    padding-top:88px;min-height:140px;
  }
  .job-slot{
    border:2.5px dashed rgba(30,42,26,.4);border-radius:14px;
    background:rgba(253,250,243,.75);padding:10px 12px;min-height:52px;
    display:flex;align-items:center;gap:10px;font-weight:800;font-size:var(--fs-xs);
    cursor:pointer;color:var(--ink-soft);
  }
  .job-slot.filled{border-style:solid;border-color:var(--ink);background:var(--paper);color:var(--ink)}
  .job-slot.hot{border-color:var(--accent);background:#eaf1f9}
  .job-slot .jem{font-size:28px}
  .job-slot.right{border-color:var(--ok);background:#e8f2ed}
  .job-slot.wrong{border-color:var(--left);background:#fbeae8}
  .bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;position:relative;z-index:5}
  .save-scene{position:relative;z-index:5;padding-top:88px;text-align:center}
  .save-hero{font-size:64px;line-height:1;margin:4px 0 8px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
  .save-choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .save-choices button{
    border:2.5px solid var(--ink);background:var(--paper);border-radius:14px;
    padding:12px 14px;font:inherit;font-weight:800;font-size:var(--fs-xs);
    cursor:pointer;text-align:left;min-height:52px;display:flex;align-items:center;gap:10px;
  }
  body.urdu .save-choices button{text-align:right}
  .save-choices button .cem{font-size:26px}
  .save-choices button.right{border-color:var(--ok);background:#e8f2ed}
  .save-choices button.wrong{border-color:var(--left);background:#fbeae8}
  .outcome{
    margin-top:10px;border-radius:14px;padding:10px 12px;font-weight:700;font-size:var(--fs-xs);
    display:none;border:2px solid var(--ok);background:#e8f2ed;color:var(--ok);
  }
  .outcome.show{display:block}
  .outcome.bad{border-color:var(--left);background:#fbeae8;color:var(--left)}
  .badge-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0;position:relative;z-index:5}
  .mini-badge{
    border:2px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff;
    font-size:var(--fs-cap);font-weight:800;display:flex;align-items:center;gap:4px;
  }
  .mini-badge.safe{border-color:var(--ok);background:#e8f2ed}
  .mini-badge.warn{border-color:var(--warn);background:#faf0e6}
  .readout{
    margin-top:-18px;position:relative;z-index:2;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-xs);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.win{background:var(--ok)}
  .statechip.miss{background:var(--left)}
  .headline{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.35}
  .headline.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}
  .hintbox{
    margin-top:14px;border:2px solid var(--accent);background:#eaf1f9;border-radius:14px;
    padding:11px 14px;font-size:var(--fs-xs);color:var(--accent);font-weight:700;line-height:1.55;
    display:none;
  }
  .hintbox.show{display:block}
  body.urdu .hintbox{line-height:var(--lh)}
  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .prog{margin:0 0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft)}
  .btns{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}
  .btns button{
    border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);
    font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;min-height:50px;
    padding:8px 14px;flex:1;
  }
  .btns .go{background:var(--ink);color:var(--paper)}
  .btns button:active{transform:scale(.97)}
  .btns button:disabled{opacity:.4;cursor:default}
  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .qhead h2{font-size:var(--fs-lg);font-weight:800;margin:0;flex:1}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:50px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--ok);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--left);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}
  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}
  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:
        "bar   bar" "head  head" "tabs  tabs" "story story"
        "left  right" "quiz  quiz" "foot  foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .story{grid-area:story} .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation:none !important}
  }

    ch.pairs.forEach(function(pr, i){
      var filled = partsMap[i];
      var cls = "job-slot" + (filled ? " filled" : "") + (partsSelected && !filled ? " hot" : "");
      if (partsDone[ch.id] && filled) cls += " right";
      slots += '<div class="'+cls+'" data-slot="'+i+'">';
      if (filled){
        slots += '<span class="jem">'+PARTS[filled].em+'</span><span>'+partLabel(filled)+' — '+t(pr.job)+'</span>';
      } else {
        slots += '<span class="jem">❓</span><span>'+t(pr.job)+'</span>';
      }
      slots += '</div>';
    });
    slots += '</div>';
    pad.innerHTML = homeBg() + slots;

    pad.querySelectorAll(".job-slot").forEach(function(el){
      el.addEventListener("click", function(){
        var si = parseInt(el.getAttribute("data-slot"), 10);
        if (partsDone[ch.id]) return;
        if (partsMap[si]){
          delete partsMap[si];
          renderParts();
          return;
        }
        if (!partsSelected) return;
        // remove if already placed elsewhere
        Object.keys(partsMap).forEach(function(k){
          if (partsMap[k] === partsSelected) delete partsMap[k];
        });
        partsMap[si] = partsSelected;
        partsSelected = null;
        renderParts();
      });
    });

    var poolIds = ch.pairs.map(function(p){ return p.part; }).concat(ch.extras);
    poolIds = shuffle(poolIds);
    var box = $("actionBox");
    box.innerHTML = "";
    var row = document.createElement("div");
    row.className = "bank";
    poolIds.forEach(function(id){
      var used = Object.keys(partsMap).some(function(k){ return partsMap[k] === id; });
      var b = document.createElement("button");
      b.type = "button";
      b.className = "part-card" + (used ? " picked" : "") + (partsSelected===id ? " selected" : "");
      b.innerHTML = '<span class="part-em">'+PARTS[id].em+'</span><p class="part-lab"></p>';
      setText(b.querySelector(".part-lab"), partLabel(id));
      if (!used && !partsDone[ch.id]){
        b.addEventListener("click", function(){ partsSelected = id; renderParts(); });
      }
      row.appendChild(b);
    });
    box.appendChild(row);

    if (!partsDone[ch.id]){
      var check = document.createElement("button");
      check.type = "button";
      check.className = "chip";
      check.style.marginTop = "8px";
      check.style.width = "100%";
      setText(check, t(T.checkMatch));
      check.addEventListener("click", checkParts);
      box.appendChild(check);
    }

    var done = !!partsDone[ch.id];
    setText($("statechip"), done ? t(T.nice) : t(ch.title));
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (done?" win":"");
    setText($("headline"), t(T.askParts));
    setText($("detail"), partsSelected ? partLabel(partsSelected) + " → ?" : t(T.pick));
    $("hintbox").classList.remove("show");
    setText($("prog"), t(T.progP) + ": " + Object.keys(partsDone).length + "/" + PART_CH.length);
  }

  function checkParts(){
    var ch = PART_CH[partsIdx];
    var ok = true;
    ch.pairs.forEach(function(pr, i){
      if (partsMap[i] !== pr.part) ok = false;
    });
    if (ok && ch.pairs.every(function(_, i){ return partsMap[i]; })){
      partsDone[ch.id] = true;
      award("parts-"+ch.id, 1);
      if (Object.keys(partsDone).length === PART_CH.length){
        doneModes.parts = true;
        award("mode-parts", 2);
      }
      setText($("statechip"), t(T.nice));
      $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
      renderParts();
      tabBadges();
    } else {
      setText($("statechip"), t(T.oops));
      $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
      setText($("detail"), t(ch.hint));
    }
  }

  /* ---------- SAFE / HABITS shared ---------- */
  function renderScenario(list, idx, doneMap, modeKey, askKey, progKey){
    var s = list[idx];
    var pad = $("scenePad");
    pad.innerHTML = homeBg() +
      '<div class="save-scene"><div class="save-hero">'+s.hero+'</div>' +
      '<div class="badge-row"><span class="mini-badge safe">🛡️ Safe</span><span class="mini-badge warn">⚠️ Think</span></div></div>';

    var box = $("actionBox");
    box.innerHTML = "";
    var sceneP = document.createElement("p");
    sceneP.style.fontWeight = "700";
    sceneP.style.marginBottom = "8px";
    setText(sceneP, t(s.scene));
    box.appendChild(sceneP);

    var choices = document.createElement("div");
    choices.className = "save-choices";
    var outcome = document.createElement("div");
    outcome.className = "outcome";
    outcome.id = "scOut";

    s.opts.forEach(function(opt){
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="cem">'+opt.em+'</span>';
      var lab = document.createElement("span");
      setText(lab, t(opt));
      b.appendChild(lab);
      if (doneMap[s.id]){
        if (opt.ok) b.classList.add("right");
        b.disabled = true;
      }
      b.addEventListener("click", function(){
        if (doneMap[s.id]) return;
        if (opt.ok){
          b.classList.add("right");
          doneMap[s.id] = true;
          award(modeKey+"-"+s.id, 1);
          if (Object.keys(doneMap).length === list.length){
            doneModes[modeKey] = true;
            award("mode-"+modeKey, 2);
          }
          outcome.className = "outcome show";
          setText(outcome, t(opt.out));
          setText($("statechip"), t(T.nice));
          $("statechip").className = "statechip win" + (lang==="ur"?" ur":"");
          Array.prototype.forEach.call(choices.querySelectorAll("button"), function(x){ x.disabled = true; });
          tabBadges();
        } else {
          b.classList.add("wrong");
          outcome.className = "outcome show bad";
          setText(outcome, t(opt.out));
          setText($("statechip"), t(T.oops));
          $("statechip").className = "statechip miss" + (lang==="ur"?" ur":"");
        }
      });
      choices.appendChild(b);
    });
    box.appendChild(choices);
    box.appendChild(outcome);
    if (doneMap[s.id]){
      var good = s.opts.filter(function(o){ return o.ok; })[0];
      outcome.className = "outcome show";
      setText(outcome, t(good.out));
    }

    setText($("statechip"), doneMap[s.id] ? t(T.nice) : t(s.title));
    $("statechip").className = "statechip" + (lang==="ur"?" ur":"") + (doneMap[s.id]?" win":"");
    setText($("headline"), t(askKey));
    setText($("detail"), t(s.title));
    $("hintbox").classList.remove("show");
    setText($("prog"), t(progKey) + ": " + Object.keys(doneMap).length + "/" + list.length);
  }

  function renderSafe(){ renderScenario(SAFE, safeIdx, safeDone, "safe", T.askSafe, T.progS); }
  function renderHabits(){ renderScenario(HABITS, habitsIdx, habitsDone, "habits", T.askHabits, T.progH); }

  /* ---------- QUIZ ---------- */
  function pickQuiz(){ quizSet = shuffle(QUIZ).slice(0, 5); }
  function renderQuiz(){
    var box = $("quizBox");
    box.innerHTML = "";
    quizSet.forEach(function(item, qi){
      var div = document.createElement("div");
      div.className = "q";
      var p = document.createElement("p");
      setText(p, (qi+1) + ". " + t(item.q));
      div.appendChild(p);
      var fb = document.createElement("p");
      fb.className = "fb";
      item.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (lang==="ur"?" ur":"");
        b.setAttribute("dir", lang==="ur"?"rtl":"ltr");
        b.textContent = (lang==="ur") ? isolate(t(opt)) : t(opt);
        b.addEventListener("click", function(){
          if (div.getAttribute("data-locked")) return;
          div.setAttribute("data-locked","1");
          if (oi === item.correct){
            b.classList.add("right");
            award("quiz-"+qi, 1);
            setText(fb, t(item.why));
          } else {
            b.classList.add("wrong");
            var correctBtn = div.querySelectorAll(".opt")[item.correct];
            if (correctBtn) correctBtn.classList.add("right");
            setText(fb, t(item.why));
          }
          fb.classList.add("show");
        });
        div.appendChild(b);
      });
      div.appendChild(fb);
      box.appendChild(div);
    });
  }

  /* ---------- shell ---------- */
  function storyHtml(){
    if (mode === "parts") return t(T.storyParts);
    if (mode === "safe") return t(T.storySafe);
    return t(T.storyHabits);
  }

  function tabBadges(){
    function lab(btn, labelObj, key){
      var badge = doneModes[key] ? ' <span class="badge">★</span>' : "";
      btn.innerHTML = "";
      var span = document.createElement("span");
      if (lang === "ur"){ span.classList.add("ur"); span.setAttribute("dir","rtl"); }
      span.textContent = (lang==="ur") ? isolate(t(labelObj)) : t(labelObj);
      btn.appendChild(span);
      if (badge){
        var b = document.createElement("span");
        b.innerHTML = badge;
        btn.appendChild(b);
      }
    }
    lab($("tabParts"), T.tabParts, "parts");
    lab($("tabSafe"), T.tabSafe, "safe");
    lab($("tabHabits"), T.tabHabits, "habits");
    $("tabParts").setAttribute("aria-pressed", mode==="parts"?"true":"false");
    $("tabSafe").setAttribute("aria-pressed", mode==="safe"?"true":"false");
    $("tabHabits").setAttribute("aria-pressed", mode==="habits"?"true":"false");
  }

  function setMode(m){
    mode = m;
    $("hintbox").classList.remove("show");
    if (mode === "parts"){ partsSelected = null; renderParts(); }
    else if (mode === "safe") renderSafe();
    else renderHabits();
    applyChrome();
  }

  function applyChrome(){
    setText($("title"), t(T.title));
    setText($("subtitle"), t(T.sub));
    $("story").innerHTML = storyHtml();
    $("story").classList.toggle("ur", lang==="ur");
    $("story").setAttribute("dir", lang==="ur"?"rtl":"ltr");
    setText($("ctlHead"), t(T.ctl));
    setText($("nextBtn"), t(T.next));
    setText($("hintBtn"), t(T.hint));
    setText($("resetBtn"), t(T.reset));
    setText($("quizHead"), t(T.quiz));
    setText($("newQuiz"), t(T.newQuiz));
    $("langBtn").textContent = (lang === "en") ? "اردو" : "EN";
    $("langBtn").setAttribute("aria-pressed", lang==="ur"?"true":"false");
    document.body.classList.toggle("urdu", lang==="ur");
    document.documentElement.lang = (lang==="ur") ? "ur" : "en";
    tabBadges();
    document.querySelectorAll("footer [data-en]").forEach(function(el){
      setText(el, lang==="ur" ? el.getAttribute("data-ur") : el.getAttribute("data-en"));
    });
  }

  function applyLang(){
    applyChrome();
    if (mode === "parts") renderParts();
    else if (mode === "safe") renderSafe();
    else renderHabits();
    renderQuiz();
  }

  function next(){
    if (mode === "parts"){
      partsIdx = (partsIdx + 1) % PART_CH.length;
      partsMap = {}; partsSelected = null;
      renderParts();
    } else if (mode === "safe"){
      safeIdx = (safeIdx + 1) % SAFE.length;
      renderSafe();
    } else {
      habitsIdx = (habitsIdx + 1) % HABITS.length;
      renderHabits();
    }
    applyChrome();
  }

  function showHint(){
    var h;
    if (mode === "parts") h = PART_CH[partsIdx].hint;
    else if (mode === "safe") h = SAFE[safeIdx].hint;
    else h = HABITS[habitsIdx].hint;
    setText($("hintbox"), t(h));
    $("hintbox").classList.add("show");
  }

  function resetMode(){
    if (mode === "parts"){
      partsMap = {}; partsSelected = null;
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("parts-")===0 || k==="mode-parts") delete awarded[k]; });
      partsDone = {}; doneModes.parts = false;
      recountStars();
      renderParts();
    } else if (mode === "safe"){
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("safe-")===0 || k==="mode-safe") delete awarded[k]; });
      safeDone = {}; doneModes.safe = false;
      recountStars();
      renderSafe();
    } else {
      Object.keys(awarded).forEach(function(k){ if (k.indexOf("habits-")===0 || k==="mode-habits") delete awarded[k]; });
      habitsDone = {}; doneModes.habits = false;
      recountStars();
      renderHabits();
    }
    tabBadges();
  }

  function cleanSpeakText(s){
    return String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  function buildSpeakText(){
    var bits = [];
    bits.push(t(T.title));
    bits.push(cleanSpeakText(storyHtml()));
    bits.push(cleanSpeakText(($("headline") && $("headline").textContent) || ""));
    bits.push(cleanSpeakText(($("detail") && $("detail").textContent) || ""));
    bits.push(t(T.tip));
    return bits.filter(Boolean).join(". ");
  }
  function pickVoice(voices, want){
    var i, v, L;
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf(want) === 0) return v;
    }
    for (i=0;i<voices.length;i++){
      v = voices[i]; L = (v.lang || "").toLowerCase().replace("_","-");
      if (L.indexOf("en") === 0) return v;
    }
    return voices[0] || null;
  }
  var speakTimer = null;
  function setSpeaking(on){
    var btn = $("speakBtn");
    if (!btn) return;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.style.opacity = on ? "0.65" : "";
  }
  function doSpeak(text, asLang){
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92;
    u.lang = (asLang === "ur") ? "ur-PK" : "en-US";
    var voices = window.speechSynthesis.getVoices() || [];
    var voice = pickVoice(voices, asLang === "ur" ? "ur" : "en");
    if (voice) u.voice = voice;
    u.onstart = function(){ setSpeaking(true); };
    u.onend = function(){ setSpeaking(false); };
    u.onerror = function(){
      setSpeaking(false);
      if (asLang === "ur"){
        var fallback = cleanSpeakText(T.title.en + ". " + T.storyParts.en + ". " + T.tip.en);
        var u2 = new SpeechSynthesisUtterance(fallback);
        u2.lang = "en-US"; u2.rate = 0.92;
        var v2 = pickVoice(window.speechSynthesis.getVoices() || [], "en");
        if (v2) u2.voice = v2;
        u2.onstart = function(){ setSpeaking(true); };
        u2.onend = u2.onerror = function(){ setSpeaking(false); };
        window.speechSynthesis.speak(u2);
      }
    };
    window.speechSynthesis.speak(u);
  }
  if ("speechSynthesis" in window){
    try { window.speechSynthesis.getVoices(); } catch (e0) {}
    if (typeof window.speechSynthesis.addEventListener === "function"){
      window.speechSynthesis.addEventListener("voiceschanged", function(){
        try { window.speechSynthesis.getVoices(); } catch (e1) {}
      });
    }
  } else {
    var noBtn = $("speakBtn");
    if (noBtn){ noBtn.disabled = true; noBtn.title = "Voice not available on this device"; }
  }

  $("langBtn").addEventListener("click", function(){
    lang = (lang === "en") ? "ur" : "en";
    applyLang();
  });
  $("tabParts").addEventListener("click", function(){ setMode("parts"); });
  $("tabSafe").addEventListener("click", function(){ setMode("safe"); });
  $("tabHabits").addEventListener("click", function(){ setMode("habits"); });
  $("nextBtn").addEventListener("click", next);
  $("hintBtn").addEventListener("click", showHint);
  $("resetBtn").addEventListener("click", resetMode);
  $("newQuiz").addEventListener("click", function(){ pickQuiz(); renderQuiz(); });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      var text = buildSpeakText();
      if (!text) return;
      if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
      window.speechSynthesis.cancel();
      setSpeaking(false);
      var speakLang = lang;
      speakTimer = setTimeout(function(){
        speakTimer = null;
        doSpeak(text, speakLang);
      }, 80);
    }catch(e){ setSpeaking(false); }
  });

  pickQuiz();
  applyLang();
})();
</script>
</body>
</html>
