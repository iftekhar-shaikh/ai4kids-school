<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Janwar | AI4Kids Grade 1 Science</title>
<style>:root{--ink:#1e2a33;--muted:#56636c;--paper:#fffdf7;--line:#ded5c4;--blue:#176b87;--blue2:#e6f3f6;--orange:#e07a32;--green:#2e7d4f;--red:#c4453a;--yellow:#fff0bd;--purple:#7652a5;--teal:#0d8a7c;--pink:#d45b8c;--sky:#7ec8e3;--sand:#f4e4bc;--fs-cap:clamp(0.9rem, 2.4vw, 1.1rem);--fs-xs:clamp(1.1rem, 2.8vw, 1.3rem);--fs-sm:clamp(1.25rem, 3.2vw, 1.5rem);--fs-md:clamp(1.4rem, 3.6vw, 1.75rem);--fs-lg:clamp(1.7rem, 4.2vw, 2.15rem);--fs-xl:clamp(2.05rem, 5.2vw, 2.7rem);--pad:clamp(12px,3.5vw,20px);--gap:clamp(8px,2.5vw,12px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;max-width:100%;overflow-x:hidden}
body{margin:0;padding:0 0 48px;background:var(--paper);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:var(--fs-sm);line-height:1.5;max-width:100%;overflow-x:hidden;width:100%}
.wrap{width:100%;max-width:min(980px,100%);margin:auto;padding:0 var(--pad);box-sizing:border-box}
.bar{display:flex;align-items:center;gap:var(--gap);flex-wrap:wrap;padding:14px 0 6px;width:100%}
.brand{font-weight:900;color:var(--blue);margin-right:auto;font-size:var(--fs-cap);min-width:0;flex:1 1 auto}
button{font:inherit;color:inherit;cursor:pointer;max-width:100%}
.chip,.tab{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:8px 15px;min-height:44px;font-weight:900}
.chip[aria-pressed=true],.tab[aria-pressed=true]{background:var(--ink);color:#fff}
.chip:focus-visible,.tab:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
h1{font-size:var(--fs-xl);line-height:1.15;margin:10px 0 5px;word-wrap:break-word;overflow-wrap:anywhere}
.sub{color:var(--muted);margin:0 0 16px;font-size:var(--fs-sm)}
.tabs{display:flex;gap:var(--gap);flex-wrap:wrap;margin-bottom:16px;width:100%}
.tab{flex:1 1 calc(33.33% - 8px);border-radius:14px;min-height:48px;font-size:var(--fs-cap);min-width:0}
.hero{border:3px solid var(--ink);border-radius:clamp(14px,3vw,22px);overflow:hidden;background:linear-gradient(160deg,#d9f0fa 0%,#fff6df 55%,#e8f7e9 100%);margin-bottom:16px;box-shadow:0 6px 0 #c9d5c0;width:100%;max-width:100%}
.hero svg,.scene svg,.card .ico svg{display:block;width:100%;height:auto;max-width:100%}
.hero svg{max-height:50vh}
.demo-wrap{border:3px solid var(--ink);border-radius:clamp(14px,3vw,22px);background:linear-gradient(140deg,#e9f4fa,#f9efdb);padding:var(--pad);margin-bottom:20px;box-shadow:0 5px 0 #cfd8c8;width:100%;max-width:100%}
.demo-head{display:flex;gap:var(--gap);align-items:center;flex-wrap:wrap;width:100%}
.demo-head h2{font-size:var(--fs-lg);margin:0;flex:1 1 auto;min-width:0}
.demo-instruction{color:var(--muted);margin:5px 0 12px}
.demo-stage{background:#fffefb;border:2px solid var(--line);border-radius:17px;padding:clamp(10px,2.5vw,14px);width:100%;max-width:100%;overflow:hidden}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);width:100%}
.card{border:3px solid var(--line);background:#fff;border-radius:16px;min-height:96px;padding:12px 8px;text-align:center;font-weight:900;font-size:var(--fs-xs);transition:transform .12s ease,border-color .12s;width:100%;max-width:100%}
.card:active{transform:scale(.97)}
.card.selected{border-color:var(--blue);background:var(--blue2);box-shadow:0 0 0 3px rgba(23,107,135,.2)}
.card .ico{display:block;width:min(56px,18vw);height:auto;aspect-ratio:1;margin:0 auto 6px}
.play{background:var(--green);border:3px solid #236b45;color:#fff;border-radius:15px;padding:12px 18px;min-height:54px;font-weight:900;font-size:var(--fs-md);width:100%;margin-top:12px}
.play:active{transform:scale(.98)}
.demo-msg{border-radius:13px;background:var(--yellow);padding:12px 14px;margin-top:12px;font-weight:800;font-size:var(--fs-sm);border:2px solid #e6d48a;min-height:52px;word-wrap:break-word}
.lesson-grid{display:grid;gap:13px;grid-template-columns:1fr;width:100%}
.lesson{border:3px solid var(--line);border-radius:18px;background:#fff;padding:clamp(12px,3vw,18px);scroll-margin-top:10px;width:100%;max-width:100%}
.lesson .tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:4px 13px;font-size:var(--fs-cap);font-weight:900;margin-bottom:9px}
.lesson.hook .tag{background:var(--orange)}
.lesson.misaal .tag{background:var(--green)}
.lesson.karo .tag{background:var(--purple)}
.lesson p{margin:0;font-size:var(--fs-sm);overflow-wrap:anywhere}
.quiz{border-top:3px solid var(--ink);margin-top:30px;padding-top:20px;width:100%}
.quiz h2{font-size:var(--fs-lg);margin:0 0 17px}
.q{margin-bottom:26px}
.q-title{font-weight:900;margin:0 0 11px;font-size:var(--fs-md);overflow-wrap:anywhere}
.opt{display:block;width:100%;max-width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;margin:8px 0;min-height:55px;font-size:var(--fs-sm);overflow-wrap:anywhere}
.opt.right{border-color:var(--green);background:#e5f3eb;font-weight:900}
.opt.wrong{border-color:var(--red);background:#fae5e1}
.feedback{display:none;color:var(--muted);margin:7px 0;font-size:var(--fs-cap)}
.feedback.show{display:block}
.score{display:none;text-align:center;border:3px solid var(--green);background:#e5f3eb;border-radius:15px;padding:13px;font-size:var(--fs-md);font-weight:900;width:100%}
.score.show{display:block}
footer{margin-top:31px;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:var(--fs-cap)}
@media(max-width:480px){
  .chip,.tab,.play,.opt,.card{width:100%}
  .tabs{flex-direction:column}
  .tab{flex:1 1 auto;width:100%}
  .bar .chip{flex:1 1 auto;min-width:calc(50% - 6px);text-align:center}
  .demo-head{flex-direction:column;align-items:stretch}
  .demo-head .chip{width:100%}
  .cards{grid-template-columns:1fr 1fr}
  .cards.c5{grid-template-columns:1fr 1fr}
  .play{width:100%!important;min-width:0!important}
}
@media(min-width:760px){
  .lesson-grid{grid-template-columns:1fr 1fr}
  .demo-wrap{padding:20px}
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cards.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cards.c5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .play{width:auto;min-width:200px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}

/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.1rem, 3vw, 1.35rem);
  --fs-xs: clamp(1.35rem, 3.6vw, 1.6rem);
  --fs-sm: clamp(1.5rem, 4.2vw, 1.85rem);
  --fs-md: clamp(1.7rem, 4.8vw, 2.1rem);
  --fs-lg: clamp(2.05rem, 5.8vw, 2.7rem);
  --fs-xl: clamp(2.5rem, 7vw, 3.4rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

","ru":"Gaaye"},{"en":"Lion","ru":"Sher"},{"en":"Monkey","ru":"Bandar"},{"en":"Parrot","ru":"Tota"}],"a":0,"e":{"en":"A cow can give us milk.","ru":"A cow can give us milk."}},{"q":{"en":"How should we treat animals?","ru":"Janwaron ke saath kaisa sulook karna chahiye?"},"o":[{"en":"Kindly","ru":"Meharbani se"},{"en":"By hurting them","ru":"Unhein dukh de kar"},{"en":"By teasing","ru":"Unhein chirha kar"},{"en":"By throwing stones","ru":"Pathar maar kar"}],"a":0,"e":{"en":"Kindness keeps animals safe.","ru":"Kindness keeps animals safe."}},{"q":{"en":"Which is a wild animal?","ru":"Kaunsa jungli janwar hai?"},"o":[{"en":"Elephant","ru":"Hathi"},{"en":"Hen","ru":"Murgi"},{"en":"Goat","ru":"Bakri"},{"en":"Cat","ru":"Billi"}],"a":0,"e":{"en":"An elephant is a wild animal.","ru":"An elephant is a wild animal."}}],"subject":{"en":"AI4Kids · Grade 1 · Science","ru":"AI4Kids · Jamaat 1 · Science"},"grade_label":"AI4Kids Grade 1 Science"};

th=\"8\" height=\"10\" rx=\"2\" fill=\"#7652a5\"/><circle cx=\"32\" cy=\"7\" r=\"3\" fill=\"#e07a32\"/></svg>"};

  }
  s.appendChild(m);
  var accent=$('heroAccent');
  if(accent){accent.setAttribute('fill',['#7ec8e3','#e07a32','#7652a5','#2e7d4f','#d45b8c'][selected%5]);}
}
function quiz(){
  var box=$('quizBox');box.innerHTML='';$('score').className='score';
  var done=0,score=0;
  (D.quiz||[]).forEach(function(q,qi){
    var w=document.createElement('div');w.className='q';
    var p=document.createElement('p');p.className='q-title';p.textContent=(qi+1)+'. '+t(q.q);w.appendChild(p);
    var f=document.createElement('p');f.className='feedback';
    q.options.forEach(function(o,i){
      var b=document.createElement('button');b.type='button';b.className='opt';
      b.textContent=String.fromCharCode(65+i)+'. '+t(o);
      b.onclick=function(){
        if(w.dataset.done)return;w.dataset.done='1';done++;
        var ok=i===q.correct;if(ok)score++;
        w.querySelectorAll('button').forEach(function(x,j){
          x.disabled=true;
          if(j===q.correct)x.classList.add('right');
          else if(j===i)x.classList.add('wrong');
        });
        f.textContent=(ok?'✓ ':'✗ ')+t(q.explanation);f.className='feedback show';
        if(done===5){$('score').textContent=t({en:'Your score: '+score+' / 5',ru:'Tumhara score: '+score+' / 5'});$('score').className='score show'}
      };
      w.appendChild(b);
    });
    w.appendChild(f);box.appendChild(w);
  });
}
$('langBtn').onclick=function(){lang=lang==='en'?'ru':'en';selected=0;played=false;checked=false;render()};
$('speakBtn').onclick=function(){
  if('speechSynthesis'in window){
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t(D.title)+'. '+t(D.desc)+'. '+t(D.lesson.hook));
    u.lang=lang==='ru'?'en-PK':'en-US';u.rate=.92;speechSynthesis.speak(u);
  }
};
$('launch').onclick=function(){$('demo').scrollIntoView({behavior:'smooth'});demo()};
render();
})();
</script>
