<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Janwar | AI4Kids Grade 1 Science</title><style>:root{--ink:#202b36;--muted:#526170;--paper:#fffdf7;--line:#d8d1c3;--blue:#216a9b;--blue2:#dcecf6;--orange:#d4752c;--green:#2e8657;--red:#bb4b45;--yellow:#fff0bd;--purple:#79539a;--fs-cap:clamp(.95rem,2.5vw,1.1rem);--fs-sm:clamp(1.18rem,3.2vw,1.5rem);--fs-md:clamp(1.35rem,3.8vw,1.8rem);--fs-lg:clamp(1.6rem,4.5vw,2.25rem);--fs-xl:clamp(2rem,6vw,3rem)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--fs-sm);line-height:1.55;padding:0 0 50px}.wrap{max-width:1080px;margin:auto;padding:0 16px}.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:15px 0 8px}.brand{font-weight:800;color:var(--blue);margin-right:auto;font-size:var(--fs-cap)}button{font:inherit;color:inherit}.chip,.tab{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:8px 15px;cursor:pointer;font-weight:800;min-height:46px}.chip[aria-pressed=true],.tab[aria-pressed=true]{background:var(--ink);color:#fff}.chip:focus-visible,.tab:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}h1{font-size:var(--fs-xl);line-height:1.2;margin:10px 0 3px}.sub{color:var(--muted);margin:0 0 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{border-radius:14px;flex:1 1 16%;font-size:var(--fs-cap);min-height:53px}.demo-wrap{border:3px solid var(--ink);border-radius:22px;background:linear-gradient(140deg,#e9f4fa,#f9efdb);padding:16px;margin-bottom:20px;scroll-margin-top:10px}.demo-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.demo-head h2{font-size:var(--fs-lg);margin:0;flex:1}.demo-instruction{margin:5px 0 12px;color:var(--muted)}.play{background:var(--green);border:3px solid #236b45;color:#fff;border-radius:16px;padding:11px 18px;min-height:55px;cursor:pointer;font-weight:800;font-size:var(--fs-md);width:100%;margin-top:13px}.play:active{transform:scale(.98)}.demo-stage{background:#fffefb;border:2px solid var(--line);border-radius:17px;padding:13px}.demo-msg{border-radius:13px;background:var(--yellow);padding:11px 13px;margin:11px 0 0;font-weight:700}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:3px solid var(--line);background:#fff;border-radius:15px;min-height:100px;padding:11px 8px;cursor:pointer;text-align:center;font-weight:800}.card:hover,.card.selected{border-color:var(--blue);background:var(--blue2)}.emoji{display:block;font-size:2.35rem;line-height:1.1;margin-bottom:5px}.card small{display:block;font-size:var(--fs-cap);font-weight:600;color:var(--muted)}.lesson-grid{display:grid;gap:13px}.lesson{border:3px solid var(--line);border-radius:18px;background:#fff;padding:16px 18px;scroll-margin-top:12px}.lesson .tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:4px 14px;font-size:var(--fs-cap);font-weight:900;margin-bottom:9px}.lesson.hook .tag{background:var(--orange)}.lesson.misaal .tag{background:var(--green)}.lesson.karo .tag{background:var(--purple)}.lesson p{margin:0;font-size:var(--fs-sm)}.quiz{border-top:3px solid var(--ink);margin-top:30px;padding-top:21px;scroll-margin-top:12px}.quiz h2{font-size:var(--fs-lg);margin:0 0 18px}.q{margin-bottom:27px}.q-title{font-size:var(--fs-md);font-weight:800;margin:0 0 10px}.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;min-height:54px;font-size:var(--fs-sm)}.opt.right{border-color:var(--green);background:#e5f3eb;font-weight:800}.opt.wrong{border-color:var(--red);background:#fae5e1}.feedback{display:none;color:var(--muted);font-size:var(--fs-cap);margin:8px 0}.feedback.show{display:block}.score{display:none;text-align:center;border:3px solid var(--green);background:#e5f3eb;border-radius:15px;padding:13px;font-size:var(--fs-md);font-weight:900}.score.show{display:block}footer{margin-top:31px;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:var(--fs-cap)}@media(min-width:760px){.lesson-grid{grid-template-columns:1fr 1fr}.demo-wrap{padding:20px}.cards{grid-template-columns:repeat(4,1fr)}.play{width:auto;min-width:190px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><div class="wrap"><div class="bar"><span class="brand" id="brand"></span><button class="chip" id="langBtn" type="button" aria-pressed="false">Roman Urdu</button><button class="chip" id="speakBtn" type="button" aria-label="Read title aloud">🔊</button></div><header><h1 id="title"></h1><p class="sub" id="subtitle"></p></header><nav class="tabs" id="tabs" aria-label="Lesson sections"></nav><section class="demo-wrap" id="demo" aria-labelledby="demoTitle"><div class="demo-head"><h2 id="demoTitle"></h2><button class="chip" id="launch" type="button">Play demo</button></div><p class="demo-instruction" id="demoInstruction"></p><div class="demo-stage" id="demoStage"></div></section><main class="lesson-grid"><article class="lesson hook" id="hook"><span class="tag" id="hookTag"></span><p id="hookText"></p></article><article class="lesson samjhao" id="samjhao"><span class="tag" id="samjhaoTag"></span><p id="samjhaoText"></p></article><article class="lesson misaal" id="misaal"><span class="tag" id="misaalTag"></span><p id="misaalText"></p></article><article class="lesson karo" id="karo"><span class="tag" id="karoTag"></span><p id="karoText"></p></article></main><section class="quiz" id="quiz"><h2 id="quizHead"></h2><div id="quizBox"></div><div class="score" id="score"></div></section><footer id="foot"></footer></div><script>const DATA={"file":"g1-janwar.html","title":"Janwar","desc":{"en":"Learn about pets, farm animals, and wild animals.","ru":"Paltoo, khet ke aur jungli janwaron ke bare mein seekho."},"hook":{"en":"A cat may live with us, while a lion lives in the wild. Where do different animals live?","ru":"Aaj hum baat karenge janwaron ki! Kya aapne kabhi socha hai ke aapka paltoo kutta kis kisam ka janwar hai? Aur kya jungl mein rehne wale janwar aapke ghar aane ka soch bhi sakte hain?"},"samjhao":{"en":"Animals are living things. Pets can live with people. Farm animals help people. Wild animals live in nature. We must be kind and never hurt animals.","ru":"Janwar do qisam ke hote hain: Ghar ke janwar aur Junglee janwar. Ghar ke janwar woh hote hain jo hum apne ghar mein rakhte hain, jaise kutte, billi, aur parinday. Inko hum paal kar inke saath waqt guzarate hain. Yeh hamare dost hote hain aur hum inke khyaal rakhte hain. Junglee janwar woh hote hain jo zyada tar jungle ya khuli jagah par rehte hain. Ismein sher, hathi, aur bandar shamil hain. Yeh janwar azad hote hain aur apne natural habitats mein rehte hain. Inka khayal koi nahi rakhta aur yeh apne khud ke liye khana dhoondte hain. Ghar ke janwar aur junglee janwar mein ek aham farq yeh hai ke ghar ke janwar insano ke saath zindagi guzar rahe hote hain jabke junglee janwar apni zindagi khud guzarne ke liye zinda rehte hain. Hamara mulk Pakistan bhi alag-alag tarah ke janwaron se bhara hua hai. Aapko yahan lehrati hui genday, zinda khargosh aur jangalon mein chalte huye sher bhi milte hain. Har janwar ka apna ek ahem kirdar hai."},"misaal":{"en":"A cow can live on a farm and give milk. A lion needs its wild home and should not be a pet.","ru":"Sochiye, jab aap bazaar jaate hain, to aapko milti hain kitne saari chiriyan jo bazaar ke aas-paas udti rehti hain. Yeh chiriyan bazaar ke khane ki kisam kisam ki cheezon par aakar baith jati hain. Bazaar mein khana khareedte waqt aapne inhe dekha hoga, aur yeh bhi samjha hoga ke yeh bhi janwar hain jo hamare aas paas hain."},"karo":{"en":"Draw a safe home for a pet and a natural home for a wild animal. Add one animal to each.","ru":"Chalo, ab hum ek activity karte hain! Aap ghar par ya school mein ek \"Janwar Ka Karta\" banayein. Ek kaghaz lein aur uspe ghar ke janwaron jaise kutte aur billi aur junglee janwaron jaise sher aur hathi ki tasveerain banayen. Is tarah aapko yeh samajh aayega ke har janwar kis kisam ka hota hai aur kahan rehta hai."},"demo":{"type":"cards","title":{"en":"Where does it live?","ru":"Yeh kahan rehta hai?"},"instruction":{"en":"Choose an animal card to see its home.","ru":"Janwar ka card chuno aur us ka ghar dekho."},"items":[{"emoji":"🐱","name":{"en":"Cat","ru":"Billi"},"label":{"en":"Cat: often a home pet.","ru":"Billi: aksar ghar ki paltoo hoti hai."}},{"emoji":"🐶","name":{"en":"Dog","ru":"Kutta"},"label":{"en":"Dog: can be a home pet.","ru":"Kutta: ghar ka paltoo ho sakta hai."}},{"emoji":"🦁","name":{"en":"Lion","ru":"Sher"},"label":{"en":"Lion: a wild animal.","ru":"Sher: jungli janwar hai."}},{"emoji":"🐘","name":{"en":"Elephant","ru":"Hathi"},"label":{"en":"Elephant: lives in the wild.","ru":"Hathi: qudrati ilaqay mein rehta hai."}}]},"quiz":[{"q":{"en":"Which is usually a home pet?","ru":"Aam tor par ghar ka paltoo kaun hai?"},"o":[{"en":"Cat","ru":"Billi"},{"en":"Lion","ru":"Sher"},{"en":"Elephant","ru":"Hathi"},{"en":"Tiger","ru":"Baagh"}],"a":0,"e":{"en":"A cat can live with people as a pet.","ru":"A cat can live with people as a pet."}},{"q":{"en":"Where does a lion belong?","ru":"Sher kahan rehta hai?"},"o":[{"en":"Wild nature","ru":"Jungli qudrat"},{"en":"School bag","ru":"School bag"},{"en":"Fish bowl","ru":"Machhli ka bowl"},{"en":"Kitchen shelf","ru":"Kitchen ki shelf"}],"a":0,"e":{"en":"A lion is a wild animal.","ru":"A lion is a wild animal."}},{"q":{"en":"Which animal can give us milk?","ru":"Kaunsa janwar doodh de sakta hai?"},"o":[{"en":"Cow","ru":"Gaaye"},{"en":"Lion","ru":"Sher"},{"en":"Monkey","ru":"Bandar"},{"en":"Parrot","ru":"Tota"}],"a":0,"e":{"en":"A cow can give us milk.","ru":"A cow can give us milk."}},{"q":{"en":"How should we treat animals?","ru":"Janwaron ke saath kaisa sulook karna chahiye?"},"o":[{"en":"Kindly","ru":"Meharbani se"},{"en":"By hurting them","ru":"Unhein dukh de kar"},{"en":"By teasing","ru":"Unhein chirha kar"},{"en":"By throwing stones","ru":"Pathar maar kar"}],"a":0,"e":{"en":"Kindness keeps animals safe.","ru":"Kindness keeps animals safe."}},{"q":{"en":"Which is a wild animal?","ru":"Kaunsa jungli janwar hai?"},"o":[{"en":"Elephant","ru":"Hathi"},{"en":"Hen","ru":"Murgi"},{"en":"Goat","ru":"Bakri"},{"en":"Cat","ru":"Billi"}],"a":0,"e":{"en":"An elephant is a wild animal.","ru":"An elephant is a wild animal."}}]};
(function(){'use strict';var lang='en',selected=0,answered=0,score=0;
function $(id){return document.getElementById(id)}
function t(x){return x&&typeof x==='object'?(x[lang]||x.en||''):String(x||'')}
function put(el,x){if(!el)return;el.textContent=t(x);el.dir='ltr'}
function labels(){return {play:{en:'Play',ru:'Play'},hook:{en:'HOOK',ru:'HOOK'},samjhao:{en:'SAMJHAO',ru:'SAMJHAO'},misaal:{en:'MISAAL',ru:'MISAAL'},karo:{en:'KARO',ru:'KARO'}}}
function setCommon(){document.documentElement.lang=lang;document.title=t(DATA.title)+' | AI4Kids Grade 1 Science';put($('brand'),{en:'AI4Kids · Grade 1 · Science',ru:'AI4Kids · Jamaat 1 · Science'});put($('title'),DATA.title);put($('subtitle'),DATA.desc);put($('quizHead'),{en:'Quiz — 5 questions',ru:'Quiz — 5 sawaal'});put($('foot'),{en:'AI4Kids · Grade 1 Science · Offline lesson',ru:'AI4Kids · Jamaat 1 Science · Offline lesson'});$('langBtn').textContent=lang==='en'?'Roman Urdu':'English';$('langBtn').setAttribute('aria-pressed',lang==='ru');var L=labels();['hook','samjhao','misaal','karo'].forEach(function(k){put($(k+'Tag'),L[k]);put($(k+'Text'),DATA[k])});put($('demoTitle'),DATA.demo.title);put($('demoInstruction'),DATA.demo.instruction);put($('launch'),{en:'Play demo',ru:'Demo khelo'});renderTabs();renderDemo();renderQuiz()}
function renderTabs(){var box=$('tabs');box.innerHTML='';var L=labels();[['play',L.play],['hook',L.hook],['samjhao',L.samjhao],['misaal',L.misaal],['karo',L.karo]].forEach(function(x){var b=document.createElement('button');b.className='tab';b.type='button';b.textContent=t(x[1]);b.setAttribute('aria-pressed',x[0]==='play');b.onclick=function(){var target=x[0]==='play'?'demo':x[0];$(target).scrollIntoView({behavior:'smooth'})};box.appendChild(b)})}
function msg(en,ru){return {en:en,ru:ru}}
function baseMsg(stage,text){var p=document.createElement('div');p.className='demo-msg';put(p,text);stage.appendChild(p)}
function renderDemo(){var stage=$('demoStage');stage.innerHTML='';var row=document.createElement('div');row.className='cards';DATA.demo.items.forEach(function(it,i){var b=document.createElement('button');b.type='button';b.className='card'+(selected===i?' selected':'');var sp=document.createElement('span');sp.className='emoji';sp.textContent=it.emoji;b.appendChild(sp);b.appendChild(document.createTextNode(t(it.name)));b.onclick=function(){selected=i;renderDemo()};row.appendChild(b)});stage.appendChild(row);var play=document.createElement('button');play.type='button';play.className='play';play.textContent=lang==='en'?'▶ Play':'▶ Play karo';play.onclick=function(){baseMsg(stage,DATA.demo.items[selected].label)};stage.appendChild(play);baseMsg(stage,msg('Choose a card, then press Play.','Card chuno, phir Play dabao.'))}
function renderQuiz(){var box=$('quizBox');box.innerHTML='';answered=0;score=0;$('score').classList.remove('show');DATA.quiz.forEach(function(q,qi){var wrap=document.createElement('section');wrap.className='q';var title=document.createElement('p');title.className='q-title';title.textContent=(qi+1)+'. '+t(q.q);wrap.appendChild(title);q.o.forEach(function(op,oi){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+oi)+'. '+t(op);b.onclick=function(){if(wrap.dataset.done)return;wrap.dataset.done='1';answered++;var ok=oi===q.a;if(ok)score++;b.classList.add(ok?'right':'wrong');if(!ok)wrap.querySelectorAll('.opt').forEach(function(x,xi){if(xi===q.a)x.classList.add('right')});var fb=wrap.querySelector('.feedback');fb.textContent=(ok?'✓ ':'✗ ')+t(q.e);fb.classList.add('show');wrap.querySelectorAll('button').forEach(function(x){x.disabled=true});if(answered===DATA.quiz.length){$('score').textContent=t({en:'Your score: '+score+' / 5 — '+(score===5?'Excellent!':'Good practice!'),ru:'Tumhara score: '+score+' / 5 — '+(score===5?'Shabash!':'Achi practice!')});$('score').classList.add('show')}};wrap.appendChild(b)});var fb=document.createElement('p');fb.className='feedback';wrap.appendChild(fb);box.appendChild(wrap)})}
$('langBtn').onclick=function(){lang=lang==='en'?'ru':'en';selected=0;setCommon()};$('speakBtn').onclick=function(){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t(DATA.title)+' '+t(DATA.desc));u.lang=lang==='en'?'en-US':'en-PK';u.rate=.9;window.speechSynthesis.speak(u)};$('launch').onclick=function(){$('demo').scrollIntoView({behavior:'smooth'});renderDemo()};setCommon()})();</script></body></html>
