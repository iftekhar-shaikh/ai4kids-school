:var(--fs-cap)}

 kaunsi cheez voice command samajh sakti hai?"},[{"en":"A smart speaker","ru":"Smart speaker"},{"en":"A wall","ru":"Deewar"},{"en":"A rug only","ru":"Sirf dari"},{"en":"A spoon","ru":"Chamach"}],0,{"en":"A smart speaker has a microphone for voice commands.","ru":"Smart speaker mein voice commands ke liye microphone hota hai."}],[{"en":"Who should stay in control of a smart device?","ru":"Smart device ka control kis ke paas rehna chahiye?"},[{"en":"A responsible person","ru":"Zimmedar insan"},{"en":"The device alone","ru":"Sirf device"},{"en":"A toy","ru":"Khilona"},{"en":"Nobody","ru":"Kisi ke paas nahi"}],0,{"en":"People choose settings and check what devices do.","ru":"Log settings chuntay aur device ka kaam check kartay hain."}]]};
(function(){
