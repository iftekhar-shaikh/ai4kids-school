<head>
<meta charset="utf-8">

<title>IoT Basics — انٹرنیٹ سے جڑی چیزیں | AI4Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* AI4KIDS_FS_SCALE */
:root{
  --fs-cap: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xs: clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-sm: clamp(1.4rem, 3.9vw, 1.7rem);
  --fs-md: clamp(1.6rem, 4.5vw, 1.95rem);
  --fs-lg: clamp(1.9rem, 5.4vw, 2.45rem);
  --fs-xl: clamp(2.35rem, 6.5vw, 3.1rem);
}
body{font-size:var(--fs-md)!important;line-height:1.5!important;}
/* /AI4KIDS_FS_SCALE */

  :root{
    --board:#e9eef2;
    --board-deep:#d6dee6;
    --water:#2f7fbf;
    --water-deep:#1d5686;
    --tank:#b9c6d2;
    --wifi:#e0a32c;
    --dev:#3a6ea8;
    --safe:#2e7d4f;
    --risk:#c4453a;
    --ink:#1f2933;
    --ink-soft:#4a5661;
    --paper:#fdfaf3;
    --line:#ded5c4;
    --accent:#1d5686;

    --fs-cap:clamp(15px, 3.9vw, 16px);
    --fs-xs:clamp(16px, 4.2vw, 18px);
    --fs-sm:clamp(18px, 4.7vw, 19px);
    --fs-md:clamp(19px, 5.1vw, 21px);
    --fs-lg:clamp(22px, 5.9vw, 25px);
    --fs-xl:clamp(28px, 7.6vw, 34px);
    --lh:1.5;
  }
  /* Urdu is set larger than Latin — Nastaliq reads smaller at the same size. */
  body.urdu{
    --fs-cap:clamp(17px, 4.4vw, 18px);
    --fs-xs:clamp(18px, 4.7vw, 20px);
    --fs-sm:clamp(20px, 5.2vw, 22px);
    --fs-md:clamp(21px, 5.6vw, 23px);
    --fs-lg:clamp(24px, 6.4vw, 27px);
    --fs-xl:clamp(27px, 7.2vw, 32px);
    --lh:2.1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Baloo Bhaijaan 2",-apple-system,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);line-height:1.5;padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .bar{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
  .brand{font-weight:800;font-size:var(--fs-xs);color:var(--accent);margin-right:auto}
  .chip{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;
    font-size:var(--fs-xs);cursor:pointer;min-height:44px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip:focus-visible,button:focus-visible{outline:3px solid var(--wifi);outline-offset:2px}

  h1{font-size:var(--fs-xl);line-height:1.2;font-weight:800;margin:8px 0 4px}
  .sub{color:var(--ink-soft);font-size:var(--fs-sm);margin:0 0 14px}
  .ur{font-family:"Noto Nastaliq Urdu",serif;line-height:var(--lh)}
  h1.ur{line-height:1.9}

  .tabs{display:flex;gap:7px;margin:0 0 14px}
  .tabs button{
    flex:1;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:9px 6px;font:inherit;font-weight:800;
    font-size:var(--fs-cap);cursor:pointer;min-height:56px;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  .scene{
    position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);
  }
  .scene svg{display:block;width:100%;height:auto}
  #level{transition:y .35s linear,height .35s linear}
  .fullring{animation:ring .8s ease-in-out infinite}
  @keyframes ring{0%,100%{opacity:.45}50%{opacity:1}}
  .wave{opacity:0}
  .live .wave{animation:ping 1.5s ease-out infinite}
  .wave:nth-of-type(2){animation-delay:.5s}
  .wave:nth-of-type(3){animation-delay:1s}
  @keyframes ping{0%{opacity:0}25%{opacity:.9}100%{opacity:0}}

  .log{
    margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:10px 12px;
    background:#fffdf7;font-size:var(--fs-cap);line-height:1.8;min-height:58px;
  }
  .log .row{direction:ltr;font-weight:700;color:var(--ink-soft)}
  .log .row b{color:var(--accent)}
  .log .row.alert b{color:var(--risk)}

  .readout{
    margin-top:14px;background:var(--paper);
    border:3px solid var(--ink);border-radius:18px;padding:16px 18px;
  }
  .statechip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
             padding:4px 14px;font-size:var(--fs-cap);font-weight:700;margin-bottom:10px}
  .statechip.ur{padding:2px 14px 7px}
  .statechip.ok{background:var(--safe)} .statechip.bad{background:var(--risk)}
  .says{font-weight:800;font-size:var(--fs-lg);margin:0 0 6px;line-height:1.4}
  .says.ur{line-height:1.95}
  .detail{margin:0;color:var(--ink-soft);font-size:var(--fs-sm)}

  .hops{display:flex;gap:6px;margin-top:14px}
  .hop{
    flex:1;border:3px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;
    font-size:var(--fs-cap);font-weight:800;color:var(--ink-soft);transition:all .3s ease;
    line-height:1.25;
  }
  .hop.on{border-color:var(--dev);background:#e7eefa;color:var(--accent)}
  .hop.done{border-color:#9db6d4;background:#f0f4fa}

  .why-note{
    margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.55;
    border-left:3px solid var(--accent);padding-left:11px;
  }
  .why-note b{color:var(--accent);font-weight:800}
  body.urdu .why-note{
    border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:11px;
    line-height:var(--lh);
  }
  .warn{
    margin:12px 0 0;border:2px dashed var(--risk);border-radius:14px;padding:11px 13px;
    font-size:var(--fs-xs);color:var(--risk);font-weight:700;line-height:1.55;
  }
  body.urdu .warn{line-height:var(--lh)}

  .panel{margin-top:22px}
  .panel h2{font-size:var(--fs-sm);font-weight:600;margin:0 0 10px;color:var(--ink-soft)}
  .btns{display:flex;gap:9px;margin-bottom:12px}
  .btns button{
    flex:1;border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);
    font:inherit;font-weight:800;font-size:var(--fs-xs);cursor:pointer;min-height:56px;padding:0 12px;
  }
  .btns .go{background:var(--ink);color:var(--paper)}
  .btns button:disabled{opacity:.35;cursor:default}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opts button{
    border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 15px;
    font:inherit;font-size:var(--fs-sm);font-weight:700;color:var(--ink);cursor:pointer;
    min-height:56px;text-align:left;
  }
  .opts button .pw{direction:ltr;display:inline-block;font-weight:800}
  .opts button[aria-pressed="true"]{border-color:var(--ink);background:#f3f0e8}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .schip{
    border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;
    font:inherit;font-size:var(--fs-cap);font-weight:700;color:var(--ink);cursor:pointer;min-height:46px;
  }
  .schip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

  .quiz{margin-top:30px;border-top:3px solid var(--ink);padding-top:20px}
  .q{margin-bottom:26px}
  .q p{font-weight:600;margin:0 0 12px;font-size:var(--fs-md)}
  .q p.ur{font-weight:400}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:10px;
    border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:13px 16px;font:inherit;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);
    min-height:52px;
  }
  .opt.ur{text-align:right;line-height:var(--lh)}
  .opt:hover{border-color:var(--ink)}
  .opt.right{border-color:var(--safe);background:#e8f2ed;font-weight:600}
  .opt.wrong{border-color:var(--risk);background:#fbeae8}
  .fb{margin:10px 0 0;font-size:var(--fs-xs);color:var(--ink-soft);display:none}
  .fb.show{display:block}

  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
         font-size:var(--fs-xs);color:var(--ink-soft)}

  @media (min-width:820px){
    .wrap{
      max-width:1000px;display:grid;gap:0 32px;grid-template-columns:1fr 1fr;
      grid-template-areas:"bar bar" "head head" "tabs tabs" "left right" "quiz quiz" "foot foot";
      align-items:start;
    }
    .bar{grid-area:bar} .head{grid-area:head} .tabs{grid-area:tabs}
    .left{grid-area:left} .right{grid-area:right}
    .quiz{grid-area:quiz;margin-top:34px} footer{grid-area:foot}
    .panel{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){
    .live .wave,.fullring{animation:none;opacity:.8}
    *{transition-duration:.01ms !important}
  }

/* AI4KIDS_MOBILE_FLEX */
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; max-width: 100vw; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
button, .btn, .opt, [role=button] { min-height: 44px; min-width: 44px; }
@media (max-width: 480px) {
  main, .wrap, .container, .app { padding-left: 12px !important; padding-right: 12px !important; }
  button, .btn { width: 100%; }
}
/* /AI4KIDS_MOBILE_FLEX */
\n\1

  function isolate(s){ return s.replace(LATIN_RUN, function(m){ return LRI+m+PDI; }); }
  function setText(el,str){
    el.textContent=(lang==="ur") ? isolate(str) : str;

    el.setAttribute("dir", lang==="ur" ? "rtl":"ltr");

  function drawTank(){
    var svg=$("svg"); svg.innerHTML=""; svg.setAttribute("viewBox","0 0 300 230");
    svg.classList.toggle("live", smart);
    var g=mk("g",{}); svg.appendChild(g);
    // tank
    var TX=22, TY=34, TW=96, TH=130;
    g.appendChild(mk("rect",{x:TX,y:TY,width:TW,height:TH,rx:8,
                             fill:"#eef3f7",stroke:"var(--tank)","stroke-width":4}));
    var h=TH*level/100;
    g.appendChild(mk("rect",{id:"level",x:TX+4,y:TY+TH-h,width:TW-8,height:h,
                             fill:"var(--water)",opacity:.8}));
    if (level>=99.5){
      g.appendChild(mk("rect",{x:TX-4,y:TY-4,width:TW+8,height:TH+8,rx:11,
                               fill:"none",stroke:"var(--safe)","stroke-width":5,
                               "class":"fullring"}));
      var ft=mk("text",{x:TX+TW/2,y:TY-12,"text-anchor":"middle","font-size":"14",
                        "font-weight":"800",fill:"var(--safe)",
                        "font-family": lang==="ur" ? "Noto Nastaliq Urdu, serif"
                                                   : "Baloo Bhaijaan 2, sans-serif"});
      ft.textContent = lang==="ur" ? "بھر گئی" : "FULL";
      g.appendChild(ft);
    }
    for (var i=1;i<4;i++)
      g.appendChild(mk("line",{x1:TX,y1:TY+TH*i/4,x2:TX+10,y2:TY+TH*i/4,
                               stroke:"var(--tank)","stroke-width":2}));
    if (auto && smart){
      [[hiLim,"var(--risk)", lang==="ur" ? "بند" : "OFF"],
       [loLim,"var(--safe)", lang==="ur" ? "چالو" : "ON"]].forEach(function(L){
        var ly = TY+TH-TH*L[0]/100;
        g.appendChild(mk("line",{x1:TX-6,y1:ly,x2:TX+TW+6,y2:ly,stroke:L[1],
                                 "stroke-width":3,"stroke-dasharray":"6 4"}));
        var lt=mk("text",{x:TX+TW+10,y:ly+5,"font-size":"12","font-weight":"800",fill:L[1],
                          "font-family": lang==="ur" ? "Noto Nastaliq Urdu, serif"
                                                     : "Baloo Bhaijaan 2, sans-serif"});
        lt.textContent=L[2]+" "+L[0]+"%";
        g.appendChild(lt);
      });
    }
    var pc=mk("text",{x:TX+TW/2,y:TY+TH/2+7,"text-anchor":"middle","font-size":"22",
                      "font-weight":"800",fill:"var(--water-deep)",
                      "font-family":"Baloo Bhaijaan 2, sans-serif"});
    pc.textContent=Math.round(level)+"%"; g.appendChild(pc);
    // motor
    g.appendChild(mk("rect",{x:TX+18,y:TY+TH+14,width:58,height:30,rx:6,
                             fill: motor ? "var(--safe)" : "#a7b2bd",
                             stroke:"var(--ink)","stroke-width":2.5}));
    var mt=mk("text",{x:TX+47,y:TY+TH+34,"text-anchor":"middle","font-size":"13",
                      "font-weight":"800",fill:"#fff",
                      "font-family":"Baloo Bhaijaan 2, sans-serif"});
    mt.textContent = motor ? "ON" : "OFF"; g.appendChild(mt);
    // the little board and its waves
    if (smart){
      g.appendChild(mk("rect",{x:TX+TW+6,y:TY+18,width:26,height:20,rx:4,

        g.appendChild(mk("path",{d:"M"+(TX+TW+36+w*9)+" "+(TY+10+w*4)+

                                 fill:"none",stroke:"var(--wifi)","stroke-width":3,
                                 "class":"wave","stroke-linecap":"round"}));

                             fill:"#1f2933",stroke:"var(--ink)","stroke-width":2.5}));

      var pv=mk("text",{x:243,y:100,"text-anchor":"middle","font-size":"20","font-weight":"800",
                        fill:"var(--water-deep)","font-family":"Baloo Bhaijaan 2, sans-serif"});

                               fill: motor ? "var(--safe)" : "#c3ccd6"}));

  }

  function drawSafe(){
    var svg=$("svg"); svg.innerHTML=""; svg.setAttribute("viewBox","0 0 300 230");
    var g=mk("g",{}); svg.appendChild(g);
    var p = pw ? PWS.filter(function(x){return x.id===pw;})[0] : null;
    var strong = p && p.strong;
    g.appendChild(mk("rect",{x:96,y:66,width:108,height:104,rx:12,
                             fill:"#eef3f7",stroke:"var(--ink)","stroke-width":3}));
    g.appendChild(mk("rect",{x:126,y:34,width:48,height:44,rx:24,fill:"none",
                             stroke: p ? (strong ? "var(--safe)":"var(--risk)") : "#b9c6d2",
                             "stroke-width":7}));
    g.appendChild(mk("circle",{cx:150,cy:118,r:15,
                               fill: p ? (strong ? "var(--safe)":"var(--risk)") : "#b9c6d2"}));
    g.appendChild(mk("rect",{x:145,y:118,width:10,height:24,rx:4,
                             fill: p ? (strong ? "var(--safe)":"var(--risk)") : "#b9c6d2"}));
    if (p && !strong){
      var th=mk("text",{x:246,y:120,"text-anchor":"middle","font-size":"30",
                        "font-family":"Baloo Bhaijaan 2, sans-serif"});
      th.textContent="\uD83D\uDC64"; g.appendChild(th);
      g.appendChild(mk("path",{d:"M228 118 L206 118",stroke:"var(--risk)","stroke-width":4,
                               "stroke-linecap":"round"}));
      g.appendChild(mk("path",{d:"M214 110 L206 118 L214 126",fill:"none",
                               stroke:"var(--risk)","stroke-width":4,"stroke-linecap":"round",
                               "stroke-linejoin":"round"}));
    }
    if (p){
      var tx=mk("text",{x:150,y:196,"text-anchor":"middle","font-size":"15","font-weight":"800",
                        fill:"var(--ink)","font-family":"Baloo Bhaijaan 2, sans-serif"});
      tx.textContent=p.show; g.appendChild(tx);
    }
  }

  /* ---------- the tank ticking along ---------- */
  function startTank(){
    clearInterval(ticker);
    ticker=setInterval(function(){
      if (tab!=="tank") return;
      var before=level;
      if (holdFull > 0){ holdFull--; render(); return; }
      if (motor) level=Math.min(100, level+2.4);
      else level=Math.max(0, level-0.25);

      if (auto && smart){
        if (!motor && level<=loLim){
          motor=true;
          push("alert", "auto: level " + Math.round(level) + "% \u2264 " + loLim + "% \u2192 motor ON");
          holdFull=4;
        } else if (motor && level>=hiLim){
          motor=false;
          push("alert", "auto: level " + Math.round(level) + "% \u2265 " + hiLim + "% \u2192 motor OFF");
          holdFull=6;
        }
      } else if (motor && level>=99.9){
        motor=false; level=100; holdFull=10;
        push("alert", "tank \u2192 phone: FULL, motor off");
      }
      else if (Math.floor(before/10)!==Math.floor(level/10) && smart)
        push("", "tank \u2192 phone: level " + Math.round(level) + "%");
      render();
    }, 500);
  }
  function push(kind, text){
    log.unshift({kind:kind, text:text});
    if (log.length>4) log.pop();
  }

  /* ---------- render ---------- */
  function render(){
    ["Tank","Hops","Safe"].forEach(function(x){
      $("tab"+x).setAttribute("aria-pressed", tab===x.toLowerCase() ? "true":"false");
    });
    setText($("tabTank"), t(T.tabTank));
    setText($("tabHops"), t(T.tabHops));
    setText($("tabSafe"), t(T.tabSafe));
    $("whyLbl").textContent=t(T.whyLbl);
    setText($("quizHead"), t(T.quiz));
    var btns=$("btns"), opts=$("opts"), chips=$("chips"), hops=$("hops"), lg=$("log");
    btns.innerHTML=""; opts.innerHTML=""; chips.innerHTML=""; hops.innerHTML="";
    var chip=$("statechip"); chip.className="statechip";
    lg.style.display = (tab==="tank") ? "" : "none";
    hops.style.display = (tab==="hops") ? "" : "none";
    $("warn").style.display = (tab==="safe" && pw) ? "" : "none";

    if (tab==="tank"){
      drawTank();
      setText($("title"), t(T.titleTank));
      setText($("subtitle"), t(T.subTank));
      setText($("panelHead"), t(T.headTank));
      var fullish = level>=99.5, lowish = level<15;
      chip.className="statechip" + (fullish ? " ok" : (lowish ? " bad" : ""));
      setText(chip, fullish ? t(T.full) : (lowish ? t(T.low) : fill(t(T.lvl),{n:Math.round(level)})));
      setText($("says"), smart ? t(T.saysSmart) : t(T.saysDumb));
      setText($("detail"), smart ? t(T.detSmart) : t(T.detDumb));
      if (smart && auto){
        setText(chip, motor ? fill(t(T.autoFill),{hi:hiLim}) : fill(t(T.autoWait),{lo:loLim}));
        chip.className="statechip" + (motor ? " ok" : "");
      }
      setText($("whyText"), !smart ? t(T.whyDumb)
                          : (auto ? (motor ? t(T.whyAuto) : t(T.whyTwo))
                                  : (fullish ? t(T.whyFull) : t(T.whyTank))));
      lg.innerHTML="";
      if (smart && log.length) log.forEach(function(r){
        var d=document.createElement("div");
        d.className="row" + (r.kind==="alert" ? " alert":"");
        var b=document.createElement("b"); b.textContent=r.text;
        d.appendChild(b); lg.appendChild(d);
      });
      else {
        var d2=document.createElement("div"); d2.className="row";
        d2.textContent = smart ? "\u2026" : "\u2014";
        lg.appendChild(d2);
      }
      var ab=document.createElement("button"); ab.type="button"; ab.className="go";
      setText(ab, auto ? t(T.autoOn) : t(T.autoOff));
      ab.disabled = !smart;
      ab.addEventListener("click", function(){ auto=!auto; render(); });
      btns.appendChild(ab);

      if (!auto){
        var mb=document.createElement("button"); mb.type="button";
        setText(mb, motor ? t(T.motorOff) : t(T.motorOn));
        mb.disabled = !smart;
        mb.addEventListener("click", function(){
          motor=!motor;
          push("", "phone \u2192 tank: motor " + (motor?"ON":"OFF"));
          render();
        });
        btns.appendChild(mb);
      }

      if (auto && smart){
        [[t(T.loLbl), loLim, function(v){ loLim=Math.max(5, Math.min(hiLim-20, v)); }],
         [t(T.hiLbl), hiLim, function(v){ hiLim=Math.max(loLim+20, Math.min(100, v)); }]
        ].forEach(function(row){
          var r=document.createElement("div"); r.className="btns";
          var nm=document.createElement("div");
          nm.style.cssText="flex:2;display:flex;align-items:center;font-weight:700;font-size:var(--fs-cap)";
          nm.textContent=row[0]+"  "+row[1]+"%";
          nm.setAttribute("dir", lang==="ur"?"rtl":"ltr");
          var mn=document.createElement("button"); mn.type="button"; mn.textContent="\u2212";
          mn.addEventListener("click", function(){ row[2](row[1]-5); render(); });
          var pl=document.createElement("button"); pl.type="button"; pl.textContent="+";
          pl.addEventListener("click", function(){ row[2](row[1]+5); render(); });
          r.appendChild(nm); r.appendChild(mn); r.appendChild(pl);
          opts.appendChild(r);
        });
      }

      var sb=document.createElement("button"); sb.type="button"; sb.className="schip";
      setText(sb, smart ? t(T.smartOn) : t(T.smartOff));
      sb.addEventListener("click", function(){ smart=!smart; if(!smart){ log=[]; } render(); });
      chips.appendChild(sb);
      lastSpoken="";
      return;
    }

    if (tab==="hops"){
      drawHops();
      setText($("title"), t(T.titleHops));
      setText($("subtitle"), t(T.subHops));
      setText($("panelHead"), t(T.headHops));
      setText(chip, dir==="up" ? t(T.upward) : t(T.downward));
      setText($("says"), t(HOPS[hop]));
      setText($("detail"), t(HOPS[hop][dir]));
      setText($("whyText"), dir==="up" ? t(T.whyHopsUp) : t(T.whyHopsDown));
      HOPS.forEach(function(h,i){
        var d=document.createElement("div");
        d.className="hop" + (i===hop ? " on" : (dir==="up" ? (i<hop?" done":"") : (i>hop?" done":"")));
        d.textContent=t(h);
        d.setAttribute("dir", lang==="ur"?"rtl":"ltr");
        hops.appendChild(d);
      });
      var nb=document.createElement("button"); nb.type="button"; nb.className="go";
      setText(nb, t(T.next));
      nb.addEventListener("click", function(){
        hop = dir==="up" ? hop+1 : hop-1;
        if (hop>=HOPS.length){ hop=HOPS.length-1; dir="down"; }
        if (hop<0){ hop=0; dir="up"; }
        render();
      });
      var fb=document.createElement("button"); fb.type="button";
      setText(fb, dir==="up" ? t(T.flip) : t(T.flipUp));
      fb.addEventListener("click", function(){
        dir = dir==="up" ? "down" : "up";
        hop = dir==="up" ? 0 : HOPS.length-1;
        render();
      });
      btns.appendChild(fb); btns.appendChild(nb);
      lastSpoken="";
      return;
    }

    drawSafe();
    setText($("title"), t(T.titleSafe));
    setText($("subtitle"), t(T.subSafe));
    setText($("panelHead"), t(T.headSafe));
    var p = pw ? PWS.filter(function(x){return x.id===pw;})[0] : null;
    if (!p){
      setText(chip, t(T.headSafe)); setText($("says"), ""); setText($("detail"), "");
    } else {
      chip.className="statechip " + (p.strong ? "ok":"bad");
      setText(chip, t(p.time));
      setText($("says"), p.show);
      setText($("detail"), t(p.note));
      setText($("warn"), p.strong ? t(T.warnGood) : t(T.warnWeak));
    }
    setText($("whyText"), t(T.whySafe));
    PWS.forEach(function(x){
      var b=document.createElement("button"); b.type="button";
      b.setAttribute("aria-pressed", pw===x.id ? "true":"false");
      var sp=document.createElement("span"); sp.className="pw"; sp.textContent=x.show;
      b.appendChild(sp);
      b.addEventListener("click", function(){ pw=x.id; render(); });
      opts.appendChild(b);
    });
    lastSpoken="";
  }

  var lastSpoken="";

  ["Tank","Hops","Safe"].forEach(function(x){
    $("tab"+x).addEventListener("click", function(){
      var m=x.toLowerCase();
      if (tab===m) return;
      tab=m; render();
    });
  });

  /* ---------- quiz ---------- */
  function buildQuiz(){
    var box=$("quizBox"); box.innerHTML="";
    QUIZ.forEach(function(item){
      var wrap=document.createElement("div"); wrap.className="q";
      var q=document.createElement("p"); setText(q,t(item.q)); wrap.appendChild(q);
      var fb=document.createElement("p"); fb.className="fb";
      item.o.forEach(function(opt,oi){
        var b=document.createElement("button"); b.type="button";
        b.className="opt" + (lang==="ur" ? " ur":"");
        b.setAttribute("dir", lang==="ur" ? "rtl":"ltr");
        b.textContent=t(opt);
        b.addEventListener("click", function(){
          if (wrap.getAttribute("data-done")==="1") return;
          wrap.setAttribute("data-done","1");
          Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function(x,xi){
            if (xi===item.a) x.classList.add("right");
            else if (xi===oi) x.classList.add("wrong");
          });
          setText(fb,t(item.f)); fb.classList.add("show","fb");
        });
        wrap.appendChild(b);
      });
      wrap.appendChild(fb); box.appendChild(wrap);
    });
  }

  function applyLang(){
    document.body.classList.toggle("urdu", lang==="ur");
    var lb=$("langBtn");
    lb.textContent=(lang==="en") ? "اردو":"English";
    lb.setAttribute("aria-pressed", lang==="ur" ? "true":"false");
    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function(el){
      setText(el, el.getAttribute(lang==="en" ? "data-en":"data-ur"));
    });
    buildQuiz(); render();
  }
  $("langBtn").addEventListener("click", function(){
    lang=(lang==="en") ? "ur":"en"; applyLang();
  });
  $("speakBtn").addEventListener("click", function(){
    try{
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance($("says").textContent);
      var __v=window.ai4kidsPickVoice&&ai4kidsPickVoice();if(__v){u.voice=__v;u.lang=((__v.lang||'').toLowerCase().indexOf('ur')===0)?'ur-PK':'hi-IN';}else{u.lang='hi-IN';}u.rate=.82;
      window.speechSynthesis.speak(u);
    }catch(e){ /* no voice available — stay quiet */ }
  });

  applyLang();
  startTank();
})();
</script>
<script>
/* AI4KIDS_TTS */
(function(){
  if (window.ai4kidsSpeak) return;
  function clean(s){
    if(!s) return '';
    var out=String(s);
    out=out.replace(/^#+\s*/gm,'');
    out=out.replace(/^[-*]\s+/gm,'');
    out=out.replace(/\*\*?/g,'');
    out=out.replace(/`+/g,'');
    out=out.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
    out=out.replace(/https?:\/\/\S+/g,' ');
    out=out.replace(/\bAI\b/g,'A I');
    out=out.replace(/\b3D\b/g,'three D');
    out=out.replace(/\bHOOK\b/gi,'Shuru. ');
    out=out.replace(/\bSHURU\b/gi,'Shuru. ');
    out=out.replace(/\bSAMJHAO\b/gi,'Samjhao. ');
    out=out.replace(/\bMISAAL\b/gi,'Misaal. ');
    out=out.replace(/\bKARO\b/gi,'Karo. ');
    out=out.replace(/\bSAWAAL\b/gi,'Sawaal. ');
    out=out.replace(/\n+/g,'. ');
    out=out.replace(/\s+/g,' ').trim();
    return out;
  }
  function pickVoice(){
    var voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var best=null, bestS=-1;
    for (var i=0;i<voices.length;i++){
      var v=voices[i];
      var n=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      var s=0;
      if (n.indexOf('ur-pk')>=0 || n.indexOf('ur_pk')>=0) s+=100;
      if (n.indexOf('urdu')>=0) s+=90;
      if (n.indexOf('ur-')===0) s+=85;
      if (n.indexOf('hi-in')>=0 || n.indexOf('hindi')>=0) s+=70;
      if (n.indexOf('google')>=0 && (n.indexOf('hindi')>=0 || n.indexOf('urdu')>=0)) s+=20;
      if (n.indexOf('female')>=0 || n.indexOf('neural')>=0 || n.indexOf('natural')>=0) s+=5;
      if (s>bestS){ bestS=s; best=v; }
    }
    return best;
  }
  window.ai4kidsCleanSpeech=clean;
  window.ai4kidsPickVoice=pickVoice;
  window.ai4kidsSpeak=function(text){
    if (!('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); } catch(e) {}
    var u=new SpeechSynthesisUtterance(clean(text));
    var v=pickVoice();
    if (v) {
      u.voice=v;
      var L=(v.lang||'').toLowerCase();
      u.lang = L.indexOf('ur')===0 ? 'ur-PK' : 'hi-IN';
    } else {
      u.lang='hi-IN';
    }
    u.rate=0.82; u.pitch=1.0;
    speechSynthesis.speak(u);
  };
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); } catch(e) {}
    speechSynthesis.onvoiceschanged=function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }
})();
/* /AI4KIDS_TTS */
</script>
